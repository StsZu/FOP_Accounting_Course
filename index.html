, "Не переказуйте ситуацію — сформулюйте висновок, який ви сказали б клієнту."], "reasoning_aspects": [{"label": "Надходження й дохід", "terms": ["дохід", "надходж", "виручк", "оплат"]}, {"label": "Власні кошти й особистий рахунок", "terms": ["власн", "поповнен", "особист", "картк"]}, {"label": "Зобов’язання всередині залишку", "terms": ["аванс", "зобов", "поверн", "борг"]}, {"label": "Податкова частина залишку", "terms": ["податк", "сплат", "бюджет"]}, {"label": "Час і період", "terms": ["дат", "період", "місяц", "касов"]}], "reasoning_model": "Залишок на рахунку показує лише те, скільки грошей лежить на ньому на одну конкретну дату. Усередині цієї суми можуть бути власні поповнення Ігоря, аванс клієнта за ще не виконану роботу, помилково зараховані чужі кошти й несплачені зобов’язання періоду. Водночас поза цим рахунком залишилася оплата, яку Ігор прийняв на особисту картку, і робота, за яку йому ще не заплатили. Тому результат місяця визначають класифікацією кожної операції та підрахунком зобов’язань, а не поглядом на залишок; знімати кошти можна лише після цього."}, "checklist": {"title": "Місячна фінансова самоперевірка ФОП", "instructions": "Пройдіть перевірку так, як її робить бухгалтер наприкінці місяця. Для кожного пункту виберіть обґрунтований статус і напишіть, чим він підтверджений або чого бракує.", "how_to": ["Тримайте перед очима результат Практики: чекліст перевіряє саме той спосіб мислення.", "Ідіть зверху вниз і для кожного пункту виберіть статус: підтверджено, потрібні дані або не застосовується.", "У полі праворуч напишіть, чим статус підтверджено або що саме треба отримати — щонайменше 10 символів.", "Якщо незрозуміло, що саме перевіряти, натисніть «Підказка» біля пункту: вона каже, де шукати, але не диктує статус.", "Критичні пункти зі знаком «!» не можна закрити як «не застосовується».", "Стежте за поясненням під пунктом: воно живцем показує, чого ще бракує."], "note_min_chars": 10, "statuses": [{"value": "", "label": "Не перевірено"}, {"value": "confirmed", "label": "Підтверджено"}, {"value": "needs_data", "label": "Потрібні дані"}, {"value": "na", "label": "Не застосовується", "blocks_critical": true}], "items": [{"id": "balance_check", "group": "Гроші й залишок", "text": "Залишок на кінець періоду звірено з випискою, а не з пам’яті", "critical": true, "hint": "Порівняйте вхідний залишок, суму надходжень і списань та вихідний залишок. Якщо вони не сходяться, спершу шукайте пропущену операцію.", "why": "Незбіжність залишку — найдешевший сигнал про пропущену або задвоєну операцію; далі його вже нічим не спіймати."}, {"id": "balance_not_profit", "group": "Гроші й залишок", "text": "Залишок на рахунку не використано як оцінку прибутку", "critical": true, "hint": "Запитайте себе, які ще зобов’язання лежать на цьому залишку: податки, аванси клієнтів, неоплачені рахунки постачальників.", "why": "Рішення «зняти все, що є на рахунку» ухвалюють саме тоді, коли залишок сплутали з прибутком."}, {"id": "income_dated", "group": "Класифікація надходжень", "text": "Для кожного надходження, визнаного доходом, зафіксовано дату його отримання", "critical": true, "hint": "Дата тут — не дата підписання акта й не дата рахунку. Подивіться, яку дату показує саме виписка.", "why": "Період, у якому дохід врахований, визначає звітність; помилка в даті переносить суму в чужий період."}, {"id": "not_income_marked", "group": "Класифікація надходжень", "text": "Надходження, які доходом не є, виділено окремо із зазначенням причини", "critical": true, "hint": "Перевірте, чи в кожного такого надходження написана причина, а не просто позначка «не дохід».", "why": "Причина — це те, що ви покажете під час перевірки; позначка без причини не доводить нічого."}, {"id": "mistaken_payments", "group": "Класифікація надходжень", "text": "Помилкові зарахування виявлено, і по кожному видно, що з ним зроблено", "critical": true, "hint": "Шукайте пари операцій: надходження й зустрічне списання. Одиноке надходження без пари — привід поставити «потрібні дані».", "why": "Помилкове зарахування, яке залишилося на рахунку без рішення, з часом перестає відрізнятися від звичайної виручки."}, {"id": "advances", "group": "Класифікація надходжень", "text": "Аванси й передоплати позначено, а їх повернення відстежено", "critical": true, "hint": "Перегляньте призначення платежів зі словами «аванс», «передоплата», «завдаток» і перевірте, чи є за ними виконання або повернення.", "why": "Аванс — це одночасно гроші на рахунку й зобов’язання перед клієнтом; без позначки видно лише перше."}, {"id": "own_funds", "group": "Особисте й підприємницьке", "text": "Поповнення власними коштами відокремлено від виручки", "critical": true, "hint": "Перевірте надходження від самого підприємця: у виписці вони виглядають так само, як оплата клієнта, і різницю дає лише призначення платежу.", "why": "Власні кошти, пораховані як виручка, завищують дохід і призводять до сплати податку з власних грошей."}, {"id": "internal_transfers", "group": "Особисте й підприємницьке", "text": "Перекази між власними рахунками не пораховано двічі", "critical": true, "hint": "Якщо рахунків більше одного, порівняйте виписки між собою: одна й та сама сума має піти з одного рахунку й прийти на інший.", "why": "Переказ між власними рахунками не створює нових грошей, але в двох випадках підряд виглядає як два надходження."}, {"id": "personal_account", "group": "Особисте й підприємницьке", "text": "Перевірено, чи не приймалась оплата від клієнтів на особистий рахунок", "critical": true, "hint": "Питання не «чи є така оплата», а «чи ви це перевіряли». Неперевірене — це «потрібні дані», а не «підтверджено».", "why": "Оплата, що прийшла повз підприємницький рахунок, не потрапляє в облік автоматично й виявляється найпізніше."}, {"id": "receivables", "group": "Заборгованість", "text": "Складено перелік виконаних робіт без оплати", "critical": false, "hint": "Ці суми у виписці відсутні за визначенням — шукайте їх у підписаних актах і виставлених рахунках.", "why": "Робота без оплати не видно в русі коштів, тому про неї згадують лише тоді, коли термін уже минув."}, {"id": "payables", "group": "Заборгованість", "text": "Складено перелік власних невиконаних зобов’язань за отриманими коштами", "critical": false, "hint": "Перегляньте отримані аванси й неоплачені рахунки постачальників: це те, що ви ще винні грошима або роботою.", "why": "Без цього переліку залишок на рахунку виглядає вільним, хоча частина його вже комусь належить."}, {"id": "no_guess", "group": "Контроль якості", "text": "Незрозумілі надходження не класифіковано навмання", "critical": true, "hint": "Перегляньте свою роботу з Практики: чи немає там класифікації, поставленої «за логікою», без документа або запиту клієнту.", "why": "Одна вгадана класифікація знецінює весь реєстр: його більше не можна показати як перевірений."}, {"id": "handoff", "group": "Контроль якості", "text": "Питання поза межами класифікації передано бухгалтеру або юристу", "critical": false, "hint": "Згадайте, чи траплялися операції, щодо яких ви не маєте права вирішувати самостійно, і чи передали ви їх далі.", "why": "Вчасно передане питання — професійна межа, а не слабкість; невчасно передане стає чужою проблемою на перевірці."}]}, "glossary": [{"term": "Дохід", "definition": "Надходження, отримані від провадження підприємницької діяльності протягом звітного періоду.", "example": "Оплата клієнта за виконану консультацію є доходом на дату її надходження.", "avoid": "«усе, що прийшло на рахунок» — частина надходжень доходом не є"}, {"term": "Витрати", "definition": "Кошти, віддані за ресурси, потрібні для діяльності: оренду, матеріали, послуги, комісії.", "example": "Оренда робочого місця за місяць — витрата діяльності.", "avoid": "«будь-яке списання з рахунку» — переказ грошей собі витратою не є"}, {"term": "Прибуток", "definition": "Різниця між доходом і витратами за період; показує результат роботи, а не наявні гроші.", "example": "Прибуток може бути додатним у місяці, коли на рахунку майже порожньо.", "avoid": "«залишок на рахунку» — це два різні числа"}, {"term": "Залишок коштів", "definition": "Сума грошей на рахунку на конкретну дату.", "example": "Залишок 76 600 грн на 31.10 нічого не каже про результат жовтня.", "avoid": "«мій прибуток», «вільні гроші» — частина залишку може бути вже комусь винна"}, {"term": "Касовий метод", "definition": "Спосіб визнання доходу за датою фактичного надходження коштів.", "example": "Акт підписано в листопаді, кошти надійшли в жовтні — дохід виникає в жовтні.", "avoid": "«дохід за датою акта» або «за датою рахунку» — це інший підхід"}, {"term": "Аванс", "definition": "Кошти, отримані до виконання роботи або постачання товару.", "example": "Аванс збільшує гроші на рахунку і одночасно створює зобов’язання перед клієнтом.", "avoid": "«уже зароблене» — робота ще не виконана"}, {"term": "Дебіторська заборгованість", "definition": "Сума, яку винні вам: робота виконана або товар відвантажено, а оплати ще немає.", "example": "Підписаний акт без оплати — дебіторська заборгованість, а не дохід періоду.", "avoid": "«вважай, що гроші вже мої» — у виписці цієї суми немає"}, {"term": "Кредиторська заборгованість", "definition": "Сума, яку винні ви: отриманий аванс, неоплачений рахунок постачальника.", "example": "Отриманий аванс за листопадову роботу — ваша кредиторська заборгованість.", "avoid": "«це не мої гроші, тому забудь» — вона впливає на те, чим можна розпоряджатися"}, {"term": "Помилково зараховані кошти", "definition": "Кошти, зараховані отримувачу без достатньої правової підстави.", "example": "Платіж від невідомого контрагента з проханням повернути — не виручка.", "avoid": "«помилковий платіж» як універсальний термін — у законі помилкова платіжна операція означає вужче, помилку надавача платіжних послуг"}, {"term": "Власні кошти підприємця", "definition": "Гроші тієї самої фізичної особи, внесені нею на підприємницький рахунок.", "example": "Поповнення рахунку на 25 000 грн самою підприємицею не є оплатою від клієнта.", "avoid": "«інвестиція в бізнес», «виручка» — платник і отримувач тут одна особа"}]}}, {"index": 3, "id": "module-03", "level": 1, "slug": "module_03_podatkovi_systemy", "meta": {"schema": "course-module/v1", "id": "module-03", "level": 1, "title": "Податкові системи", "language": "uk", "version": "0.1.0", "status": "app_ready", "summary": "Навчіться відрізняти загальну систему від спрощеної, перевіряти обмеження груп єдиного податку й читати власний податковий статус за джерелом, а не за памʼяттю.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "pending", "last_verified": "2026-08-25", "next_review": "2026-11-01", "depends_on": ["module-01", "module-02"], "estimated_minutes": 65, "source_ids": ["SRC-025", "SRC-026", "SRC-027", "SRC-028", "SRC-029", "SRC-030", "SRC-031", "SRC-032", "SRC-033", "SRC-034", "SRC-035", "SRC-036", "SRC-037", "SRC-038"], "outcomes": ["Пояснити різницю між загальною і спрощеною системами через обʼєкт оподаткування", "Визначити, які обмеження групи єдиного податку стосуються конкретної діяльності", "Назвати події, які припиняють право перебувати на спрощеній системі", "Пояснити, коли виникає обовʼязок зареєструватися платником ПДВ", "Перевірити податковий статус за офіційним джерелом, а не за словами"], "primary_source": {"id": "SRC-025", "note": "Стаття 291 Податкового кодексу — прочитайте пункти 291.4 і 291.5 самостійно: критерії груп і перелік заборон коротші, ніж здається, і саме їх найчастіше переказують неправильно."}, "sessions": [{"title": "Сесія 1 · Дві системи й три групи", "minutes": 25, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Перевірка допустимості", "minutes": 25, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Втрата права й перевірка статусу", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви зможете самі перевірити, чи все ще маєте право на свою групу, і не дізнаватися про втрату права з акта перевірки.", "accountant": "Ви працюєте з клієнтами: це основа приймання — перевірка допустимості системи за обмеженнями, а не за словами клієнта «я на третій групі».", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете поставити питання, чому обрано саме цю систему, і перевірити відповідь за реєстром."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Податкові системи\n\n## Мета\n\nНавчитися свідомо перевіряти систему оподаткування: чим загальна система відрізняється від спрощеної, які обмеження несе кожна група єдиного податку, що припиняє право на спрощену систему і як побачити власний статус в офіційному джерелі, а не в памʼяті.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. пояснити різницю між загальною і спрощеною системами через обʼєкт оподаткування;\n2. визначити, які обмеження групи стосуються конкретної діяльності;\n3. назвати події, які припиняють право перебувати на спрощеній системі;\n4. пояснити, коли виникає обовʼязок зареєструватися платником ПДВ;\n5. перевірити податковий статус за офіційним джерелом.\n\n## Передумови\n\nМодулі 1 і 2. Особливо знадобиться поняття доходу з модуля 2: уся спрощена система рахується від нього.\n\n## Основні терміни\n\n- **Загальна система** — оподаткування доходів ФОП за розділом IV Податкового кодексу.\n- **Спрощена система** — заміна сплати переліку податків на єдиний податок.\n- **Група єдиного податку** — набір критеріїв, від яких залежать ставка й обмеження.\n- **Обсяг доходу** — сума доходу за календарний рік, з якою порівнюють ліміт групи.\n- **Підвищена ставка** — 15% до доходу, отриманого з порушенням умов спрощеної системи.\n- **Реєстр платників єдиного податку** — офіційне джерело даних про групу, ставку й дату обрання.\n\n## Теоретичний матеріал\n\n### 1. Дві системи відрізняються тим, від чого рахують податок\n\nЦе головна відмінність, з якої випливає все інше.\n\n| | Загальна система | Спрощена система |\n|---|---|---|\n| Обʼєкт | чистий оподатковуваний дохід: виручка мінус документально підтверджені витрати [SRC-034] | дохід, тобто надходження, без вирахування витрат [SRC-025] |\n| Витрати | зменшують базу, якщо є документи [SRC-034] | на суму податку не впливають |\n| Ставка | 18% податку на доходи фізичних осіб [SRC-034] | залежить від групи [SRC-030] |\n| Обмеження діяльності | у Кодексі немає | закритий перелік заборон [SRC-025] |\n| Ліміт доходу | немає | є для кожної групи [SRC-025] |\n\nПрактичний наслідок: підприємцеві з великими підтвердженими витратами загальна система може бути вигіднішою, а тому, у кого витрат майже немає, — навпаки. Але вибір не зводиться до арифметики: спрощена система має обмеження, які або дозволяють на ній працювати, або ні.\n\n> [!PRINCIPLE]\n> Спочатку перевіряють **допустимість**, і лише потім рахують вигоду. Порахувати вигоду системи, на яку ви не маєте права, — змарнований час.\n\n### 2. Спрощена система — це право, а не стан за замовчуванням\n\nФізична особа-підприємець може обрати спрощену систему, якщо відповідає вимогам і **зареєструється** платником єдиного податку. [SRC-025] Поки такої реєстрації немає, ФОП перебуває на загальній системі — навіть якщо він «планував бути на спрощеній».\n\nСпрощена система замінює сплату переліку податків на єдиний податок. [SRC-025] Перелік замін закритий: звільнення стосується податку на доходи фізичних осіб у частині доходів від господарської діяльності, ПДВ з операцій, місце постачання яких на митній території України, і земельного податку за ділянки, що використовуються в діяльності. [SRC-032] Усе інше сплачується на загальних підставах. [SRC-032]\n\n> [!RISK]\n> «Єдинник не платить нічого, крім єдиного податку» — неправда. Він залишається податковим агентом щодо виплат фізичним особам, платить ПДВ при ввезенні товарів і не звільнений від земельного податку, якщо здає нерухомість в оренду. [SRC-032]\n\n### 3. Три групи: критерії\n\nКритерії групи — це **сукупність**, а не список на вибір. Не відповідаєте хоча б одному — група вам не підходить.\n\n| | Перша група | Друга група | Третя група |\n|---|---|---|---|\n| Наймані працівники | не використовує працю найманих осіб | одночасно не більше 10 осіб | кількість не обмежена |\n| Дозволена діяльність | виключно роздрібний продаж з торговельних місць на ринках та побутові послуги населенню | послуги платникам єдиного податку та населенню, виробництво і продаж товарів, ресторанне господарство | без переліку в самій нормі |\n| Ліміт доходу за календарний рік | 167 розмірів мінімальної заробітної плати | 834 розміри | 1167 розмірів |\n\nДжерело всіх трьох рядків — пункт 291.4. [SRC-025]\n\nТри місця, де найчастіше помиляються:\n\n- **«Одночасно не більше 10 осіб»** для другої групи — це моментний показник, а не «10 за рік». [SRC-025] При підрахунку не враховують працівників у відпустці у звʼязку з вагітністю і пологами, у відпустці по догляду за дитиною та призваних на військову службу під час мобілізації. [SRC-025]\n- **Обмеження контрагентів другої групи стосується послуг.** Послуги — лише платникам єдиного податку та населенню; виробництво, продаж товарів і ресторанне господарство таким колом не обмежені. [SRC-025]\n- **Посередництво з нерухомістю, доступ до Інтернету та ювелірні вироби** не заборонені взагалі — вони виключені лише з другої групи й належать виключно до третьої. [SRC-025]\n\n> [!REMEMBER]\n> Друга група не може надавати **послуги** підприємству на загальній системі. Продати йому товар — може.\n\n### 4. Хто не може бути на спрощеній системі взагалі\n\nПерелік закритий і має дві природи: заборонені **види діяльності** й заборонені **характеристики особи**. [SRC-025]\n\nВиди діяльності: азартні ігри й лотереї; обмін іноземної валюти; виробництво, експорт, імпорт і продаж підакцизних товарів із двома винятками; видобуток і реалізація дорогоцінних металів та каміння; видобуток і реалізація корисних копалин, крім місцевого значення; фінансове посередництво з винятками для страхових агентів; управління підприємствами; послуги пошти, крім курʼєрської, і низка телекомунікаційних послуг; продаж предметів мистецтва та антикваріату; організація гастрольних заходів; охоронна діяльність. [SRC-025] Окремо — технічні випробування й дослідження та діяльність у сфері аудиту. [SRC-025]\n\nХарактеристики особи: оренда земельних ділянок понад 0,2 гектара, житлових приміщень понад 400 квадратних метрів або нежитлових понад 900 квадратних метрів; фінансові установи; нерезиденти; наявність податкового боргу на день подання заяви. [SRC-025]\n\nДві деталі, які легко пропустити:\n\n- **Охоронна діяльність** потрапила до переліку заборонених лише **з 1 січня 2026 року**. [SRC-027] Твердження про неї без дати робить неправильним будь-який приклад про попередні роки.\n- **Обмеження оренди рахують за загальною площею**, а не за одним обʼєктом. [SRC-025]\n\n> [!INFO]\n> Ювелір може працювати на спрощеній системі: заборона на дорогоцінні метали прямо виключає виробництво й продаж ювелірних виробів. Але лише в третій групі й лише за ставкою 5%. [SRC-025] [SRC-030]\n\n### 5. Числа: формула в законі, сума — на дату\n\nЛіміти й фіксовані ставки в Кодексі задані **формулою**, а не сумою. Прив'язка — до величини, встановленої законом **на 1 січня** податкового року. [SRC-025] [SRC-030] Підвищення мінімальної зарплати всередині року ліміт цього року не змінює.\n\nНа 1 січня 2026 року закон про Державний бюджет установив мінімальну заробітну плату 8647 гривень і прожитковий мінімум для працездатних осіб 3328 гривень. [SRC-026]\n\nПриклад розрахунку **станом на 2026 рік**:\n\n| Група | Формула ліміту | Ліміт доходу за 2026 рік |\n|---|---|---|\n| Перша | 167 × мінімальна заробітна плата | 1 444 049 грн |\n| Друга | 834 × мінімальна заробітна плата | 7 211 598 грн |\n| Третя | 1167 × мінімальна заробітна плата | 10 091 049 грн |\n\nЦе **обчислення за двома нормами**, а не цитата з закону. Перед рішенням перевірте чинну величину: вона змінюється щороку.\n\n> [!RISK]\n> Зі ставками так робити не можна. Кодекс встановлює лише стелю: не більше 10% прожиткового мінімуму для першої групи і не більше 20% мінімальної заробітної плати для другої. [SRC-030] Конкретну ставку встановлює сільська, селищна або міська рада залежно від виду діяльності. [SRC-030] Тому «ставка першої групи — 332,80 грн» неправильно; правильно — «не більше 332,80 грн у 2026 році, точна сума — у рішенні вашої ради».\n\n### 6. Ставки і що ще платить ФОП\n\nТретя група має відсоткову ставку: 3% доходу за одночасної сплати ПДВ або 5% доходу, якщо ПДВ включено до єдиного податку. [SRC-030] Для ювелірних виробів та е-резидентів вибору немає — лише 5%. [SRC-030]\n\nОкремо від єдиного податку ФОП сплачує **військовий збір**. Це не той самий платіж і не частина єдиного податку: [SRC-033]\n\n| Хто | Ставка військового збору |\n|---|---|\n| Перша, друга і четверта групи | 10% мінімальної заробітної плати на місяць, незалежно від доходу |\n| Третя група | 1% доходу |\n| Загальна система | 5% чистого оподатковуваного доходу |\n\nНорма тимчасова: для платників єдиного податку збір встановлено з 1 січня 2025 року й до 31 грудня третього календарного року після року скасування воєнного стану. [SRC-033]\n\n> [!REMEMBER]\n> Для першої і другої груп військовий збір **фіксований**: за місяць без жодного доходу він однаково нарахований. [SRC-033]\n\n### 7. Підвищена ставка 15%\n\nЦе не штраф, а ставка єдиного податку до «неправильного» доходу ФОП усіх трьох груп. Підстав пʼять: [SRC-030]\n\n1. сума перевищення обсягу доходу;\n2. дохід від діяльності, не внесеної до реєстру платників єдиного податку, — для першої і другої груп;\n3. дохід, отриманий негрошовим способом розрахунків;\n4. дохід від видів діяльності, які не дають права на спрощену систему;\n5. дохід першої або другої групи від діяльності, не передбаченої для цієї групи.\n\nПлатники єдиного податку повинні розраховуватися **виключно в грошовій формі** — готівковій або безготівковій, у тому числі електронними грошима. [SRC-025] Взаємозалік, бартер і вексель — це і 15% на суму, і підстава для переходу на загальну систему.\n\n### 8. ПДВ: коли обовʼязково\n\nОбовʼязок зареєструватися платником ПДВ виникає, якщо загальна сума операцій з постачання за **останні 12 календарних місяців** сукупно перевищує 1 000 000 гривень без ПДВ. [SRC-035]\n\nДві точні деталі, які найчастіше переказують неправильно:\n\n- це **ковзне вікно** з дванадцяти місяців, а не календарний рік: 1 січня лічильник не обнуляється; [SRC-035]\n- платники єдиного податку першої–третьої груп **прямо виведені** з-під цього обовʼязку. [SRC-035] Обовʼязок «оживає» при переході на загальну систему: заяву тоді подають не пізніше 10 числа першого місяця на загальній системі. [SRC-035]\n\nЦіна невиконання висока: особа, яка підлягала обовʼязковій реєстрації й не подала заяву, відповідає за ненарахування або несплату податку **на рівні зареєстрованого платника, без права на податковий кредит**. [SRC-035] Тобто ПДВ з обороту нарахують, а зменшити його не буде чим.\n\n> [!INFO]\n> ПДВ при ввезенні товарів сплачує і неплатник ПДВ — під час митного оформлення, без реєстрації. [SRC-035]\n\n### 9. Перехід: строки, які не збігаються\n\n| Дія | Строк |\n|---|---|\n| Перехід із загальної системи на спрощену | заява не пізніше ніж за 15 календарних днів до початку наступного кварталу [SRC-036] |\n| Скільки разів на рік можна так перейти | один раз протягом календарного року [SRC-036] |\n| Добровільна зміна групи | заява не пізніше ніж за 15 календарних днів до початку наступного кварталу [SRC-036] |\n| Добровільна відмова від спрощеної системи | заява не пізніше ніж за 10 календарних днів до початку нового кварталу [SRC-036] |\n| Заява після перевищення обсягу доходу | не пізніше 20 числа місяця, наступного за кварталом перевищення [SRC-029] |\n| Новостворений ФОП, перша або друга група | заява до закінчення місяця державної реєстрації; платником стає з першого числа наступного місяця [SRC-036] |\n| Новостворений ФОП, третя група без ПДВ | заява протягом 10 днів з дня державної реєстрації; платником стає з дня державної реєстрації [SRC-036] |\n\nПравило «один раз протягом календарного року» стосується **лише переходу із загальної системи на спрощену**. [SRC-036] Кількість добровільних змін групи Кодекс не обмежує.\n\n> [!RISK]\n> Два найчастіше сплутані строки: вхід — 15 днів, вихід — 10 днів. Симетрії немає.\n\n### 10. Що виштовхує на загальну систему\n\nПерелік підстав обовʼязкового переходу закритий. Для ФОП значущі: перевищення обсягу доходу; негрошовий спосіб розрахунків; здійснення видів діяльності, які не дають права на спрощену систему; перевищення чисельності працівників; діяльність, не зазначена в реєстрі платників єдиного податку; діяльність, не передбачена для своєї групи; податковий борг понад визначену суму на кожне перше число місяця протягом двох послідовних кварталів. [SRC-029] [SRC-036]\n\nДата переходу прив'язана до **кварталу порушення**, а не до дня, коли про нього дізналися. [SRC-029] Саме тому право втрачають заднім числом.\n\nОкремо: якщо реєстрацію анульовано за рішенням податкової на підставі акта перевірки, повернутися на спрощену систему можна лише після закінчення **чотирьох послідовних кварталів**. [SRC-036] При добровільній відмові такого обмеження немає.\n\n### 11. Як перевірити статус, а не памʼятати його\n\nТри способи, усі передбачені законом:\n\n1. **Публічні дані реєстру.** Дані про групу, ставку, дату обрання, види діяльності й дату виключення оприлюднюються **щоденно** для безоплатного й вільного доступу. [SRC-036] Це стосується і вашого статусу, і статусу контрагента.\n2. **Витяг з реєстру.** Видається безоплатно й безумовно; строк — один робочий день для вже зареєстрованого платника і два робочі дні для того, хто щойно подав заяву. Витяг діє до внесення змін до реєстру, а не певну кількість днів. [SRC-036]\n3. **Електронний кабінет** — перегляд облікових даних і подання заяви про перехід. [SRC-038]\n\nДля ПДВ-статусу діє окреме правило: дані реєстру платників ПДВ також оприлюднюються щоденно, разом із підставами анулювання. [SRC-035]\n\n> [!PRINCIPLE]\n> «Клієнт сказав, що він на третій групі» — не підтвердження. Підтвердження — запис у реєстрі на дату.\n\n## Покроковий процес\n\nЩоб перевірити допустимість спрощеної системи:\n\n1. Виписати фактичні види діяльності, а не лише зареєстровані КВЕДи.\n2. Звірити їх із переліком заборон.\n3. Перевірити характеристики особи: площі оренди, статус, податковий борг.\n4. Порахувати обсяг доходу за календарний рік і порівняти з лімітом групи.\n5. Перевірити кількість найманих працівників на потрібну дату.\n6. Для другої групи — перевірити, кому саме надаються послуги.\n7. Перевірити форму розрахунків: чи немає негрошових.\n8. Перевірити, чи не використано право переходу цього року.\n9. Окремо перевірити обсяг постачання за останні 12 місяців для порогу ПДВ.\n10. Звірити висновок із записом у реєстрі платників єдиного податку.\n\n## Практичні приклади\n\n### Приклад 1. Послуга не тому клієнту\n\nФОП другої групи надав консультацію товариству на загальній системі. Дохід від цієї операції оподатковується за ставкою 15%, і виникає підстава для переходу на загальну систему з першого числа місяця після кварталу, у якому це сталося. [SRC-030] [SRC-029]\n\n### Приклад 2. Взаємозалік замість оплати\n\nКлієнт пропонує закрити борг зустрічною послугою. Для платника єдиного податку це негрошовий розрахунок: 15% на суму і підстава для примусового переходу. [SRC-025] [SRC-030]\n\n### Приклад 3. Мільйон і ковзне вікно\n\nФОП третьої групи перевищив 1 000 000 гривень постачання за 12 місяців. Поки він на спрощеній системі, обовʼязку реєструватися платником ПДВ немає. [SRC-035] Але якщо він перейде на загальну систему, заяву треба подати не пізніше 10 числа першого ж місяця. [SRC-035]\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Рахувати вигоду до перевірки допустимості | обмеження можуть закрити шлях узагалі | спочатку перевірити заборони й ліміти |\n| Вважати ставку першої групи фіксованою сумою | Кодекс дає лише стелю [SRC-030] | дивитися рішення місцевої ради |\n| Рахувати ліміт першої групи від мінімальної зарплати | база першої групи — прожитковий мінімум [SRC-030] | розрізняти дві бази |\n| «Друга група не може працювати з юрособами» | обмеження стосується послуг, не товарів [SRC-025] | розділяти послуги й продаж товарів |\n| «Один раз на рік можна змінити групу» | обмеження стосується входу на спрощену [SRC-036] | зміна групи не обмежена кількісно |\n| Вважати 15% штрафом | це ставка єдиного податку до суми [SRC-030] | називати речі точно |\n| Рахувати поріг ПДВ за календарний рік | норма каже «останні 12 місяців» [SRC-035] | рахувати ковзним вікном |\n| «Податкова попередить» | дата переходу привʼязана до кварталу порушення [SRC-029] | перевіряти статус самостійно |\n| Згадувати ставку 2% як чинну | норма вичерпалася 1 серпня 2023 року [SRC-028] | не переносити воєнні норми в теперішній час |\n\n## Ризики й межі самостійних дій\n\n- Модуль не рахує суму податку й не заповнює декларацію — це модулі 11 і 19.\n- Строки подання декларацій і податковий календар — модуль 18.\n- ЄСВ регулюється окремим законом і в цьому модулі не розглядається — модуль 12.\n- Механіка ПДВ, податковий кредит і накладні — модуль 15.\n- Вибір системи для конкретної людини — рішення бухгалтера з урахуванням її обставин, а не висновок з таблиці.\n- Наступна редакція Податкового кодексу призначена на 1 листопада 2026 року; після цієї дати норми модуля треба звірити наново.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, щоб порівняти системи на ваших числах, перевірити відповідність фактичної діяльності обраній групі, розрахувати наслідки перевищення й оцінити доцільність реєстрації платником ПДВ.\n\n**Юрист потрібен**, якщо податкова анулювала реєстрацію за актом перевірки, якщо є спір про вид діяльності або якщо йдеться про оскарження рішення контролюючого органу.\n\n## Підсумок\n\nЗагальна система оподатковує чистий дохід, спрощена — надходження. Спрощена система це право, яке треба отримати й утримати: у неї є закритий перелік заборон, ліміти доходу за групами, вимога грошової форми розрахунків і власні строки заяв. Ліміти задані формулою від величини на 1 січня, ставки першої та другої груп — лише стелею, а конкретну ставку встановлює місцева рада. Право на спрощену систему втрачають заднім числом, від кварталу порушення, тому статус перевіряють у реєстрі, а не памʼятають.\n\n## Самоперевірка\n\n1. Чим відрізняється обʼєкт оподаткування на двох системах?\n2. Скільки найманих працівників може мати друга група і на який момент рахують?\n3. Кому друга група може надавати послуги?\n4. Від якої величини рахують ліміт третьої групи?\n5. Чому «ставка першої групи — 332,80 грн» неправильно?\n6. Назвіть три підстави підвищеної ставки 15%.\n7. За який період рахують поріг реєстрації платником ПДВ?\n8. Скільки разів на рік можна перейти на спрощену систему?\n9. З якої дати ФОП втрачає право на спрощену систему через перевищення доходу?\n10. Де подивитися свою групу й ставку?\n\n## Джерела\n\nПовна карта тверджень і посилань — у `references.md`. Основні джерела: Податковий кодекс України (статті 291, 293–299, 177, 181–184, підрозділ 10 розділу XX), Закон про Державний бюджет України на 2026 рік, наказ Мінфіну про форми заяви та витягу.\n\n## Дата перевірки актуальності\n\n- Норми перевірено: **25.08.2026** за редакцією Податкового кодексу від 31.05.2026.\n- Наступна перевірка модуля: **01.11.2026** — на цю дату призначено нову редакцію Кодексу.\n- Людська фактологічна перевірка: **не проведена**."}, {"id": "practice", "title": "Практика", "content": "# Практика: чи можна на спрощену?\n\n## Мета\n\nНавчитися перевіряти допустимість системи оподаткування за обмеженнями, а не за бажанням, і бачити, які факти закривають шлях на спрощену систему, а які лише здаються загрозливими.\n\n## Навчальна ситуація\n\nДані синтетичні. Не використовуйте реальні відомості про себе чи клієнтів.\n\n**Тарас Ділов** планує зареєструватися платником єдиного податку **третьої групи** без ПДВ. Відомо:\n\n| № | Факт |\n|---|---|\n| 1 | Надає консультаційні послуги переважно товариствам на загальній системі |\n| 2 | Дохід за попередній календарний рік — 7 500 000 грн |\n| 3 | Має 4 найманих працівників |\n| 4 | Здає в оренду нежитлове приміщення загальною площею 1200 м² |\n| 5 | Планує додати охоронну діяльність |\n| 6 | На день подання заяви має несплачений податковий борг 640 грн |\n| 7 | З одним клієнтом домовився про часткове закриття оплати взаємозаліком |\n| 8 | У лютому цього року вже переходив із загальної системи на спрощену, потім відмовився |\n| 9 | Один із клієнтів — нерезидент |\n\nДовідково: рік — 2026.\n\n## Завдання 1. Оцініть кожен факт\n\nДля кожного факту визначте, чи сумісний він із третьою групою: **не заважає** або **унеможливлює спрощену систему**. Вкажіть, чим підтверджується висновок.\n\n## Завдання 2. Порахуйте три числа\n\n1. Ліміт доходу третьої групи на 2026 рік.\n2. Поріг обовʼязкової реєстрації платником ПДВ.\n3. Ставку третьої групи без ПДВ.\n\n## Завдання 3. Знайдіть те, чого немає в даних\n\nОдне зі значень визначити неможливо: у ситуації немає потрібного джерела. Позначте його як таке, що потребує окремої перевірки, і напишіть, де саме шукати.\n\n## Критерії виконання\n\n- кожен факт має висновок із зазначеним джерелом;\n- факти, що унеможливлюють спрощену систему, відокремлені від тих, що не заважають;\n- ліміт порахований за формулою від величини на 1 січня, а не взятий з памʼяті;\n- значення, якого немає в даних, не заповнене припущенням."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Ми ж домовлялися на третю групу»\n\n## Ситуація\n\nОксана — ФОП третьої групи без ПДВ, веде студію дизайну. У серпні вона отримує від бухгалтера повідомлення: право на спрощену систему втрачено ще з 1 липня.\n\nЩо сталося до цього:\n\n- у травні закрила частину оплати клієнта взаємозаліком за зустрічну послугу;\n- у червні дохід за календарний рік перевищив ліміт третьої групи;\n- заяву після перевищення не подавала — «не знала, що треба»;\n- у липні й серпні продовжувала виставляти рахунки як платник єдиного податку;\n- вважала, що податкова попередить, якщо щось не так;\n- жодного разу не перевіряла свій статус у реєстрі платників єдиного податку;\n- не роздрукувала витяг з реєстру на запит клієнта;\n- не оновила перелік КВЕДів на сайті студії.\n\nДані синтетичні.\n\n## Завдання\n\n1. Знайдіть щонайменше пʼять реальних ризиків і відокремте їх від того, що лише виглядає проблемою.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Побудуйте безпечну послідовність дій — без розрахунку конкретних сум податку.\n4. Поясніть, чому право втрачено саме з 1 липня, а не з дня, коли про це дізналися.\n\n## Орієнтир для самоперевірки\n\n- негрошовий розрахунок — це одночасно підвищена ставка на суму і підстава для переходу на загальну систему;\n- перевищення ліміту дає 15% на суму перевищення, а для третьої групи ще й обовʼязковий перехід;\n- дата переходу привʼязана до кварталу порушення, тому право втрачають заднім числом;\n- заява після перевищення має строк — 20 число місяця, наступного за кварталом;\n- рахунки, виставлені як платник єдиного податку після втрати права, доведеться переглядати;\n- статус видно в реєстрі: його перевіряють, а не памʼятають.\n\nЦе навчальний кейс, а не індивідуальна податкова консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст перевірки податкового статусу\n\n## Допустимість\n\n- [ ] Виписано фактичні види діяльності, а не лише зареєстровані КВЕДи.\n- [ ] Фактичну діяльність звірено із закритим переліком заборон.\n- [ ] Перевірено площі переданого в оренду майна.\n- [ ] Перевірено наявність податкового боргу на день подання заяви.\n\n## Числа\n\n- [ ] Обсяг доходу за календарний рік порахований.\n- [ ] Ліміт групи порахований від величини на 1 січня відповідного року.\n- [ ] Обсяг постачання за останні 12 календарних місяців перевірено окремо.\n- [ ] Ставку першої або другої групи взято з рішення місцевої ради, а не зі стелі в Кодексі.\n\n## Умови утримання\n\n- [ ] Усі розрахунки відбувалися в грошовій формі.\n- [ ] Кількість найманих працівників перевірено на потрібний момент.\n- [ ] Для другої групи перевірено коло клієнтів для послуг.\n- [ ] Фактична діяльність збігається з видами діяльності в реєстрі.\n\n## Строки й статус\n\n- [ ] Перевірено, чи використано право переходу на спрощену систему цього року.\n- [ ] Відомі строки заяв: вхід, зміна групи, відмова, перевищення.\n- [ ] Висновок звірено із записом у реєстрі платників єдиного податку.\n- [ ] Зафіксовано дату, станом на яку перевірено статус.\n\n## Контроль якості\n\n- [ ] Жодне обмеження не оцінено з пам’яті.\n- [ ] Числа не перенесені з матеріалів минулих років.\n- [ ] Остаточний вибір системи передано бухгалтеру."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 3\n\n| Термін | Просте пояснення |\n|---|---|\n| Загальна система | Оподаткування чистого доходу ФОП: виручка мінус підтверджені витрати. |\n| Спрощена система | Заміна переліку податків на єдиний податок за умови відповідності вимогам. |\n| Група єдиного податку | Набір критеріїв, яким треба відповідати одночасно. |\n| Обсяг доходу | Дохід за календарний рік, який порівнюють із лімітом групи. |\n| Ліміт групи | Кількість розмірів мінімальної зарплати на 1 січня, задана нормою. |\n| Фіксована ставка | Ставка першої та другої груп, яку встановлює місцева рада в межах стелі з Кодексу. |\n| Відсоткова ставка | Ставка третьої групи: відсоток від доходу. |\n| Підвищена ставка | 15% до доходу, отриманого з порушенням умов спрощеної системи. |\n| Грошова форма розрахунків | Єдина допустима форма оплати для платника єдиного податку. |\n| Поріг реєстрації платником ПДВ | Обсяг постачання за останні 12 календарних місяців, після якого реєстрація обов’язкова. |\n| Податковий кредит | Сума ПДВ, на яку платник зменшує своє зобов’язання; недоступна незареєстрованому. |\n| Реєстр платників єдиного податку | Офіційне джерело даних про групу, ставку й дату обрання. |\n| Витяг з реєстру | Документ із даними реєстру, який видають за запитом безоплатно. |\n| Анулювання реєстрації | Виключення з реєстру платників єдиного податку. |\n| Чистий оподатковуваний дохід | База ПДФО і військового збору на загальній системі. |\n| Військовий збір | Окремий платіж зі своєю базою для кожної системи. |"}, {"id": "reference", "title": "Пам’ятка", "content": "# Пам’ятка: вибір і перевірка системи\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-08-25**\n\n## Порядок дій\n\n1. Перевірити допустимість: заборонені види діяльності й обмеження за особою.\n2. Порахувати обсяг доходу й порівняти з лімітом групи.\n3. Перевірити умови утримання: грошова форма, працівники, коло клієнтів.\n4. Окремо перевірити поріг ПДВ за останні 12 місяців.\n5. Звірити висновок із реєстром.\n\nВигоду рахують **після** допустимості, не раніше.\n\n## Дві системи\n\n| | Загальна | Спрощена |\n|---|---|---|\n| Об’єкт | чистий дохід: виручка мінус підтверджені витрати | дохід, тобто надходження |\n| Ставка | 18% ПДФО + 5% військового збору | залежить від групи |\n| Ліміт доходу | немає | є для кожної групи |\n| Обмеження діяльності | у Кодексі немає | закритий перелік |\n\n## Групи\n\n| | Перша | Друга | Третя |\n|---|---|---|---|\n| Працівники | немає | одночасно до 10 | не обмежено |\n| Ліміт доходу | 167 мінзарплат | 834 мінзарплати | 1167 мінзарплат |\n| Ставка | не більше 10% прожиткового мінімуму | не більше 20% мінзарплати | 3% з ПДВ або 5% без ПДВ |\n| Військовий збір | 10% мінзарплати на місяць | 10% мінзарплати на місяць | 1% доходу |\n\nЛіміти рахують від величини **на 1 січня** року. Ставки першої та другої груп встановлює місцева рада — у Кодексі лише стеля.\n\n## Приклад на 2026 рік\n\nМінімальна зарплата 8647 грн, прожитковий мінімум для працездатних 3328 грн.\n\n- ліміт першої групи — 1 444 049 грн;\n- ліміт другої групи — 7 211 598 грн;\n- ліміт третьої групи — 10 091 049 грн.\n\nЦе розрахунок, а не цитата. Перед рішенням перевірте чинну величину.\n\n## Що дає 15%\n\n- сума перевищення ліміту;\n- дохід від діяльності не з реєстру — для першої і другої груп;\n- негрошовий розрахунок;\n- заборонений вид діяльності;\n- діяльність не для своєї групи.\n\n## Строки\n\n| Дія | Строк |\n|---|---|\n| Вхід на спрощену | за 15 календарних днів до кварталу, один раз на рік |\n| Зміна групи | за 15 календарних днів до кварталу, без обмеження кількості |\n| Відмова від спрощеної | за 10 календарних днів до кварталу |\n| Заява після перевищення | до 20 числа місяця після кварталу перевищення |\n| Новий ФОП, 1–2 група | до кінця місяця реєстрації; платник — з наступного місяця |\n| Новий ФОП, 3 група без ПДВ | 10 днів; платник — з дня реєстрації |\n\n## ПДВ\n\nПоріг — 1 000 000 грн без ПДВ за **останні 12 календарних місяців**, ковзним вікном. Платники єдиного податку 1–3 груп під обов’язок не підпадають. Не зареєструвався вчасно — податок нарахують як зареєстрованому, але **без права на податковий кредит**.\n\n## Перевірка статусу\n\nДані реєстру оприлюднюють щоденно. Витяг — безоплатно, один робочий день. Витяг діє до внесення змін до реєстру, а не певну кількість днів."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 3\n\nПеревірено: **2026-08-25** за редакцією Податкового кодексу від 31.05.2026. Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Спрощена система — заміна сплати переліку податків на єдиний податок | SRC-025, ПКУ, пункт 291.2 | Норма закону | Не «пільга» і не звільнення від усіх податків |\n| Спрощену систему обирають добровільно за умови відповідності вимогам і реєстрації | SRC-025, пункт 291.3 | Норма закону | Без реєстрації діє загальна система |\n| Критерії груп 1–3: працівники, діяльність, ліміт доходу | SRC-025, пункт 291.4 | Норма закону | Критерії перевіряють сукупно |\n| Для другої групи — не більше 10 осіб одночасно | SRC-025, пункт 291.4 | Норма закону | Моментний показник, окремі категорії не враховують |\n| Друга група надає послуги лише платникам ЄП та населенню | SRC-025, пункт 291.4 | Норма закону | Продажу товарів це обмеження не стосується |\n| Закритий перелік заборонених видів діяльності та обмежень за особою | SRC-025, пункт 291.5 | Норма закону | Дві різні природи обмежень |\n| Охоронну діяльність заборонено для спрощеної системи з 01.01.2026 | SRC-027 | Норма закону | Без дати твердження стає неправильним для минулих років |\n| Розрахунки — виключно в грошовій формі, включно з електронними грошима | SRC-025, пункт 291.6 | Норма закону | Взаємозалік і бартер порушують норму |\n| Ліміти задані як 167 / 834 / 1167 розмірів мінімальної заробітної плати на 1 січня | SRC-025, пункт 291.4 | Норма закону | Підвищення всередині року ліміт не змінює |\n| Мінімальна зарплата 8647 грн і прожитковий мінімум для працездатних 3328 грн на 01.01.2026 | SRC-026, статті 7 і 8 | Норма закону | Гривневі ліміти в уроці — розрахунок за двома нормами, не цитата |\n| Ставки 1 і 2 груп встановлює місцева рада, Кодекс дає лише стелю | SRC-030, пункти 293.1 і 293.2 | Норма закону | Різні бази: прожитковий мінімум і мінзарплата |\n| Ставка третьої групи: 3% з ПДВ або 5% без ПДВ | SRC-030, пункт 293.3 | Норма закону | Для ювелірних виробів та е-резидентів — лише 5% |\n| Підвищена ставка 15% і пʼять підстав її застосування | SRC-030, пункт 293.4 | Норма закону | Для ФОП це 15%, подвійна ставка стосується юридичних осіб |\n| Наслідки перевищення обсягу доходу і строк заяви | SRC-029, пункт 293.8 | Норма закону | Для третьої групи перехід обовʼязковий |\n| Перелік підстав примусового переходу на загальну систему | SRC-029, підпункт 298.2.3 | Норма закону | Дата привʼязана до кварталу порушення |\n| Звільнення від податків на спрощеній системі та що залишається | SRC-032, пункт 297.1 і 297.2 | Норма закону | Податковий агент і ввізний ПДВ залишаються |\n| Військовий збір: платники, база і ставки для кожної системи | SRC-033, пункт 16-1 підрозділу 10 розділу XX | Норма закону | Норма тимчасова, з 01.01.2025 для єдинників |\n| Обʼєкт оподаткування і ставка на загальній системі | SRC-034, пункти 177.1 і 177.2, пункт 167.1 | Норма закону | Ставка встановлена відсилкою до розділу IV |\n| Поріг реєстрації платником ПДВ — 1 000 000 грн за останні 12 календарних місяців | SRC-035, пункт 181.1 | Норма закону | Платники ЄП 1–3 груп прямо виведені з-під обовʼязку |\n| Наслідки неподання заяви на реєстрацію платником ПДВ | SRC-035, пункт 183.10 | Норма закону | Відповідальність без права на податковий кредит |\n| Строк заяви при переході зі спрощеної на загальну — до 10 числа першого місяця | SRC-035, пункт 183.4 | Норма закону | Стосується тих, хто вже перевищив поріг |\n| Строки заяв: вхід 15 днів, зміна групи 15 днів, відмова 10 днів | SRC-036, підпункти 298.1.4, 298.1.5, 298.2.1 | Норма закону | Симетрії між входом і виходом немає |\n| Перехід на спрощену — один раз протягом календарного року | SRC-036, підпункт 298.1.4 | Норма закону | Зміни групи це обмеження не стосується |\n| Строки для новоствореного ФОП і дата набуття статусу | SRC-036, підпункт 298.1.2 | Норма закону | Для 1–2 груп і 3 групи вони різні |\n| Повернення на спрощену після анулювання за актом перевірки — через чотири квартали | SRC-036, пункт 299.11 | Норма закону | При добровільній відмові обмеження немає |\n| Дані реєстру платників єдиного податку оприлюднюють щоденно | SRC-036, пункт 299.13 | Норма закону | Основа теми «перевірка статусу» |\n| Витяг з реєстру: безоплатно, один робочий день, діє до змін у реєстрі | SRC-036, пункт 299.9 | Норма закону | Строку дії в днях витяг не має |\n| Форми заяви, розрахунку доходу, запиту та витягу | SRC-037, наказ Мінфіну № 308 | Підзаконний акт | Бланк заяви — у редакції наказу № 440 з 24.12.2024 |\n| Електронний кабінет як спосіб перевірити дані й подати заяву | SRC-038, стаття 42-1 | Норма закону | Інтерфейс сервісу в модулі не описується |\n| Воєнні норми: ставка 2% вичерпана 01.08.2023 | SRC-028, підрозділ 8 розділу XX | Норма закону | У теперішньому часі не згадувати |\n\n## Межі перевірки\n\n- Модуль не наводить сум податку, строків подання декларацій і податкового календаря: це модулі 11, 18 і 19.\n- ЄСВ регулюється окремим законом і в межах модуля не перевірявся — модуль 12.\n- Механіка ПДВ поза реєстрацією не розглядається — модуль 15.\n- Гривневі ліміти в уроці є **розрахунком** за нормою про кількість мінімальних зарплат і нормою про її розмір. Таблиця ДПС із сумами на 2026 рік не перевірялася: офіційні сторінки ДПС недоступні для автоматичної перевірки.\n- Строк подання річної декларації платником єдиного податку першої та другої груп у модулі свідомо не наводиться: Кодекс відсилає до «строку для річного періоду», а підпункти 49.18.3 і 49.18.4 дають різні відповіді. Питання належить модулю 18 і потребує окремої перевірки.\n- Назва й адреса публічного реєстру на сайті ДПС, шлях в Електронному кабінеті та ідентифікатор електронної форми заяви не перевірялися й у матеріалі не наводяться."}], "quiz": [{"id": "m03-q01", "title": "Система і витрати", "competency": "systems_object", "scenario": "У підприємця 900 000 грн доходу за рік і 700 000 грн документально підтверджених витрат на матеріали.", "question": "Чому вибір системи тут не очевидний із самого доходу?", "options": [{"text": "Бо ставка єдиного податку залежить від суми витрат підприємця за рік", "feedback": "Ні. На спрощеній системі витрати на розмір податку взагалі не впливають."}, {"text": "Бо на загальній системі витрати зменшують базу, а на спрощеній — ні", "correct": true, "feedback": "Правильно. Саме різниця в базі робить порівняння систем змістовним."}, {"text": "Бо на спрощеній системі витрати враховують лише за окремою заявою", "feedback": "Ні. Жодної заяви, яка додавала б витрати до розрахунку, норма не передбачає."}], "explanation": "На загальній системі обʼєктом є чистий оподатковуваний дохід — виручка мінус документально підтверджені витрати. На спрощеній базою є сам дохід. Тому за великих підтверджених витрат порівняння систем може дати неочікуваний результат.", "source_reference": ["SRC-025", "SRC-034"], "hint": "Порівняйте, від якої величини кожна система рахує податок, і подумайте, що змінюють витрати."}, {"id": "m03-q02", "title": "Друга група і товариство", "competency": "groups_limits", "scenario": "ФОП другої групи продає товариству на загальній системі партію готової продукції власного виробництва.", "question": "Чи порушує це умови другої групи?", "options": [{"text": "Ні, обмеження щодо кола клієнтів стосується надання послуг", "correct": true, "feedback": "Правильно. Для продажу товарів норма кола клієнтів не звужує."}, {"text": "Так, друга група працює лише з платниками єдиного податку", "feedback": "Ні. Це правило норма встановлює саме для послуг, а не для будь-яких операцій."}, {"text": "Так, продаж товарів юридичним особам дозволений третій групі", "feedback": "Ні. Другій групі виробництво і продаж товарів норма прямо дозволяє."}], "explanation": "Обмеження щодо кола контрагентів у другій групі сформульоване для послуг: їх надають платникам єдиного податку та населенню. Виробництво, продаж товарів і ресторанне господарство таким колом не обмежені.", "source_reference": ["SRC-025"], "hint": "Розділіть у сценарії дві різні операції: надання послуги й продаж товару."}, {"id": "m03-q03", "title": "Від чого рахують ліміт", "competency": "limits_math", "scenario": "Бухгалтер бере торішню статтю із сумою ліміту третьої групи й застосовує її до поточного року.", "question": "У чому помилка такого підходу?", "options": [{"text": "Ліміт узагалі не переглядають, він установлений незмінною сумою", "feedback": "Ні. Сума змінюється щороку разом із величиною, від якої її рахують."}, {"text": "Норма задає ліміт формулою від величини на 1 січня поточного року", "correct": true, "feedback": "Правильно. Тому торішня сума до цього року просто не застосовується."}, {"text": "Ліміт треба перераховувати щоразу, коли підвищують мінімальну зарплату", "feedback": "Ні. Підвищення всередині року ліміт цього року не змінює."}], "explanation": "Ліміти груп задані як кількість розмірів мінімальної заробітної плати, встановленої законом на 1 січня податкового року. Сума в гривнях — похідна від цієї величини і дійсна лише для свого року.", "source_reference": ["SRC-025", "SRC-026"], "hint": "Подумайте, що саме записано в самій нормі: готова сума чи спосіб її обчислення."}, {"id": "m03-q04", "title": "Звідки береться ставка першої групи", "competency": "rates", "scenario": "Клієнт просить назвати точну ставку єдиного податку для першої групи в його місті.", "question": "Що має відповісти бухгалтер?", "options": [{"text": "Назвати максимум із Кодексу: він і є ставкою для всіх міст країни", "feedback": "Ні. Кодекс встановлює верхню межу, а не саму ставку конкретного міста."}, {"text": "Подивитися рішення місцевої ради: Кодекс встановлює лише межу", "correct": true, "feedback": "Правильно. Ставка залежить від виду діяльності й рішення ради."}, {"text": "Порахувати відсоток від доходу клієнта за попередній календарний рік", "feedback": "Ні. Для першої групи ставка фіксована, а не відсоткова від доходу."}], "explanation": "Для першої та другої груп Кодекс встановлює лише граничний розмір фіксованої ставки. Конкретну ставку залежно від виду діяльності встановлює сільська, селищна або міська рада.", "source_reference": ["SRC-030"], "hint": "Запитайте себе, хто саме встановлює фіксовану ставку і що тоді записано в Кодексі."}, {"id": "m03-q05", "title": "Перевищення в третій групі", "competency": "over_limit", "scenario": "ФОП третьої групи перевищив річний ліміт доходу в другому кварталі.", "question": "Які наслідки настають для нього?", "options": [{"text": "Підвищена ставка на суму перевищення і обовʼязковий перехід на загальну систему", "correct": true, "feedback": "Правильно. Для третьої групи вибору між переходом і доплатою немає."}, {"text": "Лише підвищена ставка: група зберігається до кінця календарного року", "feedback": "Ні. Для третьої групи норма прямо вимагає перейти на інші податки."}, {"text": "Перехід у другу групу за заявою і перерахунок податку за новою ставкою", "feedback": "Ні. Перехід у молодшу групу норма для цієї ситуації не передбачає."}], "explanation": "До суми перевищення застосовується ставка 15%, і платник третьої групи зобовʼязаний перейти на сплату інших податків. Право вибору між зміною групи й відмовою від спрощеної системи мають лише перша й друга групи.", "source_reference": ["SRC-029", "SRC-030"], "hint": "Порівняйте наслідки перевищення для трьох груп: у кого є вибір, а в кого його немає."}, {"id": "m03-q06", "title": "Строки заяв", "competency": "transition_terms", "scenario": "Підприємець хоче з наступного кварталу піти зі спрощеної системи на загальну.", "question": "Який строк подання заяви встановлено для такої відмови?", "options": [{"text": "Не пізніше ніж за 15 календарних днів до початку наступного кварталу", "feedback": "Ні. Такий строк установлено для входу на спрощену систему й зміни групи."}, {"text": "Не пізніше ніж за 10 календарних днів до початку нового кварталу", "correct": true, "feedback": "Правильно. Для виходу норма встановлює саме десятиденний строк."}, {"text": "Не пізніше 20 числа місяця, наступного за кварталом подання заяви", "feedback": "Ні. Цей строк стосується заяви після перевищення обсягу доходу."}], "explanation": "Строки входу й виходу не симетричні: перехід на спрощену систему і зміна групи — за 15 календарних днів до початку кварталу, добровільна відмова — за 10 календарних днів.", "source_reference": ["SRC-036"], "hint": "У цій темі три різні строки; згадайте, який із них норма відводить саме на вихід."}, {"id": "m03-q07", "title": "Новостворений ФОП", "competency": "transition_terms", "scenario": "Особа зареєструвалася підприємцем 5 березня і через тиждень подала заяву про третю групу без ПДВ.", "question": "З якої дати вона вважається платником єдиного податку?", "options": [{"text": "З 1 квітня, тобто з першого числа наступного календарного місяця", "feedback": "Ні. Це правило норма встановлює для першої та другої груп."}, {"text": "З 1 числа кварталу, наступного за кварталом подання заяви", "feedback": "Ні. Такий порядок діє при переході із загальної системи, а не при реєстрації."}, {"text": "З 5 березня, тобто з дня державної реєстрації підприємцем", "correct": true, "feedback": "Правильно. Заяву подано в межах десятиденного строку від реєстрації."}], "explanation": "Новостворений ФОП, який протягом 10 днів з дня державної реєстрації подав заяву про третю групу без ПДВ, вважається платником єдиного податку з дня державної реєстрації. Для першої та другої груп діє інше правило.", "source_reference": ["SRC-036"], "hint": "Для новостворених ФОП норма розводить групи: порівняйте правило для першої-другої й для третьої."}, {"id": "m03-q08", "title": "Поріг ПДВ без реєстрації", "competency": "vat_registration", "scenario": "ФОП на загальній системі перевищив поріг обсягу постачання, але заяву на реєстрацію платником ПДВ не подав.", "question": "Які наслідки встановлює норма?", "options": [{"text": "Відповідальність як зареєстрованого платника, але без права на податковий кредит", "correct": true, "feedback": "Правильно. Податок нарахують, а зменшити його не буде чим."}, {"text": "Реєстрація відбувається автоматично з дати перевищення встановленого порога", "feedback": "Ні. Автоматичної реєстрації за фактом перевищення норма не передбачає."}, {"text": "Наслідки настають лише після того, як податкова надішле окреме повідомлення", "feedback": "Ні. Відповідальність повʼязана з фактом перевищення, а не з повідомленням."}], "explanation": "Особа, яка підлягала обовʼязковій реєстрації й не подала заяву, несе відповідальність за ненарахування або несплату податку на рівні зареєстрованого платника, без права нарахування податкового кредиту та бюджетного відшкодування.", "source_reference": ["SRC-035"], "hint": "Подумайте, що саме втрачає незареєстрований: обовʼязок нарахувати чи право зменшити."}, {"id": "m03-q09", "title": "Дата втрати права", "competency": "losing_simplified", "scenario": "Порушення умов спрощеної системи сталося у травні, підприємець дізнався про це в серпні.", "question": "З якої дати він перебуває на загальній системі?", "options": [{"text": "З серпня, тобто з місяця, у якому порушення було виявлене", "feedback": "Ні. Момент виявлення норма з датою переходу не повʼязує."}, {"text": "З дати рішення контролюючого органу за результатами перевірки", "feedback": "Ні. Рішення за перевіркою — окрема підстава з власним порядком."}, {"text": "З 1 липня, тобто від кварталу, у якому сталося порушення", "correct": true, "feedback": "Правильно. Саме тому право на спрощену систему втрачають заднім числом."}], "explanation": "Норма привʼязує перехід на сплату інших податків до першого числа місяця, наступного за кварталом, у якому допущено порушення. Травень належить до другого кварталу, тому загальна система починається з 1 липня.", "source_reference": ["SRC-029"], "hint": "Знайдіть у сценарії квартал, у якому сталося порушення, і подумайте, що йде за ним."}, {"id": "m03-q10", "title": "Перевірка статусу контрагента", "competency": "status_check", "scenario": "Новий контрагент каже, що він на третій групі без ПДВ, і просить не вимагати зайвих документів.", "question": "Як бухгалтеру підтвердити цей статус?", "options": [{"text": "Узяти дані з реєстру платників єдиного податку: вони оприлюднюються щоденно", "correct": true, "feedback": "Правильно. Це безоплатне й відкрите джерело, запит контрагенту не потрібен."}, {"text": "Попросити свідоцтво платника єдиного податку з печаткою контрагента", "feedback": "Ні. Свідоцтв платника єдиного податку вже не видають, це застарілий документ."}, {"text": "Достатньо листа контрагента із зазначенням його групи та ставки податку", "feedback": "Ні. Лист відображає слова контрагента, а не запис в офіційному реєстрі."}], "explanation": "Дані про групу, ставку, дату обрання та види діяльності платника єдиного податку оприлюднюються щоденно для безоплатного й вільного доступу. За потреби платник може отримати витяг з реєстру.", "source_reference": ["SRC-036"], "hint": "Згадайте, яке джерело даних про платників єдиного податку є відкритим і оновлюється щодня."}], "activities": {"precheck": [{"id": "pre-object", "question": "Як гадаєте: на спрощеній системі витрати зменшують суму податку?", "options": [{"text": "Так, як і на загальній системі", "correct": false}, {"text": "Ні, податок рахують від доходу", "correct": true}, {"text": "Так, якщо є всі документи", "correct": false}], "note": "Це головна розвилка модуля: дві системи рахують податок від різних величин. У розділі про об’єкт оподаткування ви побачите, що з цього випливає для вибору."}, {"id": "pre-limit", "question": "Ліміт доходу третьої групи записаний у Податковому кодексі як конкретна сума в гривнях?", "options": [{"text": "Так, сума прописана в самій нормі", "correct": false}, {"text": "Ні, там формула від мінімальної зарплати", "correct": true}, {"text": "Так, її щороку змінює податкова", "correct": false}], "note": "Саме тому суму з торішньої статті не можна переносити в цей рік. Далі ви побачите, від якої величини і на яку дату рахують ліміт."}, {"id": "pre-loss", "question": "ФОП порушив умову спрощеної системи у травні, а дізнався про це в серпні. З якої дати він на загальній системі?", "options": [{"text": "З дати, коли про порушення дізналися", "correct": false}, {"text": "З дати, привʼязаної до кварталу порушення", "correct": true}, {"text": "З дати рішення податкової за актом перевірки", "correct": false}], "note": "На цьому будується Кейс модуля. Право втрачають заднім числом, і саме тому статус перевіряють самостійно, а не чекають повідомлення."}], "lesson": [{"id": "lesson-object", "section": "Дві системи", "scenario": "ФОП має 800 000 грн доходу за рік і 600 000 ій групі оренда не заважає", "feedback": "Ні. Обмеження за площами стосується спрощеної системи загалом."}], "source_reference": ["SRC-025"]}, {"id": "lesson-rate-source", "section": "Числа", "scenario": "Бухгалтер бачить у матеріалах: «ставка першої групи — 332,80 грн на місяць».", "question": "Чому це формулювання неправильне?", "options": [{"text": "Ставка залежить від доходу підприємця, а не від фіксованої величини", "feedback": "Ні. Для першої групи ставка саме фіксована, питання не в цьому."}, {"text": "Ставку першої групи рахують від мінімальної заробітної плати", "feedback": "Ні. База першої групи інша, але помилка у формулюванні не тут."}, {"text": "Кодекс дає лише стелю, а ставку встановлює місцева рада", "correct": true, "feedback": "Правильно. Наведене число — максимум, а не ставка конкретного міста."}], "source_reference": ["SRC-030"]}, {"id": "lesson-barter", "section": "Підвищена ставка", "scenario": "Клієнт пропонує ФОП третьої групи закрити оплату зустрічною послугою.", "question": "Які наслідки це має для платника єдиного податку?", "options": [{"text": "Підвищена ставка на суму і підстава для переходу на загальну систему", "correct": true, "feedback": "Правильно. Норма вимагає розрахунків виключно в грошовій формі."}, {"text": "Наслідків немає, якщо сторони оформили залік письмовим актом звірки", "feedback": "Ні. Документальне оформлення не робить розрахунок грошовим."}, {"text": "Тільки перерахунок доходу за курсом на дату підписання документів", "feedback": "Ні. Курс тут ні до чого: питання у формі розрахунку, а не у валюті."}], "source_reference": ["SRC-025", "SRC-030"]}, {"id": "lesson-vat", "section": "ПДВ", "scenario": "ФОП третьої групи перевищив 1 000 000 грн постачання за останні 12 місяців.", "question": "Чи виникає обовʼязок зареєструватися платником ПДВ?", "options": [{"text": "Так, обовʼязок виникає у будь-якої особи незалежно від системи оподаткування", "feedback": "Ні. У самій нормі є пряме виключення для певної категорії платників.
