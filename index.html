hint": "Порівняйте те, що людина робить насправді, із тим, що записано в реєстрі. Розбіжність тут — це «потрібні дані», а не «підтверджено».", "why": "Обмеження спрощеної системи прив’язані до фактичної діяльності, тому перевірка лише за КВЕДами пропускає порушення."}, {"id": "bans", "group": "Допустимість", "text": "Фактичну діяльність звірено із закритим переліком заборон", "critical": true, "hint": "Перелік заборон закритий: перевіряйте по ньому, а не «за відчуттям, що це дозволено».", "why": "Один заборонений вид діяльності закриває спрощену систему повністю, незалежно від решти показників."}, {"id": "person_limits", "group": "Допустимість", "text": "Перевірено обмеження за характеристиками особи: площі оренди, статус, податковий борг", "critical": true, "hint": "Це не про діяльність, а про саму особу. Зверніть увагу, що площі рахують загальні, а борг оцінюють на день подання заяви.", "why": "Ці обмеження спрацьовують непомітно: підприємець може роками не знати, що площа оренди вже перевищила межу."}, {"id": "income_calc", "group": "Числа", "text": "Обсяг доходу за календарний рік порахований і порівняний з лімітом групи", "critical": true, "hint": "Порівнюйте з лімітом саме тієї групи, яку обрано або планується, а не з найбільшим із трьох.", "why": "Перевищення ліміту дає підвищену ставку на суму перевищення, а для третьої групи ще й обов’язковий перехід."}, {"id": "limit_base", "group": "Числа", "text": "Ліміт порахований від величини, встановленої на 1 січня відповідного року", "critical": true, "hint": "Питання не «скільки це в гривнях», а «від якої величини і на яку дату ви рахували».", "why": "Ліміт минулого року, застосований до цього, — типова помилка, яку виявляють уже під час перевірки."}, {"id": "vat_window", "group": "Числа", "text": "Обсяг постачання за останні 12 календарних місяців перевірено окремо для порогу ПДВ", "critical": true, "hint": "Це окремий лічильник, не пов’язаний із лімітом групи. Зверніть увагу на період, за який його рахують.", "why": "Поріг ПДВ рахують ковзним вікном, тому 1 січня він не обнуляється — про це згадують надто пізно."}, {"id": "rate_source", "group": "Числа", "text": "Ставку першої або другої групи взято з рішення місцевої ради", "critical": false, "hint": "У Кодексі є лише верхня межа. Запитайте себе, чи бачили ви саме рішення ради, чи взяли максимум.", "why": "Ставка залежить від виду діяльності й ради, тому «максимум із Кодексу» для більшості міст буде неправильним числом."}, {"id": "cash_form", "group": "Умови утримання", "text": "Перевірено, що всі розрахунки відбувалися в грошовій формі", "critical": true, "hint": "Шукайте не лише бартер: взаємозалік, вексель і зустрічну послугу теж треба помітити.", "why": "Один негрошовий розрахунок дає і підвищену ставку на суму, і підставу для переходу на загальну систему."}, {"id": "employees_count", "group": "Умови утримання", "text": "Кількість найманих працівників перевірено на потрібний момент", "critical": false, "hint": "Для другої групи показник моментний, а не річний; окремі категорії працівників у підрахунок не входять.", "why": "Перевищення чисельності — самостійна підстава для переходу на загальну систему, і воно фіксується за фактом."}, {"id": "clients_second", "group": "Умови утримання", "text": "Для другої групи перевірено, кому саме надаються послуги", "critical": false, "hint": "Розділіть операції: послуги й продаж товарів мають різні обмеження щодо кола клієнтів.", "why": "Послуга не тому клієнту оподатковується за підвищеною ставкою і виштовхує на загальну систему."}, {"id": "switch_used", "group": "Строки й статус", "text": "Перевірено, чи використано право переходу на спрощену систему цього року", "critical": true, "hint": "Згадайте, що обмеження стосується саме переходу із загальної системи, а не зміни групи.", "why": "Друга спроба перейти в тому ж році — це відмова в реєстрації, а не просто затримка."}, {"id": "registry", "group": "Строки й статус", "text": "Висновок звірено із записом у реєстрі платників єдиного податку", "critical": true, "hint": "Джерелом тут є реєстр, а не слова клієнта й не ваш розрахунок. Дані оприлюднюються щоденно.", "why": "Розбіжність між уявленням і реєстром — найдешевший спосіб виявити втрату права до того, як це зробить податкова."}, {"id": "no_guess", "group": "Контроль якості", "text": "Жодне обмеження не оцінено з пам’яті", "critical": true, "hint": "Перегляньте свою роботу з Практики: чи немає висновку, поставленого «бо так було минулого разу».", "why": "Норми цієї теми змінюються щороку, і саме тут пам’ять підводить найчастіше."}, {"id": "handoff", "group": "Контроль якості", "text": "Остаточний вибір системи для клієнта передано бухгалтеру", "critical": false, "hint": "Згадайте межу: перевірка допустимості — ваша робота, рішення про вигоду — не завжди.", "why": "Допустимість перевіряють за нормою, а вигоду рахують на числах клієнта; змішувати ці дві дії небезпечно."}]}, "glossary": [{"term": "Загальна система", "definition": "Оподаткування доходів ФОП, де об’єктом є чистий оподатковуваний дохід — виручка мінус документально підтверджені витрати.", "example": "Підприємцю з великими підтвердженими витратами загальна система може бути вигіднішою.", "avoid": "«податок на прибуток» — прибуток підприємств до ФОП не застосовується"}, {"term": "Спрощена система", "definition": "Заміна сплати переліку податків на єдиний податок за умови відповідності вимогам і реєстрації.", "example": "Без реєстрації платником єдиного податку ФОП перебуває на загальній системі.", "avoid": "«пільга» — це окремий режим із власними обмеженнями, а не знижка"}, {"term": "Група єдиного податку", "definition": "Набір критеріїв — працівники, дозволена діяльність, ліміт доходу, — яким треба відповідати одночасно.", "example": "Не відповідаєте хоча б одному критерію — група не підходить.", "avoid": "«рівень» або «категорія на вибір» — критерії перевіряють сукупно"}, {"term": "Обсяг доходу", "definition": "Сума доходу за календарний рік, яку порівнюють із лімітом обраної групи.", "example": "Ліміт рахують від величини, встановленої законом на 1 січня року.", "avoid": "«оборот за 12 місяців» — це інший лічильник, він для порогу ПДВ"}, {"term": "Підвищена ставка", "definition": "Ставка 15% до доходу ФОП, отриманого з порушенням умов спрощеної системи.", "example": "Негрошовий розрахунок дає 15% на відповідну суму.", "avoid": "«штраф» — це ставка податку, а не санкція"}, {"term": "Поріг реєстрації платником ПДВ", "definition": "Сума операцій з постачання за останні 12 календарних місяців, після перевищення якої реєстрація обов’язкова.", "example": "Платники єдиного податку перших трьох груп під цей обов’язок не підпадають.", "avoid": "«за календарний рік» — період рахують ковзним вікном"}, {"term": "Неплатник ПДВ", "definition": "Особа, не зареєстрована платником ПДВ, яка не нараховує його на свої постачання.", "example": "Неплатник ПДВ усе одно сплачує його при ввезенні товарів.", "avoid": "«ніколи не має справи з ПДВ» — імпорт та окремі операції залишаються"}, {"term": "Реєстр платників єдиного податку", "definition": "Офіційне джерело даних про групу, ставку, дату обрання й види діяльності платника.", "example": "Дані оприлюднюють щоденно для безоплатного доступу.", "avoid": "«довідка від бухгалтера» — підтвердженням є запис у реєстрі"}, {"term": "Витяг з реєстру", "definition": "Документ з даними реєстру платників єдиного податку, який видають за запитом.", "example": "Витяг діє до внесення змін до реєстру.", "avoid": "«свідоцтво платника єдиного податку» — свідоцтв уже не видають"}, {"term": "Анулювання реєстрації", "definition": "Виключення особи з реєстру платників єдиного податку за заявою або за рішенням податкової.", "example": "Після анулювання за актом перевірки повернутися можна лише через чотири квартали.", "avoid": "«закриття ФОП» — підприємець залишається, змінюється лише система"}, {"term": "Чистий оподатковуваний дохід", "definition": "Різниця між загальним оподатковуваним доходом і документально підтвердженими витратами на загальній системі.", "example": "Саме від нього рахують і ПДФО, і військовий збір на загальній системі.", "avoid": "«прибуток» у побутовому значенні — склад витрат визначає норма, а не здоровий глузд"}, {"term": "Військовий збір", "definition": "Окремий платіж поряд з єдиним податком або ПДФО, зі своєю базою для кожної системи.", "example": "Для першої і другої груп він фіксований і не залежить від доходу.", "avoid": "«частина єдиного податку» — це окремий платіж із власною нормою"}]}}, {"index": 4, "id": "module-04", "level": 2, "slug": "module_04_dokumentuvannia_operatsii", "meta": {"schema": "course-module/v1", "id": "module-04", "level": 2, "title": "Документування господарської операції", "language": "uk", "version": "0.1.0", "status": "app_ready", "summary": "Навчіться перевіряти окремий документ: шість обовʼязкових реквізитів, межа неістотного недоліку, три різні дати, оригінал електронного документа й перевірка підпису.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "pending", "last_verified": "2026-09-06", "next_review": "2026-11-01", "depends_on": ["module-02"], "estimated_minutes": 60, "source_ids": ["SRC-010", "SRC-012", "SRC-017", "SRC-039", "SRC-040", "SRC-041", "SRC-042", "SRC-043", "SRC-044", "SRC-045", "SRC-046", "SRC-047", "SRC-048"], "outcomes": ["Пояснити, з якої норми випливає обовʼязок ФОП мати первинні документи", "Перевірити документ за переліком обовʼязкових реквізитів і відрізнити відсутній реквізит від неістотного недоліку", "Розрізнити дату складання документа, дату господарської операції і дату визнання доходу", "Визначити, що є оригіналом електронного документа, і перевірити підпис в офіційному сервісі", "Назвати дії та строки, коли документ втрачено або не отримано від контрагента"], "primary_source": {"id": "SRC-039", "note": "Стаття 9 Закону про бухгалтерський облік — прочитайте частину другу самостійно. Перелік обовʼязкових реквізитів займає шість рядків, і саме його переказують із зайвими пунктами частіше за будь-яку іншу норму курсу."}, "sessions": [{"title": "Сесія 1 · Звідки вимоги і що таке реквізит", "minutes": 25, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Приймання документа", "minutes": 20, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Форма, підпис і відсутній документ", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви перестанете приймати «фото в месенджері» за документ і знатимете, що робити в перші пʼять днів після втрати папки з документами.", "accountant": "Ви працюєте з клієнтами: це щоденна операція бухгалтера — приймання документа. Модуль дає перелік із шести реквізитів і межу, за якою недолік перестає бути неістотним.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете перевірити, чи справді бухгалтер вимагає від вас те, чого вимагає закон, а не застарілий чек-лист із інтернету."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Документування господарської операції\n\n## Мета\n\nНавчитися працювати з окремим документом як бухгалтер: розуміти, звідки взагалі беруться вимоги до нього, перевіряти реквізити, відрізняти дефект форми від відсутності документа, впізнавати оригінал електронного документа й діяти, коли документа немає.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. пояснити, з якої норми випливає обовʼязок ФОП мати первинні документи;\n2. перевірити документ за переліком обовʼязкових реквізитів і відрізнити відсутній реквізит від неістотного недоліку;\n3. розрізнити дату складання документа, дату господарської операції і дату визнання доходу;\n4. визначити, що є оригіналом електронного документа, і перевірити підпис в офіційному сервісі;\n5. назвати дії та строки, коли документ втрачено або не отримано від контрагента.\n\n## Передумови\n\nМодуль 2. Знадобиться поняття господарської операції та дати отримання доходу: документ підтверджує операцію, але дата доходу рахується за іншим правилом.\n\n## Основні терміни\n\n- **Господарська операція** — дія або подія, яка змінює структуру активів, зобовʼязань або власного капіталу. [SRC-017]\n- **Первинний документ** — документ, який містить відомості про господарську операцію. [SRC-017]\n- **Оригінал електронного документа** — електронний примірник з обовʼязковими реквізитами, у тому числі з підписом. [SRC-041]\n- **Неістотний недолік** — дефект оформлення, який не заважає ідентифікувати сторону й зрозуміти суть операції. [SRC-039]\n- **Кваліфікований електронний підпис (КЕП)** — підпис, який має презумпцію відповідності власноручному. [SRC-042]\n\n## Теоретичний матеріал\n\n### 1. Звідки в ФОП взагалі беруться вимоги до документів\n\nЦе перше, що треба зрозуміти, і це не очевидно.\n\nЗакон «Про бухгалтерський облік та фінансову звітність в Україні» поширюється на **юридичних осіб**, створених за законодавством України, на філії та представництва іноземних юридичних осіб і на операції з виконання бюджетів. [SRC-017] Фізичної особи-підприємця в цьому переліку немає. Положення про документальне забезпечення записів у бухгалтерському обліку теж адресоване підприємствам, їх обʼєднанням, госпрозрахунковим організаціям та бюджетним установам. [SRC-040]\n\nОбовʼязок ФОП мати документи встановлює інший закон. Податковий кодекс вимагає від **платників податків** вести облік доходів, витрат та інших показників на підставі первинних документів і прямо забороняє формувати показники податкової звітності на підставі даних, не підтверджених такими документами. [SRC-012] ФОП — платник податків, тому норма стосується його повністю.\n\n| | Кому адресовано | Що встановлює |\n|---|---|---|\n| Закон про бухгалтерський облік | юридичні особи [SRC-017] | що таке первинний документ і які в нього реквізити [SRC-039] |\n| Положення № 88 | підприємства й установи [SRC-040] | як створювати, підписувати, виправляти й зберігати документи |\n| Податковий кодекс | усі платники податків, зокрема ФОП [SRC-012] | обовʼязок вести облік за документами і зберігати їх |\n\n> [!PRINCIPLE]\n> Обовʼязок ФОП мати документ — податковий, а мова, якою описано сам документ, — бухгалтерська. Тому перелік реквізитів беруть із Закону про бухгалтерський облік, хоча цей Закон формально адресований не ФОП. Це фактичний стандарт перевірки, а не адресна норма: якщо в спорі йдеться про суму, це відмінність, яку варто обговорити з бухгалтером.\n\n### 2. Документ підтверджує операцію, а не навпаки\n\nПервинний документ — це документ, що містить відомості про **господарську операцію**. [SRC-017] Отже, спочатку є операція, а документ її фіксує. З цього випливають два практичні наслідки.\n\nПо-перше, документ без операції нічого не підтверджує. По-друге, операція без документа існує в реальності, але не існує для податкового обліку: показник, не підтверджений документом, у звітність вносити заборонено. [SRC-012]\n\nОкремо існують **зведені документи** — їх складають для контролю та впорядкування оброблення даних на підставі первинних. [SRC-039] Приклад із норми: при реалізації товарів за готівку допускається складати первинний документ не рідше одного разу на день на підставі даних касових апаратів і чеків. [SRC-040]\n\n### 3. Обовʼязкові реквізити: перелік, який варто знати напамʼять\n\nПервинні документи можуть бути складені в паперовій або в електронній формі й повинні мати такі обовʼязкові реквізити: [SRC-039]\n\n1. назва документа (форми);\n2. дата складання;\n3. назва підприємства, від імені якого складено документ;\n4. зміст та обсяг господарської операції, одиниця виміру господарської операції;\n5. посади і прізвища осіб, відповідальних за здійснення господарської операції і правильність її оформлення;\n6. особистий підпис або інші дані, що дають змогу ідентифікувати особу, яка брала участь у здійсненні господарської операції.\n\nШість позицій, не більше. Залежно від характеру операції до документа **можуть** включатися додаткові реквізити: печатка, номер документа, підстава для здійснення операції. [SRC-039] Слово «можуть» тут вирішальне.\n\n> [!RISK]\n> Двох звичних вимог у переліку **немає**. **Місце складання** виключено з обовʼязкових реквізитів Законом № 776-IX від 14.07.2020. **Печатка** — додатковий реквізит, а не обовʼязковий. [SRC-039] Чек-листи, які досі вимагають місце складання й печатку, повторюють редакцію норми, що діяла до 2020 року.\n\nЩе одна норма, свіжа й корисна для тих, хто надає послуги: якщо первинний документ містить інформацію про дату або період надання послуг, виконання робіт чи найму, відсутність підпису та посади **з боку замовника або наймача** не є порушенням вимог до оформлення — за умови, що такий порядок передбачено письмовим договором і операція відображена в обліку в періоді її здійснення. [SRC-039] Норму додано Законом № 4791-IX від 24.02.2026. Вона не діє щодо операцій, оплачуваних за рахунок публічних коштів, оренди державного або комунального майна, будівельного підряду, проєктно-вишукувальних робіт і договорів про пожертву чи благодійну допомогу. [SRC-039]\n\n### 4. Неістотний недолік: коли документ усе одно працює\n\nНеістотні недоліки в документі **не є підставою для невизнання господарської операції** — за умови, що вони не заважають ідентифікувати особу, яка брала участь в операції, і документ містить відомості про дату складання, назву сторони, від імені якої складено, зміст та обсяг операції. [SRC-039]\n\nПрактично це означає межу, яку треба відчувати:\n\n| Радше неістотний недолік | Радше відсутній реквізит |\n|---|---|\n| описка в назві вулиці | немає дати складання |\n| немає номера документа | не зрозуміло, від чийого імені документ |\n| немає печатки | не зрозуміло, за що саме гроші |\n| скорочено назву посади | немає жодних даних, які ідентифікують підписанта |\n\n> [!REMEMBER]\n> Перевірка неістотності — це перевірка **чотирьох речей**: чи можна ідентифікувати особу, чи є дата, чи є назва сторони, чи зрозумілі зміст і обсяг операції. Усе інше — деталі оформлення. [SRC-039]\n\n### 5. Три дати, які не збігаються\n\nЦе місце, де початківці помиляються найчастіше.\n\n| Дата | Що це | Звідки |\n|---|---|---|\n| Дата складання документа | обовʼязковий реквізит, день оформлення папірця чи файлу | [SRC-039] |\n| Дата господарської операції | день, коли послугу фактично надано, товар передано, робота виконана | випливає з суті операції |\n| Дата визнання доходу | для платника єдиного податку — день надходження коштів | [SRC-010] |\n\nТри дати можуть збігатися, а можуть розійтися на місяці: акт підписано в жовтні за роботу, виконану у вересні, а гроші прийшли в листопаді.\n\nОкремо про строк складання. Вимога складати первинний документ у момент операції або одразу після її закінчення **виключена** з Положення № 88 наказом Мінфіну № 467 від 28.12.2022. [SRC-040] Але з цього не випливає, що дату можна ставити будь-яку: відповідальність за **несвоєчасне** складання первинних документів і за недостовірність даних у них несуть особи, які їх склали й підписали. [SRC-039] [SRC-040]\n\n> [!RISK]\n> «Норму про момент складання скасували, отже дату можна поставити зручну» — небезпечний висновок. Скасовано конкретне правило про момент, а не обовʼязок документа відповідати дійсності. Дата, яка не відповідає реальній операції, — це недостовірні дані, за які відповідає той, хто підписав. [SRC-039]\n\n### 6. Паперовий і електронний документ: рівні за силою\n\nПервинні документи можуть бути складені в паперовій або в електронній формі. [SRC-039] Юридична сила електронного документа не може бути заперечена **виключно через те, що він має електронну форму**, і його допустимість як доказу теж. [SRC-041]\n\nПравочин вважається вчиненим у письмовій формі, якщо його зміст зафіксовано в одному або кількох документах, **у тому числі електронних**, або в листах, якими обмінялися сторони чи які надсилалися до інформаційно-комунікаційної системи. [SRC-046] Тобто «письмово» давно не означає «на папері».\n\nЩо саме належить робити письмово: правочини між юридичними особами; правочини між фізичною та юридичною особою, крім тих, що повністю виконуються в момент вчинення; правочини фізичних осіб між собою на суму понад двадцять неоподатковуваних мінімумів. [SRC-046] ФОП — фізична особа, тому його правочин із товариством за загальним правилом належить вчиняти письмово.\n\n> [!INFO]\n> Недодержання письмової форми **саме по собі не робить правочин недійсним**, крім випадків, прямо встановлених законом. [SRC-046] Але заперечення факту правочину не можна доводити свідченнями свідків — лише письмовими доказами, аудіо- й відеозаписом. [SRC-046] Тому «домовилися на словах» — це не недійсність, це неможливість довести.\n\n### 7. Оригінал електронного документа й що таке скан\n\nОригіналом електронного документа вважається електронний примірник документа з обовʼязковими реквізитами, у тому числі з електронним підписом автора або підписом, прирівняним до власноручного. [SRC-041]\n\nДалі — чотири норми, які майже завжди переказують неправильно:\n\n- якщо документ надіслано кільком адресатам або він зберігається на кількох носіях, **кожен примірник є оригіналом**; [SRC-041]\n- якщо автор створив ідентичні за змістом і реквізитами електронний документ і документ на папері, **кожен з них є оригіналом** і має однакову юридичну силу; [SRC-041]\n- **копією документа на папері для електронного документа** є візуальне подання електронного документа на папері, засвідчене в установленому порядку; [SRC-041]\n- оригінал електронного документа повинен давати змогу довести його **цілісність і справжність**. [SRC-041]\n\nЗвідси головний практичний висновок: **фотографія або скан підписаного паперу — не оригінал електронного документа**. Це зображення паперового документа. Воно може бути корисним, може підтверджувати домовленість, але оригіналом стає не файл, а те, що на папері.\n\n> [!PRINCIPLE]\n> Питання «це оригінал?» до електронного файлу означає одне: чи є в ньому обовʼязкові реквізити і чи накладено підпис, цілісність якого можна перевірити. [SRC-041] Формат файлу й спосіб доставки значення не мають.\n\n### 8. Три рівні електронного підпису\n\nЗакон розрізняє їх за тим, що саме підпис гарантує. [SRC-042]\n\n| Рівень | Що це | Що дає |\n|---|---|---|\n| Електронний підпис | електронні дані, які додаються до інших даних і використовуються підписувачем як підпис | найменше; юридичну силу не можна заперечити лише через форму |\n| Удосконалений | однозначно повʼязаний з підписувачем, дає змогу його ідентифікувати, створюється під одноосібним контролем, а будь-яка подальша зміна даних може бути виявлена | цілісність можна перевірити |\n| Кваліфікований (КЕП) | удосконалений підпис, створений засобом КЕП на основі кваліфікованого сертифіката | презумпція відповідності власноручному підпису |\n\nДві норми, які варто памʼятати дослівно:\n\n- **кваліфікований електронний підпис має таку саму юридичну силу, як і власноручний підпис, і має презумпцію його відповідності власноручному**; [SRC-042]\n- юридична сила та допустимість підпису як доказу **не можуть бути заперечені** виключно на тій підставі, що він має електронну форму або не відповідає вимогам до кваліфікованого. [SRC-042]\n\n> [!RISK]\n> «Без КЕП документ недійсний» — неправильне узагальнення. Закон вимагає саме кваліфікованого підпису в окремих випадках: для органів влади та їхніх посадових осіб, для правочинів, що підлягають нотаріальному посвідченню або державній реєстрації. [SRC-042] Поза цими випадками рівень підпису — питання ризику й домовленості сторін, а не автоматичної недійсності.\n\nНакладанням електронного підпису або печатки **завершується створення** електронного документа; якщо підписів кілька, документ створено після останнього. [SRC-041] Електронна печатка при цьому підтверджує не особу, а походження й цілісність документа. [SRC-041]\n\n### 9. Як перевірити підпис, а не повірити в нього\n\nПеревірка цілісності електронного документа проводиться шляхом **підтвердження** удосконаленого або кваліфікованого підпису чи печатки. [SRC-041] Тобто перевірка — це дія з файлом, а не погляд на нього.\n\nПрактичний порядок:\n\n1. Отримати сам файл документа і файл підпису, якщо підпис відокремлений.\n2. Відкрити сервіс перевірки підпису Центрального засвідчувального органу. [SRC-047]\n3. Завантажити файли й отримати результат: хто підписав, коли, чи не порушено цілісність.\n4. За потреби звірити надавача з **Довірчим списком** — переліком кваліфікованих надавачів електронних довірчих послуг. [SRC-047]\n\nКваліфікований підпис можна отримати, зокрема, у кваліфікованого надавача «Дія». [SRC-048]\n\n> [!REMEMBER]\n> Результат перевірки — це три відповіді: **хто**, **коли**, **чи змінювали**. Якщо сервіс каже, що цілісність порушено, документ після підписання редагували, і підпис більше нічого не підтверджує. [SRC-041]\n\n### 10. Оригінал, копія, дублікат, витяг\n\nТерміни визначено в Правилах організації діловодства — акті, обовʼязковому для установ усіх форм власності. ФОП він прямо не адресований, але саме ці визначення використовують у діловому обігу. [SRC-043]\n\n| Термін | Визначення |\n|---|---|\n| Оригінал | примірник документа з оригінальним підписом [SRC-043] |\n| Копія | документ, що містить точне знакове відтворення змісту або документної інформації іншого документа [SRC-043] |\n| Витяг | засвідчена копія **частини** тексту документа [SRC-043] |\n| Дублікат | повторно оформлений документ замість втраченого чи пошкодженого оригіналу, що має **таку саму юридичну силу** [SRC-043] |\n\nКопії поділяють на факсимільні (виготовлені технікою, точно відтворюють зовнішні ознаки) і вільні (передруковані, відтворюють зміст, але не зовнішній вигляд); вільна копія потребує засвідчення. [SRC-043] На дублікаті проставляється відмітка «Дублікат», а відмітка «Копія» — у правому верхньому куті першого аркуша. [SRC-043]\n\n> [!INFO]\n> Дублікат — це не «ще одна копія». Це заміна оригіналу з тією самою юридичною силою, оформлена тим, хто видав оригінал. Просити в контрагента «дублікат» замість «копії» — різні прохання. [SRC-043]\n\n### 11. Підпис, факсиміле й повноваження\n\nДокумент має бути підписаний особисто, підпис може бути скріплений печаткою; електронний підпис накладається за законодавством про електронні документи. [SRC-040]\n\nФаксимільне відтворення підпису допускається **лише** у випадках, встановлених законом та іншими актами цивільного законодавства, або за **письмовою згодою сторін, у якій містяться зразки відповідного аналога їхніх власноручних підписів**. [SRC-046] [SRC-040] Усна домовленість «ми ставимо факсиміле» цю вимогу не виконує.\n\nПовноваження особи, яка в інтересах ФОП або юридичної особи одержує товарно-матеріальні цінності, підтверджуються, зокрема, письмовим договором, довіреністю або актом органу юридичної особи. [SRC-040]\n\n### 12. Виправлення помилки\n\nПідчистки й необумовлені виправлення в документах не допускаються. [SRC-040] У паперовому документі виправлення робиться коректурним способом: неправильний текст закреслюється **однією рискою так, щоб його можна було прочитати**, зверху пишеться правильний. [SRC-040] Виправлення обумовлюється написом «виправлено», підтверджується підписами тих самих осіб, що підписали документ, із зазначенням дати виправлення. [SRC-040]\n\nДва обмеження, які легко пропустити:\n\n- у документах, якими оформлені **касові й банківські операції та операції з цінними паперами, виправлення не допускається** взагалі; [SRC-040]\n- в електронних документах під час виправлення має **зберігатися інформація, яка виправляється**, разом із датою виправлення й даними осіб, що склали виправлений документ. [SRC-040]\n\n### 13. Коли документа немає\n\nТри різні ситуації з різними наслідками.\n\n**Документ втрачено, пошкоджено або достроково знищено.** Платник податків зобовʼязаний у **пʼятиденний строк** з дня події письмово повідомити контролюючий орган за місцем обліку, додавши документи, що підтверджують подію, і **відновити** втрачені документи протягом **90 календарних днів** з дня, наступного за днем надходження повідомлення. [SRC-044] Якщо документи не відновлено або втрачено повторно після використання цього права, вважається, що їх **не було** на час складання звітності. [SRC-044]\n\n**Документи не надано під час перевірки.** Якщо платник не надає документи, що підтверджують показники звітності, — незалежно від причин, крім виїмки правоохоронними органами, — вважається, що таких документів у нього не було на час складання звітності. [SRC-044] Документи, надані після перевірки, але до прийняття рішення, мають бути враховані. [SRC-044]\n\n**Незабезпечення зберігання або ненадання документів.** Штраф — **1020 гривень**, а за повторне протягом року порушення — **2040 гривень**. [SRC-045] Строки зберігання визначено окремо: для більшості документів ФОП — 1095 днів, і це тема модуля 2. [SRC-012]\n\n> [!RISK]\n> Найдорожча помилка тут — мовчання. Пʼятиденний строк рахується від дня події, а не від дня, коли про втрату згадали перед перевіркою. Пропущений строк перетворює керовану ситуацію на відсутність документів. [SRC-044]\n\n### 14. Мова документа\n\nДля підприємств вимога однозначна: усі первинні документи складаються українською мовою, а документи іноземною мовою повинні мати впорядкований аутентичний переклад. [SRC-040] Для ФОП загальної норми такого змісту знайти не вдалося: Податковий кодекс вимагає перекладу лише в окремих випадках.\n\nПрактичний висновок для роботи: інвойс від іноземного контрагента зберігають разом із перекладом не тому, що є пряма норма для ФОП, а тому що без перекладу неможливо показати зміст операції під час перевірки. Це питання з переліку тих, які варто узгодити з бухгалтером — воно позначене в `references.md`.\n\n## Покроковий процес\n\nПриймання документа від контрагента:\n\n1. Визначити, яку саме господарську операцію документ підтверджує.\n2. Перевірити шість обовʼязкових реквізитів.\n3. Для кожного відсутнього — вирішити, це неістотний недолік чи відсутній реквізит.\n4. Перевірити три дати й зафіксувати, яка з них потрібна для обліку.\n5. Визначити форму: паперовий оригінал, електронний оригінал, копія, скан.\n6. Для електронного документа — перевірити підпис у сервісі ЦЗО.\n7. Звірити суму й зміст із договором і банківською випискою.\n8. Якщо чогось бракує — запитати виправлений документ або дублікат до закриття періоду.\n9. Зберегти документ так, щоб його можна було знайти й пред'явити.\n10. Якщо документ втрачено — відрахувати пʼять днів від дня події й діяти.\n\n## Практичні приклади\n\n### Приклад 1. Акт без печатки\n\nКонтрагент надіслав акт наданих послуг без печатки. Печатка — додатковий реквізит, а не обовʼязковий. [SRC-039] Якщо шість обовʼязкових реквізитів на місці, документ приймається; вимагати печатку немає підстав.\n\n### Приклад 2. Фотографія в месенджері\n\nЗамість документа надіслано фото підписаного паперу. Це не оригінал електронного документа — оригіналом є або сам папір, або електронний файл з накладеним підписом. [SRC-041] Фото зберігають як робочу інформацію, а оригінал запитують окремо.\n\n### Приклад 3. Дата акта не збігається з датою оплати\n\nАкт складено 30 вересня, гроші надійшли 12 жовтня. Для платника єдиного податку дохід визнається у жовтні — за датою надходження коштів. [SRC-010] Дата акта на це не впливає, а сам акт підтверджує зміст і обсяг операції.\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Вимагати місце складання як обовʼязковий реквізит | його виключено з переліку в 2020 році [SRC-039] | перевіряти шість реквізитів, а не сім |\n| Вважати печатку обовʼязковою | печатка — додатковий реквізит [SRC-039] | приймати документ без печатки, якщо решта на місці |\n| Вважати скан оригіналом електронного документа | оригінал — примірник з реквізитами й підписом [SRC-041] | запитати оригінал: папір або підписаний файл |\n| «Без КЕП документ недійсний» | силу підпису не можна заперечити лише через невідповідність вимогам до КЕП [SRC-042] | розрізняти випадки, де КЕП вимагає закон |\n| Ставити зручну дату, бо «норму про момент складання скасували» | відповідальність за несвоєчасне складання й недостовірність лишилася [SRC-039] [SRC-040] | ставити дату реальної операції |\n| Ставити факсиміле «за домовленістю» | потрібна письмова згода зі зразками підписів [SRC-046] | оформити згоду або підписувати особисто |\n| Замазувати помилку коректором | підчистки й необумовлені виправлення не допускаються [SRC-040] | закреслити однією рискою, написати «виправлено», підписати |\n| Виправляти касовий документ | у касових і банківських документах виправлення не допускається [SRC-040] | оформити документ наново |\n| Мовчати про втрату документів до перевірки | пʼятиденний строк іде від дня події [SRC-044] | повідомити ДПС і відновлювати протягом 90 днів |\n| Плутати копію з дублікатом | дублікат замінює оригінал і має ту саму силу [SRC-043] | просити саме те, що потрібно |\n\n## Ризики й межі самостійних дій\n\n- Модуль не розглядає конкретні види документів — це модуль 5, і саме там зʼявляться рахунок, акт, накладна й інвойс.\n- Договір як документ — модуль 6; електронний архів, іменування файлів і резервні копії — модуль 7.\n- Перелік обовʼязкових реквізитів установлено Законом, адресованим юридичним особам. Для ФОП це фактичний стандарт перевірки, а не адресна норма; у спорі про суму цю відмінність варто обговорити з бухгалтером.\n- Вимога складати документи українською міститься в акті, адресованому підприємствам; загальної норми для ФОП не знайдено.\n- Норма про відсутність підпису замовника в документах про послуги діє в бухгалтерському обліку контрагента; чи може ФОП-виконавець спиратися на неї, потребує підтвердження бухгалтера.\n- Наступна редакція Податкового кодексу призначена на 1 листопада 2026 року; після цієї дати норми модуля треба звірити наново.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, щоб оцінити, чи достатньо наявних документів для конкретної операції, вирішити долю періоду з відсутнім документом і підготувати пакет до перевірки.\n\n**Юрист потрібен**, якщо контрагент відмовляється підписувати документ за виконаною роботою, якщо йдеться про спір щодо факту правочину або про виїмку документів правоохоронними органами.\n\n## Підсумок\n\nДокумент у бухгалтерії ФОП — це не формальність, а єдиний спосіб показати, що операція була саме такою. Вимоги до нього приходять із двох різних законів, і саме тому їх легко переплутати. Практична робота зводиться до трьох питань: чи є шість реквізитів, яку саме дату брати і чи можна перевірити підпис. Усе інше — деталі оформлення, які не руйнують документ.\n\n## Самоперевірка\n\n1. З якої норми випливає обовʼязок ФОП мати первинні документи?\n2. Назвіть шість обовʼязкових реквізитів. Чи є серед них місце складання?\n3. Чим неістотний недолік відрізняється від відсутнього реквізиту?\n4. Які три дати можуть не збігатися й для чого потрібна кожна?\n5. Чи є скан підписаного паперу оригіналом електронного документа?\n6. Що дає кваліфікований електронний підпис порівняно з удосконаленим?\n7. Як перевірити підпис на отриманому файлі?\n8. Чим дублікат відрізняється від копії?\n9. Що і в який строк робити, якщо документи втрачено?\n10. Коли виправлення в документі не допускається взагалі?\n\n## Джерела\n\nПерелік джерел і твердження, які вони підтверджують, — у `references.md`. Використані ідентифікатори: SRC-010, SRC-012, SRC-017, SRC-039, SRC-040, SRC-041, SRC-042, SRC-043, SRC-044, SRC-045, SRC-046, SRC-047, SRC-048.\n\n## Дата перевірки актуальності\n\nДата перевірки актуальності: **2026-09-06**\nНаступна перевірка: **2026-11-01**"}, {"id": "practice", "title": "Практика", "content": "# Практика: приймання акта наданих послуг\n\n## Мета\n\nНавчитися перевіряти конкретний документ за переліком обовʼязкових реквізитів і відрізняти три різні речі: відсутній обовʼязковий реквізит, реквізит поза переліком і неістотний недолік.\n\n## Навчальна ситуація\n\nДані синтетичні. Не використовуйте реальні відомості про себе чи клієнтів.\n\n**ФОП Ковальчук Ірина Петрівна** отримала 5 жовтня 2026 року від замовника файл `akt-09.pdf`. Це відсканована сторінка з підписом від руки; електронного підпису на файлі немає.\n\n| Рядок | Що є в документі |\n|---|---|\n| 1 | «Акт наданих послуг за вересень 2026 року» |\n| 2 | дати складання немає |\n| 3 | номера документа немає |\n| 4 | «м. Львів» |\n| 5 | «Виконавець: ФОП Ковальчук Ірина Петрівна» |\n| 6 | «Підготовка рекламних макетів — 12 макетів на суму 24 000 грн» |\n| 7 | замовника названо «ТОВ Гранд-Медія» замість «ТОВ Гранд-Медіа»; решта даних збігається з договором |\n| 8 | відбитка печатки немає |\n| 9 | підпис виконавця, прізвище і посада «фізична особа-підприємець» |\n| 10 | місця для підпису замовника немає; письмовий договір від 02.03.2026 передбачає, що акт складає виконавець |\n\nДодатково: банківської виписки за вересень і жовтень у пакеті немає.\n\n## Завдання 1. Оцініть кожен рядок\n\nДля кожного рядка виберіть один із чотирьох висновків:\n\n- **наявний** — обовʼязковий реквізит на місці;\n- **бракує** — обовʼязкового реквізиту немає;\n- **додатковий** — цього немає в переліку обовʼязкових реквізитів;\n- **неістотний** — недолік є, але він не заважає визнати операцію.\n\nДля кожного висновку вкажіть джерело.\n\n## Завдання 2. Дайте відповідь на два питання про форму\n\n1. Скільки обовʼязкових реквізитів установлює норма?\n2. Чим є надісланий файл: оригіналом електронного документа чи чимось іншим?\n\n## Завдання 3. Знайдіть те, чого немає в даних\n\nДва значення визначити неможливо: одного бракує в пакеті, друге виходить за межі модуля. Позначте їх як такі, що потребують окремої перевірки, і не вигадуйте відповідь.\n\n## Критерії виконання\n\n- кожен рядок має висновок із зазначеним джерелом;\n- відсутній обовʼязковий реквізит відокремлено від того, чого в переліку взагалі немає;\n- описка оцінена за чотирма ознаками неістотності, а не «на око»;\n- жодне значення, якого немає в даних, не заповнене припущенням."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Ми ж надіслали скан»\n\n## Ситуація\n\nБогдан — ФОП третьої групи, розробляє сайти. У жовтні клієнт просить пакет документів за минулий рік, і Богдан вперше дивиться на власний архів уважно.\n\nЩо зʼясувалося:\n\n- частина актів за минулий рік існує лише як фотографії в месенджері;\n- папку з паперовими документами за 2025 рік залито й викинуто ще в серпні — нікого про це не повідомляли;\n- один акт підписано факсимільним штампом, письмової згоди сторін про факсиміле немає;\n- в акті за липень немає дати складання;\n- в акті за серпень виправлено суму: попереднє число замазано коректором;\n- інвойс від іноземного клієнта зберігається без перекладу;\n- в іншому акті немає печатки — Богдан вирішив, що документ треба переробляти;\n- у назві вулиці замовника описка: «Городоцка» замість «Городоцька».\n\nДані синтетичні.\n\n## Завдання\n\n1. Знайдіть справжні ризики й відокремте їх від того, що лише виглядає проблемою.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Побудуйте безпечну послідовність дій.\n4. Поясніть, чому втрата папки в серпні — найтерміновіша позиція в цьому списку.\n\n## Орієнтир для самоперевірки\n\n- фотографія паперу не є оригіналом електронного документа, і замінити оригінал вона не може;\n- про втрату документів повідомляють контролюючий орган у пʼятиденний строк від дня події, а відновлюють протягом 90 днів;\n- факсиміле потребує письмової згоди сторін зі зразками підписів;\n- дата складання — обовʼязковий реквізит, а печатка — ні;\n- підчистки й необумовлені виправлення не допускаються; у касових і банківських документах виправлення не допускається взагалі;\n- описка, яка не заважає ідентифікувати сторону й зрозуміти операцію, є неістотним недоліком.\n\nЦе навчальний кейс, а не індивідуальна податкова консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст приймання документа від контрагента\n\n## Що це за операція\n\n- [ ] Визначено, яку саме господарську операцію документ підтверджує.\n- [ ] Документ звірено з договором: сторони, предмет, сума.\n- [ ] Зрозуміло, який період операції охоплює документ.\n\n## Шість реквізитів\n\n- [ ] Назва документа є.\n- [ ] Дата складання є.\n- [ ] Назва сторони, від імені якої складено документ, є.\n- [ ] Зміст, обсяг операції та одиниця виміру зрозумілі з тексту.\n- [ ] Посади й прізвища відповідальних осіб зазначено.\n- [ ] Є підпис або інші дані, що дають змогу ідентифікувати підписанта.\n\n## Форма й підпис\n\n- [ ] Визначено форму: паперовий оригінал, електронний оригінал, копія чи скан.\n- [ ] Для електронного документа підпис перевірено в офіційному сервісі.\n- [ ] Зафіксовано результат перевірки: хто підписав, коли, чи не порушено цілісність.\n- [ ] Перевірено, чи не використано факсиміле без письмової згоди сторін.\n\n## Дати\n\n- [ ] Дату складання документа записано окремо від дати операції.\n- [ ] Для обліку доходу взято дату надходження коштів, а не дату документа.\n- [ ] Немає дати, яка суперечить фактичним обставинам операції.\n\n## Що робити з розбіжністю\n\n- [ ] Для кожного відсутнього реквізиту вирішено: неістотний недолік чи відсутній реквізит.\n- [ ] Для відсутніх реквізитів надіслано запит на виправлений документ або дублікат.\n- [ ] Зафіксовано дату запиту й дедлайн до закриття періоду.\n- [ ] Втрачені документи, якщо такі є, взято на облік із датою події.\n\n## Контроль якості\n\n- [ ] Жоден реквізит не оцінено з памʼяті — перевірку зроблено за переліком.\n- [ ] Вимоги, яких у переліку немає, не висувалися контрагенту.\n- [ ] Документ збережено так, що його можна знайти й пред'явити."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 4\n\n**Господарська операція** — дія або подія, яка викликає зміни в структурі активів та зобовʼязань або власного капіталу. Спочатку операція, потім документ про неї.\n\n**Первинний документ** — документ, який містить відомості про господарську операцію. Не «будь-який папір від контрагента», а саме свідчення про операцію.\n\n**Зведений документ** — документ, складений на підставі кількох первинних для контролю та впорядкування оброблення даних.\n\n**Обовʼязкові реквізити** — шість елементів, без яких документ не виконує свою функцію: назва документа, дата складання, назва сторони, зміст і обсяг операції з одиницею виміру, посади й прізвища відповідальних, підпис або інші дані для ідентифікації.\n\n**Додатковий реквізит** — елемент, який може бути в документі залежно від характеру операції: печатка, номер документа, підстава для здійснення операції.\n\n**Неістотний недолік** — дефект оформлення, який не заважає ідентифікувати особу й зрозуміти дату, сторону, зміст і обсяг операції. Не є підставою для невизнання операції.\n\n**Оригінал електронного документа** — електронний примірник з обовʼязковими реквізитами, у тому числі з підписом. Кожен із надісланих примірників — теж оригінал.\n\n**Візуальна форма** — відображення електронного документа на екрані або на папері у формі, придатній для сприйняття людиною. Сама по собі оригіналом не є.\n\n**Копія** — документ, що містить точне знакове відтворення змісту або документної інформації іншого документа.\n\n**Витяг** — засвідчена копія частини тексту документа.\n\n**Дублікат** — повторно оформлений документ замість втраченого чи пошкодженого оригіналу; має таку саму юридичну силу і відмітку «Дублікат».\n\n**Електронний підпис** — електронні дані, які додаються до інших даних і використовуються підписувачем як підпис.\n\n**Удосконалений електронний підпис** — підпис, однозначно повʼязаний із підписувачем, створений під його одноосібним контролем, який дає змогу виявити будь-яку подальшу зміну даних.\n\n**Кваліфікований електронний підпис (КЕП)** — удосконалений підпис, створений засобом КЕП на основі кваліфікованого сертифіката; має презумпцію відповідності власноручному підпису.\n\n**Електронна печатка** — засіб підтвердження достовірності походження та цілісності електронного документа. Підтверджує не особу, а документ.\n\n**Довірчий список** — перелік кваліфікованих надавачів електронних довірчих послуг, за яким перевіряють статус надавача."}, {"id": "reference", "title": "Пам’ятка", "content": "# Памʼятка: приймання документа\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-09-06**\n\n## Шість обовʼязкових реквізитів\n\n1. Назва документа (форми).\n2. Дата складання.\n3. Назва сторони, від імені якої складено документ.\n4. Зміст і обсяг операції, одиниця виміру.\n5. Посади й прізвища відповідальних осіб.\n6. Підпис або інші дані для ідентифікації підписанта.\n\n**Не входять до переліку:** місце складання, печатка, номер документа. Печатка, номер і підстава — додаткові реквізити «за потреби».\n\n## Неістотний недолік\n\nНедолік неістотний, якщо збережено чотири речі:\n\n- можна ідентифікувати особу, яка брала участь в операції;\n- є дата складання;\n- є назва сторони, від імені якої складено документ;\n- зрозумілі зміст і обсяг операції.\n\nНеістотний недолік не є підставою для невизнання операції.\n\n## Три дати\n\n| Дата | Що означає |\n|---|---|\n| складання документа | коли оформлено папір або файл |\n| господарської операції | коли послугу надано, товар передано |\n| визнання доходу | для єдинника — коли надійшли кошти |\n\n## Форма й підпис\n\n| Що отримано | Це оригінал? |\n|---|---|\n| Підписаний папір | так |\n| Електронний файл з накладеним підписом | так; кожен примірник — оригінал |\n| Скан або фото підписаного паперу | ні, це зображення |\n| Роздрук електронного документа | копія на папері, потребує засвідчення |\n\nТри рівні підпису: електронний → удосконалений (цілісність перевіряється) → кваліфікований (презумпція відповідності власноручному).\n\nПеревірка підпису = три відповіді: **хто**, **коли**, **чи змінювали**.\n\n## Оригінал, копія, дублікат, витяг\n\n- **копія** — точне відтворення змісту;\n- **витяг** — засвідчена копія частини тексту;\n- **дублікат** — заміна втраченого оригіналу з тією самою силою і відміткою «Дублікат».\n\n## Виправлення\n\n- підчистки й необумовлені виправлення заборонені;\n- у паперовому: закреслити однією рискою так, щоб читалося, написати правильне, поставити «виправлено», підпис і дату;\n- у касових і банківських документах виправлення **не допускається**;\n- в електронному має зберігатися те, що виправляли.\n\n## Якщо документа немає\n\n| Ситуація | Дія |\n|---|---|\n| Документ втрачено або знищено | повідомити ДПС письмово протягом **5 днів** від дня події |\n| Після повідомлення | відновити протягом **90 календарних днів** |\n| Не відновлено | вважається, що документів не було |\n| Не надано під час перевірки | вважається, що документів не було |\n| Незабезпечення зберігання чи ненадання | штраф **1020 грн**, повторно за рік — **2040 грн** |\n\n## Чого не робити\n\n- не вимагати печатку й місце складання як обовʼязкові;\n- не приймати фото в месенджері замість оригіналу;\n- не ставити зручну дату замість реальної;\n- не використовувати факсиміле без письмової згоди зі зразками підписів;\n- не мовчати про втрату документів."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 4\n\nПеревірено: **2026-09-06**. Кожна норма звірена з повним текстом на `zakon.rada.gov.ua` (сторінка «Текст для друку»). Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Податкового кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Закон про бухгалтерський облік поширюється на юридичних осіб | SRC-017, стаття 2 | Норма закону | ФОП у переліку немає |\n| Первинний документ — документ, що містить відомості про господарську операцію | SRC-017, стаття 1 | Норма закону | Господарська операція визначена там само |\n| Обовʼязок платника податків вести облік на підставі первинних документів | SRC-012, пункт 44.1 | Норма закону | Саме звідси обовʼязок ФОП |\n| Заборона формувати показники звітності без підтверджувальних документів | SRC-012, пункт 44.1 | Норма закону | Абзац другий |\n| Положення № 88 адресоване підприємствам, обʼєднанням і установам | SRC-040, пункт 1.1 | Норма підзаконного акта | Не адресоване ФОП |\n| Шість обовʼязкових реквізитів первинного документа | SRC-039, частина друга статті 9 | Норма закону | Місця складання серед них немає з 14.07.2020 |\n| Печатка, номер і підстава — додаткові реквізити | SRC-039, частина друга статті 9 | Норма закону | Слово «можуть» |\n| Первинні документи можуть бути в паперовій або електронній формі | SRC-039, частина друга статті 9 | Норма закону | Форми рівні за силою |\n| Відсутність підпису замовника послуг, робіт або наймача за письмовим договором не є порушенням | SRC-039, частина друга статті 9 | Норма закону | Додано Законом № 4791-IX від 24.02.2026; винятки — публічні кошти, оренда державного майна, будівельний підряд, пожертва |\n| Неістотні недоліки не є підставою для невизнання операції | SRC-039, частина друга статті 9 | Норма закону | Умова — ідентифікація особи, дата, назва сторони, зміст і обсяг |\n| Відповідальність за несвоєчасне складання й недостовірність даних | SRC-039, частина восьма статті 9; SRC-040, пункт 2.13 | Норма закону й підзаконного акта | Несе той, хто склав і підписав |\n| Вимогу складати документ у момент операції виключено | SRC-040, глава 2 | Норма підзаконного акта | Виключено наказом Мінфіну № 467 від 28.12.2022 |\n| Зведені документи складаються на підставі первинних | SRC-039, частина перша статті 9; SRC-040, пункт 2.1 | Норма закону | Для готівкових продажів — не рідше разу на день |\n| Для платника єдиного податку дохід визнається за датою надходження коштів | SRC-010, пункт 292.6 | Норма закону | Дата документа на це не впливає |\n| Юридичну силу електронного документа не можна заперечити через форму | SRC-041, стаття 8 | Норма закону | Те саме щодо допустимості як доказу |\n| Оригінал електронного документа — примірник з реквізитами й підписом | SRC-041, стаття 7 | Норма закону | Кожен надісланий примірник — оригінал |\n| Копія на папері для електронного документа — засвідчене візуальне подання | SRC-041, стаття 7 | Норма закону | Скан паперу під це визначення не підпадає |\n| Створення електронного документа завершується накладанням підпису | SRC-041, стаття 6 | Норма закону | За кількох підписів — після останнього |\n| Перевірка цілісності — це підтвердження удосконаленого або кваліфікованого підпису | SRC-041, стаття 12 | Норма закону | Перевірка є дією, а не оглядом |\n| Три рівні підпису: електронний, удосконалений, кваліфікований | SRC-042, стаття 1, стаття 17-1 | Норма закону | Вимоги до удосконаленого — чотири умови |\n| КЕП має презумпцію відповідності власноручному підпису | SRC-042, частина шоста статті 18 | Норма закону | Не «замінює», а має презумпцію |\n| Силу підпису не можна заперечити через невідповідність вимогам до КЕП | SRC-042, частина сьома статті 17, частина пʼята статті 18 | Норма закону | Спростовує тезу «без КЕП недійсно» |\n| КЕП обовʼязковий для правочинів, що підлягають нотаріальному посвідченню чи держреєстрації | SRC-042, частина шоста статті 17 | Норма закону | Окремий випадок, не загальне правило |\n| Перевірка підпису та Довірчий список | SRC-047 | Вебсервіс державного органу | Інтерфейс у модулі не описується |\n| КЕП можна отримати в кваліфікованого надавача «Дія» | SRC-048 | Вебпослуга | Названо як приклад, не як єдиний спосіб |\n| Оригінал, копія, витяг і дублікат: визначення | SRC-043, пункт 2 розділу I, пункти 11–13 глави 11 розділу II | Норма підзаконного акта | Адресат — установи; для ФОП це термінологічний орієнтир |\n| Правочин може вчинятися усно або в письмовій (електронній) формі | SRC-046, стаття 205 | Норма закону | Письмово ≠ на папері |\n| Письмова форма — зміст у документах, у тому числі електронних | SRC-046, стаття 207 | Норма закону | Разом із листуванням сторін |\n| Правочини фізичної особи з юридичною належить вчиняти письмово | SRC-046, стаття 208 | Норма закону | Виняток — правочини, що виконуються в момент вчинення |\n| Факсиміле — лише за законом або за письмовою згодою зі зразками підписів | SRC-046, стаття 207; SRC-040, пункт 2.4 | Норма закону | Усної домовленості недостатньо |\n| Недодержання письмової форми не тягне недійсності, але свідків не заслуховують | SRC-046, статті 218 | Норма закону | Питання доказування, не дійсності |\n| Підчистки й необумовлені виправлення не допускаються | SRC-040, пункт 4.1 | Норма підзаконного акта | Коректор і замазування — саме цей випадок |\n| Порядок коректурного виправлення | SRC-040, пункти 4.4 і 4.7 | Норма підзаконного акта | Однією рискою, «виправлено», підпис, дата |\n| У касових і банківських документах виправлення не допускається | SRC-040, пункт 4.8 | Норма підзаконного акта | Разом з операціями з цінними паперами |\n| В електронних документах виправлення зберігає попередню інформацію | SRC-040, пункт 4.10 | Норма підзаконного акта | Разом із датою й даними осіб |\n| Втрата документів: 5 днів на повідомлення, 90 днів на відновлення | SRC-044, пункт 44.5 | Норма закону | Строк іде від дня події |\n| Невідновлені документи вважаються відсутніми на час складання звітності | SRC-044, пункт 44.5 | Норма закону | Так само при повторній втраті |\n| Ненадання документів під час перевірки прирівнюється до їх відсутності | SRC-044, пункт 44.6 | Норма закону | Виняток — виїмка правоохоронними органами |\n| Штраф 1020 грн, повторно за рік — 2040 грн | SRC-045, пункт 121.1 | Норма закону | У Кодексі задано сумою, не формулою |\n| Мова первинних документів і аутентичний переклад | SRC-040, пункт 1.4 | Норма підзаконного акта | Адресат — підприємства; для ФОП загальної норми не знайдено |\n| Повноваження одержувача цінностей підтверджуються договором, довіреністю або актом | SRC-040, пункт 2.4 | Норма підзаконного акта | Довіреність як документ — модуль 5 |\n\n## Межі перевірки\n\n- **Перелік обовʼязкових реквізитів адресовано юридичним особам.** Стаття 9 Закону № 996-XIV поширюється на осіб, визначених статтею 2 цього Закону, серед яких ФОП немає. Обовʼязок ФОП мати первинні документи випливає з пункту 44.1 ПКУ, але переліку реквізитів Кодекс не містить. Модуль подає перелік як фактичний стандарт перевірки з явним застереженням; це питання винесено на людську перевірку.\n- **Мова документа.** Вимога складати документи українською та мати аутентичний переклад міститься в пункті 1.4 Положення № 88, адресованому підприємствам. Загальної норми такого змісту для ФОП не знайдено; ПКУ вимагає перекладу лише в окремих випадках (документація з трансфертного ціноутворення, підтвердні документи у відрядженні).\n- **Норма про відсутність підпису замовника** (Закон № 4791-IX від 24.02.2026) регулює вимоги до оформлення первинного документа у сфері бухгалтерського обліку. Чи може ФОП-виконавець спиратися на неї в спорі з контролюючим органом, у модулі не стверджується.\n- **Строки зберігання документів** у модулі не переглядалися: висновок про 1095 днів для ФОП зроблено в модулі 2 методом виключення з підпунктів 44.3.2 і 44.3.3 і залишається відкритим питанням того модуля.\n- **Види документів** — рахунок, акт, накладна, ТТН, інвойс, довіреність — у модулі не описуються: це модуль 5. Приклади наведено лише як ілюстрацію реквізитів.\n- **Інтерфейси сервісів** перевірки підпису та отримання КЕП не описуються покроково: описано дію й результат. Дати наступної перевірки для SRC-047 і SRC-048 — 90 днів."}], "quiz": [{"id": "m04-q01", "title": "Звідки обовʼязок", "competency": "doc_source_of_duty", "scenario": "ФОП на спрощеній системі запитує, чому він взагалі має зберігати акти, якщо бухгалтерський облік не веде.", "question": "Яка норма створює для нього цей обовʼязок?", "options": [{"text": "Закон про бухгалтерський облік, дія якого поширюється також на підприємців", "feedback": "Ні. Стаття 2 цього Закону називає юридичних осіб, філії іноземних компаній і бюджетні операції."}, {"text": "Податковий кодекс: облік показників ведеться на підставі первинних документів", "correct": true, "feedback": "Правильно. Пункт 44.1 адресований платникам податків, і ФОП є платником податків."}, {"text": "Положення про документальне забезпечення записів у бухгалтерському обліку", "feedback": "Ні. Це Положення адресоване підприємствам, їх обʼєднанням та бюджетним установам."}], "explanation": "Обовʼязок вести облік на підставі первинних документів і заборона формувати показники звітності без них містяться в пункті 44.1 Податкового кодексу. Закон про бухгалтерський облік дає визначення документа й перелік реквізитів, але поширюється на юридичних осіб.", "source_reference": ["SRC-012", "SRC-017", "SRC-039"], "hint": "Подумайте, у якій ролі ФОП підпадає під норму: як субʼєкт бухгалтерського обліку чи як хтось інший."}, {"id": "m04-q02", "title": "Печатка на акті", "competency": "doc_requisites", "scenario": "Замовник відмовляється приймати акт від ФОП, бо на документі немає відбитка печатки.", "question": "Чи має ця вимога підставу в нормі про реквізити?", "options": [{"text": "Так, печатка входить до переліку обовʼязкових реквізитів первинного документа", "feedback": "Ні. Перелік обовʼязкових реквізитів складається з шести позицій, і печатки серед них немає."}, {"text": "Так, якщо ФОП виготовив собі печатку й зазначив її у своїх реквізитах у договорі", "feedback": "Ні. Наявність печатки в підприємця не переносить її до переліку обовʼязкових реквізитів."}, {"text": "Ні, печатка названа серед реквізитів, які можуть включатися за потреби", "correct": true, "feedback": "Правильно. Печатка, номер документа й підстава операції є додатковими реквізитами."}], "explanation": "Норма містить шість обовʼязкових реквізитів, а далі окремо перелічує ті, що можуть включатися залежно від характеру операції та технології обробки: печатка, номер документа, підстава для здійснення операції.", "source_reference": ["SRC-039"], "hint": "Зверніть увагу на дієслово в абзаці, який починається словом «залежно»: воно й розділяє два переліки."}, {"id": "m04-q03", "title": "Описка в назві", "competency": "doc_minor_defect", "scenario": "В акті на 18 000 грн назву замовника надруковано з опискою, решта даних збігається з договором.", "question": "Як це впливає на визнання господарської операції?", "options": [{"text": "Не впливає: недолік неістотний, якщо сторону можна ідентифікувати", "correct": true, "feedback": "Правильно. Норма прямо називає неістотні недоліки такими, що не є підставою для невизнання."}, {"text": "Операція не визнається, поки контрагент не надішле виправлений документ", "feedback": "Ні. Такий наслідок норма повʼязує з відсутністю відомостей, а не з опискою в них."}, {"text": "Операція визнається лише в частині, підтвердженій банківською випискою", "feedback": "Ні. Такого правила часткового визнання за опискою в документі норма не містить."}], "explanation": "Неістотні недоліки не є підставою для невизнання операції за умови, що вони не заважають ідентифікувати особу і документ містить дату складання, назву сторони, зміст та обсяг операції.", "source_reference": ["SRC-039"], "hint": "Пригадайте чотири умови, які перевіряють перед тим, як назвати дефект документа дрібним."}, {"id": "m04-q04", "title": "Дата акта і дата доходу", "competency": "doc_three_dates", "scenario": "Акт складено 30 вересня за роботу серпня, кошти надійшли на рахунок 12 жовтня.", "question": "У якому місяці платник єдиного податку відображає дохід?", "options": [{"text": "У серпні, бо саме тоді роботу було фактично виконано для замовника", "feedback": "Ні. Період фактичного виконання визначає зміст операції, але не дату визнання доходу."}, {"text": "У вересні, бо дата складання документа є обовʼязковим реквізитом акта", "feedback": "Ні. Дата складання потрібна для оформлення документа, а не для визначення доходу."}, {"text": "У жовтні, бо дохід єдинника визнають за датою надходження коштів", "correct": true, "feedback": "Правильно. Три дати можуть розійтися, і для доходу береться саме дата оплати."}], "explanation": "Дата складання документа, дата господарської операції і дата визнання доходу — три різні дати. Для платника єдиного податку дохід визнається за датою надходження коштів, тому дата акта на це не впливає.", "source_reference": ["SRC-010", "SRC-039"], "hint": "Порівняйте, яка з подій цієї ситуації змінює залишок на рахунку підприємця."}, {"id": "m04-q05", "title": "Скан замість документа", "competency": "doc_electronic_original", "scenario": "Контрагент надіслав поштою якісний скан підписаного паперового акта у форматі PDF.", "question": "Чи є цей файл оригіналом електронного документа?", "options": [{"text": "Ні, це зображення паперу: оригіналом лишається підписаний папір", "correct": true, "feedback": "Правильно. Оригінал електронного документа має власні реквізити й накладений підпис."}, {"text": "Так, якщо файл читабельний і на зображенні добре видно підпис сторони", "feedback": "Ні. Якість зображення не створює електронного документа з фотографії паперу."}, {"text": "Так, оскільки сторони домовилися обмінюватися документами електронною поштою", "feedback": "Ні. Домовленість про канал обміну не змінює природи надісланого файлу."}], "explanation": "Оригіналом електронного документа є електронний примірник з обовʼязковими реквізитами, у тому числі з електронним підписом автора. Скан підписаного паперу таких ознак не має: він лише відтворює паперовий документ.", "source_reference": ["SRC-041"], "hint": "Поставте файлу одне питання: чи можна перевірити на ньому цілісність і автора засобами підпису."}, {"id": "m04-q06", "title": "Рівень підпису", "competency": "doc_signature_levels", "scenario": "Партнер підписав електронний договір удосконаленим підписом, а не кваліфікованим.", "question": "Який наслідок це має для сили документа?", "options": [{"text": "Документ недійсний: для електронної форми потрібен кваліфікований підпис", "feedback": "Ні. Такого загального правила недійсності через рівень підпису закон не встановлює."}, {"text": "Силу підпису не можна заперечити лише через невідповідність вимогам до КЕП", "correct": true, "feedback": "Правильно. Різниця в тому, що презумпцію відповідності власноручному підпису дає КЕП."}, {"text": "Документ дійсний, але потребує додаткового підтвердження від надавача послуг", "feedback": "Ні. Такої вимоги про додаткове підтвердження для удосконаленого підпису немає."}], "explanation": "Юридична сила й допустимість підпису як доказу не можуть бути заперечені виключно через електронну форму або невідповідність вимогам до кваліфікованого підпису. Кваліфікований підпис відрізняється презумпцією відповідності власноручному.", "source_reference": ["SRC-042"], "hint": "Розрізніть два різні питання: чи має підпис силу і яку саме перевагу дає найвищий рівень."}, {"id": "m04-q07", "title": "Що дає перевірка", "competency": "doc_signature_check", "scenario": "Бухгалтер завантажив отриманий файл і файл підпису до офіційного сервісу перевірки.", "question": "Що саме показує результат такої перевірки?", "options": [{"text": "Що документ оформлено з дотриманням переліку обовʼязкових реквізитів", "feedback": "Ні. Реквізити перевіряє людина за текстом документа, а не сервіс перевірки підпису."}, {"text": "Хто підписав документ, коли це сталося і чи не порушено його цілісність", "correct": true, "feedback": "Правильно. Перевірка цілісності здійснюється підтвердженням самого підпису чи печатки."}, {"text": "Що контрагент має чинну реєстрацію та не має податкового боргу", "feedback": "Ні. Стан контрагента як платника перевіряють в інших реєстрах, а не за підписом."}], "explanation": "Перевірка цілісності електронного документа проводиться шляхом підтвердження удосконаленого або кваліфікованого підпису чи печатки. Результат відповідає на три питання: хто, коли і чи змінювали документ після підписання.", "source_reference": ["SRC-041", "SRC-047"], "hint": "Подумайте, які саме дані містить сам підпис, а які лежать за межами файлу документа."}, {"id": "m04-q08", "title": "Копія чи дублікат", "competency": "doc_copy_duplicate", "scenario": "Оригінал акта пошкоджено водою, і ФОП звертається до контрагента за заміною.", "question": "Про що саме йому просити, щоб отримати документ тієї самої сили?", "options": [{"text": "Про копію: вона точно відтворює зміст документа, який було пошкоджено", "feedback": "Ні. Копія відтворює зміст, але не замінює оригінал і не має його юридичної сили."}, {"text": "Про витяг: він засвідчує ту частину тексту, яка потрібна для обліку", "feedback": "Ні. Витяг є засвідченою копією частини тексту, а не заміною цілого документа."}, {"text": "Про дублікат: він оформлюється замість втраченого й має ту саму силу", "correct": true, "feedback": "Правильно. Дублікат виготовляють замість втраченого чи пошкодженого оригіналу."}], "explanation": "Дублікат — це особливий вид копії: повторно оформлений документ для використання замість втраченого чи пошкодженого оригіналу, що має таку саму юридичну силу і відмітку «Дублікат».", "source_reference": ["SRC-043"], "hint": "Порівняйте три поняття за одним критерієм: чи замінює документ оригінал, чи лише показує його зміст."}, {"id": "m04-q09", "title": "Виправлення суми", "competency": "doc_corrections", "scenario": "У паперовому акті помилилися в сумі, і бухгалтер хоче замазати число коректором.", "question": "Як норма приписує виправляти таку помилку?", "options": [{"text": "Закреслити однією рискою, надписати правильне, обумовити й підписати", "correct": true, "feedback": "Правильно. Закреслення робиться так, щоб виправлене можна було прочитати."}, {"text": "Замазати помилкове число й вписати правильне, засвідчивши це підписом", "feedback": "Ні. Підчистки й необумовлені виправлення в документах прямо не допускаються."}, {"text": "Скласти окрему довідку про помилку, не змінюючи текст самого документа", "feedback": "Ні. Довідка застосовується для помилок минулих періодів у регістрах обліку."}], "explanation": "Підчистки й необумовлені виправлення не допускаються. Коректурний спосіб означає закреслення однією рискою так, щоб виправлене можна було прочитати, напис «виправлено», підписи тих самих осіб і дату. У касових і банківських документах виправлення не допускається взагалі.", "source_reference": ["SRC-040"], "hint": "Головна вимога стосується того, що має статися з попереднім записом після виправлення."}, {"id": "m04-q10", "title": "Втрата документів", "competency": "doc_loss_procedure", "scenario": "У березні згорів архів ФОП; у червні податкова призначає перевірку за минулий рік.", "question": "Що мало бути зроблено відразу після події в березні?", "options": [{"text": "Скласти внутрішній акт і зберігати його до першого запиту податкової", "feedback": "Ні. Внутрішній акт не замінює повідомлення контролюючого органу за місцем обліку."}, {"text": "Замовити дублікати документів у контрагентів протягом місяця після пожежі", "feedback": "Ні. Отримання дублікатів є частиною відновлення, але воно йде після повідомлення."}, {"text": "Письмово повідомити контролюючий орган у пʼятиденний строк від дня події", "correct": true, "feedback": "Правильно. Далі починається відлік 90 календарних днів на відновлення документів."}], "explanation": "У разі втрати, пошкодження або дострокового знищення документів платник податків зобовʼязаний у пʼятиденний строк письмово повідомити контролюючий орган і відновити документи протягом 90 календарних днів. Якщо цього не зроблено, вважається, що документів не було на час складання звітності.", "source_reference": ["SRC-044", "SRC-045"], "hint": "Зверніть увагу, від якої дати починається відлік і що саме має бути першою дією власника."}], "activities": {"precheck": [{"id": "pre-source", "question": "Як гадаєте: Закон «Про бухгалтерський облік та фінансову звітність в Україні» поширюється на ФОП?", "options": [{"text": "Так, він поширюється на всіх субʼєктів господарювання", "correct": false}, {"text": "Ні, він поширюється на юридичних осіб", "correct": true}, {"text": "Так, але тільки на ФОП на загальній системі", "correct": false}], "note": "Це головна пастка модуля: перелік реквізитів документа беруть із закону, який ФОП формально не адресований. Обовʼязок мати документи встановлює Податковий кодекс, і в розділі про джерела вимог ви побачите, чому ця ент."}], "source_reference": ["SRC-012", "SRC-017", "SRC-039"]}, {"id": "lesson-place", "section": "Обовʼязкові реквізити", "scenario": "Контрагент повертає акт із вимогою дописати місто, бо «без місця складання документ недійсний».", "question": "Чи обґрунтована ця вимога?", "options": [{"text": "Ні: місце складання виключено з переліку обовʼязкових реквізитів у 2020 році", "correct": true, "feedback": "Правильно. У чинному переліку шість позицій, і місця складання серед них немає."}, {"text": "Так: місце складання входить до чинного переліку обовʼязкових реквізитів документа", "feedback": "Ні. Ця вимога походить з редакції норми, що діяла до липня 2020 року."}, {"text": "Так, коли сторони договору зареєстровані в різних населених пунктах однієї країни", "feedback": "Ні. Норма не ставить обовʼязковість реквізиту в залежність від адрес сторін."}], "source_reference": ["SRC-039"]}, {"id": "lesson-minor", "section": "Неістотні недоліки", "scenario": "В акті описка в назві вулиці замовника; дата, сторони, зміст і сума збігаються з договором.", "question": "Як оцінити цю описку?", "options": [{"text": "Документ треба переоформити, бо будь-яка розбіжність із договором є дефектом", "feedback": "Ні. Норма прямо каже, що неістотні недоліки не є підставою для невизнання операції."}, {"text": "Це неістотний недолік: сторону впізнати можна, дата й зміст операції на місці", "correct": true, "feedback": "Правильно. Перевірка неістотності — це ідентифікація особи, дата, назва сторони, зміст і обсяг."}, {"text": "Це відсутній реквізит, тому операцію в податковому обліку показати не можна", "feedback": "Ні. Реквізит «назва сторони» присутній; описка не робить його відсутнім."}], "source_reference": ["SRC-039"]}, {"id": "lesson-dates", "section": "Три дати", "scenario": "Акт складено 30 вересня за роботу серпня, кошти від замовника надійшли 12 жовтня.", "question": "Яку дату бере платник єдиного податку для визнання доходу?", "options": [{"text": "Дату складання акта, бо саме він пі  "додатков", "наявн"], "sources": ["law_acc"], "hint_where": "Знайдіть абзац норми, який називає чотири умови, за яких дефект не руйнує документ.", "example": "Одне слово-висновок із чотирьох, наведених в інструкції.", "hint": "Сторону можна ідентифікувати, дата й зміст операції на місці, тому підстав для невизнання операції немає."}, {"id": "row_stamp", "label": "Рядок 8: печатка", "mode": "known", "accepted": ["додатковий"], "must_include": [["додатков", "необов", "не обов", "поза перелік"]], "must_not_include": ["браку", "наявн", "неістотн", "несуттєв"], "sources": ["law_acc"], "hint_where": "Подивіться, у якому переліку норма згадує печатку — в обовʼязковому чи в тому, що починається словом «можуть».", "example": "Одне слово-висновок із чотирьох, наведених в інструкції.", "hint": "Печатка названа серед реквізитів, які можуть включатися залежно від характеру операції."}, {"id": "row_sign", "label": "Рядок 9: підпис і посада виконавця", "mode": "known", "accepted": ["наявний"], "must_include": [["наявн", "присутн", "вказан", "зазначен", "заповнен"]], "must_not_include": ["браку", "відсутн", "додатков", "неістотн", "несуттєв"], "sources": ["law_acc"], "hint_where": "Порівняйте рядок 9 із двома останніми позиціями переліку: про відповідальних осіб і про ідентифікацію підписанта.", "example": "Одне слово-висновок із чотирьох, наведених в інструкції.", "hint": "Є і посада з прізвищем, і власне підпис, тому обидві позиції закрито."}, {"id": "row_customer_sign", "label": "Рядок 10: відсутність підпису з боку замовника", "mode": "review", "sources": ["additional"], "hint_where": "Норма про це є, але вона адресована бухгалтерському обліку іншої сторони, а не ФОП. Подивіться розділ «Межі перевірки».", "example": "Поле лишається порожнім, ставиться позначка про потребу окремої перевірки.", "hint": "Модуль не стверджує, що ФОП може спиратися на цю норму: питання потребує підтвердження бухгалтера."}, {"id": "file_kind", "label": "Чим є надісланий файл", "mode": "known", "accepted": ["скан паперового документа"], "must_include": [["скан", "копі", "зображенн", "фото", "візуальн"]], "must_not_include": ["електронний оригінал"], "sources": ["law_edoc"], "hint_where": "Перечитайте визначення оригіналу електронного документа й перевірте, чого саме бракує цьому файлу.", "example": "Два-три слова про те, чим є зображення підписаного паперу.", "hint": "Оригіналом електронного документа є примірник із реквізитами та накладеним підписом, а не зображення паперу."}, {"id": "req_count", "label": "Скільки обовʼязкових реквізитів установлює норма", "mode": "known", "accepted": ["шість"], "must_include": [["шіст", "6"]], "must_not_include": ["сім", "сьом", "вісім", "пʼят", "пять"], "sources": ["law_acc"], "hint_where": "Порахуйте позиції в частині другій статті 9 до абзацу, який починається словом «залежно».", "example": "Число словом або цифрою.", "hint": "Абзац, що починається словом «залежно», описує вже додаткові реквізити, а не обовʼязкові."}, {"id": "income_date", "label": "Дата визнання доходу за цією операцією", "mode": "missing", "sources": ["bank"], "hint_where": "Подумайте, який документ показує день надходження коштів, і перевірте, чи є він у пакеті.", "example": "Поле лишається порожнім, ставиться позначка про потребу окремої перевірки.", "hint": "Для платника єдиного податку дохід визнають за датою надходження коштів, а виписки в пакеті немає."}]}, "case": {"title": "Ми ж надіслали скан", "threshold": 80, "instructions": "Знайдіть у ситуації Богдана справжні ризики, класифікуйте їх, визначте відповідального та побудуйте безпечну послідовність дій.", "situation_title": "Ситуація", "reasoning_prompt": "Чому втрата папки з документами в серпні — найтерміновіша позиція в цьому списку?", "reasoning_min_chars": 60, "order_feedback": "Послідовність потребує виправлення: спочатку виконайте те, у чого біжить строк, потім встановіть, чого саме бракує, і лише після цього збирайте, переоформлюйте й міняйте правила роботи.", "how_to": ["Прочитайте ситуацію і позначте лише ті твердження, які справді створюють ризик.", "Для кожного ризику поставте позначку або одразу оберіть категорію чи відповідального — список сам позначить твердження як ризик.", "Якщо твердження неоднозначне, натисніть «Підказка» під ним: вона ставить навідне питання, але не називає відповіді.", "Розставте дії у безпечному порядку: перетягніть картку мишею або скористайтеся стрілками. Картка зеленіє одразу, щойно опиняється на своєму місці.", "Напишіть власне пояснення щонайменше з 60 символів; кнопка підказки покаже, що воно має містити.", "Натисніть «Перевірити рішення» і виправляйте відповідь, доки результат не досягне 80%."], "situation": ["Частина актів за минулий рік існує лише як фотографії в месенджері", "папку з паперовими документами за 2025 рік знищено в серпні, нікого не повідомляли", "один акт підписано факсимільним штампом без письмової згоди сторін", "в акті за липень немає дати складання", "в акті за серпень суму виправлено коректором", "інвойс від іноземного клієнта зберігається без перекладу", "в іншому акті немає печатки — Богдан вирішив переробити документ", "у назві вулиці замовника описка: «Городоцка» замість «Городоцька»"], "categories": ["форма документа", "реквізити", "строки", "виправлення", "доказовість"], "owners": ["власник", "бухгалтер", "юрист"], "risks": [{"id": "photos_only", "text": "Акти існують лише як фотографії в месенджері", "critical": true, "category": "форма документа", "owner": "бухгалтер", "feedback": "Фотографія паперу не є оригіналом електронного документа: оригіналом лишається сам підписаний папір або файл із накладеним підписом. Замінити оригінал зображенням не можна.", "hint": "Подумайте, що саме робить електронний файл оригіналом, і чи є це в фотографії, зробленій телефоном."}, {"id": "lost_folder", "text": "Папку з документами знищено в серпні, повідомлення не подавали", "critical": true, "category": "строки", "owner": "власник", "feedback": "Про втрату або знищення документів платник податків зобовʼязаний письмово повідомити контролюючий орган у пʼятиденний строк від дня події, а потім відновити їх протягом 90 календарних днів.", "hint": "Подивіться, від якої саме дати відраховують строк повідомлення: від дня події чи від дня, коли про неї згадали."}, {"id": "facsimile", "text": "Акт підписано факсиміле без письмової згоди сторін", "critical": true, "category": "доказовість", "owner": "юрист", "feedback": "Факсимільне відтворення підпису допускається лише у випадках, встановлених законом, або за письмовою згодою сторін, у якій наведено зразки відповідного аналога власноручних підписів.", "hint": "Згадайте, чого саме вимагає норма для факсиміле, крім згоди: чи достатньо усної домовленості про штамп."}, {"id": "no_date", "text": "В акті за липень немає дати складання", "critical": true, "category": "реквізити", "owner": "бухгалтер", "feedback": "Дата складання входить до переліку обовʼязкових реквізитів, і саме її наявність є однією з умов, за яких недолік документа вважається неістотним.", "hint": "Перевірте, чи входить ця позиція до переліку з шести й чи згадана вона серед умов неістотності недоліку."}, {"id": "corrector", "text": "Суму в акті виправлено коректором", "critical": true, "category": "виправлення", "owner": "бухгалтер", "feedback": "Підчистки й необумовлені виправлення не допускаються: неправильний запис закреслюють однією рискою так, щоб його можна було прочитати, і виправлення обумовлюють написом, підписами й датою.", "hint": "Пригадайте, що саме має лишитися видимим після виправлення в паперовому документі."}, {"id": "no_translation", "text": "Інвойс від іноземного клієнта зберігається без перекладу", "critical": true, "category": "доказовість", "owner": "бухгалтер", "feedback": "Загальної норми про переклад саме для ФОП знайти не вдалося, але без перекладу неможливо показати зміст і обсяг операції під час перевірки — це практичний ризик, а не формальність.", "hint": "Подумайте не про норму, а про перевірку: як показати зміст операції, якщо документ незрозумілий перевіряльнику."}, {"id": "no_stamp", "text": "В акті немає печатки, тому документ вирішено переробити", "critical": false, "category": "реквізити", "owner": "бухгалтер", "feedback": "Печатка не входить до переліку обовʼязкових реквізитів: вона названа серед тих, що можуть включатися залежно від характеру операції. Переробляти документ через її відсутність немає підстав.", "hint": "Перевірте, у якому саме переліку норма згадує печатку — в обовʼязковому чи в переліку зі словом «можуть»."}, {"id": "street_typo", "text": "Описка в назві вулиці замовника", "critical": false, "category": "реквізити", "owner": "бухгалтер", "feedback": "Це неістотний недолік: сторону можна ідентифікувати, дата, зміст і обсяг операції на місці. Неістотні недоліки не є підставою для невизнання господарської операції.", "hint": "Пригадайте чотири умови, за яких дефект оформлення не руйнує документ, і перевірте їх по черзі."}], "actions": [{"id": "notify", "text": "Письмово повідомити контролюючий орган про втрату документів"}, {"id": "inventory", "text": "Скласти перелік документів, яких бракує, за кожним місяцем"}, {"id": "restore", "text": "Запитати в контрагентів оригінали й дублікати замість фотографій"}, {"id": "fix_form", "text": "Переоформити документи з відсутніми реквізитами й неналежним виправленням"}, {"id": "sign_rule", "text": "Узгодити з контрагентами спосіб підписання документів на майбутнє"}, {"id": "process", "text": "Запровадити приймання документа одразу після кожної операції"}], "initial_order": ["process", "fix_form", "restore", "sign_rule", "inventory", "notify"], "order_hint": "Першою йде дія, у якої вже біжить встановлений законом строк. Далі — встановити, чого саме бракує, потім зібрати й переоформити документи, і лише наприкінці міняти правила роботи на майбутнє.", "reasoning_hint": ["Назвіть строк, який почав спливати в момент події, і дату, від якої його рахують.", "Поясніть, що відбувається з документами, які не відновлено у відведений час.
