жна закрити як «не застосовується».", "Стежте за поясненням під пунктом: воно живцем показує, чого ще бракує."], "note_min_chars": 10, "statuses": [{"value": "", "label": "Не перевірено"}, {"value": "confirmed", "label": "Підтверджено"}, {"value": "needs_data", "label": "Потрібні дані"}, {"value": "na", "label": "Не застосовується", "blocks_critical": true}], "items": [{"id": "party_exists", "group": "Контрагент", "text": "Контрагента знайдено в ЄДР, стан — не «в стані припинення»", "critical": true, "hint": "Скористайтеся безоплатним пошуком у ЄДР і подивіться саме поле стану, а не лише назву. Запишіть, що ви побачили.", "why": "Договір із особою, щодо якої почалося припинення, створює ризик, який дешевше побачити до підпису."}, {"id": "party_match", "group": "Контрагент", "text": "Назва й реквізити в проєкті збігаються з ЄДР", "critical": true, "hint": "Порівняйте символ у символ: назву, код і адресу. Розбіжність — це «потрібні дані», а не привід виправити самому.", "why": "Розбіжність у реквізитах ускладнює доведення того, з ким саме ви укладали договір."}, {"id": "signer", "group": "Контрагент", "text": "Перевірено, хто має право підпису й на якій підставі", "critical": true, "hint": "Підстава — статут, наказ або довіреність. Довіреність без дати вчинення нікчемна: це матеріал модуля 5.", "why": "Підпис особи без повноважень перетворює договір на предмет спору про сам факт його укладення."}, {"id": "tax_status", "group": "Контрагент", "text": "Перевірено податковий статус контрагента в реєстрі платників", "critical": false, "hint": "Подивіться, чи є контрагент платником єдиного податку і чи є він платником ПДВ. Це впливає на ціну й документи.", "why": "Статус контрагента визначає, чи будуть у ціні ПДВ і які документи ви отримаєте за операцією."}, {"id": "debts", "group": "Контрагент", "text": "Перевірено невиконані рішення й судову історію", "critical": false, "hint": "Відомості Єдиного реєстру боржників відкриті; судові рішення шукайте за назвою або кодом контрагента.", "why": "Наявність невиконаних рішень змінює умови, на які варто погоджуватися: передоплата замість післяплати."}, {"id": "check_date", "group": "Контрагент", "text": "Зафіксовано дату перевірки й те, що саме було видно", "critical": true, "hint": "Запишіть дату й короткий підсумок. «Перевіряв колись» без дати — це «потрібні дані».", "why": "Реєстри показують стан на дату; без зафіксованої дати перевірка нічого не доводить."}, {"id": "subject", "group": "Шість питань до тексту", "text": "Предмет описано конкретно: що робиться і в якому обсязі", "critical": true, "hint": "Спробуйте за текстом пункту скласти акт. Якщо не виходить назвати обсяг — предмет описано недостатньо.", "why": "Предмет є істотною умовою: без згоди щодо нього договір не вважається укладеним."}, {"id": "price_term", "group": "Шість питань до тексту", "text": "Ціна, порядок і строк оплати названі", "critical": true, "hint": "Якщо строку оплати немає, запишіть це прямо: спрацює правило за замовчуванням, і воно може вас не влаштовувати.", "why": "Без строку оплати неможливо визначити момент початку прострочення й порахувати вимогу."}, {"id": "duration", "group": "Шість питань до тексту", "text": "Строк договору й дата початку встановлені", "critical": true, "hint": "Перевірте також, чи не поширюються умови договору на відносини, які виникли до його укладення.", "why": "Строк визначає період, у якому сторони можуть здійснювати права, і момент, коли треба діяти."}, {"id": "proof_doc", "group": "Шість питань до тексту", "text": "Названо документ, яким підтверджується виконання", "critical": true, "hint": "Це матеріал модуля 5: акт, накладна або розрахунковий документ. Рахунок сюди не підходить.", "why": "Без названого документа сторони по-різному розумітимуть, коли зобовʼязання вважається виконаним."}, {"id": "default_liability", "group": "Шість питань до тексту", "text": "Зрозуміло, що буде при простроченні оплати", "critical": true, "hint": "Якщо в договорі про це нічого немає — запишіть, яка норма спрацює за замовчуванням і в якому розмірі.", "why": "Це головне практичне питання бухгалтера до договору: від нього залежить сума вимоги."}, {"id": "ending", "group": "Шість питань до тексту", "text": "Зрозуміло, як договір закінчується й чи продовжується сам", "critical": true, "hint": "Розділіть дві речі: умову про автопродовження в тексті й норму про поновлення найму мовчанням.", "why": "Договір, який продовжився непоміченим, створює платежі й зобовʼязання, яких ніхто не планував."}, {"id": "defaults", "group": "Що спрацює за замовчуванням", "text": "Перевірено, які умови не написані й що замість них скаже закон", "critical": true, "hint": "Пройдіть шістьма питаннями ще раз і для кожного пропуску запишіть норму, яка його закриває.", "why": "Більшість правил Кодексу діє «якщо інше не встановлено договором», тому мовчання теж є вибором."}, {"id": "declared_terms", "group": "Що спрацює за замовчуванням", "text": "Умови, які ви хочете зробити істотними, заявлено до підписання", "critical": false, "hint": "Сторона сама може зробити умову істотною, заявивши про це. Заява має бути до укладення, а не після.", "why": "Третє джерело істотних умов — заява сторони; після підписання скористатися ним уже неможливо."}, {"id": "settlement_form", "group": "Що спрацює за замовчуванням", "text": "Форма розрахунків узгоджується з вашою системою оподаткування", "critical": true, "hint": "Перевірте, чи немає в тексті натуральної форми оплати, заліку або бартеру. Це матеріал модуля 3.", "why": "Негрошовий розрахунок для платника єдиного податку означає підвищену ставку й підставу для переходу на загальну систему."}, {"id": "no_gku", "group": "Чого не має бути", "text": "У тексті немає посилань на Господарський кодекс як на чинний акт", "critical": true, "hint": "Пошук по тексту за словом «Господарський». Знайшли — це «потрібні дані» й питання до юриста, а не до вас.", "why": "Кодекс втратив чинність 28 серпня 2025 року; посилання на нього показує, що текст не переглядали."}, {"id": "lawyer_items", "group": "Чого не має бути", "text": "Умови поза межами шести питань показано юристу", "critical": false, "hint": "Підсудність, гарантії, обмеження відповідальності, одностороннє розірвання — це не ваша зона.", "why": "Межа компетенції має бути проведена свідомо, інакше бухгалтер погоджує те, наслідків чого не оцінює."}, {"id": "reality_match", "group": "Чого не має бути", "text": "Немає розбіжності між договором і фактичним порядком роботи", "critical": true, "hint": "Порівняйте текст із тим, як робота йде насправді: періодичність, обсяг, спосіб передавання результату.", "why": "Розбіжність між договором і фактом — типове джерело спорів і питань під час перевірки."}, {"id": "final_version", "group": "Фіксація", "text": "Збережено остаточну версію проєкту, на яку ви погодилися", "critical": true, "hint": "Збережіть саме той файл, який підписується, і запишіть, чим він відрізняється від попередньої версії.", "why": "Без збереженої версії неможливо довести, на що саме ви погоджувалися."}, {"id": "owner_of_terms", "group": "Фіксація", "text": "Визначено, хто стежить за строками за цим договором", "critical": false, "hint": "Назвіть людину й спосіб нагадування. «Памʼятатиму» без нагадування — це «потрібні дані».", "why": "Строки автопродовження й попередження про відмову спливають тихо, і згадують про них уже після факту."}]}, "glossary": [{"term": "Договір", "definition": "Домовленість двох або більше сторін, спрямована на встановлення, зміну або припинення цивільних прав та обовʼязків.", "example": "Оплачений рахунок за умовами пропозиції — теж укладений договір.", "avoid": "«папір для бухгалтерії» — договір створює зобовʼязання, а не звітність"}, {"term": "Свобода договору", "definition": "Право сторін вільно обирати контрагента й визначати умови з урахуванням вимог законодавства, звичаїв ділового обороту, розумності та справедливості.", "example": "Сторони можуть встановити будь-який строк оплати, якщо закон не вимагає іншого.", "avoid": "«можна писати будь-що» — частина умов приходить із закону незалежно від волі сторін"}, {"term": "Істотні умови", "definition": "Умови, без згоди щодо яких договір не є укладеним: предмет; умови, визначені законом як істотні або необхідні для цього виду; усі умови, щодо яких за заявою сторони має бути досягнуто згоди.", "example": "Заява «без строку оплати не підписуємо» робить строк оплати істотною умовою.", "avoid": "«предмет, ціна і строк» — це перелік зі скасованого Господарського кодексу"}, {"term": "Оферта", "definition": "Пропозиція однієї сторони укласти договір на визначених умовах.", "example": "Виставлений рахунок з описом послуги, суми й строку оплати.", "avoid": "«реклама послуг» — загальна пропозиція без умов офертою не є"}, {"term": "Акцепт", "definition": "Прийняття пропозиції, яке має бути повним і безумовним; дія за умовами пропозиції також є акцептом.", "example": "Оплата виставленого рахунку в межах строку для відповіді.", "avoid": "«згодні, але змінимо строк» — це не акцепт, а зустрічна пропозиція"}, {"term": "Змішаний договір", "definition": "Договір, що містить елементи різних договорів; до кожної частини застосовуються положення про відповідний вид.", "example": "Договір, за яким виконавець постачає обладнання і обслуговує його.", "avoid": "«універсальний договір» — до кожної частини діють свої правила"}, {"term": "Строк договору", "definition": "Час, протягом якого сторони можуть здійснити права й виконати обовʼязки за договором.", "example": "Договір діє до 31 грудня, а відповідальність за порушення в листопаді лишається після цієї дати.", "avoid": "«після закінчення нічого не винні» — строк не звільняє від відповідальності за минулі порушення"}, {"term": "Ціна договору", "definition": "Величина, що встановлюється за домовленістю сторін; у випадках, встановлених законом, застосовуються регульовані ціни.", "example": "Якщо ціни в договорі немає, вона визначається за звичайними цінами на аналогічні послуги.", "avoid": "«можна переглянути будь-коли» — зміна ціни після виконання договору не допускається"}, {"term": "Порушення зобовʼязання", "definition": "Невиконання зобовʼязання або виконання з порушенням умов, визначених його змістом.", "example": "Оплата, здійснена на пʼять тижнів пізніше встановленого строку.", "avoid": "«лише повна відмова платити» — неналежне виконання теж є порушенням"}, {"term": "Неустойка", "definition": "Визначена договором або законом сума, яку боржник сплачує за порушення зобовʼязання.", "example": "Пеня за кожен день прострочення, розмір якої встановлено договором.", "avoid": "«те саме, що збитки» — неустойку рахують, збитки доводять"}, {"term": "Збитки", "definition": "Втрати кредитора, спричинені порушенням зобовʼязання; їх розмір доводить сам кредитор.", "example": "Витрати на термінову заміну постачальника після зриву поставки.", "avoid": "«нараховуються автоматично» — без доведення розміру вимога не працює"}, {"term": "Три проценти річних", "definition": "Розмір відповідальності за прострочення грошового зобовʼязання за замовчуванням; діє разом з індексом інфляції, якщо договором не встановлено інший розмір.", "example": "Вимога до замовника за пʼять тижнів прострочення оплати за актом.", "avoid": "«працює саме собою» — норма діє на вимогу кредитора, яку треба заявити"}, {"term": "Істотне порушення договору", "definition": "Порушення, через яке друга сторона значною мірою позбавляється того, на що розраховувала при укладенні договору.", "example": "Підстава для розірвання договору судом на вимогу однієї сторони.", "avoid": "«будь-яке прострочення» — істотність оцінюється за наслідками для сторони"}, {"term": "Поновлення договору найму", "definition": "Продовження договору оренди на попередній строк, якщо наймач далі користується майном, а наймодавець не заперечив протягом одного місяця.", "example": "Користування складом у вересні після закінчення строку 31 серпня.", "avoid": "«потрібна нова угода» — поновлення настає без підписання документів"}, {"term": "Договір поставки", "definition": "Договір, за яким продавець-підприємець передає товар покупцеві для використання в підприємницькій діяльності.", "example": "Регулярне постачання комплектуючих виробничому підприємству.", "avoid": "«окремий вид з власними правилами» — застосовуються загальні положення про купівлю-продаж"}, {"term": "Зовнішньоекономічний договір", "definition": "Договір субʼєкта ЗЕД у простій письмовій або електронній формі; при експорті послуг допускається оферта, обмін електронними повідомленнями або виставлення інвойсу.", "example": "Інвойс іноземному замовнику за розробку без окремого підписаного контракту.", "avoid": "«обовʼязково паперовий контракт із печатками» — закон дозволяє інші способи"}, {"term": "Граничний строк розрахунків", "definition": "Встановлений НБУ строк, у який мають надійти кошти за експортом або товар за імпортом; наразі 365 календарних днів.", "example": "Відлік від дати інвойсу за надані іноземному замовнику послуги.", "avoid": "«рахують від дати договору» — відлік іде від документа про надання або митного оформлення"}]}}]}</script>
  <script>
    "use strict";
    const DATA=JSON.parse(document.getElementById("course-data").textContent);
    const COURSE=DATA.course,MODULES=DATA.modules;
    const STORAGE_KEY="fop-course:"+COURSE.id+":v5";
    const STATE_VERSION=5;
    const LEGACY_RE=new RegExp("^fop-course:"+COURSE.id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+":(module-[^:]+:)?v\\d+$");
    const DEFAULT_WEIGHTS={lesson:20,practice:30,case:25,checklist:10,quiz:15};
    const LEVEL_QUIZ=Object.assign({title:"Рівнева перевірка",threshold:80,note:"Рівнева перевірка не зараховує модулі й не замінює їх проходження."},COURSE.level_quiz||{});
    const LEVELS_WITH_QUIZ=(COURSE.levels||[]).filter(l=>Array.isArray(l.quiz)&&l.quiz.length);
    const OPTIONAL_PAGES=["glossary"];
    const PAGES=[
      {id:"overview",title:"Огляд",kind:"overview"},{id:"guide",title:"Як навчатися",kind:"guide"},{id:"lesson",title:"Урок",kind:"lesson"},{id:"practice",title:"Практика",kind:"practice"},
      {id:"case",title:"Кейс",kind:"case"},{id:"checklist",title:"Чекліст",kind:"checklist"},{id:"glossary",title:"Глосарій",kind:"glossary"},
      {id:"reference",title:"Пам’ятка",kind:"content"},{id:"sources",title:"Джерела",kind:"content"},{id:"quiz",title:"Підсумковий квіз",kind:"quiz"}
    ];
    function moduleById(id){return MODULES.find(m=>m.id===id)||MODULES[0]}
    function section(m,id){return m.sections.find(item=>item.id===id)}
    function weights(m){return Object.assign({},DEFAULT_WEIGHTS,m.meta.progress_weights||{})}
    function quizThreshold(m){return m.meta.quiz_threshold||80}
    function noteMin(m){return m.activities.checklist.note_min_chars||3}
    function reasonMin(m){return m.activities.case.reasoning_min_chars||60}
    function blockingStatuses(m){return new Set((m.activities.checklist.statuses||[]).filter(s=>s.blocks_critical).map(s=>s.value))}
    function startOrder(m){const ids=m.activities.case.actions.map(x=>x.id),initial=Array.isArray(m.activities.case.initial_order)?m.activities.case.initial_order.filter(id=>ids.includes(id)):[];return initial.length===ids.length?initial.slice():ids.slice().reverse()}
    function freshModuleState(m){return{lessonAnswers:{},practice:{answers:{},result:null,hints:{}},caseWork:{selected:{},categories:{},owners:{},order:startOrder(m),reasoning:"",result:null,hints:{}},checklist:{},glossary:{seen:{},repeat:{}},quiz:{answers:{},index:0,showResult:false,bestScore:0,hints:{}}}}
    function freshState(){return{version:STATE_VERSION,view:"course",module:MODULES[0].id,page:"overview",modules:{},levels:{},review:{},mission:""}}
    function freshLevelState(){return{answers:{},index:0,showResult:false,bestScore:0,hints:{}}}
    function levelById(no){return LEVELS_WITH_QUIZ.find(l=>String(l.level)===String(no))||LEVELS_WITH_QUIZ[0]||null}
    function levelStateOf(no){const store=state.levels||(state.levels={}),key=String(no);if(!store[key])store[key]=freshLevelState();const s=store[key];if(!s.hints)s.hints={};return s}
    function peekLevelState(no){return (state.levels||{})[String(no)]||freshLevelState()}
    function levelScore(l,s){return l.quiz.reduce((sum,q,i)=>sum+(s.answers[i]===correctIndex(q)?1:0),0)}

    function normalize(v){return String(v||"").trim().toLocaleLowerCase("uk-UA").replace(/\s+/g," ")}
    function words(v){const spaced=normalize(v).replace(/[^\p{L}\p{N}]+/gu," ").trim();return spaced?spaced.split(" "):[]}

      if(known&&a.missing)reasons.push(textOk?"Значення введено правильно — приберіть позначку про недостатність даних.":"Це значення є в пакеті: приберіть позначку про недостатність даних.");

      const index=Math.min(s.index||0,total-1),q=level.quiz[index],chosen=s.answers[index],correct=correctIndex(q);
      const names=(q.modules||[]).map(id=>{const m=MODULES.find(x=>x.id===id);return m?m.meta.title:id});
      card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Наскрізне питання</p><h2>${escapeHtml(q.title)}</h2></div><span class="chip">Питання ${index+1} із ${total}</span></div><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((index+1)/total*100)}" aria-label="Пройдено ${index+1} із ${total} питань"><span style="width:${Math.round((index+1)/total*100)}%"></span></div><div class="question-number">Спирається на модулі: ${names.map(escapeHtml).join(", ")}</div><p class="scenario">${escapeHtml(q.scenario)}</p><h3 class="question-title">${escapeHtml(q.question)}</h3>`;
      if(q.hint&&chosen===undefined){const tools=document.createElement("div");tools.className="hint-bar";if(!(s.hints||{})[index])tools.appendChild(button("Підказка","tonal-button",()=>{const store=s.hints||(s.hints={});store[index]=1;persist();render()}));else tools.insertAdjacentHTML("beforeend",hintBlock("Навідне питання",[q.hint]));card.appendChild(tools)}
      const options=document.createElement("div");options.className="options";
      q.options.forEach((o,i)=>{const b=button(o.text,"option-button",()=>{s.answers[index]=i;if(i!==correct&&(q.modules||[]).length)reviewAdd(q.modules[0],"level",level.level+":"+index);persist();render()});
        if(chosen!==undefined){b.disabled=true;if(i===correct)b.classList.add("correct");if(i===chosen&&i!==correct)b.classList.add("wrong")}options.appendChild(b)});
      card.appendChild(options);
      if(chosen!==undefined){const fb=document.createElement("div");fb.className="feedback "+(chosen===correct?"correct":"wrong");fb.setAttribute("role","status");
        fb.innerHTML=`<strong>${chosen===correct?"Правильно":"Відповідь неправильна"}</strong><p>${escapeHtml(q.options[chosen].feedback)}</p><div class="feedback-list">${q.options.map((o,i)=>`<div class="feedback-item"><strong>${i===correct?"✓ Правильний варіант":"Дистрактор"}</strong>${escapeHtml(o.text)}<br>${escapeHtml(o.feedback)}</div>`).join("")}</div><p><strong>Глибше пояснення</strong>${escapeHtml(q.explanation)}</p><div class="footer-note">Джерела: ${(q.source_reference||[]).map(escapeHtml).join(", ")}</div>`;
        card.appendChild(fb);
        const actions=document.createElement("div");actions.className="quiz-actions";
        actions.appendChild(button(index===total-1?"Показати результат":"Наступне питання","primary-button",()=>{if(index===total-1)s.showResult=true;else s.index=index+1;persist();render()}));
        if(index>0)actions.appendChild(button("Попереднє питання","secondary-button",()=>{s.index=index-1;persist();render()}));
        actions.appendChild(button("Спробувати це питання ще раз","tonal-button",()=>{delete s.answers[index];persist();render()}));card.appendChild(actions)}
      main.appendChild(card);
      const nav=document.createElement("div");nav.className="page-actions";nav.appendChild(button("← Усі модулі","secondary-button",openCourse));
      nav.appendChild(button("Скинути рівневу перевірку","danger-button",()=>{if(!confirm("Видалити відповіді рівневої перевірки?"))return;state.levels[String(level.level)]=freshLevelState();persist();render()}));main.appendChild(nav)}
    function renderPrecheck(main){const items=mod.activities.precheck||[];if(!items.length)return;const card=document.createElement("section");card.className="card compact";card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Перед читанням</p><h2>Спробуйте вгадати</h2></div><span class="chip">не впливає на прогрес</span></div><p class="section-intro">Дайте відповідь до того, як прочитаєте урок. Помилитися тут корисно: спроба пригадати робить наступне читання значно ефективнішим.</p>`;
      items.forEach((item,index)=>{const chosen=(ms.precheck||{})[item.id],correct=correctIndex(item),block=document.createElement("article");block.className="activity-card"+(chosen===undefined?"":" is-neutral");block.innerHTML=`<div class="activity-label">Припущення ${index+1} із ${items.length}</div><h3>${escapeHtml(item.question)}</h3>`;
        const options=document.createElement("div");options.className="options";item.options.forEach((option,i)=>{const b=button(option.text,"option-button",()=>{const store=ms.precheck||(ms.precheck={});store[item.id]=i;persist();render()});if(chosen!==undefined){b.disabled=true;if(i===chosen)b.classList.add(i===correct?"correct":"wrong")}options.appendChild(b)});block.appendChild(options);
        if(chosen!==undefined)block.insertAdjacentHTML("beforeend",`<div class="feedback ${chosen===correct?"correct":"wrong"}" role="status"><strong>${chosen===correct?"Схоже, ви це вже відчуваєте":"Тут інтуїція підводить більшість"}</strong><p>${escapeHtml(item.note)}</p></div>`);
        card.appendChild(block)});
      main.appendChild(card)}
    function renderReview(main){const due=reviewDue(),all=reviewAll(),hero=document.createElement("section");hero.className="hero";hero.innerHTML=`<div class="eyebrow">${escapeHtml(REVIEW.title)}</div><h1>Повернення до складного</h1><p class="lead">Пригадування через проміжки часу дає довготривале запам’ятовування, якого не дає одноразове проходження. Сюди автоматично потрапляє те, у чому ви помилилися, і терміни, які ви позначили складними.</p><div class="meta-row"><span class="chip${due.length?" warning":" success"}">${due.length?`До повторення сьогодні: ${due.length}`:"На сьогодні все повторено"}</span><span class="chip">Усього в черзі: ${all.length}</span></div>`;main.appendChild(hero);
      if(due.length){const item=due[0],content=reviewContent(item),card=document.createElement("section");card.className="card";card.innerHTML=`<div class="section-head"><div><p class="section-kicker">${escapeHtml(content.label)} · ${escapeHtml(content.module.meta.title)}</p><h2>Пригадайте відповідь</h2></div><span class="chip">Залишилось ${due.length}</span></div>`;
        const answered=state.reviewAnswer&&state.reviewAnswer.key===item.key?state.reviewAnswer:null;
        if(content.type==="question"){const q=content.question,correct=correctIndex(q);card.insertAdjacentHTML("beforeend",`<p class="scenario">${escapeHtml(q.scenario||"")}</p><h3>${escapeHtml(q.question)}</h3>`);
          const options=document.createElement("div");options.className="options";q.options.forEach((option,i)=>{const b=button(option.text,"option-button",()=>{state.reviewAnswer={key:item.key,chosen:i,ok:i===correct};if(i===correct)reviewPass(item.key);else reviewFail(item.key);persist();render()});if(answered){b.disabled=true;if(i===correct)b.classList.add("correct");if(i===answered.chosen&&i!==correct)b.classList.add("wrong")}options.appendChild(b)});card.appendChild(options);
          if(answered)card.insertAdjacentHTML("beforeend",`<div class="feedback ${answered.ok?"correct":"wrong"}" role="status"><strong>${answered.ok?"Правильно — повернемося пізніше":"Ще раз завтра"}</strong><p>${escapeHtml(q.options[answered.chosen].feedback||q.explanation||"")}</p></div>`)}
        else if(content.type==="term"){card.insertAdjacentHTML("beforeend",`<h3>${escapeHtml(content.term.term)}</h3><p class="section-intro">Сформулюйте визначення своїми словами, потім перевірте себе.</p>${answered?`<div class="feedback correct" role="status"><p>${escapeHtml(content.term.definition)}</p><p><strong>Приклад:</strong> ${escapeHtml(content.term.example)}</p>${content.term.avoid?`<p class="footer-note">Так не кажіть: ${escapeHtml(content.term.avoid)}</p>`:""}</div>`:""}`);
          const row=document.createElement("div");row.className="activity-actions";
          if(!answered)row.appendChild(button("Показати визначення","primary-button",()=>{state.reviewAnswer={key:item.key,chosen:-1,ok:true};persist();render()}));
          else{row.appendChild(button("Знав — відкласти надовше","primary-button",()=>{reviewPass(item.key);state.reviewAnswer=null;persist();render()}));row.appendChild(button("Не згадав — повторити завтра","secondary-button",()=>{reviewFail(item.key);state.reviewAnswer=null;persist();render()}))}
          card.appendChild(row)}
        else{const field=content.field;card.insertAdjacentHTML("beforeend",`<h3>${escapeHtml(field.label)}</h3><p class="section-intro">Пригадайте, з якого джерела береться цей реквізит і що робити, якщо його немає в документах.</p>${answered?`<div class="feedback ${answered.ok?"correct":"wrong"}" role="status"><strong>${answered.ok?"Правильно":"Ще раз завтра"}</strong><p>${escapeHtml(field.hint)}</p><p class="footer-note">${escapeHtml(field.example)}</p></div>`:""}`);
          if(!answered){const input=document.createElement("input");input.className="text-input";input.id="review-input";input.placeholder=field.mode==="known"?"Введіть значення":"Напишіть, що робити, якщо даних немає";card.appendChild(input);
            const row=document.createElement("div");row.className="activity-actions";row.appendChild(button("Перевірити","primary-button",()=>{const value=document.getElementById("review-input").value;const ok=field.mode==="known"?matches(field,value):String(value).trim().length>=10;state.reviewAnswer={key:item.key,chosen:-1,ok};if(ok)reviewPass(item.key);else reviewFail(item.key);persist();render()}));card.appendChild(row)}}
        if(answered&&content.type!=="term"){const row=document.createElement("div");row.className="activity-actions";row.appendChild(button(due.length>1?"Наступне повторення":"Завершити повторення","primary-button",()=>{state.reviewAnswer=null;persist();render()}));row.appendChild(button("Відкрити модуль","secondary-button",()=>{state.reviewAnswer=null;openModule(content.module.id)}));card.appendChild(row)}
        main.appendChild(card)}
      const weak=document.createElement("section");weak.className="card";const groups={};all.forEach(item=>{const content=reviewContent(item);if(!content)return;const key=content.module.meta.title;(groups[key]=groups[key]||[]).push({item,content})});
      weak.innerHTML=`<div class="section-head"><div><p class="section-kicker">Журнал</p><h2>Ваші слабкі місця</h2></div><span class="chip">${all.length} позицій</span></div>`;
      if(!all.length)weak.insertAdjacentHTML("beforeend",'<p class="section-intro">Тут з’являється те, у чому ви помилилися, і терміни, позначені складними. Поки що список порожній.</p>');
      else Object.entries(groups).forEach(([title,list])=>{weak.insertAdjacentHTML("beforeend",`<h3>${escapeHtml(title)}</h3><div class="review-list">${list.map(({item,content})=>`<div class="review-line"><strong>${escapeHtml(content.label)}:</strong> ${escapeHtml(content.type==="question"?content.question.question:content.type==="term"?content.term.term:content.field.label)} <span class="footer-note">повторення ${String(item.due)>todayISO()?"з "+item.due:"сьогодні"}</span></div>`).join("")}</div>`)});
      main.appendChild(weak);
      const actions=document.createElement("div");actions.className="page-actions";actions.appendChild(button("← Усі модулі","secondary-button",openCourse));if(all.length)actions.appendChild(button("Очистити чергу повторення","danger-button",()=>{if(confirm("Видалити всі позиції з черги повторення?")){state.review={};state.reviewAnswer=null;persist();render()}}));main.appendChild(actions)}
    function wireSourceRefs(){document.querySelectorAll("#main .src-ref").forEach(node=>node.addEventListener("click",()=>{if(view==="module")go("sources")}))}
    function render(){const main=document.getElementById("main");main.innerHTML="";
      if(view==="review"){document.title=REVIEW.title+" — "+COURSE.title;renderReview(main);renderNav();renderProgress();wireSourceRefs();return}
      if(view==="level"){const lv=levelById(levelNo);document.title=LEVEL_QUIZ.title+" — "+COURSE.title;if(!lv){view="course";renderCourse(main)}else renderLevelQuiz(main);renderNav();renderProgress();wireSourceRefs();return}
      if(view==="course"){document.title=COURSE.title;renderCourse(main);renderNav();renderProgress();wireSourceRefs();return}
      document.title=`${mod.meta.title} — Бухгалтер ФОП`;const page=PAGES.find(p=>p.id===current)||PAGES[0];
      if(page.kind==="overview")renderOverview(main);else if(page.kind==="guide")renderGuide(main);else if(page.kind==="lesson")renderLesson(main);else if(page.kind==="practice")renderPractice(main);else if(page.kind==="case")renderCase(main);else if(page.kind==="checklist")renderChecklist(main);else if(page.kind==="glossary")renderGlossary(main);else if(page.kind==="quiz")renderQuiz(main);else renderContent(main);renderNav();renderProgress();wireSourceRefs()}
    document.getElementById("version").textContent=`${COURSE.version} · оновлено ${COURSE.updated}`;render();
  </script>
