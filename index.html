і та підприємницькі кошти й пояснити наслідки їх змішування", "Класифікувати операції банківської виписки за їх справжнім змістом", "Пояснити різницю між доходом, витратами, прибутком, залишком коштів і заборгованістю"], "primary_source": {"id": "SRC-010", "note": "Стаття 292 Податкового кодексу — прочитайте пункти 292.1, 292.6 і 292.11 самостійно: на цьому розмежуванні тримається весь подальший облік доходу."}, "sessions": [{"title": "Сесія 1 · Чотири різні числа", "minutes": 20, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Виписка й класифікація", "minutes": 25, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Рішення й перевірка", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви перестанете рахувати результат за залишком на картці й побачите, які надходження взагалі не є вашим доходом.", "accountant": "Ви працюєте з клієнтами: це база класифікації операцій — ви навчитеся відокремлювати дохід від транзиту, повернень і власних коштів ще до розрахунку податку.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете поставити правильні питання про те, що саме бухгалтер вважає вашим доходом і чому."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Фінансова грамотність\n\n## Мета\n\nНавчитися бачити за рухом коштів його справжній зміст: надходження на рахунок — не завжди дохід, залишок на рахунку — не прибуток, а особисті й підприємницькі гроші живуть за різними правилами. Це база, без якої розрахунок будь-якого податку буде правильним лише випадково.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. відрізнити надходження коштів від доходу і назвати надходження, які доходом не є;\n2. пояснити касовий метод і дату, на яку виникає дохід;\n3. розділити особисті та підприємницькі кошти й пояснити наслідки їх змішування;\n4. класифікувати операції банківської виписки за їх справжнім змістом;\n5. пояснити різницю між доходом, витратами, прибутком, залишком коштів і заборгованістю.\n\n## Передумови\n\nМодуль 1 «Хто такий ФОП». Спеціальні бухгалтерські знання не потрібні.\n\n## Основні терміни\n\n- **Дохід** — надходження, отримані від провадження підприємницької діяльності протягом звітного періоду.\n- **Витрати** — кошти, віддані за ресурси для діяльності.\n- **Прибуток** — різниця між доходом і витратами за період.\n- **Залишок коштів** — сума на рахунку на конкретну дату.\n- **Касовий метод** — визнання доходу за датою фактичного надходження коштів.\n- **Аванс** — кошти, отримані до виконання роботи.\n- **Дебіторська заборгованість** — сума, яку винні вам.\n- **Кредиторська заборгованість** — сума, яку винні ви.\n- **Власні кошти підприємця** — гроші тієї самої фізичної особи, внесені нею на підприємницький рахунок.\n\n## Теоретичний матеріал\n\n### 1. Чотири різні числа\n\nПочатківець зазвичай оперує одним числом — скільки грошей на картці. Насправді чисел щонайменше чотири, і вони майже ніколи не збігаються.\n\n| Число | На що відповідає | Де його видно |\n|---|---|---|\n| Залишок коштів | скільки грошей є просто зараз | виписка на дату |\n| Дохід | скільки надійшло від діяльності за період | облік доходів за період |\n| Витрати | скільки віддано за ресурси для діяльності | первинні документи й виписка |\n| Прибуток | що залишилося як результат роботи | різниця доходу й витрат |\n\nРізниця між доходом і прибутком закріплена і в податкових нормах. На загальній системі об’єктом оподаткування є **чистий оподатковуваний дохід** — різниця між загальним оподатковуваним доходом і документально підтвердженими витратами. [SRC-013] На спрощеній системі базою є сам **дохід**, тобто надходження, без вирахування витрат. [SRC-010] Тобто на спрощеній системі податок рахують від доходу, а прибуток підприємець рахує для себе — щоб розуміти, чи має сенс те, що він робить.\n\n> [!REMEMBER]\n> **Залишок на рахунку — не прибуток.** Усередині залишку можуть лежати чужі аванси, кошти до повернення й несплачені зобов’язання.\n\n### 2. Касовий метод: коли виникає дохід\n\nДля платника єдиного податку датою отримання доходу є **дата надходження коштів** у грошовій (готівковій або безготівковій) формі. [SRC-010] Не дата рахунку, не дата підписання акта, не дата, коли клієнт пообіцяв заплатити.\n\nЗ цього випливають два наслідки, які початківці плутають щомісяця:\n\n- акт підписано в жовтні, гроші надійшли в листопаді — доходу жовтня немає;\n- аванс отримано в жовтні, робота буде в листопаді — дохід виникає в жовтні.\n\nУ самій нормі є й інші дати для окремих випадків: для безоплатно отриманих товарів, робіт і послуг — дата підписання акта приймання-передачі; для платника третьої групи, який є платником ПДВ, — дата списання кредиторської заборгованості, за якою минув строк позовної давності. [SRC-010] Тому «касовий метод» — правильна назва загального правила, а не гасло «завжди тільки за грошима».\n\n> [!PRINCIPLE]\n> Дохід прив’язаний до руху коштів, а не до документа. Документ пояснює **за що** гроші, дата надходження — **коли** вони стали доходом.\n\n### 3. Надходження, які доходом не є\n\nПодатковий кодекс прямо перелічує суми, які до складу доходу платника єдиного податку не включаються. Для ФОП практично значущі: суми податку на додану вартість; суми поворотної фінансової допомоги, отриманої та поверненої протягом 12 календарних місяців з дня отримання, і суми кредитів; кошти цільового призначення з бюджетів і державних фондів; аванси й передоплати, що повертаються у зв’язку з поверненням товару, розірванням договору або за листом-заявою; оплата за товари, роботи й послуги, реалізовані в період сплати інших податків; повернення надміру сплачених податків і єдиного внеску. [SRC-010]\n\nПоворотна фінансова допомога — це кошти, отримані в користування за договором без процентів і з обов’язком повернення. [SRC-014] Ключова умова саме в строку: якщо її повернуто протягом 12 календарних місяців, вона доходом не є; якщо ні — правило перестає діяти. [SRC-010]\n\n> [!RISK]\n> У цьому переліку **немає** пункту про помилково зараховані кошти. Не посилайтеся на нього в такій ситуації: помилкове зарахування розбирають за іншими нормами, а податкову кваліфікацію конкретного випадку підтверджує бухгалтер.\n\n### 4. Особисті й підприємницькі кошти\n\nФізична особа відкриває **окремі** рахунки: для підприємницької діяльності, для незалежної професійної діяльності та для власних потреб. [SRC-021] Це не порада, а норма.\n\nДалі — те, про що частіше за все не знають:\n\n- **особистий рахунок заборонено використовувати** для операцій, пов’язаних із підприємницькою та незалежною професійною діяльністю; [SRC-021]\n- відкриваючи рахунок для власних потреб, фізична особа власноруч підписує в заяві, що їй про цю заборону відомо; [SRC-021]\n- фізична особа зобов’язана повідомити банк про свій статус підприємця; [SRC-021] [SRC-024]\n- банк повідомляє податкову про відкриття або закриття рахунку в день такої дії, і видаткові операції починаються після взяття рахунку на облік. [SRC-024]\n\nЗворотного правила закон не встановлює: **прямої заборони переказувати кошти з підприємницького рахунку на власні потреби** в Інструкції немає. [SRC-021] Підприємець не «отримує зарплату» у себе самого — він розпоряджається власними коштами, коли зобов’язання за період уже враховані.\n\nОкремо про внесення власних коштів **на** підприємницький рахунок. За змістом операції це не виручка: платник і отримувач — та сама особа, нової роботи не виконано. Але прямої норми про такі внески в Податковому кодексі немає, і податкова кваліфікація залежить від обставин та призначення платежу. [SRC-010] Тому в обліку таку операцію **позначають окремо** й узгоджують із бухгалтером, а не вирішують самостійно.\n\n> [!INFO]\n> Поширений міф: «податкова бачить кожен мій платіж». Автоматично передається лише факт відкриття або закриття рахунку. [SRC-024] Інформацію про обсяг і обіг коштів на рахунку контролюючий орган отримує **на підставі рішення суду**. [SRC-024] Це не привід розслаблятися: облік ведеться не тому, що хтось дивиться.\n\n### 5. Внутрішні перекази між власними рахунками\n\nЯкщо рахунків більше одного, та сама сума з’являється двічі: як списання в одній виписці й як надходження в іншій. Нових грошей при цьому не виникає, і виручки теж.\n\nПрактичне правило: перед класифікацією зіставте виписки між собою й позначте пари «пішло — прийшло». Непозначений внутрішній переказ — найтиповіша причина завищеного доходу в саморобному реєстрі.\n\n### 6. Аванси, повернення й помилкові зарахування\n\n**Аванс.** Гроші надійшли — дохід виник за датою надходження. [SRC-010] Одночасно виникло зобов’язання: виконати роботу або повернути кошти. Аванс — це єдиний випадок, коли одна операція збільшує і гроші, і борг.\n\n**Повернення авансу.** Суми, що повертаються покупцю у зв’язку з поверненням товару, розірванням договору або за листом-заявою, до доходу не включаються. [SRC-010] Тому повернення оформлюють документально, а не «просто відправляють назад».\n\n**Помилкове зарахування.** Тут важлива точність у термінах, бо побутове й законодавче значення не збігаються:\n\n| Ситуація | Як це називає закон | Що з цього випливає |\n|---|---|---|\n| Помилку зробив надавач платіжних послуг | помилкова платіжна операція [SRC-022] | діє стаття 88 Закону про платіжні послуги |\n| Помилку зробила третя особа, яка не є ініціатором чи надавачем | неналежна платіжна операція [SRC-022] | діє та сама стаття 88 |\n| Помилився сам платник (не ті реквізити) | не підпадає під ці визначення [SRC-022] | повертають як безпідставно набуте майно [SRC-023] |\n\nОсоба, на рахунок якої кошти зараховано без законних підстав, — це **неналежний отримувач**. [SRC-022] За статтею 88 він зобов’язаний ініціювати повернення протягом трьох робочих днів **з дати надходження повідомлення** надавача платіжних послуг, а не з дати зарахування. [SRC-022] За прострочення передбачено пеню; відмова повернути кошти вирішується в судовому порядку. [SRC-022]\n\nЯкщо ж реквізити переплутав сам платник, підставою повернення є норма про безпідставно набуте майно: особа, яка набула майно за рахунок іншої без достатньої правової підстави, зобов’язана його повернути. [SRC-023] Спеціального строку в три дні тут немає — але й підстав вважати ці гроші своїми теж немає.\n\n> [!RISK]\n> Найгірша дія з незрозумілим надходженням — залишити його «до з’ясування» й забути. Через місяць воно вже не відрізняється від звичайної виручки, а строк на спокійне повернення минув.\n\n### 7. Дебіторська й кредиторська заборгованість\n\n**Дебіторська заборгованість** — сума заборгованості дебіторів на певну дату; дебітори — особи, які внаслідок минулих подій заборгували певні суми. [SRC-019] Простіше: робота виконана, оплати ще немає.\n\n**Кредиторська заборгованість** окремого нормативного визначення не має — її описують через поняття **зобов’язання**: заборгованість, що виникла внаслідок минулих подій, погашення якої зменшить ресурси. [SRC-017] [SRC-018] Простіше: ви вже отримали гроші або товар, але ще не виконали свою частину.\n\nОбидва числа не видно у виписці — і саме тому про них згадують надто пізно.\n\nУ заборгованості є строки. Загальна позовна давність — три роки. [SRC-020] Але це не автоматичний таймер: для окремих вимог, наприклад про неустойку, встановлено один рік; строк може бути збільшений договором; відлік починається зі спливом строку виконання зобов’язання, а не з дати рахунку; і застосовує позовну давність суд лише за заявою сторони у спорі. [SRC-020] Тому «минуло три роки — можна забути» не працює; це питання до юриста.\n\n### 8. Активи і зобов’язання: мова, а не обов’язок\n\nСлова, якими описують гроші бізнесу, визначено Законом про бухгалтерський облік: **активи** — ресурси, контрольовані підприємством у результаті минулих подій, використання яких, як очікується, приведе до отримання економічних вигод; **зобов’язання** — заборгованість, що виникла внаслідок минулих подій, погашення якої зменшить ресурси; **господарська операція** — дія або подія, яка змінює структуру активів і зобов’язань. [SRC-017]\n\nВажлива межа: цей Закон поширюється на юридичних осіб. [SRC-017] ФОП немає в переліку суб’єктів, тому **обов’язку вести бухгалтерський облік і подавати фінансову звітність за цим Законом у ФОП немає**. Ці поняття потрібні як мова опису, а не як ваш обов’язок.\n\nЩо ФОП веде насправді:\n\n| Хто | Що веде | Як |\n|---|---|---|\n| Групи 1 і 2, група 3 без ПДВ | облік **доходів** | у довільній формі, помісячним відображенням отриманих доходів [SRC-011] |\n| Група 3 — платник ПДВ | облік доходів **і витрат** | за типовою формою Мінфіну [SRC-011] [SRC-016] |\n| Загальна система | облік доходів **і витрат** | за типовою формою; потрібні підтверджуючі документи щодо походження товару [SRC-013] [SRC-016] |\n\nКниги обліку доходів, які раніше були обов’язковими, скасовано. [SRC-015] «Довільна форма» означає свободу формату, а не свободу від обліку: показники формуються на підставі первинних документів, і формувати податкову звітність за непідтвердженими даними заборонено. [SRC-012] Документи потрібно зберігати; строки встановлює Податковий кодекс, і для документів, на які не поширюються спеціальні правила, це 1095 днів з дня подання звітності. [SRC-012] Конкретний строк для вашої ситуації підтверджує бухгалтер.\n\n> [!PRINCIPLE]\n> «Довільна форма» — про формат таблиці, а не про право не мати документів.\n\n## Покроковий процес\n\nЩоб закрити фінансовий місяць ФОП:\n\n1. Отримати виписки за всіма підприємницькими рахунками за весь період.\n2. Звірити вхідний залишок, надходження, списання й вихідний залишок.\n3. Позначити пари внутрішніх переказів між власними рахунками.\n4. Класифікувати кожне надходження: дохід, власні кошти, повернення, помилкове зарахування, нез’ясоване.\n5. Для доходу зафіксувати дату надходження коштів.\n6. Виділити аванси й перевірити, чи не було повернень.\n7. Скласти перелік виконаних робіт без оплати і власних невиконаних зобов’язань.\n8. Порахувати зобов’язання, які лежать усередині залишку.\n9. Визначити результат періоду й суму, якою справді можна розпоряджатися.\n10. Нез’ясовані операції винести в окремий список запитань, а не класифікувати навмання.\n\n## Практичні приклади\n\n### Приклад 1. Місяць із прибутком і порожнім рахунком\n\nДохід — 60 000 грн, витрати — 20 000 грн, прибуток — 40 000 грн. Але 35 000 грн підприємець зняв собі ще в середині місяця, а 18 000 грн з надходжень були авансом за листопадову роботу. Залишок на 31 жовтня — 7 000 грн. Прибуток є, вільних грошей немає.\n\n### Приклад 2. Акт у листопаді, дохід у жовтні\n\nКлієнт заплатив 25 жовтня, акт підписали 3 листопада. Дохід виник у жовтні — за датою надходження коштів. [SRC-010]\n\n### Приклад 3. Оплата на особисту картку\n\nКлієнт переказав 12 000 грн на особисту картку. Операції немає у виписці підприємницького рахунку, і використання особистого рахунку в підприємницькій діяльності заборонено. [SRC-021] Гроші не зникли — вони просто не потрапили в облік разом з іншими, і розбирати це доведеться окремо.\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Вважати залишок на рахунку прибутком | усередині залишку є чужі й зарезервовані кошти | рахувати результат за операціями, а не за станом рахунку |\n| Рахувати доходом усе, що надійшло | частина надходжень доходом не є [SRC-010] | класифікувати кожне надходження окремо |\n| Визнавати дохід за датою акта | для єдиного податку дата — це надходження коштів [SRC-010] | брати дату з виписки |\n| Вважати аванс «ще не доходом» | дохід виникає за датою надходження [SRC-010] | визнати дохід і окремо пам’ятати про зобов’язання |\n| Приймати оплату на особисту картку | особистий рахунок заборонено використовувати в діяльності [SRC-021] | приймати оплату на підприємницький рахунок |\n| Рахувати внутрішній переказ двома надходженнями | нових грошей не виникло | позначати пари переказів до класифікації |\n| Залишати помилкове зарахування «до з’ясування» | обов’язок повернення не зникає з часом [SRC-022] [SRC-023] | з’ясувати підставу й оформити повернення |\n| Вважати, що «довільна форма» = без документів | показники формуються на підставі первинних документів [SRC-012] | зберігати підтвердження до кожної операції |\n\n## Ризики й межі самостійних дій\n\n- Модуль не визначає ставок, лімітів і сум податку — це модулі 3 і 11.\n- Податкова кваліфікація внесення власних коштів на підприємницький рахунок залежить від обставин; рішення ухвалює бухгалтер.\n- Валютні надходження мають власні правила перерахунку — це модуль 17.\n- Готівка й розрахункові операції — модуль 10.\n- Строки зберігання документів і списання заборгованості потребують перевірки під конкретну ситуацію.\n- Норми Податкового кодексу змінюються; дата перевірки цього модуля вказана нижче.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, якщо треба підтвердити склад доходу за період, кваліфікувати нетипове надходження, визначити наслідки внесення власних коштів або зібрати облік за минулі періоди.\n\n**Юрист потрібен**, якщо контрагент вимагає повернення коштів, є спір за договором, минають строки стягнення заборгованості або йдеться про судовий порядок повернення.\n\n## Підсумок\n\nНадходження — не завжди дохід, залишок — не прибуток, а особисті й підприємницькі гроші мають різні правила. Дохід платника єдиного податку виникає за датою надходження коштів; частина надходжень до доходу не включається; особистий рахунок не використовують у підприємницькій діяльності; аванс одночасно створює гроші й зобов’язання; заборгованість не видно у виписці. ФОП не веде бухгалтерського обліку за Законом про бухоблік, але веде облік доходів — і робить це на підставі документів.\n\n## Самоперевірка\n\n1. Чим залишок коштів відрізняється від прибутку?\n2. На яку дату виникає дохід платника єдиного податку?\n3. Назвіть три надходження, які доходом не є.\n4. Чому аванс — це одночасно гроші й зобов’язання?\n5. Що каже норма про використання особистого рахунку в підприємницькій діяльності?\n6. Чим «помилкова платіжна операція» відрізняється від помилки самого платника?\n7. Де у виписці видно дебіторську заборгованість?\n8. Який облік зобов’язаний вести ФОП на спрощеній системі без ПДВ?\n\n## Джерела\n\nПовна карта тверджень і посилань наведена в `references.md`. Основні джерела: Податковий кодекс України, Закон № 1591-IX «Про платіжні послуги», Цивільний кодекс України, Інструкція НБУ про порядок відкриття та закриття рахунків, Закон № 996-XIV про бухгалтерський облік, національні положення (стандарти) бухгалтерського обліку та накази Мінфіну.\n\n## Дата перевірки актуальності\n\n- Норми перевірено: **24.08.2026**.\n- Наступна перевірка модуля: **01.11.2026** — на цю дату призначено нову редакцію Податкового кодексу.\n- Людська фактологічна перевірка: **не проведена**."}, {"id": "practice", "title": "Практика", "content": "# Практика: розбір банківської виписки ФОП\n\n## Мета\n\nНавчитися класифікувати кожну операцію за її справжнім змістом і бачити, які надходження не є доходом.\n\n## Навчальна ситуація\n\nВикористовуйте лише наведені синтетичні дані. Не вводьте реальні реквізити, суми чи персональні дані.\n\nВиписка підприємницького рахунку **ФОП Ніни Прикладної** за жовтень 2026:\n\n| Дата | Сума, грн | Контрагент | Призначення |\n|---|---|---|---|\n| 01.10 | 12 000 | — | вхідний залишок |\n| 02.10 | +40 000 | ТОВ «Сігма» | оплата за консультаційні послуги, акт № 7 від 30.09.2026 |\n| 05.10 | +25 000 | Прикладна Н. | поповнення рахунку власними коштами підприємця |\n| 09.10 | +7 300 | ПП «Омега» | оплата за рахунком № 112 |\n| 11.10 | −7 300 | ПП «Омега» | повернення помилково зарахованих коштів |\n| 14.10 | +18 000 | ФОП Марченко | аванс за послуги; акт буде підписано в листопаді |\n| 18.10 | −6 000 | орендодавець | оренда робочого місця за жовтень |\n| 21.10 | −1 400 | банк | комісія за обслуговування рахунку |\n| 23.10 | +9 000 | фізична особа | переказ |\n| 26.10 | −20 000 | Прикладна Н. | переказ на власний особистий рахунок |\n\nДодатково відомо:\n\n- контрагент ПП «Омега» надіслав лист: платіж призначався іншому отримувачу, просить повернути;\n- 28.10 підписано акт № 9 на 15 000 грн з ТОВ «Дельта», кошти не надійшли;\n- 30.10 клієнт сплатив 12 000 грн на особисту картку Ніни; у цій виписці операції немає.\n\n## Завдання 1. Класифікуйте операції\n\nДля кожного рядка визначте, чим є операція: доходом, власними коштами, поверненням, помилковим зарахуванням, витратою — або операцією, яку неможливо класифікувати з наявних даних.\n\n## Завдання 2. Знайдіть те, чого не можна визначити\n\nПозначте операції, для яких даних недостатньо, і напишіть, що саме потрібно запитати. Не класифікуйте навмання.\n\n## Завдання 3. Порахуйте два числа\n\n1. Вихідний залишок на 31.10.2026 — за всіма операціями рахунку.\n2. Дохід жовтня від оплат клієнтів — за датою надходження коштів.\n\nПоясніть, чому ці два числа не збігаються.\n\n## Критерії виконання\n\n- кожна операція має класифікацію із зазначеним джерелом підтвердження;\n- операції, які неможливо класифікувати, позначено як такі, а не заповнено припущенням;\n- аванс враховано за датою надходження коштів;\n- власне поповнення й помилкове зарахування не потрапили в дохід від клієнтів;\n- операція на особистій картці позначена як не підтверджена цією випискою."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Скільки я заробив?»\n\n## Ситуація\n\nІгор — ФОП, консультант. Наприкінці місяця він відкриває банківський застосунок, бачить на підприємницькому рахунку **96 400 грн** і робить висновок: «Ось стільки я заробив».\n\nДалі він:\n\n- планує зняти всю суму на власні потреби;\n- рахує доходом усе, що надійшло, разом із власним поповненням рахунку на початку місяця;\n- має аванс від клієнта за роботу, яку виконає лише наступного місяця;\n- бачить у виписці помилкове зарахування від незнайомого платника і лист контрагента з проханням повернути кошти, але відкладає це «до з’ясування»;\n- прийняв оплату від нового клієнта на особисту картку, бо «так швидше»;\n- не перевіряв, які зобов’язання за цей період ще не сплачено;\n- не звіряв комісію банку з тарифним пакетом.\n\nУсі дані синтетичні.\n\n## Завдання\n\n1. Знайдіть щонайменше п’ять реальних фінансових ризиків і відокремте їх від того, що лише звучить по-бухгалтерськи.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Складіть безпечну послідовність дій — без розрахунку конкретних сум податку.\n4. Поясніть клієнтові своїми словами, чому залишок на рахунку не є відповіддю на питання «скільки я заробив».\n\n## Орієнтир для самоперевірки\n\n- залишок — це стан рахунку на одну дату, а не результат періоду;\n- частина залишку може вже належати іншим: аванс клієнта, помилкове зарахування, несплачені зобов’язання;\n- власне поповнення рахунку не створює виручки, бо платник і отримувач — та сама особа;\n- оплата, прийнята повз підприємницький рахунок, не зникає — вона просто не потрапляє в облік разом з іншими;\n- спочатку класифікують і рахують, і лише потім знімають кошти.\n\nЦе навчальний кейс, а не індивідуальна податкова чи юридична консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст місячної фінансової самоперевірки ФОП\n\n## Гроші й залишок\n\n- [ ] Отримано виписку за весь період без пропущених днів.\n- [ ] Вхідний залишок, надходження, списання і вихідний залишок сходяться.\n- [ ] Залишок на рахунку не використано як оцінку прибутку.\n- [ ] Відомо, які зобов’язання «сидять» усередині залишку: податки, аванси клієнтів, неоплачені рахунки.\n\n## Класифікація надходжень\n\n- [ ] Кожне надходження має класифікацію, а не лише суму.\n- [ ] Для доходу зафіксовано дату його фактичного отримання.\n- [ ] Надходження, які доходом не є, виділено окремо із зазначенням причини.\n- [ ] Помилкові зарахування виявлено, і по кожному видно ухвалене рішення.\n- [ ] Аванси й передоплати позначено, а їх повернення відстежено.\n- [ ] Незрозумілі надходження позначено як такі, що потребують запиту, а не класифіковано навмання.\n\n## Особисте й підприємницьке\n\n- [ ] Поповнення власними коштами відокремлено від виручки клієнтів.\n- [ ] Перекази між власними рахунками не пораховано двічі.\n- [ ] Перевірено, чи не приймалась оплата від клієнтів на особистий рахунок.\n- [ ] Зняття коштів на особисті потреби відокремлено від витрат діяльності.\n\n## Заборгованість\n\n- [ ] Складено перелік виконаних робіт, за які оплату ще не отримано.\n- [ ] Складено перелік власних невиконаних зобов’язань за вже отриманими коштами.\n- [ ] Перевірено, чи є заборгованість, за якою минають строки.\n\n## Контроль якості\n\n- [ ] Жодну операцію не класифіковано припущенням замість документа.\n- [ ] У навчальних матеріалах не використано реальні персональні або банківські дані.\n- [ ] Питання поза межами класифікації передано бухгалтеру або юристу."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 2\n\n| Термін | Просте пояснення |\n|---|---|\n| Дохід | Надходження, отримані від провадження підприємницької діяльності за період. |\n| Витрати | Кошти, віддані за ресурси, потрібні для діяльності. |\n| Прибуток | Різниця між доходом і витратами за період. |\n| Залишок коштів | Сума грошей на рахунку на конкретну дату. |\n| Касовий метод | Визнання доходу за датою фактичного надходження коштів. |\n| Аванс | Кошти, отримані до виконання роботи або постачання товару. |\n| Дебіторська заборгованість | Сума, яку винні вам: робота виконана, оплати ще немає. |\n| Кредиторська заборгованість | Сума, яку винні ви: отриманий аванс, неоплачений рахунок. |\n| Зобов’язання | Заборгованість, що виникла з минулих подій і погашення якої зменшить ваші ресурси. |\n| Актив | Ресурс, контрольований у результаті минулих подій, від якого очікують економічну вигоду. |\n| Помилково зараховані кошти | Кошти, зараховані отримувачу без достатньої правової підстави. |\n| Неналежний отримувач | Особа, на рахунок якої без законних підстав зараховано суму платіжної операції. |\n| Поворотна фінансова допомога | Кошти, отримані в користування за договором без процентів і з обов’язком повернення. |\n| Власні кошти підприємця | Гроші тієї самої фізичної особи, внесені нею на підприємницький рахунок. |\n| Внутрішній переказ | Рух коштів між власними рахунками однієї особи; нових грошей не створює. |\n| Підприємницький рахунок | Рахунок, відкритий фізичною особою для здійснення підприємницької діяльності. |"}, {"id": "reference", "title": "Пам’ятка", "content": "# Пам’ятка: гроші ФОП\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-08-24**\n\n## Чотири числа, які не можна плутати\n\n| Число | Питання, на яке відповідає |\n|---|---|\n| Залишок коштів | скільки грошей є зараз |\n| Дохід | скільки надійшло від діяльності за період |\n| Витрати | скільки віддано за ресурси для діяльності |\n| Прибуток | що залишилося як результат роботи |\n\nПрибуток може бути, коли рахунок майже порожній. Залишок може бути великим у збитковому місяці.\n\n## Коли виникає дохід\n\nДата доходу для платника єдиного податку — **дата надходження коштів**, не дата акта й не дата рахунку.\n\n- гроші в жовтні, акт у листопаді → дохід жовтня;\n- акт у жовтні, гроші в листопаді → доходу жовтня немає;\n- аванс у жовтні за листопадову роботу → дохід жовтня.\n\n## Надходження, які доходом не є\n\n- суми ПДВ;\n- поворотна фінансова допомога, повернена протягом 12 календарних місяців, і кредити;\n- кошти цільового призначення з бюджетів і державних фондів;\n- аванси, що повертаються у зв’язку з поверненням товару, розірванням договору або листом-заявою;\n- оплата за реалізоване в період сплати інших податків;\n- повернення надміру сплачених податків і єдиного внеску.\n\nПомилкового зарахування в цьому переліку **немає** — його розбирають окремо.\n\n## Особисте й підприємницьке\n\n| Дія | Правило |\n|---|---|\n| Рахунки | окремі: для діяльності й для власних потреб |\n| Оплата клієнта на особисту картку | заборонено використовувати особистий рахунок у діяльності |\n| Переказ із підприємницького рахунку собі | прямої заборони немає |\n| Внесення власних коштів на підприємницький рахунок | позначити окремо, кваліфікацію узгодити з бухгалтером |\n| Повідомлення банку про статус підприємця | обов’язкове |\n\n## Незрозуміле надходження: що робити\n\n1. Не витрачати.\n2. Знайти підставу: договір, рахунок, лист платника.\n3. Якщо підстави немає — готувати повернення, а не чекати.\n4. Зафіксувати дату, коли надійшло повідомлення про помилку: від неї рахують строк.\n5. Не залишати в реєстрі запис «до з’ясування» без дати й відповідального.\n\n## Заборгованість, якої немає у виписці\n\n| Що | Де шукати |\n|---|---|\n| Вам винні | підписані акти й виставлені рахунки без оплати |\n| Винні ви | отримані аванси, неоплачені рахунки постачальників |\n\nЗагальна позовна давність — три роки, але відлік, винятки й застосування судом перевіряють окремо.\n\n## Що ФОП веде замість бухобліку\n\n| Хто | Що |\n|---|---|\n| Групи 1, 2 і 3 без ПДВ | облік доходів у довільній формі, помісячно |\n| Група 3 з ПДВ | доходи й витрати за типовою формою |\n| Загальна система | доходи й витрати за типовою формою |\n\nДовільна форма — про формат таблиці, а не про право не мати документів."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 2\n\nПеревірено: **2026-08-24**. Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Податкового кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Доходом ФОП — платника єдиного податку є дохід, отриманий за звітний період у грошовій формі | SRC-010, ПКУ, пункт 292.1 | Норма закону | Пасивні доходи й окремі операції з майном до нього не входять |\n| Датою отримання доходу є дата надходження коштів | SRC-010, ПКУ, пункт 292.6 | Норма закону | Є окремі дати для безоплатно отриманих товарів і для 3 групи з ПДВ |\n| Перелік сум, які до складу доходу не включаються | SRC-010, ПКУ, пункт 292.11 | Норма закону | Помилково зарахованих коштів у переліку немає |\n| Поворотна фінансова допомога — кошти без процентів з обов’язком повернення | SRC-014, ПКУ, підпункт 14.1.257 | Норма закону | Не є доходом лише за умови повернення протягом 12 календарних місяців (SRC-010) |\n| На загальній системі об’єкт оподаткування — чистий оподатковуваний дохід | SRC-013, ПКУ, пункт 177.2 | Норма закону | Використано як контраст «дохід ≠ прибуток» |\n| ФОП груп 1, 2 і 3 без ПДВ ведуть облік доходів у довільній формі помісячно | SRC-011, ПКУ, пункт 296.1 | Норма закону | Витрати в цій нормі не згадані |\n| ФОП групи 3 з ПДВ і на загальній системі ведуть облік доходів і витрат за типовою формою | SRC-011, SRC-013, SRC-016 | Норма закону й наказ Мінфіну | Періодичність записів за Порядком — за підсумками робочого дня |\n| Книги обліку доходів для ФОП скасовано | SRC-015, наказ Мінфіну № 728 | Підзаконний акт | Втрата чинності наказу № 579 з 01.01.2021 |\n| Облік ведеться на підставі первинних документів; звітність за непідтвердженими даними заборонена | SRC-012, ПКУ, пункт 44.1 | Норма закону | Це джерело вимоги «первинний документ» для ФОП, а не Закон про бухоблік |\n| Для документів, на які не поширюються спеціальні правила, строк зберігання — 1095 днів | SRC-012, ПКУ, підпункт 44.3.3 | Норма закону | Відлік від дня подання звітності; конкретний строк підтверджує бухгалтер |\n| Фізична особа відкриває окремі рахунки для діяльності та для власних потреб | SRC-021, Інструкція НБУ, пункт 10 розділу I | Норма підзаконного акта | Пряма норма, не рекомендація |\n| Особистий рахунок заборонено використовувати в підприємницькій діяльності | SRC-021, Інструкція НБУ, пункт 24 розділу I | Норма підзаконного акта | Заява про відкриття містить підпис про обізнаність із забороною |\n| Прямої заборони переказувати кошти з підприємницького рахунку на власні потреби немає | SRC-021 | Відсутність норми в акті | Формулювати як відсутність заборони, а не як дозвіл із джерелом |\n| ФОП зобов’язаний повідомити банк про свій статус | SRC-021, SRC-024, ПКУ, пункт 69.7 | Норма закону й підзаконного акта | Дублюється у двох актах |\n| Банк повідомляє податкову про відкриття рахунку в день такої дії | SRC-024, ПКУ, пункт 69.2 | Норма закону | Видаткові операції — після взяття рахунку на облік (пункт 69.4) |\n| Інформацію про обсяг і обіг коштів контролюючий орган отримує на підставі рішення суду | SRC-024, ПКУ, підпункт 20.1.5 | Норма закону | Спростовує міф «податкова бачить кожен платіж» |\n| Помилкова платіжна операція — помилка надавача платіжних послуг | SRC-022, Закон № 1591-IX, стаття 1, пункт 69 | Норма закону | Побутове значення терміна ширше за законодавче |\n| Неналежний отримувач — особа, на рахунок якої кошти зараховано без законних підстав | SRC-022, Закон № 1591-IX, стаття 1, пункт 43 | Норма закону | — |\n| Неналежний отримувач повертає кошти протягом трьох робочих днів з дати повідомлення | SRC-022, Закон № 1591-IX, стаття 88 | Норма закону | Строк рахують від повідомлення, а не від зарахування |\n| Помилку самого платника розбирають за нормою про безпідставно набуте майно | SRC-023, ЦКУ, стаття 1212 | Норма закону | Спеціального строку ця стаття не встановлює |\n| Дебіторська заборгованість — сума заборгованості дебіторів на певну дату | SRC-019, НП(С)БО 10, пункт 4 | Стандарт | Стандарт застосовують юридичні особи; для курсу це джерело термінології |\n| Кредиторська заборгованість окремого нормативного визначення не має | SRC-017, SRC-018 | Поняття «зобов’язання» | Не приписувати НП(С)БО 11 визначення, якого в ньому немає |\n| Активи, зобов’язання і господарська операція визначені Законом про бухоблік | SRC-017, Закон № 996-XIV, стаття 1 | Норма закону | Усі визначення сформульовані через «підприємство» |\n| Закон про бухоблік поширюється на юридичних осіб; ФОП у переліку суб’єктів немає | SRC-017, Закон № 996-XIV, стаття 2 | Норма закону | Прямої норми «не поширюється на ФОП» у Законі немає — ФОП поза колом суб’єктів |\n| Загальна позовна давність — три роки | SRC-020, ЦКУ, стаття 257 | Норма закону | Відлік — стаття 261; спеціальні строки — стаття 258; застосування судом за заявою — стаття 267 |\n\n## Межі перевірки\n\n- Модуль не встановлює ставок, лімітів доходу, строків сплати й сум податку: ці норми (статті 291, 293, 295 ПКУ) у межах модуля **не перевірялися**.\n- Податкову кваліфікацію внесення власних коштів на підприємницький рахунок прямою нормою ПКУ не врегульовано. Модуль подає це як питання до бухгалтера й не стверджує остаточної відповіді. Роз’яснення ДПС у реєстр не внесено: офіційні сторінки ДПС недоступні для автоматичної перевірки, а знайдені відповіді ЗІР мають позначку «діяла до» і не є чинними.\n- Твердження про строк зберігання документів для ФОП подано як загальну норму пункту 44.3, а не як адресну норму для ФОП: прямої норми з такою адресацією в Кодексі немає.\n- Тема списання заборгованості за спливом позовної давності потребує окремої перевірки зупинення перебігу строків; у межах модуля вона не розкривається.\n- Інструкція НБУ № 162 має проєкт змін, оприлюднений у 2026 році. Станом на 24.08.2026 акт про затвердження змін не набрав чинності; перед релізом перевірити повторно."}], "quiz": [{"id": "m02-q01", "title": "Поповнення власними коштами", "competency": "inflow_vs_income", "scenario": "На підприємницький рахунок надійшло 25 000 грн від самої підприємиці з призначенням «поповнення власними коштами».", "question": "Як бухгалтер має опрацювати цю операцію?", "options": [{"text": "Позначити як власні кошти окремо і не змішувати з виручкою клієнтів", "correct": true, "feedback": "Правильно. Платник і отримувач тут одна особа, тому нової виручки не виникає."}, {"text": "Врахувати як виручку жовтня: кошти надійшли на підприємницький рахунок", "feedback": "Ні. Сам факт зарахування на підприємницький рахунок не робить суму оплатою клієнта."}, {"text": "Не відображати ніде: операції між власними рахунками не обліковують", "feedback": "Ні. Операція проходить через рахунок і має бути видно в реєстрі з поясненням."}], "explanation": "Класифікація визначається змістом операції, а не рахунком, на який надійшли кошти. Внесення власних коштів позначають окремо, а податкову кваліфікацію нетипових внесків підтверджує бухгалтер.", "source_reference": ["SRC-010"], "hint": "Запитайте себе, хто заплатив ці гроші і чи з’явився в результаті новий клієнт."}, {"id": "m02-q02", "title": "Дата виникнення доходу", "competency": "cash_basis", "scenario": "Рахунок виставлено 28 вересня, кошти надійшли 25 жовтня, акт підписано 3 листопада.", "question": "На яку дату виникає дохід платника єдиного податку?", "options": [{"text": "На дату виставлення рахунка, бо саме тоді зафіксовано суму послуги", "feedback": "Ні. Рахунок лише повідомляє суму до сплати і не створює доходу сам по собі."}, {"text": "На дату надходження коштів на рахунок підприємця, тобто 25 жовтня", "correct": true, "feedback": "Правильно. Момент визнання доходу прив’язаний саме до руху коштів."}, {"text": "На дату підписання акта, бо він підтверджує виконання роботи", "feedback": "Ні. Акт підтверджує зміст операції, але не визначає періоду визнання доходу."}], "explanation": "Для платника єдиного податку датою отримання доходу є дата надходження коштів у грошовій формі. Документи пояснюють, за що гроші, а дата виписки показує, коли вони стали доходом.", "source_reference": ["SRC-010"], "hint": "З трьох дат у сценарії лише одна пов’язана з фактичним рухом грошей."}, {"id": "m02-q03", "title": "Аванс за майбутню роботу", "competency": "advance_recognition", "scenario": "У жовтні ФОП отримав аванс 18 000 грн за послугу, яку виконає в листопаді.", "question": "Що правильно зробити з цією сумою?", "options": [{"text": "Не визнавати доходом до моменту підписання акта з клієнтом у листопаді", "feedback": "Ні. Очікування акта не переносить дохід у наступний період для єдиного податку."}, {"text": "Визнати доходом листопада разом з іншими надходженнями місяця", "feedback": "Ні. Період визначається датою надходження коштів, а вона припадає на жовтень."}, {"text": "Визнати доходом жовтня і пам’ятати про зобов’язання перед клієнтом", "correct": true, "feedback": "Правильно. Одна операція одночасно створює дохід періоду і зобов’язання виконати роботу."}], "explanation": "Аванс — єдиний випадок, коли надходження водночас збільшує дохід періоду і створює борг перед клієнтом. Саме тому аванс не можна вважати вільними грошима.", "source_reference": ["SRC-010"], "hint": "Подумайте окремо про дві речі: коли виникає дохід і що підприємець залишається винен клієнту."}, {"id": "m02-q04", "title": "Повернення авансу клієнту", "competency": "returns", "scenario": "Клієнт скасував замовлення, і ФОП повернув йому раніше отриманий аванс за листом-заявою.", "question": "Як повернення впливає на дохід?", "options": [{"text": "Дохід не змінюється: кошти вже були отримані в попередньому періоді", "feedback": "Ні. Для повернених сум передбачено окреме правило, і воно змінює наслідок."}, {"text": "Сума, що повертається покупцю, до складу доходу не включається", "correct": true, "feedback": "Правильно. Повернення авансу за листом-заявою прямо назване серед винятків."}, {"text": "Повернення зменшує витрати періоду, а не дохід підприємця", "feedback": "Ні. Повернення чужих коштів не є витратою на ресурси для діяльності."}], "explanation": "Суми, що повертаються покупцю у зв’язку з поверненням товару, розірванням договору або за листом-заявою, до складу доходу не включаються. Тому повернення оформлюють документально.", "source_reference": ["SRC-010"], "hint": "Згадайте перелік сум, які до складу доходу не включаються, і знайдіть у ньому цей випадок."}, {"id": "m02-q05", "title": "Строк повернення чужих коштів", "competency": "mistaken_credit", "scenario": "Банк повідомив ФОП, що на його рахунок помилково зараховано кошти іншого отримувача.", "question": "Від якої події рахують строк на повернення?", "options": [{"text": "Від дати надходження повідомлення надавача платіжних послуг", "correct": true, "feedback": "Правильно. Відлік починається саме з повідомлення, а не з руху коштів."}, {"text": "Від дати зарахування коштів на рахунок неналежного отримувача", "feedback": "Ні. Зарахування могло статися раніше, ніж отримувач узагалі дізнався про помилку."}, {"text": "Від дати, коли отримувач самостійно виявив зайву суму у виписці", "feedback": "Ні. Момент самостійного виявлення суми законом як початок відліку не названо."}], "explanation": "Неналежний отримувач зобов’язаний ініціювати повернення протягом трьох робочих днів з дати надходження повідомлення надавача платіжних послуг. Прострочення має власні наслідки.", "source_reference": ["SRC-022"], "hint": "У сценарії є дві різні події: рух коштів і повідомлення. Одна з них запускає відлік."}, {"id": "m02-q06", "title": "Помилка самого платника", "competency": "mistaken_credit", "scenario": "Контрагент помилився в реквізитах і сам надіслав кошти не тому ФОП; банк помилки не робив.", "question": "Яка правова підстава повернення в цьому випадку?", "options": [{"text": "Стаття про помилкову платіжну операцію: помилка сталася під час платежу", "feedback": "Ні. Це поняття в законі означає вужчу ситуацію, ніж будь-яка помилка з коштами."}, {"text": "Спеціальний тридобовий строк діє для будь-якої помилки з коштами", "feedback": "Ні. Цей строк установлено для окремих випадків, а не для всіх помилкових переказів."}, {"text": "Норма про обов’язок повернути безпідставно набуте майно", "correct": true, "feedback": "Правильно. Коли помилився сам платник, працює загальна цивільна норма."}], "explanation": "Закон розрізняє помилку надавача платіжних послуг і помилку самого платника. У другому випадку підставою повернення є норма про безпідставно набуте майно, і спеціального строку вона не встановлює.", "source_reference": ["SRC-022", "SRC-023"], "hint": "Зверніть увагу, чия саме помилка описана в сценарії: від цього залежить, який закон працює."}, {"id": "m02-q07", "title": "Оплата на особисту картку", "competency": "accounts_separation", "scenario": "Клієнт пропонує сплатити за послугу переказом на особисту картку підприємця.", "question": "Що встановлює норма про використання рахунків?", "options": [{"text": "Особистий рахунок можна використовувати, якщо сума операції невелика", "feedback": "Ні. Норма не ставить використання рахунку в залежність від розміру платежу."}, {"text": "Особистий рахунок не використовують для підприємницьких операцій", "correct": true, "feedback": "Правильно. Для діяльності відкривають окремий рахунок, і це пряма вимога."}, {"text": "Обмежень немає: рахунки фізичної особи не поділяються за призначенням", "feedback": "Ні. Рахунки для власних потреб і для діяльності розмежовані нормативно."}], "explanation": "Фізична особа відкриває окремі рахунки для підприємницької діяльності та для власних потреб, а використання особистого рахунку в діяльності прямо заборонене. Підтвердження цього підписує сам клієнт у заяві на відкриття.", "source_reference": ["SRC-021"], "hint": "Пригадайте, що фізична особа підписує в заяві, коли відкриває картку для власних потреб."}, {"id": "m02-q08", "title": "Переказ собі з підприємницького рахунку", "competency": "accounts_separation", "scenario": "Підприємиця хоче переказати частину коштів із підприємницького рахунку на власну картку.", "question": "Що відомо про такий переказ із норм?", "options": [{"text": "Прямої заборони такого переказу норми не встановлюють", "correct": true, "feedback": "Правильно. Заборона стосується протилежного напрямку використання рахунків."}, {"text": "Такий переказ заборонений так само, як зворотний напрямок", "feedback": "Ні. Обмеження сформульоване для рахунку, відкритого для власних потреб."}, {"text": "Такий переказ потребує окремого дозволу банку на кожну суму", "feedback": "Ні. Окремого дозвільного порядку для таких переказів норми не передбачають."}], "explanation": "Заборона адресована використанню особистого рахунку в підприємницькій діяльності. Зворотного правила немає: підприємець розпоряджається власними коштами після того, як зобов’язання періоду враховані.", "source_reference": ["SRC-021"], "hint": "Порівняйте два напрямки руху коштів і згадайте, до якого саме рахунку адресована заборона."}, {"id": "m02-q09", "title": "Виконана робота без оплати", "competency": "receivables", "scenario": "Акт на 15 000 грн підписано в жовтні, але клієнт не заплатив до кінця місяця.", "question": "Як це відображається у фінансовій картині жовтня?", "options": [{"text": "Як дохід жовтня: робота виконана й підтверджена підписаним актом", "feedback": "Ні. Для єдиного податку підписаний акт без оплати доходу періоду не створює."}, {"text": "Ніяк: подія без руху коштів у фінансовій картині не враховується", "feedback": "Ні. Невиконане зобов’язання клієнта треба бачити, інакше про нього забувають."}, {"text": "Як дебіторська заборгованість, доходу жовтня ця сума не створює", "correct": true, "feedback": "Правильно. Сума існує у фінансовій картині, але поза рухом коштів періоду."}], "explanation": "Виконана й неоплачена робота — це дебіторська заборгованість. У виписці її не видно, тому її ведуть окремо за підписаними актами й виставленими рахунками.", "source_reference": ["SRC-010", "SRC-019"], "hint": "Питання складається з двох частин: чи є тут дохід періоду і чи є що взагалі обліковувати."}, {"id": "m02-q10", "title": "Який облік веде ФОП", "competency": "records_duty", "scenario": "ФОП на спрощеній системі без ПДВ питає, чи має він вести бухгалтерський облік.", "question": "Яка відповідь правильна?", "options": [{"text": "Так, бухгалтерський облік ведуть усі суб’єкти господарювання країни", "feedback": "Ні. Коло суб’єктів, на які поширюється Закон про бухоблік, окреслене інакше."}, {"text": "Ні, він веде облік доходів у довільній формі помісячно", "correct": true, "feedback": "Правильно. Для цієї категорії передбачено саме облік доходів, а не бухоблік."}, {"text": "Так, але за спрощеною формою бухгалтерського обліку для ФОП", "feedback": "Ні. Спрощений бухгалтерський облік адресований юридичним особам, а не ФОП."}], "explanation": "ФОП груп 1, 2 і 3 без ПДВ ведуть облік доходів у довільній фо Ситуація", "reasoning_prompt": "Чому залишок на рахунку не показує, скільки Ігор заробив за місяць?", "reasoning_min_chars": 60, "order_feedback": "Послідовність потребує виправлення: спочатку зупиніть те, що псує дані, потім зберіть і класифікуйте операції, і лише наприкінці ухвалюйте рішення про гроші.", "how_to": ["Прочитайте ситуацію і позначте лише ті твердження, які справді створюють фінансовий ризик.", "Для кожного ризику поставте позначку або одразу оберіть категорію чи відповідального — список сам позначить твердження як ризик.", "Якщо твердження неоднозначне, натисніть «Підказка» під ним: вона ставить навідне питання, але не називає відповіді.", "Розставте дії у безпечному порядку: перетягніть картку мишею або скористайтеся стрілками. Картка зеленіє одразу, щойно опиняється на своєму місці.", "Напишіть власне пояснення щонайменше з 60 символів; кнопка підказки покаже, що воно має містити.", "Натисніть «Перевірити рішення» і виправляйте відповідь, доки результат не досягне 80%."], "situation": ["Ігор побачив на підприємницькому рахунку 96 400 грн наприкінці місяця", "вирішив, що це його прибуток, і планує зняти всю суму", "порахував доходом усе, що надійшло, разом із власним поповненням рахунку", "отримав аванс за роботу, яку виконає лише наступного місяця", "залишив помилково зараховані кошти «до з’ясування» і відклав лист контрагента з проханням їх повернути", "прийняв оплату від нового клієнта на особисту картку, бо «так швидше»", "не перевірив, які зобов’язання за цей період ще не сплачено", "не звірив комісію банку з тарифним пакетом"], "categories": ["результат", "дохід", "зобов’язання", "кошти", "банківський", "податковий"], "owners": ["власник", "бухгалтер", "юрист"], "risks": [{"id": "balance_as_profit", "text": "Вважати залишок на рахунку прибутком місяця", "critical": true, "category": "результат", "owner": "власник", "feedback": "Залишок — це стан рахунку на одну дату. Усередині нього можуть лежати чужі аванси, невиконані зобов’язання й несплачені податки.", "hint": "Запитайте себе, чи всі гроші на цьому рахунку належать Ігорю остаточно — чи частина з них уже комусь обіцяна."}, {"id": "own_top_up", "text": "Рахувати доходом власне поповнення підприємницького рахунку", "critical": true, "category": "дохід", "owner": "бухгалтер", "feedback": "Переміщення власних грошей на власний рахунок не створює нової виручки: платник і отримувач — та сама особа.", "hint": "Подумайте, хто саме заплатив ці гроші і чи з’явився в результаті новий клієнт або нова виконана робота."}, {"id": "advance_as_free", "text": "Вважати отриманий аванс вільними коштами, поки робота не виконана", "critical": true, "category": "зобов’язання", "owner": "бухгалтер", "feedback": "Аванс одночасно збільшує гроші на рахунку і створює зобов’язання виконати роботу або повернути кошти.", "hint": "Уявіть, що клієнт завтра скасує замовлення. Що станеться з цією сумою?"}, {"id": "mistaken_ignored", "text": "Залишити помилково зараховані кошти без рішення й відкласти лист контрагента", "critical": true, "category": "кошти", "owner": "юрист", "feedback": "Помилкове зарахування не стає власністю отримувача від того, що воно лежить на рахунку; письмову вимогу не можна ігнорувати.", "hint": "Запитайте себе, чиї це гроші за змістом операції і що змінює час, поки вони лежать на рахунку."}, {"id": "personal_card", "text": "Приймати оплату від клієнта на особисту картку", "critical": true, "category": "банківський", "owner": "власник", "feedback": "Оплата, що прийшла повз підприємницький рахунок, не потрапляє в підприємницький облік разом з іншими й виявляється найпізніше.", "hint": "Подумайте, у якій виписці бухгалтер побачить цю оплату наприкінці місяця — і чи побачить її взагалі."}, {"id": "no_liabilities_check", "text": "Планувати зняти весь залишок, не перевіривши несплачених зобов’язань періоду", "critical": true, "category": "податковий", "owner": "бухгалтер", "feedback": "Спершу визначають зобов’язання періоду, і лише залишок після них є вільною сумою лишку; операції повз підприємницький рахунок.", "Поясніть, чому спочатку рахують, а потім знімають.", "Не переказуйте ситуацію — сформулюйте висновок, який ви сказали б клієнту."], "reasoning_aspects": [{"label": "Надходження й дохід", "terms": ["дохід", "надходж", "виручк", "оплат"]}, {"label": "Власні кошти й особистий рахунок", "terms": ["власн", "поповнен", "особист", "картк"]}, {"label": "Зобов’язання всередині залишку", "terms": ["аванс", "зобов", "поверн", "борг"]}, {"label": "Податкова частина залишку", "terms": ["податк", "сплат", "бюджет"]}, {"label": "Час і період", "terms": ["дат", "період", "місяц", "касов"]}], "reasoning_model": "Залишок на рахунку показує лише те, скільки грошей лежить на ньому на одну конкретну дату. Усередині цієї суми можуть бути власні поповнення Ігоря, аванс клієнта за ще не виконану роботу, помилково зараховані чужі кошти й несплачені зобов’язання періоду. Водночас поза цим рахунком залишилася оплата, яку Ігор прийняв на особисту картку, і робота, за яку йому ще не заплатили. Тому результат місяця визначають класифікацією кожної операції та підрахунком зобов’язань, а не поглядом на залишок; знімати кошти можна лише після цього."}, "checklist": {"title": "Місячна фінансова самоперевірка ФОП", "instructions": "Пройдіть перевірку так, як її робить бухгалтер наприкінці місяця. Для кожного пункту виберіть обґрунтований статус і напишіть, чим він підтверджений або чого бракує.", "how_to": ["Тримайте перед очима результат Практики: чекліст перевіряє саме той спосіб мислення.", "Ідіть зверху вниз і для кожного пункту виберіть статус: підтверджено, потрібні дані або не застосовується.", "У полі праворуч напишіть, чим статус підтверджено або що саме треба отримати — щонайменше 10 символів.", "Якщо незрозуміло, що саме перевіряти, натисніть «Підказка» біля пункту: вона каже, де шукати, але не диктує статус.", "Критичні пункти зі знаком «!» не можна закрити як «не застосовується».", "Стежте за поясненням під пунктом: воно живцем показує, чого ще бракує."], "note_min_chars": 10, "statuses": [{"value": "", "label": "Не перевірено"}, {"value": "confirmed", "label": "Підтверджено"}, {"value": "needs_data", "label": "Потрібні дані"}, {"value": "na", "label": "Не застосовується", "blocks_critical": true}], "items": [{"id": "balance_check", "group": "Гроші й залишок", "text": "Залишок на кінець періоду звірено з випискою, а не з пам’яті", "critical": true, "hint": "Порівняйте вхідний залишок, суму надходжень і списань та вихідний залишок. Якщо вони не сходяться, спершу шукайте пропущену операцію.", "why": "Незбіжність залишку — найдешевший сигнал про пропущену або задвоєну операцію; далі його вже нічим не спіймати."}, {"id": "balance_not_profit", "group": "Гроші й залишок", "text": "Залишок на рахунку не використано як оцінку прибутку", "critical": true, "hint": "Запитайте себе, які ще зобов’язання лежать на цьому залишку: податки, аванси клієнтів, неоплачені рахунки постачальників.", "why": "Рішення «зняти все, що є на рахунку» ухвалюють саме тоді, коли залишок сплутали з прибутком."}, {"id": "income_dated", "group": "Класифікація надходжень", "text": "Для кожного надходження, визнаного доходом, зафіксовано дату його отримання", "critical": true, "hint": "Дата тут — не дата підписання акта й не дата рахунку. Подивіться, яку дату показує саме виписка.", "why": "Період, у якому дохід врахований, визначає звітність; помилка в даті переносить суму в чужий період."}, {"id": "not_income_marked", "group": "Класифікація надходжень", "text": "Надходження, які доходом не є, виділено окремо із зазначенням причини", "critical": true, "hint": "Перевірте, чи в кожного такого надходження написана причина, а не просто позначка «не дохід».", "why": "Причина — це те, що ви покажете під час перевірки; позначка без причини не доводить нічого."}, {"id": "mistaken_payments", "group": "Класифікація надходжень", "text": "Помилкові зарахування виявлено, і по кожному видно, що з ним зроблено", "critical": true, "hint": "Шукайте пари операцій: надходження й зустрічне списання. Одиноке надходження без пари — привід поставити «потрібні дані».", "why": "Помилкове зарахування, яке залишилося на рахунку без рішення, з часом перестає відрізнятися від звичайної виручки."}, {"id": "advances", "group": "Класифікація надходжень", "text": "Аванси й передоплати позначено, а їх повернення відстежено", "critical": true, "hint": "Перегляньте призначення платежів зі словами «аванс», «передоплата», «завдаток» і перевірте, чи є за ними виконання або повернення.", "why": "Аванс — це одночасно гроші на рахунку й зобов’язання перед клієнтом; без позначки видно лише перше."}, {"id": "own_funds", "group": "Особисте й підприємницьке", "text": "Поповнення власними коштами відокремлено від виручки", "critical": true, "hint": "Перевірте надходження від самого підприємця: у виписці вони виглядають так само, як оплата клієнта, і різницю дає лише призначення платежу.", "why": "Власні кошти, пораховані як виручка, завищують дохід і призводять до сплати податку з власних грошей."}, {"id": "internal_transfers", "group": "Особисте й підприємницьке", "text": "Перекази між власними рахунками не пораховано двічі", "critical": true, "hint": "Якщо рахунків більше одного, порівняйте виписки між собою: одна й та сама сума має піти з одного рахунку й прийти на інший.", "why": "Переказ між власними рахунками не створює нових грошей, але в двох випадках підряд виглядає як два надходження."}, {"id": "personal_account", "group": "Особисте й підприємницьке", "text": "Перевірено, чи не приймалась оплата від клієнтів на особистий рахунок", "critical": true, "hint": "Питання не «чи є така оплата», а «чи ви це перевіряли». Неперевірене — це «потрібні дані», а не «підтверджено».", "why": "Оплата, що прийшла повз підприємницький рахунок, не потрапляє в облік автоматично й виявляється найпізніше."}, {"id": "receivables", "group": "Заборгованість", "text": "Складено перелік виконаних робіт без оплати", "critical": false, "hint": "Ці суми у виписці відсутні за визначенням — шукайте їх у підписаних актах і виставлених рахунках.", "why": "Робота без оплати не видно в русі коштів, тому про неї згадують лише тоді, коли термін уже минув."}, {"id": "payables", "group": "Заборгованість", "text": "Складено перелік власних невиконаних зобов’язань за отриманими коштами", "critical": false, "hint": "Перегляньте отримані аванси й неоплачені рахунки постачальників: це те, що ви ще винні грошима або роботою.", "why": "Без цього переліку залишок на рахунку виглядає вільним, хоча частина його вже комусь належить."}, {"id": "no_guess", "group": "Контроль якості", "text": "Незрозумілі надходження не класифіковано навмання", "critical": true, "hint": "Перегляньте свою роботу з Практики: чи немає там класифікації, поставленої «за логікою», без документа або запиту клієнту.", "why": "Одна вгадана класифікація знецінює весь реєстр: його більше не можна показати як перевірений."}, {"id": "handoff", "group": "Контроль якості", "text": "Питання поза межами класифікації передано бухгалтеру або юристу", "critical": false, "hint": "Згадайте, чи траплялися операції, щодо яких ви не маєте права вирішувати самостійно, і чи передали ви їх далі.", "why": "Вчасно передане питання — професійна межа, а не слабкість; невчасно передане стає чужою проблемою на перевірці."}]}, "glossary": [{"term": "Дохід", "definition": "Надходження, отримані від провадження підприємницької діяльності протягом звітного періоду.", "example": "Оплата клієнта за виконану консультацію є доходом на дату її надходження.", "avoid": "«усе, що прийшло на рахунок» — частина надходжень доходом не є"}, {"term": "Витрати", "definition": "Кошти, віддані за ресурси, потрібні для діяльності: оренду, матеріали, послуги, комісії.", "example": "Оренда робочого місця за місяць — витрата діяльності.", "avoid": "«будь-яке списання з рахунку» — переказ грошей собі витратою не є"}, {"term": "Прибуток", "definition": "Різниця між доходом і витратами за період; показує результат роботи, а не наявні гроші.", "example": "Прибуток може бути додатним у місяці, коли на рахунку майже порожньо.", "avoid": "«залишок на рахунку» — це два різні числа"}, {"term": "Залишок коштів", "definition": "Сума грошей на рахунку на конкретну дату.", "example": "Залишок 76 600 грн на 31.10 нічого не каже про результат жовтня.", "avoid": "«мій прибуток», «вільні гроші» — частина залишку може бути вже комусь винна"}, {"term": "Касовий метод", "definition": "Спосіб визнання доходу за датою фактичного надходження коштів.", "example": "Акт підписано в листопаді, кошти надійшли в жовтні — дохід виникає в жовтні.", "avoid": "«дохід за датою акта» або «за датою рахунку» — це інший підхід"}, {"term": "Аванс", "definition": "Кошти, отримані до виконання роботи або постачання товару.", "example": "Аванс збільшує гроші на рахунку і одночасно створює зобов’язання перед клієнтом.", "avoid": "«уже зароблене» — робота ще не виконана"}, {"term": "Дебіторська заборгованість", "definition": "Сума, яку винні вам: робота виконана або товар відвантажено, а оплати ще немає.", "example": "Підписаний акт без оплати — дебіторська заборгованість, а не дохід періоду.", "avoid": "«вважай, що гроші вже мої» — у виписці цієї суми немає"}, {"term": "Кредиторська заборгованість", "definition": "Сума, яку винні ви: отриманий аванс, неоплачений рахунок постачальника.", "example": "Отриманий аванс за листопадову роботу — ваша кредиторська заборгованість.", "avoid": "«це не мої гроші, тому забудь» — вона впливає на те, чим можна розпоряджатися"}, {"term": "Помилково зараховані кошти", "definition": "Кошти, зараховані отримувачу без достатньої правової підстави.", "example": "Платіж від невідомого контрагента з проханням повернути — не виручка.", "avoid": "«помилковий платіж» як універсальний термін — у законі помилкова платіжна операція означає вужче, помилку надавача платіжних послуг"}, {"term": "Власні кошти підприємця", "definition": "Гроші тієї самої фізичної особи, внесені нею на підприємницький рахунок.", "example": "Поповнення рахунку на 25 000 грн самою підприємицею не є оплатою від клієнта.", "avoid": "«інвестиція в бізнес», «виручка» — платник і отримувач тут одна особа"}]}}]}</script>
  <script>
    "use strict";
    const DATA=JSON.parse(document.getElementById("course-data").textContent);
    const COURSE=DATA.course,MODULES=DATA.modules;
    const STORAGE_KEY="fop-course:"+COURSE.id+":v4";
    const STATE_VERSION=4;
    const LEGACY_RE=new RegExp("^fop-course:"+COURSE.id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+":module-[^:]+:v\\d+$");
    const DEFAULT_WEIGHTS={lesson:20,practice:30,case:25,checklist:10,quiz:15};
    const OPTIONAL_PAGES=["glossary"];
    const PAGES=[
      {id:"overview",title:"Огляд",kind:"overview"},{id:"guide",title:"Як навчатися",kind:"guide"},{id:"lesson",title:"Урок",kind:"lesson"},{id:"practice",title:"Практика",kind:"practice"},
      {id:"case",title:"Кейс",kind:"case"},{id:"checklist",title:"Чекліст",kind:"checklist"},{id:"glossary",title:"Глосарій",kind:"glossary"},
      {id:"reference",title:"Пам’ятка",kind:"content"},{id:"sources",title:"Джерела",kind:"content"},{id:"quiz",title:"Підсумковий квіз",kind:"quiz"}
    ];
    function moduleById(id){return MODULES.find(m=>m.id===id)||MODULES[0]}
    function section(m,id){return m.sections.find(item=>item.id===id)}
    function weights(m){return Object.assign({},DEFAULT_WEIGHTS,m.meta.progress_weights||{})}
    function quizThreshold(m){return m.meta.quiz_threshold||80}
    function noteMin(m){return m.activities.checklist.note_min_chars||3}
    function reasonMin(m){return m.activities.case.reasoning_min_chars||60}
    function blockingStatuses(m){return new Set((m.activities.checklist.statuses||[]).filter(s=>s.blocks_critical).map(s=>s.value))}
    function startOrder(m){const ids=m.activities.case.actions.map(x=>x.id),initial=Array.isArray(m.activities.case.initial_order)?m.activities.case.initial_order.filter(id=>ids.includes(id)):[];return initial.length===ids.length?initial.slice():ids.slice().reverse()}
    function freshModuleState(m){return{lessonAnswers:{},practice:{answers:{},result:null,hints:{}},caseWork:{selected:{},categories:{},owners:{},order:startOrder(m),reasoning:"",result:null,hints:{}},checklist:{},glossary:{seen:{},repeat:{}},quiz:{answers:{},index:0,showResult:false,bestScore:0,hints:{}}}}
    function freshState(){return{version:STATE_VERSION,view:"course",module:MODULES[0].id,page:"overview",modules:{},review:{},mission:""}}
    function loadState(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY));if(parsed&&parsed.version===STATE_VERSION&&parsed.modules){if(!parsed.review)parsed.review={};return parsed}}catch(_){}return freshState()}
    function legacyKeys(){const out=[];try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&LEGACY_RE.test(key))out.push(key)}}catch(_){}return out}
    let state=loadState();
    function stateOf(id){const m=moduleById(id);if(!state.modules[id])state.modules[id]=freshModuleState(m);const s=state.modules[id];if(!s.caseWork||!Array.isArray(s.caseWork.order)||s.caseWork.order.length!==m.activities.case.actions.length)s.caseWork=freshModuleState(m).caseWork;return s}
    function peekState(id){return state.modules[id]||freshModuleState(moduleById(id))}
    let view=state.view==="module"?"module":"course";
    let mod=moduleById(state.module);
    let ms=stateOf(mod.id);
    let current=PAGES.some(p=>p.id===state.page)?state.page:"overview";
    let dragIndex=null;
    function persist(){state.view=view;state.module=mod.id;state.page=current;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(_){}renderNav();renderProgress()}
    const REVIEW=Object.assign({intervals_days:[1,3,7,21],title:"Повторення"},COURSE.review||{});
    function todayISO(){const now=new Date();return new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString().slice(0,10)}
    function addDays(iso,days){const date=new Date(iso+"T00:00:00");date.setDate(date.getDate()+days);return date.toISOString().slice(0,10)}
    function reviewStore(){return state.review||(state.review={})}
    function reviewKey(moduleId,kind,id){return moduleId+"::"+kind+"::"+id}
    function reviewAdd(moduleId,kind,id){const key=reviewKey(moduleId,kind,id),store=reviewStore();if(!store[key])store[key]={module:moduleId,kind,id:String(id),step:0,due:todayISO()}}
    function reviewDrop(moduleId,kind,id){delete reviewStore()[reviewKey(moduleId,kind,id)]}
    function reviewAll(){return Object.entries(reviewStore()).map(([key,item])=>Object.assign({key},item)).filter(item=>reviewContent(item))}
    function reviewDue(){const now=todayISO();return reviewAll().filter(item=>String(item.due)<=now)}
    function reviewPass(key){const item=reviewStore()[key];if(!item)return;const next=(item.step||0)+1;if(next>=REVIEW.intervals_days.length){delete reviewStore()[key];return}item.step=next;item.due=addDays(todayISO(),REVIEW.intervals_days[next])}
    function reviewFail(key){const item=reviewStore()[key];if(!item)return;item.step=0;item.due=addDays(todayISO(),REVIEW.intervals_days[0])}
    function reviewContent(item){const m=MODULES.find(x=>x.id===item.module);if(!m)return null;
      if(item.kind==="lesson"){const q=m.activities.lesson.find(x=>x.id===item.id);return q?{type:"question",module:m,question:q,label:"Мікроперевірка"}:null}
      if(item.kind==="quiz"){const q=m.quiz[Number(item.id)];return q?{type:"question",module:m,question:q,label:"Питання квізу"}:null}
      if(item.kind==="glossary"){const g=m.activities.glossary[Number(item.id)];return g?{type:"term",module:m,term:g,label:"Термін"}:null}
      if(item.kind==="practice"){const f=m.activities.practice.fields.find(x=>x.id===item.id);return f?{type:"field",module:m,field:f,label:"Реквізит картки"}:null}
      return null}
    function missionById(id){return (COURSE.missions||[]).find(x=>x.id===id)||null}
    function openReview(){view="review";state.reviewAnswer=null;persist();render();scrollTop()}
    function sessionOf(pageId){const sessions=mod.meta.sessions||[];const found=sessions.find(s=>(s.pages||[]).includes(pageId));return found?found.title:null}
    function escapeHtml(value){return String(value??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
    function inline(text){let v=escapeHtml(text);v=v.replace(/`([^`]+)`/g,"<code>$1</code>");v=v.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");v=v.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');v=v.replace(/\[(SRC-\d{3})\]/g,'<button type="button" class="src-ref" data-src="$1" title="Перейти до джерела $1">$1</button>');return v}
    function isTableSeparator(line){return /^\s*\|?\s*:?-{3,}/.test(line)&&line.includes("|")}
    function cells(line){return line.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()))}
    function renderMarkdown(markdown){const lines=markdown.replace(/\r/g,"").split("\n");const out=[];let i=0;const calloutMeta={REMEMBER:["remember","◆","Запам’ятайте"],PRINCIPLE:["principle","✓","Правильний принцип"],RISK:["risk","!","Ризик"],INFO:["info","i","Пояснення"]};while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue}
      const callout=line.match(/^>\s*\[!(REMEMBER|PRINCIPLE|RISK|INFO)\]\s*$/);if(callout){const body=[];i++;while(i<lines.length&&/^>/.test(lines[i])){body.push(lines[i].replace(/^>\s?/,""));i++}const [cls,icon,label]=calloutMeta[callout[1]];out.push(`<aside class="callout ${cls}"><div class="callout-title"><span aria-hidden="true">${icon}</span>${label}</div><div class="callout-body">${inline(body.join(" "))}</div></aside>`);continue}

      const missed=aspects.filter(a=>!a.covered);if(reasoning.length>=reasonMin(mod)&&missed.length)feedback.push("Пояснення можна доповнити: "+missed.map(a=>a.label.toLocaleLowerCase("uk-UA")).join(", ")+". На бал це не впливає.");
      const percent=Math.round(earned/total*100);if(!feedback.length)feedback.push("Рішення повне: критичні ризики, відповідальні та порядок дій визначено правильно.");
      ms.caseWork.result={percent,feedback,risks,order,aspects};persist();render()}
    function renderChecklist(main){const data=mod.activities.checklist,card=document.createElement("section");card.className="card";const resolved=data.items.filter(item=>checklistItemValid(mod,ms,item)).length;card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Крок 4 · Робочий контроль</p><h2>${escapeHtml(data.title)}</h2></div>${statusChip(checklistDone(mod,ms),"Усі пункти опрацьовано",`${resolved} із ${data.items.length}`)}</div><p class="section-intro">${escapeHtml(data.instructions)}</p>${instructionPanel("Як виконувати Чекліст",data.how_to,"Чекліст перевіряє повноту контролю, а не кількість механічно встановлених галочок. Правильного статусу «за замовчуванням» немає: він залежить від того, що ви справді підтвердили.")}`;const groups=[...new Set(data.items.map(x=>x.group))];groups.forEach(group=>{const sec=document.createElement("section");sec.className="checklist-group";sec.innerHTML=`<h3>${escapeHtml(group)}</h3>`;data.items.filter(x=>x.group===group).forEach(item=>sec.appendChild(renderChecklistItem(item,data)));card.appendChild(sec)});const unresolved=data.items.filter(x=>!checklistItemValid(mod,ms,x));const panel=document.createElement("div");panel.className="result-panel "+(unresolved.length?"fail":"pass");panel.setAttribute("role","status");panel.innerHTML=unresolved.length?`<div class="result-score">${resolved} із ${data.items.length} пунктів опрацьовано</div><div class="meter"><span style="width:${Math.round(resolved/data.items.length*100)}%"></span></div><p>Залишилося: ${unresolved.map(x=>escapeHtml(x.text)).join("; ")}.</p><p class="footer-note">Під кожним незавершеним пунктом написано, чого саме бракує. Кнопка «Підказка» пояснює, що і де перевіряти.</p>`:"<strong>Чекліст завершено.</strong><p>Усі пункти мають обґрунтований статус. Перечитайте пояснення «навіщо це в чеклісті» — саме вони переносяться на реальну роботу.</p>";card.appendChild(panel);main.appendChild(card);addPageActions(main)}
    function renderChecklistItem(item,data){const entry=ms.checklist[item.id]||{status:"",note:""},issue=checklistIssue(mod,ms,item),valid=!issue,row=document.createElement("div");row.className="checklist-item"+(valid?" is-valid":entry.status?" has-error":"");row.innerHTML=`<div>${item.critical?'<span class="critical-mark" title="Критичний пункт">! </span>':""}${escapeHtml(item.text)}</div><select class="select-input" aria-label="Статус: ${escapeHtml(item.text)}">${data.statuses.map(s=>`<option value="${escapeHtml(s.value)}" ${entry.status===s.value?"selected":""}>${escapeHtml(s.label)}</option>`).join("")}</select><input class="text-input" value="${escapeHtml(entry.note)}" placeholder="Джерело або наступна дія" aria-label="Обґрунтування: ${escapeHtml(item.text)}">`;const [select,input]=[row.querySelector("select"),row.querySelector("input")];select.addEventListener("change",e=>{const a=ms.checklist[item.id]||(ms.checklist[item.id]={status:"",note:""});a.status=e.target.value;persist();render()});input.addEventListener("input",e=>{const a=ms.checklist[item.id]||(ms.checklist[item.id]={status:"",note:""});a.note=e.target.value;persist()});input.addEventListener("blur",()=>render());
      const tools=document.createElement("div");tools.className="hint-bar item-tools";
      if(item.hint&&!checklistHintLevel(item.id))tools.appendChild(button("Підказка","tonal-button",()=>raiseChecklistHint(item.id)));
