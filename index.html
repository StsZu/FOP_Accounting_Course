<html lang="uk">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Бухгалтер ФОП</title>
  <style>
    :root {

    }

    @media(max-width:900px){.layout{grid-template-columns:1fr;padding:16px 12px 52px;gap:14px}.sidebar{position:static;overflow-x:auto;padding-bottom:4px}.module-label{display:none}.nav-list{display:flex;width:max-content}.nav-button{width:170px;border:1px solid var(--outline-soft);background:var(--surface)}.route{grid-template-columns:1fr 1fr}.topbar-inner{padding-inline:14px}.hero,.card{border-radius:20px}}

    .order-item{cursor:grab}.order-item.dragging{opacity:.55;cursor:grabbing}.order-item.drop-target{outline:3px dashed var(--primary);outline-offset:3px}.order-item.is-correct{border-color:var(--success);background:var(--success-bg)}.order-item.is-wrong{border-color:var(--warning);background:var(--warning-bg)}.order-verdict{display:block;margin-top:3px;font-size:.82rem;font-weight:800}.order-text{display:block;min-width:0}

    .review-list{display:grid;gap:8px;margin:6px 0 16px}.activity-card.is-neutral{border-color:var(--info)}

  </style>
</head>
<body>
  <a class="skip" href="#main">Перейти до матеріалу</a>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row"><div class="brand-wrap"><div class="brand-mark" aria-hidden="true">Ф</div><div><div class="brand">Бухгалтер ФОП</div><div class="version" id="version"></div></div></div><span class="chip" id="module-state">Навчання</span></div>
      <div class="progress-row"><div class="progress-track" role="progressbar" aria-label="Прогрес модуля" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div><span class="progress-label" id="progress-label">0%</span></div>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Навігація курсу"><p class="module-label" id="nav-label">Навчальний маршрут</p><ol class="nav-list" id="nav-list"></ol></nav>

  <script id="course-data" type="application/json">{"course": {"schema": "course/v1", "id": "fop-accounting-course", "title": "Бухгалтер ФОП: від нуля до професійного рівня", "subtitle": "Практичний курс обліку та оподаткування ФОП для початківця", "version": "0.15.0", "updated": "2026-09-07", "planned_modules": 38, "final_assessment": {"title": "Підсумкова атестація", "status": "planned", "note": "Атестацію буде відкрито після публікації всіх рівнів. Вона перевірятиме наскрізний робочий цикл бухгалтера ФОП, а не пам’ять про окремі модулі."}, "level_quiz": {"title": "Рівнева перевірка", "threshold": 80, "min_questions": 12, "max_questions": 15, "note": "Рівнева перевірка складається з наскрізних питань: кожне спирається щонайменше на два модулі рівня. Вона не зараховує модулі й не замінює їх проходження — вона показує, чи склалися модулі в одну картину."}, "levels": [{"level": 1, "title": "Основи підприємництва і бухгалтерського мислення", "planned_modules": 3, "quiz": [{"id": "l01-q01", "title": "Що видно в ЄДР", "competency": "cross_registry_vs_tax_status", "scenario": "Клієнт надіслав виписку з ЄДР і каже: «Тут усе видно, я на третій групі».", "modules": ["module-01", "module-03"], "question": "Чи підтверджує ця виписка систему оподаткування?", "options": [{"text": "Так, бо обрана система оподаткування є одним із реєстраційних відомостей ЄДР", "feedback": "Ні. ЄДР містить реєстраційні дані підприємця, а податковий статус ведеться окремо."}, {"text": "Ні: податковий статус перевіряють у реєстрі платників єдиного податку", "correct": true, "feedback": "Правильно. Дані цього реєстру оприлюднюються щоденно для вільного доступу."}, {"text": "Так, якщо у виписці зазначено КВЕДи, дозволені для обраної групи платника", "feedback": "Ні. Перелік КВЕДів нічого не каже про те, чи зареєстровано особу платником єдиного податку."}], "explanation": "ЄДР показує реєстраційні відомості: ПІБ, дату запису, стан, адресу, види діяльності. Систему оподаткування там не видно — її перевіряють у реєстрі платників єдиного податку або витягом з нього. Це два різні джерела, і плутанина між ними — типова помилка приймання клієнта.", "source_reference": ["SRC-002", "SRC-036"], "hint": "Подумайте, який орган веде кожен із реєстрів і які саме відомості до кожного потрапляють."}, {"id": "l01-q02", "title": "Діяльність поза реєстром", "competency": "cross_kved_and_rate", "scenario": "ФОП другої групи почав надавати новий вид послуг, не внісши його до реєстру платників єдиного податку.", "modules": ["module-01", "module-03"], "question": "Який наслідок це має для доходу від нового виду діяльності?", "options": [{"text": "Дохід оподатковується за звичайною ставкою, бо КВЕД зазначено в ЄДР", "feedback": "Ні. Наявність КВЕДу в ЄДР не замінює внесення виду діяльності до реєстру платників єдиного податку."}, {"text": "Дохід не оподатковується, доки підприємець не внесе зміни до реєстру платників", "feedback": "Ні. Дохід оподатковується в будь-якому разі, питання лише в тому, за якою ставкою."}, {"text": "До нього застосовується підвищена ставка єдиного податку в розмірі 15%", "correct": true, "feedback": "Правильно. Для першої і другої груп це одна з пʼяти підстав підвищеної ставки."}], "explanation": "КВЕД у ЄДР і вид діяльності в реєстрі платників єдиного податку — різні записи. Дохід від діяльності, не зазначеної в реєстрі платників єдиного податку, для першої і другої груп оподатковується за ставкою 15% і є підставою для переходу на загальну систему.", "source_reference": ["SRC-008", "SRC-030", "SRC-029"], "hint": "Порівняйте, який саме запис перевіряє податкова: у якому реєстрі має бути вид діяльності."}, {"id": "l01-q03", "title": "Аванс у грудні", "competency": "cross_income_date_and_limit", "scenario": "26 грудня на рахунок ФОП надійшов аванс за роботу, яку буде виконано в лютому наступного року.", "modules": ["module-02", "module-03"], "question": "У річний обсяг доходу якого року входить ця сума?", "options": [{"text": "Поточного року, бо дохід виникає за датою надходження коштів", "correct": true, "feedback": "Правильно. Тому аванс наприкінці грудня може вивести обсяг за межі ліміту групи."}, {"text": "Наступного року, бо саме тоді буде виконано роботу й підписано акт", "feedback": "Ні. Дата акта визначає зміст операції, а не дату виникнення доходу єдинника."}, {"text": "Розподіляється між роками пропорційно до фактично виконаного обсягу", "feedback": "Ні. Жодного правила пропорційного розподілу доходу між роками норма не містить."}], "explanation": "Для платника єдиного податку датою отримання доходу є дата надходження коштів. Обсяг доходу за календарний рік порівнюють із лімітом групи, тому грудневий аванс за майбутню роботу впливає на ліміт поточного року, а не наступного.", "source_reference": ["SRC-010", "SRC-025"], "hint": "Спершу визначте дату доходу, а вже потім питайте, з обсягом якого періоду її порівнюють."}, {"id": "l01-q04", "title": "Взаємозалік", "competency": "cross_settlement_form", "scenario": "Клієнт пропонує ФОП третьої групи закрити частину боргу зустрічною послугою замість оплати.", "modules": ["module-02", "module-03"], "question": "Які два наслідки має така домовленість?", "options": [{"text": "Дохід не виникає взагалі, бо кошти на рахунок підприємця не надходили", "feedback": "Ні. Відсутність руху коштів не робить операцію невидимою: негрошовий розрахунок норма прямо називає."}, {"text": "Ставка 15% на суму й підстава для переходу на загальну систему", "correct": true, "feedback": "Правильно. Платник єдиного податку розраховується виключно в грошовій формі."}, {"text": "Дохід виникає за датою підписання акта взаємозаліку без інших наслідків", "feedback": "Ні. Дата тут не головне: сам негрошовий спосіб розрахунку є порушенням умови перебування."}], "explanation": "Платники єдиного податку повинні здійснювати розрахунки виключно в грошовій формі. Дохід, отриманий негрошовим способом, оподатковується за ставкою 15%, і це одночасно є підставою для обовʼязкового переходу на загальну систему з кварталу порушення.", "source_reference": ["SRC-025", "SRC-030", "SRC-029"], "hint": "Подумайте окремо про ставку до конкретної суми і окремо про право залишатися на спрощеній."}, {"id": "l01-q05", "title": "Поворотна допомога", "competency": "cross_non_income_and_limit", "scenario": "ФОП отримав поворотну фінансову допомогу й повернув її через сім місяців того самого року.", "modules": ["module-02", "module-03"], "question": "Як ця сума впливає на обсяг доходу для ліміту групи?", "options": [{"text": "Впливає: до доходу включають будь-яке надходження на рахунок підприємця", "feedback": "Ні. Кодекс прямо перелічує надходження, які до складу доходу єдинника не включаються."}, {"text": "Впливає наполовину, бо допомогу було повернуто в тому самому календарному році", "feedback": "Ні. Правила часткового врахування такої суми норма не встановлює."}, {"text": "Не впливає: повернута протягом 12 місяців допомога до доходу не включається", "correct": true, "feedback": "Правильно. Ключова умова — саме строк повернення, а не сам факт договору."}], "explanation": "Поворотна фінансова допомога, отримана й повернена протягом 12 календарних місяців з дня отримання, до складу доходу платника єдиного податку не включається. Оскільки в обсяг доходу для ліміту групи входить саме дохід, ця сума ліміт не наближає.", "source_reference": ["SRC-010", "SRC-014", "SRC-025"], "hint": "Спершу визначте, чи є ця сума доходом, і лише потім питайте про обсяг для ліміту."}, {"id": "l01-q06", "title": "Оплата на особисту картку", "competency": "cross_accounts_and_status", "scenario": "Клієнт переказав оплату за послуги на особисту картку підприємця, а не на підприємницький рахунок.", "modules": ["module-01", "module-02"], "question": "Що тут порушено, якщо ФОП і фізична особа — одна людина?", "options": [{"text": "Нічого: підприємець і фізична особа — одна особа, тому рахунок значення не має", "feedback": "Ні. Одна особа справді, але рахунки для різних цілей відкриваються окремо за нормою."}, {"text": "Заборона використовувати рахунок для власних потреб у підприємницькій діяльності", "correct": true, "feedback": "Правильно. Про цю заборону особа власноруч підписується в заяві про відкриття рахунку."}, {"text": "Обовʼязок окремо повідомляти податкову про кожну операцію на особистому рахунку", "feedback": "Ні. Такого обовʼязку немає: автоматично передається лише факт відкриття або закриття рахунку."}], "explanation": "ФОП і фізична особа — це одна особа, але фізична особа відкриває окремі рахунки: для підприємницької діяльності й для власних потреб. Використовувати рахунок для власних потреб в операціях підприємницької діяльності заборонено.", "source_reference": ["SRC-001", "SRC-021", "SRC-024"], "hint": "Питання не про те, чиї це гроші, а про те, для якої мети відкрито конкретний рахунок."}, {"id": "l01-q07", "title": "Після припинення", "competency": "cross_termination_duties", "scenario": "Підприємець вніс до ЄДР запис про припинення діяльності й вважає, що всі питання закриті.", "modules": ["module-01", "module-02"], "question": "Що лишається після цього запису?", "options": [{"text": "Нічого: запис у ЄДР припиняє і статус, і всі попередні зобовʼязання особи", "feedback": "Ні. Запис припиняє підприємницький статус на майбутнє, але зобовʼязання не анулює."}, {"text": "Лише обовʼязок закрити банківські рахунки, відкриті для підприємницької діяльності", "feedback": "Ні. Закриття рахунків є однією з дій, але далеко не єдиною з тих, що лишаються."}, {"text": "Обовʼязки подати звітність, сплатити податки й зберігати документи періоду", "correct": true, "feedback": "Правильно. Саме тому облік за минулі періоди має бути в порядку до припинення."}], "explanation": "Запис про припинення зупиняє підприємницький статус на майбутнє, але не стирає зобовʼязань, що виникли під час діяльності: звітність, податки, договори, зберігання документів. Відновити закритий запис не можна — потрібна нова державна реєстрація.", "source_reference": ["SRC-002", "SRC-003", "SRC-012"], "hint": "Розділіть дві речі: що припиняється на майбутнє і що лишається за вже минулі періоди."}, {"id": "l01-q08", "title": "Залишок і база податку", "competency": "cross_profit_vs_base", "scenario": "На рахунку ФОП третьої групи 40 000 грн, з них 25 000 грн — аванси за ще не виконані роботи.", "modules": ["module-02", "module-03"], "question": "Від якої величини рахують єдиний податок?", "options": [{"text": "Від доходу, тобто від надходжень періоду, без вирахування будь-яких витрат", "correct": true, "feedback": "Правильно. Аванси є доходом, хоча роботу за ними ще не виконано."}, {"text": "Від залишку коштів на рахунку станом на останній день звітного періоду підприємця", "feedback": "Ні. Залишок на рахунку взагалі не є величиною, від якої рахують податок."}, {"text": "Від прибутку, тобто від різниці між надходженнями періоду й витратами", "feedback": "Ні. Прибуток підприємець рахує для себе; базою на спрощеній системі є дохід."}], "explanation": "Залишок коштів, дохід, витрати й прибуток — чотири різні числа. На спрощеній системі базою є дохід, тобто надходження без вирахування витрат, і аванси до нього входять. Залишок на рахунку не є базою оподаткування ні на одній із систем.", "source_reference": ["SRC-010", "SRC-013", "SRC-025"], "hint": "Пригадайте чотири різні числа підприємця й перевірте, яке з них норма називає базою."}, {"id": "l01-q09", "title": "Переказ між своїми рахунками", "competency": "cross_internal_transfer", "scenario": "ФОП переказав 20 000 грн з одного власного підприємницького рахунку на інший власний.", "modules": ["module-02", "module-03"], "question": "Як ця операція впливає на обсяг доходу за рік?", "options": [{"text": "Збільшує обсяг доходу на 20 000 грн, бо кошти надійшли на рахунок підприємця", "feedback": "Ні. Формальне надходження на рахунок не означає, що виникла виручка від діяльності."}, {"text": "Не впливає: нових коштів не виникло, та сама сума лише змінила рахунок", "correct": true, "feedback": "Правильно. Ту саму суму видно двічі: як списання в одній виписці й як надходження в іншій."}, {"text": "Зменшує обсяг доходу, бо списання з першого рахунку є витратою підприємця", "feedback": "Ні. На спрощеній системі витрати на розмір доходу й податку взагалі не впливають."}], "explanation": "Внутрішній переказ між власними рахунками не створює нових коштів: та сама сума зʼявляється як списання в одній виписці й як надходження в іншій. Доходом вона не є, тому в обсяг доходу для ліміту групи не потрапляє.", "source_reference": ["SRC-010", "SRC-021", "SRC-025"], "hint": "Спитайте себе, чи виконано нову роботу й чи змінилася загальна сума коштів підприємця."}, {"id": "l01-q10", "title": "Ставка другої групи", "competency": "cross_address_and_rate", "scenario": "Підприємець другої групи знайшов у довіднику суму місячного платежу й планує сплачувати саме її.", "modules": ["module-01", "module-03"], "question": "Де насправді дізнатися ставку для його випадку?", "options": [{"text": "У Податковому кодексі, який встановлює точний розмір ставки для другої групи", "feedback": "Ні. Кодекс встановлює лише стелю — не більше 20% мінімальної заробітної плати."}, {"text": "У виписці з ЄДР, де ставка зазначається разом із видами діяльності особи", "feedback": "Ні. ЄДР не містить ані системи оподаткування, ані ставки єдиного податку."}, {"text": "У рішенні місцевої ради за місцем податкової адреси підприємця", "correct": true, "feedback": "Правильно. Рада встановлює ставку залежно від виду господарської діяльності."}], "explanation": "Ставку першої та другої груп встановлює сільська, селищна або міська рада залежно від виду діяльності; Кодекс дає лише стелю. Тому знати податкову адресу підприємця недостатньо для обліку — вона ще й визначає, чиє рішення про ставку шукати.", "source_reference": ["SRC-006", "SRC-030"], "hint": "Зверніть увагу на слова «не більше» в нормі: вони показують, хто визначає конкретну величину."}, {"id": "l01-q11", "title": "Мільйон і ліміт групи", "competency": "cross_vat_threshold_vs_limit", "scenario": "ФОП третьої групи звірив обсяг доходу з лімітом групи й вважає, що ПДВ його не стосується.", "modules": ["module-02", "module-03"], "question": "Чим поріг реєстрації платником ПДВ відрізняється від ліміту групи?", "options": [{"text": "Нічим: обидві величини рахують від доходу єдиного податку за календарний рік", "feedback": "Ні. Це різні величини й різні періоди, і саме тому їх не можна звіряти однією цифрою."}, {"text": "Поріг рахують за операціями постачання за останні 12 календарних місяців", "correct": true, "feedback": "Правильно. Це ковзне вікно: 1 січня лічильник не обнуляється."}, {"text": "Поріг стосується лише підприємців на загальній системі оподаткування", "feedback": "Ні. Норма про поріг загальна, а для єдинників 1–3 груп зроблено окреме виключення."}], "explanation": "Ліміт групи рахують від доходу за календарний рік, а поріг обовʼязкової реєстрації платником ПДВ — від обсягу операцій з постачання за останні 12 календарних місяців. Платники єдиного податку першої–третьої груп прямо виведені з-під обовʼязкової реєстрації, але при переході на загальну систему обовʼязок оживає.", "source_reference": ["SRC-010", "SRC-035"], "hint": "Порівняйте дві речі: що саме рахують і за який період це роблять."}, {"id": "l01-q12", "title": "Оренда великого приміщення", "competency": "cross_property_and_eligibility", "scenario": "Підприємець здає в оренду нежитлове приміщення загальною площею 1200 м² в іншому місті.", "modules": ["module-01", "module-03"], "question": "Які два наслідки це має для нього?", "options": [{"text": "Виникає неосновне місце обліку, а право на спрощену систему втрачається", "correct": true, "feedback": "Правильно. Обмеження площі рахують за загальною площею, а не за одним обʼєктом."}, {"text": "Виникає неосновне місце обліку, але на вибір системи оподаткування це не впливає", "feedback": "Ні. Обмеження за площею нежитлових приміщень є в переліку заборон для спрощеної системи."}, {"text": "Нічого не змінюється, доки приміщення не почне приносити орендний дохід", "feedback": "Ні. Обидва наслідки повʼязані з самим фактом наявності обʼєкта, а не з надходженнями."}], "explanation": "Обʼєкт нерухомості на іншій території створює неосновне місце обліку. Одночасно надання в оренду нежитлових приміщень загальною площею понад 900 квадратних метрів входить до переліку обмежень, які не дають права перебувати на спрощеній системі.", "source_reference": ["SRC-007", "SRC-025"], "hint": "Розгляньте наслідки окремо: спершу для обліку в податковій, потім для права на спрощену систему."}]}, {"level": 2, "title": "Первинні документи", "planned_modules": 4, "quiz": [{"id": "l02-q01", "title": "Бланк і реквізити", "competency": "cross_form_and_requisites", "scenario": "Замовник просить акт «за типовою формою», а виконавець складає його у власному бланку.", "modules": ["module-04", "module-05"], "question": "Що робить такий власний бланк придатним?", "options": [{"text": "Погодження бланка із замовником у додатку до укладеного договору", "feedback": "Ні. Погодження вигляду документа сторонами не замінює вимог норми до його змісту."}, {"text": "Наявність шести обовʼязкових реквізитів первинного документа", "correct": true, "feedback": "Правильно. Затвердженої форми акта немає, а реквізити обовʼязкові однаково."}, {"text": "Відбиток печатки виконавця й наскрізна нумерація документів за рік", "feedback": "Ні. І печатка, і номер документа належать до додаткових реквізитів."}], "explanation": "Для акта наданих послуг затвердженої форми немає: документування може здійснюватися з використанням самостійно виготовлених бланків, які повинні містити обовʼязкові реквізити або реквізити типових форм. Тому питання не в бланку, а в шести реквізитах.", "source_reference": ["SRC-039", "SRC-040"], "hint": "Розділіть два питання: як документ виглядає і що в ньому обовʼязково має бути."}, {"id": "l02-q02", "title": "Скан в архіві", "competency": "cross_original_and_storage", "scenario": "В архіві за операцією лежить лише фотографія підписаного паперового акта з месенджера.", "modules": ["module-04", "module-07"], "question": "Як оцінити стан цієї позиції архіву?", "options": [{"text": "Позиція закрита: фотографія є електронним примірником документа", "feedback": "Ні. Оригіналом електронного документа є примірник із реквізитами й накладеним підписом."}, {"text": "Позиція закрита, якщо фотографія читабельна й на ній видно підпис", "feedback": "Ні. Якість зображення не перетворює фото паперу на електронний документ."}, {"text": "Оригінал лишається на папері, і саме його треба зберігати", "correct": true, "feedback": "Правильно. Фото корисне як робоча інформація, але оригінал зберігають окремо."}], "explanation": "Фотографія або скан підписаного паперу не є оригіналом електронного документа. Оригіналом лишається сам папір, і саме він має зберігатися протягом установленого строку у формі, що дає змогу предʼявити його на вимогу.", "source_reference": ["SRC-041", "SRC-012"], "hint": "Спершу визначте, що тут є оригіналом, і лише потім питайте, що потрапляє в архів."}, {"id": "l02-q03", "title": "Чотири дати", "competency": "cross_dates", "scenario": "Акт складено 30 грудня, кошти надійшли 12 січня, декларацію подано 15 лютого.", "modules": ["module-04", "module-07"], "question": "Від якої дати рахується строк зберігання цього акта?", "options": [{"text": "Від 30 грудня — дати складання документа, зазначеної в самому акті", "feedback": "Ні. Дата складання є обовʼязковим реквізитом, але відлік строку зберігання не від неї."}, {"text": "Від 15 лютого — дня подання декларації, для якої використано документ", "correct": true, "feedback": "Правильно. При неподанні звітності відлік ішов би від граничного строку подання."}, {"text": "Від 12 січня — дати надходження коштів, тобто дати визнання доходу", "feedback": "Ні. Дата доходу визначає період оподаткування, а не початок строку зберігання."}], "explanation": "У курсі зустрічаються чотири різні дати: складання документа, господарської операції, визнання доходу й початку відліку строку зберігання. Остання рахується з дня подання звітності, для складення якої використано документ.", "source_reference": ["SRC-039", "SRC-010", "SRC-012"], "hint": "Перелічіть усі дати ситуації й пригадайте, до якої події норма привʼязує саме зберігання."}, {"id": "l02-q04", "title": "Описка й комплект", "competency": "cross_minor_defect_and_set", "scenario": "В акті описка в назві вулиці замовника; договір, акт і виписка за операцією є.", "modules": ["module-04", "module-05"], "question": "Що робити з цією операцією при закритті періоду?", "options": [{"text": "Нічого: комплект повний, а описка є неістотним недоліком", "correct": true, "feedback": "Правильно. Сторону можна ідентифікувати, дата й зміст операції на місці."}, {"text": "Запросити виправлений акт і до його отримання операцію не відображати", "feedback": "Ні. Норма прямо каже, що неістотні недоліки не є підставою для невизнання операції."}, {"text": "Додати до комплекту рахунок, щоб компенсувати дефект оформлення акта", "feedback": "Ні. Рахунок закриває інше питання й дефекти акта нічим не компенсує."}], "explanation": "Неістотні недоліки не є підставою для невизнання господарської операції, якщо можна ідентифікувати особу й документ містить дату, назву сторони, зміст та обсяг операції. Комплект із трьох питань тут теж повний.", "source_reference": ["SRC-039", "SRC-055"], "hint": "Перевірте окремо дві речі: чи повний комплект і чи руйнує документ саме цей дефект."}, {"id": "l02-q05", "title": "Оплачений рахунок", "competency": "cross_invoice_and_contract", "scenario": "Окремого договору немає: виконавець виставив рахунок з умовами, замовник його оплатив.", "modules": ["module-05", "module-06"], "question": "Що дає ця пара документів?", "options": [{"text": "Підтверджує і домовленість, і те, що послугу було фактично надано", "feedback": "Ні. Ані рахунок, ані оплата не фіксують факту надання послуги."}, {"text": "Договір укладено, але підтвердження виконання операції ще бракує", "correct": true, "feedback": "Правильно. Дія за умовами пропозиції є акцептом, а подію закриває акт."}, {"text": "Договір не укладено: для цього потрібен окремий підписаний документ", "feedback": "Ні. Дія відповідно до умов пропозиції є прийняттям цієї пропозиції."}], "explanation": "Якщо особа в межах строку для відповіді вчинила дію за умовами пропозиції — зокрема сплатила суму, — ця дія є акцептом. Тому оплачений рахунок працює як укладений договір. Але рахунком не фіксується господарська операція, тому питання «що сталося» закриває акт.", "source_reference": ["SRC-058", "SRC-055"], "hint": "Розділіть питання про укладення договору й питання про підтвердження виконання."}, {"id": "l02-q06", "title": "Платіж без опису", "competency": "cross_payment_purpose_and_archive", "scenario": "Через рік в архіві є акти, але в трьох платежах призначення платежу — «оплата за послуги».", "modules": ["module-05", "module-07"], "question": "Яку проблему це створює під час перевірки?", "options": [{"text": "Платіж вважається таким, що не відбувся, доки не буде уточнено призначення", "feedback": "Ні. Факт платежу підтверджує виписка; проблема не в самому русі коштів."}, {"text": "Документи є, але звʼязати конкретний платіж із конкретним актом неможливо", "correct": true, "feedback": "Правильно. Призначення платежу — єдина нитка від виписки до документа."}, {"text": "Виписка визнається недійсною, оскільки містить незаповнений реквізит", "feedback": "Ні. Реквізит заповнений, хоча й не виконує своєї функції; виписка чинна."}], "explanation": "Призначення платежу є обовʼязковим реквізитом платіжної інструкції, і його функція — повʼязати рух коштів із конкретним документом і періодом. Формулювання без номера документа й періоду рве ланцюжок «банк → операція → документ».", "source_reference": ["SRC-051", "SRC-044"], "hint": "Подумайте не про сам платіж, а про те, як ви показуватимете звʼязок між ним і документом."}, {"id": "l02-q07", "title": "Реквізити з різних законів", "competency": "cross_requisites_sources", "scenario": "Бухгалтер перевіряє ТТН за тим самим переліком, що й акт наданих послуг.", "modules": ["module-04", "module-05"], "question": "Чому такий підхід дає помилку?", "options": [{"text": "Реквізити ТТН встановлює інший закон, і перелік у ньому свій", "correct": true, "feedback": "Правильно. У ТТН, зокрема, місце складання є обовʼязковим реквізитом."}, {"text": "ТТН узагалі не є первинним документом, тому реквізити до неї не застосовуються", "feedback": "Ні. ТТН є документом для всіх учасників транспортного процесу з власними реквізитами."}, {"text": "Перелік реквізитів для ТТН установлює перевізник у своїх внутрішніх правилах", "feedback": "Ні. Перелік визначено законом, а не правилами конкретного перевізника."}], "explanation": "Обовʼязкові реквізити ТТН встановлює стаття 48 Закону про автомобільний транспорт: дата і місце складання, сторони, транспортний засіб, пункти завантаження й розвантаження. Перелік статті 9 Закону про бухоблік до неї не застосовується — місця складання там немає з 2020 року.", "source_reference": ["SRC-049", "SRC-039"], "hint": "Перевірте спершу, який закон встановлює реквізити для кожного з двох документів."}, {"id": "l02-q08", "title": "Борг без умови", "competency": "cross_overdue_and_documents", "scenario": "Замовник прострочив оплату на два місяці; про відповідальність у договорі не сказано нічого.", "modules": ["module-05", "module-06"], "question": "Що потрібно, щоб заявити вимогу?", "options": [{"text": "Спершу укласти додаткову угоду про відповідальність за прострочення", "feedback": "Ні. Норма про грошове зобовʼязання діє й без згадки в тексті договору."}, {"text": "Документи, що підтверджують борг, і розрахунок інфляційних та процентів", "correct": true, "feedback": "Правильно. Норма діє на вимогу кредитора: суму треба порахувати й заявити."}, {"text": "Рішення суду про стягнення, після якого нарахування здійснить виконавець", "feedback": "Ні. Право виникає з норми, а суд потрібен лише за відмови платити добровільно."}], "explanation": "Боржник, який прострочив грошове зобовʼязання, на вимогу кредитора сплачує суму боргу з урахуванням індексу інфляції та три проценти річних, якщо інший розмір не встановлено договором. Але сам борг має бути підтверджений документами про операцію — актом або накладною, а не самою випискою.", "source_reference": ["SRC-059", "SRC-055"], "hint": "Норма дає право, але вимогу треба чимось обґрунтувати — подумайте, чим саме."}, {"id": "l02-q09", "title": "Зміна умов у листуванні", "competency": "cross_amendment_form", "scenario": "Сторони письмового договору домовилися в месенджері про новий обсяг робіт і нову ціну.", "modules": ["module-04", "module-06"], "question": "Що потрібно зробити, щоб зміна набрала сили?", "options": [{"text": "Оформити додаткову угоду в тій самій формі, що й основний договір", "correct": true, "feedback": "Правильно. Форма зміни договору повторює форму договору, що змінюється."}, {"text": "Нічого: листування прирівнюється до письмової форми, тому зміна вже діє", "feedback": "Ні. Листування може бути письмовою формою, але зміна вчиняється у формі договору."}, {"text": "Скласти акт за новим обсягом: підписаний акт підтвердить згоду обох сторін", "feedback": "Ні. Акт фіксує виконання операції, а не зміну умов укладеного договору."}], "explanation": "Зміна або розірвання договору вчиняється в такій самій формі, що й договір, який змінюється, якщо інше не встановлено договором або законом. Письмова форма при цьому включає й електронну — питання саме у формі, а не в носії.", "source_reference": ["SRC-054", "SRC-046"], "hint": "Порівняйте форму, у якій укладено договір, із формою, у якій сторони домовилися цього разу."}, {"id": "l02-q10", "title": "Диск і повідомлення", "competency": "cross_loss_and_backup", "scenario": "Єдиний диск з архівом вийшов з ладу в понеділок; резервної копії немає, дані відновлюють.", "modules": ["module-04", "module-07"], "question": "Що треба зробити першим?", "options": [{"text": "Дочекатися результату відновлення даних і діяти залежно від нього", "feedback": "Ні. Поки триває очікування, спливає строк, який рахується від дня події."}, {"text": "Зібрати копії документів у контрагентів і відновити архів самостійно", "feedback": "Ні. Це частина відновлення, але воно починається після повідомлення органу."}, {"text": "Письмово повідомити контролюючий орган у пʼятиденний строк від події", "correct": true, "feedback": "Правильно. Повідомлення відкриває 90 календарних днів на відновлення."}], "explanation": "У разі втрати, пошкодження або дострокового знищення документів платник зобовʼязаний у пʼятиденний строк письмово повідомити контролюючий орган і відновити документи протягом 90 календарних днів. Наявність резервної копії перетворила б цю подію на тимчасову недоступність.", "source_reference": ["SRC-044", "SRC-041"], "hint": "Зверніть увагу, від якої дати починається відлік і яку дію ця дата робить терміновою."}, {"id": "l02-q11", "title": "Кому адресовані норми", "competency": "cross_norm_addressee", "scenario": "Бухгалтер шукає в актах для юридичних осіб і реквізити документів, і строки зберігання для ФОП.", "modules": ["module-04", "module-07"], "question": "Як правильно описати цю ситуацію?", "options": [{"text": "Обидва акти поширюються на ФОП, оскільки він є субʼєктом господарювання", "feedback": "Ні. Обидва акти прямо називають коло адресатів, і підприємця серед них немає."}, {"text": "Обовʼязки ФОП дає Податковий кодекс, а перелік реквізитів беруть з іншого акта", "correct": true, "feedback": "Правильно. Строки зберігання при цьому беруть саме з Кодексу, а не з Переліку."}, {"text": "Жодна з цих вимог до ФОП не застосовується, бо він не веде бухгалтерського обліку", "feedback": "Ні. Обовʼязок вести облік за документами й зберігати їх дає Податковий кодекс."}], "explanation": "Закон про бухгалтерський облік і Перелік типових документів Мінʼюсту адресовані юридичним особам. Обовʼязок ФОП вести облік на підставі первинних документів і зберігати їх встановлює Податковий кодекс; перелік реквізитів беруть із бухгалтерського закону як фактичний стандарт, а строки зберігання — лише з Кодексу.", "source_reference": ["SRC-017", "SRC-012", "SRC-069"], "hint": "Розділіть два різні питання: звідки береться обовʼязок і звідки береться опис документа."}, {"id": "l02-q12", "title": "Хто підписав", "competency": "cross_authority", "scenario": "Товар зі складу забрав водій покупця з довіреністю, у якій не проставлено дату вчинення.", "modules": ["module-05", "module-06"], "question": "Як діяти перед передачею товару?", "options": [{"text": "Передати товар: наявність довіреності вже підтверджує повноваження водія", "feedback": "Ні. Довіреність без дати вчинення є нікчемною, тому повноважень вона не підтверджує."}, {"text": "Передати товар за умови, що водій пред'явить документ, який посвідчує особу", "feedback": "Ні. Документ про особу підтверджує, хто це, але не його повноваження діяти."}, {"text": "Не передавати, доки повноваження не підтверджено належним документом", "correct": true, "feedback": "Правильно. Це може бути письмовий договір, довіреність із датою або акт органу."}], "explanation": "Довіреність, у якій не вказана дата її вчинення, є нікчемною. Повноваження особи, яка одержує товарно-матеріальні цінності, підтверджуються, зокрема, письмовим договором, довіреністю або актом органу юридичної особи.", "source_reference": ["SRC-054", "SRC-040"], "hint": "Спершу перевірте чинність самого документа про повноваження, а вже потім — особу пред'явника."}]}, {"level": 3, "title": "Банк, каса і розрахунки", "planned_modules": 3, "quiz": [{"id": "l03-q01", "title": "Картка й документ", "competency": "cross_card_two_duties", "scenario": "Клієнт оплачує послугу карткою через термінал у майстерні підприємця другої групи.", "modules": ["module-08", "module-10"], "question": "Які два питання виникають одночасно?", "options": [{"text": "Дата зарахування коштів і потреба в розрахунковому документі", "correct": true, "feedback": "Правильно. Еквайринг дає розрив у часі, а операція лишається розрахунковою."}, {"text": "Розмір комісії еквайра та потреба відкрити окремий рахунок для карток", "feedback": "Ні. Окремого рахунку саме для карткових надходжень норма не вимагає."}, {"text": "Гранична сума розрахунку та обовʼязок вести касову книгу за такі операції", "feedback": "Ні. Готівкові ліміти сюди не застосовуються, а касову книгу ФОП не веде."}], "explanation": "Оплата карткою є розрахунковою операцією, тому виникає питання розрахункового документа. Одночасно між оплатою й зарахуванням минає час, а еквайр утримує відсоток — тому виникає питання дати визнання доходу, яке модуль 8 лишає бухгалтеру.", "source_reference": ["SRC-072", "SRC-075", "SRC-010"], "hint": "Одне питання стосується документа в момент операції, друге — обліку надходження."}, {"id": "l03-q02", "title": "Особиста картка", "competency": "cross_personal_card", "scenario": "Клієнт переказує оплату за послугу на особисту картку підприємця другої групи.", "modules": ["module-08", "module-10"], "question": "Скільки вимог порушено?", "options": [{"text": "Одна: використання рахунку для власних потреб у підприємницькій діяльності", "feedback": "Ні. Приймання оплати за послугу створює ще й обовʼязок за розрахунковою операцією."}, {"text": "Дві: режим використання рахунку й обовʼязок видати розрахунковий документ", "correct": true, "feedback": "Правильно. Відображення суми в доході жодну з цих вимог не закриває."}, {"text": "Жодної, якщо суму буде відображено у складі доходу відповідного періоду", "feedback": "Ні. Облік доходу не усуває ані порушення режиму, ані відсутності документа."}], "explanation": "Використовувати рахунок для власних потреб у підприємницькій діяльності заборонено — це перша вимога. Приймання оплати за послугу є розрахунковою операцією, за якою має бути виданий розрахунковий документ, — це друга.", "source_reference": ["SRC-021", "SRC-075"], "hint": "Порахуйте вимоги окремо: одна стосується рахунку, друга — самої операції."}, {"id": "l03-q03", "title": "Транзит і реєстратор", "competency": "cross_agency_and_rro", "scenario": "Агент отримує від замовника кошти для підрядника переказом на свій підприємницький рахунок.", "modules": ["module-09", "module-10"], "question": "Як оцінити цю операцію з двох боків?", "options": [{"text": "Доходом є лише винагорода, але за всією сумою потрібен фіскальний чек", "feedback": "Ні. Переказ з рахунку на рахунок за платіжною інструкцією реєстратора не потребує."}, {"text": "Доходом є вся сума, і за нею потрібно провести розрахункову операцію", "feedback": "Ні. За агентським договором доходом є винагорода, а переказ — не розрахунок у цьому сенсі."}, {"text": "Доходом є лише винагорода, а переказ розрахунковою операцією не є", "correct": true, "feedback": "Правильно. Платник сам ініціює переказ, не пред'являючи платіжного інструмента."}], "explanation": "За агентським договором доходом є сума винагороди. Водночас переказ, який платник самостійно ініціює у своєму банку платіжною інструкцією, не є розрахунковою операцією в розумінні Закону про РРО — на відміну від оплати платіжним інструментом.", "source_reference": ["SRC-077", "SRC-075"], "hint": "Розділіть два питання: що є доходом і що є розрахунковою операцією."}, {"id": "l03-q04", "title": "Готівка від підприємця", "competency": "cross_cash_limit_and_income", "scenario": "Інший ФОП розрахувався готівкою на 14 000 грн за партію товару.", "modules": ["module-09", "module-10"], "question": "Що тут потрібно зробити?", "options": [{"text": "Визнати дохід і нічого не змінювати: сума в межах ліміту для підприємців", "feedback": "Ні. Ліміт між субʼєктами господарювання становить 10 000 грн, а не більше."}, {"text": "Визнати дохід за датою надходження й провести надлишок через рахунок", "correct": true, "feedback": "Правильно. Дохід виникає в будь-якому разі, але спосіб розрахунку треба виправити."}, {"text": "Не визнавати дохід до моменту, поки розрахунок не буде приведено у відповідність", "feedback": "Ні. Порушення способу розрахунку не скасовує факту отримання доходу."}], "explanation": "Гранична сума готівкових розрахунків між субʼєктами господарювання — 10 000 грн включно, тому надлишок мав бути проведений через надавача платіжних послуг. При цьому дохід визнається за датою фактичного надходження коштів незалежно від порушення ліміту.", "source_reference": ["SRC-074", "SRC-010"], "hint": "Тут дві незалежні речі: факт доходу й дозволений спосіб розрахунку."}, {"id": "l03-q05", "title": "Повернення покупцеві", "competency": "cross_return_two_duties", "scenario": "Покупець повертає товар, і підприємець віддає йому гроші з каси.", "modules": ["module-09", "module-10"], "question": "Які два обовʼязки тут виникають?", "options": [{"text": "Отримати письмову заяву покупця та повернути кошти виключно безготівково", "feedback": "Ні. Заява є однією з підстав, а форма повернення нормою не обмежена."}, {"text": "Скласти акт повернення й подати уточнюючу декларацію за попередній період", "feedback": "Ні. Уточнення декларації нормою про повернення коштів не передбачено."}, {"text": "Видати розрахунковий документ і не включати суму до доходу періоду", "correct": true, "feedback": "Правильно. Це вимоги різних актів, і виконувати треба обидві."}], "explanation": "Розрахунковий документ підтверджує і продаж, і повернення товарів чи коштів, і видається на повну суму операції. Окремо діє норма Кодексу: суми, що повертаються покупцю у звʼязку з поверненням товару, розірванням договору або за листом-заявою, до доходу не включаються.", "source_reference": ["SRC-052", "SRC-075", "SRC-010"], "hint": "Один обовʼязок виникає в момент операції, другий — при формуванні доходу періоду."}, {"id": "l03-q06", "title": "Переказ собі й реєстратор", "competency": "cross_internal_transfer", "scenario": "Підприємець переказав 20 000 грн з основного підприємницького рахунку на власний накопичувальний.", "modules": ["module-08", "module-09"], "question": "Як класифікувати цей рядок виписки?", "options": [{"text": "Як дохід за датою зарахування на накопичувальний рахунок підприємця", "feedback": "Ні. Доходом є надходження від діяльності, а не будь-який рух коштів."}, {"text": "Як внутрішній рух: нових коштів не виникло, сума лише змінила рахунок", "correct": true, "feedback": "Правильно. Ту саму суму видно у двох виписках під різними знаками."}, {"text": "Як власні кошти, оскільки підприємець розпоряджається ними на свій розсуд", "feedback": "Ні. Тип «власні кошти» стосується поповнення рахунку підприємцем ззовні."}], "explanation": "Переказ між власними рахунками не створює нових коштів: платник і отримувач — та сама особа. У класифікації виписки такий рядок позначають як внутрішній рух, і на дохід він не впливає ні в бік збільшення, ні в бік зменшення.", "source_reference": ["SRC-010", "SRC-021"], "hint": "Спитайте себе, чи змінилася загальна сума коштів підприємця після операції."}, {"id": "l03-q07", "title": "Призначення платежу", "competency": "cross_purpose_and_classification", "scenario": "У виписці є платіж із призначенням «оплата» від контрагента, з яким укладено кілька договорів.", "modules": ["module-08", "module-09"], "question": "Що це означає для роботи бухгалтера?", "options": [{"text": "Платіжна інструкція оформлена з порушенням, і банк має її повернути", "feedback": "Ні. Реквізит заповнений, і підстав для повернення платежу немає."}, {"text": "Суму треба віднести до доходу, оскільки це найобережніший варіант рішення", "feedback": "Ні. Завищений дохід теж є помилкою й може вплинути на ліміт групи."}, {"text": "Рядок неможливо класифікувати, тому він іде в список запитів до клієнта", "correct": true, "feedback": "Правильно. Відкрите питання чесніше й дешевше за вгадану класифікацію."}], "explanation": "Призначення платежу є обовʼязковим реквізитом, і його функція — звʼязати рух коштів із конкретним документом. Формулювання без номера документа реквізит формально закриває, але класифікувати рядок за ним неможливо, тому він потрапляє в список запитів.", "source_reference": ["SRC-051", "SRC-010"], "hint": "Реквізит заповнений — питання в тому, чи виконує він свою функцію."}, {"id": "l03-q08", "title": "Комісія і база", "competency": "cross_commission", "scenario": "Банк утримав комісію, і підприємець хоче зменшити на неї дохід періоду.", "modules": ["module-08", "module-09"], "question": "Що тут відомо точно, а що ні?", "options": [{"text": "Відомо, що комісія податок не зменшує; база при утриманні — питання до бухгалтера", "correct": true, "feedback": "Правильно. Модулі 8 і 9 це питання свідомо не закривають."}, {"text": "Відомо, що доходом є сума після утримання комісії, бо саме вона надійшла", "feedback": "Ні. Це і є спірне питання, для якого адресної норми не знайдено."}, {"text": "Відомо, що комісія зменшує дохід, оскільки є витратою на обслуговування", "feedback": "Ні. На спрощеній системі витрати на розмір доходу й податку не впливають."}], "explanation": "На спрощеній системі базою є дохід без вирахування витрат, тому комісія податок не зменшує. Але питання, чи є доходом сума до утримання комісії, адресної норми не має і вирішується бухгалтером — це відкрите питання рівня 3.", "source_reference": ["SRC-010", "SRC-072"], "hint": "Розділіть те, що встановлено нормою, і те, що модуль лишає відкритим."}, {"id": "l03-q09", "title": "Група і реєстратор", "competency": "cross_group_and_rro", "scenario": "Підприємець другої групи приймає готівку й оплату карткою, реєстратора не має.", "modules": ["module-09", "module-10"], "question": "Що це означає для нього?", "options": [{"text": "Порушення лише щодо готівки: безготівкові операції реєстратора не потребують", "feedback": "Ні. Норма охоплює розрахункові операції і в безготівковій формі."}, {"text": "Порушення за обома способами: звільнення має лише перша група", "correct": true, "feedback": "Правильно. Санкція рахується від суми продажу за кожним порушенням."}, {"text": "Порушення немає, якщо дохід не перевищує ліміт, установлений для його групи", "feedback": "Ні. Пороги за обсягом доходу існували в редакціях, які вже не діють."}], "explanation": "Реєстратори не застосовуються платниками єдиного податку першої групи. Друга група звільнення не має, а розрахунковими є операції і в готівковій, і в безготівковій формі, тому обидва способи приймання оплати вимагають розрахункового документа.", "source_reference": ["SRC-076", "SRC-075"], "hint": "Перевірте окремо дві речі: чи є звільнення за групою і які форми охоплює норма."}, {"id": "l03-q10", "title": "Дві суми готівки", "competency": "cross_two_limits", "scenario": "За один день підприємець прийняв 9 000 грн від іншого ФОП і 45 000 грн від фізичної особи.", "modules": ["module-09", "module-10"], "question": "Чи порушено граничні суми?", "options": [{"text": "Так: разом сума перевищує 50 000 грн, установлені на один день", "feedback": "Ні. Ліміти застосовуються окремо за кожною категорією контрагентів."}, {"text": "Так: для розрахунків із фізичною особою діє той самий ліміт 10 000 грн", "feedback": "Ні. Для фізичних осіб установлено вищу з двох граничних сум."}, {"text": "Ні: обидві суми в межах відповідних лімітів для своїх категорій сторін", "correct": true, "feedback": "Правильно. 10 000 грн — з підприємцями, 50 000 грн — з фізичними особами."}], "explanation": "Гранична сума готівкових розрахунків між субʼєктами господарювання — 10 000 грн включно, з фізичними особами — 50 000 грн включно протягом одного дня. Ліміти діють окремо за кожною категорією контрагентів і не складаються.", "source_reference": ["SRC-074"], "hint": "Перевірте кожну суму проти власного ліміту, а не проти їхньої суми разом."}, {"id": "l03-q11", "title": "Виписка як доказ", "competency": "cross_statement_and_documents", "scenario": "Після втрати частини документів підприємець пропонує підтвердити операції випискою.", "modules": ["module-08", "module-09"], "question": "Чому цього недостатньо?", "options": [{"text": "Бо виписка не показує змісту й обсягу господарської операції", "correct": true, "feedback": "Правильно. Формувати показники звітності без підтвердних документів заборонено."}, {"text": "Бо банк видає виписку лише за період останніх дванадцяти місяців", "feedback": "Ні. Доступність виписки за період на це питання не впливає."}, {"text": "Бо виписка не містить дати надходження коштів і найменування платника", "feedback": "Ні. Саме ці відомості виписка й показує краще за інші документи."}], "explanation": "Виписка відповідає на питання «чим заплачено», але не на питання «що сталося». Платникам заборонено формувати показники податкової звітності на підставі даних, не підтверджених первинними документами.", "source_reference": ["SRC-012", "SRC-051"], "hint": "Пригадайте три питання комплекту документів і перевірте, на яке відповідає виписка."}, {"id": "l03-q12", "title": "Що лишається бухгалтеру", "competency": "cross_open_questions", "scenario": "Учень хоче самостійно закрити всі спірні позиції за місяць, щоб не турбувати бухгалтера.", "modules": ["module-08", "module-09"], "question": "Які питання рівень 3 свідомо не вирішує?", "options": [{"text": "Класифікацію транзитних коштів і момент визнання доходу за договором", "feedback": "Ні. Обидва питання мають прямі норми: винагорода агента й дата надходження коштів."}, {"text": "Внесення власних коштів, базу при утриманій комісії та дату доходу при еквайрингу", "correct": true, "feedback": "Правильно. Для всіх трьох адресної норми не знайдено, і це сказано прямо."}, {"text": "Розмір готівкових лімітів і перелік груп, звільнених від реєстраторів", "feedback": "Ні. Обидва питання мають чіткі норми з конкретними числами й переліками."}], "explanation": "Рівень 3 залишає бухгалтеру три питання, для яких адресної норми знайти не вдалося: кваліфікація внесення власних коштів на підприємницький рахунок, база доходу при утриманій комісії та дата визнання доходу при еквайрингу. Усі три позначені в уроках і в картах джерел.", "source_reference": ["SRC-010", "SRC-072"], "hint": "Шукайте те, для чого модулі прямо кажуть, що адресної норми не знайдено."}]}, {"level": 4, "title": "Податки ФОП", "planned_modules": 7}, {"level": 5, "title": "Звітність і Електронний кабінет", "planned_modules": 5}, {"level": 6, "title": "Практична робота бухгалтера", "planned_modules": 4}, {"level": 7, "title": "Сучасні технології", "planned_modules": 8}, {"level": 8, "title": "Професійний бухгалтер ФОП", "planned_modules": 4}], "missions": [{"id": "own_fop", "title": "Веду власний ФОП", "note": "Хочу впевнено розуміти власні реєстраційні та податкові дані й не залежати від чужих пояснень."}, {"id": "accountant", "title": "Працюю або хочу працювати бухгалтером ФОП", "note": "Хочу вести облік клієнтів професійно: з джерелами, датами й чіткою межею відповідальності."}, {"id": "before_hiring", "title": "Розбираюся перед наймом бухгалтера", "note": "Хочу розуміти, що саме має робити бухгалтер і як перевірити його роботу."}], "review": {"intervals_days": [1, 3, 7, 21], "title": "Повторення"}, "published_modules": 10, "guide": "# Як проходити курс «Бухгалтер ФОП»\n\n## Як влаштована навігація\n\nЗастосунок має два рівні.\n\n1. **Сторінка курсу** — список рівнів і доступних модулів, ваш загальний прогрес і кількість завершених модулів. Звідси ви відкриваєте модуль.\n2. **Сторінка модуля** — навчальний маршрут: Огляд, Як навчатися, Урок, Практика, Кейс, Чекліст, Глосарій, Джерела, Підсумковий квіз. Кнопка «← Усі модулі» повертає до списку.\n\nСмуга прогресу вгорі показує прогрес того, що ви зараз бачите: на сторінці курсу — курсу, у модулі — модуля (а поруч, у сірій позначці, — відсоток курсу).\n\nСкидання прогресу роздільне: «Скинути прогрес модуля» стирає лише поточний модуль, «Скинути весь прогрес курсу» — усі модулі. Обидві дії питають підтвердження й незворотні.\n\nРівні, модулі яких ще готуються, показані з поміткою про кількість доступних матеріалів. Підсумкова атестація з'явиться після публікації всіх рівнів.\n\n## Мета навчання\n\nНа старті курс питає, навіщо він вам: ви ведете власний ФОП, працюєте (або хочете працювати) бухгалтером, чи розбираєтеся перед наймом фахівця. Від вибору залежить рядок «Навіщо це саме вам» на початку кожного модуля. Мету можна змінити будь-коли на сторінці курсу.\n\n## Повторення\n\nОдноразове проходження створює відчуття знання, але не саме знання. Тому курс має окрему чергу повторення: туди автоматично потрапляє те, у чому ви помилилися (мікроперевірки, питання квізу, реквізити картки профілю), і терміни, які ви позначили складними.\n\nПозиції повертаються через 1, 3, 7 і 21 день. Правильна відповідь відкладає позицію далі, помилка повертає на початок. Після четвертого успішного повторення позиція покидає чергу.\n\nНа сторінці курсу видно, скільки позицій чекає сьогодні. Там же — «Ваші слабкі місця»: перелік того, що потребує уваги, згрупований за модулями.\n\n## Головний принцип\n\nЦей курс потрібно не лише читати. Кожний модуль проходить за циклом:\n\n```text\nпрочитати → виконати дію → перевірити → прочитати пояснення → виправити → повторити\n```\n\nПрогрес нараховується за перевірені навчальні дії. Саме відкриття сторінки не означає, що матеріал засвоєно.\n\n## Значення кольорових блоків\n\n- **Жовтий «Запам’ятайте»** — ключова думка, яку потрібно відтворити своїми словами.\n- **Зелений «Правильний принцип»** — професійне правило роботи.\n- **Червоний «Ризик»** — типова помилка або небезпечний висновок.\n- **Синій «Пояснення»** — контекст, приклад або інструкція.\n\nКолір завжди дублюється назвою та символом. Не потрібно запам’ятовувати інформацію лише через колір.\n\n## 1. Урок\n\nПеред текстом уроку є **передперевірка** — кілька питань «а як ви думаєте?». Відповідайте до читання: спроба пригадати або вгадати робить наступне читання значно ефективнішим. Ці питання не впливають на прогрес, помилятися в них корисно.\n\nПозначки на кшталт `SRC-002` у тексті — це посилання на офіційне джерело твердження. Натисніть, щоб перейти до переліку джерел.\n\n1. Читайте матеріал послідовно.\n2. Звертайте увагу на кольорові блоки.\n3. Після теорії виконайте шість мікроперевірок.\n4. Після вибору відповіді прочитайте пояснення.\n5. Якщо відповідь неправильна, натисніть «Спробувати ще раз».\n\nУрок зараховується після шести правильних відповідей. Він дає **20%** прогресу модуля.\n\n## 2. Практика\n\nПрактика імітує роботу бухгалтера з пакетом документів синтетичного ФОП.\n\nДля кожного рядка:\n\n1. знайдіть інформацію в блоці «Синтетичний пакет»;\n2. якщо значення відоме — введіть його в поле;\n3. виберіть документ або реєстр, який підтверджує значення;\n4. якщо даних немає або потрібна додаткова перевірка — не вигадуйте значення, встановіть відповідну позначку;\n5. натисніть «Перевірити картку»;\n6. прочитайте підказку біля кожного помилкового поля;\n7. виправте помилки й перевірте картку повторно.\n\nПеревірка дивиться на зміст, а не на формулювання: регістр, пробіли, розділові знаки, відмінки й порядок слів не мають значення. «третя група», «3 група» і «третя група єдиного податку» — однаково правильно. Помилкою вважається лише те, що суперечить пакету: інша група, інший код, інше місто.\n\nПояснення біля поля називає всі причини одразу: значення, позначку про недостатність даних і вибране джерело.\n\nЯкщо не знаєте, з чого почати, натисніть **«Підказка»**:\n\n1. перший клік показує, у якому рядку пакета шукати відповідь;\n2. другий — якого вигляду має бути відповідь.\n\nСаме значення підказка не називає, тому **бал не зменшується**. У результаті видно, скільки підказок ви відкрили — це орієнтир для повторення, а не покарання.\n\nПриклад:\n\n```text\nПоле: Номер запису ЄДР\nУ пакеті номера немає\nДія: залишити значення порожнім → вибрати «Потрібна додаткова перевірка» → поставити позначку про недостатність даних\n```\n\nПрактика зараховується з результатом не менше **80%** і дає **30%** прогресу.\n\n## 3. Кейс\n\nКейс перевіряє не пам’ять, а здатність прийняти професійне рішення.\n\n1. Прочитайте ситуацію повністю.\n2. Позначте твердження, які є справжніми ризиками.\n3. Для кожного вибраного ризику вкажіть категорію.\n4. Визначте, хто повинен опрацювати питання: власник, бухгалтер або юрист.\n5. Розставте наступні дії у безпечному порядку: перетягніть картку мишею або скористайтеся стрілками. Початкова послідовність спеціально неправильна; картка стає зеленою одразу, щойно опиняється на своєму місці, а лічильник згори показує «На своїх місцях: N із 6».\n6. Напишіть власне пояснення щонайменше з 60 символів. Лічильник під полем показує, скільки вже набрано.\n7. Натисніть «Перевірити рішення».\n8. Виправте пропущені ризики, категорії, відповідальних або порядок дій.\n\n### Підказки й пояснення в кейсі\n\n- **Під кожним твердженням** є кнопка «Підказка»: вона ставить навідне питання («чи скасовує запис у ЄДР обов’язок відзвітувати?»), але не каже, ризик це чи ні.\n- **Перед списком дій** є «Підказка до послідовності»: вона пояснює принцип безпечного порядку, а не сам порядок.\n- **Під полем пояснення** — «Підказка: що має бути в поясненні»: перелік напрямів, які варто згадати.\n- **Після перевірки** під кожним твердженням з’являється пояснення, чому це ризик або не ризик, а біля поля пояснення показано, які напрями ви згадали, а які ні. Дії, що стоять неправильно, додатково позначаються «не на місці».\n- **Орієнтир для самоперевірки** — зразок повного пояснення — показується лише після того, як ви написали власний текст. Це один із можливих варіантів, а не єдина правильна відповідь.\n\nПідказки не зменшують бал. Порядок дій — це 27% балів кейсу, тому самого лише зеленого кольору для порогу 80% не досить: без правильно визначених ризиків, категорій, відповідальних і власного пояснення кейс не зараховується.\n\nКейс зараховується з результатом не менше **80%** і дає **25%** прогресу.\n\n## 4. Чекліст\n\nЧекліст — це фінальний контроль синтетичного профілю з практики. Це не тест із однією правильною галочкою.\n\nДля кожного пункту виберіть статус:\n\n- **Підтверджено** — інформація є й має належне джерело;\n- **Потрібні дані** — відомостей недостатньо; у примітці напишіть, що треба отримати;\n- **Не застосовується** — пункт справді не стосується ситуації; поясніть чому;\n- **Не перевірено** — робота з пунктом ще не виконана.\n\nПісля вибору статусу обов’язково заповніть поле «Джерело або наступна дія» — щонайменше 10 символів. Наприклад:\n\n```text\nСтатус: Потрібні дані\nПримітка: Отримати номер запису з актуального документа ЄДР\n```\n\nКритичний пункт позначено знаком `!`. Його не можна закрити статусом «Не застосовується».\n\nПід кожним пунктом одразу написано, чого бракує: вибрати статус, доповнити обґрунтування або не закривати критичний пункт цим статусом. Кнопка **«Підказка»** пояснює, що саме перевіряють у цьому пункті і де брати підтвердження — але не каже, який статус ставити: це ваше професійне рішення. Коли пункт опрацьовано, під ним з’являється рядок «Навіщо це в чеклісті» — саме він переноситься на реальну роботу.\n\nЧекліст завершено, коли всі пункти мають обґрунтований статус. Він дає **10%** прогресу.\n\n## 5. Пам'ятка\n\nОкрема сторінка зі стисненою суттю модуля: три статуси, таблиця реквізитів із джерелами, правило відсутніх даних, межа компетенції. Урок читають один раз, пам'ятку відкривають постійно — її можна роздрукувати кнопкою на сторінці.\n\n## 6. Глосарій\n\n1. Прочитайте термін.\n2. Спробуйте пояснити його без підказки.\n3. Натисніть «Показати пояснення».\n4. Якщо визначення було складним, натисніть «Позначити складним» і поверніться до нього пізніше.\n\nГлосарій допомагає повторювати матеріал, але не додає балів до обов’язкового прогресу. У навчальному маршруті він позначений як необов’язковий крок. Кожна картка має рядок «так не кажіть» — побутові формулювання, які професійно неточні. Позначений складним термін потрапляє в чергу повторення.\n\n## 7. Підсумковий квіз\n\n1. Прочитайте практичну ситуацію та питання.\n2. Якщо не знаєте, з чого почати, натисніть «Підказка»: вона ставить навідне питання й не називає варіанта. На бал це не впливає.\n3. Виберіть один варіант.\n4. Не поспішайте далі: прочитайте пояснення правильної відповіді та двох дистракторів.\n5. Якщо хочете обміркувати питання заново, натисніть «Спробувати це питання ще раз» — відповідь скинеться.\n6. Натисніть «Наступне питання».\n7. На екрані результату кожне помилкове питання показує вашу відповідь, правильну відповідь, глибше пояснення та джерела. Кнопка «Переглянути питання N» повертає до нього.\n\nКвіз зараховується з результатом не менше **80%** і дає **15%** прогресу.\n\n## Коли модуль завершено\n\nПрогрес має досягти **100%**:\n\n| Компонент | Вага |\n|---|---:|\n| Урок і мікроперевірки | 20% |\n| Практика | 30% |\n| Кейс | 25% |\n| Чекліст | 10% |\n| Підсумковий квіз | 15% |\n\nМодуль поділено на сесії — у навчальному маршруті вони позначені заголовками з орієнтовним часом. Це природні місця зупинитися й повернутися наступного дня.\n\nВаги можуть відрізнятися в різних модулях — актуальні значення завжди показані на сторінці «Огляд» модуля. Загальний прогрес курсу — це середнє за доступними модулями.\n\nВідповіді автоматично зберігаються лише у вашому браузері. Вони не надсилаються до ДПС, банку або іншого зовнішнього сервісу."}, "modules": [{"index": 1, "id": "module-01", "level": 1, "slug": "module_01_khto_takyi_fop", "meta": {"schema": "course-module/v1", "id": "module-01", "level": 1, "title": "Хто такий ФОП", "language": "uk", "version": "0.4.0", "status": "app_ready", "summary": "Навчіться відрізняти реєстраційний, податковий і банківський статуси та складіть перевірену картку профілю ФОП.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "needs_recheck", "last_verified": "2026-08-15", "next_review": "2026-11-12", "depends_on": [], "estimated_minutes": 55, "source_ids": ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-005", "SRC-006", "SRC-007", "SRC-008", "SRC-009"], "outcomes": ["Відрізнити фізичну особу, ФОП і юридичну особу", "Знайти та пояснити основні реквізити профілю ФОП", "Пояснити призначення ЄДР, РНОКПП, податкової адреси та КВЕД", "Визначити основне і можливе неосновне місце податкового обліку", "Пояснити наслідки майнової відповідальності та припинення ФОП"], "primary_source": {"id": "SRC-002", "note": "Закон № 755-IV про державну реєстрацію — прочитайте статті про відомості ЄДР і виписку самостійно: далі весь курс спирається на це розмежування."}, "sessions": [{"title": "Сесія 1 · Статуси й реєстри", "minutes": 20, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Картка профілю", "minutes": 20, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Рішення й перевірка", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: цей модуль дає точний перелік того, що про вас видно в державних реєстрах і чим це підтверджується.", "accountant": "Ви працюєте з клієнтами: це основа приймання нового ФОП — картка профілю, джерела кожного реквізиту й межа вашої відповідальності.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете перевірити, чи коректно вам склали профіль ФОП і які документи мають бути."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Хто такий ФОП\n\n## Мета\n\nНавчитися бачити у ФОП не «маленьку компанію», а фізичну особу, яка після державної реєстрації отримала право системно здійснювати підприємницьку діяльність. Це допоможе правильно читати реєстраційні й податкові дані та не плутати різні статуси.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. своїми словами пояснити різницю між фізичною особою, ФОП і юридичною особою;\n2. скласти картку профілю ФОП за офіційними документами;\n3. пояснити призначення ЄДР, РНОКПП, податкової адреси та КВЕД;\n4. визначити основне місце податкового обліку та розпізнати ситуацію, коли може виникнути неосновне;\n5. пояснити, яким майном відповідає ФОП і що залишається після припинення діяльності.\n\n## Передумови\n\nСпеціальні бухгалтерські або юридичні знання не потрібні.\n\n## Основні терміни\n\n- **Фізична особа** — людина як учасник цивільних відносин.\n- **ФОП** — фізична особа, яка пройшла державну реєстрацію підприємцем.\n- **Юридична особа** — окремо створена й зареєстрована організація. ФОП юридичною особою не є.\n- **ЄДР** — Єдиний державний реєстр юридичних осіб, фізичних осіб — підприємців та громадських формувань.\n- **РНОКПП** — реєстраційний номер облікової картки платника податків фізичної особи.\n- **Податкова адреса** — місце проживання фізичної особи, за яким її беруть на податковий облік.\n- **КВЕД** — код із Класифікації видів економічної діяльності.\n- **Основне місце обліку** — контролюючий орган за місцем проживання фізичної особи.\n- **Неосновне місце обліку** — контролюючий орган на іншій території, де через майно, об’єкт або діяльність виникають податкові обов’язки.\n\n## Теоретичний матеріал\n\n### 1. Фізична особа і ФОП — не дві різні особи\n\nЛюдина не створює нового суб’єкта на кшталт товариства, коли реєструється ФОП. Вона залишається тією самою фізичною особою, але отримує зареєстрований статус підприємця.\n\nЦивільний кодекс надає фізичній особі з повною цивільною дієздатністю право на підприємницьку діяльність, не заборонену законом, але реалізація цього права потребує державної реєстрації. [SRC-001] Тому договір із «ФОП Іваненко» юридично пов’язаний із самою фізичною особою Іваненко, а не з окремою компанією.\n\nПрактичний наслідок: у ФОП немає окремого коду ЄДРПОУ, як у юридичної особи. У документах ФОП зазвичай ідентифікується ПІБ та РНОКПП або дозволеними законом паспортними даними для особи, яка офіційно відмовилася від РНОКПП.\n\n> [!REMEMBER]\n> **ФОП — не окрема компанія.** Це та сама фізична особа, яка має зареєстрований підприємницький статус.\n\n### 2. Що робить державна реєстрація\n\nДержавна реєстрація створює офіційний запис про підприємницький статус фізичної особи в ЄДР. Саме запис у ЄДР, а не відкриття банківського рахунку, підписання договору чи перше надходження коштів, підтверджує державну реєстрацію ФОП. [SRC-002]\n\nЗа результатом реєстраційної дії формується виписка. Актуальні відомості також можна отримувати з ЄДР у передбачених законом формах. [SRC-002] Реєстрацію можна провести через державного реєстратора або доступну електронну державну послугу. Конкретний інтерфейс і строки електронної послуги необхідно перевіряти безпосередньо перед її використанням.\n\nВажливо розділяти три речі:\n\n1. державну реєстрацію ФОП у ЄДР;\n2. податковий облік;\n3. обрану систему оподаткування та спеціальні реєстрації, наприклад статус платника єдиного податку або ПДВ.\n\nЦі дані пов’язані, але не тотожні. Наявність запису ФОП у ЄДР сама по собі не доводить, що особа вже має потрібну групу єдиного податку.\n\n> [!PRINCIPLE]\n> **Одне поле — одне належне джерело.** ЄДР підтверджує реєстраційні відомості, а групу єдиного податку та ПДВ перевіряють окремими податковими джерелами.\n\n### 3. ЄДР і картка профілю ФОП\n\nДля первинного бухгалтерського контролю важливо зафіксувати щонайменше:\n\n- повне ПІБ;\n- РНОКПП або передбачену законом альтернативу;\n- дату й номер запису державної реєстрації;\n- стан реєстрації;\n- адресу, зазначену в реєстраційних даних;\n- основний та додаткові види діяльності;\n- податковий орган за основним місцем обліку;\n- систему оподаткування, групу й ставку — за окремим податковим підтвердженням;\n- статус платника ПДВ — за окремим реєстром;\n- банківські рахунки — за банківськими документами.\n\nНе можна заповнювати всю картку лише за одним витягом: ЄДР підтверджує реєстраційні відомості, але не замінює податкові реєстри та банківські документи.\n\n> [!RISK]\n> Не переносіть податковий статус із припущення або старого документа. Фіксуйте джерело і дату кожної перевірки.\n\n### 4. РНОКПП\n\nРНОКПП — це номер, за яким податкова служба обліковує фізичну особу. Після реєстрації підприємцем людина не отримує «другий податковий номер для ФОП». Її підприємницька діяльність пов’язується з тим самим РНОКПП. [SRC-009]\n\nВиняток стосується фізичних осіб, які через релігійні переконання офіційно відмовилися від РНОКПП і мають відповідну відмітку в паспорті. У навчальних прикладах цю ситуацію потрібно позначати окремо, а не вигадувати номер.\n\n> [!REMEMBER]\n> Після реєстрації ФОП людина не отримує «другий податковий номер для бізнесу».\n\n### 5. Податкова адреса\n\nДля фізичної особи податковою адресою є місце її проживання, за яким вона перебуває на обліку в контролюючому органі. Одночасно фізична особа може мати не більше однієї податкової адреси. [SRC-003] [SRC-006]\n\nПодаткова адреса — це не обов’язково адреса офісу, складу або місце, де фактично виконується кожна послуга. Зміну адресних даних не можна залишати лише «у банку» чи «в договорі»: потрібно перевірити, у яких державних реєстрах і формах вона має бути відображена.\n\n> [!INFO]\n> Податкова адреса, адреса офісу і місце розташування майна можуть бути різними. Кожне з них перевіряють у своєму контексті.\n\n### 6. КВЕДи\n\nКВЕД класифікує вид економічної діяльності. Під час реєстрації ФОП зазначає види діяльності, які планує здійснювати. Один вид визначається як основний, інші можуть бути додатковими. [SRC-002] [SRC-008]\n\nКВЕД виконує описову й облікову функцію, але не є універсальним дозволом. Наявність коду:\n\n- не скасовує вимогу ліцензії чи іншого спеціального дозволу;\n- не означає автоматичної сумісності діяльності з обраною системою оподаткування;\n- не замінює аналіз фактичного змісту операції;\n- не робить незаконну діяльність законною.\n\nПеред новим видом діяльності бухгалтер звіряє фактичну послугу або товар із зареєстрованими КВЕДами, податковими обмеженнями й ліцензійними вимогами.\n\n> [!RISK]\n> Наявність КВЕД не є автоматичним дозволом на ліцензовану діяльність і не гарантує сумісність із податковою групою.\n\n### 7. Основне і неосновне місце обліку\n\nОсновне місце обліку фізичної особи пов’язане з її місцем проживання. Неосновне місце може виникнути, якщо на території іншої адміністративно-територіальної одиниці розташовані майно, об’єкти оподаткування або об’єкти, через які здійснюється діяльність і виникають податкові обов’язки. [SRC-003] [SRC-007]\n\nПриклад: ФОП має податкову адресу в Полтаві, але володіє нежитловим приміщенням у Львові, за яким виникає місцевий податковий обов’язок. Полтава залишається основним місцем обліку, а у Львові може бути потрібний облік за неосновним місцем. Конкретний обов’язок потрібно перевіряти за видом майна й податку.\n\n> [!PRINCIPLE]\n> Майно на іншій території — це сигнал для перевірки можливого неосновного місця обліку, а не підстава автоматично змінювати податкову адресу.\n\n### 8. Майнова відповідальність\n\nФОП відповідає за підприємницькими зобов’язаннями всім своїм майном, крім майна, на яке закон забороняє звертати стягнення. [SRC-001] Це одна з головних відмінностей від побутового уявлення про «окремий бізнес-гаманець».\n\nДля особи у шлюбі Цивільний кодекс також передбачає відповідальність особистим майном і тією часткою у спільній сумісній власності подружжя, яка належала б їй при поділі. [SRC-001] У реальній борговій або сімейній ситуації потрібна консультація юриста: бухгалтер не визначає самостійно, на яке конкретне майно може бути звернене стягнення.\n\n### 9. Припинення і нова реєстрація\n\nПрипинення ФОП означає внесення до ЄДР запису про державну реєстрацію припинення підприємницької діяльності. [SRC-002] Після цього не можна продовжувати працювати від імені закритого ФОП.\n\nВодночас запис про припинення не анулює зобов’язання, які виникли під час діяльності. Можуть залишитися обов’язки подати звітність, сплатити податки, виконати договори, закрити рахунки або пройти податкові процедури. [SRC-003]\n\n«Відновити» закритий запис ФОП не можна. Якщо людина знову хоче працювати підприємцем, вона проходить нову державну реєстрацію. [SRC-002] [SRC-005] Перед новою реєстрацією потрібно перевірити наслідки попередньої діяльності та актуальні умови обраної системи оподаткування.\n\n> [!REMEMBER]\n> Запис про припинення в ЄДР зупиняє підприємницький статус на майбутнє, але не стирає попередні податкові, договірні чи майнові зобов’язання.\n\n## Покроковий процес\n\nЩоб перевірити базовий профіль ФОП:\n\n1. Отримати актуальні реєстраційні відомості з ЄДР.\n2. Звірити ПІБ, РНОКПП, дату запису, стан, адресу і КВЕДи.\n3. Окремо перевірити податковий статус у відповідному реєстрі або витягу ДПС.\n4. Визначити податкову адресу й основне місце обліку.\n5. Перевірити, чи є майно або об’єкти на інших територіях, які можуть створити неосновне місце обліку.\n6. Зафіксувати банківські рахунки за банківськими документами.\n7. Позначити відсутні або суперечливі дані, не домислюючи їх.\n8. Записати дату перевірки кожного змінного статусу.\n\n## Практичні приклади\n\n### Приклад 1. ФОП — не окрема компанія\n\nМарія зареєстрована підприємцем і надає дизайнерські послуги. У договорі зазначено «ФОП Марія Коваль» та її РНОКПП. Стороною договору є Марія як фізична особа-підприємець, а не нова юридична особа з окремим майном.\n\n### Приклад 2. ЄДР не підтверджує всю податкову картину\n\nУ ЄДР видно активний запис ФОП і КВЕДи. Але для твердження «ФОП є платником єдиного податку третьої групи без ПДВ» бухгалтер додатково перевіряє реєстр або витяг ДПС.\n\n### Приклад 3. Закриття не стирає минуле\n\nФОП припинив діяльність у ЄДР, але не подав останню декларацію і має несплачений податок. Припинення реєстрації не скасовує ці обов’язки.\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Вважати ФОП окремою юридичною особою | Борги й відповідальність пов’язані з фізичною особою | Розрізняти статус підприємця і створення юридичної особи |\n| Називати РНОКПП «кодом ЄДРПОУ ФОП» | Це різні ідентифікатори | Використовувати точну назву РНОКПП |\n| Визначати податкову групу лише за ЄДР | ЄДР не замінює податковий реєстр | Отримати податкове підтвердження |\n| Вважати КВЕД дозволом на будь-яку діяльність | Можуть діяти ліцензійні й податкові обмеження | Перевірити фактичну діяльність окремо |\n| Вважати закриття ФОП списанням боргів | Попередні зобов’язання зберігаються | Провести фінальне податкове й договірне закриття |\n| «Відновлювати» старий ФОП | Закритий запис не відновлюється | За потреби пройти нову реєстрацію |\n\n## Ризики й межі самостійних дій\n\n- Цей модуль не визначає, яку систему оподаткування обрати.\n- Наявність конкретного КВЕД і право працювати на певній податковій групі перевіряються окремо.\n- Майнові, сімейні, спадкові та боргові питання потребують юридичного аналізу.\n- Закриття ФОП не можна вважати завершеним бухгалтерськи лише за записом у ЄДР.\n- Інтерфейс і строки електронних державних послуг можуть змінюватися.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, якщо треба визначити систему оподаткування, перевірити реєстраційні й податкові статуси, сформувати остаточну звітність або закрити податкові розрахунки.\n\n**Юрист потрібен**, якщо є борги, спір із контрагентом, загроза стягнення майна, спільне майно подружжя, ліцензована діяльність або оскарження рішень державного органу.\n\n## Підсумок\n\nФОП — це фізична особа у зареєстрованому підприємницькому статусі, а не окрема юридична особа. ЄДР підтверджує державну реєстрацію та основні реєстраційні відомості; РНОКПП ідентифікує фізичну особу в податковому обліку; КВЕД описує види діяльності; податкові статуси перевіряються окремо. ФОП відповідає власним майном, а припинення реєстрації не припиняє попередніх зобов’язань.\n\n## Самоперевірка\n\n1. Чи створюється нова юридична особа після реєстрації ФОП?\n2. Яка подія підтверджує виникнення статусу ФОП?\n3. Чому витяг з ЄДР не підтверджує автоматично групу єдиного податку?\n4. Чим РНОКПП відрізняється від коду ЄДРПОУ?\n5. Що таке податкова адреса фізичної особи?\n6. Коли може виникнути неосновне місце обліку?\n7. Чи є КВЕД ліцензією?\n8. Чи зникають податкові борги після припинення ФОП?\n\n## Джерела\n\nПовна карта тверджень і посилань наведена в `references.md`. Основні джерела: Цивільний кодекс України, Закон № 755-IV, Податковий кодекс України, офіційні сторінки ДПС, Дія та КВЕД-2010 Держстату.\n\n## Дата перевірки актуальності\n\n- Законодавчі положення перевірено: **14.08.2026**.\n- Електронні послуги Дія перевірено: **14.08.2026**.\n- Наступна комплексна перевірка модуля: **12.11.2026**.\n- Людська фактологічна перевірка: **прийнято користувачем 14.08.2026**."}, {"id": "practice", "title": "Практика", "content": "# Практика: картка профілю ФОП\n\n## Мета\n\nНавчитися збирати базові дані ФОП із правильних джерел і не змішувати реєстраційний, податковий та банківський статуси.\n\n## Навчальна ситуація\n\nВикористовуйте лише наведені синтетичні дані. Не вводьте реальний РНОКПП, адресу, рахунок або персональні документи.\n\nФізична особа **Олена Прикладенко** надала:\n\n- виписку з ЄДР: активний ФОП, запис від 05.08.2026;\n- основний КВЕД 74.10 «Спеціалізована діяльність із дизайну»;\n- додатковий КВЕД 62.01 «Комп’ютерне програмування»;\n- податкову адресу: м. Полтава;\n- витяг ДПС: третя група єдиного податку, без ПДВ;\n- довідку банку з підприємницьким IBAN;\n- інформацію про нежитлове приміщення у Львові.\n\n## Завдання 1. Заповніть картку\n\n| Поле | Значення | Джерело підтвердження | Перевірено |\n|---|---|---|---|\n| ПІБ |  |  |  |\n| РНОКПП / законна альтернатива |  |  |  |\n| Стан державної реєстрації |  |  |  |\n| Дата і номер запису ЄДР |  |  |  |\n| Податкова адреса |  |  |  |\n| Основне місце обліку |  |  |  |\n| Можливе неосновне місце обліку |  |  |  |\n| Основний КВЕД |  |  |  |\n| Додаткові КВЕДи |  |  |  |\n| Система і група оподаткування |  |  |  |\n| Статус ПДВ |  |  |  |\n| Підприємницький IBAN |  |  |  |\n\n## Завдання 2. Знайдіть прогалини\n\nПозначте дані, яких недостатньо для остаточного висновку:\n\n- номер запису ЄДР;\n- РНОКПП або законна альтернатива;\n- точний контролюючий орган за основним місцем обліку;\n- податкові наслідки приміщення у Львові;\n- дата формування податкового витягу;\n- IBAN і валюта рахунку.\n\nПоясніть, чому ці дані не можна домислити.\n\n## Завдання 3. Розділіть джерела\n\nРозподіліть поля між:\n\n1. ЄДР;\n2. реєстрами або витягами ДПС;\n3. банківськими документами;\n4. документами на майно;\n5. інформацією, яку потрібно додатково перевірити.\n\n## Критерії виконання\n\n- кожне заповнене поле має назване джерело;\n- відсутні дані позначено як відсутні, а не вигадані;\n- групу єдиного податку не підтверджено лише випискою з ЄДР;\n- питання неосновного місця обліку позначено для окремої перевірки;\n- у відповіді немає реальних персональних даних."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Я закрив ФОП — отже, боргів більше немає?»\n\n## Ситуація\n\nАндрій, ФОП із податковою адресою в Києві, надавав консультаційні послуги. Він подав заяву про припинення через Дію та побачив у ЄДР запис про припинення. Після цього Андрій:\n\n- вирішив не подавати останню декларацію;\n- не перевірив стан розрахунків із бюджетом;\n- продовжив виконувати старий договір і прийняв оплату;\n- через місяць вирішив «відновити той самий ФОП»;\n- вважає, що особисте майно не пов’язане з підприємницькими боргами.\n\n## Завдання\n\n1. Знайдіть щонайменше п’ять ризиків або помилкових припущень.\n2. Відокремте реєстраційне припинення від податкового й договірного завершення.\n3. Поясніть, чи можна відновити закритий ФОП.\n4. Складіть безпечний перелік наступних дій без розрахунку конкретних податків.\n5. Позначте, які питання має перевірити бухгалтер, а які — юрист.\n\n## Орієнтир для самоперевірки\n\n- запис у ЄДР припиняє підприємницький статус на майбутнє, але не ліквідує попередні зобов’язання;\n- після припинення не слід продовжувати діяльність від імені закритого ФОП;\n- остаточні декларації, податки, банківські й договірні питання перевіряються окремо;\n- закритий ФОП не відновлюється — для нової діяльності потрібна нова реєстрація;\n- підприємницька відповідальність не ізольована від майна фізичної особи так, як уявляв Андрій.\n\nЦе навчальний кейс, а не
