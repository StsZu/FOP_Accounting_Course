"Потрібні дані"}, {"value": "na", "label": "Не застосовується", "blocks_critical": true}], "items": [{"id": "basis", "group": "Про що домовилися", "text": "Є документ, що фіксує домовленість про операцію", "critical": true, "hint": "Це може бути договір, оплачений рахунок або листування, прирівняне до письмової форми. Запишіть, який саме документ ви взяли.", "why": "Без підстави неможливо сказати, чому операція взагалі відбулася і на яких умовах."}, {"id": "terms_match", "group": "Про що домовилися", "text": "Фактичні умови операції збігаються з підставою", "critical": true, "hint": "Порівняйте обсяг, ціну й строк у документі про подію з тим, що записано в договорі. Розбіжність — це «потрібні дані».", "why": "Розбіжність між підставою і фактом означає, що частина операції нічим не підтверджена."}, {"id": "changes_form", "group": "Про що домовилися", "text": "Зміни умов оформлено в тій самій формі, що й основний документ", "critical": false, "hint": "Якщо змін не було — це «не застосовується». Якщо були, перевірте, у якій формі їх зафіксовано.", "why": "Зміна договору вчиняється в такій самій формі, що й договір, тому усна чи месенджерна домовленість письмовий договір не змінює."}, {"id": "event_doc", "group": "Що сталося", "text": "Є документ про подію: акт, накладна або розрахунковий документ", "critical": true, "hint": "Рахунок сюди не підходить: він фіксує намір. Шукайте документ, який каже, що операція вже відбулася.", "why": "Це питання найчастіше лишається без відповіді, і саме його першим ставить перевіряльник."}, {"id": "event_content", "group": "Що сталося", "text": "З документа зрозуміло, що саме й у якому обсязі зроблено або передано", "critical": true, "hint": "Формулювання «послуги згідно з договором» цього не дає. Запишіть, які саме слова в документі відповідають на це питання.", "why": "Зміст і обсяг операції — обовʼязковий реквізит, і без нього документ не виконує своєї функції."}, {"id": "ttn", "group": "Що сталося", "text": "Для перевезення вантажу оформлено товарно-транспортну накладну", "critical": false, "hint": "Якщо перевезення не було — «не застосовується». Якщо було, перевірте реквізити за нормою про автомобільний транспорт, а не за переліком статті 9.", "why": "ТТН оформлюється незалежно від умов оплати за роботу автомобіля і має власний перелік обовʼязкових реквізитів."}, {"id": "authority", "group": "Що сталося", "text": "Якщо цінності одержувала інша особа — підтверджено її повноваження", "critical": false, "hint": "Підтвердженням можуть бути письмовий договір, довіреність або акт органу юридичної особи. Довіреність без дати вчинення нікчемна.", "why": "Без підтвердження повноважень неможливо довести, що товар передано саме покупцеві."}, {"id": "payment_doc", "group": "Чим заплачено", "text": "Є документ про розрахунок", "critical": true, "hint": "Платіжна інструкція, виписка, фіскальний чек або розписка. Запишіть, який саме документ підтверджує розрахунок за цією операцією.", "why": "Для платника єдиного податку саме розрахунок визначає дату визнання доходу."}, {"id": "purpose", "group": "Чим заплачено", "text": "Призначення платежу дає змогу знайти документ про операцію та її період", "critical": true, "hint": "Перевірте себе одним питанням: чи знайдете ви за цим текстом потрібний документ через рік. «Оплата за послуги» — це «потрібні дані».", "why": "Призначення платежу — обовʼязковий реквізит платіжної інструкції, і його функція саме в цьому звʼязку."}, {"id": "payer", "group": "Чим заплачено", "text": "Платник у документі про оплату збігається зі стороною операції", "critical": false, "hint": "Якщо платник інший, запишіть, чиє зобовʼязання погашено цим платежем і на якій підставі.", "why": "Платіж від третьої особи без зафіксованої підстави ускладнює віднесення доходу до конкретної операції."}, {"id": "form_kind", "group": "Форма кожного документа", "text": "Для кожного документа визначено: форма встановлена законом чи довільна", "critical": true, "hint": "Встановлену форму мають ТТН, фіскальний чек і платіжна інструкція. Решта документів комплекту складається довільно.", "why": "Від цього залежить, за яким переліком реквізитів перевіряти документ."}, {"id": "free_form_req", "group": "Форма кожного документа", "text": "Документи довільної форми перевірено за шістьма обовʼязковими реквізитами", "critical": true, "hint": "Це перелік із модуля 4. Самостійно виготовлений бланк має містити обовʼязкові реквізити або реквізити типової форми.", "why": "Довільна форма не означає довільний зміст: шість реквізитів обовʼязкові й тут."}, {"id": "fixed_form_req", "group": "Форма кожного документа", "text": "Документи встановленої форми перевірено за реквізитами відповідної норми", "critical": false, "hint": "Для ТТН перелік у Законі про автомобільний транспорт, для платіжної інструкції — у пункті 37 Інструкції НБУ, для фіскального чека — в окремому наказі.", "why": "Перенесення переліку статті 9 на ці документи дає і зайві вимоги, і пропущені реквізити."}, {"id": "no_invoice_as_proof", "group": "Контроль якості", "text": "Рахунок не зараховано як підтвердження того, що операція сталася", "critical": true, "hint": "Перегляньте, який документ ви записали у відповідь на друге питання. Якщо там рахунок — це «потрібні дані».", "why": "Рахунком не фіксується господарська операція, тому він не закриває питання «що сталося»."}, {"id": "no_extra_demands", "group": "Контроль якості", "text": "Контрагенту не висунуто вимог, яких норма не містить", "critical": false, "hint": "Перечитайте власний запит: печатка, номер документа й місце складання в первинному документі до обовʼязкових не належать.", "why": "Зайві вимоги затримують закриття періоду й не додають жодної надійності комплекту."}, {"id": "translation", "group": "Контроль якості", "text": "Документи іноземною мовою супроводжуються перекладом", "critical": false, "hint": "Якщо іноземних документів немає — «не застосовується». Якщо є, питання просте: чи зрозуміє зміст операції стороння людина.", "why": "Без перекладу неможливо показати зміст і обсяг операції під час перевірки."}, {"id": "gap_list", "group": "Контроль якості", "text": "Зафіксовано, чого бракує, у кого це запитати і до якої дати", "critical": true, "hint": "Запишіть три речі: документ, контакт і дедлайн. «Запитаю в клієнта» без дати — це «потрібні дані».", "why": "Документ, якого просять «колись», не приходить ніколи, а період тим часом закривається."}]}, "glossary": [{"term": "Рахунок (рахунок-фактура)", "definition": "Документ про намір: вимога оплатити. Господарської операції ним не фіксується, тому підтвердженням події він не є.", "example": "Рахунок на 15 000 грн за налаштування обладнання, надісланий до початку робіт.", "avoid": "«первинний документ» — рахунок ознакам первинного документа не відповідає"}, {"term": "Акт наданих послуг", "definition": "Документ про подію: що саме й у якому обсязі виконано. Затвердженої форми немає, складається довільно з обовʼязковими реквізитами.", "example": "Акт за вересень із переліком робіт і сумою, підписаний виконавцем.", "avoid": "«акт за типовою формою» — типової форми акта наданих послуг немає"}, {"term": "Акт виконаних робіт", "definition": "Документ, яким замовник приймає результат роботи за договором підряду.", "example": "Підписання акта після огляду відремонтованого обладнання.", "avoid": "«формальність для бухгалтерії» — з підписанням повʼязана втрата права на претензії щодо явних недоліків"}, {"term": "Видаткова накладна", "definition": "Документ про передання товару покупцеві. Форма довільна, реквізити обовʼязкові.", "example": "Накладна на запчастини, які покупець вивіз зі складу власним транспортом.", "avoid": "«те саме, що ТТН» — накладна про товар, ТТН про перевезення"}, {"term": "Товарно-транспортна накладна", "definition": "Єдиний для всіх учасників транспортного процесу документ на перевезення вантажу; реквізити встановлено Законом про автомобільний транспорт.", "example": "ТТН, виписана вантажовідправником у трьох примірниках на доставку деталей.", "avoid": "«документ про те, що передано покупцеві» — опису вантажу серед її обовʼязкових реквізитів немає"}, {"term": "Е-ТТН", "definition": "Товарно-транспортна накладна в електронній формі, підписана електронними підписами водія або експедитора та відповідальних осіб сторін.", "example": "Водій предʼявляє е-ТТН у візуальній формі подання електронного документа.", "avoid": "«скан паперової ТТН» — це різні речі, як і в модулі 4"}, {"term": "Розрахунковий документ", "definition": "Документ встановленої форми та змісту, що підтверджує факт продажу, надання послуги або отримання коштів.", "example": "Касовий чек, товарний чек, розрахункова квитанція, проїзний документ.", "avoid": "«будь-який документ про оплату» — форма і зміст тут встановлені"}, {"term": "Фіскальний чек", "definition": "Розрахунковий документ з обовʼязковими реквізитами, встановленими окремим наказом: від найменування субʼєкта господарювання до назви товару з вартістю.", "example": "Чек із магазину на купівлю інструменту за готівку.", "avoid": "«те саме, що товарний чек» — обовʼязкові реквізити встановлено саме для фіскального"}, {"term": "Платіжна інструкція", "definition": "Документ, яким платник ініціює платіжну операцію; містить вісім обовʼязкових реквізитів.", "example": "Платіжна інструкція на оплату рахунку, сформована в банківському застосунку.", "avoid": "«платіжка на розсуд банку» — перелік реквізитів встановлено Інструкцією НБУ"}, {"term": "Призначення платежу", "definition": "Обовʼязковий реквізит платіжної інструкції, який звʼязує рух коштів із конкретним документом і періодом.", "example": "«Оплата за рахунком № 14 від 03.10.2026 за жовтень».", "avoid": "«поле за бажанням» — це обовʼязковий реквізит, а не побажання банку"}, {"term": "Довіреність", "definition": "Письмовий документ, що видається однією особою іншій для представництва перед третіми особами; її форма відповідає формі правочину.", "example": "Довіреність водію на отримання запчастин зі складу постачальника.", "avoid": "«обовʼязково за формою М-2 з печаткою» — цю Інструкцію скасовано з 2014 року"}, {"term": "Розписка", "definition": "Документ про одержання виконання зобовʼязання, який кредитор зобовʼязаний видати на вимогу боржника.", "example": "Розписка про отримання готівки за виконану роботу.", "avoid": "«необовʼязковий папірець» — на вимогу боржника її видача обовʼязкова"}, {"term": "Додаткова угода", "definition": "Документ про зміну умов договору; вчиняється в такій самій формі, що й договір, який змінюється.", "example": "Угода про підвищення ціни обслуговування з листопада.", "avoid": "«домовленість у листуванні» — письмовий договір нею не змінюється"}, {"term": "Інвойс", "definition": "Рахунок іноземного контрагента: показує намір і умови розрахунку, а не факт здійсненої операції.", "example": "Інвойс на 400 євро за програмне забезпечення від нерезидента.", "avoid": "«іноземний акт» — інвойс за призначенням є рахунком"}, {"term": "Документ довільної форми", "definition": "Документ, форму якого не затверджено нормативним актом; має містити обовʼязкові реквізити або реквізити типової форми.", "example": "Власний бланк акта наданих послуг із шістьма обовʼязковими реквізитами.", "avoid": "«документ у будь-якому вигляді» — довільна форма не означає довільний зміст"}, {"term": "Типова форма", "definition": "Форма документа, затверджена нормативним актом відповідного органу державної влади.", "example": "Форма товарно-транспортної накладної в додатку до Правил перевезень.", "avoid": "«має бути для кожного документа» — для більшості документів ФОП її немає"}]}}, {"index": 6, "id": "module-06", "level": 2, "slug": "module_06_dohovory", "meta": {"schema": "course-module/v1", "id": "module-06", "level": 2, "title": "Договори", "language": "uk", "version": "0.1.0", "status": "app_ready", "summary": "Навчіться читати проєкт договору: істотні умови після скасування Господарського кодексу, що буде при простроченні оплати, коли договір продовжується сам і як перевірити контрагента до підпису.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "pending", "last_verified": "2026-09-06", "next_review": "2026-11-01", "depends_on": ["module-05"], "estimated_minutes": 65, "source_ids": ["SRC-002", "SRC-035", "SRC-036", "SRC-046", "SRC-054", "SRC-057", "SRC-058", "SRC-059", "SRC-060", "SRC-061", "SRC-062", "SRC-063", "SRC-064", "SRC-065", "SRC-066", "SRC-067"], "outcomes": ["Назвати істотні умови договору й пояснити, чому їх перелік більше не береться з Господарського кодексу", "Визначити за проєктом договору, що станеться при простроченні оплати", "Пояснити, коли договір продовжується автоматично, а коли припиняється", "Перевірити контрагента в офіційних реєстрах до підписання", "Назвати вимоги до зовнішньоекономічного договору й строк розрахунків за ним"], "primary_source": {"id": "SRC-058", "note": "Стаття 638 Цивільного кодексу — прочитайте частину першу самостійно. Вона займає три рядки й називає не три обовʼязкові пункти, а три різні джерела істотних умов; саме це найчастіше переказують неправильно."}, "sessions": [{"title": "Сесія 1 · Що змінилося і що таке істотна умова", "minutes": 25, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Читання проєкту договору", "minutes": 25, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Прострочення, продовження, ЗЕД", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви побачите в надісланому проєкті договору те, що вирішує вашу долю при простроченні оплати, і не пропустите оренду, яка поновилася сама.", "accountant": "Ви працюєте з клієнтами: модуль дає шість питань, на які бухгалтер має відповісти за проєктом договору, і чітку межу, за якою починається робота юриста.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зрозумієте, чому бухгалтер просить показати договір до оплати, а не після неї."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Договори\n\n## Мета\n\nНавчитися читати проєкт договору як бухгалтер: знаходити істотні умови, бачити, що станеться при простроченні оплати, розуміти, коли договір продовжується сам, і перевіряти контрагента до підпису, а не після.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. назвати істотні умови договору й пояснити, чому їх перелік більше не береться з Господарського кодексу;\n2. визначити за проєктом договору, що станеться при простроченні оплати;\n3. пояснити, коли договір продовжується автоматично, а коли припиняється;\n4. перевірити контрагента в офіційних реєстрах до підписання;\n5. назвати вимоги до зовнішньоекономічного договору й строк розрахунків за ним.\n\n## Передумови\n\nМодуль 5. Договір там був названий як документ, що закриває питання «про що домовилися»; тут ми відкриваємо його й читаємо.\n\n## Основні терміни\n\n- **Договір** — домовленість двох або більше сторін, спрямована на встановлення, зміну або припинення цивільних прав та обовʼязків. [SRC-058]\n- **Істотні умови** — умови, без згоди щодо яких договір не є укладеним. [SRC-058]\n- **Оферта й акцепт** — пропозиція укласти договір і її повне та безумовне прийняття. [SRC-058]\n- **Істотне порушення** — порушення, через яке друга сторона значною мірою позбавляється того, на що розраховувала. [SRC-058]\n- **Граничний строк розрахунків** — строк, у який мають надійти кошти за експортом або надійти товар за імпортом. [SRC-063]\n\n## Теоретичний матеріал\n\n### 1. Господарського кодексу більше немає\n\nЗ цього починається модуль, бо це змінює все інше.\n\n**Господарський кодекс України втратив чинність 28 серпня 2025 року** на підставі Закону № 4196-IX. [SRC-057] Разом із ним зникла категорія «господарський договір» і стаття 180 ГКУ, яка називала три істотні умови: предмет, ціну і строк.\n\nПрактичні наслідки:\n\n- усі договори ФОП тепер живуть за **Цивільним кодексом**;\n- перелік істотних умов береться зі статті 638 ЦКУ, а не з памʼяті про ГКУ; [SRC-058]\n- шаблони договорів із посиланнями на статті ГКУ застаріли — незалежно від того, наскільки авторитетним виглядає джерело.\n\n> [!RISK]\n> Більшість шаблонів договорів в інтернеті досі містить формулювання «відповідно до статті 193 Господарського кодексу України» або «господарський договір». Це не робить договір недійсним автоматично, але показує, що текст не переглядали після серпня 2025 року. Що робити з чинним договором, у якому такі посилання є, вирішує юрист — модуль цього не визначає. [SRC-057]\n\n### 2. Свобода договору й чотири межі\n\nСторони вільні в укладенні договору, виборі контрагента та визначенні умов — з урахуванням вимог Кодексу, інших актів цивільного законодавства, звичаїв ділового обороту, вимог розумності та справедливості. [SRC-058]\n\nЗміст договору становлять умови, визначені на розсуд сторін і погоджені ними, **та умови, які є обовʼязковими** відповідно до актів цивільного законодавства. [SRC-058] Тобто свобода не безмежна: частина умов приходить із закону незалежно від бажання сторін.\n\nДоговір є обовʼязковим для виконання сторонами. [SRC-058] Сторони можуть укласти **змішаний договір** з елементами різних договорів; до кожної частини застосовуються положення про відповідний договір. [SRC-058]\n\n### 3. Істотні умови: три джерела, а не три пункти\n\nДоговір є укладеним, якщо сторони досягли згоди з **усіх істотних умов**. Істотними є: [SRC-058]\n\n1. умови про **предмет** договору;\n2. умови, що **визначені законом як істотні або є необхідними** для договорів даного виду;\n3. **усі ті умови, щодо яких за заявою хоча б однієї із сторін має бути досягнуто згоди**.\n\nТретій пункт — найбільш недооцінений. **Сторона сама може зробити умову істотною**, заявивши, що без згоди щодо неї договір не укладається. Якщо ви написали контрагенту «без строку оплати не підписуємо» — строк оплати став істотною умовою для цього договору.\n\n> [!PRINCIPLE]\n> Питання «які істотні умови в договорі» не має універсальної відповіді зі списку. Правильне питання: що є предметом, що для цього виду договору вимагає закон і чи заявляла якась зі сторін окрему умову як обовʼязкову.\n\nДоговір укладається шляхом пропозиції однієї сторони (оферти) і прийняття пропозиції (акцепту) другою. [SRC-058] Акцепт має бути **повним і безумовним**; відповідь «згодні, але змінимо строк» акцептом не є. [SRC-058]\n\nОкремо: якщо особа, яка одержала пропозицію, у межах строку для відповіді **вчинила дію** відповідно до вказаних у пропозиції умов — відвантажила товар, надала послугу, сплатила суму — ця дія є прийняттям пропозиції. [SRC-058] Саме тому оплачений рахунок працює як укладений договір.\n\n### 4. Форма договору\n\nДоговір може бути укладений у будь-якій формі, якщо вимоги щодо форми не встановлені законом. [SRC-058] Якщо сторони домовилися про певну форму, договір вважається укладеним з моменту надання йому цієї форми — навіть якщо закон такої форми не вимагав. [SRC-058]\n\nЯкщо сторони домовилися укласти договір за допомогою інформаційно-комунікаційних систем, він вважається укладеним **у письмовій формі**. [SRC-058]\n\nПравочини між фізичною та юридичною особою належить вчиняти письмово, крім тих, що повністю виконуються в момент вчинення. [SRC-046] Зміна договору вчиняється в **тій самій формі**, що й сам договір. [SRC-054]\n\n### 5. Ціна і строк: що буде, якщо не написати\n\n| Умова | Якщо в договорі немає |\n|---|---|\n| Ціна | визначається за звичайними цінами на аналогічні товари, роботи чи послуги [SRC-058] |\n| Строк оплати товару | покупець зобовʼязаний оплатити **після прийняття** товару [SRC-061] |\n| Строк договору найму | договір вважається укладеним на невизначений строк [SRC-060] |\n| Розмір відповідальності за прострочення грошей | індекс інфляції та три проценти річних [SRC-059] |\n\nДві норми про ціну, які варто памʼятати точно: зміна ціни після укладення договору допускається **лише** у випадках і на умовах, встановлених договором або законом; зміна ціни після виконання договору **не допускається** взагалі. [SRC-058]\n\n> [!REMEMBER]\n> «Передоплата» — це умова, яку треба написати. За замовчуванням покупець платить **після** прийняття товару. [SRC-061] Якщо в договорі встановлено обовʼязок попередньої оплати, а покупець її не здійснив, продавець має право зупинити виконання свого зобовʼязання. [SRC-061]\n\nСтрок договору — це час, протягом якого сторони можуть здійснити права й виконати обовʼязки. [SRC-058] Дві деталі: сторони можуть встановити, що умови договору застосовуються до відносин, які виникли **до** його укладення; закінчення строку договору **не звільняє** сторони від відповідальності за порушення, що сталося під час його дії. [SRC-058]\n\n### 6. Що станеться при простроченні оплати\n\nЦе головне практичне питання бухгалтера до будь-якого договору.\n\nПорушенням зобовʼязання є його невиконання або виконання з порушенням умов. [SRC-059] Наслідки: припинення зобовʼязання односторонньою відмовою або розірвання договору, зміна умов, сплата неустойки, відшкодування збитків і моральної шкоди. [SRC-059]\n\nДалі — норма, яка працює **навіть якщо про відповідальність у договорі не написано нічого**:\n\n> Боржник, який прострочив виконання грошового зобовʼязання, на вимогу кредитора зобовʼязаний сплатити суму боргу з урахуванням встановленого індексу інфляції за весь час прострочення, а також **три проценти річних** від простроченої суми, якщо інший розмір процентів не встановлений договором або законом. [SRC-059]\n\nТри речі, які з цього випливають:\n\n- це працює **на вимогу кредитора**, а не автоматично: суму треба порахувати й заявити;\n- договором можна встановити **інший** розмір процентів — і більший, і менший;\n- боржник **не звільняється** від відповідальності за неможливість виконання грошового зобовʼязання: «немає грошей» не є підставою. [SRC-059]\n\nОкремо про збитки: боржник, який порушив зобовʼязання, має відшкодувати завдані збитки, але **розмір збитків доказує кредитор**. [SRC-059] Це не те саме, що неустойка: неустойку рахують за формулою з договору, збитки треба довести.\n\n### 7. Коли договір продовжується сам\n\nТри різні механізми, які плутають між собою.\n\n**Оренда (найм).** Якщо наймач продовжує володіти або користуватися майном після закінчення строку договору, то за відсутності заперечень наймодавця **протягом одного місяця** договір вважається поновленим на строк, який був раніше встановлений договором. [SRC-060] Тобто мовчання наймодавця протягом місяця продовжує договір.\n\n**Безстроковий найм.** Якщо строк не встановлений, договір вважається укладеним на невизначений строк, і кожна сторона може відмовитися від нього будь-коли, письмово попередивши за **один місяць**, а для нерухомого майна — за **три місяці**; договором або законом може бути встановлений інший строк попередження. [SRC-060]\n\n**Умова про автопродовження в самому договорі.** Це домовленість сторін, а не норма. Її наслідки визначає текст договору.\n\n> [!RISK]\n> Найпоширеніша помилка: вважати, що договір оренди «просто закінчився». Якщо ви продовжуєте користуватися приміщенням і орендодавець місяць мовчить, договір поновлено на попередній строк — з усіма платежами. [SRC-060]\n\n### 8. Зміна й розірвання договору\n\nЗміна або розірвання допускається **лише за згодою сторін**, якщо інше не встановлено договором або законом. [SRC-058] За рішенням суду на вимогу однієї сторони — у разі **істотного порушення** договору другою стороною та в інших випадках, встановлених договором або законом. [SRC-058]\n\nІстотним є таке порушення, коли внаслідок завданої шкоди друга сторона значною мірою позбавляється того, на що розраховувала при укладенні договору. [SRC-058]\n\nНаслідки: при зміні договору зобовʼязання змінюються відповідно до нових умов, при розірванні — припиняються; зміна або припинення настає з моменту домовленості, а якщо договір змінюється чи розривається в судовому порядку — з моменту набрання рішенням суду законної сили. [SRC-058]\n\n### 9. Три види договорів, з якими ФОП стикається найчастіше\n\n| Вид | Що робить сторона | Ключова норма |\n|---|---|---|\n| Про надання послуг | виконавець надає послугу, яка споживається в процесі дії | оплата в розмірі, строки й порядку з договору [SRC-054] |\n| Підряд | підрядник передає **результат** роботи | замовник зобовʼязаний прийняти й оглянути роботу [SRC-054] |\n| Поставка | продавець-підприємець передає товар для використання в підприємницькій діяльності | оплата після прийняття, якщо не встановлено інше [SRC-061] |\n| Найм (оренда) | наймодавець передає майно в користування за плату | плата встановлюється договором; форма — грошова або натуральна [SRC-060] |\n\nДо договору поставки застосовуються загальні положення про купівлю-продаж, якщо інше не встановлено договором або не випливає з характеру відносин. [SRC-061]\n\n> [!INFO]\n> Плата за найм може вноситися **в грошовій або натуральній формі** за вибором сторін. [SRC-060] Але для платника єдиного податку натуральна форма — це негрошовий розрахунок з усіма наслідками з модуля 3. Норма цивільного права дозволяє, податкова — карає.\n\n### 10. Зовнішньоекономічний договір\n\nЗовнішньоекономічний договір укладається субʼєктом ЗЕД або його представником **у простій письмовій або в електронній формі**, якщо інше не передбачено міжнародним договором України чи законом. [SRC-062]\n\nНорма, яка прямо стосується ФОП-фрилансерів: при **експорті послуг** (крім транспортних) договір може укладатися шляхом прийняття публічної оферти, обміну електронними повідомленнями або **виставлення рахунка (інвойсу)**, у тому числі в електронному вигляді. [SRC-062] Тобто окремий підписаний контракт для експорту послуг не завжди потрібен.\n\nДля підписання зовнішньоекономічного договору дозвіл будь-якого органу державної влади не потрібен, крім випадків, передбачених законами. [SRC-062]\n\n**Строк розрахунків.** НБУ має право встановлювати граничні строки розрахунків за операціями з експорту та імпорту товарів. [SRC-063] Чинний граничний строк — **365 календарних днів**. [SRC-064]\n\nМомент, з якого рахують строк: [SRC-063]\n\n- при експорті товарів — з дня митного оформлення;\n- при експорті робіт, послуг, прав інтелектуальної власності — з дня оформлення **акта, рахунка (інвойсу) або іншого документа**, що засвідчує їх надання;\n- при імпорті — з дня здійснення авансового платежу.\n\n> [!REMEMBER]\n> Строк 365 днів рахують не від дати договору, а від дати документа про надання послуги або від митного оформлення. [SRC-063] Наслідки порушення строку — тема модуля 17.\n\n### 11. Перевірка контрагента до підпису\n\nОбовʼязкової процедури перевірки закон не встановлює: це професійна практика. Але всі джерела для неї — офіційні й безоплатні.\n\n| Що перевірити | Де |\n|---|---|\n| Чи існує контрагент, хто підписант, чи не в стані припинення | безоплатний пошук у ЄДР [SRC-066] |\n| Реєстраційні відомості та їх зміни | ЄДР [SRC-002] |\n| Чи є контрагент платником єдиного податку і якої групи | реєстр платників єдиного податку [SRC-036] |\n| Чи є контрагент платником ПДВ | реєстр платників ПДВ [SRC-035] |\n| Чи є невиконані рішення проти нього | Єдиний реєстр боржників [SRC-065] |\n| Судова історія | Єдиний державний реєстр судових рішень [SRC-067] |\n\nВідомості про боржників, включені до Єдиного реєстру боржників, є **відкритими** і розміщуються на офіційному вебсайті Мінʼюсту. [SRC-065] Реєстрація в ньому не звільняє боржника від виконання рішення. [SRC-065]\n\n> [!PRINCIPLE]\n> Перевірка контрагента — це не недовіра, а фіксація стану на дату. Запишіть дату перевірки й що саме ви побачили: через рік це буде єдиним доказом того, що ви діяли обачно.\n\n### 12. Що бухгалтер має знайти в проєкті договору\n\nШість питань, на які треба відповісти до підпису:\n\n1. Предмет: що саме робиться, у якому обсязі.\n2. Ціна й порядок оплати: сума, строк, передоплата чи післяплата.\n3. Строк договору й дата початку.\n4. Чим підтверджується виконання: акт, накладна, інший документ.\n5. Що буде при простроченні: неустойка з договору чи стаття 625 за замовчуванням.\n6. Як договір закінчується: строк, автопродовження, порядок відмови.\n\nУсе, що виходить за межі цих шести питань — формулювання відповідальності, підстави одностороннього розірвання, підсудність, гарантії — читає юрист.\n\n## Покроковий процес\n\nЧитання проєкту договору:\n\n1. Перевірити контрагента в реєстрах і зафіксувати дату перевірки.\n2. Звірити назву й реквізити сторін із ЄДР.\n3. Знайти предмет договору й перевірити, чи він описаний конкретно.\n4. Знайти ціну й порядок оплати; якщо строку оплати немає — памʼятати правило за замовчуванням.\n5. Знайти строк договору й умову про продовження.\n6. Знайти, яким документом підтверджується виконання.\n7. Знайти умову про відповідальність за прострочення; якщо її немає — це стаття 625.\n8. Перевірити, чи немає посилань на Господарський кодекс.\n9. Виписати умови, які ви хочете зробити істотними, і заявити про них до підписання.\n10. Передати юристу все, що виходить за межі шести питань.\n\n## Практичні приклади\n\n### Приклад 1. Договір без строку оплати\n\nУ проєкті договору поставки немає строку оплати. Це не пропуск, який робить договір неукладеним: за замовчуванням покупець зобовʼязаний оплатити товар після його прийняття. [SRC-061] Але якщо вам потрібна передоплата — це треба написати, інакше правило працює проти вас.\n\n### Приклад 2. Оренда, яка не закінчилася\n\nСтрок договору оренди закінчився 31 серпня, підприємець продовжив користуватися приміщенням, орендодавець мовчав. 1 жовтня договір вважається поновленим на попередній строк. [SRC-060] Орендна плата нараховується далі.\n\n### Приклад 3. Інвойс замість контракту\n\nФОП надає послуги іноземному замовнику й виставляє інвойс без окремого підписаного контракту. Для експорту послуг це допустимий спосіб укладення зовнішньоекономічного договору. [SRC-062] Строк розрахунків при цьому рахують від дати документа про надання послуги. [SRC-063]\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Брати істотні умови з Господарського кодексу | Кодекс втратив чинність 28.08.2025 [SRC-057] | читати статтю 638 ЦКУ |\n| Вважати, що істотних умов рівно три | закон називає три **джерела** умов, а не три пункти [SRC-058] | перевіряти всі три джерела |\n| Вважати, що без умови про відповідальність нічого не буде | працює стаття 625: інфляційні і 3% річних [SRC-059] | рахувати й заявляти вимогу |\n| Чекати, що інфляційні нарахують самі | норма діє **на вимогу кредитора** [SRC-059] | порахувати суму й пред'явити |\n| Вважати, що оплата за замовчуванням — передоплата | покупець платить після прийняття товару [SRC-061] | писати передоплату в договорі |\n| Вважати, що оренда закінчилася зі строком | мовчання місяць поновлює договір [SRC-060] | письмово повідомити про припинення |\n| Вважати відповідь «згодні, але змінимо строк» акцептом | акцепт має бути повним і безумовним [SRC-058] | оформити зустрічну пропозицію |\n| Змінювати ціну після виконання договору | це прямо не допускається [SRC-058] | узгоджувати ціну до виконання |\n| Вважати, що для експорту послуг потрібен підписаний контракт | допускається інвойс, оферта, обмін повідомленнями [SRC-062] | обрати спосіб під ситуацію |\n| Рахувати 365 днів від дати договору | строк рахують від акта, інвойсу або митного оформлення [SRC-063] | брати дату документа про надання |\n\n## Ризики й межі самостійних дій\n\n- **Модуль не робить вас юристом.** Він вчить читати чужий проєкт і ставити правильні питання, а не складати договори.\n- Модуль не наводить шаблонів і не пропонує формулювань умов.\n- Наслідки скасування Господарського кодексу для договорів, укладених до 28.08.2025 з посиланнями на його статті, у модулі не визначаються — це питання юриста. [SRC-057]\n- Валютний нагляд, відповідальність за порушення строку розрахунків і пеня — модуль 17.\n- Трудовий договір і відносини з працівниками — модуль 14.\n- Податкові наслідки конкретної операції за договором — модулі 11 і 15.\n- Перелік перевірок контрагента — професійна практика, а не встановлена законом процедура.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, щоб оцінити податкові наслідки умов оплати, перевірити, чи узгоджується форма розрахунків із системою оподаткування, і побудувати документообіг під договір.\n\n**Юрист потрібен** у шести випадках: договір містить посилання на Господарський кодекс; ви хочете розірвати договір в односторонньому порядку; контрагент заявляє про істотне порушення з вашого боку; у договорі є умови про підсудність, гарантії або обмеження відповідальності; ви укладаєте зовнішньоекономічний договір із нетиповими умовами; сума договору для вас критична.\n\n## Підсумок\n\nДоговір — це не формальність перед оплатою, а джерело зобовʼязань. Після скасування Господарського кодексу всі договори ФОП живуть за Цивільним, і істотні умови треба шукати в статті 638, а не в памʼяті. Більшість правил Кодексу працює **за замовчуванням**: оплата після прийняття, поновлення оренди мовчанням, три проценти річних за прострочення. Тому головне питання до кожного пункту договору — не «що тут написано», а «що буде, якщо цього не написати».\n\n## Самоперевірка\n\n1. Коли Господарський кодекс втратив чинність і що це змінює для ФОП?\n2. Назвіть три джерела істотних умов договору.\n3. Чи може одна сторона зробити умову істотною?\n4. Коли дія сторони є акцептом?\n5. Що буде при простроченні оплати, якщо про відповідальність у договорі не написано?\n6. Хто доводить розмір збитків?\n7. За яких умов договір оренди поновлюється сам?\n8. Коли покупець зобовʼязаний оплатити товар, якщо строк не встановлено?\n9. Якими способами можна укласти зовнішньоекономічний договір при експорті послуг?\n10. Від якої дати рахують граничний строк розрахунків за експортом послуг?\n\n## Джерела\n\nПерелік джерел і твердження, які вони підтверджують, — у `references.md`. Використані ідентифікатори: SRC-002, SRC-035, SRC-036, SRC-046, SRC-054, SRC-057, SRC-058, SRC-059, SRC-060, SRC-061, SRC-062, SRC-063, SRC-064, SRC-065, SRC-066, SRC-067.\n\n## Дата перевірки актуальності\n\nДата перевірки актуальності: **2026-09-06**\nНаступна перевірка: **2026-11-01**"}, {"id": "practice", "title": "Практика", "content": "# Практика: читання проєкту договору\n\n## Мета\n\nНавчитися відповідати на шість питань бухгалтера за чужим проєктом договору й бачити, що спрацює за замовчуванням там, де сторони нічого не написали.\n\n## Навчальна ситуація\n\nДані синтетичні. Не використовуйте реальні відомості про себе чи клієнтів.\n\n**ФОП Гриценко Андрій Сергійович** отримав від ТОВ «Кварта» проєкт договору про надання послуг. Скорочений зміст:\n\n| Пункт | Текст у проєкті |\n|---|---|\n| 1.1 | «Виконавець зобовʼязується надавати послуги з технічної підтримки згідно з заявками Замовника» |\n| 2.1 | «Вартість послуг — 18 000 грн на місяць» |\n| 2.2 | строку оплати немає |\n| 3.1 | «Договір діє до 31.12.2026» |\n| 3.2 | «У разі якщо жодна зі сторін не заявила про припинення за 30 днів до закінчення строку, договір вважається продовженим на один рік» |\n| 4.1 | «Підтвердженням надання послуг є акт, який підписується сторонами щомісяця» |\n| 5.1 | умови про відповідальність за прострочення оплати немає |\n| 6.1 | «Сторони керуються Цивільним кодексом України та Господарським кодексом України» |\n| 7.1 | «Усі спори вирішуються шляхом переговорів, а в разі недосягнення згоди — у судовому порядку» |\n\nДовідково: Замовник — товариство на загальній системі; підприємець перебуває на третій групі єдиного податку.\n\n## Завдання 1. Оцініть пункти\n\nДля кожного пункту дайте короткий висновок і вкажіть джерело. Використовуйте короткі відповіді:\n\n- **істотна** — умова про предмет договору;\n- **закон** — сторони не написали, спрацює правило за замовчуванням;\n- **домовленість** — умова діє так, як написали сторони;\n- **застаріле** — посилання на акт, що втратив чинність;\n- **звичайне** — виглядає загрозливо, але є звичайним формулюванням.\n\n## Завдання 2. Дайте відповідь на три питання за замовчуванням\n\n1. Коли Замовник має оплатити послуги, якщо строку оплати в договорі немає?\n2. Скільки процентів річних нараховується за прострочення грошового зобовʼязання, якщо договір мовчить?\n3. Що ще, крім процентів, може вимагати кредитор за час прострочення?\n\n## Завдання 3. Знайдіть те, чого не можна визначити\n\nОдне питання за наданими даними вирішити неможливо: воно виходить за межі компетенції бухгалтера. Позначте його як таке, що потребує окремої перевірки, і не вигадуйте відповідь.\n\n## Критерії виконання\n\n- кожен пункт має висновок із зазначеним джерелом;\n- правила за замовчуванням відокремлені від домовленостей сторін;\n- застаріле посилання знайдено;\n- питання, що належить юристу, не заповнене припущенням."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Договір із минулого року»\n\n## Ситуація\n\nНаталя — ФОП третьої групи, обслуговує обладнання. Договір із ТОВ «Промлінія» підписано в травні 2025 року й відтоді не переглядали.\n\nЩо зʼясувалося в жовтні:\n\n- у договорі є посилання на статті Господарського кодексу України;\n- строку оплати немає — за фактом Замовник платив «коли міг»;\n- останній рахунок не оплачено вже пʼятий тиждень, Наталя нічого не нараховувала;\n- у договорі немає жодного слова про відповідальність за прострочення, і Наталя вважає, що вимагати нічого не може;\n- договір оренди складу закінчився 31 серпня, Наталя користується складом далі, орендодавець мовчить;\n- Замовник запропонував закрити частину боргу своїм обладнанням;\n- у договорі написано «спори вирішуються шляхом переговорів, а в разі недосягнення згоди — у судовому порядку», і Наталя вважає це пасткою;\n- Наталя жодного разу не перевіряла Замовника в реєстрах.\n\nДані синтетичні.\n\n## Завдання\n\n1. Знайдіть справжні ризики й відокремте їх від того, що лише виглядає проблемою.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Побудуйте безпечну послідовність дій.\n4. Поясніть, чому відсутність умови про відповідальність не позбавляє Наталю вимоги за прострочення.\n\n## Орієнтир для самоперевірки\n\n- за прострочення грошового зобовʼязання кредитор може вимагати суму боргу з урахуванням індексу інфляції та три проценти річних, якщо інший розмір не встановлений договором;\n- ця вимога працює **на вимогу кредитора**: суму треба порахувати й заявити, сама вона не нарахується;\n- посилання на скасований кодекс не є питанням бухгалтера — його оцінює юрист;\n- користування складом після закінчення строку за мовчання орендодавця протягом місяця поновлює договір оренди;\n- закриття боргу обладнанням для платника єдиного податку — негрошовий розрахунок з наслідками з модуля 3;\n- формулювання про переговори й суд не забирає жодного права і пасткою не є;\n- перевірка контрагента в реєстрах — практика, яка фіксує стан на дату.\n\nЦе навчальний кейс, а не індивідуальна юридична консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст «Перед підписом»\n\n## Контрагент\n\n- [ ] Контрагента знайдено в ЄДР; стан — не «в стані припинення».\n- [ ] Назва й реквізити в проєкті договору збігаються з ЄДР.\n- [ ] Перевірено, хто має право підпису й на якій підставі.\n- [ ] Перевірено податковий статус контрагента в реєстрі платників.\n- [ ] Перевірено наявність невиконаних рішень і судову історію.\n- [ ] Зафіксовано дату перевірки й те, що саме було видно.\n\n## Шість питань до тексту\n\n- [ ] Предмет описано конкретно: що робиться і в якому обсязі.\n- [ ] Ціна й порядок оплати зрозумілі; строк оплати названо.\n- [ ] Строк договору й дата початку встановлені.\n- [ ] Названо документ, яким підтверджується виконання.\n- [ ] Зрозуміло, що буде при простроченні оплати.\n- [ ] Зрозуміло, як договір закінчується й чи продовжується сам.\n\n## Що спрацює за замовчуванням\n\n- [ ] Перевірено, які умови сторони не написали й що замість них скаже закон.\n- [ ] Умови, які ви хочете зробити істотними, заявлено до підписання.\n- [ ] Перевірено, що форма розрахунків узгоджується з вашою системою оподаткування.\n\n## Чого не має бути\n\n- [ ] У тексті немає посилань на Господарський кодекс як на чинний акт.\n- [ ] Немає умов, які виходять за межі шести питань і не показані юристу.\n- [ ] Немає розбіжності між договором і фактичним порядком роботи.\n\n## Фіксація\n\n- [ ] Збережено остаточну версію проєкту, на яку ви погодилися.\n- [ ] Зафіксовано, які зміни ви просили внести і що з них враховано.\n- [ ] Визначено, хто в подальшому стежить за строками за цим договором."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 6\n\n**Договір** — домовленість двох або більше сторін, спрямована на встановлення, зміну або припинення цивільних прав та обовʼязків.\n\n**Свобода договору** — право сторін вільно обирати контрагента й визначати умови з урахуванням вимог законодавства, звичаїв ділового обороту, розумності та справедливості.\n\n**Зміст договору** — умови, погоджені сторонами, **та** умови, обовʼязкові за актами цивільного законодавства.\n\n**Істотні умови** — умови, без згоди щодо яких договір не є укладеним: предмет; умови, визначені законом як істотні або необхідні для цього виду договору; усі умови, щодо яких за заявою хоча б однієї сторони має бути досягнуто згоди.\n\n**Оферта** — пропозиція однієї сторони укласти договір.\n\n**Акцепт** — прийняття пропозиції; має бути повним і безумовним. Дія за умовами пропозиції (відвантаження, оплата, надання послуги) також є акцептом.\n\n**Змішаний договір** — договір з елементами різних договорів; до кожної частини застосовуються положення про відповідний вид.\n\n**Строк договору** — час, протягом якого сторони можуть здійснити права й виконати обовʼязки. Його закінчення не звільняє від відповідальності за порушення під час дії договору.\n\n**Ціна договору** — встановлюється за домовленістю сторін; зміна ціни після виконання договору не допускається.\n\n**Порушення зобовʼязання** — невиконання зобовʼязання або виконання з порушенням його умов.\n\n**Неустойка** — визначена договором або законом сума, яку боржник сплачує за порушення; рахується за формулою, доводити розмір не потрібно.\n\n**Збитки** — втрати кредитора, спричинені порушенням; їх розмір доводить сам кредитор.\n\n**Три проценти річних** — розмір відповідальності за прострочення грошового зобовʼязання за замовчуванням; діє разом із індексом інфляції, якщо договором не встановлено інший розмір.\n\n**Істотне порушення договору** — порушення, через яке друга сторона значною мірою позбавляється того, на що розраховувала при укладенні; підстава для розірвання договору судом.\n\n**Поновлення договору найму** — продовження договору оренди на попередній строк, якщо наймач далі користується майном, а наймодавець не заперечив протягом місяця.\n\n**Договір поставки** — договір, за яким продавець-підприємець передає товар покупцеві для використання в підприємницькій діяльності.\n\n**Зовнішньоекономічний договір** — договір субʼєкта ЗЕД, що укладається в простій письмовій або електронній формі; при експорті послуг допускається оферта, обмін повідомленнями або виставлення інвойсу.\n\n**Граничний строк розрахунків** — строк, у який мають надійти кошти за експортом або товар за імпортом; наразі 365 календарних днів."}, {"id": "reference", "title": "Пам’ятка", "content": "# Памʼятка: читання договору\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-09-06**\n\n## Головне за 2025 рік\n\n**Господарський кодекс втратив чинність 28.08.2025.** Категорії «господарський договір» немає; істотні умови беруться з Цивільного кодексу. Посилання на ГКУ в тексті — сигнал показати договір юристу.\n\n## Три джерела істотних умов\n\n1. Предмет договору.\n2. Умови, визначені законом як істотні або необхідні для цього виду договору.\n3. Усі умови, щодо яких **за заявою хоча б однієї сторони** має бути досягнуто згоди.\n\nТретє джерело працює лише **до** підписання: заявляйте вчасно.\n\n## Шість питань бухгалтера до проєкту\n\n1. Предмет: що робиться і в якому обсязі.\n2. Ціна, порядок і строк оплати.\n3. Строк договору й дата початку.\n4. Документ, що підтверджує виконання.\n5. Що буде при простроченні.\n6. Як договір закінчується й чи продовжується сам.\n\nУсе інше — відповідальність, підсудність, гарантії, одностороннє розірвання — читає юрист.\n\n## Що спрацює, якщо не написати\n\n| Не написали | Спрацює |\n|---|---|\n| ціну | звичайні ціни на аналогічні товари, роботи, послуги |\n| строк оплати товару | оплата **після прийняття** |\n| строк договору найму | договір на невизначений строк |\n| відповідальність за прострочення | індекс інфляції + **3% річних** |\n\nМайже кожне правило Кодексу починається з «якщо інше не встановлено договором».\n\n## Прострочення оплати\n\n- вимога = сума боргу × індекс інфляції + 3% річних;\n- договором можна встановити **інший** розмір процентів;\n- норма діє **на вимогу кредитора**: порахуйте й заявіть;\n- «немає грошей» від відповідальності не звільняє;\n- **збитки доводить кредитор**, неустойку — рахують за формулою.\n\n## Продовження й припинення\n\n- **оренда:** користуєтеся далі + наймодавець мовчить місяць → договір поновлено на попередній строк;\n- **безстроковий найм:** відмова з попередженням за 1 місяць, для нерухомості — за 3;\n- **автопродовження в тексті** — це домовленість, а не норма;\n- **розірвання судом** — лише при істотному порушенні: сторона значною мірою позбавляється очікуваного.\n\n## Акцепт\n\nПрийняття має бути **повним і безумовним**. «Згодні, але змінимо строк» — зустрічна пропозиція, а не акцепт. Дія за умовами пропозиції (оплата, відвантаження, надання послуги) акцептом є.\n\n## ЗЕД\n\n- форма: проста письмова або електронна;\n- **експорт послуг** (крім транспортних) можна оформити офертою, обміном повідомленнями або **інвойсом**;\n- дозвіл держоргану не потрібен;\n- граничний строк розрахунків — **365 календарних днів**;\n- відлік: товари — з митного оформлення; послуги — з дати акта або інвойсу; імпорт — з авансового платежу.\n\n## Перевірка контрагента до підпису\n\nЄДР (існування, стан, підписант) · реєстр платників єдиного податку · реєстр платників ПДВ · Єдиний реєстр боржників · реєстр судових рішень.\n\nЗапишіть **дату перевірки** й що саме побачили."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 6\n\nПеревірено: **2026-09-06**. Кожна норма звірена з повним текстом на `zakon.rada.gov.ua` (сторінка «Текст для друку»). Наступна перевірка: **2026-11-01**.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Господарський кодекс України втратив чинність з 28.08.2025 | SRC-057, пункт 3 Прикінцевих положень | Норма закону | Категорії «господарський договір» більше немає |\n| Договір — домовленість сторін про встановлення, зміну або припинення прав та обовʼязків | SRC-058, стаття 626 | Норма закону | Односторонній, двосторонній, багатосторонній |\n| Свобода договору обмежена законом, звичаями, розумністю й справедливістю | SRC-058, стаття 627 | Норма закону | Свобода не безмежна |\n| Зміст договору — умови сторін **і** умови, обовʼязкові за законодавством | SRC-058, стаття 628 | Норма закону | Там само — змішаний договір |\n| Договір є обовʼязковим для виконання сторонами | SRC-058, стаття 629 | Норма закону | — |\n| Строк договору; закінчення строку не звільняє від відповідальності | SRC-058, стаття 631 | Норма закону | Умови можуть поширюватися на відносини до укладення |\n| Ціна встановлюється за домовленістю; після виконання не змінюється | SRC-058, стаття 632 | Норма закону | Без ціни діють звичайні ціни |\n| Три джерела істотних умов договору | SRC-058, стаття 638 | Норма закону | Третє — заява сторони; замінює перелік зі скасованого ГКУ |\n| Форма договору; договір через інформаційно-комунікаційні системи є письмовим | SRC-058, стаття 639 | Норма закону | Разом зі статтями 205–208 ЦКУ |\n| Акцепт має бути повним і безумовним; дія за умовами оферти є акцептом | SRC-058, статті 641 і 642 | Норма закону | Тому оплачений рахунок працює як договір |\n| Зміна й розірвання договору: згода сторін або істотне порушення | SRC-058, стаття 651 | Норма закону | Визначення істотного порушення — там само |\n| Наслідки зміни й розірвання договору та момент їх настання | SRC-058, стаття 653 | Норма закону | При судовому розірванні — з набрання рішенням сили |\n| Зміна договору вчиняється в тій самій формі, що й договір | SRC-054, стаття 654 | Норма закону | Матеріал модуля 5 |\n| Порушення зобовʼязання та його правові наслідки | SRC-059, статті 610 і 611 | Норма закону | Неустойка, збитки, розірвання, зміна умов |\n| Розмір збитків доводить кредитор | SRC-059, стаття 623 | Норма закону | Відмінність від неустойки |\n| Індекс інфляції та три проценти річних за прострочення грошового зобовʼязання | SRC-059, стаття 625 | Норма закону | Діє **на вимогу кредитора**, якщо договором не встановлено інший розмір |\n| Плата за найм: розмір за договором, форма грошова або натуральна | SRC-060, стаття 762 | Норма закону | Натуральна форма конфліктує з вимогами до єдинника |\n| Строк договору найму; відмова від безстрокового за 1 або 3 місяці | SRC-060, стаття 763 | Норма закону | Три місяці — для нерухомого майна |\n| Поновлення договору найму за мовчання наймодавця протягом місяця | SRC-060, стаття 764 | Норма закону | На строк, раніше встановлений договором |\n| Оплата товару після прийняття, якщо інше не встановлено | SRC-061, стаття 692 | Норма закону | Передоплату треба писати окремо |\n| Попередня оплата та наслідки її невиконання | SRC-061, стаття 693 | Норма закону | Продавець може зупинити виконання |\n| Договір поставки; застосовуються загальні положення про купівлю-продаж | SRC-061, стаття 712 | Норма закону | — |\n| Договір про надання послуг і договір підряду: різні предмети | SRC-054, статті 853 і 901–903 | Норма закону | Матеріал модуля 5 |\n| Форма зовнішньоекономічного договору; інвойс при експорті послуг | SRC-062, стаття 6 | Норма закону | Виняток не поширюється на транспортні послуги |\n| Дозвіл держоргану для підписання ЗЕД-договору не потрібен | SRC-062, стаття 6 | Норма закону | Крім випадків, передбачених законами |\n| НБУ встановлює граничні строки розрахунків за експортом та імпортом | SRC-063, стаття 13 | Норма закону | Разом із моментом початку відліку |\n| Граничний строк розрахунків — 365 календарних днів | SRC-064, пункт 21 | Норма підзаконного акта | Змінна величина: перевірка кожні 90 днів |\n| Відомості Єдиного реєстру боржників відкриті | SRC-065, стаття 9 | Норма закону | Реєстрація не звільняє від виконання рішення |\n| Безоплатний пошук у ЄДР | SRC-066 | Вебсервіс державного органу | Перевірка існування, стану й підписанта |\n| Оприлюднені судові рішення | SRC-067 | Вебсервіс державного органу | Судова історія контрагента |\n| Реєстраційні відомості про контрагента | SRC-002 | Норма закону | Підстава відкритості даних ЄДР |\n| Реєстр платників єдиного податку й реєстр платників ПДВ | SRC-036, SRC-035 | Норма закону | Матеріал модуля 3 |\n| Письмова форма правочину, зокрема електронна | SRC-046, статті 205 і 207 | Норма закону | Матеріал модуля 4 |\n\n## Межі перевірки\n\n- **Доля договорів, укладених до 28.08.2025 з посиланнями на Господарський кодекс,** у модулі не визначається. Констатується лише факт скасування кодексу; наслідки для конкретного договору оцінює юрист. Це головне питання на юридичну перевірку.\n- **Модуль не пропонує формулювань** умов договору й не містить шаблонів. Він вчить читати чужий проєкт і ставити правильні питання.\n- **Перелік перевірок контрагента — професійна практика, а не норма.** Жоден акт не встановлює обовʼязкової процедури перевірки перед укладенням договору; усі названі джерела офіційні та безоплатні.\n- **Граничний строк розрахунків — змінна величина.** 365 календарних днів встановлено постановою НБУ, яка змінювалася під час воєнного стану; `next_review` для цього джерела — 90 днів. Наслідки порушення строку в модулі не розглядаються: це модуль 17.\n- **Трудовий договір** і відносини з найманими працівниками — модуль 14; податкові наслідки конкретних умов договору — модулі 11 і 15.\n- **Спори, претензійна робота й судовий процес** у модулі не описуються: модуль 22."}], "quiz": [{"id": "m06-q01", "title": "Джерело істотних умов", "competency": "contract_essential_terms", "scenario": "Бухгалтер шукає перелік істотних умов для договору про надання послуг із товариством.", "question": "Звідки сьогодні береться цей перелік?", "options": [{"text": "Зі статті 180 Господарського кодексу: предмет, ціна і строк договору", "feedback": "Ні. Цей кодекс втратив чинність, тому його перелік більше не застосовується."}, {"text": "З Цивільного кодексу, який називає три різні джерела істотних умов", "correct": true, "feedback": "Правильно. Предмет, вимоги закону для цього виду й заява сторони."}, {"text": "З типової форми договору, затвердженої для відповідного виду послуг", "feedback": "Ні. Типових форм для більшості договорів ФОП не існує взагалі."}], "explanation": "Господарський кодекс втратив чинність 28 серпня 2025 року. Істотними є умови про предмет договору, умови, визначені законом як істотні або необхідні для договорів даного виду, а також усі умови, щодо яких за заявою хоча б однієї сторони має бути досягнуто згоди.", "source_reference": ["SRC-057", "SRC-058"], "hint": "Зверніть увагу, що норма перелічує не пункти договору, а способи, якими умова стає обовʼязковою."}, {"id": "m06-q02", "title": "Заява сторони", "competency": "contract_party_declaration", "scenario": "Замовник письмово повідомив: «Без узгодженої періодичності звітів договір не підписуємо».", "question": "Що це змінює для цього договору?", "options": [{"text": "Нічого: перелік істотних умов визначає закон, а не побажання сторони", "feedback": "Ні. Закон прямо називає заяву сторони одним із джерел істотних умов."}, {"text": "Замовник втратив право посилатися на інші умови як на істотні", "feedback": "Ні. Заява щодо однієї умови не обмежує сторону в решті умов договору."}, {"text": "Періодичність звітів стала істотною умовою саме цього договору", "correct": true, "feedback": "Правильно. Без згоди щодо неї договір не вважатиметься укладеним."}], "explanation": "Третє джерело істотних умов — усі ті умови, щодо яких за заявою хоча б однієї із сторін має бути досягнуто згоди. Тому сторона може зробити істотною будь-яку умову, заявивши про це до укладення договору.", "source_reference": ["SRC-058"], "hint": "Порівняйте три джерела істотних умов і подумайте, яке з них залежить від поведінки сторони."}, {"id": "m06-q03", "title": "Відповідь із правками", "competency": "contract_acceptance", "scenario": "У відповідь на проєкт договору контрагент написав: «Погоджуємося, але строк збільшимо до 30 днів».", "question": "Чи є ця відповідь прийняттям пропозиції?", "options": [{"text": "Так, оскільки контрагент прямо висловив свою згоду на укладення договору", "feedback": "Ні. Згода зі змінами не відповідає вимозі повного й безумовного прийняття."}, {"text": "Так, якщо друга сторона протягом семи днів письмово не заперечила проти правки", "feedback": "Ні. Правила мовчазної згоди на зміну умов пропозиції норма не містить."}, {"text": "Ні: акцепт має бути повним і безумовним, а це зустрічна пропозиція", "correct": true, "feedback": "Правильно. Тепер уже перша сторона вирішує, приймати цю пропозицію чи ні."}], "explanation": "Відповідь про прийняття пропозиції повинна бути повною і безумовною. Відповідь із зміненими умовами акцептом не є: вона стає новою пропозицією, яку має прийняти або відхилити друга сторона.", "source_reference": ["SRC-058"], "hint": "Зверніть увагу на два прикметники, якими норма описує належну відповідь на пропозицію."}, {"id": "m06-q04", "title": "Оплата без умови", "competency": "contract_default_payment", "scenario": "У договорі поставки строку оплати немає; продавець вважає, що покупець має платити наперед.", "question": "Коли в такому договорі виникає обовʼязок оплати?", "options": [{"text": "Після прийняття товару або товаророзпорядчих документів на нього", "correct": true, "feedback": "Правильно. Передоплата діє лише тоді, коли її встановлено договором."}, {"text": "У день відвантаження товару зі складу продавця на адресу покупця", "feedback": "Ні. Момент оплати за замовчуванням привʼязаний до прийняття, а не до відвантаження."}, {"text": "Протягом тридцяти днів з дати укладення договору поставки сторонами", "feedback": "Ні. Такого загального строку оплати норма для договору поставки не встановлює."}], "explanation": "Покупець зобовʼязаний оплатити товар після його прийняття або прийняття товаророзпорядчих документів на нього, якщо договором або актами цивільного законодавства не встановлений інший строк оплати.", "source_reference": ["SRC-061"], "hint": "Подумайте, чиї очікування має захищати норма, коли сторони самі нічого не домовилися."}, {"id": "m06-q05", "title": "Прострочення без умови", "competency": "contract_overdue_default", "scenario": "Замовник прострочив оплату акта на два місяці; розділу про відповідальність у договорі немає.", "question": "Що може заявити виконавець?", "options": [{"text": "Нічого понад суму боргу: підстав для інших вимог договір не створює", "feedback": "Ні. Ці вимоги створює сам Кодекс, а не договір, тому мовчання тексту їх не скасовує."}, {"text": "Борг з урахуванням індексу інфляції та три проценти річних від суми", "correct": true, "feedback": "Правильно. Договором можна було встановити інший розмір процентів, але не встановили."}, {"text": "Неустойку в розмірі подвійної облікової ставки Національного банку України", "feedback": "Ні. Такий розмір неустойки застосовується лише тоді, коли його встановлено договором чи законом."}], "explanation": "Боржник, який прострочив виконання грошового зобовʼязання, на вимогу кредитора зобовʼязаний сплатити суму боргу з урахуванням встановленого індексу інфляції за весь час прострочення та три проценти річних від простроченої суми, якщо інший розмір процентів не встановлений договором або законом.", "source_reference": ["SRC-059"], "hint": "Перевірте, чи потребує ця норма згадки в тексті договору, щоб почати діяти."}, {"id": "m06-q06", "title": "Хто рахує вимогу", "competency": "contract_creditor_action", "scenario": "Підприємець чекає, що банк або податкова самі нарахують інфляційні за прострочення оплати.", "question": "Чому цього не станеться?", "options": [{"text": "Бо норма діє на вимогу кредитора: суму треба порахувати й заявити", "correct": true, "feedback": "Правильно. Право існує, але без заявленої вимоги воно лишається невикористаним."}, {"text": "Бо ці суми нараховуються лише за рішенням суду про стягнення заборгованості", "feedback": "Ні. Право виникає з норми, а суд потрібен лише тоді, коли боржник не платить добровільно."}, {"text": "Бо нарахування можливе тільки після підписання сторонами акта звірки", "feedback": "Ні. Акт звірки корисний для доказування, але умовою виникнення права він не є."}], "explanation": "Норма сформульована як обовʼязок боржника «на вимогу кредитора». Ані банк, ані контролюючий орган цю суму не нарахують: її рахує і заявляє сам кредитор.", "source_reference": ["SRC-059"], "hint": "Прочитайте формулювання норми уважно: там названо, за чиєю ініціативою настає наслідок."}, {"id": "m06-q07", "title": "Оренда після строку", "competency": "contract_lease_renewal", "scenario": "Строк оренди закінчився 31 серпня, підприємець користується приміщенням, орендодавець мовчить.", "question": "Що відбувається з договором після 30 вересня?", "options": [{"text": "Він припинився, і подальше користування приміщенням є безпідставним", "feedback": "Ні. Норма прямо передбачає поновлення договору за відсутності заперечень."}, {"text": "Він поновлюється на строк, який був раніше встановлений договором", "correct": true, "feedback": "Правильно. Орендна плата за поновлений строк нараховується далі."}, {"text": "Він продовжується щомісяця, поки одна зі сторін не заявить про припинення", "feedback": "Ні. Договір поновлюється саме на попередній строк, а не помісячно."}], "explanation": "Якщо наймач продовжує володіти або користуватися майном після закінчення строку договору найму, то за відсутності заперечень наймодавця протягом одного місяця договір вважається поновленим на строк, який був раніше встановлений договором.", "source_reference": ["SRC-060"], "hint": "Зверніть увагу на строк, протягом якого має заперечити друга сторона, і на наслідок її мовчання."}, {"id": "m06-q08", "title": "Розірвання договору", "competency": "contract_termination", "scenario": "Контрагент систематично зриває строки, і підприємець хоче розірвати договір без його згоди.", "question": "За якої умови це можливо через суд?", "options": [{"text": "Якщо порушення є істотним: сторона значною мірою позбавляється очікуваного", "correct": true, "feedback": "Правильно. Оцінка істотності спирається на наслідки, а не на кількість порушень."}, {"text": "Якщо порушення повторювалося щонайменше тричі протягом строку договору", "feedback": "Ні. Кількісного критерію на кшталт трьох порушень норма не встановлює."}, {"text": "Якщо друга сторона письмово визнала факт допущеного нею порушення умов", "feedback": "Ні. За наявності визнання й згоди договір розривають за домовленістю, без суду."}], "explanation": "Зміна або розірвання договору допускається лише за згодою сторін, якщо інше не встановлено договором або законом. За рішенням суду договір може бути змінено або розірвано на вимогу однієї сторони у разі істотного порушення договору другою стороною.", "source_reference": ["SRC-058"], "hint": "Ключове слово норми описує не кількість порушень, а те, чого сторона через них позбавляється."}, {"id": "m06-q09", "title": "Експорт послуг", "competency": "contract_foreign_trade", "scenario": "ФОП розробляє сайти для замовника з Німеччини й виставляє інвойс без окремого контракту.", "question": "Чи відповідає це вимогам до зовнішньоекономічного договору?", "options": [{"text": "Ні: такий договір укладається виключно як окремий підписаний сторонами документ", "feedback": "Ні. Закон називає кілька способів укладення саме для експорту послуг."}, {"text": "Ні: для роботи з нерезидентом потрібен дозвіл органу економічного розвитку", "feedback": "Ні. Дозвіл органу державної влади для підписання такого договору не потрібен."}, {"text": "Так: при експорті послуг допускається виставлення рахунка-інвойсу", "correct": true, "feedback": "Правильно. Виняток не поширюється на транспортні послуги й на експорт товарів."}], "explanation": "Зовнішньоекономічний договір укладається в простій письмовій або в електронній формі. У разі експорту послуг, крім транспортних, він може укладатися шляхом прийняття публічної оферти, обміну електронними повідомленнями або виставлення рахунка (інвойсу), у тому числі в електронному вигляді.", "source_reference": ["SRC-062"], "hint": "Норма робить окреме послаблення для одного виду операцій — перевірте, для якого саме."}, {"id": "m06-q10", "title": "Відлік строку розрахунків", "competency": "contract_settlement_deadline", "scenario": "Договір з іноземним замовником підписано в березні, акт про надання послуг оформлено в липні.", "question": "З якої дати рахують граничний строк розрахунків?", "options": [{"text": "З дати підписання договору, оскільки саме він створює зобовʼязання сторін", "feedback": "Ні. Норма привʼязує відлік не до договору, а до документа про надання послуг."}, {"text": "З першого числа місяця, наступного за місяцем фактичного надання послуг", "feedback": "Ні. Такого правила перенесення початку відліку норма не передбачає."}, {"text": "З дати оформлення акта, рахунка або іншого документа про надання послуг", "correct": true, "feedback": "Правильно. Для експорту товарів відлік натомість іде від митного оформлення."}], "explanation": "Строк виплати заборгованості обчислюється з дня митного оформлення продукції, що експортується, а в разі експорту робіт, послуг, прав інтелектуальної власності — з дня оформлення у письмовій формі акта, рахунка (інвойсу) або іншого документа, що засвідчує їх надання. Чинний граничний строк — 365 календарних днів.", "source_reference": ["SRC-063", "SRC-064"], "hint": "Порівняйте, які документи норма називає для товарів і які — для послуг."}], "activities": {"precheck": [{"id": "pre-gku", "question": "Як гадаєте: чи чинний зараз Господарський кодекс України?", "options": [{"text": "Так, він регулює договори між підприємцями", "correct": false}, {"text": "Ні, він втратив чинність у серпні 2025 року", "correct": true}, {"text": "Так, але лише щодо юридичних осіб", "correct": false}], "note": "Кодекс втратив чинність 28 серпня 2025 року, тому категорії «господарський договір» більше немає, а перелік істотних умов зі статті 180 не діє. Перший розділ модуля показує, що з цього випливає для ваших договорів."}, {"id": "pre-liability", "question": "У договорі немає жодного слова про відповідальність. Замовник прострочив оплату на місяць. Що можна вимагати?", "options": [{"text": "Нічого понад саму суму боргу", "correct": false}, {"text": "Борг з інфляційними та три проценти річних", "correct": true}, {"text": "Подвійну суму боргу як компенсацію", "correct": false}], "note": "Норма про відповідальність за порушення грошового зобовʼязання діє за замовчуванням: договором можна встановити інший розмір процентів, але мовчання договору права не забирає. Розділ про прострочення пояснює, як цим користуватися."}, {"id": "pre-lease", "question": "Строк договору оренди закінчився, ви користуєтеся приміщенням далі, орендодавець мовчить. Що з договором?", "options": [{"text": "Він припинився, користування безпідставне", "correct": false}, {"text": "Він поновлений на попередній строк", "correct": true}, {"text": "Він діє до першої вимоги орендодавця", "correct": false}], "note": "За відсутності заперечень наймодавця протягом одного місяця договір вважається поновленим на строк, який був раніше встановлений. Розділ про продовження договорів показує, чим це відрізняється від умови про автопродовження в тексті."}], "lesson": [{"id": "lesson-gku", "section": "Скасування Господарського кодексу", "scenario": "Контрагент надіслав шаблон із заголовком «Господарський договір» і посиланнями на статті ГКУ.", "question": "Що це говорить бухгалтеру про надісланий текст?", "options": [{"text": "Текст не переглядали після серпня 2025 року, коли цей кодекс втратив чинність", "correct": true, "feedback": "Правильно. Це сигнал перечитати проєкт уважніше, а не привід відмовлятися від угоди."}, {"text": "Договір є недійсним, тому підписувати його в такому вигляді неможливо взагалі", "feedback": "Ні. Наслідки таких посилань для конкретного договору оцінює юрист, а не бухгалтер."}, {"text": "Текст стосується лише юридичних осіб, і на договори з підприємцем він не поширюється", "feedback": "Ні. Скасований кодекс не поширюється тепер ні на кого, незалежно від сторін договору."}], "source_reference": ["SRC-057"]}, {"id": "lesson-essential", "section": "Істотні умови", "scenario": "Виконавець написав замовникові: «Без узгодженого строку оплати договір не підписуємо».", "question": "Як це впливає на перелік істотних умов цього договору?", "options": [{"text": "Ніяк: перелік істотних умов однаковий для всіх договорів того самого виду", "feedback": "Ні. Третє джерело істотних умов якраз і залежить від заяви конкретної сторони."}, {"text": "Строк оплати став істотною умовою, бо сторона заявила про потребу згоди щодо неї", "correct": true, "feedback": "Правильно. Це найменш відоме з трьох джерел істотних умов договору."}, {"text": "Ніяк: істотною умова стає лише тоді, коли її прямо називає закон або кодекс", "feedback": "Ні. Закон називає лише одне з трьох джерел; решта залежить від виду договору й заяви сторін."}], "source_reference": ["SRC-058"]}, {"id": "lesson-overdue", "section": "Прострочення оплати", "scenario": "Замовник прострочив оплату на місяць; про відповідальність у договорі немає жодного слова.", "question": "Що може вимагати виконавець?", "options": [{"text": "Лише суму боргу: без умови в договорі інших вимог не виникає взагалі", "feedback": "Ні. Норма про грошове зобовʼязання діє незалежно від того, чи згадана вона в договорі."}, {"text": "Борг з урахуванням індексу інфляції та три проценти річних від суми", "correct": true, "feedback": "Правильно. Інший розмір процентів сторони могли б встановити договором, але не встановили."}, {"text": "Подвійну суму боргу, оскільки прострочення триває понад календарний місяць", "feedback": "Ні. Правила подвоєння суми боргу за тривалість прострочення норма не містить."}], "source_reference": ["SRC-059"]}, {"id": "lesson-lease", "section": "Продовження договору", "scenario": "Строк оренди закінчився 31 серпня, орендар користується приміщенням, орендодавець мовчить.", "question": "Який стан договору на 1 жовтня?", "options": [{"text": "Договір припинився: користування після закінчення строку є безпідставним", "feedback": "Ні. Норма прямо передбачає поновлення договору за мовчання наймодавця."}, {"text": "Договір діє на невизначений строк до першої письмової вимоги наймодавця", "feedback": "Ні. На невизначений строк вважається укладеним договір, у якому строк не встановлено взагалі."}, {"text": "Договір поновлено на строк, який був раніше встановлений договором найму", "correct": true, "feedback": "Правильно. Для цього достатньо мовчання наймодавця протягом одного місяця."}], "source_reference": ["SRC-060"]}, {"id": "lesson-payment-default", "section": "Оплата за замовчуванням", "scenario": "У договорі поставки строку оплати немає, продавець розраховував на передоплату.", "question": "Коли покупець зобовʼязаний оплатити товар?", "options": [{"text": "Після прийняття товару або товаророзпорядчих документів на нього", "correct": true, "feedback": "Правильно. Саме тому передоплату треба писати в договорі окремою умовою."}, {"text": "До відвантаження товару, оскільки продавець розраховував на попередню оплату", "feedback": "Ні. Розрахунок однієї сторони не створює обовʼязку, якого немає в договорі."}, {"text": "Протягом семи днів після відвантаження товару зі складу продавця покупцеві", "feedback": "Ні. Такого загального строку норма не встановлює: момент привʼязаний до прийняття."}], "source_reference": ["SRC-061"]}, {"id": "lesson-zed", "section": "Зовнішньоекономічний договір", "scenario": "ФОП експортує послуги іноземному замовнику й виставляє йому інвойс без окремого контракту.", "question": "Чи є договір укладеним у такий спосіб?", "options": [{"text": "Ні: зовнішньоекономічний договір укладається лише як окремий підписаний документ", "feedback": "Ні. Закон прямо називає кілька способів укладення при експорті послуг."}, {"text": "Так: при експорті послуг допускається укладення виставленням рахунка-інвойсу", "correct": true, "feedback": "Правильно. Виняток не поширюється на транспортні послуги й на експорт товарів."}, {"text": "Ні: для цього потрібен окремий дозвіл органу, що реалізує економічну політику", "feedback": "Ні. Дозвіл органу державної влади для підписання такого договору не потрібен."}], "source_reference": ["SRC-062"]}], "practice": {"title": "Читання проєкту договору", "instructions": "Оцініть пункти надісланого проєкту договору й дайте відповідь на питання про правила за замовчуванням. Використовуйте лише наведені навчальні дані й короткі відповіді з інструкції.", "how_to": ["Прочитайте всі девʼять пунктів проєкту: частина з них є домовленістю сторін, частина лише повторює закон, а одне посилання застаріло.", "Для кожного пункту напишіть один із пʼяти висновків: «істотна», «закон», «домовленість», «застаріле» або «звичайне», і виберіть джерело.", "«Закон» ставте там, де сторони нічого не написали і спрацює правило за замовчуванням.", "Три питання про замовчування мають конкретні відповіді — їх треба взяти з норми, а не з памʼяті.", "Якщо питання виходить за межі компетенції бухгалтера, залиште поле порожнім і поставте позначку про потребу окремої перевірки.", "Не знаєте, з чого почати — натисніть «Підказка»: вона покаже, де шукати і якого вигляду відповідь. Бал за це не зменшується.", "Натисніть «Перевірити» і виправляйте відповіді, доки результат не досягне 80%."], "facts_title": "Синтетичний пакет: проєкт договору від ТОВ «Кварта» для ФОП третьої групи", "facts": ["Пу
