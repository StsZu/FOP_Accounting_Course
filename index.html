ір із особою, щодо якої почалося припинення, створює ризик, який дешевше побачити до підпису."}, {"id": "party_match", "group": "Контрагент", "text": "Назва й реквізити в проєкті збігаються з ЄДР", "critical": true, "hint": "Порівняйте символ у символ: назву, код і адресу. Розбіжність — це «потрібні дані», а не привід виправити самому.", "why": "Розбіжність у реквізитах ускладнює доведення того, з ким саме ви укладали договір."}, {"id": "signer", "group": "Контрагент", "text": "Перевірено, хто має право підпису й на якій підставі", "critical": true, "hint": "Підстава — статут, наказ або довіреність. Довіреність без дати вчинення нікчемна: це матеріал модуля 5.", "why": "Підпис особи без повноважень перетворює договір на предмет спору про сам факт його укладення."}, {"id": "tax_status", "group": "Контрагент", "text": "Перевірено податковий статус контрагента в реєстрі платників", "critical": false, "hint": "Подивіться, чи є контрагент платником єдиного податку і чи є він платником ПДВ. Це впливає на ціну й документи.", "why": "Статус контрагента визначає, чи будуть у ціні ПДВ і які документи ви отримаєте за операцією."}, {"id": "debts", "group": "Контрагент", "text": "Перевірено невиконані рішення й судову історію", "critical": false, "hint": "Відомості Єдиного реєстру боржників відкриті; судові рішення шукайте за назвою або кодом контрагента.", "why": "Наявність невиконаних рішень змінює умови, на які варто погоджуватися: передоплата замість післяплати."}, {"id": "check_date", "group": "Контрагент", "text": "Зафіксовано дату перевірки й те, що саме було видно", "critical": true, "hint": "Запишіть дату й короткий підсумок. «Перевіряв колись» без дати — це «потрібні дані».", "why": "Реєстри показують стан на дату; без зафіксованої дати перевірка нічого не доводить."}, {"id": "subject", "group": "Шість питань до тексту", "text": "Предмет описано конкретно: що робиться і в якому обсязі", "critical": true, "hint": "Спробуйте за текстом пункту скласти акт. Якщо не виходить назвати обсяг — предмет описано недостатньо.", "why": "Предмет є істотною умовою: без згоди щодо нього договір не вважається укладеним."}, {"id": "price_term", "group": "Шість питань до тексту", "text": "Ціна, порядок і строк оплати названі", "critical": true, "hint": "Якщо строку оплати немає, запишіть це прямо: спрацює правило за замовчуванням, і воно може вас не влаштовувати.", "why": "Без строку оплати неможливо визначити момент початку прострочення й порахувати вимогу."}, {"id": "duration", "group": "Шість питань до тексту", "text": "Строк договору й дата початку встановлені", "critical": true, "hint": "Перевірте також, чи не поширюються умови договору на відносини, які виникли до його укладення.", "why": "Строк визначає період, у якому сторони можуть здійснювати права, і момент, коли треба діяти."}, {"id": "proof_doc", "group": "Шість питань до тексту", "text": "Названо документ, яким підтверджується виконання", "critical": true, "hint": "Це матеріал модуля 5: акт, накладна або розрахунковий документ. Рахунок сюди не підходить.", "why": "Без названого документа сторони по-різному розумітимуть, коли зобовʼязання вважається виконаним."}, {"id": "default_liability", "group": "Шість питань до тексту", "text": "Зрозуміло, що буде при простроченні оплати", "critical": true, "hint": "Якщо в договорі про це нічого немає — запишіть, яка норма спрацює за замовчуванням і в якому розмірі.", "why": "Це головне практичне питання бухгалтера до договору: від нього залежить сума вимоги."}, {"id": "ending", "group": "Шість питань до тексту", "text": "Зрозуміло, як договір закінчується й чи продовжується сам", "critical": true, "hint": "Розділіть дві речі: умову про автопродовження в тексті й норму про поновлення найму мовчанням.", "why": "Договір, який продовжився непоміченим, створює платежі й зобовʼязання, яких ніхто не планував."}, {"id": "defaults", "group": "Що спрацює за замовчуванням", "text": "Перевірено, які умови не написані й що замість них скаже закон", "critical": true, "hint": "Пройдіть шістьма питаннями ще раз і для кожного пропуску запишіть норму, яка його закриває.", "why": "Більшість правил Кодексу діє «якщо інше не встановлено договором», тому мовчання теж є вибором."}, {"id": "declared_terms", "group": "Що спрацює за замовчуванням", "text": "Умови, які ви хочете зробити істотними, заявлено до підписання", "critical": false, "hint": "Сторона сама може зробити умову істотною, заявивши про це. Заява має бути до укладення, а не після.", "why": "Третє джерело істотних умов — заява сторони; після підписання скористатися ним уже неможливо."}, {"id": "settlement_form", "group": "Що спрацює за замовчуванням", "text": "Форма розрахунків узгоджується з вашою системою оподаткування", "critical": true, "hint": "Перевірте, чи немає в тексті натуральної форми оплати, заліку або бартеру. Це матеріал модуля 3.", "why": "Негрошовий розрахунок для платника єдиного податку означає підвищену ставку й підставу для переходу на загальну систему."}, {"id": "no_gku", "group": "Чого не має бути", "text": "У тексті немає посилань на Господарський кодекс як на чинний акт", "critical": true, "hint": "Пошук по тексту за словом «Господарський». Знайшли — це «потрібні дані» й питання до юриста, а не до вас.", "why": "Кодекс втратив чинність 28 серпня 2025 року; посилання на нього показує, що текст не переглядали."}, {"id": "lawyer_items", "group": "Чого не має бути", "text": "Умови поза межами шести питань показано юристу", "critical": false, "hint": "Підсудність, гарантії, обмеження відповідальності, одностороннє розірвання — це не ваша зона.", "why": "Межа компетенції має бути проведена свідомо, інакше бухгалтер погоджує те, наслідків чого не оцінює."}, {"id": "reality_match", "group": "Чого не має бути", "text": "Немає розбіжності між договором і фактичним порядком роботи", "critical": true, "hint": "Порівняйте текст із тим, як робота йде насправді: періодичність, обсяг, спосіб передавання результату.", "why": "Розбіжність між договором і фактом — типове джерело спорів і питань під час перевірки."}, {"id": "final_version", "group": "Фіксація", "text": "Збережено остаточну версію проєкту, на яку ви погодилися", "critical": true, "hint": "Збережіть саме той файл, який підписується, і запишіть, чим він відрізняється від попередньої версії.", "why": "Без збереженої версії неможливо довести, на що саме ви погоджувалися."}, {"id": "owner_of_terms", "group": "Фіксація", "text": "Визначено, хто стежить за строками за цим договором", "critical": false, "hint": "Назвіть людину й спосіб нагадування. «Памʼятатиму» без нагадування — це «потрібні дані».", "why": "Строки автопродовження й попередження про відмову спливають тихо, і згадують про них уже після факту."}]}, "glossary": [{"term": "Договір", "definition": "Домовленість двох або більше сторін, спрямована на встановлення, зміну або припинення цивільних прав та обовʼязків.", "example": "Оплачений рахунок за умовами пропозиції — теж укладений договір.", "avoid": "«папір для бухгалтерії» — договір створює зобовʼязання, а не звітність"}, {"term": "Свобода договору", "definition": "Право сторін вільно обирати контрагента й визначати умови з урахуванням вимог законодавства, звичаїв ділового обороту, розумності та справедливості.", "example": "Сторони можуть встановити будь-який строк оплати, якщо закон не вимагає іншого.", "avoid": "«можна писати будь-що» — частина умов приходить із закону незалежно від волі сторін"}, {"term": "Істотні умови", "definition": "Умови, без згоди щодо яких договір не є укладеним: предмет; умови, визначені законом як істотні або необхідні для цього виду; усі умови, щодо яких за заявою сторони має бути досягнуто згоди.", "example": "Заява «без строку оплати не підписуємо» робить строк оплати істотною умовою.", "avoid": "«предмет, ціна і строк» — це перелік зі скасованого Господарського кодексу"}, {"term": "Оферта", "definition": "Пропозиція однієї сторони укласти договір на визначених умовах.", "example": "Виставлений рахунок з описом послуги, суми й строку оплати.", "avoid": "«реклама послуг» — загальна пропозиція без умов офертою не є"}, {"term": "Акцепт", "definition": "Прийняття пропозиції, яке має бути повним і безумовним; дія за умовами пропозиції також є акцептом.", "example": "Оплата виставленого рахунку в межах строку для відповіді.", "avoid": "«згодні, але змінимо строк» — це не акцепт, а зустрічна пропозиція"}, {"term": "Змішаний договір", "definition": "Договір, що містить елементи різних договорів; до кожної частини застосовуються положення про відповідний вид.", "example": "Договір, за яким виконавець постачає обладнання і обслуговує його.", "avoid": "«універсальний договір» — до кожної частини діють свої правила"}, {"term": "Строк договору", "definition": "Час, протягом якого сторони можуть здійснити права й виконати обовʼязки за договором.", "example": "Договір діє до 31 грудня, а відповідальність за порушення в листопаді лишається після цієї дати.", "avoid": "«після закінчення нічого не винні» — строк не звільняє від відповідальності за минулі порушення"}, {"term": "Ціна договору", "definition": "Величина, що встановлюється за домовленістю сторін; у випадках, встановлених законом, застосовуються регульовані ціни.", "example": "Якщо ціни в договорі немає, вона визначається за звичайними цінами на аналогічні послуги.", "avoid": "«можна переглянути будь-коли» — зміна ціни після виконання договору не допускається"}, {"term": "Порушення зобовʼязання", "definition": "Невиконання зобовʼязання або виконання з порушенням умов, визначених його змістом.", "example": "Оплата, здійснена на пʼять тижнів пізніше встановленого строку.", "avoid": "«лише повна відмова платити» — неналежне виконання теж є порушенням"}, {"term": "Неустойка", "definition": "Визначена договором або законом сума, яку боржник сплачує за порушення зобовʼязання.", "example": "Пеня за кожен день прострочення, розмір якої встановлено договором.", "avoid": "«те саме, що збитки» — неустойку рахують, збитки доводять"}, {"term": "Збитки", "definition": "Втрати кредитора, спричинені порушенням зобовʼязання; їх розмір доводить сам кредитор.", "example": "Витрати на термінову заміну постачальника після зриву поставки.", "avoid": "«нараховуються автоматично» — без доведення розміру вимога не працює"}, {"term": "Три проценти річних", "definition": "Розмір відповідальності за прострочення грошового зобовʼязання за замовчуванням; діє разом з індексом інфляції, якщо договором не встановлено інший розмір.", "example": "Вимога до замовника за пʼять тижнів прострочення оплати за актом.", "avoid": "«працює саме собою» — норма діє на вимогу кредитора, яку треба заявити"}, {"term": "Істотне порушення договору", "definition": "Порушення, через яке друга сторона значною мірою позбавляється того, на що розраховувала при укладенні договору.", "example": "Підстава для розірвання договору судом на вимогу однієї сторони.", "avoid": "«будь-яке прострочення» — істотність оцінюється за наслідками для сторони"}, {"term": "Поновлення договору найму", "definition": "Продовження договору оренди на попередній строк, якщо наймач далі користується майном, а наймодавець не заперечив протягом одного місяця.", "example": "Користування складом у вересні після закінчення строку 31 серпня.", "avoid": "«потрібна нова угода» — поновлення настає без підписання документів"}, {"term": "Договір поставки", "definition": "Договір, за яким продавець-підприємець передає товар покупцеві для використання в підприємницькій діяльності.", "example": "Регулярне постачання комплектуючих виробничому підприємству.", "avoid": "«окремий вид з власними правилами» — застосовуються загальні положення про купівлю-продаж"}, {"term": "Зовнішньоекономічний договір", "definition": "Договір субʼєкта ЗЕД у простій письмовій або електронній формі; при експорті послуг допускається оферта, обмін електронними повідомленнями або виставлення інвойсу.", "example": "Інвойс іноземному замовнику за розробку без окремого підписаного контракту.", "avoid": "«обовʼязково паперовий контракт із печатками» — закон дозволяє інші способи"}, {"term": "Граничний строк розрахунків", "definition": "Встановлений НБУ строк, у який мають надійти кошти за експортом або товар за імпортом; наразі 365 календарних днів.", "example": "Відлік від дати інвойсу за надані іноземному замовнику послуги.", "avoid": "«рахують від дати договору» — відлік іде від документа про надання або митного оформлення"}]}}, {"index": 7, "id": "module-07", "level": 2, "slug": "module_07_elektronnyi_arkhiv", "meta": {"schema": "course-module/v1", "id": "module-07", "level": 2, "title": "Електронний архів", "language": "uk", "version": "0.1.0", "status": "app_ready", "summary": "Навчіться будувати архів, який витримує перевірку: строки зберігання й момент їх відліку, ланцюжок «банк → операція → документ», вимоги до електронного зберігання й резервних копій.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "pending", "last_verified": "2026-09-07", "next_review": "2026-11-01", "depends_on": ["module-05"], "estimated_minutes": 55, "source_ids": ["SRC-012", "SRC-039", "SRC-040", "SRC-041", "SRC-042", "SRC-043", "SRC-044", "SRC-045", "SRC-047", "SRC-051", "SRC-068", "SRC-069", "SRC-070"], "outcomes": ["Визначити строк зберігання документа й момент, з якого він рахується", "Пояснити, чому Перелік типових документів Мінʼюсту не встановлює строки для ФОП", "Побудувати ланцюжок «банківська операція → господарська операція → первинний документ»", "Назвати вимоги до зберігання електронних документів і те, що робить із ними час", "Назвати обовʼязки щодо персональних даних, які потрапляють в архів бухгалтера"], "primary_source": {"id": "SRC-012", "note": "Пункт 44.3 Податкового кодексу — прочитайте його разом із абзацом після переліку строків. Саме там сказано, з якого дня рахується строк зберігання, і саме це речення пропускають найчастіше."}, "sessions": [{"title": "Сесія 1 · Скільки зберігати і з якого дня", "minutes": 20, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Від виписки до документа", "minutes": 20, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Носії, підписи, персональні дані", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ваш архів перестане бути текою «Завантаження» — і ви знатимете, що робити в перші пʼять днів після смерті ноутбука.", "accountant": "Ви працюєте з клієнтами: модуль дає щомісячну процедуру звірки виписки з документами й критерій готовності архіву до перевірки, а не поради про акуратність.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете поставити просте питання — покажіть документ за цим платежем — і оцінити відповідь за часом, який на неї пішов."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Електронний архів\n\n## Мета\n\nНавчитися будувати архів, який витримує перевірку: знати, що і скільки зберігати, знаходити документ за банківською операцією, розуміти, чим електронне зберігання відрізняється від паперового, і не втратити доступ разом із зіпсованим ноутбуком.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. визначити строк зберігання документа й момент, з якого він рахується;\n2. пояснити, чому Перелік типових документів Мінʼюсту не встановлює строки для ФОП;\n3. побудувати ланцюжок «банківська операція → господарська операція → первинний документ»;\n4. назвати вимоги до зберігання електронних документів і те, що робить із ними час;\n5. назвати обовʼязки щодо персональних даних, які потрапляють в архів бухгалтера.\n\n## Передумови\n\nМодуль 5. Комплект документів під операцію тут стає одиницею зберігання: архів організовують не за типами паперів, а за операціями.\n\n## Основні терміни\n\n- **Строк зберігання** — період, протягом якого документ треба зберігати; для ФОП його встановлює Податковий кодекс. [SRC-012]\n- **Цілісність даних** — властивість, яка дає змогу довести, що документ після підписання не змінювали. [SRC-041]\n- **Електронна позначка часу** — дані, що повʼязують документ із конкретним моментом часу для засвідчення його наявності на цей момент. [SRC-068]\n- **Резервна копія** — копія на іншому носії, яка дозволяє відновити документ після втрати основного.\n- **Володілець персональних даних** — той, хто визначає мету обробки; він і зобовʼязаний захищати дані. [SRC-070]\n\n## Теоретичний матеріал\n\n### 1. Навіщо архів насправді\n\nНе для порядку. Для однієї норми: якщо платник не надає документи, що підтверджують показники звітності, **вважається, що таких документів у нього не було** на час складання цієї звітності. [SRC-044] Причини ненадання значення не мають, крім виїмки правоохоронними органами. [SRC-044]\n\nЗ цього випливає незручний висновок: **архів, у якому не можна швидко знайти документ, юридично не відрізняється від архіву, якого немає.** Документ, що лежить у теці «Завантаження» серед трьох тисяч файлів із назвами `scan_0043.pdf`, під час перевірки не існує.\n\nДруга норма: платник зобовʼязаний **забезпечити зберігання** документів протягом визначених строків. [SRC-012] Незабезпечення зберігання або ненадання документів контролюючому органу — штраф 1020 гривень, а за повторне протягом року порушення — 2040 гривень. [SRC-045]\n\n> [!PRINCIPLE]\n> Критерій якості архіву один: скільки часу займе знайти конкретний документ за конкретною банківською операцією через два роки. Якщо більше хвилини — архіву немає, є склад файлів.\n\n### 2. Скільки зберігати: і чому не з Переліку Мінʼюсту\n\nТут повторюється патерн модулів 4 і 5.\n\nІснує **Перелік типових документів** зі строками зберігання, затверджений наказом Мінʼюсту. Його адресати названі в самій назві: державні органи, органи місцевого самоврядування та **інші юридичні особи**. [SRC-069] ФОП серед них немає.\n\nДля ФОП строки встановлює Податковий кодекс: [SRC-012]\n\n| Строк | Кому й для чого |\n|---|---|\n| 2555 днів | документи для податкового контролю за трансфертним ціноутворенням |\n| 1825 днів | первинні документи платників податку на прибуток і **юридичних осіб** на спрощеній системі |\n| 1095 днів | **інші документи**, на які не поширюються попередні пункти |\n| 1095 днів | документи, повʼязані з виконанням іншого законодавства, контроль за яким покладено на контролюючі органи |\n\nФОП не названий ані в підпункті про 1825 днів, ані в підпункті про 2555 днів, тому до його документів застосовується строк **1095 днів**. Це висновок **методом виключення**, а не адресна норма — те саме відкрите питання, що й у модулі 2. Перед знищенням документів його варто підтвердити з бухгалтером.\n\n> [!RISK]\n> Не беріть строки з Переліку Мінʼюсту й не переносьте на ФОП строки для юридичних осіб. Перше — не ваш документ, друге — довші строки, які ви не зобовʼязані витримувати, але й коротші, яких може бракувати. [SRC-069] [SRC-012]\n\n### 3. Момент, з якого рахують строк\n\nЦе місце, де помиляються найчастіше, і помилка коштує документів.\n\nСтроки зберігання розраховуються **з дня подання податкової чи іншої звітності**, для складення якої використовуються документи, а в разі її неподання — з передбаченого Кодексом **граничного строку подання** такої звітності. [SRC-012]\n\nДля документів, повʼязаних з виконанням іншого законодавства, — з дня здійснення відповідної господарської операції; для дозвільних документів — з дня завершення строку їх дії. [SRC-012]\n\nПрактичний наслідок: акт за грудень 2026 року використовується для декларації, яку подають уже у 2027 році. Строк його зберігання починається не в грудні, а від дня подання декларації. Різниця — місяці, а іноді й більше року.\n\n> [!REMEMBER]\n> Дата документа й початок відліку строку зберігання — **різні дати**. Це четверта дата в курсі після дати складання, дати операції й дати доходу з модуля 4.\n\nОкремо: у разі ліквідації платника документи за період діяльності не менш як 1825 днів (2555 днів для документів трансфертного ціноутворення) мають бути передані в порядку, встановленому законодавством. [SRC-012] Тобто **припинення ФОП архів не скасовує** — це вже було в модулі 1.\n\n### 4. Одиниця зберігання — операція, а не тип документа\n\nНайпоширеніша структура архіву в початківця — теки «Акти», «Рахунки», «Виписки». Вона зручна, поки документів мало, і перестає працювати рівно тоді, коли починається перевірка: питання ставлять не «покажіть усі акти», а «поясніть цей платіж».\n\nТому архів організовують за **операціями**, а всередині — за періодами. Мінімальна робоча структура:\n\n| Рівень | Приклад |\n|---|---|\n| рік | `2026` |\n| місяць | `10-жовтень` |\n| файл операції | `2026-10-03_Оріон_акт-послуги-вересень.pdf` |\n| файл операції | `2026-10-03_Оріон_виписка-надходження.pdf` |\n| файл операції | `2026-10-12_Веста_накладна-запчастини.pdf` |\n\nЦе **практика, а не норма**: жоден акт не встановлює структури папок для ФОП. Але вимога до результату випливає з норми про ненадання документів. [SRC-044]\n\n### 5. Правила назв файлів\n\nТеж практика. Робочий мінімум — три елементи в назві:\n\n1. **дата у форматі РРРР-ММ-ДД** — щоб сортування за іменем збігалося з сортуванням за часом;\n2. **контрагент** — коротко й однаково в усіх файлах;\n3. **суть документа** — акт, накладна, виписка, договір.\n\nЧого уникати: пробілів на початку, кирилиці в критичних місцях, якщо файли передаються між системами, назв виду `Документ (2) копія.pdf` і дат у форматі `12.10.26` — вони сортуються неправильно й читаються по-різному в різних країнах.\n\n### 6. Ланцюжок «банк → операція → документ»\n\nЦе головна робоча навичка модуля. Кожен рядок банківської виписки має вести до документа, і навпаки.\n\n| Крок | Питання | Де відповідь |\n|---|---|---|\n| 1 | Що це за платіж | призначення платежу у виписці |\n| 2 | Яку операцію він оплачує | договір або рахунок |\n| 3 | Чим підтверджено, що операція сталася | акт, накладна, чек |\n| 4 | Де цей документ лежить | архів за періодом і контрагентом |\n\nСаме тому призначення платежу з модуля 5 — обовʼязковий реквізит, а не формальність: [SRC-051] воно є єдиною ниткою від виписки до документа. Формулювання «оплата за послуги» цю нитку рве.\n\nЗворотна перевірка так само важлива: документ без відповідного руху коштів означає або несплачену операцію, або оплату повз рахунок.\n\n> [!PRINCIPLE]\n> Раз на місяць пройдіть виписку зверху вниз і для кожного рядка назвіть файл, який його підтверджує. Те, що не назвалося, — і є ваш список запитів контрагентам.\n\n### 7. Електронне зберігання: що вимагає закон\n\nТут норм більше, ніж здається.\n\nПервинні документи й регістри, створені у формі електронного документа, повинні зберігатися **на електронних носіях у формі, що дає змогу перевірити їх цілісність**, і протягом строку, не меншого за строк для відповідних паперових документів. [SRC-040] [SRC-041]\n\nЗакон про електронні документи додає три вимоги, які зручно перевіряти як чек-лист: [SRC-041]\n\n1. інформація в документах має бути **доступною для подальшого використання**;\n2. має бути забезпечена можливість **відновити документ у тому форматі**, у якому його створено, надіслано або одержано;\n3. за наявності — зберігається інформація, яка дає змогу встановити **походження й призначення** документа, а також **дату й час** його відправлення чи одержання.\n\nДруга вимога — найнедооціненіша: формат теж старіє. Файл у форматі програми, якої більше немає, формально збережений і фактично втрачений.\n\n### 8. Резервні копії — це норма, а не акуратність\n\nЯкщо зберігати електронні документи на носіях протягом установленого строку неможливо, субʼєкт **повинен** вживати заходів щодо **дублювання документів на кількох електронних носіях** і здійснювати їх **періодичне копіювання**. При копіюванні обовʼязково здійснюється **перевірка цілісності** даних на носії. [SRC-041]\n\nЯкщо виконати ці вимоги неможливо, електронні документи повинні зберігатися у вигляді копії документа на папері — за відсутності паперового оригіналу. [SRC-041]\n\nРобоча практика, яка виконує норму: **три копії, два різні типи носіїв, одна копія поза приміщенням**. Це не вимога закону, а спосіб її не порушити.\n\n> [!RISK]\n> Синхронізація з хмарою — **не резервна копія**. Видалений або зіпсований файл синхронізується як видалений або зіпсований. Резервна копія — та, з якої можна відновити стан на дату в минулому.\n\n### 9. Що час робить з електронним підписом\n\nПроблема, про яку майже не пишуть.\n\nПідпис перевіряється через сертифікат, а сертифікат має строк дії. Через три роки після підписання перевірити підпис складніше: сертифікат уже недійсний, а надавач міг припинити діяльність.\n\nЗакон передбачає для цього окремі електронні довірчі послуги. До їх складу входять, зокрема, **формування, перевірка та підтвердження електронної позначки часу** і **зберігання** удосконалених електронних підписів, печаток, електронних позначок часу та повʼязаних сертифікатів. [SRC-068]\n\n**Кваліфікована електронна позначка часу має презумпцію точності дати та часу, на які вона вказує, та цілісності електронних даних**, з якими ці дата й час повʼязані. [SRC-068] Тобто вона фіксує, що документ існував саме в такому вигляді на конкретний момент.\n\nПрактичний мінімум без додаткових послуг: **зберігати разом із документом протокол перевірки підпису**, зроблений тоді, коли сертифікат ще був чинним. [SRC-047] Це не замінює позначки часу, але фіксує результат перевірки на дату.\n\n### 10. Персональні дані в архіві бухгалтера\n\nАрхів бухгалтера майже завжди містить персональні дані: прізвища підписантів, дані ФОП-контрагентів, іноді дані працівників.\n\nВолодільці й розпорядники персональних даних зобовʼязані **забезпечити захист цих даних від випадкових втрати або знищення, від незаконної обробки, у тому числі незаконного знищення чи доступу**. [SRC-070] Це пряма норма, і саме з неї випливають дві практичні речі: резервні копії й обмеження доступу.\n\nЩе два обовʼязки, про які варто знати:\n\n- мета обробки має бути сформульована й відповідати законодавству; обробка здійснюється **відкрито і прозоро**; [SRC-070]\n- володілець повідомляє Уповноваженого про обробку, яка становить **особливий ризик** для прав і свобод субʼєктів, упродовж 30 робочих днів з дня її початку; види такої обробки й категорії субʼєктів визначає сам Уповноважений. [SRC-070]\n\n> [!INFO]\n> Чи потрапляє конкретний ФОП під обовʼязок повідомлення, залежить від акта Уповноваженого, який у цьому модулі не перевірявся. Модуль констатує наявність обовʼязку — перевірити свою ситуацію треба окремо.\n\nШифрування в цьому контексті — не «просунута практика», а звичайний спосіб виконати обовʼязок із захисту від незаконного доступу: шифрований носій, шифрований архів резервної копії, окремий пароль на теку з даними працівників.\n\n### 11. Контроль версій\n\nПроблема: файли `договір_фінал.docx`, `договір_фінал_2.docx`, `договір_фінал_остаточний.docx`. Через рік невідомо, який з них підписаний.\n\nПравила, які це закривають:\n\n- **підписаний документ не редагують ніколи** — він переходить в архів і стає незмінним;\n- чернетки лежать окремо від архіву й у назві мають дату або номер версії;\n- в архів потрапляє **тільки те, що підписано**, і в тому вигляді, у якому підписано.\n\nДля електронних документів це підкріплено нормою: підприємство вживає всіх необхідних заходів для запобігання **несанкціонованому та непомітному виправленню** записів у документах і забезпечує їх належне зберігання. [SRC-039] А при виправленні помилки в електронному документі має **зберігатися інформація, яка виправляється**, разом із датою виправлення й даними осіб. [SRC-040]\n\n### 12. Якщо архів втрачено\n\nЦе модуль 4, але тут воно стає реальним.\n\nВтрата, пошкодження або дострокове знищення документів: письмово повідомити контролюючий орган за місцем обліку **у пʼятиденний строк** з дня події, додавши документи, що підтверджують подію, і **відновити** документи протягом **90 календарних днів** з дня, наступного за днем надходження повідомлення. [SRC-044]\n\nВажлива відмінність, яку треба вміти проводити:\n\n| Ситуація | Це втрата документів? |\n|---|---|\n| Зіпсувався єдиний носій, копій немає | так — діє пʼятиденний строк |\n| Зіпсувався ноутбук, але є резервна копія | ні — це тимчасова недоступність |\n| Файл є, але його не можуть знайти | ні, але під час перевірки наслідок такий самий [SRC-044] |\n| Документ не отримано від контрагента | ні — його ніколи не було, це питання запиту |\n\n> [!REMEMBER]\n> Резервна копія перетворює катастрофу на незручність. Саме тому вона є в переліку обовʼязків, а не побажань. [SRC-041]\n\n## Покроковий процес\n\nПобудова архіву:\n\n1. Визначити період, з якого починається архів, і строк зберігання за Кодексом.\n2. Створити структуру за роками й місяцями.\n3. Задати правило назв: дата, контрагент, суть.\n4. Перенести наявні документи, давши імена; безіменні — розібрати або визнати відсутніми.\n5. Пройти виписку за кожен місяць і звірити кожен рядок із документом.\n6. Виписати те, чого бракує, і надіслати запити контрагентам.\n7. Для електронних документів зберегти протоколи перевірки підпису.\n8. Налаштувати резервне копіювання: три копії, два типи носіїв, одна поза приміщенням.\n9. Обмежити доступ до даних, що містять персональні дані.\n10. Раз на квартал перевіряти, що резервна копія **відновлюється**, а не просто існує.\n\n## Практичні приклади\n\n### Приклад 1. Строк, який ще не почався\n\nАкт за грудень 2026 року підтверджує дохід, який увійде в декларацію, подану у 2027 році. Строк зберігання рахується від дня подання цієї декларації. [SRC-012] Знищувати акт «через три роки після дати документа» — зарано.\n\n### Приклад 2. Файл є, документа немає\n\nСкан акта лежить у теці «Завантаження» під назвою `img_2043.pdf`. Під час перевірки його не знайшли за 10 хвилин і не надали. Наслідок такий самий, як якби документа не існувало. [SRC-044]\n\n### Приклад 3. Хмара, яка не врятувала\n\nПідприємець зберігав документи в синхронізованій теці. Програма-шифрувальник зіпсувала файли, і зіпсовані версії синхронізувалися в хмару. Резервної копії, з якої можна відновити стан на дату, не було. Це вже втрата документів із пʼятиденним строком. [SRC-044]\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Брати строки зберігання з Переліку Мінʼюсту | його адресати — юридичні особи [SRC-069] | брати строки з Податкового кодексу [SRC-012] |\n| Рахувати строк від дати документа | відлік іде від дня подання звітності [SRC-012] | рахувати від подання декларації |\n| Організовувати архів за типами документів | перевірка питає про операцію, а не про тип | організовувати за періодами й операціями |\n| Вважати синхронізацію резервною копією | зіпсований файл синхронізується зіпсованим | мати копію, з якої відновлюється стан на дату |\n| Зберігати все на одному носії | норма вимагає дублювання й періодичного копіювання [SRC-041] | три копії, два типи носіїв, одна поза приміщенням |\n| Не перевіряти, чи копія відновлюється | копія, яку не перевіряли, — припущення | тестове відновлення раз на квартал |\n| Редагувати підписаний документ | заборонено несанкціоноване й непомітне виправлення [SRC-039] | підписане не редагують; виправлення оформлюють окремо |\n| Зберігати підписаний файл без протоколу перевірки | через роки сертифікат недійсний | зберігати протокол перевірки поруч із документом [SRC-047] |\n| Тримати дані працівників у спільному доступі | обовʼязок захисту від незаконного доступу [SRC-070] | обмежити доступ і зашифрувати |\n| Мовчати про зіпсований носій | пʼятиденний строк іде від дня події [SRC-044] | повідомити ДПС і відновлювати 90 днів |\n\n## Ризики й межі самостійних дій\n\n- **Строк 1095 днів для ФОП — висновок методом виключення**, а не адресна норма. Це відкрите питання з модуля 2; перед знищенням документів підтвердіть його з бухгалтером.\n- Структура папок, правила назв і глибина резервного копіювання **нормами не встановлені**: це практика, яка виконує вимогу «документ можна предʼявити».\n- Модуль не рекомендує конкретних програм і хмарних сервісів — це модулі 27–30.\n- Паролі, фішинг, компрометація ключа й реагування на інцидент — модуль 34.\n- Банківська виписка як джерело обліку доходу — модулі 8 і 9.\n- Порядок дій під час самої перевірки — модуль 22.\n- Чи потрапляє ваша обробка персональних даних під обовʼязок повідомлення Уповноваженого, у модулі не визначається.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, щоб підтвердити строк зберігання перед знищенням документів, оцінити повноту архіву за минулі періоди й вирішити долю періоду з непідтвердженими операціями.\n\n**Юрист потрібен**, якщо документи вилучаються правоохоронними органами, якщо стався витік персональних даних або якщо ви отримали запит, обсяг якого викликає сумнів.\n\n## Підсумок\n\nАрхів — не про порядок, а про можливість предʼявити документ. Ненадання прирівнюється до відсутності, тому головний критерій — швидкість пошуку, а не акуратність теки. Строки зберігання для ФОП дає тільки Податковий кодекс, і рахуються вони від подання звітності, а не від дати документа. Дублювання на кількох носіях і захист персональних даних — норми, а не поради; структура папок і назви файлів — практика, яка ці норми виконує.\n\n## Самоперевірка\n\n1. Що відбувається, якщо документи не надано під час перевірки?\n2. Чому Перелік типових документів Мінʼюсту не встановлює строки для ФОП?\n3. Який строк зберігання застосовується до документів ФОП і чому це висновок, а не норма?\n4. З якого дня рахується строк зберігання?\n5. Як побудувати ланцюжок від рядка виписки до документа?\n6. Які три вимоги закон ставить до зберігання електронних документів?\n7. Чому синхронізація з хмарою не є резервною копією?\n8. Що дає кваліфікована електронна позначка часу?\n9. Які обовʼязки виникають щодо персональних даних в архіві?\n10. Чим втрата документів відрізняється від тимчасової недоступності файлу?\n\n## Джерела\n\nПерелік джерел і твердження, які вони підтверджують, — у `references.md`. Використані ідентифікатори: SRC-012, SRC-039, SRC-040, SRC-041, SRC-042, SRC-043, SRC-044, SRC-045, SRC-047, SRC-051, SRC-068, SRC-069, SRC-070.\n\n## Дата перевірки актуальності\n\nДата перевірки актуальності: **2026-09-07**\nНаступна перевірка: **2026-11-01**"}, {"id": "practice", "title": "Практика", "content": "# Практика: знайти документ за випискою\n\n## Мета\n\nНавчитися проходити банківську виписку рядок за рядком і для кожної операції називати документ, який її підтверджує, — та бачити різницю між «документа немає» і «документ є, але його не знайти».\n\n## Навчальна ситуація\n\nДані синтетичні. Не використовуйте реальні відомості про себе чи клієнтів.\n\n**ФОП Литвин Дарʼя Олегівна**, третя група, послуги з перекладу. Готує архів за жовтень 2026 року.\n\nФрагмент виписки:\n\n| № | Дата | Опис у виписці | Сума |\n|---|---|---|---|\n| 1 | 03.10 | Надходження від ТОВ «Аркус», «оплата за рахунком № 41 від 01.10.2026 за переклад» | +22 000 |\n| 2 | 09.10 | Надходження від ТОВ «Медіатор», «оплата за послуги» | +8 500 |\n| 3 | 14.10 | Списання, «оплата за програмне забезпечення», отримувач-нерезидент | −3 200 |\n| 4 | 21.10 | Надходження від ФОП Гринько, «повернення помилково перерахованих коштів» | +1 400 |\n| 5 | 28.10 | Надходження від ТОВ «Аркус», «аванс за листопад за договором № 7» | +10 000 |\n\nЩо є в архіві:\n\n- тека `2026/10-жовтень/` з файлами `2026-10-03_Аркус_акт-переклад-вересень.pdf` і `2026-10-28_Аркус_рахунок-аванс.pdf`;\n- підписаний акт за операцією 2 лежить у теці «Завантаження» під назвою `scan_0043.pdf` серед трьох тисяч файлів;\n- за операцією 3 є лише лист від постачальника англійською;\n- за операцією 4 документів немає, лише переписка в месенджері;\n- декларацію за 2026 рік ще не подано.\n\n## Завдання 1. Оцініть кожну операцію\n\nДля кожного рядка виписки дайте висновок і вкажіть джерело. Використовуйте короткі відповіді:\n\n- **є** — документ в архіві й знаходиться за іменем;\n- **непридатний** — документ існує, але за наявних умов його не предʼявити;\n- **бракує** — документа немає, потрібен запит;\n- **переклад** — документ є, але потрібен переклад;\n- **не операція** — рух коштів, який не є господарською операцією.\n\n## Завдання 2. Дайте відповідь на три питання про строки\n\n1. Скільки днів зберігаються документи ФОП?\n2. З якого дня рахується строк зберігання документів за жовтень 2026 року?\n3. Скільки днів дається на повідомлення контролюючого органу про втрату документів?\n\n## Завдання 3. Знайдіть те, чого не можна порахувати\n\nДля однієї величини даних недостатньо: подія, від якої йде відлік, ще не сталася. Позначте її як таку, що потребує окремої перевірки, і не вигадуйте дату.\n\n## Критерії виконання\n\n- кожен рядок виписки має висновок із зазначеним джерелом;\n- «документ є, але його не знайти» відокремлено від «документа немає»;\n- строк зберігання взято з Податкового кодексу, а не з Переліку Мінʼюсту;\n- величина, яку неможливо порахувати, не заповнена припущенням."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Ноутбук помер за тиждень до перевірки»\n\n## Ситуація\n\nСергій — ФОП третьої групи, монтаж відео. У понеділок ноутбук не увімкнувся, майстерня сказала: диск не читається. У пʼятницю наступного тижня — планова документальна перевірка.\n\nЩо зʼясувалося:\n\n- увесь архів за два роки зберігався тільки на цьому диску;\n- синхронізація з хмарою була ввімкнена лише для теки «Проєкти», документів там немає;\n- частина актів є в контрагентів, і вони готові надіслати копії;\n- скани трьох договорів лежать у месенджері, підписаних оригіналів немає ніде;\n- про поломку нікого не повідомляли: «спочатку спробуємо відновити дані»;\n- декларацію за минулий рік подано вчасно, документи за той період були саме на цьому диску;\n- у теці з архівом були також дані двох найманих працівників;\n- бухгалтер каже, що частину документів можна відновити з банківської виписки — Сергій вважає, що виписка їх замінить.\n\nДані синтетичні.\n\n## Завдання\n\n1. Знайдіть справжні ризики й відокремте їх від того, що лише виглядає проблемою.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Побудуйте безпечну послідовність дій.\n4. Поясніть, чому спроба спершу відновити дані, а вже потім повідомляти, є найдорожчою помилкою цього тижня.\n\n## Орієнтир для самоперевірки\n\n- про втрату або пошкодження документів повідомляють контролюючий орган письмово протягом пʼяти днів **від дня події**, а не від дня, коли стало ясно, що відновити не вдалося;\n- після повідомлення дається 90 календарних днів на відновлення;\n- якщо документи не відновлено, вважається, що їх не було на час складання звітності;\n- банківська виписка показує рух коштів, але не підтверджує зміст і обсяг операції — вона первинні документи не замінює;\n- копії від контрагентів — робочий шлях відновлення; для втраченого оригіналу просять дублікат;\n- зберігання архіву на одному носії суперечить вимозі дублювання на кількох носіях;\n- втрата даних працівників — це ще й питання захисту персональних даних;\n- скани договорів у месенджері не є оригіналами електронних документів.\n\nЦе навчальний кейс, а не індивідуальна податкова консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст «Архів витримає перевірку»\n\n## Чи є документ\n\n- [ ] За кожним рядком виписки за період названо підтвердний документ.\n- [ ] Документи, яких бракує, виписано окремим списком із запитами контрагентам.\n- [ ] Рухи коштів, що не є господарськими операціями, позначено окремо.\n- [ ] Документи іноземною мовою мають переклад.\n\n## Чи його знайдуть\n\n- [ ] Архів організовано за роками й місяцями, а не за типами документів.\n- [ ] Кожен файл має назву з датою, контрагентом і суттю документа.\n- [ ] Немає файлів із назвами виду `scan_0043.pdf` або `Документ (2).pdf`.\n- [ ] Перевірено на практиці: конкретний документ знаходиться за хвилину.\n\n## Чи можна довести цілісність\n\n- [ ] Для електронних документів збережено протоколи перевірки підпису.\n- [ ] Підписані документи не редагувалися після підписання.\n- [ ] Чернетки зберігаються окремо від архіву.\n- [ ] Формати файлів такі, що документ можна відкрити через три роки.\n\n## Чи переживе носій\n\n- [ ] Архів існує щонайменше у двох копіях на різних носіях.\n- [ ] Одна копія зберігається поза основним приміщенням.\n- [ ] Перевірено, що резервна копія **відновлюється**, а не просто існує.\n- [ ] Синхронізація з хмарою не вважається резервною копією.\n\n## Строки й доступ\n\n- [ ] Строк зберігання визначено за Податковим кодексом, а не за Переліком Мінʼюсту.\n- [ ] Для кожного періоду зафіксовано день, від якого рахується строк.\n- [ ] Доступ до документів із персональними даними обмежено.\n- [ ] Відомо, що робити в перші пʼять днів після втрати документів."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 7\n\n**Архів** — упорядковане зберігання документів, у якому будь-який документ можна знайти й предʼявити на вимогу. Склад файлів без порядку архівом не є.\n\n**Строк зберігання** — період, протягом якого документ треба зберігати. Для ФОП його встановлює Податковий кодекс, а не Перелік типових документів Мінʼюсту.\n\n**Момент початку відліку** — день, з якого рахується строк зберігання: день подання звітності, для складення якої використано документ, а при неподанні — граничний строк її подання.\n\n**Одиниця зберігання** — те, навколо чого будується архів. У бухгалтерії ФОП це господарська операція, а не тип документа.\n\n**Іменування файлів** — правило, за яким назва містить дату у форматі РРРР-ММ-ДД, контрагента й суть документа. Практика, а не норма.\n\n**Контроль версій** — правило, за яким підписаний документ не редагується, а чернетки зберігаються окремо від архіву.\n\n**Резервна копія** — копія, з якої можна відновити стан на дату в минулому. Синхронізація з хмарою резервною копією не є.\n\n**Правило трьох копій** — практика: три копії, два різні типи носіїв, одна копія поза приміщенням.\n\n**Цілісність даних** — властивість, яка дає змогу довести, що документ після підписання не змінювали; перевіряється підтвердженням електронного підпису чи печатки.\n\n**Електронна позначка часу** — електронні дані, що повʼязують інші дані з конкретним моментом часу для засвідчення їх наявності на цей момент.\n\n**Кваліфікована електронна позначка часу** — позначка часу, яка має презумпцію точності дати й часу та цілісності повʼязаних із ними даних.\n\n**Послуга зберігання підписів** — електронна довірча послуга зі зберігання підписів, печаток, позначок часу й повʼязаних сертифікатів; вирішує проблему старіння сертифіката.\n\n**Шифрування** — спосіб виконати обовʼязок захисту даних від незаконного доступу, а не окрема «просунута практика».\n\n**Персональні дані** — дані про фізичну особу, які потрапляють в архів бухгалтера разом із документами: прізвища підписантів, дані ФОП-контрагентів, дані працівників.\n\n**Володілець персональних даних** — той, хто визначає мету обробки даних; саме він зобовʼязаний забезпечити їх захист від втрати, знищення й незаконного доступу.\n\n**Звірка «банк — документ»** — щомісячна процедура: пройти виписку рядок за рядком і для кожного назвати документ, що підтверджує операцію."}, {"id": "reference", "title": "Пам’ятка", "content": "# Памʼятка: електронний архів\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-09-07**\n\n## Критерій якості\n\nСкільки часу займе знайти документ за конкретним рядком виписки через два роки. Понад хвилину — архіву немає.\n\n**Ненадання документів прирівнюється до їх відсутності.** Причини значення не мають, крім виїмки правоохоронними органами.\n\n## Строки зберігання\n\n| Строк | Кому |\n|---|---|\n| 2555 днів | документи трансфертного ціноутворення |\n| 1825 днів | платники податку на прибуток і **юрособи** на спрощеній |\n| 1095 днів | **інші документи — сюди потрапляє ФОП** |\n\nПерелік типових документів Мінʼюсту адресовано державним органам та **іншим юридичним особам** — не ФОП.\n\nСтрок 1095 днів для ФОП — висновок методом виключення. Перед знищенням підтвердіть із бухгалтером.\n\n## Момент відліку\n\nСтрок рахується **з дня подання звітності**, для складення якої використано документ; при неподанні — з граничного строку подання. **Не з дати документа.**\n\n## Ланцюжок «банк → документ»\n\n1. Що це за платіж → призначення платежу.\n2. Яку операцію оплачує → договір або рахунок.\n3. Чим підтверджено подію → акт, накладна, чек.\n4. Де лежить → архів за періодом і контрагентом.\n\nРаз на місяць: пройти виписку зверху вниз і для кожного рядка назвати файл. Те, що не назвалося, — список запитів.\n\n## Структура й назви (практика)\n\n- `рік / місяць / файли операцій`;\n- імʼя файлу: **дата РРРР-ММ-ДД + контрагент + суть**;\n- одиниця зберігання — **операція**, а не тип документа;\n- підписаний документ **не редагують**; чернетки — окремо.\n\n## Електронне зберігання (норма)\n\nТри вимоги:\n\n1. інформація доступна для подальшого використання;\n2. документ можна **відновити у форматі**, у якому створено або одержано;\n3. збережено походження, призначення, дату й час відправлення чи одержання.\n\nПлюс: зберігати у формі, що дає змогу **перевірити цілісність**, і не менше строку для паперових документів.\n\n## Копії\n\nНорма: **дублювання на кількох носіях** і періодичне копіювання з перевіркою цілісності.\n\nПрактика: **3 копії, 2 типи носіїв, 1 поза приміщенням.**\n\n**Синхронізація ≠ резервна копія.** Копія — та, з якої відновлюється стан на дату в минулому. Перевіряйте відновлення, а не наявність.\n\n## Підпис і час\n\nСертифікат має строк дії. Засоби проти старіння:\n\n- **кваліфікована електронна позначка часу** — презумпція точності дати й цілісності даних;\n- **послуга зберігання** підписів, печаток і позначок часу;\n- мінімум без послуг: зберігати **протокол перевірки підпису** поруч із документом.\n\n## Персональні дані\n\nОбовʼязок: захист від випадкових втрати чи знищення та від незаконного доступу. Звідси — резервні копії, обмеження доступу, шифрування носія.\n\n## Якщо архів втрачено\n\n| Крок | Строк |\n|---|---|\n| Письмово повідомити ДПС | **5 днів від дня події** |\n| Відновити документи | **90 календарних днів** після повідомлення |\n| Не відновлено | вважається, що документів не було |\n\nЄ резервна копія — це не втрата, а незручність."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 7\n\nПеревірено: **2026-09-07**. Кожна норма звірена з повним текстом на `zakon.rada.gov.ua` (сторінка «Текст для друку»). Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Податкового кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Ненадання документів під час перевірки прирівнюється до їх відсутності | SRC-044, пункт 44.6 | Норма закону | Виняток — виїмка правоохоронними органами |\n| Документи, надані після перевірки, але до прийняття рішення, враховуються | SRC-044, пункт 44.6 | Норма закону | Це вужче, ніж «можна донести пізніше» |\n| Обовʼязок забезпечити зберігання документів протягом установлених строків | SRC-012, пункт 44.3 | Норма закону | Разом із забороною формувати показники без документів (44.1) |\n| Строки зберігання: 2555, 1825 і 1095 днів | SRC-012, підпункти 44.3.1–44.3.4 | Норма закону | ФОП не названо в підпунктах про 2555 і 1825 днів |\n| Строк рахується з дня подання звітності, а при неподанні — з граничного строку | SRC-012, пункт 44.3 | Норма закону | Найчастіше пропущене речення норми |\n| При ліквідації документи за період не менш як 1825 днів передаються в установленому порядку | SRC-012, пункт 44.3 | Норма закону | Припинення архів не скасовує |\n| Штраф за незабезпечення зберігання й ненадання документів — 1020 і 2040 грн | SRC-045, пункт 121.1 | Норма закону | Другий розмір — за повторне порушення протягом року |\n| Втрата документів: 5 днів на повідомлення, 90 днів на відновлення | SRC-044, пункт 44.5 | Норма закону | Відлік від дня події |\n| Невідновлені документи вважаються відсутніми на час складання звітності | SRC-044, пункт 44.5 | Норма закону | Так само при повторній втраті |\n| Перелік типових документів адресовано державним органам та іншим юридичним особам | SRC-069 | Норма підзаконного акта | Коло адресатів названо в самій назві наказу |\n| Електронні документи зберігаються у формі, що дає змогу перевірити цілісність | SRC-041, стаття 13; SRC-040, пункт 6.4 | Норма закону й підзаконного акта | Строк не менший за строк для паперових документів |\n| Три вимоги до зберігання електронних документів | SRC-041, стаття 13 | Норма закону | Доступність, відновлюваність формату, дані про походження й час |\n| Дублювання на кількох носіях і періодичне копіювання з перевіркою цілісності | SRC-041, стаття 13 | Норма закону | Юридична підстава резервного копіювання |\n| За неможливості виконати вимоги — зберігання у вигляді паперової копії | SRC-041, стаття 13 | Норма закону | Лише за відсутності паперового оригіналу |\n| Заходи проти несанкціонованого та непомітного виправлення записів | SRC-039, частина сьома статті 9 | Норма закону | Підстава правила «підписане не редагують» |\n| При виправленні в електронному документі зберігається інформація, що виправляється | SRC-040, пункт 4.10 | Норма підзаконного акта | Разом із датою й даними осіб |\n| Склад електронних довірчих послуг, зокрема зберігання підписів і позначок часу | SRC-068, стаття 16 | Норма закону | Кожна послуга може надаватися окремо |\n| Кваліфікована електронна позначка часу має презумпцію точності дати й цілісності | SRC-068, стаття 26 | Норма закону | Засіб проти старіння сертифіката |\n| Визначення електронної позначки часу | SRC-068, пункт 13 частини першої статті 1 | Норма закону | Повʼязує дані з конкретним моментом часу |\n| Перевірка цілісності — підтвердження підпису чи печатки | SRC-041, стаття 12; SRC-047 | Норма закону й вебсервіс | Протокол перевірки зберігають разом із документом |\n| Оригінал електронного документа; кожен примірник є оригіналом | SRC-041, стаття 7 | Норма закону | Матеріал модуля 4 |\n| Копія й дублікат: різні документи | SRC-043 | Норма підзаконного акта | Для втраченого оригіналу просять дублікат |\n| Обовʼязок захисту персональних даних від втрати, знищення й незаконного доступу | SRC-070, стаття 24 | Норма закону | Підстава для резервних копій і обмеження доступу |\n| Загальні вимоги до обробки персональних даних | SRC-070, стаття 6 | Норма закону | Мета обробки, відкритість і прозорість |\n| Повідомлення Уповноваженого про обробку з особливим ризиком — 30 робочих днів | SRC-070, стаття 9 | Норма закону | Види такої обробки визначає сам Уповноважений |\n| Мова документів і аутентичний переклад | SRC-040, пункт 1.4 | Норма підзаконного акта | Адресат — підприємства; для ФОП загальної норми не знайдено |\n| Призначення платежу — обовʼязковий реквізит платіжної інструкції | SRC-051, пункт 37 | Норма підзаконного акта | Єдина нитка від виписки до документа |\n| Рівні електронного підпису | SRC-042 | Норма закону | Матеріал модуля 4 |\n\n## Межі перевірки\n\n- **Строк 1095 днів для ФОП — висновок методом виключення** з підпунктів 44.3.2 і 44.3.3, а не адресна норма. Це відкрите питання ще з модуля 2; модуль 7 його не закриває й повторює з тим самим застереженням.\n- **Структура папок, правила назв файлів, кількість резервних копій і періодичність перевірки відновлення нормами не встановлені.** Це професійна практика; у тексті модуля вона щоразу позначена як практика, а норма — окремо.\n- **Чи потрапляє конкретний ФОП під обовʼязок повідомити Уповноваженого** про обробку персональних даних з особливим ризиком — не перевірялося: види такої обробки й категорії субʼєктів визначає сам Уповноважений окремим актом. Модуль констатує наявність обовʼязку й радить перевірити свою ситуацію.\n- **Мова документів** — те саме обмеження, що в модулях 4 і 5: вимога аутентичного перекладу міститься в акті, адресованому підприємствам.\n- **Поза межами модуля:** конкретні програми та хмарні сервіси (модулі 27–30), кібербезпека, паролі й реагування на інцидент (модуль 34), банківська виписка як джерело обліку доходу (модулі 8 і 9), порядок дій під час перевірки (модуль 22).\n- **Жоден конкретний продукт або сервіс у модулі не рекомендується** — свідоме рішення: вимоги сформульовано до результату, а не до інструмента."}], "quiz": [{"id": "m07-q01", "title": "Документ, який не знайшли", "competency": "archive_purpose", "scenario": "Під час перевірки акт не знайшли серед тисяч файлів у теці «Завантаження» й не надали.", "question": "Який наслідок це має для показника звітності?", "options": [{"text": "Показник визнається частково — пропорційно до наданих документів", "feedback": "Ні. Правила пропорційного визнання показника за кількістю документів норма не має."}, {"text": "Вважається, що документа не було на час складання цієї звітності", "correct": true, "feedback": "Правильно. Причини ненадання значення не мають, крім виїмки правоохоронними органами."}, {"text": "Наслідків немає: документ фактично існує, і це можна довести пізніше", "feedback": "Ні. Врахувати можна лише документи, надані до прийняття рішення за перевіркою."}], "explanation": "Якщо платник не надає посадовим особам контролюючого органу документи, що підтверджують показники звітності, вважається, що такі документи були відсутні у нього на час складання звітності. Тому архів, у якому неможливо швидко знайти документ, юридично не відрізняється від архіву, якого немає.", "source_reference": ["SRC-044"], "hint": "Зверніть увагу, що норма говорить про наслідок ненадання, а не про наявність файлу десь на диску."}, {"id": "m07-q02", "title": "Звідки строки", "competency": "archive_term_source", "scenario": "Бухгалтер шукає строк зберігання документів ФОП у Переліку типових документів Мінʼюсту.", "question": "Чому це джерело не підходить?", "options": [{"text": "Його адресати — державні органи та інші юридичні особи, а не підприємці", "correct": true, "feedback": "Правильно. Для ФОП строки зберігання встановлює лише Податковий кодекс."}, {"text": "Перелік втратив чинність після скасування Господарського кодексу України", "feedback": "Ні. Перелік чинний і оновлювався; зі скасуванням Господарського кодексу він не повʼязаний."}, {"text": "Перелік поширюється лише на документи, що передаються до державних архівів", "feedback": "Ні. Він охоплює типові документи діяльності, а не тільки архівні справи установ."}], "explanation": "Перелік типових документів затверджено для державних органів, органів місцевого самоврядування та інших юридичних осіб. Строки зберігання документів ФОП визначає пункт 44.3 Податкового кодексу.", "source_reference": ["SRC-069", "SRC-012"], "hint": "Прочитайте повну назву документа: коло адресатів названо просто в ній."}, {"id": "m07-q03", "title": "Строк для ФОП", "competency": "archive_retention_days", "scenario": "Бухгалтер визначає, скільки зберігати первинні документи підприємця на третій групі.", "question": "Який строк застосовується і на якій підставі?", "options": [{"text": "1825 днів — той самий строк, що встановлено для юридичних осіб на спрощеній системі", "feedback": "Ні. Цей підпункт названо для юридичних осіб на спрощеній системі, а не для підприємців."}, {"text": "2555 днів, оскільки саме він застосовується до всіх первинних документів", "feedback": "Ні. Цей строк стосується документів для контролю за трансфертним ціноутворенням."}, {"text": "1095 днів як для інших документів: ФОП не названо в попередніх підпунктах", "correct": true, "feedback": "Правильно. Це висновок методом виключення, а не адресна норма про підприємців."}], "explanation": "Пункт 44.3 встановлює 2555 днів для документів трансфертного ціноутворення, 1825 днів для платників податку на прибуток і юридичних осіб на спрощеній системі та 1095 днів для інших документів. ФОП у перших двох підпунктах не названо, тому застосовується 1095 днів. Цей висновок варто підтвердити з бухгалтером перед знищенням документів.", "source_reference": ["SRC-012"], "hint": "Пройдіть підпункти по черзі й перевірте, у якому з них згадано саме фізичну особу-підприємця."}, {"id": "m07-q04", "title": "Початок відліку", "competency": "archive_term_start", "scenario": "Акт за грудень 2026 року використано для декларації, поданої у лютому 2027 року.", "question": "З якого дня рахується строк зберігання цього акта?", "options": [{"text": "З дати складання акта, тобто з відповідного дня грудня 2026 року", "feedback": "Ні. Дата документа й початок відліку строку зберігання — різні дати."}, {"text": "З дня подання декларації, для складення якої використано цей акт", "correct": true, "feedback": "Правильно. При неподанні звітності відлік іде від граничного строку її подання."}, {"text": "З 1 січня 2027 року, тобто з початку року, наступного за роком господарської операції", "feedback": "Ні. Правила перенесення початку відліку на новий рік норма не містить."}], "explanation": "Строки зберігання розраховуються з дня подання податкової чи іншої звітності, для складення якої використовуються документи, а в разі її неподання — з передбаченого Кодексом граничного строку подання такої звітності.", "source_reference": ["SRC-012"], "hint": "Норма привʼязує відлік не до документа, а до події, яка відбувається пізніше."}, {"id": "m07-q05", "title": "Синхронізація і копія", "competency": "archive_backup", "scenario": "Архів лежить у теці, яка синхронізується з хмарою, іншої копії немає.", "question": "Чому це не виконує вимогу про збереження документів?", "options": [{"text": "Тому що хмарне сховище не вважається електронним носієм у розумінні закону", "feedback": "Ні. Хмарне сховище носієм бути може; проблема не в тому, де лежить копія."}, {"text": "Тому що для зберігання потрібен кваліфікований надавач довірчих послуг", "feedback": "Ні. Такої вимоги до зберігання первинних документів закон не встановлює."}, {"text": "Тому що зіпсований файл синхронізується зіпсованим і стан на дату не відновити", "correct": true, "feedback": "Правильно. Норма вимагає дублювання на кількох носіях і періодичного копіювання."}], "explanation": "У разі неможливості зберігання електронних документів протягом установленого строку субʼєкти повинні вживати заходів щодо дублювання документів на кількох електронних носіях і здійснювати їх періодичне копіювання; при копіюванні обовʼязково перевіряється цілісність даних.", "source_reference": ["SRC-041"], "hint": "Спитайте себе, чи можна за цією схемою повернути стан теки на дату в минулому."}, {"id": "m07-q06", "title": "Формат через три роки", "competency": "archive_format", "scenario": "Документи збережено у форматі програми, яку розробник більше не підтримує.", "question": "Яку вимогу до зберігання це порушує?", "options": [{"text": "Можливість відновити документ у тому форматі, у якому його створено", "correct": true, "feedback": "Правильно. Файл, який нічим не відкрити, формально збережений і фактично втрачений."}, {"text": "Обовʼязок зберігати документи виключно у форматах, визначених Мінфіном", "feedback": "Ні. Переліку обовʼязкових форматів зберігання для первинних документів немає."}, {"text": "Заборону зберігати документи в програмах, що не пройшли сертифікацію", "feedback": "Ні. Такої заборони щодо програмного забезпечення для архіву закон не містить."}], "explanation": "При зберіганні електронних документів обовʼязкові три умови: інформація має бути доступною для подальшого використання; має бути забезпечена можливість відновити документ у тому форматі, у якому його створено, надіслано або одержано; за наявності зберігається інформація про походження, призначення, дату й час відправлення чи одержання.", "source_reference": ["SRC-041"], "hint": "Порівняйте ситуацію з трьома умовами зберігання: одна з них стосується саме формату."}, {"id": "m07-q07", "title": "Підпис через роки", "competency": "archive_timestamp", "scenario": "Через три роки після підписання файлу сертифікат підписувача вже недійсний.", "question": "Що засвідчує наявність документа в такому вигляді на потрібний момент?", "options": [{"text": "Повторне підписання файлу новим чинним сертифікатом того самого підписувача", "feedback": "Ні. Новий підпис засвідчує сьогоднішній момент, а не той, що був три роки тому."}, {"text": "Кваліфікована електронна позначка часу з презумпцією точності дати й цілісності", "correct": true, "feedback": "Правильно. Закон передбачає й окрему послугу зберігання підписів і позначок часу."}, {"text": "Роздрук документа на папері, засвідчений власноручним підписом і датою підприємця", "feedback": "Ні. Роздрук є візуальним поданням і цілісності електронних даних не доводить."}], "explanation": "Кваліфікована електронна позначка часу має презумпцію точності дати та часу, на які вона вказує, та цілісності електронних даних, з якими ці дата й час повʼязані. До складу електронних довірчих послуг входить також зберігання підписів, печаток, позначок часу та повʼязаних сертифікатів.", "source_reference": ["SRC-068"], "hint": "Шукайте засіб, який фіксує саме момент часу, а не автора документа."}, {"id": "m07-q08", "title": "Дані працівників", "competency": "archive_personal_data", "scenario": "Разом із документами в архіві зберігаються дані двох найманих працівників.", "question": "Який обовʼязок це створює для підприємця?", "options": [{"text": "Знищувати ці дані щороку після подання звітності за відповідний період", "feedback": "Ні. Правила щорічного знищення персональних даних з архіву норма не встановлює."}, {"text": "Зберігати дані працівників виключно в паперовому вигляді в окремій шафі", "feedback": "Ні. Вимоги зберігати персональні дані лише на папері закон не містить."}, {"text": "Захистити їх від випадкових втрати чи знищення та незаконного доступу", "correct": true, "feedback": "Правильно. Саме з цієї норми випливають резервні копії й обмеження доступу."}], "explanation": "Володільці, розпорядники персональних даних та треті особи зобовʼязані забезпечити захист цих даних від випадкових втрати або знищення, від незаконної обробки, у тому числі незаконного знищення чи доступу до персональних даних.", "source_reference": ["SRC-070"], "hint": "Норма перелічує кілька загроз одразу — зверніть увагу, що серед них є і випадкові події."}, {"id": "m07-q09", "title": "Диск і резервна копія", "competency": "archive_loss_vs_unavailable", "scenario": "Зіпсувався робочий ноутбук, але повна резервна копія архіву є на зовнішньому диску.", "question": "Чи є це втратою документів у розумінні Кодексу?", "options": [{"text": "Так, потрібно повідомити контролюючий орган у пʼятиденний строк від події", "feedback": "Ні. Пʼятиденний строк стосується втрати, пошкодження або знищення самих документів."}, {"text": "Ні: документи збереглися, це тимчасова недоступність робочого пристрою", "correct": true, "feedback": "Правильно. Саме тому резервна копія перетворює катастрофу на незручність."}, {"text": "Так, оскільки основний примірник архіву фізично перестав існувати", "feedback": "Ні. Кожен примірник електронного документа є оригіналом, і документи не втрачено."}], "explanation": "Обовʼязок повідомити контролюючий орган у пʼятиденний строк і відновити документи протягом 90 календарних днів виникає у разі втрати, пошкодження або дострокового знищення документів. Якщо повна копія збереглася, документи не втрачено.", "source_reference": ["SRC-044", "SRC-041"], "hint": "Розділіть два питання: що сталося з пристроєм і що сталося з самими документами."}, {"id": "m07-q10", "title": "Виписка замість документів", "competency": "archive_statement_limits", "scenario": "Після втрати архіву підприємець пропонує підтвердити операції самою банківською випискою.", "question": "Чому виписка не замінює первинних документів?", "options": [{"text": "Бо вона взагалі не має обовʼязкових реквізитів первинного документа операції", "feedback": "Ні. Річ не в реквізитах виписки: проблема в тому, який саме факт вона фіксує."}, {"text": "Бо банк видає її лише за окремим запитом і з обмеженим строком дії", "feedback": "Ні. Доступність виписки на це питання не впливає, а строку дії вона не має."}, {"text": "Бо вона показує рух коштів, але не зміст і обсяг господарської операції", "correct": true, "feedback": "Правильно. Формувати показники звітності без підтвердних документів заборонено."}], "explanation": "Виписка відповідає на питання «чим заплачено», але не на питання «що сталося». Платникам заборонено формувати показники податкової звітності на підставі даних, не підтверджених первинними документами, тому виписка їх не замінює.", "source_reference": ["SRC-012", "SRC-051"], "hint": "Пригадайте три питання комплекту з модуля 5 і перевірте, на яке з них відповідає виписка."}], "activities": {"precheck": [{"id": "pre-term-start", "question": "Як гадаєте: з якого дня рахується строк зберігання документа?", "options": [{"text": "З дати складання самого документа", "correct": false}, {"text": "З дня подання звітності, для якої його використано", "correct": true}, {"text": "З 1 січня року, наступного за роком операції", "correct": false}], "note": "Строки обчислюються з дня подання звітності, для складення якої використовуються документи, а при її неподанні — з граничного строку подання. Різниця з датою документа — місяці, і саме тут документи знищують зарано."}, {"id": "pre-backup", "question": "Синхронізація архіву з хмарою — це резервна копія?", "options": [{"text": "Так, файли зберігаються поза компʼютером", "correct": false}, {"text": "Ні, зіпсований файл синхронізується зіпсованим", "correct": true}, {"text": "Так, якщо хмара платна й має підтримку", "correct": false}], "note": "Резервна копія — та, з якої можна відновити стан на дату в минулому. Розділ про носії покаже, що дублювання на кількох носіях є нормою, а не порадою."}, {"id": "pre-notfound", "question": "Документ є, але під час перевірки його не знайшли й не надали. Які наслідки?", "options": [{"text": "Жодних: документ фактично існує", "correct": false}, {"text": "Такі самі, як якби документа не було", "correct": true}, {"text": "Штраф удвічі менший, ніж за втрату", "correct": false}], "note": "Ненадання документів прирівнюється до їх відсутності на час складання звітності, і причини значення не мають. Саме тому швидкість п вська виписка замінить первинні документи", "частина актів є в контрагентів, і вони готові надіслати копії", "декларацію за минулий рік подано вчасно"], "categories": ["строк повідомлення", "збереження носія", "підтвердження операцій", "персональні дані"], "owners": ["власник", "бухгалтер", "юрист"], "risks": [{"id": "no_notice", "text": "Про втрату документів не повідомляли, чекають на відновлення даних", "critical": true, "category": "строк повідомлення", "owner": "власник", "feedback": "Пʼятиденний строк письмового повідомлення контролюючого органу рахується від дня події, а не від дня, коли стало ясно, що дані не відновити. Кожен день очікування зʼїдає строк, який неможливо повернути.", "hint": "Подивіться, від якої саме дати норма відраховує строк повідомлення, і порівняйте з обраною тактикою."}, {"id": "single_disk", "text": "Увесь архів зберігався на одному носії без резервної копії", "critical": true, "category": "збереження носія", "owner": "бухгалтер", "feedback": "Закон вимагає вживати заходів щодо дублювання електронних документів на кількох носіях і здійснювати періодичне копіювання з перевіркою цілісності. Один носій цієї вимоги не виконує.", "hint": "Пригадайте, що норма каже про кількість носіїв, коли зберігання на одному не гарантує строку."}, {"id": "fake_backup", "text": "Синхронізація ввімкнена лише для теки, у якій документів немає", "critical": true, "category": "збереження носія", "owner": "бухгалтер", "feedback": "Резервна копія існує тільки для тих даних, які до неї потрапляють. Синхронізація сторонньої теки не захищає архів і створює хибне відчуття захищеності.", "hint": "Спитайте себе, що саме потрапляло в копію і чи були там документи, які тепер шукають."}, {"id": "no_originals", "text": "Підписаних оригіналів трьох договорів немає ніде", "critical": true, "category": "підтвердження операцій", "owner": "юрист", "feedback": "Скан у месенджері не є оригіналом електронного документа: оригіналом лишається підписаний папір або файл із накладеним підписом. Відновлення потребує звернення до контрагентів за дублікатами.", "hint": "Пригадайте з модуля 4, що робить електронний файл оригіналом, і перевірте, чи є це в сканах."}, {"id": "personal_data", "text": "Разом з архівом втрачено дані найманих працівників", "critical": true, "category": "персональні дані", "owner": "бухгалтер", "feedback": "Володілець зобовʼязаний забезпечити захист персональних даних від випадкових втрати або знищення. Втрата даних працівників — окреме питання, яке не закривається відновленням податкових документів.", "hint": "Подумайте, чи всі втрачені дані стосуються лише податкового обліку, і чиї права зачеплено."}, {"id": "statement_instead", "text": "Переконання, що банківська виписка замінить первинні документи", "critical": true, "category": "підтвердження операцій", "owner": "бухгалтер", "feedback": "Виписка показує рух коштів, але не зміст і обсяг операції. Формувати показники звітності на підставі даних, не підтверджених первинними документами, заборонено, тому виписка їх не замінює.", "hint": "Порівняйте, на яке з трьох питань комплекту відповідає виписка, а на яке — ні."}, {"id": "counterparties_copies", "text": "Частина актів є в контрагентів, і вони готові надіслати копії", "critical": false, "category": "підтвердження операцій", "owner": "бухгалтер", "feedback": "Це не ризик, а робочий шлях відновлення: саме так документи й відновлюють протягом 90 днів після повідомлення. Для втраченого оригіналу просять дублікат.", "hint": "Спитайте себе, чи створює це твердження проблему, чи навпаки дає інструмент її вирішення."}, {"id": "declaration_filed", "text": "Декларацію за минулий рік подано вчасно", "critical": false, "category": "строк повідомлення", "owner": "бухгалтер", "feedback": "Своєчасно подана декларація ризику не створює. Вона навіть корисна: саме від дня її подання відраховується строк зберігання документів того періоду.", "hint": "Подумайте, чи є тут порушення, і що дата подання декларації означає для строків зберігання."}], "actions": [{"id": "notify", "text": "Письмово повідомити контролюючий орган про втрату документів"}, {"id": "inventory", "text": "Скласти перелік втрачених документів за періодами й контрагентами"}, {"id": "collect", "text": "Запитати в контрагентів копії та дублікати втрачених документів"}, {"id": "personal", "text": "Оцінити наслідки втрати даних працівників і закрити доступ до них"}, {"id": "rebuild", "text": "Відновити архів за структурою й перевірити повноту за випискою"}, {"id": "backup", "text": "Налаштувати резервне копіювання на кілька носіїв із перевіркою відновлення"}], "initial_order": ["backup", "rebuild", "personal", "collect", "inventory", "notify"], "order_hint": "Першою йде дія, у якої вже спливає встановлений законом строк. Далі треба зрозуміти, чого саме бракує, і лише потім збирати документи. Питання персональних даних закривається окремо, а перебудова зберігання — остання: вона не поверне втраченого.", "reasoning_hint": ["Назвіть строк, який почав спливати, і дату, від якої його рахують.", "Поясніть, що дає повідомлення: який новий строк воно відкриває.", "Згадайте щонайменше три напрями: строк повідомлення, відлік від дня події, наслідок невідновлення.", "Не переказуйте ситуацію — сформулюйте висновок, який ви сказали б клієнту."], "reasoning_aspects": [{"label": "Строк повідомлення", "terms": ["пʼят", "пять", "5 дн", "повідом", "строк"]}, {"label": "Відлік від дня події", "terms": ["від дня", "поді", "поломк", "не від"]}, {"label": "Відновлення після повідомлення", "terms": ["90", "віднов", "дублікат"]}, {"label": "Наслідок невідновлення", "terms": ["вважа", "не було", "відсутн", "звітност"]}], "reasoning_model": "Пʼятиденний строк письмового повідомлення контролюючого органу рахується від дня події, тобто від дня поломки диска, а не від дня, коли стало остаточно ясно, що дані не відновлюються. Поки Сергій чекає результату від майстерні, строк спливає, і повернути його неможливо. Саме повідомлення відкриває наступний строк — 90 кален
