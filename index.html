д якої його рахують.", "Поясніть, що відбувається з документами, які не відновлено у відведений час.", "Згадайте щонайменше три напрями: строк повідомлення, відновлення документів, наслідок бездіяльності.", "Не переказуйте ситуацію — сформулюйте висновок, який ви сказали б клієнту."], "reasoning_aspects": [{"label": "Строк повідомлення", "terms": ["повідом", "строк", "5 дн", "днів"]}, {"label": "Відлік від дня події", "terms": ["поді", "серпн", "дат", "від дня"]}, {"label": "Відновлення документів", "terms": ["віднов", "90", "дублікат"]}, {"label": "Наслідок бездіяльності", "terms": ["вважа", "відсутн", "не було", "штраф"]}], "reasoning_model": "Втрата документів — єдина позиція списку, у якої вже спливає встановлений законом строк: письмово повідомити контролюючий орган треба протягом пʼяти днів від дня події, а подія сталася в серпні. Після повідомлення починається відлік 90 календарних днів на відновлення документів. Якщо документи не відновлено, вважається, що їх не було на час складання звітності, і жодне переоформлення актів це вже не виправить. Решта позицій списку — дефекти форми, які можна усунути пізніше, і саме тому вони йдуть після повідомлення."}, "checklist": {"title": "Приймання документа від контрагента", "instructions": "Пройдіть перевірку так, як її робить бухгалтер, коли отримує документ. Для кожного пункту виберіть обґрунтований статус і напишіть, чим він підтверджений або чого бракує.", "how_to": ["Тримайте перед очима результат Практики: чекліст перевіряє той самий порядок дій на іншому документі.", "Ідіть зверху вниз і для кожного пункту виберіть статус: підтверджено, потрібні дані або не застосовується.", "У полі праворуч напишіть, чим статус підтверджено або що саме треба отримати — щонайменше 10 символів.", "Якщо незрозуміло, що перевіряти, натисніть «Підказка» біля пункту: вона каже, де шукати, але не диктує статус.", "Критичні пункти зі знаком «!» не можна закрити як «не застосовується».", "Стежте за поясненням під пунктом: воно живцем показує, чого ще бракує."], "note_min_chars": 10, "statuses": [{"value": "", "label": "Не перевірено"}, {"value": "confirmed", "label": "Підтверджено"}, {"value": "needs_data", "label": "Потрібні дані"}, {"value": "na", "label": "Не застосовується", "blocks_critical": true}], "items": [{"id": "operation", "group": "Що це за операція", "text": "Визначено, яку саме господарську операцію документ підтверджує", "critical": true, "hint": "Сформулюйте операцію одним реченням: що зроблено, ким, для кого і в якому обсязі. Якщо це не виходить із тексту документа — статус «потрібні дані».", "why": "Первинний документ — це документ про господарську операцію; поки операція не названа, немає чого перевіряти в документі."}, {"id": "contract_match", "group": "Що це за операція", "text": "Документ звірено з договором: сторони, предмет і сума", "critical": true, "hint": "Порівняйте три речі з текстом договору. Розбіжність у сумі — це «потрібні дані», а не привід самостійно виправити документ.", "why": "Розбіжність між договором і документом виявляється дешево зараз і дорого під час перевірки."}, {"id": "period", "group": "Що це за операція", "text": "Зрозуміло, який період операції охоплює документ", "critical": false, "hint": "Подивіться, чи названо в документі місяць, період або дати надання послуги; якщо ні — запишіть, у кого це уточнити.", "why": "Період потрібен, щоб не оплатити ту саму роботу двічі й правильно віднести операцію до звітного періоду."}, {"id": "req_title", "group": "Шість реквізитів", "text": "Назва документа й дата складання є", "critical": true, "hint": "Це перші дві позиції переліку. Дата складання, крім того, входить до умов, за яких недолік вважається неістотним.", "why": "Без дати складання документ не проходить перевірку на неістотність недоліку й перестає бути надійним підтвердженням."}, {"id": "req_party", "group": "Шість реквізитів", "text": "Названо сторону, від імені якої складено документ", "critical": true, "hint": "Шукайте не всі згадки сторін, а саме того, від чийого імені складено документ. Описка в назві — окреме питання, не відсутність.", "why": "Без цього реквізиту неможливо сказати, чиє це свідчення про операцію."}, {"id": "req_content", "group": "Шість реквізитів", "text": "Зміст, обсяг операції та одиниця виміру зрозумілі з тексту", "critical": true, "hint": "Перевірте три речі: що зроблено, скільки цього зроблено і в яких вимірниках. Формулювання «послуги згідно з договором» цього не дає.", "why": "Саме зміст і обсяг операції відрізняють документ про роботу від документа ні про що."}, {"id": "req_sign", "group": "Шість реквізитів", "text": "Є посади, прізвища відповідальних осіб і дані для ідентифікації підписанта", "critical": true, "hint": "Це дві останні позиції переліку. Замість власноручного підпису можуть бути інші дані, що дають змогу ідентифікувати особу.", "why": "Можливість ідентифікувати особу — перша з чотирьох умов, за яких недолік документа лишається неістотним."}, {"id": "extra_req", "group": "Шість реквізитів", "text": "Перевірено, що контрагенту не висунуто вимог поза переліком обовʼязкових", "critical": false, "hint": "Перечитайте власний запит контрагенту: чи немає в ньому печатки, номера або місця складання як обовʼязкових вимог.", "why": "Зайві вимоги затримують закриття періоду й псують стосунки з контрагентом без жодної користі для обліку."}, {"id": "form", "group": "Форма й підпис", "text": "Визначено форму: паперовий оригінал, електронний оригінал, копія чи скан", "critical": true, "hint": "Питання просте: чи є в файлі накладений електронний підпис. Якщо це зображення паперу — форма визначена, але оригінал деінде.", "why": "Від форми залежить, чи є у вас документ узагалі, чи лише його зображення."}, {"id": "signature_check", "group": "Форма й підпис", "text": "Для електронного документа підпис перевірено, результат зафіксовано", "critical": true, "hint": "Перевірка дає три відповіді: хто підписав, коли і чи не порушено цілісність. Запишіть їх, а не лише «перевірив».", "why": "Перевірка цілісності — це дія з файлом; без неї підпис лишається припущенням про автора."}, {"id": "facsimile", "group": "Форма й підпис", "text": "Перевірено, чи не використано факсиміле без письмової згоди сторін", "critical": false, "hint": "Подивіться, чи підпис не є відбитком штампа, і чи є в договорі письмова згода зі зразками підписів.", "why": "Факсиміле без письмової згоди зі зразками підписів створює ризик у спорі про факт правочину."}, {"id": "dates", "group": "Дати", "text": "Дату складання документа записано окремо від дати операції", "critical": true, "hint": "Занотуйте обидві дати поруч. Якщо в документі є лише одна — запишіть, якої саме бракує.", "why": "Змішування цих дат — найчастіша причина того, що операція потрапляє не в той період."}, {"id": "income_date", "group": "Дати", "text": "Для доходу взято дату надходження коштів, а не дату документа", "critical": true, "hint": "Знайдіть у виписці день зарахування коштів. Якщо виписки немає, статус «потрібні дані» — і це нормальний результат перевірки.", "why": "Для платника єдиного податку дохід визнають за датою надходження коштів, і дата акта на це не впливає."}, {"id": "gap_action", "group": "Що робити з розбіжністю", "text": "Для кожного відсутнього реквізиту вирішено: неістотний недолік чи відсутній реквізит", "critical": true, "hint": "Пройдіть чотирма умовами неістотності: ідентифікація особи, дата, назва сторони, зміст і обсяг операції.", "why": "Без цього рішення частина документів переоформлюється дарма, а частина проблемних лишається в архіві."}, {"id": "request", "group": "Що робити з розбіжністю", "text": "На відсутні реквізити надіслано запит із дедлайном до закриття періоду", "critical": false, "hint": "Запишіть дату запиту й дату, до якої потрібен документ. «Написав у месенджер» без дати — це «потрібні дані».", "why": "Документ, якого просять «колись», не приходить ніколи; дедлайн привʼязує запит до закриття періоду."}, {"id": "loss", "group": "Що робити з розбіжністю", "text": "Втрачені документи, якщо такі є, взято на облік із датою події", "critical": true, "hint": "Дата події важливіша за дату виявлення: саме від неї рахують строк повідомлення контролюючого органу.", "why": "Пропущений пʼятиденний строк перетворює керовану ситуацію на відсутність документів із відповідними наслідками."}, {"id": "storage", "group": "Контроль якості", "text": "Документ збережено так, що його можна знайти й пред'явити", "critical": false, "hint": "Перевірте себе одним питанням: скільки часу займе знайти цей документ через рік. Якщо більше хвилини — «потрібні дані».", "why": "Ненадання документів під час перевірки прирівнюється до їх відсутності, незалежно від того, що вони десь є."}]}, "glossary": [{"term": "Господарська операція", "definition": "Дія або подія, яка викликає зміни в структурі активів та зобовʼязань або власного капіталу.", "example": "Надання послуги замовнику й отримання оплати за неї — дві різні господарські операції.", "avoid": "«будь-яка дія підприємця» — розмова з клієнтом операцією не є"}, {"term": "Первинний документ", "definition": "Документ, який містить відомості про господарську операцію. Спочатку є операція, документ її фіксує.", "example": "Акт наданих послуг за вересень підтверджує, що саме й у якому обсязі виконано.", "avoid": "«будь-який папір від контрагента» — комерційна пропозиція документом про операцію не є"}, {"term": "Зведений документ", "definition": "Документ, складений на підставі кількох первинних для контролю та впорядкування оброблення даних.", "example": "Один денний документ за даними касових чеків замість документа на кожен продаж.", "avoid": "«заміна первинних документів» — зведений документ спирається на них, а не скасовує"}, {"term": "Обовʼязкові реквізити", "definition": "Шість елементів документа: назва, дата складання, назва сторони, зміст і обсяг операції з одиницею виміру, посади й прізвища відповідальних, підпис або дані для ідентифікації.", "example": "Перевірка документа починається з проходу цим переліком по пунктах.", "avoid": "«сім реквізитів із місцем складання» — місце виключено з переліку в 2020 році"}, {"term": "Додатковий реквізит", "definition": "Елемент, який може включатися до документа залежно від характеру операції: печатка, номер документа, підстава для здійснення операції.", "example": "Акт без номера й печатки лишається належно оформленим документом.", "avoid": "«необовʼязковий, але бажаний» — вимагати його від контрагента підстав немає"}, {"term": "Неістотний недолік", "definition": "Дефект оформлення, який не заважає ідентифікувати особу й не приховує дату, назву сторони, зміст і обсяг операції.", "example": "Описка в назві вулиці замовника за збігу решти даних із договором.", "avoid": "«дрібна помилка на розсуд бухгалтера» — є чотири умови, які перевіряють по черзі"}, {"term": "Оригінал електронного документа", "definition": "Електронний примірник документа з обовʼязковими реквізитами, у тому числі з електронним підписом автора.", "example": "Файл, надісланий трьом адресатам, є оригіналом у кожного з них.", "avoid": "«файл із головного компʼютера» — місце зберігання оригінальності не додає"}, {"term": "Візуальна форма", "definition": "Відображення електронного документа на екрані або на папері у формі, придатній для сприйняття людиною.", "example": "Роздрук електронного акта, щоб показати його на зустрічі.", "avoid": "«те саме, що оригінал» — візуальна форма показує документ, а не є ним"}, {"term": "Копія документа", "definition": "Документ, що містить точне знакове відтворення змісту або документної інформації іншого документа.", "example": "Ксерокопія акта, засвідчена підписом і датою.", "avoid": "«фото в месенджері» — незасвідчене зображення копією в правовому сенсі не є"}, {"term": "Витяг", "definition": "Засвідчена копія частини тексту службового документа.", "example": "Витяг із договору лише в частині порядку оплати.", "avoid": "«скорочений переказ» — витяг відтворює текст, а не переказує його"}, {"term": "Дублікат", "definition": "Повторно оформлений документ для використання замість втраченого чи пошкодженого оригіналу; має таку саму юридичну силу.", "example": "Замість залитого водою акта контрагент видає дублікат із відміткою «Дублікат».", "avoid": "«ще одна копія» — дублікат замінює оригінал, а копія лише відтворює його"}, {"term": "Електронний підпис", "definition": "Електронні дані, що додаються до інших електронних даних і використовуються підписувачем як підпис.", "example": "Найпростіший рівень підпису, юридичну силу якого не можна заперечити лише через електронну форму.", "avoid": "«те саме, що КЕП» — це три різні рівні з різними наслідками"}, {"term": "Удосконалений електронний підпис", "definition": "Підпис, однозначно повʼязаний із підписувачем, створений під його одноосібним контролем, який дає змогу виявити будь-яку подальшу зміну даних.", "example": "Підтвердження такого підпису показує, що після підписання файл не змінювали.", "avoid": "«майже КЕП» — презумпції відповідності власноручному підпису він не дає"}, {"term": "Кваліфікований електронний підпис", "definition": "Удосконалений підпис, створений засобом КЕП на основі кваліфікованого сертифіката; має презумпцію відповідності власноручному підпису.", "example": "Підписання електронного акта через кваліфікованого надавача довірчих послуг.", "avoid": "«без нього документ недійсний» — закон вимагає КЕП лише в окремих випадках"}, {"term": "Електронна печатка", "definition": "Засіб підтвердження достовірності походження та цілісності електронного документа.", "example": "Печатка на автоматично сформованому документі облікової системи.", "avoid": "«підпис організації» — печатка підтверджує документ, а не особу"}, {"term": "Довірчий список", "definition": "Перелік кваліфікованих надавачів електронних довірчих послуг, за яким перевіряють статус надавача.", "example": "Звірка надавача, чий сертифікат стоїть на отриманому документі.", "avoid": "«реєстр підписів» — у списку надавачі послуг, а не підписи"}]}}]}</script>
  <script>
    "use strict";
    const DATA=JSON.parse(document.getElementById("course-data").textContent);
    const COURSE=DATA.course,MODULES=DATA.modules;
    const STORAGE_KEY="fop-course:"+COURSE.id+":v4";
    const STATE_VERSION=4;
    const LEGACY_RE=new RegExp("^fop-course:"+COURSE.id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+":module-[^:]+:v\\d+$");
    const DEFAULT_WEIGHTS={lesson:20,practice:30,case:25,checklist:10,quiz:15};
    const OPTIONAL_PAGES=["glossary"];
    const PAGES=[
      {id:"overview",title:"Огляд",kind:"overview"},{id:"guide",title:"Як навчатися",kind:"guide"},{id:"lesson",title:"Урок",kind:"lesson"},{id:"practice",title:"Практика",kind:"practice"},
      {id:"case",title:"Кейс",kind:"case"},{id:"checklist",title:"Чекліст",kind:"checklist"},{id:"glossary",title:"Глосарій",kind:"glossary"},
      {id:"reference",title:"Пам’ятка",kind:"content"},{id:"sources",title:"Джерела",kind:"content"},{id:"quiz",title:"Підсумковий квіз",kind:"quiz"}
    ];
    function moduleById(id){return MODULES.find(m=>m.id===id)||MODULES[0]}
    function section(m,id){return m.sections.find(item=>item.id===id)}
    function weights(m){return Object.assign({},DEFAULT_WEIGHTS,m.meta.progress_weights||{})}
    function quizThreshold(m){return m.meta.quiz_threshold||80}
    function noteMin(m){return m.activities.checklist.note_min_chars||3}
    function reasonMin(m){return m.activities.case.reasoning_min_chars||60}
    function blockingStatuses(m){return new Set((m.activities.checklist.statuses||[]).filter(s=>s.blocks_critical).map(s=>s.value))}
    function startOrder(m){const ids=m.activities.case.actions.map(x=>x.id),initial=Array.isArray(m.activities.case.initial_order)?m.activities.case.initial_order.filter(id=>ids.includes(id)):[];return initial.length===ids.length?initial.slice():ids.slice().reverse()}
    function freshModuleState(m){return{lessonAnswers:{},practice:{answers:{},result:null,hints:{}},caseWork:{selected:{},categories:{},owners:{},order:startOrder(m),reasoning:"",result:null,hints:{}},checklist:{},glossary:{seen:{},repeat:{}},quiz:{answers:{},index:0,showResult:false,bestScore:0,hints:{}}}}
    function freshState(){return{version:STATE_VERSION,view:"course",module:MODULES[0].id,page:"overview",modules:{},review:{},mission:""}}
    function loadState(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY));if(parsed&&parsed.version===STATE_VERSION&&parsed.modules){if(!parsed.review)parsed.review={};return parsed}}catch(_){}return freshState()}
    function legacyKeys(){const out=[];try{for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&LEGACY_RE.test(key))out.push(key)}}catch(_){}return out}
    let state=loadState();
    function stateOf(id){const m=moduleById(id);if(!state.modules[id])state.modules[id]=freshModuleState(m);const s=state.modules[id];if(!s.caseWork||!Array.isArray(s.caseWork.order)||s.caseWork.order.length!==m.activities.case.actions.length)s.caseWork=freshModuleState(m).caseWork;return s}
    function peekState(id){return state.modules[id]||freshModuleState(moduleById(id))}
    let view=state.view==="module"?"module":"course";
    let mod=moduleById(state.module);
    let ms=stateOf(mod.id);
    let current=PAGES.some(p=>p.id===state.page)?state.page:"overview";
    let dragIndex=null;
    function persist(){state.view=view;state.module=mod.id;state.page=current;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(_){}renderNav();renderProgress()}
    const REVIEW=Object.assign({intervals_days:[1,3,7,21],title:"Повторення"},COURSE.review||{});
    function todayISO(){const now=new Date();return new Date(now.getFullYear(),now.getMonth(),now.getDate()).toISOString().slice(0,10)}
    function addDays(iso,days){const date=new Date(iso+"T00:00:00");date.setDate(date.getDate()+days);return date.toISOString().slice(0,10)}
    function reviewStore(){return state.review||(state.review={})}
    function reviewKey(moduleId,kind,id){return moduleId+"::"+kind+"::"+id}
    function reviewAdd(moduleId,kind,id){const key=reviewKey(moduleId,kind,id),store=reviewStore();if(!store[key])store[key]={module:moduleId,kind,id:String(id),step:0,due:todayISO()}}
    function reviewDrop(moduleId,kind,id){delete reviewStore()[reviewKey(moduleId,kind,id)]}
    function reviewAll(){return Object.entries(reviewStore()).map(([key,item])=>Object.assign({key},item)).filter(item=>reviewContent(item))}
    function reviewDue(){const now=todayISO();return reviewAll().filter(item=>String(item.due)<=now)}
    function reviewPass(key){const item=reviewStore()[key];if(!item)return;const next=(item.step||0)+1;if(next>=REVIEW.intervals_days.length){delete reviewStore()[key];return}item.step=next;item.due=addDays(todayISO(),REVIEW.intervals_days[next])}
    function reviewFail(key){const item=reviewStore()[key];if(!item)return;item.step=0;item.due=addDays(todayISO(),REVIEW.intervals_days[0])}
    function reviewContent(item){const m=MODULES.find(x=>x.id===item.module);if(!m)return null;
      if(item.kind==="lesson"){const q=m.activities.lesson.find(x=>x.id===item.id);return q?{type:"question",module:m,question:q,label:"Мікроперевірка"}:null}
      if(item.kind==="quiz"){const q=m.quiz[Number(item.id)];return q?{type:"question",module:m,question:q,label:"Питання квізу"}:null}
      if(item.kind==="glossary"){const g=m.activities.glossary[Number(item.id)];return g?{type:"term",module:m,term:g,label:"Термін"}:null}
      if(item.kind==="practice"){const f=m.activities.practice.fields.find(x=>x.id===item.id);return f?{type:"field",module:m,field:f,label:"Реквізит картки"}:null}
      return null}
    function missionById(id){return (COURSE.missions||[]).find(x=>x.id===id)||null}
    function openReview(){view="review";state.reviewAnswer=null;persist();render();scrollTop()}
    function sessionOf(pageId){const sessions=mod.meta.sessions||[];const found=sessions.find(s=>(s.pages||[]).includes(pageId));return found?found.title:null}
    function escapeHtml(value){return String(value??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
    function inline(text){let v=escapeHtml(text);v=v.replace(/`([^`]+)`/g,"<code>$1</code>");v=v.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");v=v.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');v=v.replace(/\[(SRC-\d{3})\]/g,'<button type="button" class="src-ref" data-src="$1" title="Перейти до джерела $1">$1</button>');return v}
    function isTableSeparator(line){return /^\s*\|?\s*:?-{3,}/.test(line)&&line.includes("|")}
    function cells(line){return line.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()))}
    function renderMarkdown(markdown){const lines=markdown.replace(/\r/g,"").split("\n");const out=[];let i=0;const calloutMeta={REMEMBER:["remember","◆","Запам’ятайте"],PRINCIPLE:["principle","✓","Правильний принцип"],RISK:["risk","!","Ризик"],INFO:["info","i","Пояснення"]};while(i<lines.length){const line=lines[i];if(!line.trim()){i++;continue}
      const callout=line.match(/^>\s*\[!(REMEMBER|PRINCIPLE|RISK|INFO)\]\s*$/);if(callout){const body=[];i++;while(i<lines.length&&/^>/.test(lines[i])){body.push(lines[i].replace(/^>\s?/,""));i++}const [cls,icon,label]=calloutMeta[callout[1]];out.push(`<aside class="callout ${cls}"><div class="callout-title"><span aria-hidden="true">${icon}</span>${label}</div><div class="callout-body">${inline(body.join(" "))}</div></aside>`);continue}
      if(line.includes("|")&&i+1<lines.length&&isTableSeparator(lines[i+1])){const head=cells(line);i+=2;const rows=[];while(i<lines.length&&lines[i].includes("|")&&lines[i].trim()){rows.push(cells(lines[i]));i++}out.push('<div class="table-wrap"><table><thead><tr>'+head.map(c=>`<th>${c}</th>`).join("")+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join("")+'</tr>').join("")+'</tbody></table></div>');continue}
      const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);i++;continue}
      if(/^[-*]\s+/.test(line)){const items=[];while(i<lines.length&&/^[-*]\s+/.test(lines[i])){items.push(lines[i].replace(/^[-*]\s+/,""));i++}out.push("<ul>"+items.map(x=>`<li>${inline(x)}</li>`).join("")+"</ul>");continue}
      if(/^\d+\.\s+/.test(line)){const items=[];while(i<lines.length&&/^\d+\.\s+/.test(lines[i])){items.push(lines[i].replace(/^\d+\.\s+/,""));i++}out.push("<ol>"+items.map(x=>`<li>${inline(x)}</li>`).join("")+"</ol>");continue}
      const p=[line.trim()];i++;while(i<lines.length&&lines[i].trim()&&!/^(#{1,3})\s+|^[-*]\s+|^\d+\.\s+|^>\s*\[!/.test(lines[i])&&!(lines[i].includes("|")&&i+1<lines.length&&isTableSeparator(lines[i+1]))){p.push(lines[i].trim());i++}out.push(`<p>${inline(p.join(" "))}</p>`)}return out.join("\n")}
    function correctIndex(question){return question.options.findIndex(o=>o.correct)}
    function lessonDone(m,s){return m.activities.lesson.every(q=>s.lessonAnswers[q.id]===correctIndex(q))}
    function practiceDone(m,s){return Boolean(s.practice.result&&s.practice.result.percent>=m.activities.practice.threshold)}
    function caseDone(m,s){return Boolean(s.caseWork.result&&s.caseWork.result.percent>=m.activities.case.threshold)}
    function checklistIssue(m,s,item){const entry=s.checklist[item.id]||{};if(!entry.status)return "Виберіть статус, який відповідає фактичному стану роботи з цим пунктом.";if(item.critical&&blockingStatuses(m).has(entry.status))return "Критичний пункт не можна закрити цим статусом: спершу отримайте дані або підтвердження.";if(String(entry.note||"").trim().length<noteMin(m))return `Додайте обґрунтування щонайменше з ${noteMin(m)} символів: джерело підтвердження або наступну дію.`;return ""}
    function checklistItemValid(m,s,item){return !checklistIssue(m,s,item)}
    function checklistHintLevel(id){return (ms.checklistHints||{})[id]||0}
    function raiseChecklistHint(id){const store=ms.checklistHints||(ms.checklistHints={});store[id]=1;persist();render()}
    function quizHintLevel(index){return (ms.quiz.hints||{})[index]||0}
    function raiseQuizHint(index){const store=ms.quiz.hints||(ms.quiz.hints={});store[index]=1;persist();render()}
    function quizHintsUsed(){return Object.keys(ms.quiz.hints||{}).length}
    function checklistDone(m,s){return m.activities.checklist.items.every(item=>checklistItemValid(m,s,item))}
    function quizScore(m,s){return m.quiz.reduce((sum,q,i)=>sum+(s.quiz.answers[i]===correctIndex(q)?1:0),0)}
    function quizPercent(m,s){return Math.round(quizScore(m,s)/m.quiz.length*100)}
    function quizDone(m,s){return Boolean(s.quiz.showResult)&&quizPercent(m,s)>=quizThreshold(m)}
    function glossaryDone(m,s){return m.activities.glossary.every((_,index)=>Boolean(s.glossary.seen[index]))}
    function pageDone(m,s,id){return{overview:true,guide:true,lesson:lessonDone(m,s),practice:practiceDone(m,s),case:caseDone(m,s),checklist:checklistDone(m,s),glossary:glossaryDone(m,s),reference:true,sources:true,quiz:quizDone(m,s)}[id]||false}
    function progressOf(m,s){const w=weights(m);return Math.round((lessonDone(m,s)?w.lesson:0)+(practiceDone(m,s)?w.practice:0)+(caseDone(m,s)?w.case:0)+(checklistDone(m,s)?w.checklist:0)+(quizDone(m,s)?w.quiz:0))}
    function courseProgress(){return Math.round(MODULES.reduce((sum,m)=>sum+progressOf(m,peekState(m.id)),0)/MODULES.length)}
    function completedModules(){return MODULES.filter(m=>progressOf(m,peekState(m.id))===100).length}
    function renderProgress(){const percent=view==="course"?courseProgress():progressOf(mod,ms);document.getElementById("progress-fill").style.width=percent+"%";document.getElementById("progress-label").textContent=percent+"%";const track=document.querySelector('[role="progressbar"]');track.setAttribute("aria-valuenow",percent);track.setAttribute("aria-label",(view==="course"?"Прогрес курсу: ":"Прогрес модуля: ")+percent+"%");const badge=document.getElementById("module-state");badge.textContent=view==="course"?`${completedModules()} із ${MODULES.length} доступних модулів завершено`:`Курс: ${courseProgress()}%`;badge.className="chip "+(percent===100?"success":"")}
    function renderNav(){const list=document.getElementById("nav-list");list.innerHTML="";document.getElementById("nav-label").textContent=view==="course"?"Модулі курсу":"Навчальний маршрут";

    function renderContent(main){const page=PAGES.find(x=>x.id===current),card=document.createElement("article");card.className="card";card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Перевірені матеріали</p><h2>${escapeHtml(page.title)}</h2></div><span class="chip success">Актуально на ${escapeHtml(mod.meta.last_verified)}</span></div><div class="callout info"><div class="callout-title"><span>i</span>Як користуватися</div><div class="callout-body">Джерела потрібні для перевірки висновків. Не запам’ятовуйте номери статей механічно — навчіться знаходити підтвердження правила.</div></div><div class="markdown">${renderMarkdown(section(mod,current).content)}</div>`;if(current==="reference")card.appendChild(button("Роздрукувати пам’ятку","secondary-button",()=>window.print()));main.appendChild(card);addPageActions(main)}
    function renderQuiz(main){const quiz=ms.quiz,card=document.createElement("section");card.className="card";if(quiz.showResult){const score=quizScore(mod,ms),percent=quizPercent(mod,ms);quiz.bestScore=Math.max(quiz.bestScore||0,score);persist();card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Крок 5 · Підсумкова перевірка</p><h2>Результат квізу</h2></div>${statusChip(percent>=quizThreshold(mod),"Зараховано",`Потрібно ${quizThreshold(mod)}%`)}</div><div class="quiz-result"><div class="score-circle" style="--score:${percent}%"><span>${percent}%</span></div><div><p class="result-score">${score} із ${mod.quiz.length} правильних</p><p>Найкращий результат: ${quiz.bestScore} із ${mod.quiz.length}.${quizHintsUsed()?` Використано підказок: ${quizHintsUsed()} — на бал вони не впливають.`:""}</p></div></div>`;
      const review=document.createElement("div");review.className="competency-list";mod.quiz.forEach((q,i)=>{const right=quiz.answers[i]===correctIndex(q),chosen=quiz.answers[i],block=document.createElement("article");block.className="review-item"+(right?" is-correct":" is-wrong");block.innerHTML=`<div class="review-head"><span>${i+1}. ${escapeHtml(q.title)}</span><strong>${right?"✓ Правильно":"◆ Повторити"}</strong></div>${right?"":`<p class="review-line"><strong>Ваша відповідь:</strong> ${escapeHtml(chosen===undefined?"без відповіді":q.options[chosen].text)}</p><p class="review-line"><strong>Правильна відповідь:</strong> ${escapeHtml(q.options[correctIndex(q)].text)}</p><p class="review-line">${escapeHtml(q.explanation)}</p><div class="footer-note">Джерела: ${q.source_reference.map(escapeHtml).join(", ")}</div>`}`;if(!right)block.appendChild(button(`Переглянути питання ${i+1}`,"tonal-button",()=>{quiz.index=i;quiz.showResult=false;persist();render()}));review.appendChild(block)});card.appendChild(review);
      const actions=document.createElement("div");actions.className="quiz-actions";actions.appendChild(button("Пройти квіз ще раз","primary-button",()=>{ms.quiz={answers:{},index:0,showResult:false,bestScore:quiz.bestScore,hints:{}};persist();render()}));card.appendChild(actions);main.appendChild(card);addPageActions(main);return}
      const index=Math.min(quiz.index,mod.quiz.length-1),q=mod.quiz[index],chosen=quiz.answers[index],correct=correctIndex(q);card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Крок 5 · Підсумковий квіз</p><h2>Сценарні питання</h2></div><span class="chip">Питання ${index+1} із ${mod.quiz.length}</span></div><div class="question-number">Компетенція: ${escapeHtml(q.competency)}</div><h3 class="question-title">${escapeHtml(q.title)}</h3><p class="scenario">${escapeHtml(q.scenario)}</p><p class="question-text">${escapeHtml(q.question)}</p>`;
      if(q.hint&&chosen===undefined){const tools=document.createElement("div");tools.className="hint-bar";if(!quizHintLevel(index))tools.appendChild(button("Підказка","tonal-button",()=>raiseQuizHint(index)));else tools.insertAdjacentHTML("beforeend",hintBlock("Навідне питання",[q.hint]));card.appendChild(tools)}
      const options=document.createElement("div");options.className="options";q.options.forEach((o,i)=>{const b=button(o.text,"option-button",()=>{quiz.answers[index]=i;if(i!==correct)reviewAdd(mod.id,"quiz",index);persist();render()});if(chosen!==undefined){b.disabled=true;if(i===correct)b.classList.add("correct");if(i===chosen&&i!==correct)b.classList.add("wrong")}options.appendChild(b)});card.appendChild(options);if(chosen!==undefined){const fb=document.createElement("div");fb.className="feedback "+(chosen===correct?"correct":"wrong");fb.setAttribute("role","status");fb.innerHTML=`<strong>${chosen===correct?"Правильно":"Відповідь неправильна"}</strong><p>${escapeHtml(q.options[chosen].feedback)}</p><div class="feedback-list">${q.options.map((o,i)=>`<div class="feedback-item"><strong>${i===correct?"✓ Правильний варіант":"Дистрактор"}</strong>${escapeHtml(o.text)}<br>${escapeHtml(o.feedback)}</div>`).join("")}</div><p><strong>Глибше пояснення</strong>${escapeHtml(q.explanation)}</p><div class="footer-note">Джерела: ${q.source_reference.map(escapeHtml).join(", ")}</div>`;card.appendChild(fb);const actions=document.createElement("div");actions.className="quiz-actions";actions.appendChild(button(index===mod.quiz.length-1?"Показати результат":"Наступне питання","primary-button",()=>{if(index===mod.quiz.length-1)quiz.showResult=true;else quiz.index=index+1;persist();render()}));if(index>0)actions.appendChild(button("Попереднє питання","secondary-button",()=>{quiz.index=index-1;persist();render()}));actions.appendChild(button("Спробувати це питання ще раз","tonal-button",()=>{delete quiz.answers[index];persist();render()}));card.appendChild(actions)}main.appendChild(card);addPageActions(main)}
    function renderPrecheck(main){const items=mod.activities.precheck||[];if(!items.length)return;const card=document.createElement("section");card.className="card compact";card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Перед читанням</p><h2>Спробуйте вгадати</h2></div><span class="chip">не впливає на прогрес</span></div><p class="section-intro">Дайте відповідь до того, як прочитаєте урок. Помилитися тут корисно: спроба пригадати робить наступне читання значно ефективнішим.</p>`;
      items.forEach((item,index)=>{const chosen=(ms.precheck||{})[item.id],correct=correctIndex(item),block=document.createElement("article");block.className="activity-card"+(chosen===undefined?"":" is-neutral");block.innerHTML=`<div class="activity-label">Припущення ${index+1} із ${items.length}</div><h3>${escapeHtml(item.question)}</h3>`;
        const options=document.createElement("div");options.className="options";item.options.forEach((option,i)=>{const b=button(option.text,"option-button",()=>{const store=ms.precheck||(ms.precheck={});store[item.id]=i;persist();render()});if(chosen!==undefined){b.disabled=true;if(i===chosen)b.classList.add(i===correct?"correct":"wrong")}options.appendChild(b)});block.appendChild(options);
        if(chosen!==undefined)block.insertAdjacentHTML("beforeend",`<div class="feedback ${chosen===correct?"correct":"wrong"}" role="status"><strong>${chosen===correct?"Схоже, ви це вже відчуваєте":"Тут інтуїція підводить більшість"}</strong><p>${escapeHtml(item.note)}</p></div>`);
        card.appendChild(block)});
      main.appendChild(card)}
    function renderReview(main){const due=reviewDue(),all=reviewAll(),hero=document.createElement("section");hero.className="hero";hero.innerHTML=`<div class="eyebrow">${escapeHtml(REVIEW.title)}</div><h1>Повернення до складного</h1><p class="lead">Пригадування через проміжки часу дає довготривале запам’ятовування, якого не дає одноразове проходження. Сюди автоматично потрапляє те, у чому ви помилилися, і терміни, які ви позначили складними.</p><div class="meta-row"><span class="chip${due.length?" warning":" success"}">${due.length?`До повторення сьогодні: ${due.length}`:"На сьогодні все повторено"}</span><span class="chip">Усього в черзі: ${all.length}</span></div>`;main.appendChild(hero);
      if(due.length){const item=due[0],content=reviewContent(item),card=document.createElement("section");card.className="card";card.innerHTML=`<div class="section-head"><div><p class="section-kicker">${escapeHtml(content.label)} · ${escapeHtml(content.module.meta.title)}</p><h2>Пригадайте відповідь</h2></div><span class="chip">Залишилось ${due.length}</span></div>`;
        const answered=state.reviewAnswer&&state.reviewAnswer.key===item.key?state.reviewAnswer:null;
        if(content.type==="question"){const q=content.question,correct=correctIndex(q);card.insertAdjacentHTML("beforeend",`<p class="scenario">${escapeHtml(q.scenario||"")}</p><h3>${escapeHtml(q.question)}</h3>`);
          const options=document.createElement("div");options.className="options";q.options.forEach((option,i)=>{const b=button(option.text,"option-button",()=>{state.reviewAnswer={key:item.key,chosen:i,ok:i===correct};if(i===correct)reviewPass(item.key);else reviewFail(item.key);persist();render()});if(answered){b.disabled=true;if(i===correct)b.classList.add("correct");if(i===answered.chosen&&i!==correct)b.classList.add("wrong")}options.appendChild(b)});card.appendChild(options);
          if(answered)card.insertAdjacentHTML("beforeend",`<div class="feedback ${answered.ok?"correct":"wrong"}" role="status"><strong>${answered.ok?"Правильно — повернемося пізніше":"Ще раз завтра"}</strong><p>${escapeHtml(q.options[answered.chosen].feedback||q.explanation||"")}</p></div>`)}
        else if(content.type==="term"){card.insertAdjacentHTML("beforeend",`<h3>${escapeHtml(content.term.term)}</h3><p class="section-intro">Сформулюйте визначення своїми словами, потім перевірте себе.</p>${answered?`<div class="feedback correct" role="status"><p>${escapeHtml(content.term.definition)}</p><p><strong>Приклад:</strong> ${escapeHtml(content.term.example)}</p>${content.term.avoid?`<p class="footer-note">Так не кажіть: ${escapeHtml(content.term.avoid)}</p>`:""}</div>`:""}`);
          const row=document.createElement("div");row.className="activity-actions";
          if(!answered)row.appendChild(button("Показати визначення","primary-button",()=>{state.reviewAnswer={key:item.key,chosen:-1,ok:true};persist();render()}));
          else{row.appendChild(button("Знав — відкласти надовше","primary-button",()=>{reviewPass(item.key);state.reviewAnswer=null;persist();render()}));row.appendChild(button("Не згадав — повторити завтра","secondary-button",()=>{reviewFail(item.key);state.reviewAnswer=null;persist();render()}))}
          card.appendChild(row)}
        else{const field=content.field;card.insertAdjacentHTML("beforeend",`<h3>${escapeHtml(field.label)}</h3><p class="section-intro">Пригадайте, з якого джерела береться цей реквізит і що робити, якщо його немає в документах.</p>${answered?`<div class="feedback ${answered.ok?"correct":"wrong"}" role="status"><strong>${answered.ok?"Правильно":"Ще раз завтра"}</strong><p>${escapeHtml(field.hint)}</p><p class="footer-note">${escapeHtml(field.example)}</p></div>`:""}`);
          if(!answered){const input=document.createElement("input");input.className="text-input";input.id="review-input";input.placeholder=field.mode==="known"?"Введіть значення":"Напишіть, що робити, якщо даних немає";card.appendChild(input);
            const row=document.createElement("div");row.className="activity-actions";row.appendChild(button("Перевірити","primary-button",()=>{const value=document.getElementById("review-input").value;const ok=field.mode==="known"?matches(field,value):String(value).trim().length>=10;state.reviewAnswer={key:item.key,chosen:-1,ok};if(ok)reviewPass(item.key);else reviewFail(item.key);persist();render()}));card.appendChild(row)}}
        if(answered&&content.type!=="term"){const row=document.createElement("div");row.className="activity-actions";row.appendChild(button(due.length>1?"Наступне повторення":"Завершити повторення","primary-button",()=>{state.reviewAnswer=null;persist();render()}));row.appendChild(button("Відкрити модуль","secondary-button",()=>{state.reviewAnswer=null;openModule(content.module.id)}));card.appendChild(row)}
        main.appendChild(card)}
      const weak=document.createElement("section");weak.className="card";const groups={};all.forEach(item=>{const content=reviewContent(item);if(!content)return;const key=content.module.meta.title;(groups[key]=groups[key]||[]).push({item,content})});
      weak.innerHTML=`<div class="section-head"><div><p class="section-kicker">Журнал</p><h2>Ваші слабкі місця</h2></div><span class="chip">${all.length} позицій</span></div>`;
      if(!all.length)weak.insertAdjacentHTML("beforeend",'<p class="section-intro">Тут з’являється те, у чому ви помилилися, і терміни, позначені складними. Поки що список порожній.</p>');
      else Object.entries(groups).forEach(([title,list])=>{weak.insertAdjacentHTML("beforeend",`<h3>${escapeHtml(title)}</h3><div class="review-list">${list.map(({item,content})=>`<div class="review-line"><strong>${escapeHtml(content.label)}:</strong> ${escapeHtml(content.type==="question"?content.question.question:content.type==="term"?content.term.term:content.field.label)} <span class="footer-note">повторення ${String(item.due)>todayISO()?"з "+item.due:"сьогодні"}</span></div>`).join("")}</div>`)});
      main.appendChild(weak);
      const actions=document.createElement("div");actions.className="page-actions";actions.appendChild(button("← Усі модулі","secondary-button",openCourse));if(all.length)actions.appendChild(button("Очистити чергу повторення","danger-button",()=>{if(confirm("Видалити всі позиції з черги повторення?")){state.review={};state.reviewAnswer=null;persist();render()}}));main.appendChild(actions)}
    function wireSourceRefs(){document.querySelectorAll("#main .src-ref").forEach(node=>node.addEventListener("click",()=>{if(view==="module")go("sources")}))}
    function render(){const main=document.getElementById("main");main.innerHTML="";
      if(view==="review"){document.title=REVIEW.title+" — "+COURSE.title;renderReview(main);renderNav();renderProgress();wireSourceRefs();return}
      if(view==="course"){document.title=COURSE.title;renderCourse(main);renderNav();renderProgress();wireSourceRefs();return}
      document.title=`${mod.meta.title} — Бухгалтер ФОП`;const page=PAGES.find(p=>p.id===current)||PAGES[0];
      if(page.kind==="overview")renderOverview(main);else if(page.kind==="guide")renderGuide(main);else if(page.kind==="lesson")renderLesson(main);else if(page.kind==="practice")renderPractice(main);else if(page.kind==="case")renderCase(main);else if(page.kind==="checklist")renderChecklist(main);else if(page.kind==="glossary")renderGlossary(main);else if(page.kind==="quiz")renderQuiz(main);else renderContent(main);renderNav();renderProgress();wireSourceRefs()}
    document.getElementById("version").textContent=`${COURSE.version} · оновлено ${COURSE.updated}`;render();
  </script>
</body>
</html>
