ew", "guide", "lesson"]}, {"title": "Сесія 2 · Ліміти й потреба в реєстраторі", "minutes": 20, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Повернення, звіти, санкції", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви точно знатимете, чи потрібен вам реєстратор, і не покладатиметеся на застарілі поради про звільнення за обсягом доходу.", "accountant": "Ви працюєте з клієнтами: модуль дає перевірку потреби в реєстраторі як процедуру й розводить два готівкові ліміти, які плутають найчастіше.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете поставити конкретне питання про реєстратор і оцінити, чи спирається відповідь на чинну норму."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Готівка, РРО і ПРРО\n\n## Мета\n\nНавчитися відповідати на два питання, від яких залежать штрафи: чи можна прийняти цю суму готівкою і чи потрібен при цьому розрахунковий документ через реєстратор.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. назвати граничні суми готівкових розрахунків і сторони, між якими вони діють;\n2. визначити, чи потрібен РРО або ПРРО в конкретній ситуації;\n3. пояснити, чому оплата на особисту картку створює одразу два порушення;\n4. назвати обовʼязкові дії при поверненні коштів покупцеві;\n5. назвати розмір фінансових санкцій за непроведення розрахунку через реєстратор.\n\n## Передумови\n\nМодулі 8 і 9. Модуль 8 дав розуміння розрахункової операції, модуль 9 — класифікацію надходжень. Тут додається питання, якого раніше не було: чи потрібен був документ у момент розрахунку.\n\n## Основні терміни\n\n- **Розрахункова операція** — приймання оплати за товар чи послугу в готівковій або безготівковій формі. [SRC-075]\n- **Розрахунковий документ** — документ встановленої форми, що підтверджує факт продажу або отримання коштів. [SRC-052]\n- **РРО** — реєстратор розрахункових операцій, переведений у фіскальний режим. [SRC-075]\n- **ПРРО** — програмний реєстратор розрахункових операцій, зареєстрований фіскальним сервером. [SRC-075]\n- **Фіскальний чек** — розрахунковий документ з обовʼязковими реквізитами, встановленими наказом Мінфіну. [SRC-053]\n\n## Теоретичний матеріал\n\n### 1. Найважливіше речення модуля\n\nРеєстратори розрахункових операцій та програмні реєстратори **не застосовуються платниками єдиного податку першої групи**. [SRC-076]\n\nЦе весь текст норми. У ньому немає ані другої групи, ані третьої, ані обсягу доходу, ані переліку видів діяльності.\n\n> [!RISK]\n> Усе, що ви могли читати про звільнення від РРО для другої й третьої груп «до певного обсягу доходу», стосується редакцій, які вже не діють. Норма в чинній редакції складається з одного речення й називає **лише першу групу**. [SRC-076]\n\nЗакон про РРО підтверджує це з іншого боку: реєстратори не застосовуються при продажу товарів або наданні послуг платниками єдиного податку, які не застосовують їх **відповідно до Податкового кодексу**. [SRC-075] Тобто перелік винятків для єдинників живе не в Законі про РРО, а в Кодексі — і містить одну групу.\n\n### 2. Розрахункова операція буває й безготівковою\n\nДруге переконання, яке треба зруйнувати одразу.\n\nОбовʼязки встановлено для субʼєктів господарювання, які здійснюють розрахункові операції **в готівковій та/або в безготівковій формі** — із застосуванням електронних платіжних засобів, платіжних чеків, жетонів тощо — при продажу товарів і наданні послуг, а також операції з приймання готівки для виконання платіжної операції. [SRC-075]\n\nТому оплата карткою через термінал, оплата через інтернет-еквайринг і оплата платіжним застосунком — це розрахункові операції, і питання про реєстратор виникає в кожному випадку.\n\nЩо **не** є розрахунковою операцією в цьому сенсі: переказ коштів з рахунку на рахунок за платіжною інструкцією, коли покупець сам ініціює платіж у своєму банку.\n\n### 3. Що зобовʼязаний робити субʼєкт із розрахунковими операціями\n\nПерелік обовʼязків із Закону: [SRC-075]\n\n1. проводити розрахункові операції **на повну суму** покупки через зареєстровані, опломбовані й переведені у фіскальний режим РРО або через зареєстровані фіскальним сервером ПРРО зі створенням розрахункових документів;\n2. **видавати розрахунковий документ** установленої форми на повну суму операції — у паперовій та/або електронній формі, у тому числі при замовленні чи оплаті через інтернет;\n3. застосовувати лише ті реєстратори, що включені до Державного реєстру;\n4. забезпечувати цілісність пломб і незмінність конструкції та програмного забезпечення;\n5. зберігати використані книги обліку розрахункових операцій і розрахункові книжки протягом **трьох років**;\n6. подавати звітність, повʼязану із застосуванням реєстратора.\n\nОкрема норма для ФОП: платники єдиного податку, **не зареєстровані платниками ПДВ**, мають право зазначати в розрахунковому документі назву товару або послуги у вигляді, що відображає споживчі ознаки й ідентифікує належність до товарної групи. [SRC-075] Це послаблення не діє для підакцизних товарів, технічно складних побутових товарів, ліків, виробів медичного призначення та ювелірних виробів. [SRC-075]\n\n### 4. Готівкові ліміти: дві різні суми\n\nТут плутають найчастіше, бо сум справді дві. [SRC-074]\n\n| Хто з ким | Гранична сума |\n|---|---|\n| Субʼєкти господарювання **між собою** | **10 000 грн** включно |\n| Субʼєкт господарювання **з фізичною особою** | **50 000 грн** включно |\n| Фізичні особи між собою за договорами, що підлягають нотаріальному посвідченню | 50 000 грн включно |\n\nОбмеження для розрахунків із фізичними особами діє **протягом одного дня за одним або кількома платіжними документами**. [SRC-074] Тобто розбити суму на кілька платежів одного дня не можна.\n\nПлатежі понад граничну суму проводяться **через надавачів платіжних послуг**: переказом з рахунку на рахунок або внесенням коштів до каси надавача для подальшого переказу. [SRC-074]\n\n> [!REMEMBER]\n> 10 000 — з підприємцями й компаніями. 50 000 — з людьми. Обидві суми «включно», і обидві рахуються за день, а не за операцію.\n\n### 5. Касова книга: ФОП її не веде\n\nПряма норма, яка знімає багато зайвої роботи: **фізичні особи-підприємці касової книги не ведуть**. [SRC-074]\n\nЦе не звільняє від обовʼязку застосовувати РРО там, де він потрібен, і не скасовує обліку доходів. Але прибуткові й видаткові касові ордери, журнал їх реєстрації та касова книга — інструменти підприємств, а не ФОП.\n\n### 6. Фіскальний чек\n\nРозрахунковий документ — документ **встановленої форми та змісту**, що підтверджує факт продажу або повернення товарів, надання послуг, отримання чи повернення коштів. До них належать касовий чек, товарний чек, видатковий чек, розрахункова квитанція, проїзний документ. [SRC-052]\n\nОбовʼязкові реквізити фіскального чека встановлює окремий наказ Мінфіну: найменування субʼєкта господарювання, назва й адреса господарської одиниці, податковий номер або індивідуальний податковий номер платника ПДВ, назва товару чи послуги з вартістю, і низка інших. [SRC-053]\n\nЧек створюється в паперовій та/або електронній формі. [SRC-052] Електронний чек можна надати, зокрема, відображенням QR-коду для зчитування або надсиланням на наданий покупцем номер чи адресу електронної пошти. [SRC-075]\n\n### 7. Коли РРО не потрібен\n\nЗакон перелічує випадки незастосування реєстраторів. Для ФОП практично значущі два: [SRC-075]\n\n- **продаж товарів або надання послуг платниками єдиного податку, які не застосовують реєстратори відповідно до Податкового кодексу** — тобто перша група; [SRC-076]\n- банківські операції, крім прямо названих винятків.\n\nПерший пункт переліку — торгівля продукцією власного виробництва — стосується **підприємств, установ і організацій**, які оформлюють розрахунки касовими ордерами в касах, і на ФОП не поширюється. [SRC-075]\n\n> [!RISK]\n> «Я продаю власну продукцію, значить РРО не потрібен» — типова помилка, побудована на першому пункті переліку. Він адресований підприємствам, а не підприємцям, і прямо виключає підприємства торгівлі та громадського харчування. [SRC-075]\n\n### 8. Оплата на особисту картку: два порушення одразу\n\nСитуація з модуля 8 тут отримує другий шар.\n\n**Перше порушення** — режим рахунку: використовувати рахунок для власних потреб у підприємницькій діяльності заборонено. [SRC-021]\n\n**Друге порушення** — розрахункова операція без розрахункового документа: приймання оплати за товар чи послугу є розрахунковою операцією незалежно від того, на який рахунок прийшли кошти, і потребує видачі розрахункового документа, якщо на підприємця поширюється обовʼязок застосовувати реєстратор. [SRC-075]\n\nТобто «прийняти на картку, а потім показати в доході» не вирішує проблему, а лише додає до неї облікову частину.\n\n### 9. Повернення коштів покупцеві\n\nОбовʼязок видати розрахунковий документ виникає й тоді, коли особа **повертає товар або відмовляється від послуги**: документ видається на повну суму операції. [SRC-052] [SRC-075]\n\nРозрахунковий документ за визначенням підтверджує і факт продажу, і факт **повернення** товарів чи коштів. [SRC-052]\n\nДля обліку доходу діє норма з модуля 9: сума, що повертається покупцю у звʼязку з поверненням товару, розірванням договору або за листом-заявою, до доходу не включається. [SRC-010] Це два різні обовʼязки, і виконувати треба обидва.\n\n### 10. Z-звіт і зміна\n\nСубʼєкти, які використовують РРО, подають до контролюючих органів електронні копії розрахункових документів і **фіскальних звітних чеків**, що містяться на контрольній стрічці. [SRC-075] Ті, хто використовує ПРРО, передають електронні копії розрахункових документів, електронні фіскальні звіти й звітні чеки засобами самого програмного реєстратора. [SRC-075]\n\nДля відокремлених підрозділів підприємств, які працюють із РРО без ведення касової книги, оприбуткуванням готівки є забезпечення зберігання **щоденних фіскальних звітних чеків** — Z-звітів — в електронній формі. [SRC-074] Для ФОП це орієнтир практики: щоденний фіскальний звітний чек є основним підсумковим документом дня.\n\n### 11. Санкції\n\nЗа непроведення розрахункової операції через реєстратор, проведення її на неповну суму або невидачу розрахункового документа: [SRC-075]\n\n- **100% суми** продажу, здійсненого з порушенням, — за порушення, вчинене вперше;\n- **150% суми** — за кожне наступне порушення.\n\nОкремо: пʼятдесят неоподатковуваних мінімумів доходів громадян — якщо субʼєкт не використовує, використовує незареєстровані або не зберігає протягом установленого строку книги обліку розрахункових операцій і розрахункові книжки. [SRC-075]\n\n> [!PRINCIPLE]\n> Санкція рахується **від суми продажу**, а не є фіксованою. Тому питання «чи потрібен мені реєстратор» коштує рівно стільки, скільки ви продаєте.\n\n## Покроковий процес\n\nПеревірка ситуації на потребу в реєстраторі:\n\n1. Визначити, чи є операція розрахунковою: приймання оплати за товар або послугу.\n2. Перевірити форму: готівка, картка, інтернет-еквайринг — усе це розрахункові операції.\n3. Перевірити групу єдиного податку: звільнення має лише перша.\n4. Якщо звільнення немає — реєстратор потрібен, і документ видається на повну суму.\n5. Перевірити, чи зареєстровано реєстратор належним чином.\n6. Для готівки окремо перевірити граничну суму: 10 000 або 50 000 залежно від сторони.\n7. Перевірити, чи не розбито суму на кілька платежів одного дня.\n8. Для повернень — видати розрахунковий документ і окремо відобразити в обліку доходу.\n9. Зберігати щоденні фіскальні звітні чеки.\n10. Спірні ситуації передати бухгалтеру до, а не після операції.\n\n## Практичні приклади\n\n### Приклад 1. Друга група і термінал\n\nФОП другої групи приймає оплату карткою через термінал. Звільнення від реєстраторів має лише перша група. [SRC-076] Оплата карткою є розрахунковою операцією. [SRC-075] Отже, реєстратор потрібен.\n\n### Приклад 2. Готівка від підприємця\n\nІнший ФОП хоче розрахуватися готівкою на 14 000 грн. Гранична сума між субʼєктами господарювання — 10 000 грн. [SRC-074] Різницю треба провести через рахунок, а не приймати частинами того ж дня.\n\n### Приклад 3. Повернення без документа\n\nПокупець повернув товар, гроші віддано з каси без розрахункового документа. Обовʼязок видати документ виникає й при поверненні. [SRC-052] [SRC-075]\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Вважати, що звільнення від РРО має друга або третя група | норма називає лише першу групу [SRC-076] | перевірити чинну редакцію |\n| Вважати, що безготівкова оплата знімає питання реєстратора | закон говорить і про безготівкову форму [SRC-075] | застосовувати реєстратор і при оплаті карткою |\n| Спиратися на пункт про продукцію власного виробництва | він адресований підприємствам і установам [SRC-075] | перевіряти пункт про єдинників |\n| Плутати ліміти 10 000 і 50 000 | суми стосуються різних сторін [SRC-074] | дивитися, хто друга сторона |\n| Розбивати суму на кілька платежів одного дня | обмеження діє за день, а не за операцію [SRC-074] | проводити надлишок через рахунок |\n| Вести касову книгу «про всяк випадок» | ФОП касової книги не ведуть [SRC-074] | не створювати зайвої роботи |\n| Не видавати документ при поверненні | документ підтверджує і повернення [SRC-052] | видавати на повну суму операції |\n| Приймати оплату на особисту картку | режим рахунку [SRC-021] плюс відсутність документа [SRC-075] | приймати на підприємницький рахунок із реєстратором |\n| Вважати санкцію фіксованою | вона рахується від суми продажу [SRC-075] | оцінювати ризик у відсотках від обороту |\n| Не зберігати книги обліку розрахункових операцій | строк зберігання — три роки [SRC-075] | зберігати після закінчення книги |\n\n## Ризики й межі самостійних дій\n\n- Модуль **не описує моделі реєстраторів, застосунки й порядок реєстрації**: інтерфейси змінюються, а норма — ні. Вибір конкретного рішення — окреме питання.\n- Порядок реєстрації ПРРО в Електронному кабінеті — модуль 20.\n- Звітність, повʼязана із застосуванням реєстратора, і податковий календар — модулі 18 і 19.\n- Класифікація надходжень і склад доходу — модуль 9.\n- Валютні розрахунки й ЗЕД — модуль 17.\n- Перелік винятків із застосування реєстраторів у Законі містить пункти, не значущі для типового ФОП; модуль наводить лише ті, що стосуються підприємців.\n- Спірні ситуації (змішані види діяльності, окремі господарські одиниці) — компетенція бухгалтера.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, щоб оцінити потребу в реєстраторі для конкретної діяльності, побудувати порядок роботи з поверненнями й перевірити повноту фіскальних звітних чеків.\n\n**Юрист потрібен**, якщо застосовано фінансові санкції за Законом про РРО або якщо йдеться про оскарження результатів фактичної перевірки.\n\n## Підсумок\n\nДва питання визначають усе: чи є операція розрахунковою і чи маєте ви звільнення. Розрахунковою є й безготівкова оплата карткою, а звільнення з-поміж єдинників має **лише перша група**. Готівкові ліміти — це дві різні суми для різних сторін, і рахуються вони за день. Касову книгу ФОП не веде. А санкція за непроведення розрахунку через реєстратор рахується від суми продажу, тому ціна помилки прямо пропорційна обороту.\n\n## Самоперевірка\n\n1. Які платники єдиного податку не застосовують реєстратори?\n2. Чи є оплата карткою розрахунковою операцією?\n3. Назвіть дві граничні суми готівкових розрахунків і сторони для кожної.\n4. За який період рахується обмеження на розрахунки з фізичною особою?\n5. Чи веде ФОП касову книгу?\n6. Що таке розрахунковий документ і які його види?\n7. Кому адресований пункт про продукцію власного виробництва?\n8. Які обовʼязки виникають при поверненні товару покупцем?\n9. Скільки років зберігаються книги обліку розрахункових операцій?\n10. Який розмір санкції за непроведення розрахунку через реєстратор?\n\n## Джерела\n\nПерелік джерел і твердження, які вони підтверджують, — у `references.md`. Використані ідентифікатори: SRC-010, SRC-021, SRC-052, SRC-053, SRC-072, SRC-074, SRC-075, SRC-076.\n\n## Дата перевірки актуальності\n\nДата перевірки актуальності: **2026-09-07**\nНаступна перевірка: **2026-11-01**"}, {"id": "practice", "title": "Практика", "content": "# Практика: чи потрібен реєстратор\n\n## Мета\n\nНавчитися для кожної ситуації відповідати на два питання: чи є це розрахунковою операцією і чи звільнений підприємець від застосування реєстратора.\n\n## Навчальна ситуація\n\nДані синтетичні. Не використовуйте реальні відомості про себе чи клієнтів.\n\n**ФОП Гнатюк Сергій Павлович**, **друга група** єдиного податку, не платник ПДВ. Майстерня з ремонту велосипедів і продажу запчастин.\n\nСитуації за тиждень:\n\n| № | Ситуація | Сума |\n|---|---|---|\n| 1 | Клієнт-фізична особа платить готівкою за ремонт | 1 800 грн |\n| 2 | Клієнт платить карткою через термінал у майстерні | 3 400 грн |\n| 3 | Клієнт оплачує замовлення на сайті через інтернет-еквайринг | 2 100 грн |\n| 4 | ТОВ «Колесо» переказує кошти платіжною інструкцією зі свого рахунку | 22 000 грн |\n| 5 | Інший ФОП хоче розрахуватися готівкою за партію запчастин | 14 000 грн |\n| 6 | Клієнт-фізична особа платить готівкою за велосипед | 47 000 грн |\n| 7 | Клієнт повертає запчастину, гроші повертають із каси | 900 грн |\n| 8 | Клієнт переказує оплату на особисту картку підприємця | 2 500 грн |\n\n## Завдання 1. Оцініть кожну ситуацію\n\nДля кожної ситуації дайте висновок і вкажіть джерело. Використовуйте короткі відповіді:\n\n- **реєстратор** — розрахункова операція, потрібен РРО або ПРРО;\n- **без реєстратора** — не є розрахунковою операцією в цьому сенсі;\n- **ліміт** — порушено граничну суму готівкових розрахунків;\n- **два порушення** — і режим рахунку, і відсутність розрахункового документа.\n\n## Завдання 2. Дайте відповідь на чотири питання про норми\n\n1. Платники якої групи єдиного податку не застосовують реєстратори?\n2. Яка гранична сума готівкових розрахунків між субʼєктами господарювання?\n3. Яка гранична сума готівкових розрахунків із фізичною особою?\n4. Скільки відсотків суми становить санкція за перше порушення?\n\n## Завдання 3. Знайдіть питання, яке не вирішується з наданих даних\n\nОдну ситуацію неможливо оцінити без додаткових відомостей про порядок роботи підприємця. Позначте її як таку, що потребує окремої перевірки.\n\n## Критерії виконання\n\n- кожна ситуація має висновок із зазначеним джерелом;\n- безготівкові розрахункові операції не віднесено до тих, де реєстратор не потрібен;\n- два готівкові ліміти застосовано до правильних сторін;\n- ситуація, яку неможливо оцінити, не заповнена припущенням."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Чек, якого не було»\n\n## Ситуація\n\nІрина — ФОП **другої групи**, продає та ремонтує кавове обладнання. Готується до фактичної перевірки й перевіряє, як працювала майстерня останні півроку.\n\n- реєстратора немає: Ірина спиралася на пораду зі старої статті про звільнення другої групи за обсягом доходу;\n- оплату карткою через термінал приймали щодня — вважали, що безготівкова оплата реєстратора не потребує;\n- один клієнт-ФОП розрахувався готівкою на 14 000 грн за партію кавомашин;\n- фізична особа купила обладнання за 47 000 грн готівкою;\n- при поверненні товару гроші видавали з каси без жодного документа;\n- касову книгу вели «про всяк випадок», витрачаючи на неї час щотижня;\n- один клієнт переказав 2 500 грн на особисту картку Ірини;\n- частину клієнтів обслуговували за переказами з їхніх рахунків платіжними інструкціями.\n\nДані синтетичні.\n\n## Завдання\n\n1. Знайдіть справжні ризики й відокремте їх від того, що лише виглядає проблемою.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Побудуйте безпечну послідовність дій.\n4. Поясніть, чому «безготівкова оплата не потребує реєстратора» — найдорожча помилка цього списку.\n\n## Орієнтир для самоперевірки\n\n- звільнення від застосування реєстраторів має **лише перша група**; жодних порогів за обсягом доходу в чинній нормі немає;\n- розрахунковими є операції в готівковій **та безготівковій** формі із застосуванням платіжних інструментів;\n- санкція рахується від суми продажу: 100% за перше порушення й 150% за кожне наступне;\n- гранична сума готівки між субʼєктами господарювання — 10 000 грн, тому 14 000 грн порушують ліміт;\n- 47 000 грн від фізичної особи в ліміт вкладаються, але розрахунковий документ усе одно потрібен;\n- документ видається й при поверненні товару — на повну суму операції;\n- ФОП касової книги не ведуть, тому цей час витрачався даремно;\n- переказ клієнта зі свого рахунку платіжною інструкцією розрахунковою операцією в цьому сенсі не є.\n\nЦе навчальний кейс, а не індивідуальна податкова консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст готівки й розрахункових документів\n\n## Чи потрібен реєстратор\n\n- [ ] Визначено групу єдиного податку й перевірено звільнення за чинною нормою.\n- [ ] Перелічено всі способи, якими підприємець приймає оплату.\n- [ ] Безготівкові способи оцінено як розрахункові операції, а не як виняток.\n- [ ] Для кожного способу є висновок: потрібен реєстратор чи ні.\n\n## Розрахунковий документ\n\n- [ ] Документ видається на повну суму кожної розрахункової операції.\n- [ ] Форма видачі узгоджена з покупцем: паперова або електронна.\n- [ ] При поверненнях документ також видається.\n- [ ] Реєстратор зареєстровано належним чином і включено до державного реєстру.\n\n## Готівка\n\n- [ ] Розрахунки з підприємцями й компаніями не перевищують 10 000 грн на день.\n- [ ] Розрахунки з фізичними особами не перевищують 50 000 грн на день.\n- [ ] Суми не розбиваються на кілька платежів одного дня для обходу ліміту.\n- [ ] Надлишок понад ліміт проводиться через надавача платіжних послуг.\n\n## Режим рахунку\n\n- [ ] Оплати не приймаються на особисту картку підприємця.\n- [ ] Клієнтам надано реквізити підприємницького рахунку.\n\n## Звіти й зберігання\n\n- [ ] Щоденні фіскальні звітні чеки зберігаються.\n- [ ] Книги обліку розрахункових операцій, якщо вони є, зберігаються три роки.\n- [ ] Касова книга не ведеться як зайва для ФОП робота.\n- [ ] Спірні ситуації передано бухгалтеру до операції, а не після неї."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 10\n\n**Розрахункова операція** — приймання оплати за товар або послугу в готівковій та/або безготівковій формі, а також операції з приймання готівки для виконання платіжної операції.\n\n**Розрахунковий документ** — документ встановленої форми та змісту, що підтверджує факт продажу або повернення товарів, надання послуг, отримання чи повернення коштів.\n\n**РРО** — реєстратор розрахункових операцій: зареєстрований, опломбований і переведений у фіскальний режим пристрій.\n\n**ПРРО** — програмний реєстратор розрахункових операцій, зареєстрований фіскальним сервером контролюючого органу.\n\n**Фіскальний чек** — розрахунковий документ з обовʼязковими реквізитами, встановленими наказом Мінфіну.\n\n**Фіскальний звітний чек (Z-звіт)** — щоденний підсумковий звіт реєстратора за робочий день.\n\n**Книга обліку розрахункових операцій** — книга, яку використовують у випадках, коли розрахунки проводяться без реєстратора; зберігається три роки після закінчення.\n\n**Розрахункова книжка** — книжка розрахункових документів, що використовується разом із книгою обліку розрахункових операцій.\n\n**Гранична сума готівкових розрахунків** — 10 000 грн між субʼєктами господарювання і 50 000 грн із фізичними особами; рахується за день.\n\n**Спрощена назва товару** — право платника єдиного податку, не зареєстрованого платником ПДВ, зазначати в чеку назву, що відображає споживчі ознаки й товарну групу.\n\n**Касова книга** — обліковий регістр підприємств і установ; фізичні особи-підприємці її не ведуть.\n\n**Інтернет-еквайринг** — приймання оплати платіжними інструментами при замовленні або оплаті через мережу Інтернет; розрахунковою операцією є.\n\n**Фінансова санкція за Законом про РРО** — 100% суми продажу за перше порушення й 150% за кожне наступне."}, {"id": "reference", "title": "Пам’ятка", "content": "# Памʼятка: готівка й реєстратори\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-09-07**\n\n## Головне\n\n**Реєстратори не застосовуються платниками єдиного податку ПЕРШОЇ групи.**\nЦе весь текст норми. Порогів за обсягом доходу для інших груп у чинній редакції немає.\n\n## Що є розрахунковою операцією\n\nПриймання оплати за товар чи послугу **в готівковій та/або безготівковій формі** — картка, платіжний чек, жетон, інтернет-еквайринг.\n\n**Не є:** переказ, який платник сам ініціює у своєму банку платіжною інструкцією.\n\n## Два ліміти готівки\n\n| Сторони | Сума |\n|---|---|\n| субʼєкт господарювання ↔ субʼєкт господарювання | **10 000 грн** |\n| субʼєкт господарювання ↔ фізична особа | **50 000 грн** |\n\nОбидві «включно», обидві **за день**, за одним або кількома документами разом.\nНадлишок — через надавача платіжних послуг.\n\n## Обовʼязки при розрахунках\n\n- проводити операцію **на повну суму** через реєстратор у фіскальному режимі;\n- **видати розрахунковий документ** — паперовий або електронний, зокрема при оплаті через Інтернет;\n- застосовувати реєстратори з Державного реєстру;\n- зберігати книги обліку розрахункових операцій **три роки**;\n- подавати звітність за реєстратором.\n\n## Назва товару в чеку\n\nПлатник єдиного податку **без ПДВ** може писати назву, що відображає споживчі ознаки й товарну групу.\n\n**Не діє для:** підакцизних товарів, технічно складних побутових товарів із гарантійним ремонтом, ліків, виробів медичного призначення, ювелірних виробів.\n\n## Повернення\n\nРозрахунковий документ підтверджує **і продаж, і повернення**. Видається на повну суму операції.\nОкремо: повернена покупцю сума до доходу не включається.\n\n## Касова книга\n\n**ФОП касової книги не ведуть.** Це регістр підприємств і установ.\n\n## Санкції\n\n| Порушення | Розмір |\n|---|---|\n| непроведення через реєстратор, неповна сума, невидача документа — вперше | **100% суми продажу** |\n| кожне наступне | **150% суми продажу** |\n| незберігання книг обліку розрахункових операцій | 50 неоподатковуваних мінімумів |\n\nСанкція рахується **від суми продажу**, а не фіксована.\n\n## Пастка\n\nПункт про продукцію власного виробництва адресований **підприємствам і установам**, а не ФОП, і прямо виключає торгівлю та громадське харчування."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 10\n\nПеревірено: **2026-09-07**. Кожна норма звірена з повним текстом на `zakon.rada.gov.ua` (сторінка «Текст для друку»). Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Податкового кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Реєстратори не застосовуються платниками єдиного податку першої групи | SRC-076, пункт 296.10 | Норма закону | Уся норма — одне речення; порогів за обсягом доходу немає |\n| Реєстратори не застосовуються єдинниками, які не застосовують їх за Кодексом | SRC-075, пункт 6 статті 9 | Норма закону | Закон про РРО відсилає до Кодексу, а не встановлює власний перелік груп |\n| Обовʼязки виникають при розрахункових операціях у готівковій та/або безготівковій формі | SRC-075, стаття 3 | Норма закону | Разом із операціями з приймання готівки для платіжної операції |\n| Розрахункова операція проводиться на повну суму через реєстратор у фіскальному режимі | SRC-075, пункт 1 статті 3 | Норма закону | Або через розрахункові книжки у випадках, передбачених Законом |\n| Розрахунковий документ видається на повну суму, зокрема при замовленні через Інтернет | SRC-075, пункт 2 статті 3 | Норма закону | Паперова та/або електронна форма, у тому числі QR-код |\n| Платники єдиного податку без ПДВ можуть зазначати спрощену назву товару | SRC-075, пункт 2 статті 3 | Норма закону | Виняток не діє для підакцизних, ліків, ювелірних та інших названих товарів |\n| Книги обліку розрахункових операцій зберігаються три роки після закінчення | SRC-075, пункт 6 статті 3 | Норма закону | Окрема санкція за незберігання |\n| Пункт про продукцію власного виробництва адресований підприємствам і установам | SRC-075, пункт 1 статті 9 | Норма закону | Прямо виключає підприємства торгівлі та громадського харчування |\n| Санкції: 100% суми продажу вперше, 150% за кожне наступне порушення | SRC-075, пункт 1 статті 17 | Норма закону | Рахується від суми продажу, а не фіксована |\n| Санкція 50 неоподатковуваних мінімумів за книги обліку розрахункових операцій | SRC-075, пункт 3 статті 17 | Норма закону | Окремий склад порушення |\n| Визначення розрахункового документа та його видів | SRC-052, стаття 2 | Норма закону | Підтверджує і продаж, і повернення товарів чи коштів |\n| Обовʼязкові реквізити фіскального чека | SRC-053, розділ II | Норма підзаконного акта | Найменування субʼєкта, адреса одиниці, податковий номер, назва товару |\n| Гранична сума готівкових розрахунків між субʼєктами господарювання — 10 000 грн | SRC-074, розділ II | Норма підзаконного акта | Включно |\n| Гранична сума готівкових розрахунків із фізичними особами — 50 000 грн | SRC-074, розділ II | Норма підзаконного акта | Протягом одного дня за одним або кількома платіжними документами |\n| Платежі понад граничну суму проводяться через надавачів платіжних послуг | SRC-074, розділ II | Норма підзаконного акта | Переказ з рахунку на рахунок або внесення до каси надавача |\n| Фізичні особи-підприємці касової книги не ведуть | SRC-074, розділ IV | Норма підзаконного акта | Це регістр підприємств і установ |\n| Оприбуткуванням готівки при роботі з РРО без касової книги є зберігання щоденних Z-звітів | SRC-074, розділ II | Норма підзаконного акта | Норма адресована відокремленим підрозділам; для ФОП — орієнтир практики |\n| Особистий рахунок заборонено використовувати в підприємницькій діяльності | SRC-021 | Норма підзаконного акта | Матеріал модулів 2 і 8 |\n| Суми, що повертаються покупцю, до доходу не включаються | SRC-010, пункт 292.11 | Норма закону | Матеріал модуля 9 |\n| Еквайринг і торговець: визначення | SRC-072, стаття 1 | Норма закону | Матеріал модуля 8 |\n\n## Межі перевірки\n\n- **Норма про Z-звіти як оприбуткування готівки** сформульована для відокремлених підрозділів установ і підприємств, які працюють із реєстраторами без касової книги. Для ФОП вона є **орієнтиром практики**, а не адресною вимогою; у тексті модуля це сказано прямо.\n- **Модуль не описує моделі реєстраторів, застосунки, тарифи й порядок реєстрації.** Інтерфейси змінюються швидше за норму; порядок реєстрації ПРРО в Електронному кабінеті — модуль 20.\n- **Перелік випадків незастосування реєстраторів у статті 9 Закону ширший**, ніж наведено в модулі: він містить пункти про банківські операції, продаж проїзних документів, продукцію власного виробництва підприємств та інші. Модуль наводить лише ті, що можуть стосуватися типового ФОП, і прямо каже, кому адресовані решта.\n- **Змішані ситуації** — кілька видів діяльності, кілька господарських одиниць, продаж через посередника — у модулі не розглядаються й передаються бухгалтеру.\n- **Поза межами модуля:** класифікація надходжень і склад доходу (модуль 9), розрахунок податку (модуль 11), звітність за реєстратором і податковий календар (модулі 18 і 19), валютні розрахунки (модуль 17), оскарження результатів перевірки (модуль 22)."}], "quiz": [{"id": "m10-q01", "title": "Хто звільнений", "competency": "rro_exemption", "scenario": "Підприємець третьої групи шукає, чи звільнений він від застосування реєстраторів.", "question": "Що каже чинна норма Кодексу?", "options": [{"text": "Звільнення мають перша й друга групи в межах установленого обсягу доходу", "feedback": "Ні. Пороги за обсягом доходу існували в попередніх редакціях і вже не діють."}, {"text": "Реєстратори не застосовуються платниками єдиного податку першої групи", "correct": true, "feedback": "Правильно. Уся норма складається з одного речення й називає одну групу."}, {"text": "Звільнення поширюється на кожну групу, якщо підприємець не є платником ПДВ", "feedback": "Ні. Статус платника ПДВ впливає на назву товару в чеку, а не на звільнення."}], "explanation": "Пункт 296.10 Податкового кодексу в чинній редакції встановлює, що реєстратори розрахункових операцій та програмні реєстратори не застосовуються платниками єдиного податку першої групи. Жодних порогів за обсягом доходу для інших груп норма не містить.", "source_reference": ["SRC-076", "SRC-075"], "hint": "Прочитайте норму повністю: вона коротша, ніж більшість статей про неї."}, {"id": "m10-q02", "title": "Оплата карткою", "competency": "rro_cashless", "scenario": "У майстерні приймають оплату карткою через термінал і вважають реєстратор непотрібним.", "question": "Чому це переконання помилкове?", "options": [{"text": "Бо термінал технічно не формує розрахункового документа встановленої форми", "feedback": "Ні. Причина в кваліфікації операції, а не в можливостях конкретного пристрою."}, {"text": "Бо норма охоплює розрахункові операції в готівковій та безготівковій формі", "correct": true, "feedback": "Правильно. Оплата платіжним інструментом теж є розрахунковою операцією."}, {"text": "Бо банк передає до контролюючого органу дані про операції за терміналом", "feedback": "Ні. Питання не в тому, що бачить податкова, а в тому, чого вимагає норма."}], "explanation": "Обовʼязки встановлено для субʼєктів, які здійснюють розрахункові операції в готівковій та/або безготівковій формі із застосуванням електронних платіжних засобів, платіжних чеків, жетонів тощо. Оплата карткою підпадає під це визначення.", "source_reference": ["SRC-075", "SRC-072"], "hint": "Зверніть увагу на перелік форм у першому реченні статті про обовʼязки."}, {"id": "m10-q03", "title": "Готівка від підприємця", "competency": "rro_cash_limit_business", "scenario": "Інший ФОП пропонує розрахуватися готівкою за партію товару на 14 000 грн.", "question": "Чи допустима така операція?", "options": [{"text": "Так: гранична сума готівкових розрахунків становить 50 000 грн на день", "feedback": "Ні. Ця сума встановлена для розрахунків із фізичними особами, а не між підприємцями."}, {"text": "Так, якщо розбити суму на два платежі протягом одного робочого дня", "feedback": "Ні. Обмеження діє за день і за одним або кількома платіжними документами разом."}, {"text": "Ні: між субʼєктами господарювання гранична сума становить 10 000 грн", "correct": true, "feedback": "Правильно. Надлишок проводиться через надавача платіжних послуг."}], "explanation": "Субʼєкти господарювання мають право здійснювати розрахунки готівкою між собою в розмірі до 10 000 грн включно, а з фізичними особами — до 50 000 грн включно. Платежі понад граничну суму проводяться через надавачів платіжних послуг.", "source_reference": ["SRC-074"], "hint": "Визначте, ким є друга сторона розрахунку, і лише потім обирайте суму."}, {"id": "m10-q04", "title": "Готівка від людини", "competency": "rro_cash_limit_person", "scenario": "Фізична особа хоче заплатити готівкою 47 000 грн за обладнання одним платежем.", "question": "Що тут потрібно перевірити?", "options": [{"text": "Що сума в межах ліміту, і окремо — чи потрібен розрахунковий документ", "correct": true, "feedback": "Правильно. Ліміт і обовʼязок видати документ — дві різні вимоги різних актів."}, {"text": "Насамперед те, що сума не перевищує 10 000 грн для розрахунків із покупцями", "feedback": "Ні. Ліміт 10 000 грн стосується розрахунків між субʼєктами господарювання."}, {"text": "Наявність письмової згоди покупця на розрахунок готівкою такого розміру", "feedback": "Ні. Такої вимоги про письмову згоду покупця норма не встановлює."}], "explanation": "Гранична сума розрахунків із фізичними особами — 50 000 грн включно протягом одного дня, тому 47 000 грн ліміт не порушують. Але обовʼязок провести операцію через реєстратор і видати розрахунковий документ від цього не зникає.", "source_reference": ["SRC-074", "SRC-075"], "hint": "Тут два різні питання, і відповідь на одне не закриває друге."}, {"id": "m10-q05", "title": "Касова книга", "competency": "rro_cash_book", "scenario": "Підприємець витрачає час щотижня на ведення касової книги «про всяк випадок».", "question": "Чи потрібна вона йому?", "options": [{"text": "Так, якщо він приймає готівку від покупців у власній господарській одиниці", "feedback": "Ні. Приймання готівки створює інші обовʼязки, але не обовʼязок вести касову книгу."}, {"text": "Ні: фізичні особи-підприємці касової книги не ведуть за нормою", "correct": true, "feedback": "Правильно. Це обліковий регістр підприємств і установ, а не підприємців."}, {"text": "Так, оскільки касова книга є підставою для оприбуткування готівкової виручки", "feedback": "Ні. Для роботи з реєстратором цю роль виконують щоденні фіскальні звітні чеки."}], "explanation": "Положення про ведення касових операцій прямо називає осіб, які касової книги не ведуть, і фізичні особи-підприємці серед них. Це не звільняє від обовʼязку застосовувати реєстратор там, де він потрібен.", "source_reference": ["SRC-074"], "hint": "Норма перелічує кілька категорій осіб — перевірте, чи є серед них підприємці."}, {"id": "m10-q06", "title": "Власне виробництво", "competency": "rro_own_production", "scenario": "Підприємець спирається на пункт про торгівлю продукцією власного виробництва.", "question": "Чому це посилання ненадійне?", "options": [{"text": "Бо цей пункт адресований підприємствам, установам і організаціям", "correct": true, "feedback": "Правильно. Він також прямо виключає торгівлю й громадське харчування."}, {"text": "Бо він поширюється виключно на продукцію без гарантійного ремонту", "feedback": "Ні. Винятки за видами товарів там є, але головна відмінність — коло осіб."}, {"text": "Бо він застосовується за умови оформлення розрахункових книжок продавцем", "feedback": "Ні. Пункт говорить про касові ордери й квитанції, а не про розрахункові книжки."}], "explanation": "Перший пункт переліку випадків незастосування реєстраторів стосується підприємств, установ і організацій усіх форм власності, які проводять розрахунки в касах з оформленням касових ордерів, і прямо виключає підприємства торгівлі та громадського харчування. До ФОП він не адресований.", "source_reference": ["SRC-075"], "hint": "Перечитайте початок пункту: там названо коло осіб, до яких він застосовується."}, {"id": "m10-q07", "title": "Повернення товару", "competency": "rro_returns", "scenario": "Покупець повертає товар, і гроші йому видають із каси майстерні.", "question": "Які обовʼязки виникають у цей момент?", "options": [{"text": "Досить заяви покупця та розписки про отримання ним коштів із каси", "feedback": "Ні. Заява є підставою повернення, але розрахункового документа не замінює."}, {"text": "Жодних: розрахунковий документ видається при продажу товару чи послуги", "feedback": "Ні. Визначення розрахункового документа прямо охоплює й повернення коштів."}, {"text": "Видати розрахунковий документ і окремо відобразити суму в обліку доходу", "correct": true, "feedback": "Правильно. Це два різні обовʼязки з різних актів, і виконувати треба обидва."}], "explanation": "Розрахунковий документ підтверджує факт продажу або повернення товарів чи коштів і видається особі, яка повертає товар, на повну суму операції. Для обліку доходу окремо діє норма про суми, що повертаються покупцю.", "source_reference": ["SRC-052", "SRC-075", "SRC-010"], "hint": "Тут дві норми з різних актів: одна про документ, друга про склад доходу."}, {"id": "m10-q08", "title": "Назва товару в чеку", "competency": "rro_receipt_name", "scenario": "ФОП на єдиному податку, не платник ПДВ, продає велосипедні запчастини.", "question": "Як він може зазначати назву товару в розрахунковому документі?", "options": [{"text": "У вигляді, що відображає споживчі ознаки й товарну групу", "correct": true, "feedback": "Правильно. Але виняток не діє для підакцизних, ліків і ювелірних виробів."}, {"text": "Виключно за повним артикулом виробника з кодом товарної підкатегорії", "feedback": "Ні. Такої вимоги для платників єдиного податку без ПДВ норма не встановлює."}, {"text": "У будь-якому вигляді, оскільки вимоги до назви встановлює сам продавець", "feedback": "Ні. Послаблення має межі: назва має ідентифікувати належність до товарної групи."}], "explanation": "Фізичні особи-підприємці, які є платниками єдиного податку та не зареєстровані платниками ПДВ, мають право зазначати назву товару у вигляді, що відображає споживчі ознаки та ідентифікує належність до товарної групи. Виняток не поширюється на підакцизні товари, технічно складні побутові товари, ліки, вироби медичного призначення та ювелірні вироби.", "source_reference": ["SRC-075", "SRC-053"], "hint": "Послаблення є, але воно має і умову щодо статусу, і перелік винятків за товарами."}, {"id": "m10-q09", "title": "Ціна порушення", "competency": "rro_penalty", "scenario": "Продажі проводилися без реєстратора протягом півроку, обсяг значний.", "question": "Як рахується фінансова санкція?", "options": [{"text": "Як подвійна сума несплаченого єдиного податку за відповідний період", "feedback": "Ні. Санкція за Законом про РРО не прив'язана до суми податку."}, {"text": "Як фіксований штраф у неоподатковуваних мінімумах доходів громадян", "feedback": "Ні. У такому вигляді встановлено санкцію за книги обліку розрахункових операцій."}, {"text": "Як 100% суми продажу за перше порушення й 150% за кожне наступне", "correct": true, "feedback": "Правильно. Тому ціна помилки прямо пропорційна обороту за період."}], "explanation": "За непроведення розрахункових операцій через реєстратор або невидачу розрахункового документа застосовується санкція в розмірі 100% суми продажу за порушення, вчинене вперше, і 150% — за кожне наступне.", "source_reference": ["SRC-075"], "hint": "Зверніть увагу, від чого саме рахується санкція: від суми чого?"}, {"id": "m10-q10", "title": "Оплата на особисту картку", "competency": "rro_personal_card", "scenario": "Клієнт переказує оплату за послугу на особисту картку підприємця другої групи.", "question": "Скільки вимог порушено в цій ситуації?", "options": [{"text": "Дві: режим використання рахунку й обовʼязок видати розрахунковий документ", "correct": true, "feedback": "Правильно. Показ суми в доході жодну з цих двох вимог не закриває."}, {"text": "Одна: використання рахунку для власних потреб у підприємницькій діяльності", "feedback": "Ні. Приймання оплати за послугу є ще й розрахунковою операцією."}, {"text": "Жодної, якщо підприємець відобразить цю суму у складі доходу періоду", "feedback": "Ні. Відображення в доході не усуває ані порушення режиму, ані відсутності документа."}], "explanation": "Використовувати рахунок для власних потреб у підприємницькій діяльності заборонено. Незалежно від цього приймання оплати за послугу є розрахунковою операцією, за якою має бути виданий розрахунковий документ, якщо підприємець не звільнений від застосування реєстратора.", "source_reference": ["SRC-021", "SRC-075"], "hint": "Порахуйте вимоги окремо: одна стосується рахунку, друга — самої операції."}], "activities": {"precheck": [{"id": "pre-groups", "question": "Як гадаєте: платники яких груп єдиного податку звільнені від застосування реєстраторів?", "options": [{"text": "Перша, друга і третя до певного обсягу доходу", "correct": false}, {"text": "Лише перша група", "correct": true}, {"text": "Усі групи, якщо немає найманих працівників", "correct": false}], "note": "Норма Кодексу складається з одного речення й називає лише першу групу. Пороги за обсягом доходу для інших груп стосуються редакцій, які вже не діють, — і саме з цього починається модуль."}, {"id": "pre-cashless", "question": "Оплата карткою через термінал потребує розрахункового документа?", "options": [{"text": "Ні, реєстратор потрібен лише для готівки", "correct": false}, {"text": "Так, це теж розрахункова операція", "correct": true}, {"text": "Ні, банк формує документ самостійно", "correct": false}], "note": "Закон говорить про розрахункові операції в готівковій та/або безготівковій формі із застосуванням платіжних інструментів. Розділ про форми розрахунків показує, які способи оплати сюди входять."}, {"id": "pre-cashbook", "question": "Чи веде ФОП касову книгу?", "options": [{"text": "Так, якщо приймає готівку", "correct": false}, {"text": "Ні, це регістр підприємств і установ", "correct": true}, {"text": "Так, якщо має найманих працівників", "correct": false}], "note": "Положення про ведення касових операцій прямо називає осіб, які касової книги не ведуть, і фізичні особи-підприємці серед них. Це знімає значний обсяг зайвої роботи."}], "lesson": [{"id": "lesson-exempt", "section": "Хто звільнений", "scenario": "Підприємець другої групи прочитав статтю про звільнення від реєстраторів за обсягом доходу.", "question": "Як оцінити цю інформацію?", "options": [{"text": "Вона чинна: пороги за обсягом доходу застосовуються до другої й третьої груп", "feedback": "Ні. Пороги за обсягом доходу існували в попередніх редакціях і вже не діють."}, {"text": "Вона стосується редакцій, що не діють: звільнення має лише перша група", "correct": true, "feedback": "Правильно. Чинна норма Кодексу складається з одного речення про першу групу."}, {"text": "Вона чинна, якщо підприємець не є зареєстрованим платником податку на додану вартість", "feedback": "Ні. Статус платника ПДВ впливає на назву товару в чеку, а не на звільнення."}], "source_reference": ["SRC-076"]}, {"id": "lesson-cashless", "section": "Форма розрахунку", "scenario": "У майстерні щодня приймають оплату карткою через термінал і вважають реєстратор непотрібним.", "question": "Чому це переконання помилкове?", "options": [{"text": "Бо норма охоплює розрахункові операції в готівковій та безготівковій формі", "correct": true, "feedback": "Правильно. Оплата платіжним інструментом теж є розрахунковою операцією."}, {"text": "Бо банк не передає до податкової даних про операції за терміналом торговця", "feedback": "Ні. Питання не в тому, що бачить податкова, а в тому, що вимагає норма."}, {"text": "Бо термінал сам не формує розрахункового документа встановленої форми", "feedback": "Ні. Причина в кваліфікації операції, а не в технічних можливостях терміналу."}], "source_reference": ["SRC-075"]}, {"id": "l t": "Усе, що ви могли читати про звільнення інших груп за обсягом доходу, стосується вже нечинних редакцій."}, {"id": "limit_business", "label": "Гранична сума готівкових розрахунків між субʼєктами господарювання", "mode": "known", "accepted": ["10000"], "must_include": [["10000", "10 000", "десять тисяч"]], "must_not_include": ["50000", "50 000", "пʼятдесят", "пятдесят"], "sources": ["nbu_cash"], "hint_where": "У нормі дві суми поспіль: одна для розрахунків між собою, друга — з фізичними особами.", "example": "Сума цифрами.", "hint": "Це менша з двох граничних сум, і вона стосується розрахунків підприємців і компаній між собою."}, {"id": "limit_person", "label": "Гранична сума готівкових розрахунків із фізичною особою", "mode": "known", "accepted": ["50000"], "must_include": [["50000", "50 000", "пʼятдесят тисяч", "пятдесят тисяч"]], "must_not_include": ["10000", "10 000", "десять тисяч"], "sources": ["nbu_cash"], "hint_where": "Ця сума стоїть у тій самій нормі другим пунктом і рахується протягом одного дня.", "example": "Сума цифрами.", "hint": "Обмеження діє за день і за одним або кількома платіжними документами разом."}, {"id": "penalty_first", "label": "Скільки відсотків суми становить санкція за перше порушення", "mode": "known", "accepted": ["100"], "must_include": [["100", "сто"]], "must_not_include": ["150", "50", "200", "сто пʼятдесят"], "sources": ["law_rro"], "hint_where": "У статті про фінансові санкції названо два відсотки поспіль: за перше порушення й за кожне наступне.", "example": "Число відсотків цифрами.", "hint": "Санкція рахується від суми продажу, здійсненого з порушенням, а не є фіксованою величиною."}, {"id": "own_production", "label": "Чи звільняє підприємця продаж продукції власного виробництва", "mode": "review", "sources": ["additional"], "hint_where": "Прочитайте перший пункт переліку винятків у Законі уважно: зверніть увагу на коло осіб, яких він називає.", "example": "Поле лишається порожнім, ставиться позначка про потребу окремої пере жними інструкціями"], "categories": ["потреба в реєстраторі", "готівковий ліміт", "розрахунковий документ", "режим рахунку"], "owners": ["власник", "бухгалтер", "юрист"], "risks": [{"id": "no_rro", "text": "Реєстратора немає через застарілу пораду про звільнення другої групи", "critical": true, "category": "потреба в реєстраторі", "owner": "бухгалтер", "feedback": "У чинній редакції норми звільнення має лише перша група єдиного податку. Пороги за обсягом доходу для другої й третьої груп стосуються редакцій, які вже не діють.", "hint": "Перевірте, скільки груп названо в чинній нормі Кодексу про незастосування реєстраторів."}, {"id": "card_no_rro", "text": "Оплату карткою приймали, вважаючи реєстратор потрібним лише для готівки", "critical": true, "category": "потреба в реєстраторі", "owner": "бухгалтер", "feedback": "Закон говорить про розрахункові операції в готівковій та безготівковій формі із застосуванням платіжних інструментів. Оплата карткою є розрахунковою операцією, тому щоденні продажі накопичували порушення.", "hint": "Знайдіть у нормі перелік форм розрахункових операцій і перевірте, чи обмежується він готівкою."}, {"id": "cash_limit", "text": "Клієнт-ФОП розрахувався готівкою на 14 000 грн", "critical": true, "category": "готівковий ліміт", "owner": "власник", "feedback": "Гранична сума готівкових розрахунків між субʼєктами господарювання — 10 000 грн включно. Надлишок мав бути проведений через надавача платіжних послуг.", "hint": "Визначте, ким є друга сторона розрахунку, і застосуйте відповідну з двох граничних сум."}, {"id": "no_return_doc", "text": "При поверненні товару гроші видавали без розрахункового документа", "critical": true, "category": "розрахунковий документ", "owner": "бухгалтер", "feedback": "Розрахунковий документ підтверджує і продаж, і повернення товарів чи коштів; він видається особі, яка повертає товар, на повну суму операції.", "hint": "Прочитайте визначення розрахункового документа: перевірте, чи згадано в ньому повернення."}, {"id"     function renderReasoning(data,result){const min=reasonMin(mod),written=ms.caseWork.reasoning.trim().length,wrap=document.createElement("div");wrap.className="reason-block";wrap.innerHTML=`<h3>3. Поясніть рішення</h3><label for="case-reason">${escapeHtml(data.reasoning_prompt||"Поясніть своє рішення")}</label><p class="section-intro">Напишіть це як відповідь клієнту своїми словами: що саме завершує запис у ЄДР, що залишається невирішеним і що робити далі. Переказувати ситуацію не треба.</p><textarea class="text-area" id="case-reason" placeholder="Мінімум ${min} символів">${escapeHtml(ms.caseWork.reasoning)}</textarea><p class="counter" id="reason-counter">${written} із ${min} символів${written>=min?" · достатньо для зарахування":""}</p>`;

    function renderLevelQuiz(main){const level=levelById(levelNo);if(!level){openCourse();return}

      const hero=document.createElement("section");hero.className="hero";hero.innerHTML=`<div class="eyebrow">Рівень ${level.level} · ${escapeHtml(level.title)}</div><h1>${escapeHtml(LEVEL_QUIZ.title)}</h1><p class="lead">${escapeHtml(LEVEL_QUIZ.note)}</p><div class="meta-row"><span class="chip">${total} наскрізних питань</span><span class="chip">Поріг ${levelThreshold()}%</span><span class="chip">Прогрес курсу не змінюється</span></div>`;main.appendChild(hero);

        const review=document.createElement("div");review.className="competency-list";
        level.quiz.forEach((q,i)=>{const right=s.answers[i]===correctIndex(q),chosen=s.answers[i],block=document.createElement("article");block.className="review-item"+(right?" is-correct":" is-wrong");
          const names=(q.modules||[]).map(id=>{const m=MODULES.find(x=>x.id===id);return m?m.meta.title:id});
          block.innerHTML=`<div class="review-head"><span>${i+1}. ${escapeHtml(q.title)}</span><strong>${right?"✓ Правильно":"◆ Повторити"}</strong></div>${right?"":`<p class="review-line"><strong>Ваша відповідь:</strong> ${escapeHtml(chosen===undefined?"без відповіді":q.options[chosen].text)}</p><p class="review-line"><strong>Правильна відповідь:</strong> ${escapeHtml(q.options[correctIndex(q)].text)}</p><p class="review-line">${escapeHtml(q.explanation)}</p>`}<div class="footer-note">Спирається на модулі: ${names.map(escapeHtml).join(", ")}${(q.source_reference||[]).length?" · джерела: "+q.source_reference.map(escapeHtml).join(", "):""}</div>`;
          if(!right)(q.modules||[]).forEach(id=>{const m=MODULES.find(x=>x.id===id);if(m)block.appendChild(button("Відкрити: "+m.meta.title,"tonal-button",()=>openModule(m.id)))});
          review.appendChild(block)});
        card.appendChild(review);
        const actions=document.createElement("div");actions.className="quiz-actions";
        actions.appendChild(button("Пройти перевірку ще раз","primary-button",()=>{state.levels[String(level.level)]=Object.assign(freshLevelState(),{bestScore:s.bestScore});persist();render()}));
        actions.appendChild(button("← Усі модулі","secondary-button",openCourse));card.appendChild(actions);main.appendChild(card);return}
      const index=Math.min(s.index||0,total-1),q=level.quiz[index],chosen=s.answers[index],correct=correctIndex(q);
      const names=(q.modules||[]).map(id=>{const m=MODULES.find(x=>x.id===id);return m?m.meta.title:id});
      card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Наскрізне питання</p><h2>${escapeHtml(q.title)}</h2></div><span class="chip">Питання ${index+1} із ${total}</span></div><div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((index+1)/total*100)}" aria-label="Пройдено ${index+1} із ${total} питань"><span style="width:${Math.round((index+1)/total*100)}%"></span></div><div class="question-number">Спирається на модулі: ${names.map(escapeHtml).join(", ")}</div><p class="scenario">${escapeHtml(q.scenario)}</p><h3 class="question-title">${escapeHtml(q.question)}</h3>`;
      if(q.hint&&chosen===undefined){const tools=document.createElement("div");tools.className="hint-bar";if(!(s.hints||{})[index])tools.appendChild(button("Підказка","tonal-button",()=>{const store=s.hints||(s.hints={});store[index]=1;persist();render()}));else tools.insertAdjacentHTML("beforeend",hintBlock("Навідне питання",[q.hint]));card.appendChild(tools)}

      nav.appendChild(button("Скинути рівневу перевірку","danger-button",()=>{if(!confirm("Видалити відповіді рівневої перевірки?"))return;state.levels[String(level.level)]=freshLevelState();persist();render()}));main.appendChild(nav)}
    function renderPrecheck(main){const items=mod.activities.precheck||[];if(!items.length)return;const card=document.createElement("section");card.className="card compact";card.innerHTML=`<div class="section-head"><div><p class="section-kicker">Перед читанням</p><h2>Спробуйте вгадати</h2></div><span class="chip">не впливає на прогрес</span></div><p class="section-intro">Дайте відповідь до того, як прочитаєте урок. Помилитися тут корисно: спроба пригадати робить наступне читання значно ефективнішим.</p>`;
      items.forEach((item,index)=>{const chosen=(ms.precheck||{})[item.id],correct=correctIndex(item),block=document.createElement("article");block.className="activity-card"+(chosen===undefined?"":" is-neutral");block.innerHTML=`<div class="activity-label">Припущення ${index+1} із ${items.length}</div><h3>${escapeHtml(item.question)}</h3>`;
        const options=document.createElement("div");options.className="options";item.options.forEach((option,i)=>{const b=button(option.text,"option-button",()=>{const store=ms.precheck||(ms.precheck={});store[item.id]=i;persist();render()});if(chosen!==undefined){b.disabled=true;if(i===chosen)b.classList.add(i===correct?"correct":"wrong")}options.appendChild(b)});block.appendChild(options);

    function renderReview(main){const due=reviewDue(),all=reviewAll(),hero=document.createElement("section");hero.className="hero";hero.innerHTML=`<div class="eyebrow">${escapeHtml(REVIEW.title)}</div><h1>Повернення до складного</h1><p class="lead">Пригадування через проміжки часу дає довготривале запам’ятовування, якого не дає одноразове проходження. Сюди автоматично потрапляє те, у чому ви помилилися, і терміни, які ви позначили складними.</p><div class="meta-row"><span class="chip${due.length?" warning":" success"}">${due.length?`До повторення сьогодні: ${due.length}`:"На сьогодні все повторено"}</span><span class="chip">Усього в черзі: ${all.length}</span></div>`;main.appendChild(hero);
      if(due.length){const item=due[0],content=reviewContent(item),card=document.createElement("section");card.className="card";card.innerHTML=`<div class="section-head"><div><p class="section-kicker">${escapeHtml(content.label)} · ${escapeHtml(content.module.meta.title)}</p><h2>Пригадайте відповідь</h2></div><span class="chip">Залишилось ${due.length}</span></div>`;
        const answered=state.reviewAnswer&&state.reviewAnswer.key===item.key?state.reviewAnswer:null;
        if(content.type==="question"){const q=content.question,correct=correctIndex(q);card.insertAdjacentHTML("beforeend",`<p class="scenario">${escapeHtml(q.scenario||"")}</p><h3>${escapeHtml(q.question)}</h3>`);
          const options=document.createElement("div");options.className="options";q.options.forEach((option,i)=>{const b=button(option.text,"option-button",()=>{state.reviewAnswer={key:item.key,chosen:i,ok:i===correct};if(i===correct)reviewPass(item.key);else reviewFail(item.key);persist();render()});if(answered){b.disabled=true;if(i===correct)b.classList.add("correct");if(i===answered.chosen&&i!==correct)b.classList.add("wrong")}options.appendChild(b)});card.appendChild(options);
          if(answered)card.insertAdjacentHTML("beforeend",`<div class="feedback ${answered.ok?"correct":"wrong"}" role="status"><strong>${answered.ok?"Правильно — повернемося пізніше":"Ще раз завтра"}</strong><p>${escapeHtml(q.options[answered.chosen].feedback||q.explanation||"")}</p></div>`)}
        else if(content.type==="term"){card.insertAdjacentHTML("beforeend",`<h3>${escapeHtml(content.term.term)}</h3><p class="section-intro">Сформулюйте визначення своїми словами, потім перевірте себе.</p>${answered?`<div class="feedback correct" role="status"><p>${escapeHtml(content.term.definition)}</p><p><strong>Приклад:</strong> ${escapeHtml(content.term.example)}</p>${content.term.avoid?`<p class="footer-note">Так не кажіть: ${escapeHtml(content.term.avoid)}</p>`:""}</div>`:""}`);
          const row=document.createElement("div");row.className="activity-actions";

          if(!answered){const input=document.createElement("input");input.className="text-input";input.id="review-input";input.placeholder=field.mode==="known"?"Введіть значення":"Напишіть, що робити, якщо даних немає";card.appendChild(input);
            const row=document.createElement("div");row.className="activity-actions";row.appendChild(button("Перевірити","primary-button",()=>{const value=document.getElementById("review-input").value;const ok=field.mode==="known"?matches(field,value):String(value).trim().length>=10;state.reviewAnswer={key:item.key,chosen:-1,ok};if(ok)reviewPass(item.key);else reviewFail(item.key);persist();render()}));card.appendChild(row)}}
        if(answered&&content.type!=="term"){const row=document.createElement("div");row.className="activity-actions";row.appendChild(button(due.length>1?"Наступне повторення":"Завершити повторення","primary-button",()=>{state.reviewAnswer=null;persist();render()}));row.appendChild(button("Відкрити модуль","secondary-button",()=>{state.reviewAnswer=null;openModule(content.module.id)}));card.appendChild(row)}
        main.appendChild(card)}
      const weak=document.createElement("section");weak.className="card";const groups={};all.forEach(item=>{const content=reviewContent(item);if(!content)return;const key=content.module.meta.title;(groups[key]=groups[key]||[]).push({item,content})});
      weak.innerHTML=`<div class="section-head"><div><p class="section-kicker">Журнал</p><h2>Ваші слабкі місця</h2></div><span class="chip">${all.length} позицій</span></div>`;

      else Object.entries(groups).forEach(([title,list])=>{weak.insertAdjacentHTML("beforeend",`<h3>${escapeHtml(title)}</h3><div class="review-list">${list.map(({item,content})=>`<div class="review-line"><strong>${escapeHtml(content.label)}:</strong> ${escapeHtml(content.type==="question"?content.question.question:content.type==="term"?content.term.term:content.field.label)} <span class="footer-note">повторення ${String(item.due)>todayISO()?"з "+item.due:"сьогодні"}</span></div>`).join("")}</div>`)});
      main.appendChild(weak);
      const actions=document.createElement("div");actions.className="page-actions";actions.appendChild(button("← Усі модулі","secondary-button",openCourse));if(all.length)actions.appendChild(button("Очистити чергу повторення","danger-button",()=>{if(confirm("Видалити всі позиції з черги повторення?")){state.review={};state.reviewAnswer=null;persist();render()}}));main.appendChild(actions)}
    function wireSourceRefs(){document.querySelectorAll("#main .src-ref").forEach(node=>node.addEventListener("click",()=>{if(view==="module")go("sources")}))}
    function render(){const main=document.getElementById("main");main.innerHTML="";
      if(view==="review"){document.title=REVIEW.title+" — "+COURSE.title;renderReview(main);renderNav();renderProgress();wireSourceRefs();return}
      if(view==="level"){const lv=levelById(levelNo);document.title=LEVEL_QUIZ.title+" — "+COURSE.title;if(!lv){view="course";renderCourse(main)}else renderLevelQuiz(main);renderNav();renderProgress();wireSourceRefs();return}
      if(view==="course"){document.title=COURSE.title;renderCourse(main);renderNav();renderProgress();wireSourceRefs();return}
      document.title=`${mod.meta.title} — Бухгалтер ФОП`;const page=PAGES.find(p=>p.id===current)||PAGES[0];
      if(page.kind==="overview")renderOverview(main);else if(page.kind==="guide")renderGuide(main);else if(page.kind==="lesson")renderLesson(main);else if(page.kind==="practice")renderPractice(main);else if(page.kind==="case")renderCase(main);else if(page.kind==="checklist")renderChecklist(main);else if(page.kind==="glossary")renderGlossary(main);else if(page.kind==="quiz")renderQuiz(main);else renderContent(main);renderNav();renderProgress();wireSourceRefs()}
    document.getElementById("version").textContent=`${COURSE.version} · оновлено ${COURSE.updated}`;render();
