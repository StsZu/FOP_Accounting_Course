 індивідуальна податкова чи юридична консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст базової перевірки профілю ФОП\n\n## Реєстраційні дані\n\n- [ ] Отримано актуальні відомості або документ із ЄДР.\n- [ ] Звірено повне ПІБ.\n- [ ] Звірено РНОКПП або законну альтернативу.\n- [ ] Зафіксовано дату й номер запису державної реєстрації.\n- [ ] Перевірено поточний стан запису ФОП.\n- [ ] Звірено адресу та зареєстровані КВЕДи.\n\n## Податкові дані\n\n- [ ] Податкову адресу визначено за актуальними даними.\n- [ ] Визначено основне місце обліку.\n- [ ] Перевірено майно й об’єкти на інших територіях.\n- [ ] Систему, групу та ставку підтверджено податковим джерелом.\n- [ ] Статус ПДВ перевірено окремо.\n- [ ] Зафіксовано дату кожної перевірки.\n\n## Банківські й операційні дані\n\n- [ ] Підприємницькі рахунки підтверджено банківськими документами.\n- [ ] Фактичні операції відповідають заявленим КВЕДам.\n- [ ] Перевірено можливі ліцензії та спеціальні дозволи.\n\n## Якщо ФОП припинено\n\n- [ ] Перевірено дату запису про припинення.\n- [ ] Визначено остаточні звітні обов’язки.\n- [ ] Перевірено стан розрахунків із бюджетом.\n- [ ] Перевірено договори, дебіторів і кредиторів.\n- [ ] Перевірено підприємницькі рахунки та ліцензії.\n- [ ] Нову діяльність не ведуть від імені закритого ФОП.\n\n## Контроль якості\n\n- [ ] Жодне відсутнє поле не заповнено припущенням.\n- [ ] Не використано реальні персональні дані в навчальних матеріалах.\n- [ ] Складні податкові й юридичні питання передано профільному фахівцю."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 1\n\n| Термін | Просте пояснення |\n|---|---|\n| Фізична особа | Людина як учасник правових відносин. |\n| ФОП | Фізична особа, державну реєстрацію якої як підприємця внесено до ЄДР. |\n| Юридична особа | Окремо зареєстрована організація; ФОП юридичною особою не є. |\n| Державна реєстрація | Офіційне визнання державою юридичного факту через внесення запису до реєстру. |\n| ЄДР | Державний реєстр юридичних осіб, ФОП і громадських формувань. |\n| Виписка з ЄДР | Документ, сформований за результатом реєстраційної дії, з відомостями про зареєстровану особу та дію. |\n| Витяг з ЄДР | Документ із відомостями з ЄДР за визначеними параметрами запиту. |\n| РНОКПП | Номер облікової картки фізичної особи в Державному реєстрі фізичних осіб — платників податків. |\n| Податкова адреса | Місце проживання фізичної особи, за яким її беруть на податковий облік. |\n| КВЕД | Код, який класифікує вид економічної діяльності. |\n| Основний КВЕД | Вид діяльності, визначений основним у реєстраційних даних. Він не замінює аналіз фактичної діяльності. |\n| Основне місце обліку | Контролюючий орган за місцем проживання фізичної особи. |\n| Неосновне місце обліку | Облік на іншій території через майно, об’єкт або діяльність, що створює податкові обов’язки. |\n| Припинення ФОП | Внесення до ЄДР запису про припинення підприємницької діяльності фізичної особи. |\n| Майнова відповідальність | Ризик відповідати за підприємницькими зобов’язаннями майном фізичної особи в межах закону. |"}, {"id": "reference", "title": "Пам’ятка", "content": "# Пам'ятка: картка профілю ФОП\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-08-15**\n\n## Три статуси, які не можна змішувати\n\n| Статус | Що показує | Чим підтверджується |\n|---|---|---|\n| Реєстраційний | чи є в особи статус підприємця, КВЕДи, дата й номер запису | ЄДР: виписка або витяг |\n| Податковий | система, група, статус ПДВ, місце обліку | витяг або реєстр ДПС |\n| Банківський | наявність підприємницького рахунку, IBAN, валюта | документ банку |\n\nОдин документ не підтверджує всі три. Висновок «з ЄДР видно групу оподаткування» — типова помилка.\n\n## Реквізити картки й джерела\n\n| Реквізит | Джерело | Типова пастка |\n|---|---|---|\n| ПІБ | ЄДР | розбіжність із документом, що посвідчує особу |\n| РНОКПП або законна альтернатива | документ фізичної особи | вигадати номер «щоб було заповнено» |\n| Стан державної реєстрації | ЄДР | застаріла виписка |\n| Дата й номер запису | ЄДР | є дата, немає номера — це ще не підтверджено |\n| Основний і додаткові КВЕДи | ЄДР | КВЕД ≠ дозвіл на діяльність |\n| Податкова адреса | ДПС, ЄДР | плутати з адресою орендованого офісу |\n| Основне місце обліку | ДПС | назвати «своєю податковою» за звичкою |\n| Можливе неосновне місце обліку | документ на майно | вважати готовим висновком замість приводу до перевірки |\n| Система, група, ПДВ | витяг ДПС | брати з ЄДР або зі слів клієнта |\n| IBAN і валюта | документ банку | записати з пам'яті клієнта |\n\n## Правило відсутніх даних\n\nНемає підтвердження — пишемо «потрібні дані» і фіксуємо, що саме запросити. Правдоподібне припущення в картці профілю знецінює всю картку: її більше не можна показати як перевірену.\n\n## Що робити з датами\n\nЗмінні статуси старіють. Поряд із кожним податковим статусом фіксуйте дату, станом на яку його перевірено. Без дати неможливо довести, що інформація була чинною на момент рішення.\n\n## Межа компетенції\n\n| Питання | Хто веде |\n|---|---|\n| склад і повнота реквізитів, джерела, дати | бухгалтер |\n| конкретний ризик стягнення майна, спірні договори | юрист |\n| рішення про припинення чи нову реєстрацію | власник |\n\n## Припинення: що саме завершує запис у ЄДР\n\nЗавершує: реєстраційний статус підприємця на майбутнє.\nНе завершує: звітність за минулі періоди, розрахунки з бюджетом, договірні зобов'язання, банківські питання, майнову відповідальність.\nЗакритий запис не відновлюється — для нового старту потрібна нова державна реєстрація."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 1\n\nПеревірено: **2026-08-14**. Наступна перевірка електронних послуг: **2026-11-12**.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Фізична особа реалізує право на підприємницьку діяльність за умови державної реєстрації | SRC-001, ЦКУ, стаття 50 | Норма закону | Базове визначення статусу |\n| ФОП відповідає за підприємницькими зобов’язаннями своїм майном із законними винятками | SRC-001, ЦКУ, стаття 52 | Норма закону | Конкретне стягнення оцінює юрист |\n| Відомості про ФОП і реєстраційні дії містяться в ЄДР; за результатами дії формується виписка | SRC-002 | Норма закону | Не прирівнювати до податкового витягу |\n| Податкова адреса фізичної особи пов’язана з місцем проживання; одночасно вона одна | SRC-003, стаття 45; SRC-006 | Норма закону й офіційне пояснення | Адресні зміни перевіряти окремо |\n| Основне місце обліку пов’язане з місцем проживання, неосновне — з об’єктами на інших територіях | SRC-003, стаття 63; SRC-007 | Норма закону й офіційний текст ДПС | Фактичний обов’язок залежить від об’єкта й податку |\n| Припинення ФОП не припиняє зобов’язань, які виникли під час діяльності | SRC-003, пункт 65.10 | Норма закону | Критичне правило для закриття |\n| Реєстрацію і припинення можна провести через чинні електронні послуги Дія | SRC-004, SRC-005 | Офіційна інструкція сервісу | Інтерфейс і строки перевіряти кожні 90 днів |\n| Закритий ФОП не відновлюється; для нової діяльності потрібна нова реєстрація | SRC-005 | Офіційне роз’яснення сервісу | Не називати нову реєстрацію «відновленням» |\n| КВЕД є національною класифікацією видів економічної діяльності | SRC-008 | Офіційний класифікатор | КВЕД не замінює ліцензію чи податковий аналіз |\n| РНОКПП є номером обліку фізичної особи в Державному реєстрі платників податків | SRC-009 | Офіційне пояснення ДПС | Це не код ЄДРПОУ юридичної особи |\n\n## Межі перевірки\n\n- Модуль не встановлює конкретних ставок, строків подання звітності або процедури вибору податкової групи.\n- Практичні алгоритми Дії перевірено станом на дату вище, але до реальної дії користувач повинен повторно звірити чинну сторінку послуги.\n- Твердження про відсутність окремої юридичної особи є системним висновком із правового статусу «фізична особа — підприємець» у Цивільному кодексі та Законі № 755-IV."}], "quiz": [{"id": "m01-q01", "title": "Статус сторони договору", "competency": "fop_legal_status", "scenario": "Олена зареєструвала ФОП і укладає договір із клієнтом. Клієнт просить назвати окрему юридичну особу, яка нестиме відповідальність.", "question": "Яку відповідь має дати бухгалтер?", "options": [{"text": "Стороною договору є лише сама Олена: окремої особи не виникає", "correct": true, "feedback": "Правильно. Реєстрація ФОП надає підприємницький статус самій фізичній особі."}, {"text": "Стороною договору є юридична особа, створена автоматично при реєстрації", "feedback": "Ні. Реєстрація ФОП не створює окремої організації або юридичної особи."}, {"text": "Стороною договору є банк, який відкрив підприємницький рахунок", "feedback": "Ні. Банк обслуговує рахунок, але не замінює підприємця в договорі з клієнтом."}], "explanation": "ФОП — це підприємницький статус фізичної особи. Договірні права, обов’язки й ризики пов’язані з цією фізичною особою.", "source_reference": ["SRC-001"], "hint": "Запитайте себе, чи створює реєстрація ФОП нову особу — чи лише надає фізичній особі підприємницький статус."}, {"id": "m01-q02", "title": "Межі відомостей ЄДР", "competency": "separate_registration_and_tax_status", "scenario": "У ЄДР видно активний запис ФОП і два КВЕДи. Інших документів бухгалтер ще не отримав.", "question": "Який висновок є професійно обґрунтованим?", "options": [{"text": "Запис у ЄДР підтверджує і третю групу єдиного податку, і статус ПДВ", "feedback": "Ні. ЄДР не підтверджує податкову групу та статус ПДВ."}, {"text": "Реєстрацію і КВЕДи підтверджено; лише податкові статуси беруть у ДПС", "correct": true, "feedback": "Правильно. Це відділяє реєстраційні відомості від податкового статусу."}, {"text": "Податкові обов’язки виникають після відкриття банківського рахунку", "feedback": "Ні. Банківський рахунок не визначає сам факт державної реєстрації або всі податкові обов’язки."}], "explanation": "ЄДР і податкові реєстри відповідають на різні питання. Бухгалтер не переносить відомості з одного джерела на інший статус без підтвердження.", "source_reference": ["SRC-002", "SRC-003"], "hint": "Розділіть, які відомості веде ЄДР, а які — податкові реєстри. Одне джерело не підтверджує все одразу."}, {"id": "m01-q03", "title": "Невідомий РНОКПП", "competency": "handle_missing_data", "scenario": "У навчальному пакеті є ПІБ і виписка з ЄДР, але РНОКПП у наданих даних відсутній.", "question": "Як правильно заповнити картку профілю?", "options": [{"text": "Позначити РНОКПП відсутнім і запросити підтвердження", "correct": true, "feedback": "Правильно. Невідоме значення не можна домислювати; потрібно зафіксувати прогалину й джерело для перевірки."}, {"text": "Внести умовний номер, щоб картка профілю виглядала заповненою", "feedback": "Ні. Вигаданий ідентифікатор робить облікову картку недостовірною."}, {"text": "Використати як податковий номер IBAN із банківської довідки", "feedback": "Ні. IBAN є реквізитом банківського рахунку і не замінює РНОКПП."}], "explanation": "Одна з базових професійних навичок бухгалтера — відрізняти підтверджений факт від припущення та створювати контроль відсутніх даних.", "source_reference": ["SRC-009"], "hint": "Порівняйте два шляхи: записати правдоподібне значення чи зафіксувати відсутність даних. Що з цього можна показати клієнту як перевірене?"}, {"id": "m01-q04", "title": "Податкова адреса й офіс", "competency": "determine_tax_address", "scenario": "ФОП проживає і перебуває на обліку в Полтаві, але орендує офіс у Києві.", "question": "Яке твердження найбезпечніше?", "options": [{"text": "Податкова адреса автоматично змінюється на Київ у день оренди", "feedback": "Ні. Оренда офісу сама по собі не замінює зареєстровану податкову адресу фізичної особи."}, {"text": "Адресу орендованого офісу в картці профілю можна не враховувати", "feedback": "Ні. Об’єкт або діяльність на іншій території можуть потребувати окремої перевірки."}, {"text": "Полтава лишається адресою; наслідки офісу перевіряють окремо", "correct": true, "feedback": "Правильно. Це розділяє податкову адресу та можливі обов’язки за іншим об’єктом."}], "explanation": "Податкова адреса фізичної особи пов’язана з місцем проживання та основним обліком. Інший об’єкт може створити додаткові обов’язки, але не дає підстав автоматично змінити адресу.", "source_reference": ["SRC-003", "SRC-006", "SRC-007"], "hint": "Розділіть два різні поняття: податкова адреса фізичної особи і місце, де фактично ведеться діяльність."}, {"id": "m01-q05", "title": "КВЕД і дозвіл", "competency": "assess_kved_limits", "scenario": "ФОП додав КВЕД, назва якого відповідає запланованій діяльності. Діяльність може бути регульованою.", "question": "Що потрібно зробити до початку роботи?", "options": [{"text": "Почати роботу одразу: запис КВЕДу замінює галузевий дозвіл", "feedback": "Ні. КВЕД класифікує діяльність, але не є універсальним дозволом."}, {"text": "Перевірити зміст діяльності, обмеження та потрібні дозволи", "correct": true, "feedback": "Правильно. Перевірка має виходити з реальної операції, а не лише назви коду."}, {"text": "Перевірити лише те, чи проводить банк платежі з таким призначенням", "feedback": "Ні. Банківська технічна можливість не підтверджує законність або податкову сумісність діяльності."}], "explanation": "КВЕД є елементом реєстраційного опису. Ліцензійні, дозвільні та податкові вимоги аналізуються окремо.", "source_reference": ["SRC-008"], "hint": "Запис КВЕДу описує вид діяльності в реєстрі. Запитайте себе, чи достатньо самого запису, щоб почати роботу."}, {"id": "m01-q06", "title": "Майно в іншому місті", "competency": "identify_secondary_registration_risk", "scenario": "ФОП із податковою адресою в Полтаві володіє нежитловим приміщенням у Львові.", "question": "Як відобразити це в первинній картці профілю?", "options": [{"text": "Позначити можливе неосновне місце обліку й перевірити обов’язки", "correct": true, "feedback": "Правильно. Майно на іншій території є сигналом для перевірки, але не готовим висновком про всі податки."}, {"text": "Негайно змінити податкову адресу ФОП на місто розташування майна", "feedback": "Ні. Наявність майна не означає автоматичної зміни місця проживання й основного обліку."}, {"text": "Не вносити приміщення в картку: воно не пов’язане з РНОКПП власника", "feedback": "Ні. Майно може створити податкові обов’язки й потребує контролю незалежно від способу ідентифікації."}], "explanation": "Професійна картка має фіксувати не лише підтверджені статуси, а й об’єкти, які потребують подальшої податкової перевірки.", "source_reference": ["SRC-003", "SRC-007"], "hint": "Подумайте, що дає майно в іншому місті: готовий висновок про облік — чи привід для окремої перевірки?"}, {"id": "m01-q07", "title": "Межі відповідальності", "competency": "understand_property_liability", "scenario": "ФОП вважає, що підприємницький борг можна стягувати лише з грошей на його бізнес-рахунку.", "question": "Яка реакція бухгалтера правильна?", "options": [{"text": "Підтвердити, що підприємницький рахунок повністю відокремлює майно", "feedback": "Ні. Окремий рахунок не створює такого самого майнового відокремлення, як окрема юридична особа."}, {"text": "Самостійно назвати майно, яке виконавець стягне в першу чергу", "feedback": "Ні. Бухгалтер пояснює загальний ризик, але конкретне стягнення потребує юридичного аналізу."}, {"text": "Пояснити принцип відповідальності майном і залучити юриста", "correct": true, "feedback": "Правильно. Це і точне пояснення меж, і правильна професійна передача складного питання."}], "explanation": "ФОП відповідає своїм майном із установленими законом винятками. Бухгалтер не повинен перетворювати загальне правило на індивідуальний прогноз стягнення.", "source_reference": ["SRC-001"], "hint": "Межа проходить між загальним принципом, який пояснює бухгалтер, і оцінкою конкретного ризику стягнення."}, {"id": "m01-q08", "title": "Реєстраційне припинення", "competency": "separate_closing_obligations", "scenario": "У ЄДР уже є запис про припинення ФОП, але останню декларацію не перевірено, ", "Не переказуйте ситуацію — сформулюйте висновок, який ви сказали б клієнту."], "reasoning_aspects": [{"label": "Реєстраційне завершення", "terms": ["єдр", "реєстрац", "припинен", "запис"]}, {"label": "Звітність і податки", "terms": ["звіт", "деклар", "податк", "розрахунк", "бюджет"]}, {"label": "Договори й нова оплата", "terms": ["догов", "оплат", "контрагент", "клієнт"]}, {"label": "Банк і платежі", "terms": ["банк", "рахун", "iban", "платеж"]}, {"label": "Майнова відповідальність", "terms": ["майн", "відповідальн", "борг", "стягнен"]}], "reasoning_model": "Запис у ЄДР завершує лише реєстраційний статус: фізична особа перестає бути підприємцем на майбутнє. Обов’язки, що виникли раніше, залишаються — потрібно визначити й подати останню звітність, звірити стан розрахунків із бюджетом, перевірити долю банківського рахунку та регулярних платежів і окремо оцінити договірні й майнові наслідки. Нову діяльність від імені закритого ФОП вести не можна, а для нового старту потрібна нова реєстрація, а не відновлення попереднього запису."}, "checklist": {"title": "Фінальна перевірка синтетичного профілю", "instructions": "Для кожного пункту виберіть обґрунтований статус. Для «підтверджено» та «не застосовується» зазначте джерело або причину; для «потрібні дані» — що саме треба отримати.", "how_to": ["Перегляньте результат Практики й опрацьовуйте чекліст зверху вниз.", "Для кожного пункту виберіть статус: підтверджено, потрібні дані або не застосовується.", "У полі праворуч напишіть джерело підтвердження, відсутній документ або причину статусу — щонайменше 10 символів.", "Якщо незрозуміло, що саме перевіряти, натисніть «Підказка» біля пункту.", "Не залишайте критичні пункти зі знаком «!» без рішення; їх не можна закрити як «не застосовується».", "Пункт вважається опрацьованим одразу, щойно має обґрунтований статус — підказка під ним покаже, чого ще бракує."], "note_min_chars": 10, "statuses": [{"value": "", "label": "Не перевірено"}, {"value": "confirmed", "label": "Підтвердж ’язані, але це різні речі. Позначте те, що ви справді підтвердили документом.", "why": "Плутанина між адресою й місцем обліку призводить до звернень не до того органу."}, {"id": "other_property", "group": "Податкові дані", "text": "Перевірено об’єкти на інших територіях", "critical": true, "hint": "Питання не «чи є об’єкт», а «чи ви це перевірили». Неперевірене — це «потрібні дані».", "why": "Об’єкти на інших територіях можуть створювати окремі облікові обов’язки, які легко пропустити."}, {"id": "verification_date", "group": "Податкові дані", "text": "Зафіксовано дату перевірки змінних статусів", "critical": false, "hint": "Змінні статуси старіють. Запитайте себе, чи зафіксовано дату, станом на яку вони були актуальні.", "why": "Без дати перевірки неможливо довести, що інформація була чинною на момент рішення."}, {"id": "bank", "group": "Банківські дані", "text": "Рахунки підтверджено банківськими документами", "critical": true, "hint": "Підтвердженням є банківський документ. Згадка про рахунок у розмові — ще не підтвердження.", "why": "Реквізити рахунку впливають на платежі, тому підтверджуються документом, а не пам’яттю."}, {"id": "permissions", "group": "Операційні дані", "text": "Перевірено відповідність діяльності КВЕДам і можливі дозволи", "critical": false, "hint": "Подумайте, чи потребує фактична діяльність окремих дозволів, і чи перевіряли ви це взагалі.", "why": "Діяльність поза КВЕДами або без потрібного дозволу — ризик, який виявляють уже під час перевірки."}, {"id": "no_guess", "group": "Контроль якості", "text": "Відсутні дані не замінено припущеннями", "critical": true, "hint": "Перегляньте свою картку профілю з Практики: чи немає там значення, яке ви вписали «по логіці», а не з документа.", "why": "Одне вигадане значення знецінює всю картку профілю: її більше не можна показати як перевірену."}, {"id": "handoff", "group": "Контроль якості", "text": "Складні питання передано бухгалтеру або юристу", "critical": false, "hint": "Згадайте, чи були в роботі питання, які ви не маєте права вирішувати самостійно, і чи передали ви їх.", "why": "Вчасно передане питання — це професійна межа, а не слабкість бухгалтера."}]}, "glossary": [{"term": "ФОП", "definition": "Фізична особа, державну реєстрацію якої як підприємця внесено до ЄДР.", "example": "ФОП не є окремою юридичною особою.", "avoid": "«приватний підприємець», «фірма», «моя компанія» — ФОП не є юридичною особою"}, {"term": "ЄДР", "definition": "Державний реєстр юридичних осіб, ФОП і громадських формувань.", "example": "Активний запис у ЄДР підтверджує державну реєстрацію ФОП.", "avoid": "«реєстр податкової» — ЄДР веде не ДПС"}, {"term": "РНОКПП", "definition": "Номер облікової картки фізичної особи в податковому реєстрі.", "example": "Після реєстрації ФОП людина використовує той самий РНОКПП.", "avoid": "«ідентифікаційний код підприємця» — номер належить фізичній особі, а не бізнесу"}, {"term": "Податкова адреса", "definition": "Місце проживання фізичної особи, за яким її беруть на податковий облік.", "example": "Адреса офісу не обов’язково є податковою адресою.", "avoid": "«юридична адреса» — у ФОП немає юридичної адреси"}, {"term": "КВЕД", "definition": "Код, який класифікує вид економічної діяльності.", "example": "КВЕД не замінює ліцензію або податкову перевірку.", "avoid": "«ліцензія», «дозвіл» — КВЕД лише описує вид діяльності"}, {"term": "Неосновне місце обліку", "definition": "Облік на іншій території через майно, об’єкт або діяльність, що створює податкові обов’язки.", "example": "Майно в іншому місті є сигналом для окремої перевірки.", "avoid": "«друга податкова» — це окремий облік за об’єктом, а не дублювання"}, {"term": "Припинення ФОП", "definition": "Внесення до ЄДР запису про припинення підприємницької діяльності фізичної особи.", "example": "Припинення не списує попередні зобов’язання.", "avoid": "«закрити ФОП», «ліквідувати ФОП» — ліквідують юридичну особу, а підприємницьку діяльність припиняють"}, {"term": "Майнова відповідальність", "definition": "Ризик відповідати за підприємницькими зобов’язаннями майном фізичної особи в межах закону.", "example": "Конкретні питання стягнення передають юристу.", "avoid": "«бізнес відповідає окремо» — відповідає фізична особа, а не окремий суб’єкт"}]}}, {"index": 2, "id": "module-02", "level": 1, "slug": "module_02_finansova_hramotnist", "meta": {"schema": "course-module/v1", "id": "module-02", "level": 1, "title": "Фінансова грамотність", "language": "uk", "version": "0.1.0", "status": "app_ready", "summary": "Навчіться відрізняти надходження від доходу, залишок на рахунку — від прибутку, і класифікувати операції виписки за їх справжнім змістом.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "pending", "last_verified": "2026-08-24", "next_review": "2027-08-24", "depends_on": ["module-01"], "estimated_minutes": 60, "source_ids": ["SRC-010", "SRC-011", "SRC-012", "SRC-013", "SRC-014", "SRC-015", "SRC-016", "SRC-017", "SRC-018", "SRC-019", "SRC-020", "SRC-021", "SRC-022", "SRC-023", "SRC-024"], "outcomes": ["Відрізнити надходження коштів від доходу і назвати надходження, які доходом не є", "Пояснити касовий метод і дату, на яку виникає дохід", "Розділити особисті та підприємницькі кошти й пояснити наслідки їх змішування", "Класифікувати операції банківської виписки за їх справжнім змістом", "Пояснити різницю між доходом, витратами, прибутком, залишком коштів і заборгованістю"], "primary_source": {"id": "SRC-010", "note": "Стаття 292 Податкового кодексу — прочитайте пункти 292.1, 292.6 і 292.11 самостійно: на цьому розмежуванні тримається весь подальший облік доходу."}, "sessions": [{"title": "Сесія 1 · Чотири різні числа", "minutes": 20, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Виписка й класифікація", "minutes": 25, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Рішення й перевірка", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви перестанете рахувати результат за залишком на картці й побачите, які надходження взагалі не є вашим доходом.", "accountant": "Ви працюєте з клієнтами: це база класифікації операцій — ви навчитеся відокремлювати дохід від транзиту, повернень і власних коштів ще до розрахунку податку.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете поставити правильні питання про те, що саме бухгалтер вважає вашим доходом і чому."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Фінансова грамотність\n\n## Мета\n\nНавчитися бачити за рухом коштів його справжній зміст: надходження на рахунок — не завжди дохід, залишок на рахунку — не прибуток, а особисті й підприємницькі гроші живуть за різними правилами. Це база, без якої розрахунок будь-якого податку буде правильним лише випадково.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. відрізнити надходження коштів від доходу і назвати надходження, які доходом не є;\n2. пояснити касовий метод і дату, на яку виникає дохід;\n3. розділити особисті та підприємницькі кошти й пояснити наслідки їх змішування;\n4. класифікувати операції банківської виписки за їх справжнім змістом;\n5. пояснити різницю між доходом, витратами, прибутком, залишком коштів і заборгованістю.\n\n## Передумови\n\nМодуль 1 «Хто такий ФОП». Спеціальні бухгалтерські знання не потрібні.\n\n## Основні терміни\n\n- **Дохід** — надходження, отримані від провадження підприємницької діяльності протягом звітного періоду.\n- **Витрати** — кошти, віддані за ресурси для діяльності.\n- **Прибуток** — різниця між доходом і витратами за період.\n- **Залишок коштів** — сума на рахунку на конкретну дату.\n- **Касовий метод** — визнання доходу за датою фактичного надходження коштів.\n- **Аванс** — кошти, отримані до виконання роботи.\n- **Дебіторська заборгованість** — сума, яку винні вам.\n- **Кредиторська заборгованість** — сума, яку винні ви.\n- **Власні кошти підприємця** — гроші тієї самої фізичної особи, внесені нею на підприємницький рахунок.\n\n## Теоретичний матеріал\n\n### 1. Чотири різні числа\n\nПочатківець зазвичай оперує одним числом — скільки грошей на картці. Насправді чисел щонайменше чотири, і вони майже ніколи не збігаються.\n\n| Число | На що відповідає | Де його видно |\n|---|---|---|\n| Залишок коштів | скільки грошей є просто зараз | виписка на дату |\n| Дохід | скільки надійшло від діяльності за період | облік доходів за період |\n| Витрати | скільки віддано за ресурси для діяльності | первинні документи й виписка |\n| Прибуток | що залишилося як результат роботи | різниця доходу й витрат |\n\nРізниця між доходом і прибутком закріплена і в податкових нормах. На загальній системі об’єктом оподаткування є **чистий оподатковуваний дохід** — різниця між загальним оподатковуваним доходом і документально підтвердженими витратами. [SRC-013] На спрощеній системі базою є сам **дохід**, тобто надходження, без вирахування витрат. [SRC-010] Тобто на спрощеній системі податок рахують від доходу, а прибуток підприємець рахує для себе — щоб розуміти, чи має сенс те, що він робить.\n\n> [!REMEMBER]\n> **Залишок на рахунку — не прибуток.** Усередині залишку можуть лежати чужі аванси, кошти до повернення й несплачені зобов’язання.\n\n### 2. Касовий метод: коли виникає дохід\n\nДля платника єдиного податку датою отримання доходу є **дата надходження коштів** у грошовій (готівковій або безготівковій) формі. [SRC-010] Не дата рахунку, не дата підписання акта, не дата, коли клієнт пообіцяв заплатити.\n\nЗ цього випливають два наслідки, які початківці плутають щомісяця:\n\n- акт підписано в жовтні, гроші надійшли в листопаді — доходу жовтня немає;\n- аванс отримано в жовтні, робота буде в листопаді — дохід виникає в жовтні.\n\nУ самій нормі є й інші дати для окремих випадків: для безоплатно отриманих товарів, робіт і послуг — дата підписання акта приймання-передачі; для платника третьої групи, який є платником ПДВ, — дата списання кредиторської заборгованості, за якою минув строк позовної давності. [SRC-010] Тому «касовий метод» — правильна назва загального правила, а не гасло «завжди тільки за грошима».\n\n> [!PRINCIPLE]\n> Дохід прив’язаний до руху коштів, а не до документа. Документ пояснює **за що** гроші, дата надходження — **коли** вони стали доходом.\n\n### 3. Надходження, які доходом не є\n\nПодатковий кодекс прямо перелічує суми, які до складу доходу платника єдиного податку не включаються. Для ФОП практично значущі: суми податку на додану вартість; суми поворотної фінансової допомоги, отриманої та поверненої протягом 12 календарних місяців з дня отримання, і суми кредитів; кошти цільового призначення з бюджетів і державних фондів; аванси й передоплати, що повертаються у зв’язку з поверненням товару, розірванням договору або за листом-заявою; оплата за товари, роботи й послуги, реалізовані в період сплати інших податків; повернення надміру сплачених податків і єдиного внеску. [SRC-010]\n\nПоворотна фінансова допомога — це кошти, отримані в користування за договором без процентів і з обов’язком повернення. [SRC-014] Ключова умова саме в строку: якщо її повернуто протягом 12 календарних місяців, вона доходом не є; якщо ні — правило перестає діяти. [SRC-010]\n\n> [!RISK]\n> У цьому переліку **немає** пункту про помилково зараховані кошти. Не посилайтеся на нього в такій ситуації: помилкове зарахування розбирають за іншими нормами, а податкову кваліфікацію конкретного випадку підтверджує бухгалтер.\n\n### 4. Особисті й підприємницькі кошти\n\nФізична особа відкриває **окремі** рахунки: для підприємницької діяльності, для незалежної професійної діяльності та для власних потреб. [SRC-021] Це не порада, а норма.\n\nДалі — те, про що частіше за все не знають:\n\n- **особистий рахунок заборонено використовувати** для операцій, пов’язаних із підприємницькою та незалежною професійною діяльністю; [SRC-021]\n- відкриваючи рахунок для власних потреб, фізична особа власноруч підписує в заяві, що їй про цю заборону відомо; [SRC-021]\n- фізична особа зобов’язана повідомити банк про свій статус підприємця; [SRC-021] [SRC-024]\n- банк повідомляє податкову про відкриття або закриття рахунку в день такої дії, і видаткові операції починаються після взяття рахунку на облік. [SRC-024]\n\nЗворотного правила закон не встановлює: **прямої заборони переказувати кошти з підприємницького рахунку на власні потреби** в Інструкції немає. [SRC-021] Підприємець не «отримує зарплату» у себе самого — він розпоряджається власними коштами, коли зобов’язання за період уже враховані.\n\nОкремо про внесення власних коштів **на** підприємницький рахунок. За змістом операції це не виручка: платник і отримувач — та сама особа, нової роботи не виконано. Але прямої норми про такі внески в Податковому кодексі немає, і податкова кваліфікація залежить від обставин та призначення платежу. [SRC-010] Тому в обліку таку операцію **позначають окремо** й узгоджують із бухгалтером, а не вирішують самостійно.\n\n> [!INFO]\n> Поширений міф: «податкова бачить кожен мій платіж». Автоматично передається лише факт відкриття або закриття рахунку. [SRC-024] Інформацію про обсяг і обіг коштів на рахунку контролюючий орган отримує **на підставі рішення суду**. [SRC-024] Це не привід розслаблятися: облік ведеться не тому, що хтось дивиться.\n\n### 5. Внутрішні перекази між власними рахунками\n\nЯкщо рахунків більше одного, та сама сума з’являється двічі: як списання в одній виписці й як надходження в іншій. Нових грошей при цьому не виникає, і виручки теж.\n\nПрактичне правило: перед класифікацією зіставте виписки між собою й позначте пари «пішло — прийшло». Непозначений внутрішній переказ — найтиповіша причина завищеного доходу в саморобному реєстрі.\n\n### 6. Аванси, повернення й помилкові зарахування\n\n**Аванс.** Гроші надійшли — дохід виник за датою надходження. [SRC-010] Одночасно виникло зобов’язання: виконати роботу або повернути кошти. Аванс — це єдиний випадок, коли одна операція збільшує і гроші, і борг.\n\n**Повернення авансу.** Суми, що повертаються покупцю у зв’язку з поверненням товару, розірванням договору або за листом-заявою, до доходу не включаються. [SRC-010] Тому повернення оформлюють документально, а не «просто відправляють назад».\n\n**Помилкове зарахування.** Тут важлива точність у термінах, бо побутове й законодавче значення не збігаються:\n\n| Ситуація | Як це називає закон | Що з цього випливає |\n|---|---|---|\n| Помилку зробив надавач платіжних послуг | помилкова платіжна операція [SRC-022] | діє стаття 88 Закону про платіжні послуги |\n| Помилку зробила третя особа, яка не є ініціатором чи надавачем | неналежна платіжна операція [SRC-022] | діє та сама стаття 88 |\n| Помилився сам платник (не ті реквізити) | не підпадає під ці визначення [SRC-022] | повертають як безпідставно набуте майно [SRC-023] |\n\nОсоба, на рахунок якої кошти зараховано без законних підстав, — це **неналежний отримувач**. [SRC-022] За статтею 88 він зобов’язаний ініціювати повернення протягом трьох робочих днів **з дати надходження повідомлення** надавача платіжних послуг, а не з дати зарахування. [SRC-022] За прострочення передбачено пеню; відмова повернути кошти вирішується в судовому порядку. [SRC-022]\n\nЯкщо ж реквізити переплутав сам платник, підставою повернення є норма про безпідставно набуте майно: особа, яка набула майно за рахунок іншої без достатньої правової підстави, зобов’язана його повернути. [SRC-023] Спеціального строку в три дні тут немає — але й підстав вважати ці гроші своїми теж немає.\n\n> [!RISK]\n> Найгірша дія з незрозумілим надходженням — залишити його «до з’ясування» й забути. Через місяць воно вже не відрізняється від звичайної виручки, а строк на спокійне повернення минув.\n\n### 7. Дебіторська й кредиторська заборгованість\n\n**Дебіторська заборгованість** — сума заборгованості дебіторів на певну дату; дебітори — особи, які внаслідок минулих подій заборгували певні суми. [SRC-019] Простіше: робота виконана, оплати ще немає.\n\n**Кредиторська заборгованість** окремого нормативного визначення не має — її описують через поняття **зобов’язання**: заборгованість, що виникла внаслідок минулих подій, погашення якої зменшить ресурси. [SRC-017] [SRC-018] Простіше: ви вже отримали гроші або товар, але ще не виконали свою частину.\n\nОбидва числа не видно у виписці — і саме тому про них згадують надто пізно.\n\nУ заборгованості є строки. Загальна позовна давність — три роки. [SRC-020] Але це не автоматичний таймер: для окремих вимог, наприклад про неустойку, встановлено один рік; строк може бути збільшений договором; відлік починається зі спливом строку виконання зобов’язання, а не з дати рахунку; і застосовує позовну давність суд лише за заявою сторони у спорі. [SRC-020] Тому «минуло три роки — можна забути» не працює; це питання до юриста.\n\n### 8. Активи і зобов’язання: мова, а не обов’язок\n\nСлова, якими описують гроші бізнесу, визначено Законом про бухгалтерський облік: **активи** — ресурси, контрольовані підприємством у результаті минулих подій, використання яких, як очікується, приведе до отримання економічних вигод; **зобов’язання** — заборгованість, що виникла внаслідок минулих подій, погашення якої зменшить ресурси; **господарська операція** — дія або подія, яка змінює структуру активів і зобов’язань. [SRC-017]\n\nВажлива межа: цей Закон поширюється на юридичних осіб. [SRC-017] ФОП немає в переліку суб’єктів, тому **обов’язку вести бухгалтерський облік і подавати фінансову звітність за цим Законом у ФОП немає**. Ці поняття потрібні як мова опису, а не як ваш обов’язок.\n\nЩо ФОП веде насправді:\n\n| Хто | Що веде | Як |\n|---|---|---|\n| Групи 1 і 2, група 3 без ПДВ | облік **доходів** | у довільній формі, помісячним відображенням отриманих доходів [SRC-011] |\n| Група 3 — платник ПДВ | облік доходів **і витрат** | за типовою формою Мінфіну [SRC-011] [SRC-016] |\n| Загальна система | облік доходів **і витрат** | за типовою формою; потрібні підтверджуючі документи щодо походження товару [SRC-013] [SRC-016] |\n\nКниги обліку доходів, які раніше були обов’язковими, скасовано. [SRC-015] «Довільна форма» означає свободу формату, а не свободу від обліку: показники формуються на підставі первинних документів, і формувати податкову звітність за непідтвердженими даними заборонено. [SRC-012] Документи потрібно зберігати; строки встановлює Податковий кодекс, і для документів, на які не поширюються спеціальні правила, це 1095 днів з дня подання звітності. [SRC-012] Конкретний строк для вашої ситуації підтверджує бухгалтер.\n\n> [!PRINCIPLE]\n> «Довільна форма» — про формат таблиці, а не про право не мати документів.\n\n## Покроковий процес\n\nЩоб закрити фінансовий місяць ФОП:\n\n1. Отримати виписки за всіма підприємницькими рахунками за весь період.\n2. Звірити вхідний залишок, надходження, списання й вихідний залишок.\n3. Позначити пари внутрішніх переказів між власними рахунками.\n4. Класифікувати кожне надходження: дохід, власні кошти, повернення, помилкове зарахування, нез’ясоване.\n5. Для доходу зафіксувати дату надходження коштів.\n6. Виділити аванси й перевірити, чи не було повернень.\n7. Скласти перелік виконаних робіт без оплати і власних невиконаних зобов’язань.\n8. Порахувати зобов’язання, які лежать усередині залишку.\n9. Визначити результат періоду й суму, якою справді можна розпоряджатися.\n10. Нез’ясовані операції винести в окремий список запитань, а не класифікувати навмання.\n\n## Практичні приклади\n\n### Приклад 1. Місяць із прибутком і порожнім рахунком\n\nДохід — 60 000 грн, витрати — 20 000 грн, прибуток — 40 000 грн. Але 35 000 грн підприємець зняв собі ще в середині місяця, а 18 000 грн з надходжень були авансом за листопадову роботу. Залишок на 31 жовтня — 7 000 грн. Прибуток є, вільних грошей немає.\n\n### Приклад 2. Акт у листопаді, дохід у жовтні\n\nКлієнт заплатив 25 жовтня, акт підписали 3 листопада. Дохід виник у жовтні — за датою надходження коштів. [SRC-010]\n\n### Приклад 3. Оплата на особисту картку\n\nКлієнт переказав 12 000 грн на особисту картку. Операції немає у виписці підприємницького рахунку, і використання особистого рахунку в підприємницькій діяльності заборонено. [SRC-021] Гроші не зникли — вони просто не потрапили в облік разом з іншими, і розбирати це доведеться окремо.\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Вважати залишок на рахунку прибутком | усередині залишку є чужі й зарезервовані кошти | рахувати результат за операціями, а не за станом рахунку |\n| Рахувати доходом усе, що надійшло | частина надходжень доходом не є [SRC-010] | класифікувати кожне надходження окремо |\n| Визнавати дохід за датою акта | для єдиного податку дата — це надходження коштів [SRC-010] | брати дату з виписки |\n| Вважати аванс «ще не доходом» | дохід виникає за датою надходження [SRC-010] | визнати дохід і окремо пам’ятати про зобов’язання |\n| Приймати оплату на особисту картку | особистий рахунок заборонено використовувати в діяльності [SRC-021] | приймати оплату на підприємницький рахунок |\n| Рахувати внутрішній переказ двома надходженнями | нових грошей не виникло | позначати пари переказів до класифікації |\n| Залишати помилкове зарахування «до з’ясування» | обов’язок повернення не зникає з часом [SRC-022] [SRC-023] | з’ясувати підставу й оформити повернення |\n| Вважати, що «довільна форма» = без документів | показники формуються на підставі первинних документів [SRC-012] | зберігати підтвердження до кожної операції |\n\n## Ризики й межі самостійних дій\n\n- Модуль не визначає ставок, лімітів і сум податку — це модулі 3 і 11.\n- Податкова кваліфікація внесення власних коштів на підприємницький рахунок залежить від обставин; рішення ухвалює бухгалтер.\n- Валютні надходження мають власні правила перерахунку — це модуль 17.\n- Готівка й розрахункові операції — модуль 10.\n- Строки зберігання документів і списання заборгованості потребують перевірки під конкретну ситуацію.\n- Норми Податкового кодексу змінюються; дата перевірки цього модуля вказана нижче.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, якщо треба підтвердити склад доходу за період, кваліфікувати нетипове надходження, визначити наслідки внесення власних коштів або зібрати облік за минулі періоди.\n\n**Юрист потрібен**, якщо контрагент вимагає повернення коштів, є спір за договором, минають строки стягнення заборгованості або йдеться про судовий порядок повернення.\n\n## Підсумок\n\nНадходження — не завжди дохід, залишок — не прибуток, а особисті й підприємницькі гроші мають різні правила. Дохід платника єдиного податку виникає за датою надходження коштів; частина надходжень до доходу не включається; особистий рахунок не використовують у підприємницькій діяльності; аванс одночасно створює гроші й зобов’язання; заборгованість не видно у виписці. ФОП не веде бухгалтерського обліку за Законом про бухоблік, але веде облік доходів — і робить це на підставі документів.\n\n## Самоперевірка\n\n1. Чим залишок коштів відрізняється від прибутку?\n2. На яку дату виникає дохід платника єдиного податку?\n3. Назвіть три надходження, які доходом не є.\n4. Чому аванс — це одночасно гроші й зобов’язання?\n5. Що каже норма про використання особистого рахунку в підприємницькій діяльності?\n6. Чим «помилкова платіжна операція» відрізняється від помилки самого платника?\n7. Де у виписці видно дебіторську заборгованість?\n8. Який облік зобов’язаний вести ФОП на спрощеній системі без ПДВ?\n\n## Джерела\n\nПовна карта тверджень і посилань наведена в `references.md`. Основні джерела: Податковий кодекс України, Закон № 1591-IX «Про платіжні послуги», Цивільний кодекс України, Інструкція НБУ про порядок відкриття та закриття рахунків, Закон № 996-XIV про бухгалтерський облік, національні положення (стандарти) бухгалтерського обліку та накази Мінфіну.\n\n## Дата перевірки актуальності\n\n- Норми перевірено: **24.08.2026**.\n- Наступна перевірка модуля: **01.11.2026** — на цю дату призначено нову редакцію Податкового кодексу.\n- Людська фактологічна перевірка: **не проведена**."}, {"id": "practice", "title": "Практика", "content": "# Практика: розбір банківської виписки ФОП\n\n## Мета\n\nНавчитися класифікувати кожну операцію за її справжнім змістом і бачити, які надходження не є доходом.\n\n## Навчальна ситуація\n\nВикористовуйте лише наведені синтетичні дані. Не вводьте реальні реквізити, суми чи персональні дані.\n\nВиписка підприємницького рахунку **ФОП Ніни Прикладної** за жовтень 2026:\n\n| Дата | Сума, грн | Контрагент | Призначення |\n|---|---|---|---|\n| 01.10 | 12 000 | — | вхідний залишок |\n| 02.10 | +40 000 | ТОВ «Сігма» | оплата за консультаційні послуги, акт № 7 від 30.09.2026 |\n| 05.10 | +25 000 | Прикладна Н. | поповнення рахунку власними коштами підприємця |\n| 09.10 | +7 300 | ПП «Омега» | оплата за рахунком № 112 |\n| 11.10 | −7 300 | ПП «Омега» | повернення помилково зарахованих коштів |\n| 14.10 | +18 000 | ФОП Марченко | аванс за послуги; акт буде підписано в листопаді |\n| 18.10 | −6 000 | орендодавець | оренда робочого місця за жовтень |\n| 21.10 | −1 400 | банк | комісія за обслуговування рахунку |\n| 23.10 | +9 000 | фізична особа | переказ |\n| 26.10 | −20 000 | Прикладна Н. | переказ на власний особистий рахунок |\n\nДодатково відомо:\n\n- контрагент ПП «Омега» надіслав лист: платіж призначався іншому отримувачу, просить повернути;\n- 28.10 підписано акт № 9 на 15 000 грн з ТОВ «Дельта», кошти не надійшли;\n- 30.10 клієнт сплатив 12 000 грн на особисту картку Ніни; у цій виписці операції немає.\n\n## Завдання 1. Класифікуйте операції\n\nДля кожного рядка визначте, чим є операція: доходом, власними коштами, поверненням, помилковим зарахуванням, витратою — або операцією, яку неможливо класифікувати з наявних даних.\n\n## Завдання 2. Знайдіть те, чого не можна визначити\n\nПозначте операції, для яких даних недостатньо, і напишіть, що саме потрібно запитати. Не класифікуйте навмання.\n\n## Завдання 3. Порахуйте два числа\n\n1. Вихідний залишок на 31.10.2026 — за всіма операціями рахунку.\n2. Дохід жовтня від оплат клієнтів — за датою надходження коштів.\n\nПоясніть, чому ці два числа не збігаються.\n\n## Критерії виконання\n\n- кожна операція має класифікацію із зазначеним джерелом підтвердження;\n- операції, які неможливо класифікувати, позначено як такі, а не заповнено припущенням;\n- аванс враховано за датою надходження коштів;\n- власне поповнення й помилкове зарахування не потрапили в дохід від клієнтів;\n- операція на особистій картці позначена як не підтверджена цією випискою."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Скільки я заробив?»\n\n## Ситуація\n\nІгор — ФОП, консультант. Наприкінці місяця він відкриває банківський застосунок, бачить на підприємницькому рахунку **96 400 грн** і робить висновок: «Ось стільки я заробив».\n\nДалі він:\n\n- планує зняти всю суму на власні потреби;\n- рахує доходом усе, що надійшло, разом із власним поповненням рахунку на початку місяця;\n- має аванс від клієнта за роботу, яку виконає лише наступного місяця;\n- бачить у виписці помилкове зарахування від незнайомого платника і лист контрагента з проханням повернути кошти, але відкладає це «до з’ясування»;\n- прийняв оплату від нового клієнта на особисту картку, бо «так швидше»;\n- не перевіряв, які зобов’язання за цей період ще не сплачено;\n- не звіряв комісію банку з тарифним пакетом.\n\nУсі дані синтетичні.\n\n## Завдання\n\n1. Знайдіть щонайменше п’ять реальних фінансових ризиків і відокремте їх від того, що лише звучить по-бухгалтерськи.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Складіть безпечну послідовність дій — без розрахунку конкретних сум податку.\n4. Поясніть клієнтові своїми словами, чому залишок на рахунку не є відповіддю на питання «скільки я заробив».\n\n## Орієнтир для самоперевірки\n\n- залишок — це стан рахунку на одну дату, а не результат періоду;\n- частина залишку може вже належати іншим: аванс клієнта, помилкове зарахування, несплачені зобов’язання;\n- власне поповнення рахунку не створює виручки, бо платник і отримувач — та сама особа;\n- оплата, прийнята повз підприємницький рахунок, не зникає — вона просто не потрапляє в облік разом з іншими;\n- спочатку класифікують і рахують, і лише потім знімають кошти.\n\nЦе навчальний кейс, а не індивідуальна податкова чи юридична консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст місячної фінансової самоперевірки ФОП\n\n## Гроші й залишок\n\n- [ ] Отримано виписку за весь період без пропущених днів.\n- [ ] Вхідний залишок, надходження, списання і вихідний залишок сходяться.\n- [ ] Залишок на рахунку не використано як оцінку прибутку.\n- [ ] Відомо, які зобов’язання «сидять» усередині залишку: податки, аванси клієнтів, неоплачені рахунки.\n\n## Класифікація надходжень\n\n- [ ] Кожне надходження має класифікацію, а не лише суму.\n- [ ] Для доходу зафіксовано дату його фактичного отримання.\n- [ ] Надходження, які доходом не є, виділено окремо із зазначенням причини.\n- [ ] Помилкові зарахування виявлено, і по кожному видно ухвалене рішення.\n- [ ] Аванси й передоплати позначено, а їх повернення відстежено.\n- [ ] Незрозумілі надходження позначено як такі, що потребують запиту, а не класифіковано навмання.\n\n## Особисте й підприємницьке\n\n- [ ] Поповнення власними коштами відокремлено від виручки клієнтів.\n- [ ] Перекази між власними рахунками не пораховано двічі.\n- [ ] Перевірено, чи не приймалась оплата від клієнтів на особистий рахунок.\n- [ ] Зняття коштів на особисті потреби відокремлено від витрат діяльності.\n\n## Заборгованість\n\n- [ ] Складено перелік виконаних робіт, за які оплату ще не отримано.\n- [ ] Складено перелік власних невиконаних зобов’язань за вже отриманими коштами.\n- [ ] Перевірено, чи є заборгованість, за якою минають строки.\n\n## Контроль якості\n\n- [ ] Жодну операцію не класифіковано припущенням замість документа.\n- [ ] У навчальних матеріалах не використано реальні персональні або банківські дані.\n- [ ] Питання поза межами класифікації передано бухгалтеру або юристу."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 2\n\n| Термін | Просте пояснення |\n|---|---|\n| Дохід | Надходження, отримані від провадження підприємницької діяльності за період. |\n| Витрати | Кошти, віддані за ресурси, потрібні для діяльності. |\n| Прибуток | Різниця між доходом і витратами за період. |\n| Залишок коштів | Сума грошей на рахунку на конкретну дату. |\n| Касовий метод | Визнання доходу за датою фактичного надходження коштів. |\n| Аванс | Кошти, отримані до виконання роботи або постачання товару. |\n| Дебіторська заборгованість | Сума, яку винні вам: робота виконана, оплати ще немає. |\n| Кредиторська заборгованість | Сума, яку винні ви: отриманий аванс, неоплачений рахунок. |\n| Зобов’язання | Заборгованість, що виникла з минулих подій і погашення якої зменшить ваші ресурси. |\n| Актив | Ресурс, контрольований у результаті минулих подій, від якого очікують економічну вигоду. |\n| Помилково зараховані кошти | Кошти, зараховані отримувачу без достатньої правової підстави. |\n| Неналежний отримувач | Особа, на рахунок якої без законних підстав зараховано суму платіжної операції. |\n| Поворотна фінансова допомога | Кошти, отримані в користування за договором без процентів і з обов’язком повернення. |\n| Власні кошти підприємця | Гроші тієї самої фізичної особи, внесені нею на підприємницький рахунок. |\n| Внутрішній переказ | Рух коштів між власними рахунками однієї особи; нових грошей не створює. |\n| Підприємницький рахунок | Рахунок, відкритий фізичною особою для здійснення підприємницької діяльності. |"}, {"id": "reference", "title": "Пам’ятка", "content": "# Пам’ятка: гроші ФОП\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-08-24**\n\n## Чотири числа, які не можна плутати\n\n| Число | Питання, на яке відповідає |\n|---|---|\n| Залишок коштів | скільки грошей є зараз |\n| Дохід | скільки надійшло від діяльності за період |\n| Витрати | скільки віддано за ресурси для діяльності |\n| Прибуток | що залишилося як результат роботи |\n\nПрибуток може бути, коли рахунок майже порожній. Залишок може бути великим у збитковому місяці.\n\n## Коли виникає дохід\n\nДата доходу для платника єдиного податку — **дата надходження коштів**, не дата акта й не дата рахунку.\n\n- гроші в жовтні, акт у листопаді → дохід жовтня;\n- акт у жовтні, гроші в листопаді → доходу жовтня немає;\n- аванс у жовтні за листопадову роботу → дохід жовтня.\n\n## Надходження, які доходом не є\n\n- суми ПДВ;\n- поворотна фінансова допомога, повернена протягом 12 календарних місяців, і кредити;\n- кошти цільового призначення з бюджетів і державних фондів;\n- аванси, що повертаються у зв’язку з поверненням товару, розірванням договору або листом-заявою;\n- оплата за реалізоване в період сплати інших податків;\n- повернення надміру сплачених податків і єдиного внеску.\n\nПомилкового зарахування в цьому переліку **немає** — його розбирають окремо.\n\n## Особисте й підприємницьке\n\n| Дія | Правило |\n|---|---|\n| Рахунки | окремі: для діяльності й для власних потреб |\n| Оплата клієнта на особисту картку | заборонено використовувати особистий рахунок у діяльності |\n| Переказ із підприємницького рахунку собі | прямої заборони немає |\n| Внесення власних коштів на підприємницький рахунок | позначити окремо, кваліфікацію узгодити з бухгалтером |\n| Повідомлення банку про статус підприємця | обов’язкове |\n\n## Незрозуміле надходження: що робити\n\n1. Не витрачати.\n2. Знайти підставу: договір, рахунок, лист платника.\n3. Якщо підстави немає — готувати повернення, а не чекати.\n4. Зафіксувати дату, коли надійшло повідомлення про помилку: від неї рахують строк.\n5. Не залишати в реєстрі запис «до з’ясування» без дати й відповідального.\n\n## Заборгованість, якої немає у виписці\n\n| Що | Де шукати |\n|---|---|\n| Вам винні | підписані акти й виставлені рахунки без оплати |\n| Винні ви | отримані аванси, неоплачені рахунки постачальників |\n\nЗагальна позовна давність — три роки, але відлік, винятки й застосування судом перевіряють окремо.\n\n## Що ФОП веде замість бухобліку\n\n| Хто | Що |\n|---|---|\n| Групи 1, 2 і 3 без ПДВ | облік доходів у довільній формі, помісячно |\n| Група 3 з ПДВ | доходи й витрати за типовою формою |\n| Загальна система | доходи й витрати за типовою формою |\n\nДовільна форма — про формат таблиці, а не про право не мати документів."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 2\n\nПеревірено: **2026-08-24**. Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Податкового кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Доходом ФОП — платника єдиного податку є дохід, отриманий за звітний період у грошовій формі | SRC-010, ПКУ, пункт 292.1 | Норма закону | Пасивні доходи й окремі операції з майном до нього не входять |\n| Датою отримання доходу є дата надходження коштів | SRC-010, ПКУ, пункт 292.6 | Норма закону | Є окремі дати для безоплатно отриманих товарів і для 3 групи з ПДВ |\n| Перелік сум, які до складу доходу не включаються | SRC-010, ПКУ, пункт 292.11 | Норма закону | Помилково зарахованих коштів у переліку немає |\n| Поворотна фінансова допомога — кошти без процентів з обов’язком повернення | SRC-014, ПКУ, підпункт 14.1.257 | Норма закону | Не є доходом лише за умови повернення протягом 12 календарних місяців (SRC-010) |\n| На загальній системі об’єкт оподаткування — чистий оподатковуваний дохід | SRC-013, ПКУ, пункт 177.2 | Норма закону | Використано як контраст «дохід ≠ прибуток» |\n| ФОП груп 1, 2 і 3 без ПДВ ведуть облік доходів у довільній формі помісячно | SRC-011, ПКУ, пункт 296.1 | Норма закону | Витрати в цій нормі не згадані |\n| ФОП групи 3 з ПДВ і на загальній системі ведуть облік доходів і витрат за типовою формою | SRC-011, SRC-013, SRC-016 | Норма закону й наказ Мінфіну | Періодичність записів за Порядком — за підсумками робочого дня |\n| Книги обліку доходів для ФОП скасовано | SRC-015, наказ Мінфіну № 728 | Підзаконний акт | Втрата чинності наказу № 579 з 01.01.2021 |\n| Облік ведеться на підставі первинних документів; звітність за непідтвердженими даними заборонена | SRC-012, ПКУ, пункт 44.1 | Норма закону | Це джерело вимоги «первинний документ» для ФОП, а не Закон про бухоблік |\n| Для документів, на які не поширюються спеціальні правила, строк зберігання — 1095 днів | SRC-012, ПКУ, підпункт 44.3.3 | Норма закону | Відлік від дня подання звітності; конкретний строк підтверджує бухгалтер |\n| Фізична особа відкриває окремі рахунки для діяльності та для власних потреб | SRC-021, Інструкція НБУ, пункт 10 розділу I | Норма підзаконного акта | Пряма норма, не рекомендація |\n| Особистий рахунок заборонено використовувати в підприємницькій діяльності | SRC-021, Інструкція НБУ, пункт 24 розділу I | Норма підзаконного акта | Заява про відкриття містить підпис про обізнаність із забороною |\n| Прямої заборони переказувати кошти з підприємницького рахунку на власні потреби немає | SRC-021 | Відсутність норми в акті | Формулювати як відсутність заборони, а не як дозвіл із джерелом |\n| ФОП зобов’язаний повідомити банк про свій статус | SRC-021, SRC-024, ПКУ, пункт 69.7 | Норма закону й підзаконного акта | Дублюється у двох актах |\n| Банк повідомляє податкову про відкриття рахунку в день такої дії | SRC-024, ПКУ, пункт 69.2 | Норма закону | Видаткові операції — після взяття рахунку на облік (пункт 69.4) |\n| Інформацію про обсяг і обіг коштів контролюючий орган отримує на підставі рішення суду | SRC-024, ПКУ, підпункт 20.1.5 | Норма закону | Спростовує міф «податкова бачить кожен платіж» |\n| Помилкова платіжна операція — помилка надавача платіжних послуг | SRC-022, Закон № 1591-IX, стаття 1, пункт 69 | Норма закону | Побутове значення терміна ширше за законодавче |\n| Неналежний отримувач — особа, на рахунок якої кошти зараховано без законних підстав | SRC-022, Закон № 1591-IX, стаття 1, пункт 43 | Норма закону | — |\n| Неналежний отримувач повертає кошти протягом трьох робочих днів з дати повідомлення | SRC-022, Закон № 1591-IX, стаття 88 | Норма закону | Строк рахують від повідомлення, а не від зарахування |\n| Помилку самого платника розбирають за нормою про безпідставно набуте майно | SRC-023, ЦКУ, стаття 1212 | Норма закону | Спеціального строку ця стаття не встановлює |\n| Дебіторська заборгованість — сума заборгованості дебіторів на певну дату | SRC-019, НП(С)БО 10, пункт 4 | Стандарт | Стандарт застосовують юридичні особи; для курсу це джерело термінології |\n| Кредиторська заборгованість окремого нормативного визначення не має | SRC-017, SRC-018 | Поняття «зобов’язання» | Не приписувати НП(С)БО 11 визначення, якого в ньому немає |\n| Активи, зобов’язання і господарська операція визначені Законом про бухоблік | SRC-017, Закон № 996-XIV, стаття 1 | Норма закону | Усі визначення сформульовані через «підприємство» |\n| Закон про бухоблік поширюється на юридичних осіб; ФОП у переліку суб’єктів немає | SRC-017, Закон № 996-XIV, стаття 2 | Норма закону | Прямої норми «не поширюється на ФОП» у Законі немає — ФОП поза колом суб’єктів |\n| Загальна позовна давність — три роки | SRC-020, ЦКУ, стаття 257 | Норма закону | Відлік — стаття 261; спеціальні строки — стаття 258; застосування судом за заявою — стаття 267 |\n\n## Межі перевірки\n\n- Модуль не встановлює ставок, лімітів доходу, строків сплати й сум податку: ці норми (статті 291, 293, 295 ПКУ) у межах модуля **не перевірялися**.\n- Податкову кваліфікацію внесення власних коштів на підприємницький рахунок прямою нормою ПКУ не врегульовано. Модуль подає це як питання до бухгалтера й не стверджує остаточної відповіді. Роз’яснення ДПС у реєстр не внесено: офіційні сторінки ДПС недоступні для автоматичної перевірки, а знайдені відповіді ЗІР мають позначку «діяла до» і не є чинними.\n- Твердження про строк зберігання документів для ФОП подано як загальну норму пункту 44.3, а не як адресну норму для ФОП: прямої норми з такою адресацією в Кодексі немає.\n- Тема списання заборгованості за спливом позовної давності потребує окремої перевірки зупинення перебігу строків; у межах модуля вона не розкривається.\n- Інструкція НБУ № 162 має проєкт змін, оприлюднений у 2026 році. Станом на 24.08.2026 акт про затвердження змін не набрав чинності; перед релізом перевірити повторно."}], "quiz": [{"id": "m02-q01", "title": "Поповнення власними коштами", "competency": "inflow_vs_income", "scenario": "На підприємницький рахунок надійшло 25 000 грн від самої підприємиці з призначенням «поповнення власними коштами».", "question": "Як бухгалтер має опрацювати цю операцію?", "options": [{"text": "Позначити як власні кошти окремо і не змішувати з виручкою клієнтів", "correct": true, "feedback": "Правильно. Платник і отримувач тут одна особа, тому нової виручки не виникає."}, {"text": "Врахувати як виручку жовтня: кошти надійшли на підприємницький рахунок", "feedback": "Ні. Сам факт зарахування на підприємницький рахунок не робить суму оплатою клієнта."}, {"text": "Не відображати ніде: операції між власними рахунками не обліковують", "feedback": "Ні. Операція проходить через рахунок і має бути видно в реєстрі з поясненням."}], "explanation": "Класифікація визначається змістом операції, а не рахунком, на який надійшли кошти. Внесення власних коштів позначають окремо, а податкову кваліфікацію нетипових внесків підтверджує бухгалтер.", "source_reference": ["SRC-010"], "hint": "Запитайте себе, хто заплатив ці гроші і чи з’явився в результаті новий клієнт."}, {"id": "m02-q02", "title": "Дата виникнення доходу", "competency": "cash_basis", "scenario": "Рахунок виставлено 28 вересня, кошти надійшли 25 жовтня, акт підписано 3 листопада.", "question": "На яку дату виникає дохід платника єдиного податку?", "options": [{"text": "На дату виставлення рахунка, бо саме тоді зафіксовано суму послуги", "feedback": "Ні. Рахунок лише повідомляє суму до сплати і не створює доходу сам по собі."}, {"text": "На дату надходження коштів на рахунок підприємця, тобто 25 жовтня", "correct": true, "feedback": "Правильно. Момент визнання доходу прив’язаний саме до руху коштів."}, {"text": "На дату підписання акта, бо він підтверджує виконання роботи", "feedback": "Ні. Акт підтверджує зміст операції, але не визначає періоду визнання доходу."}], "explanation": "Для платника єдиного податку датою отримання доходу є дата надходження коштів у грошовій формі. Документи пояснюють, за що гроші, а дата виписки показує, коли вони стали доходом.", "source_reference": ["SRC-010"], "hint": "З трьох дат у сценарії лише одна пов’язана з фактичним рухом грошей."}, {"id": "m02-q03", "title": "Аванс за майбутню роботу", "competency": "advance_recognition", "scenario": "У жовтні ФОП отримав аванс 18 000 грн за послугу, яку виконає в листопаді.", "question": "Що правильно зробити з цією сумою?", "options": [{"text": "Не визнавати доходом до моменту підписання акта з клієнтом у листопаді", "feedback": "Ні. Очікування акта не переносить дохід у наступний період для єдиного податку."}, {"text": "Визнати доходом листопада разом з іншими надходженнями місяця", "feedback": "Ні. Період визначається датою надходження коштів, а вона припадає на жовтень."}, {"text": "Визнати доходом жовтня і пам’ятати про зобов’язання перед клієнтом", "correct": true, "feedback": "Правильно. Одна операція одночасно створює дохід періоду і зобов’язання виконати роботу."}], "explanation": "Аванс — єдиний випадок, коли надходження водночас збільшує дохід періоду і створює борг перед клієнтом. Саме тому аванс не можна вважати вільними грошима.", "source_reference": ["SRC-010"], "hint": "Подумайте окремо про дві речі: коли виникає дохід і що підприємець залишається винен клієнту."}, {"id": "m02-q04", "title": "Повернення авансу клієнту", "competency": "returns", "scenario": "Клієнт скасував замовлення, і ФОП повернув йому раніше отриманий аванс за листом-заявою.", "question": "Як повернення впливає на дохід?", "options": [{"text": "Дохід не змінюється: кошти вже були отримані в попередньому періоді", "feedback": "Ні. Для повернених сум передбачено окреме правило, і воно змінює наслідок."}, {"text": "Сума, що повертається покупцю, до складу доходу не включається", "correct": true, "feedback": "Правильно. Повернення авансу за листом-заявою прямо назване серед винятків."}, {"text": "Повернення зменшує витрати періоду, а не дохід підприємця", "feedback": "Ні. Повернення чужих коштів не є витратою на ресурси для діяльності."}], "explanation": "Суми, що повертаються покупцю у зв’язку з поверненням товару, розірванням договору або за листом-заявою, до складу доходу не включаються. Тому повернення оформлюють документально.", "source_reference": ["SRC-010"], "hint": "Згадайте перелік сум, які до складу доходу не включаються, і знайдіть у ньому цей випадок."}, {"id": "m02-q05", "title": "Строк повернення чужих коштів", "competency": "mistaken_credit", "scenario": "Банк повідомив ФОП, що на його рахунок помилково зараховано кошти іншого отримувача.", "question": "Від якої події рахують строк на повернення?", "options": [{"text": "Від дати надходження повідомлення надавача платіжних послуг", "correct": true, "feedback": "Правильно. Відлік починається саме з повідомлення, а не з руху коштів."}, {"text": "Від дати зарахування коштів на рахунок неналежного отримувача", "feedback": "Ні. Зарахування могло статися раніше, ніж отримувач узагалі дізнався про помилку."}, {"text": "Від дати, коли отримувач самостійно виявив зайву суму у виписці", "feedback": "Ні. Момент самостійного виявлення суми законом як початок відліку не названо."}], "explanation": "Неналежний отримувач зобов’язаний ініціювати повернення протягом трьох робочих днів з дати надходження повідомлення надавача платіжних послуг. Прострочення має власні наслідки.", "source_reference": ["SRC-022"], "hint": "У сценарії є дві різні події: рух коштів і повідомлення. Одна з них запускає відлік."}, {"id": "m02-q06", "title": "Помилка самого платника", "competency": "mistaken_credit", "scenario": "Контрагент помилився в реквізитах і сам надіслав кошти не тому ФОП; банк помилки не робив.", "question": "Яка правова підстава повернення в цьому випадку?", "options": [{"text": "Стаття про помилкову платіжну операцію: помилка сталася під час платежу", "feedback": "Ні. Це поняття в законі означає вужчу ситуацію, ніж будь-яка помилка з коштами."}, {"text": "Спеціальний тридобовий строк діє для будь-якої помилки з коштами", "feedback": "Ні. Цей строк установлено для окремих випадків, а не для всіх помилкових переказів."}, {"text": "Норма про обов’язок повернути безпідставно набуте майно", "correct": true, "feedback": "Правильно. Коли помилився сам платник, працює загальна цивільна норма."}], "explanation": "Закон розрізняє помилку надавача платіжних послуг і помилку самого платника. У другому випадку підставою повернення є норма про безпідставно набуте майно, і спеціального строку вона не встановлює.", "source_reference": ["SRC-022", "SRC-023"], "hint": "Зверніть увагу, чия саме помилка описана в сценарії: від цього залежить, який закон працює."}, {"id": "m02-q07", "title": "Оплата на особисту картку", "competency": "accounts_separation", "scenario": "Клієнт пропонує сплатити за послугу переказом на особисту картку підприємця.", "question": "Що встановлює норма про використання рахунків?", "options": [{"text": "Особистий рахунок можна використовувати, якщо сума операції невелика", "feedback": "Ні. Норма не ставить використання рахунку в залежність від розміру платежу."}, {"text": "Особистий рахунок не використовують для підприємницьких операцій", "correct": true, "feedback": "Правильно. Для діяльності відкривають окремий рахунок, і це пряма вимога."}, {"text": "Обмежень немає: рахунки фізичної особи не поділяються за призначенням", "feedback": "Ні. Рахунки для власних потреб і для діяльності розмежовані нормативно."}], "explanation": "Фізична особа відкриває окремі рахунки для підприємницької діяльності та для власних потреб, а використання особистого рахунку в діяльності прямо заборонене. Підтвердження цього підписує сам клієнт у заяві на відкриття.", "source_reference": ["SRC-021"], "hint": "Пригадайте, що фізична особа підписує в заяві, коли відкриває картку для власних потреб."}, {"id": "m02-q08", "title": "Переказ собі з підприємницького рахунку", "competency": "accounts_separation", "scenario": "Підприємиця хоче переказати частину коштів із підприємницького рахунку на власну картку.", "question": "Що відомо про такий переказ із норм?", "options": [{"text": "Прямої заборони такого переказу норми не встановлюють", "correct": true, "feedback": "Правильно. Заборона стосується протилежного напрямку використання рахунків."}, {"text": "Такий переказ заборонений так само, як зворотний напрямок", "feedback": "Ні. Обмеження сформульоване для рахунку, відкритого для власних потреб."}, {"text": "Такий переказ потребує окремого дозволу банку на кожну суму", "feedback": "Ні. Окремого дозвільного порядку для таких переказів норми не передбачають."}], "explanation": "Заборона адресована використанню особистого рахунку в підприємницькій діяльності. Зворотного правила немає: підприємець розпоряджається власними коштами після того, як зобов’язання періоду враховані.", "source_reference": ["SRC-021"], "hint": "Порівняйте два напрямки руху коштів і згадайте, до якого саме рахунку адресована заборона."}, {"id": "m02-q09", "title": "Виконана робота без оплати", "competency": "receivables", "scenario": "Акт на 15 000 грн підписано в жовтні, але клієнт не заплатив до кінця місяця.", "question": "Як це відображається у фінансовій картині жовтня?", "options": [{"text": "Як дохід жовтня: робота виконана й підтверджена підписаним актом", "feedback": "Ні. Для єдиного податку підписаний акт без оплати доходу періоду не створює."}, {"text": "Ніяк: подія без руху коштів у фінансовій картині не враховується", "feedback": "Ні. Невиконане зобов’язання клієнта треба бачити, інакше про нього забувають."}, {"text": "Як дебіторська заборгованість, доходу жовтня ця сума не створює", "correct": true, "feedback": "Правильно. Сума існує у фінансовій картині, але поза рухом коштів періоду."}], "explanation": "Виконана й неоплачена робота — це дебіторська заборгованість. У виписці її не видно, тому її ведуть окремо за підписаними актами й виставленими рахунками.", "source_reference": ["SRC-010", "SRC-019"], "hint": "Питання складається з двох частин: чи є тут дохід періоду і чи є що взагалі обліковувати."}, {"id": "m02-q10", "title": "Який облік веде ФОП", "competency": "records_duty", "scenario": "ФОП на спрощеній системі без ПДВ питає, чи має він вести бухгалтерський облік.", "question": "Яка відповідь правильна?", "options": [{"text": "Так, бухгалтерський облік ведуть усі суб’єкти господарювання країни", "feedback": "Ні. Коло суб’єктів, на які поширюється Закон про бухоблік, окреслене інакше."}, {"text": "Ні, він веде облік доходів у довільній формі помісячно", "correct": true, "feedback": "Правильно. Для цієї категорії передбачено саме облік доходів, а не бухоблік."}, {"text": "Так, але за спрощеною формою бухгалтерського обліку для ФОП", "feedback": "Ні. Спрощений бухгалтерський облік адресований юридичним особам, а не ФОП."}], "explanation": "ФОП груп 1, 2 і 3 без ПДВ ведуть облік доходів у довільній формі з помісячним відображенням. Довільна форма стосується формату, а не права обходитися без первинних документів.", "source_reference": ["SRC-011", "SRC-017"], "hint": "Розділіть два різні поняття: бухгалтерський облік підприємства і облік доходів підприємця."}], "activities": {"precheck": [{"id": "pre-balance", "question": "Як гадаєте: чи можна назвати прибуток за місяць, дивлячись на залишок коштів на рахунку?", "options": [{"text": "Так, залишок і є результатом місяця", "correct": false}, {"text": "Ні, це різні числа з різним змістом", "correct": true}, {"text": "Так, якщо рахунок лише один", "correct": false}], "note": "Це головна розвилка модуля. У розділі «Чотири різні числа» ви побачите, чому прибуток буває там, де на рахунку ни підписали 3 листопада.", "question": "У якому місяці виникає дохід платника єдиного податку?", "options": [{"text": "У листопаді, бо саме тоді сторони підписали акт виконаних робіт", "feedback": "Ні. Для єдиного податку дата акта не визначає момент виникнення доходу."}, {"text": "У листопаді або жовтні — на вибір підприємця під час звітування", "feedback": "Ні. Дата визначається нормою, а не рішенням підприємця при складанні звіту."}, {"text": "У жовтні, бо дохід виникає за датою надходження коштів", "correct": true, "feedback": "Правильно. Дата отримання доходу — це дата надходження коштів підприємцю."}], "source_reference": ["SRC-010"]}, {"id": "lesson-not-income", "section": "Надходження, які доходом не є", "scenario": "ФОП отримав поворотну фінансову допомогу і повернув її через три місяці.", "question": "Як ця сума впливає на дохід?", "options": [{"text": "Не включається до доходу, якщо повернення відбулося протягом 12 місяців", "correct": true, "feedback": "Правильно. Умова саме в строку повернення, а не в самому факті договору."}, {"text": "Включається до доходу в місяці отримання, незалежно від дати її повернення", "feedback": "Ні. Своєчасне повернення протягом установленого строку змінює наслідок."}, {"text": "Не впливає на дохід у жодному разі, бо це не оплата за роботу", "feedback": "Ні. Без дотримання строку повернення пільгове правило перестає діяти."}], "source_reference": ["SRC-010", "SRC-014"]}, {"id": "lesson-personal-account", "section": "Особисті й підприємницькі кошти", "scenario": "Клієнт просить надіслати номер особистої картки, щоб швидше сплатити за послугу.", "question": "Що має відповісти підприємець?", "options": [{"text": "Надіслати картку: для клієнта це швидше, а гроші однаково надійдуть", "feedback": "Ні. Швидкість оплати не змінює правил використання рахунків фізичної особи."}, {"text": "Надіслати картку, а потім переказати суму на підприємницький рахунок", "feedback": "Ні. Наступний переказ не виправляє того, що операцію вже прове  на рахунку і створює зобов’язання виконати роботу або повернути кошти.", "hint": "Уявіть, що клієнт завтра скасує замовлення. Що станеться з цією сумою?"}, {"id": "mistaken_ignored", "text": "Залишити помилково зараховані кошти без рішення й відкласти лист контрагента", "critical": true, "category": "кошти", "owner": "юрист", "feedback": "Помилкове зарахування не стає власністю отримувача від того, що воно лежить на рахунку; письмову вимогу не можна ігнорувати.", "hint": "Запитайте себе, чиї це гроші за змістом операції і що змінює час, поки вони лежать на рахунку."}, {"id": "personal_card", "text": "Приймати оплату від клієнта на особисту картку", "critical": true, "category": "банківський", "owner": "власник", "feedback": "Оплата, що прийшла повз підприємницький рахунок, не потрапляє в підприємницький облік разом з іншими й виявляється найпізніше.", "hint": "Подумайте, у якій виписці бухгалтер побачить цю оплату наприкінці місяця — і чи побачить її взагалі."}, {"id": "no_liabilities_check", "text": "Планувати зняти весь залишок, не перевіривши несплачених зобов’язань періоду", "critical": true, "category": "податковий", "owner": "бухгалтер", "feedback": "Спершу визначають зобов’язання періоду, і лише залишок після них є вільною сумою для власних потреб.", "hint": "Порівняйте дві дії: спочатку зняти гроші й потім рахувати — чи спочатку порахувати й потім зняти."}, {"id": "bank_fee", "text": "Не звірити комісію банку з тарифним пакетом", "critical": false, "category": "кошти", "owner": "власник", "feedback": "Звірка тарифу корисна для економії, але вона не змінює ані класифікації надходжень, ані обсягу зобов’язань Ігоря в цьому кейсі.", "hint": "Порівняйте це з рештою тверджень: чи змінює воно відповідь на питання «скільки я заробив»?"}, {"id": "paper_folder", "text": "Не роздрукувати виписку для паперової папки", "critical": false, "category": "банківський", "owner": "власник", "feedback": "Звучить по-бухгалтерськи, але спосіб зберігання документів — тема окремого
