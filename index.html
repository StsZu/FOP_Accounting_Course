", "Згадайте щонайменше три напрями: строк повідомлення, відновлення документів, наслідок бездіяльності.", "Не переказуйте ситуацію — сформулюйте висновок, який ви сказали б клієнту."], "reasoning_aspects": [{"label": "Строк повідомлення", "terms": ["повідом", "строк", "5 дн", "днів"]}, {"label": "Відлік від дня події", "terms": ["поді", "серпн", "дат", "від дня"]}, {"label": "Відновлення документів", "terms": ["віднов", "90", "дублікат"]}, {"label": "Наслідок бездіяльності", "terms": ["вважа", "відсутн", "не було", "штраф"]}], "reasoning_model": "Втрата документів — єдина позиція списку, у якої вже спливає встановлений законом строк: письмово повідомити контролюючий орган треба протягом пʼяти днів від дня події, а подія сталася в серпні. Після повідомлення починається відлік 90 календарних днів на відновлення документів. Якщо документи не відновлено, вважається, що їх не було на час складання звітності, і жодне переоформлення актів це вже не виправить. Решта позицій списку — дефекти форми, які можна усунути пізніше, і саме тому вони йдуть після повідомлення."}, "checklist": {"title": "Приймання документа від контрагента", "instructions": "Пройдіть перевірку так, як її робить бухгалтер, коли отримує документ. Для кожного пункту виберіть обґрунтований статус і напишіть, чим він підтверджений або чого бракує.", "how_to": ["Тримайте перед очима результат Практики: чекліст перевіряє той самий порядок дій на іншому документі.", "Ідіть зверху вниз і для кожного пункту виберіть статус: підтверджено, потрібні дані або не застосовується.", "У полі праворуч напишіть, чим статус підтверджено або що саме треба отримати — щонайменше 10 символів.", "Якщо незрозуміло, що перевіряти, натисніть «Підказка» біля пункту: вона каже, де шукати, але не диктує статус.", "Критичні пункти зі знаком «!» не можна закрити як «не застосовується».", "Стежте за поясненням під пунктом: воно живцем показує, чого ще бракує."], "note_min_chars": 10, "statuses": [{"value": "", "label": "Не перевірено"}, {"value": "confirmed", "label": "Підтверджено"}, {"value": "needs_data", "label": "Потрібні дані"}, {"value": "na", "label": "Не застосовується", "blocks_critical": true}], "items": [{"id": "operation", "group": "Що це за операція", "text": "Визначено, яку саме господарську операцію документ підтверджує", "critical": true, "hint": "Сформулюйте операцію одним реченням: що зроблено, ким, для кого і в якому обсязі. Якщо це не виходить із тексту документа — статус «потрібні дані».", "why": "Первинний документ — це документ про господарську операцію; поки операція не названа, немає чого перевіряти в документі."}, {"id": "contract_match", "group": "Що це за операція", "text": "Документ звірено з договором: сторони, предмет і сума", "critical": true, "hint": "Порівняйте три речі з текстом договору. Розбіжність у сумі — це «потрібні дані», а не привід самостійно виправити документ.", "why": "Розбіжність між договором і документом виявляється дешево зараз і дорого під час перевірки."}, {"id": "period", "group": "Що це за операція", "text": "Зрозуміло, який період операції охоплює документ", "critical": false, "hint": "Подивіться, чи названо в документі місяць, період або дати надання послуги; якщо ні — запишіть, у кого це уточнити.", "why": "Період потрібен, щоб не оплатити ту саму роботу двічі й правильно віднести операцію до звітного періоду."}, {"id": "req_title", "group": "Шість реквізитів", "text": "Назва документа й дата складання є", "critical": true, "hint": "Це перші дві позиції переліку. Дата складання, крім того, входить до умов, за яких недолік вважається неістотним.", "why": "Без дати складання документ не проходить перевірку на неістотність недоліку й перестає бути надійним підтвердженням."}, {"id": "req_party", "group": "Шість реквізитів", "text": "Названо сторону, від імені якої складено документ", "critical": true, "hint": "Шукайте не всі згадки сторін, а саме того, від чийого імені складено документ. Описка в назві — окреме питання, не відсутність.", "why": "Без цього реквізиту неможливо сказати, чиє це свідчення про операцію."}, {"id": "req_content", "group": "Шість реквізитів", "text": "Зміст, обсяг операції та одиниця виміру зрозумілі з тексту", "critical": true, "hint": "Перевірте три речі: що зроблено, скільки цього зроблено і в яких вимірниках. Формулювання «послуги згідно з договором» цього не дає.", "why": "Саме зміст і обсяг операції відрізняють документ про роботу від документа ні про що."}, {"id": "req_sign", "group": "Шість реквізитів", "text": "Є посади, прізвища відповідальних осіб і дані для ідентифікації підписанта", "critical": true, "hint": "Це дві останні позиції переліку. Замість власноручного підпису можуть бути інші дані, що дають змогу ідентифікувати особу.", "why": "Можливість ідентифікувати особу — перша з чотирьох умов, за яких недолік документа лишається неістотним."}, {"id": "extra_req", "group": "Шість реквізитів", "text": "Перевірено, що контрагенту не висунуто вимог поза переліком обовʼязкових", "critical": false, "hint": "Перечитайте власний запит контрагенту: чи немає в ньому печатки, номера або місця складання як обовʼязкових вимог.", "why": "Зайві вимоги затримують закриття періоду й псують стосунки з контрагентом без жодної користі для обліку."}, {"id": "form", "group": "Форма й підпис", "text": "Визначено форму: паперовий оригінал, електронний оригінал, копія чи скан", "critical": true, "hint": "Питання просте: чи є в файлі накладений електронний підпис. Якщо це зображення паперу — форма визначена, але оригінал деінде.", "why": "Від форми залежить, чи є у вас документ узагалі, чи лише його зображення."}, {"id": "signature_check", "group": "Форма й підпис", "text": "Для електронного документа підпис перевірено, результат зафіксовано", "critical": true, "hint": "Перевірка дає три відповіді: хто підписав, коли і чи не порушено цілісність. Запишіть їх, а не лише «перевірив».", "why": "Перевірка цілісності — це дія з файлом; без неї підпис лишається припущенням про автора."}, {"id": "facsimile", "group": "Форма й підпис", "text": "Перевірено, чи не використано факсиміле без письмової згоди сторін", "critical": false, "hint": "Подивіться, чи підпис не є відбитком штампа, і чи є в договорі письмова згода зі зразками підписів.", "why": "Факсиміле без письмової згоди зі зразками підписів створює ризик у спорі про факт правочину."}, {"id": "dates", "group": "Дати", "text": "Дату складання документа записано окремо від дати операції", "critical": true, "hint": "Занотуйте обидві дати поруч. Якщо в документі є лише одна — запишіть, якої саме бракує.", "why": "Змішування цих дат — найчастіша причина того, що операція потрапляє не в той період."}, {"id": "income_date", "group": "Дати", "text": "Для доходу взято дату надходження коштів, а не дату документа", "critical": true, "hint": "Знайдіть у виписці день зарахування коштів. Якщо виписки немає, статус «потрібні дані» — і це нормальний результат перевірки.", "why": "Для платника єдиного податку дохід визнають за датою надходження коштів, і дата акта на це не впливає."}, {"id": "gap_action", "group": "Що робити з розбіжністю", "text": "Для кожного відсутнього реквізиту вирішено: неістотний недолік чи відсутній реквізит", "critical": true, "hint": "Пройдіть чотирма умовами неістотності: ідентифікація особи, дата, назва сторони, зміст і обсяг операції.", "why": "Без цього рішення частина документів переоформлюється дарма, а частина проблемних лишається в архіві."}, {"id": "request", "group": "Що робити з розбіжністю", "text": "На відсутні реквізити надіслано запит із дедлайном до закриття періоду", "critical": false, "hint": "Запишіть дату запиту й дату, до якої потрібен документ. «Написав у месенджер» без дати — це «потрібні дані».", "why": "Документ, якого просять «колись», не приходить ніколи; дедлайн привʼязує запит до закриття періоду."}, {"id": "loss", "group": "Що робити з розбіжністю", "text": "Втрачені документи, якщо такі є, взято на облік із датою події", "critical": true, "hint": "Дата події важливіша за дату виявлення: саме від неї рахують строк повідомлення контролюючого органу.", "why": "Пропущений пʼятиденний строк перетворює керовану ситуацію на відсутність документів із відповідними наслідками."}, {"id": "storage", "group": "Контроль якості", "text": "Документ збережено так, що його можна знайти й пред'явити", "critical": false, "hint": "Перевірте себе одним питанням: скільки часу займе знайти цей документ через рік. Якщо більше хвилини — «потрібні дані».", "why": "Ненадання документів під час перевірки прирівнюється до їх відсутності, незалежно від того, що вони десь є."}]}, "glossary": [{"term": "Господарська операція", "definition": "Дія або подія, яка викликає зміни в структурі активів та зобовʼязань або власного капіталу.", "example": "Надання послуги замовнику й отримання оплати за неї — дві різні господарські операції.", "avoid": "«будь-яка дія підприємця» — розмова з клієнтом операцією не є"}, {"term": "Первинний документ", "definition": "Документ, який містить відомості про господарську операцію. Спочатку є операція, документ її фіксує.", "example": "Акт наданих послуг за вересень підтверджує, що саме й у якому обсязі виконано.", "avoid": "«будь-який папір від контрагента» — комерційна пропозиція документом про операцію не є"}, {"term": "Зведений документ", "definition": "Документ, складений на підставі кількох первинних для контролю та впорядкування оброблення даних.", "example": "Один денний документ за даними касових чеків замість документа на кожен продаж.", "avoid": "«заміна первинних документів» — зведений документ спирається на них, а не скасовує"}, {"term": "Обовʼязкові реквізити", "definition": "Шість елементів документа: назва, дата складання, назва сторони, зміст і обсяг операції з одиницею виміру, посади й прізвища відповідальних, підпис або дані для ідентифікації.", "example": "Перевірка документа починається з проходу цим переліком по пунктах.", "avoid": "«сім реквізитів із місцем складання» — місце виключено з переліку в 2020 році"}, {"term": "Додатковий реквізит", "definition": "Елемент, який може включатися до документа залежно від характеру операції: печатка, номер документа, підстава для здійснення операції.", "example": "Акт без номера й печатки лишається належно оформленим документом.", "avoid": "«необовʼязковий, але бажаний» — вимагати його від контрагента підстав немає"}, {"term": "Неістотний недолік", "definition": "Дефект оформлення, який не заважає ідентифікувати особу й не приховує дату, назву сторони, зміст і обсяг операції.", "example": "Описка в назві вулиці замовника за збігу решти даних із договором.", "avoid": "«дрібна помилка на розсуд бухгалтера» — є чотири умови, які перевіряють по черзі"}, {"term": "Оригінал електронного документа", "definition": "Електронний примірник документа з обовʼязковими реквізитами, у тому числі з електронним підписом автора.", "example": "Файл, надісланий трьом адресатам, є оригіналом у кожного з них.", "avoid": "«файл із головного компʼютера» — місце зберігання оригінальності не додає"}, {"term": "Візуальна форма", "definition": "Відображення електронного документа на екрані або на папері у формі, придатній для сприйняття людиною.", "example": "Роздрук електронного акта, щоб показати його на зустрічі.", "avoid": "«те саме, що оригінал» — візуальна форма показує документ, а не є ним"}, {"term": "Копія документа", "definition": "Документ, що містить точне знакове відтворення змісту або документної інформації іншого документа.", "example": "Ксерокопія акта, засвідчена підписом і датою.", "avoid": "«фото в месенджері» — незасвідчене зображення копією в правовому сенсі не є"}, {"term": "Витяг", "definition": "Засвідчена копія частини тексту службового документа.", "example": "Витяг із договору лише в частині порядку оплати.", "avoid": "«скорочений переказ» — витяг відтворює текст, а не переказує його"}, {"term": "Дублікат", "definition": "Повторно оформлений документ для використання замість втраченого чи пошкодженого оригіналу; має таку саму юридичну силу.", "example": "Замість залитого водою акта контрагент видає дублікат із відміткою «Дублікат».", "avoid": "«ще одна копія» — дублікат замінює оригінал, а копія лише відтворює його"}, {"term": "Електронний підпис", "definition": "Електронні дані, що додаються до інших електронних даних і використовуються підписувачем як підпис.", "example": "Найпростіший рівень підпису, юридичну силу якого не можна заперечити лише через електронну форму.", "avoid": "«те саме, що КЕП» — це три різні рівні з різними наслідками"}, {"term": "Удосконалений електронний підпис", "definition": "Підпис, однозначно повʼязаний із підписувачем, створений під його одноосібним контролем, який дає змогу виявити будь-яку подальшу зміну даних.", "example": "Підтвердження такого підпису показує, що після підписання файл не змінювали.", "avoid": "«майже КЕП» — презумпції відповідності власноручному підпису він не дає"}, {"term": "Кваліфікований електронний підпис", "definition": "Удосконалений підпис, створений засобом КЕП на основі кваліфікованого сертифіката; має презумпцію відповідності власноручному підпису.", "example": "Підписання електронного акта через кваліфікованого надавача довірчих послуг.", "avoid": "«без нього документ недійсний» — закон вимагає КЕП лише в окремих випадках"}, {"term": "Електронна печатка", "definition": "Засіб підтвердження достовірності походження та цілісності електронного документа.", "example": "Печатка на автоматично сформованому документі облікової системи.", "avoid": "«підпис організації» — печатка підтверджує документ, а не особу"}, {"term": "Довірчий список", "definition": "Перелік кваліфікованих надавачів електронних довірчих послуг, за яким перевіряють статус надавача.", "example": "Звірка надавача, чий сертифікат стоїть на отриманому документі.", "avoid": "«реєстр підписів» — у списку надавачі послуг, а не підписи"}]}}, {"index": 5, "id": "module-05", "level": 2, "slug": "module_05_vydy_dokumentiv", "meta": {"schema": "course-module/v1", "id": "module-05", "level": 2, "title": "Основні види документів", "language": "uk", "version": "0.1.0", "status": "app_ready", "summary": "Навчіться збирати комплект документів під операцію: яке питання закриває кожен документ, де форма встановлена законом, а де довільна, і чого в папці бракує.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "pending", "last_verified": "2026-09-06", "next_review": "2026-11-01", "depends_on": ["module-04"], "estimated_minutes": 60, "source_ids": ["SRC-012", "SRC-017", "SRC-039", "SRC-040", "SRC-041", "SRC-046", "SRC-049", "SRC-050", "SRC-051", "SRC-052", "SRC-053", "SRC-054", "SRC-055", "SRC-056"], "outcomes": ["Пояснити, які три питання закриває комплект документів під операцію", "Відрізнити документ із встановленими законом реквізитами від документа довільної форми", "Пояснити, чому рахунок не підтверджує операцію, і чим його замінюють", "Визначити, яких документів бракує для конкретної операції", "Назвати документи, що підтверджують повноваження й оплату, і вимоги до них"], "primary_source": {"id": "SRC-049", "note": "Стаття 48 Закону про автомобільний транспорт — прочитайте перелік обовʼязкових реквізитів товарно-транспортної накладної самостійно. Він короткий, і в ньому немає того, що більшість людей упевнено там очікує побачити."}, "sessions": [{"title": "Сесія 1 · Три питання і дві форми", "minutes": 25, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Чого бракує в комплекті", "minutes": 20, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Рахунок, довіреність, зміна договору", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви перестанете збирати папку «про всяк випадок» і бачитимете, на яке саме питання у вашому комплекті немає відповіді.", "accountant": "Ви працюєте з клієнтами: модуль дає робочу рамку приймання — три питання під операцію й розділення документів на ті, у яких форма встановлена законом, і ті, що складаються довільно.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете зрозуміти, чому бухгалтер просить акт, якщо у вас уже є рахунок і виписка."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Основні види документів\n\n## Мета\n\nНавчитися збирати комплект документів під конкретну операцію: розуміти, яке питання закриває кожен документ, у яких документів форма встановлена законом, а які складають довільно, і бачити, чого в папці бракує.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. пояснити, які три питання закриває комплект документів під операцію;\n2. відрізнити документ із встановленими законом реквізитами від документа довільної форми;\n3. пояснити, чому рахунок не підтверджує операцію, і чим його замінюють;\n4. визначити, яких документів бракує для конкретної операції;\n5. назвати документи, що підтверджують повноваження й оплату, і вимоги до них.\n\n## Передумови\n\nМодуль 4. Перелік із шести обовʼязкових реквізитів і межа неістотного недоліку в цьому модулі використовуються як готовий інструмент.\n\n## Основні терміни\n\n- **Рахунок** — документ про намір: вимога оплатити. Господарської операції він не фіксує. [SRC-055]\n- **Акт наданих послуг** — документ про подію: що саме зроблено й у якому обсязі.\n- **Товарно-транспортна накладна** — документ на перевезення вантажу з реквізитами, встановленими законом. [SRC-049]\n- **Розрахунковий документ** — документ встановленої форми, що підтверджує факт продажу або отримання коштів. [SRC-052]\n- **Платіжна інструкція** — документ, яким ініціюють платіжну операцію; має вісім обовʼязкових реквізитів. [SRC-051]\n\n## Теоретичний матеріал\n\n### 1. Комплект документів відповідає на три питання\n\nЦе рамка всього модуля. Будь-яка операція описується трьома питаннями, і на кожне відповідає свій документ.\n\n| Питання | Що відповідає | Приклад |\n|---|---|---|\n| Про що домовилися | договір, додаткова угода, рахунок | договір про надання послуг [SRC-054] |\n| Що сталося | акт, видаткова накладна, ТТН | акт наданих послуг за вересень |\n| Чим заплачено | платіжна інструкція, виписка, чек, розписка | фіскальний чек [SRC-053] |\n\nПомилки, які видно одразу через цю рамку:\n\n- **лише рахунки й оплати** — закрито перше й третє питання, друге відкрите: невідомо, чи щось сталося;\n- **лише акти** — невідомо, на якій підставі й чи заплачено;\n- **лише виписка** — видно рух коштів, але не видно, за що.\n\n> [!PRINCIPLE]\n> Перевіряючи папку, питайте не «чи багато тут документів», а «на яке з трьох питань немає відповіді».\n\n### 2. Форма документа: встановлена законом чи довільна\n\nДруга рамка модуля. Документи діляться на дві групи, і це визначає, як їх перевіряти.\n\n| Форма встановлена законом | Форма довільна |\n|---|---|\n| товарно-транспортна накладна [SRC-049] [SRC-050] | рахунок |\n| фіскальний чек [SRC-053] | акт наданих послуг |\n| платіжна інструкція [SRC-051] | видаткова накладна |\n| — | додаткова угода |\n\nДля документів довільної форми діє загальне правило: документування може здійснюватися з використанням виготовлених самостійно бланків, які повинні містити обовʼязкові реквізити або реквізити типових чи спеціалізованих форм. [SRC-040] Тобто «своя форма» — це не свавілля: шість реквізитів з модуля 4 має бути в кожному.\n\n> [!REMEMBER]\n> Питання «де взяти бланк акта наданих послуг» здебільшого не має відповіді, бо затвердженої форми немає. Правильне питання — «чи є в моєму бланку шість обовʼязкових реквізитів». [SRC-039]\n\n### 3. Рахунок: документ про намір\n\nРахунок (рахунок-фактура) **не підтверджує операцію**. Мінфін у розʼясненні 2006 року дійшов висновку, що рахунок за своїм призначенням не відповідає ознакам первинного документа, оскільки ним не фіксується жодна господарська операція, розпорядження або дозвіл на її проведення, а сам він має лише інформаційний характер. [SRC-055]\n\nДва застереження, з якими це треба читати:\n\n- це **розʼяснення, а не норма**: посилатися на нього як на закон не можна;\n- лист старий, і деякі інші його твердження вже не діють — зокрема про типову форму довіреності М-2 та обовʼязкову печатку на ній. [SRC-056]\n\nАле сам висновок узгоджується з чинним визначенням: первинний документ містить відомості про **господарську операцію**, а рахунок містить вимогу заплатити. [SRC-017]\n\nЧим рахунок корисний попри це:\n\n- він фіксує, про що домовилися, коли окремого договору немає: оплата рахунку є прийняттям пропозиції;\n- він задає призначення платежу, яке потім потрапляє до платіжної інструкції;\n- він потрібен клієнтові для внутрішнього погодження оплати.\n\n> [!RISK]\n> «У нас є рахунок і виписка, цього досить» — найпоширеніша помилка теми. Разом вони показують намір і оплату, але не показують, що саме сталося. Для послуги це закриває акт, для товару — видаткова накладна. [SRC-055]\n\n### 4. Акт наданих послуг і акт виконаних робіт\n\nЗатвердженої форми немає — акт складають у довільній формі з шістьма обовʼязковими реквізитами. [SRC-039] Змістовно він має відповідати на питання «що саме й у якому обсязі зроблено», інакше не виконує своєї функції. [SRC-039]\n\nЮридична основа різна для послуг і для робіт:\n\n- за договором про надання послуг виконавець надає послугу, яка **споживається в процесі** вчинення дії, а замовник її оплачує; [SRC-054]\n- за договором підряду підрядник виконує роботу й передає **результат**, а замовник зобовʼязаний прийняти роботу, оглянути її та негайно заявити про недоліки. [SRC-054]\n\nПрактичний наслідок другого правила: замовник, який прийняв роботу без перевірки, втрачає право посилатися на явні недоліки. [SRC-054] Тому акт — це не формальність, а момент, у який замовник приймає роботу.\n\n> [!INFO]\n> Норма з модуля 4 працює саме тут: якщо документ містить дату або період надання послуг чи виконання робіт, відсутність підпису та посади з боку замовника не є порушенням вимог до оформлення — за умови, що такий порядок передбачено письмовим договором. [SRC-039] Межі застосування цієї норми для ФОП описано в `references.md`.\n\n### 5. Видаткова накладна і момент передання товару\n\nВидаткова накладна фіксує передання товару. Затвердженої форми для загального випадку немає; діє те саме правило про самостійно виготовлені бланки з обовʼязковими реквізитами. [SRC-040]\n\nДата накладної має збігатися з моментом, коли обовʼязок продавця передати товар вважається виконаним: вручення товару покупцеві, якщо продавець зобовʼязаний доставити, або надання товару в розпорядження покупця, якщо товар передається за місцезнаходженням. [SRC-054]\n\n### 6. Товарно-транспортна накладна: реквізити з іншого закону\n\nТТН — єдиний для всіх учасників транспортного процесу документ, призначений для обліку товарно-матеріальних цінностей на шляху їх переміщення, розрахунків за перевезення й обліку виконаної роботи; складається в паперовій та/або електронній формі. [SRC-050] Фізичних осіб, які перевозять вантаж за власний кошт і для власних потреб, це не стосується. [SRC-050]\n\nОбовʼязкові реквізити ТТН встановлює **інший закон**, і перелік у ньому свій: [SRC-049]\n\n1. дата і місце складання;\n2. вантажовідправник;\n3. автомобільний перевізник, зокрема прізвище водія й номер посвідчення;\n4. вантажоодержувач;\n5. транспортний засіб і його параметри;\n6. пункти завантаження і розвантаження.\n\n> [!RISK]\n> Дві пастки в цьому переліку. Перша: **місце складання тут обовʼязкове**, хоча в переліку статті 9 Закону про бухгалтерський облік його немає — це різні норми для різних документів. Друга: **опису самого вантажу серед обовʼязкових реквізитів ТТН немає**. [SRC-049] Саме тому ТТН не замінює видаткової накладної: вона про перевезення, а не про те, що передано.\n\nТТН виписує замовник (вантажовідправник) у **трьох примірниках** і засвідчує підписом усі. [SRC-050] Оформлення ТТН здійснюється незалежно від умов оплати за роботу автомобіля. [SRC-050]\n\nЕлектронна ТТН (е-ТТН) підписується електронним підписом водія або експедитора та відповідальних осіб вантажовідправника й вантажоодержувача; її створення, передавання й зберігання підпорядковані законодавству про електронні документи та електронні довірчі послуги. [SRC-050] Водій предʼявляє е-ТТН у візуальній формі подання електронного документа. [SRC-050]\n\n### 7. Чек і розрахунковий документ\n\nРозрахунковий документ — це документ **встановленої форми та змісту**, що підтверджує факт продажу або повернення товарів, надання послуг, отримання чи повернення коштів; до розрахункових документів належать касовий чек, товарний чек, видатковий чек, розрахункова квитанція, проїзний документ. [SRC-052] Він створюється в паперовій та/або електронній формі. [SRC-052]\n\nФіскальний чек має обовʼязкові реквізити, встановлені окремим наказом: найменування субʼєкта господарювання, назва й адреса господарської одиниці, податковий номер або індивідуальний податковий номер платника ПДВ, назва товару або послуги з вартістю, і низка інших. [SRC-053]\n\nКоли ФОП **зобовʼязаний** застосовувати реєстратор розрахункових операцій — окрема тема модуля 10. Тут важливе інше: чек із магазину є розрахунковим документом і підтверджує саме факт розрахунку, а не зміст господарської операції в усіх подробицях.\n\n> [!REMEMBER]\n> Товарний чек і фіскальний чек — не синоніми. Обидва належать до розрахункових документів, але обовʼязкові реквізити наказ встановлює саме для фіскального чека. [SRC-052] [SRC-053]\n\n### 8. Платіжна інструкція і призначення платежу\n\nПлатіжна інструкція, оформлена платником в електронній або паперовій формі, повинна містити вісім обовʼязкових реквізитів: [SRC-051]\n\n1. дату складання і номер;\n2. дані платника: ідентифікатор або найменування, код і номер рахунку;\n3. найменування надавача платіжних послуг платника;\n4. суму цифрами і словами;\n5. **призначення платежу**;\n6. підпис або підписи платника;\n7. дані отримувача: ідентифікатор або найменування, код і номер рахунку;\n8. найменування надавача платіжних послуг отримувача.\n\nРеквізити заповнюються державною мовою; заповнювати їх латиницею можна, якщо це передбачено правилами платіжної системи або внутрішніми правилами надавача. [SRC-051]\n\n> [!PRINCIPLE]\n> Призначення платежу — **обовʼязковий реквізит**, а не поле «за бажанням». [SRC-051] Саме воно повʼязує рух коштів із конкретним документом, і саме його бракує, коли через рік неможливо сказати, за що прийшли гроші.\n\n### 9. Довіреність\n\nДовіреність — письмовий документ, що видається однією особою іншій для представництва перед третіми особами. [SRC-054] Форма довіреності повинна відповідати формі, у якій має вчинятися сам правочин. [SRC-054]\n\nТри речі, які варто знати точно:\n\n- **довіреність, у якій не вказана дата вчинення, є нікчемною**; [SRC-054]\n- строк встановлюється в самій довіреності, а якщо не встановлений — вона діє до припинення її дії; [SRC-054]\n- типової форми М-2 і обовʼязкової печатки на довіреності на одержання цінностей більше немає: відповідну Інструкцію скасовано з 2014 року. [SRC-056]\n\nПовноваження особи, яка одержує товарно-матеріальні цінності в інтересах ФОП або юридичної особи, підтверджуються, зокрема, письмовим договором, довіреністю або актом органу юридичної особи. [SRC-040]\n\n### 10. Розписка й підтвердження оплати\n\nПрийнявши виконання зобовʼязання, кредитор **повинен на вимогу боржника** видати йому розписку про одержання виконання частково або в повному обсязі. [SRC-054] Якщо боржник видавав борговий документ, кредитор при прийнятті виконання повинен його повернути, а за неможливості — вказати про це в розписці. [SRC-054]\n\nНаявність боргового документа в боржника підтверджує виконання ним свого обовʼязку. [SRC-054] У разі відмови кредитора повернути борговий документ або видати розписку боржник має право затримати виконання. [SRC-054]\n\nДля безготівкових розрахунків роль підтвердження виконує виписка з рахунку — про неї детально в модулі 8.\n\n### 11. Додаткова угода\n\nЗміна або розірвання договору вчиняється **в такій самій формі**, що й договір, який змінюється, якщо інше не встановлено договором, законом або не випливає зі звичаїв ділового обороту. [SRC-054]\n\nПрактичний наслідок: до письмового договору не можна внести зміни усно чи «домовитися в месенджері», якщо сам договір цього не передбачає. Зміна ціни, строку або обсягу оформлюється додатковою угодою в тій самій формі — включно з електронною, якщо договір було укладено електронно. [SRC-046]\n\n### 12. Інвойс і документи від іноземного контрагента\n\nІнвойс — це рахунок іноземного контрагента. Для нього діє все сказане в розділі 3: це документ про намір і про умови, а не підтвердження того, що операція сталася.\n\nДва практичні моменти:\n\n- документ іноземною мовою потребує перекладу, щоб можна було показати зміст і обсяг операції; для підприємств вимога аутентичного перекладу пряма, для ФОП загальної норми знайти не вдалося — межі описано в `references.md`; [SRC-040]\n- валютний нагляд, строки розрахунків за зовнішньоекономічними операціями й пов'язані з ними документи — тема модуля 17, у цьому модулі вона не розглядається.\n\n## Покроковий процес\n\nЯк зібрати комплект під операцію:\n\n1. Назвати операцію одним реченням: що, кому, коли, за скільки.\n2. Відповісти на перше питання: чим підтверджено домовленість.\n3. Відповісти на друге: чим підтверджено, що операція сталася.\n4. Відповісти на третє: чим підтверджено розрахунок.\n5. Для кожного документа визначити, встановлена його форма законом чи довільна.\n6. Для документів довільної форми перевірити шість обовʼязкових реквізитів.\n7. Для документів встановленої форми перевірити реквізити з відповідної норми.\n8. Перевірити, що призначення платежу дає змогу знайти документ про операцію.\n9. Якщо цінності одержувала інша особа — перевірити підтвердження її повноважень.\n10. Записати, чого бракує, і в кого це запитати.\n\n## Практичні приклади\n\n### Приклад 1. Рік без актів\n\nФОП надавав послуги за рахунками, оплати приходили щомісяця, актів немає. Домовленість і розрахунок підтверджені, а те, що послуги надано, — ні. Рахунок цього не закриває. [SRC-055] Комплект відновлюють актами за періоди, а не додатковими рахунками.\n\n### Приклад 2. ТТН без опису вантажу\n\nПеревізник привіз товар, є ТТН з усіма реквізитами статті 48. Що саме передано покупцеві, з неї не видно: опису вантажу серед обовʼязкових реквізитів ТТН немає. [SRC-049] Потрібна видаткова накладна.\n\n### Приклад 3. «Просто перекажіть без опису»\n\nКлієнт просить не вказувати призначення платежу. Це неможливо: призначення платежу — обовʼязковий реквізит платіжної інструкції. [SRC-051] Домовитися можна лише про формулювання, а не про його відсутність.\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Вважати рахунок первинним документом | ним не фіксується господарська операція [SRC-055] | закривати друге питання актом або накладною |\n| Шукати затверджену форму акта наданих послуг | такої форми немає | скласти власний бланк із шістьма реквізитами [SRC-040] |\n| Вважати ТТН заміною видаткової накладної | опису вантажу серед реквізитів ТТН немає [SRC-049] | оформляти обидва документи |\n| Не вказувати місце складання в ТТН | для ТТН це обовʼязковий реквізит [SRC-049] | не переносити перелік статті 9 на ТТН |\n| Виписувати ТТН в одному примірнику | норма вимагає трьох [SRC-050] | виписати три і засвідчити всі |\n| Лишати призначення платежу порожнім | це обовʼязковий реквізит [SRC-051] | вказувати документ і період |\n| Приймати довіреність без дати | така довіреність нікчемна [SRC-054] | повернути на переоформлення |\n| Вимагати довіреність за формою М-2 з печаткою | Інструкцію скасовано з 2014 року [SRC-056] | приймати договір, довіреність або акт органу [SRC-040] |\n| Змінювати письмовий договір усно | зміна вчиняється в тій самій формі [SRC-054] | оформити додаткову угоду |\n| Вважати товарний чек фіскальним | реквізити наказ встановлює для фіскального [SRC-053] | розрізняти види розрахункових документів |\n\n## Ризики й межі самостійних дій\n\n- Модуль не описує договір як документ: істотні умови, види й перевірка контрагента — модуль 6.\n- Обовʼязок застосовувати РРО або ПРРО і режим роботи з ними — модуль 10.\n- Банківська виписка як джерело обліку доходу — модулі 8 і 9.\n- Податкова накладна — документ податкового обліку ПДВ, а не первинний документ операції; це модуль 15.\n- Валютний нагляд і строки розрахунків за ЗЕД — модуль 17.\n- Перелік «що має бути в комплекті» — професійна практика, а не норма: вичерпного комплекту для довільної операції жоден акт не встановлює.\n- Статус рахунку-фактури спирається на розʼяснення 2006 року, а не на норму; його межі описано в `references.md`.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, щоб визначити достатність комплекту під конкретну операцію, оцінити наслідки відсутнього документа за минулий період і побудувати порядок обміну документами з постійними контрагентами.\n\n**Юрист потрібен**, якщо контрагент відмовляється підписувати акт за виконаною роботою, якщо є спір про факт передання товару або якщо зміни до договору оформлювалися не в тій формі.\n\n## Підсумок\n\nДокументи не збирають «про всяк випадок» — кожен закриває своє питання. Рахунок каже про намір, акт і накладна — про подію, чек і платіжна інструкція — про розрахунок. У більшості документів затвердженої форми немає, і перевіряють їх за шістьма реквізитами з модуля 4. Там, де форма встановлена законом — ТТН, фіскальний чек, платіжна інструкція, — перелік свій, і його треба брати з відповідної норми, а не з памʼяті.\n\n## Самоперевірка\n\n1. На які три питання відповідає комплект документів під операцію?\n2. Чому рахунок не є первинним документом і яким джерелом це підтверджено?\n3. Де взяти форму акта наданих послуг?\n4. Чим реквізити ТТН відрізняються від переліку статті 9?\n5. Чому ТТН не замінює видаткової накладної?\n6. Скільки примірників ТТН виписує вантажовідправник?\n7. Які реквізити має містити платіжна інструкція?\n8. Що робить довіреність нікчемною?\n9. Коли кредитор зобовʼязаний видати розписку?\n10. У якій формі оформлюють зміну письмового договору?\n\n## Джерела\n\nПерелік джерел і твердження, які вони підтверджують, — у `references.md`. Використані ідентифікатори: SRC-012, SRC-017, SRC-039, SRC-040, SRC-041, SRC-046, SRC-049, SRC-050, SRC-051, SRC-052, SRC-053, SRC-054, SRC-055, SRC-056.\n\n## Дата перевірки актуальності\n\nДата перевірки актуальності: **2026-09-06**\nНаступна перевірка: **2026-11-01**"}, {"id": "practice", "title": "Практика", "content": "# Практика: чого бракує в комплекті\n\n## Мета\n\nНавчитися дивитися на папку документів через три питання — про що домовилися, що сталося, чим заплачено — і бачити, на яке з них немає відповіді.\n\n## Навчальна ситуація\n\nДані синтетичні. Не використовуйте реальні відомості про себе чи клієнтів.\n\n**ФОП Марченко Олег Ігорович**, третя група, ремонт і налаштування обладнання. Готує документи за жовтень 2026 року.\n\n| № | Операція | Що вже є в папці |\n|---|---|---|\n| 1 | Налаштування обладнання для ТОВ «Оріон», 15 000 грн | договір, рахунок, платіжна інструкція, виписка |\n| 2 | Продаж запчастин ТОВ «Веста», 6 400 грн; товар зі складу вивіз їхній водій | договір, рахунок, видаткова накладна, виписка |\n| 3 | Доставка партії деталей замовнику до Івано-Франківська, перевезення замовлено в транспортної компанії | договір перевезення, рахунок перевізника, акт наданих послуг перевізника, виписка |\n| 4 | Ремонт для ФОП Ткаченко, 3 200 грн | договір, акт виконаних робіт, рахунок, виписка |\n| 5 | Купівля інструменту в магазині за готівку, 1 850 грн | фіскальний чек |\n| 6 | Клієнт доплатив 2 000 грн, у призначенні платежу — «оплата» | виписка |\n| 7 | Сторони домовилися підняти ціну обслуговування з листопада | письмовий договір, листування в месенджері |\n| 8 | Отримано інвойс від нерезидента на 400 євро | інвойс англійською |\n\n## Завдання 1. Назвіть, чого бракує\n\nДля кожної операції визначте документ, якого бракує, і вкажіть джерело вимоги. Використовуйте короткі назви:\n\n- **акт** — акт наданих послуг або виконаних робіт;\n- **накладна** — видаткова накладна;\n- **ТТН** — товарно-транспортна накладна;\n- **довіреність** — підтвердження повноважень одержувача;\n- **угода** — додаткова угода до договору;\n- **переклад** — переклад документа іноземною мовою;\n- **нічого** — комплект повний, доукомплектовувати не треба.\n\n## Завдання 2. Дайте відповідь на чотири питання про форму\n\n1. Скільки примірників товарно-транспортної накладної виписує вантажовідправник?\n2. Чим є рахунок за призначенням: документом про намір чи про подію?\n3. Скільки обовʼязкових реквізитів має платіжна інструкція?\n4. Якого реквізиту платіжної інструкції фактично бракує в операції 6?\n\n## Завдання 3. Знайдіть те, чого не можна визначити\n\nДля однієї операції потрібний документ визначити неможливо: з наданих даних невідомо, за що прийшли кошти. Позначте її як таку, що потребує окремої перевірки, і не вигадуйте відповідь.\n\n## Критерії виконання\n\n- кожна операція має висновок із зазначеним джерелом;\n- операції з повним комплектом не «доукомплектовані» зайвим документом;\n- документи встановленої законом форми відокремлені від документів довільної форми;\n- операція, для якої даних недостатньо, не заповнена припущенням."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Рахунок замість акта»\n\n## Ситуація\n\nІрина — ФОП третьої групи, веде маркетингові проєкти. Із ТОВ «Сігма» вона працює одинадцять місяців: щомісяця виставляє рахунок, отримує оплату, наступного місяця все повторюється.\n\nУ листопаді клієнт готується до аудиту й просить пакет документів. Ірина відкриває папку й бачить:\n\n- за всі одинадцять місяців є лише рахунки та банківські виписки;\n- жодного акта наданих послуг за жоден місяць немає;\n- договір підписано, але з квітня фактичний обсяг робіт більший за описаний у ньому, домовлялися про це в листуванні;\n- у трьох платежах призначення платежу — «оплата за послуги» без номера рахунку й періоду;\n- один платіж клієнт зробив з рахунку іншої компанії своєї групи;\n- у вересні Ірина відправила клієнту скан рахунку без підпису — і вважає це проблемою;\n- частина рахунків не має номера — Ірина боїться, що через це вони недійсні;\n- клієнт просить «замість актів просто зробити рахунки за формою, там усе видно».\n\nДані синтетичні.\n\n## Завдання\n\n1. Знайдіть справжні ризики й відокремте їх від того, що лише виглядає проблемою.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Побудуйте безпечну послідовність відновлення комплекту.\n4. Поясніть, чому рахунки не закривають питання, яке мали б закрити акти.\n\n## Орієнтир для самоперевірки\n\n- рахунком не фіксується господарська операція, тому одинадцять рахунків не замінюють жодного акта;\n- домовленість про більший обсяг робіт мала бути оформлена в тій самій формі, що й договір;\n- призначення платежу — обовʼязковий реквізит; формулювання без документа й періоду не дає звʼязку з операцією;\n- платіж від третьої особи потребує окремої перевірки: за що і від кого прийшли кошти;\n- номер документа — додатковий реквізит, а не обовʼязковий;\n- рахунок не є первинним документом, тому відсутність підпису на ньому не має тих наслідків, які має відсутність підпису на акті.\n\nЦе навчальний кейс, а не індивідуальна податкова консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст комплекту під операцію\n\n## Про що домовилися\n\n- [ ] Є документ, що фіксує домовленість: договір, оплачений рахунок або листування, прирівняне до письмової форми.\n- [ ] Фактичні умови операції збігаються з тим, що записано в підставі.\n- [ ] Зміни умов оформлено в тій самій формі, що й основний документ.\n\n## Що сталося\n\n- [ ] Є документ про подію: акт, видаткова накладна або розрахунковий документ.\n- [ ] З документа зрозуміло, що саме й у якому обсязі зроблено або передано.\n- [ ] Для перевезення вантажу оформлено товарно-транспортну накладну.\n- [ ] Якщо цінності одержувала інша особа — підтверджено її повноваження.\n\n## Чим заплачено\n\n- [ ] Є документ про розрахунок: платіжна інструкція, виписка, чек або розписка.\n- [ ] Призначення платежу дає змогу знайти документ про операцію та її період.\n- [ ] Платник у документі про оплату збігається зі стороною операції.\n\n## Форма кожного документа\n\n- [ ] Для кожного документа визначено: форма встановлена законом чи довільна.\n- [ ] Документи довільної форми перевірено за шістьма обовʼязковими реквізитами.\n- [ ] Документи встановленої форми перевірено за реквізитами відповідної норми.\n- [ ] Довіреність, якщо вона є, містить дату вчинення.\n\n## Контроль якості\n\n- [ ] Рахунок не зараховано як підтвердження того, що операція сталася.\n- [ ] Контрагенту не висунуто вимог, яких норма не містить.\n- [ ] Документи іноземною мовою супроводжуються перекладом.\n- [ ] Зафіксовано, чого бракує, у кого це запитати і до якої дати."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 5\n\n**Рахунок (рахунок-фактура)** — документ про намір: вимога оплатити. Господарської операції не фіксує, тому підтвердженням того, що операція сталася, не є.\n\n**Акт наданих послуг** — документ про подію: що саме й у якому обсязі виконано. Затвердженої форми немає, складається довільно з шістьма обовʼязковими реквізитами.\n\n**Акт виконаних робіт** — документ, яким замовник приймає результат роботи. Прийнявши роботу без перевірки, замовник втрачає право посилатися на явні недоліки.\n\n**Видаткова накладна** — документ про передання товару. Дата має відповідати моменту, коли обовʼязок продавця передати товар вважається виконаним.\n\n**Товарно-транспортна накладна** — єдиний для всіх учасників транспортного процесу документ на перевезення вантажу. Реквізити встановлені Законом про автомобільний транспорт, а не Законом про бухгалтерський облік.\n\n**Е-ТТН** — товарно-транспортна накладна в електронній формі, підписана електронними підписами водія або експедитора та відповідальних осіб сторін.\n\n**Розрахунковий документ** — документ встановленої форми та змісту, що підтверджує факт продажу, надання послуги або отримання коштів: касовий чек, товарний чек, видатковий чек, розрахункова квитанція.\n\n**Фіскальний чек** — розрахунковий документ із обовʼязковими реквізитами, встановленими окремим наказом Мінфіну.\n\n**Платіжна інструкція** — документ, яким платник ініціює платіжну операцію. Має вісім обовʼязкових реквізитів.\n\n**Призначення платежу** — обовʼязковий реквізит платіжної інструкції, який звʼязує рух коштів із конкретним документом і періодом.\n\n**Довіреність** — письмовий документ, що видається однією особою іншій для представництва перед третіми особами. Без дати вчинення нікчемна.\n\n**Розписка** — документ про одержання виконання зобовʼязання, який кредитор зобовʼязаний видати на вимогу боржника.\n\n**Додаткова угода** — документ про зміну умов договору; вчиняється в тій самій формі, що й сам договір.\n\n**Інвойс** — рахунок іноземного контрагента. Як і будь-який рахунок, показує намір і умови, а не факт операції.\n\n**Документ довільної форми** — документ, форму якого не затверджено нормативним актом; має містити обовʼязкові реквізити або реквізити типової форми.\n\n**Типова форма** — форма документа, затверджена нормативним актом; для більшості документів ФОП такої форми немає."}, {"id": "reference", "title": "Пам’ятка", "content": "# Памʼятка: комплект документів під операцію\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-09-06**\n\n## Три питання\n\n| Питання | Хто відповідає |\n|---|---|\n| Про що домовилися | договір, додаткова угода, оплачений рахунок |\n| Що сталося | акт, видаткова накладна, ТТН, розрахунковий документ |\n| Чим заплачено | платіжна інструкція, виписка, чек, розписка |\n\nПеревіряючи папку, шукайте питання без відповіді, а не кількість паперів.\n\n## Форма документа\n\n| Встановлена законом | Довільна |\n|---|---|\n| товарно-транспортна накладна | рахунок |\n| фіскальний чек | акт наданих послуг |\n| платіжна інструкція | видаткова накладна, додаткова угода |\n\nДовільна форма ≠ довільний зміст: шість обовʼязкових реквізитів мають бути в кожному документі.\n\n## Рахунок\n\n- документ про **намір**, не про подію;\n- господарської операції ним не фіксується — це висновок розʼяснення Мінфіну, а не норма;\n- корисний: фіксує умови, задає призначення платежу, потрібен клієнту для погодження;\n- рахунок + виписка ≠ підтвердження операції.\n\n## ТТН\n\n- реквізити — із Закону про автомобільний транспорт, не зі статті 9;\n- **місце складання тут обовʼязкове**;\n- **опису вантажу серед обовʼязкових реквізитів немає** → потрібна видаткова накладна;\n- три примірники, усі засвідчені підписом;\n- оформлюється незалежно від умов оплати за роботу автомобіля;\n- е-ТТН підписується електронними підписами й предʼявляється у візуальній формі.\n\n## Платіжна інструкція: вісім реквізитів\n\nдата і номер · дані платника · надавач послуг платника · сума цифрами і словами · **призначення платежу** · підпис · дані отримувача · надавач послуг отримувача\n\nПризначення платежу — обовʼязковий реквізит. Узгодити можна формулювання, а не його відсутність.\n\n## Довіреність\n\n- письмовий документ для представництва перед третіми особами;\n- **без дати вчинення — нікчемна**;\n- строк — у самій довіреності;\n- типової форми М-2 і обовʼязкової печатки немає з 2014 року;\n- альтернативи: письмовий договір, акт органу юридичної особи.\n\n## Три норми, які варто памʼятати\n\n- **розписка**: кредитор повинен видати її на вимогу боржника;\n- **зміна договору**: у тій самій формі, що й договір;\n- **приймання роботи**: замовник, який прийняв без перевірки, втрачає право на претензії щодо явних недоліків.\n\n## Чого не робити\n\n- не приймати рахунок як підтвердження того, що операція сталася;\n- не шукати «типову форму» акта наданих послуг — її немає;\n- не вважати ТТН заміною видаткової накладної;\n- не переносити перелік статті 9 на ТТН, чек і платіжну інструкцію;\n- не приймати довіреність без дати;\n- не змінювати письмовий договір листуванням."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 5\n\nПеревірено: **2026-09-06**. Кожна норма звірена з повним текстом на `zakon.rada.gov.ua` (сторінка «Текст для друку»). Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Податкового кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Первинний документ містить відомості про господарську операцію | SRC-017, стаття 1 | Норма закону | Основа для висновку про рахунок |\n| Рахунок за призначенням не відповідає ознакам первинного документа | SRC-055 | **Розʼяснення органу, не норма** | Лист 2006 року; висновок узгоджується з чинним визначенням |\n| Окремі інші твердження того самого листа застаріли | SRC-056 | Норма підзаконного акта | Типову форму довіреності М-2 і печатку скасовано з 2014 року |\n| Обовʼязок вести облік на підставі первинних документів | SRC-012, пункт 44.1 | Норма закону | Підстава для ФОП мати документи взагалі |\n| Шість обовʼязкових реквізитів первинного документа | SRC-039, частина друга статті 9 | Норма закону | Використовується як готовий інструмент з модуля 4 |\n| Самостійно виготовлені бланки мають містити обовʼязкові реквізити | SRC-040, пункт 2.6 | Норма підзаконного акта | Довільна форма не означає довільний зміст |\n| Зведений документ складається на підставі первинних; для готівкових продажів — не рідше разу на день | SRC-039, частина перша статті 9; SRC-040, пункт 2.1 | Норма закону | Підстава для денного документа за даними чеків |\n| Відсутність підпису замовника послуг за письмовим договором не є порушенням | SRC-039, частина друга статті 9 | Норма закону | Межі застосування для ФОП — розділ «Межі перевірки» |\n| Договір про надання послуг: послуга споживається в процесі вчинення дії | SRC-054, стаття 901 | Норма закону | Відмінність від договору підряду |\n| Замовник зобовʼязаний прийняти роботу, оглянути її та заявити про недоліки | SRC-054, стаття 853 | Норма закону | Прийняття без перевірки позбавляє права посилатися на явні недоліки |\n| Момент виконання обовʼязку продавця передати товар | SRC-054, стаття 664 | Норма закону | Орієнтир для дати видаткової накладної |\n| Визначення товарно-транспортної накладної | SRC-050, розділ 1 | Норма підзаконного акта | Паперова та/або електронна форма |\n| Обовʼязкові реквізити ТТН | SRC-049, стаття 48 | Норма закону | Перелік свій; місце складання обовʼязкове, опису вантажу немає |\n| ТТН виписує вантажовідправник у трьох примірниках і засвідчує підписом усі | SRC-050, пункт 11.3 | Норма підзаконного акта | Кількість не залежить від домовленості сторін |\n| ТТН оформлюється незалежно від умов оплати за роботу автомобіля | SRC-050, пункт 11.2 | Норма підзаконного акта | Оплата перевезення на обовʼязок оформлення не впливає |\n| Е-ТТН підписується електронними підписами й предʼявляється у візуальній формі | SRC-050, пункт 11.1 | Норма підзаконного акта | Із відсиланням до законів про електронні документи й довірчі послуги |\n| Визначення розрахункового документа та його види | SRC-052, стаття 2 | Норма закону | Касовий, товарний, видатковий чек, розрахункова квитанція |\n| Обовʼязкові реквізити фіскального чека | SRC-053, розділ II | Норма підзаконного акта | Обовʼязок застосовувати РРО — модуль 10 |\n| Вісім обовʼязкових реквізитів платіжної інструкції | SRC-051, пункт 37 | Норма підзаконного акта | Серед них — призначення платежу |\n| Реквізити платіжної інструкції заповнюються державною мовою | SRC-051, пункт 10 | Норма підзаконного акта | Латиниця — лише якщо це передбачено правилами системи |\n| Довіреність — письмовий документ для представництва перед третіми особами | SRC-054, стаття 244 | Норма закону | Форма відповідає формі правочину (стаття 245) |\n| Довіреність без дати вчинення є нікчемною | SRC-054, стаття 247 | Норма закону | Питання чинності, а не оформлення |\n| Строк довіреності встановлюється в ній самій | SRC-054, стаття 247 | Норма закону | Правила «за замовчуванням» норма не містить |\n| Повноваження одержувача цінностей підтверджуються договором, довіреністю або актом органу | SRC-040, пункт 2.4 | Норма підзаконного акта | Норму додано наказом № 987 |\n| Кредитор повинен на вимогу боржника видати розписку про одержання виконання | SRC-054, стаття 545 | Норма закону | Наявність боргового документа в боржника підтверджує виконання |\n| Зміна договору вчиняється в такій самій формі, що й договір | SRC-054, стаття 654 | Норма закону | Виняток — якщо інше встановлено договором, законом або звичаєм |\n| Письмова форма правочину включає електронну й листування сторін | SRC-046, статті 205 і 207 | Норма закону | Використовується для оцінки листування |\n| Юридичну силу електронного документа не можна заперечити через форму | SRC-041, стаття 8 | Норма закону | Стосується й е-ТТН |\n| Документи іноземною мовою супроводжуються аутентичним перекладом | SRC-040, пункт 1.4 | Норма підзаконного акта | Адресат — підприємства; для ФОП загальної норми не знайдено |\n\n## Межі перевірки\n\n- **Рахунок-фактура.** Джерело висновку — лист Мінфіну від 27.11.2006. Це розʼяснення, а не норма; у тексті модуля це сказано прямо. Висновок узгоджується з чинним визначенням первинного документа, але окремі інші твердження того самого листа (типова форма довіреності М-2, обовʼязкова печатка на ній) уже не діють.\n- **Комплект документів під операцію.** Рамка з трьох питань і перелік «що має бути» — професійна практика, а не норма: жоден нормативний акт не встановлює вичерпного комплекту для довільної операції. Модуль подає її як спосіб мислення, а перевіряти достатність комплекту в конкретному випадку має бухгалтер.\n- **Акт наданих послуг.** Затвердженої форми немає, і прямої норми «для послуги складається акт» знайти не вдалося: потреба в такому документі випливає з обовʼязку підтвердити зміст і обсяг операції.\n- **Мова документів.** Вимога аутентичного перекладу міститься в акті, адресованому підприємствам. Для ФОП загальної норми не знайдено — те саме обмеження, що й у модулі 4.\n- **Норма про відсутність підпису замовника** застосовується у сфері бухгалтерського обліку контрагента; у модулі не стверджується, що ФОП-виконавець може на неї спиратися.\n- **Поза межами модуля:** договір як документ (модуль 6), обовʼязок застосовувати РРО і ПРРО (модуль 10), банківська виписка як джерело обліку доходу (модулі 8 і 9), податкова накладна (модуль 15), валютний нагляд за ЗЕД (модуль 17)."}], "quiz": [{"id": "m05-q01", "title": "Рахунок і виписка", "competency": "doc_set_three_questions", "scenario": "За операцією на 15 000 грн у папці є договір, рахунок і банківська виписка про надходження коштів.", "question": "Чого бракує в цьому комплекті?", "options": [{"text": "Нічого: договір, рахунок і виписка разом підтверджують операцію повністю", "feedback": "Ні. Разом вони показують намір і оплату, але не показують, що операція відбулася."}, {"text": "Другого примірника рахунку з підписом замовника й відбитком його печатки", "feedback": "Ні. Підписаний рахунок лишається рахунком і фактом здійснення операції не стає."}, {"text": "Документа про подію: акта наданих послуг за відповідний період роботи", "correct": true, "feedback": "Правильно. Без нього питання «що сталося» лишається без жодної відповіді."}], "explanation": "Комплект відповідає на три питання: про що домовилися, що сталося, чим заплачено. Договір і рахунок закривають перше, виписка — третє. Друге закриває документ про подію: для послуги це акт, для товару — видаткова накладна.", "source_reference": ["SRC-055", "SRC-017"], "hint": "Поставте до папки три питання по черзі й знайдіть те, на яке жоден документ не відповідає."}, {"id": "m05-q02", "title": "Статус розʼяснення", "competency": "doc_source_type", "scenario": "Бухгалтер посилається на висновок Мінфіну про те, що рахунок не є первинним документом.", "question": "Як правильно описати статус цього джерела?", "options": [{"text": "Це розʼяснення органу, а не норма; сам висновок узгоджується з визначенням", "correct": true, "feedback": "Правильно. Розрізняти норму й розʼяснення — базова дисципліна роботи з джерелами."}, {"text": "Це норма підзаконного акта, обовʼязкова для всіх платників податків без винятку", "feedback": "Ні. Лист органу нормативно-правовим актом не є й обовʼязкової сили не має."}, {"text": "Це застаріле джерело, тому висновок про рахунок сьогодні вже не застосовується", "feedback": "Ні. Лист старий, але висновок узгоджується з чинним визначенням первинного документа."}], "explanation": "Висновок про рахунок міститься в листі Мінфіну 2006 року. Це розʼяснення, а не норма. Окремі інші твердження того самого листа втратили актуальність, зокрема про типову форму довіреності та обовʼязкову печатку на ній.", "source_reference": ["SRC-055", "SRC-056"], "hint": "Подумайте про два різні питання: чи має джерело обовʼязкову силу і чи правильний його висновок."}, {"id": "m05-q03", "title": "Бланк акта", "competency": "doc_form_kind", "scenario": "Новий клієнт просить надіслати акт наданих послуг за затвердженою типовою формою.", "question": "Що правильно відповісти клієнтові?", "options": [{"text": "Типову форму акта затверджено наказом Мінфіну про первинні облікові документи", "feedback": "Ні. Наказу, який затверджував би типову форму акта наданих послуг, немає."}, {"text": "Затвердженої форми немає: бланк власний, але з обовʼязковими реквізитами", "correct": true, "feedback": "Правильно. Самостійно виготовлений бланк має містити обовʼязкові реквізити."}, {"text": "Форму акта встановлює замовник, тому потрібен його бланк і його ж нумерація", "feedback": "Ні. Сторони можуть узгодити вигляд документа, але форма від цього не стає встановленою."}], "explanation": "Документування господарських операцій може здійснюватися з використанням самостійно виготовлених бланків, які повинні містити обовʼязкові реквізити або реквізити типових чи спеціалізованих форм. Для акта наданих послуг затвердженої форми немає.", "source_reference": ["SRC-039", "SRC-040"], "hint": "Правильне питання тут не про бланк, а про те, що обовʼязково має бути в будь-якому бланку."}, {"id": "m05-q04", "title": "Місце складання в ТТН", "competency": "doc_ttn_requisites", "scenario": "У товарно-транспортній накладній не заповнено місце складання; решта полів заповнена.", "question": "Як оцінити цей документ?", "options": [{"text": "Недолік неістотний: місце складання виключено з переліку обовʼязкових у 2020 році", "feedback": "Ні. Зміни 2020 року стосувалися переліку статті 9, а не реквізитів товарно-транспортної накладної."}, {"text": "Реквізит зайвий: перелік обовʼязкових реквізитів для всіх документів однаковий", "feedback": "Ні. Різні документи мають різні переліки обовʼязкових реквізитів у різних законах."}, {"text": "Бракує обовʼязкового реквізиту: для ТТН його встановлює окремий закон", "correct": true, "feedback": "Правильно. Перелік реквізитів ТТН міститься в Законі про автомобільний транспорт."}], "explanation": "Обовʼязкові реквізити товарно-транспортної накладної встановлює стаття 48 Закону про автомобільний транспорт: дата і місце складання, вантажовідправник, перевізник, вантажоодержувач, транспортний засіб, пункти завантаження і розвантаження.", "source_reference": ["SRC-049", "SRC-039"], "hint": "Перевірте спершу, який саме закон встановлює реквізити для цього виду документа."}, {"id": "m05-q05", "title": "ТТН і накладна", "competency": "doc_ttn_vs_invoice", "scenario": "Постачальник каже, що ТТН достатньо, і видаткову накладну оформляти не треба.", "question": "Чому цей підхід не працює?", "options": [{"text": "Опису вантажу серед обовʼязкових реквізитів ТТН немає, тому вона не показує передане", "correct": true, "feedback": "Правильно. ТТН — документ про перевезення, а не про те, що саме передано покупцеві."}, {"text": "ТТН має силу лише для перевізника, а для сторін договору вона взагалі не діє", "feedback": "Ні. ТТН є єдиним документом для всіх учасників транспортного процесу."}, {"text": "ТТН оформлюють після оплати, тому на момент передання товару її ще не існує", "feedback": "Ні. ТТН оформлюється незалежно від умов оплати за роботу автомобіля."}], "explanation": "Товарно-транспортна накладна призначена для обліку цінностей на шляху їх переміщення, розрахунків за перевезення й обліку виконаної роботи. Опис самого вантажу до її обовʼязкових реквізитів не входить, тому передання товару підтверджують видатковою накладною.", "source_reference": ["SRC-049", "SRC-050"], "hint": "Порівняйте перелік реквізитів ТТН із питанням, на яке має відповісти документ про передання товару."}, {"id": "m05-q06", "title": "Примірники ТТН", "competency": "doc_ttn_copies", "scenario": "Вантажовідправник роздрукував товарно-транспортну накладну в одному примірнику для водія.", "question": "Чи відповідає це нормі?", "options": [{"text": "Так, якщо сторони узгодили кількість примірників у договорі перевезення вантажу", "feedback": "Ні. Кількість примірників встановлена нормою, а не домовленістю сторін договору."}, {"text": "Так, якщо решта учасників отримає скановані копії цієї накладної електронною поштою", "feedback": "Ні. Скан не замінює примірника, а норма про кількість лишається невиконаною."}, {"text": "Ні, накладну виписують у трьох примірниках і засвідчують підписом усі", "correct": true, "feedback": "Правильно. Це прямо встановлено Правилами перевезень вантажів автомобільним транспортом."}], "explanation": "Товарно-транспортну накладну на перевезення вантажів автомобільним транспортом виписує замовник (вантажовідправник) у трьох примірниках і засвідчує підписом усі примірники.", "source_reference": ["SRC-050"], "hint": "Число примірників встановлено нормою й не залежить від кількості сторін конкретного перевезення."}, {"id": "m05-q07", "title": "Платіж без опису", "competency": "doc_payment_purpose", "scenario": "Клієнт просить перерахувати кошти взагалі без опису в призначенні платежу.", "question": "Що заважає виконати таке прохання?", "options": [{"text": "Призначення платежу є обовʼязковим реквізитом платіжної інструкції", "correct": true, "feedback": "Правильно. Домовитися можна лише про формулювання, а не про його відсутність."}, {"text": "Банк відмовить у переказі, якщо сума перевищує ліміт для операцій без опису", "feedback": "Ні. Річ не в лімітах: реквізит обовʼязковий незалежно від суми платежу."}, {"text": "Податкова вимагає опис лише для платежів між субʼєктами господарювання", "feedback": "Ні. Вимога міститься в Інструкції НБУ й не залежить від статусу сторін."}], "explanation": "Платіжна інструкція повинна містити вісім обовʼязкових реквізитів, серед яких призначення платежу. Саме воно повʼязує рух коштів із конкретним документом і періодом, тому формулювання можна узгодити, а відсутність — ні.", "source_reference": ["SRC-051"], "hint": "Питання не в бажанні сторін, а в тому, до якої категорії полів належить цей рядок."}, {"id": "m05-q08", "title": "Довіреність без дати", "competency": "doc_power_of_attorney", "scenario": "Водій покупця предʼявив довіреність на отримання товару, у якій немає дати вчинення.", "question": "Які наслідки має відсутність дати?", "options": [{"text": "Це неістотний недолік, якщо в довіреності є підпис і печатка покупця", "feedback": "Ні. Правило про неістотні недоліки стосується первинних документів, а не чинності довіреності."}, {"text": "Довіреність діє протягом трьох років, бо саме такий строк застосовують за замовчуванням", "feedback": "Ні. Строк встановлюється в довіреності, і правила «за замовчуванням» норма не містить."}, {"text": "Довіреність нікчемна, тому повноважень одержувача вона не підтверджує", "correct": true, "feedback": "Правильно. Дата тут є умовою чинності документа, а не деталлю оформлення."}], "explanation": "Довіреність, у якій не вказана дата її вчинення, є нікчемною. Повноваження одержувача цінностей можна підтвердити також письмовим договором або актом органу юридичної особи.", "source_reference": ["SRC-054", "SRC-040"], "hint": "Це не питання оформлення документа, а питання його чинності як такого."}, {"id": "m05-q09", "title": "Зміна ціни в договорі", "competency": "doc_amendment_form", "scenario": "Сторони письмового договору домовилися в месенджері підняти ціну послуг із листопада.", "question": "Що потрібно, щоб зміна набрала сили?", "options": [{"text": "Нічого: листування сторін і є письмовою формою, тому зміна вже відбулася", "feedback": "Ні. Листування може бути письмовою формою, але зміна вчиняється у формі самого договору."}, {"text": "Додаткова угода в такій самій формі, у якій укладено основний договір", "correct": true, "feedback": "Правильно. Форма зміни договору повторює форму договору, що змінюється."}, {"text": "Новий рахунок із підвищеною ціною, оплата якого підтвердить згоду замовника", "feedback": "Ні. Оплата рахунку не є способом зміни умов уже укладеного письмового договору."}], "explanation": "Зміна або розірвання договору вчиняється в такій самій формі, що й договір, який змінюється, якщо інше не встановлено договором або законом чи не випливає із звичаїв ділового обороту.", "source_reference": ["SRC-054", "SRC-046"], "hint": "Порівняйте форму, у якій укладено сам договір, із формою, у якій сторони домовилися цього разу."}, {"id": "m05-q10", "title": "Підтвердження готівкової оплати", "competency": "doc_receipt_obligation", "scenario": "Замовник розрахувався готівкою і просить документ про те, що гроші передано виконавцю.", "question": "Що каже норма про такий документ?", "options": [{"text": "Достатньо запису в обліку доходів виконавця, окремий документ норма не вимагає", "feedback": "Ні. Запис в обліку є внутрішнім документом і боржникові виконання не підтверджує."}, {"text": "Кредитор повинен на вимогу боржника видати розписку про одержання виконання", "correct": true, "feedback": "Правильно. На вимогу боржника видача розписки є обовʼязком, а не люб'язністю."}, {"text": "Документ видається лише за наявності письмового договору між цими сторонами", "feedback": "Ні. Обовʼязок видати розписку норма з формою основного договору не повʼязує."}], "explanation": "Прийнявши виконання зобовʼязання, кредитор повинен на вимогу боржника видати йому розписку про одержання виконання частково або в повному обсязі. У разі відмови боржник має право затримати виконання.", "source_reference": ["SRC-054"], "hint": "Зверніть увагу, чиє це право і чий обовʼязок, а також від чого залежить його виникнення."}], "activities": {"precheck": [{"id": "pre-invoice", "question": "Як гадаєте: рахунок підтверджує, що операція відбулася?", "options": [{"text": "Так, якщо його оплачено й є виписка", "correct": false}, {"text": "Ні, він фіксує намір, а не подію", "correct": true}, {"text": "Так, якщо він підписаний обома сторонами", "correct": false}], "note": "Мінфін дійшов висновку, що рахунок за призначенням не відповідає ознакам первинного документа: ним не фіксується господарська операція. У розділі про рахунок ви побачите, чим цю прогалину закривають."}, {"id": "pre-act-form", "question": "Де взяти затверджену форму акта наданих послуг?", "options": [{"text": "У наказі Мінфіну про типові форми", "correct": false}, {"text": "Такої затвердженої форми немає", "correct": true}, {"text": "У Правилах перевезень вантажів", "correct": false}], "note": "Більшість документів комплекту складають у довільній формі: бланк може бути власним, але обовʼязкові реквізити в ньому мають бути. Розділ про форму документів показує, де форма все ж встановлена законом."}, {"id": "pre-ttn", "question": "Чи можна за товарно-транспортною накладною зрозуміти, що саме передано покупцеві?", "options": [{"text": "Так, опис вантажу є обовʼязковим реквізитом", "correct": false}, {"text": "Ні, опису вантажу серед обовʼязкових реквізитів немає", "correct": true}, {"text": "Так, якщо ТТН оформлено в електронній формі", "correct": false}], "note": "Обовʼязкові реквізити ТТН встановлює Закон про автомобільний транспорт, і це інший перелік, ніж для первинного документа. Саме тому ТТН не замінює видаткової накладної."}], "lesson": [{"id": "lesson-three-questions", "section": "Три питання", "scenario": "У папці за операцією лежать договір, рахунок і банківська виписка про надходження коштів.", "question": "На яке питання комплекту тут немає відповіді?", "options": [{"text": "Про що домовилися: підстава операції жодним документом у папці не підтверджена", "feedback": "Ні. Домовленість тут підтверджує договір, а рахунок описує умови конкретної оплати."}, {"text": "Що сталося: жоден із цих документів не фіксує сам факт здійсненої операції", "correct": true, "feedback": "Правильно. Рахунок показує намір, виписка — оплату, а подію не показує жоден."}, {"text": "Чим заплачено: виписка не є документом, який підтверджує розрахунок сторін", "feedback": "Ні. Саме виписка й показує рух коштів, тобто відповідає на третє питання."}], "source_reference": ["SRC-055"]}, {"id": "lesson-act-form", "section": "Форма документа", "scenario": "Клієнт просить надіслати акт наданих послуг «за затвердженою типовою формою».", "question": "Що правильно відповісти?", "options": [{"text": "Форму акта наданих послуг затверджено наказом Мінфіну про типові форми документів", "feedback": "Ні. Такого наказу про типову форму акта наданих послуг не існує."}, {"text": "Затвердженої форми немає: бланк власний, але з обовʼязковими реквізитами", "correct": true, "feedback": "Правильно. Самостійно виготовлений бланк має містити обовʼязкові реквізити."}, {"text": "Форму встановлює замовник у договорі, і без цього акт складати не можна", "feedback": "Ні. Сторони можуть узгодити вигляд документа, але це не робить форму встановленою."}], "source_reference": ["SRC-039", "SRC-040"]}, {"id": "lesson-ttn-req", "section": "ТТН", "scenario": "Бухгалтер перевіряє ТТН і не знаходить у ній місця складання, як у переліку статті 9.", "question": "Як оцінити цю ситуацію?", "options": [{"text": "Для ТТН місце складання є обовʼязковим реквізитом за іншим законом", "correct": true, "feedback": "Правильно. Перелік реквізитів ТТН встановлює Закон про автомобільний транспорт."}, {"text": "Це неістотний недолік, бо в чинному переліку реквізитів місця складання немає", "feedback": "Ні. Перелік статті 9 стосується первинного документа, а не товарно-транспортної накладної."}, {"text": "Реквізит зайвий: після змін 2020 року його виключено з усіх первинних документів", "feedback": "Ні. Зміни 2020 року стосувалися переліку статті 9, а не реквізитів ТТН."}], "source_reference": ["SRC-049", "SRC-039"]}, {"id": "lesson-purpose", "section": "Платіжна інструкція", "scenario": "Клієнт просить перерахувати кошти без опису, «щоб не світити деталі операції».", "question": "Чи можна виконати це прохання?", "options": [{"text": "Так, якщо сторони письмово погодили порядок обміну платіжними документами", "feedback": "Ні. Домовленість сторін не скасовує обовʼязкового реквізиту платіжної інструкції."}, {"text": "Так, за умови що сума платежу збігається із сумою виставленого рахунку", "feedback": "Ні. Збіг суми не замінює реквізиту й не звʼязує платіж із документом."}, {"text": "Ні: призначення платежу є обовʼязковим реквізитом платіжної інструкції", "correct": true, "feedback": "Правильно. Домовитися можна лише про формулювання, а не про його відсутність."}], "source_reference": ["SRC-051"]}, {"id": "lesson-power", "section": "Довіреність", "scenario": "Водій покупця привіз довіреність на отримання товару, у якій не проставлено дату вчинення.", "question": "Як оцінити такий документ?", "options": [{"text": "Довіреність без дати вчинення є нікчемною, тому повноважень вона не підтверджує", "correct": true, "feedback": "Правильно. Дата тут не оформлення, а умова чинності самого документа."}, {"text": "Довіреність чинна, якщо на ній стоїть печатка й підпис керівника покупця", "feedback": "Ні. Обовʼязкову печатку на довіреності скасовано, а дату вона не замінює."}, {"text": "Довіреність чинна протягом року, бо саме такий строк застосовують за замовчуванням", "feedback": "Ні. Строк встановлюється в довіреності, і правила «рік за замовчуванням» норма не має."}], "source_reference": ["SRC-054", "SRC-056"]}, {"id": "lesson-amendment", "section": "Зміна договору", "scenario": "Ціну обслуговування за письмовим договором сторони підняли, домовившись у месенджері.", "question": "Чи змінено умови договору?", "options": [{"text": "Так, бо листування сторін прирівнюється до письмової форми правочину", "feedback": "Ні. Листування може бути письмовою формою, але зміна має бути у формі самого договору."}, {"text": "Ні: зміна договору вчиняється в такій самій формі, що й сам договір", "correct": true, "feedback": "Правильно. Тому потрібна додаткова угода у формі основного договору."}, {"text": "Так, бо сторони фактично почали виконувати договір на нових умовах", "feedback": "Ні. Фактичне виконання не замінює форми, у якій зміна мала бути оформлена."}], "source_reference": ["SRC-054"]}], "practice": {"title": "Чого бракує в комплекті", "instructions": "Для кожної операції визначте документ, якого бракує, і вкажіть джерело вимоги. Використовуйте лише наведені навчальні дані й короткі назви документів з інструкції.", "how_to": ["Прочитайте всі вісім операцій і те, що вже є в папці за кожною.", "Для кожної операції поставте три питання: про що домовилися, що сталося, чим заплачено — і знайдіть питання без відповіді.", "Напишіть коротку назву документа, якого бракує: акт, накладна, ТТН, довіреність, угода, переклад — або «нічого», якщо комплект повний.", "Виберіть джерело вимоги: не всі документи спираються на ту саму норму.", "Якщо з наданих даних неможливо зрозуміти, чого бракує, залиште поле порожнім і поставте позначку про потребу окремої перевірки.", "Не знаєте, з чого почати — натисніть «Підказка»: вона покаже, де шукати і якого вигляду відповідь. Бал за це не зменшується.", "Натисніть «Перевірити» і виправляйте відповіді, доки результат не досягне 80%."], "facts_title": "Синтетичний пакет: операції ФОП Марченка за жовтень 2026 року", "facts": ["Операція 1: налаштування обладнання для ТОВ «Оріон», 15 000 грн. Є: договір, рахунок, платіжна інструкція, виписка", "Операція 2: продаж запчастин ТОВ «Веста», 6 400 грн, товар зі складу вивіз їхній водій. Є: договір, рахунок, видаткова накладна, виписка", "Операція 3: доставка деталей до Івано-Франківська, перевезення замовлено в транспортної компанії. Є: договір перевезення, рахунок перевізника, акт наданих послуг перевізника, виписка", "Операція 4: ремонт для ФОП Ткаченко, 3 200 грн. Є: договір, акт виконаних робіт, рахунок, виписка", "Операція 5: купівля інструменту в магазині за готівку, 1 850 грн. Є: фіскальний чек", "Операція 6: клієнт доплатив 2 000 грн, у призначенні платежу — «оплата». Є: виписка", "Операція 7: сторони домовилися підняти ціну обслуговування з листопада. Є: письмовий договір, листування в месенджері", "Операція 8: отримано інвойс від нерезидента на 400 євро. Є: інвойс англійською", "Короткі назви документів: акт, накладна, ТТН, довіреність, угода, переклад, нічого"], "threshold": 80, "source_options": [{"value": "law_acc", "label": "Закон про бухгалтерський облік"}, {"value": "polozhennia_88", "label": "Положення № 88"}, {"value": "law_transport", "label": "Закон про автомобільний транспорт"}, {"value": "rules_363", "label": "Правила перевезень вантажів"}, {"value": "nbu", "label": "Інструкція НБУ про безготівкові розрахунки"}, {"value": "ccu", "label": "Цивільний кодекс"}, {"value": "minfin_letter", "label": "Розʼяснення Мінфіну"}, {"value": "additional", "label": "Потрібна додаткова перевірка"}], "fields": [{"id": "op1", "label": "Операція 1: налаштування обладнання для ТОВ «Оріон»", "mode": "known", "accepted": ["акт"], "must_include": [["акт"]], "must_not_include": ["накладн", "ттн", "товарно", "довірен", "угод", "переклад", "нічого", "не браку"], "sources": ["law_acc"], "hint_where": "Пройдіть трьома питаннями: домовленість, подія, розрахунок. Подивіться, на яке з них у цій папці немає жодного документа.", "example": "Одна коротка назва документа з переліку в інструкції.", "hint": "Договір і рахунок показують намір, платіжна інструкція й виписка — оплату; чим підтверджено, що послугу надано?"}, {"id": "op2", "label": "Операція 2: запчастини вивіз водій ТОВ «Веста»", "mode": "known", "accepted": ["довіреність"], "must_include": [["довірен"]], "must_not_include": ["акт", "накладн", "ттн", "товарно", "угод", "переклад", "нічого", "не браку"], "sources": ["ccu"], "hint_where": "Комплект під саму операцію тут повний. Питання інше: чим підтверджено, що людина, яка забрала товар, мала на це право.", "example": "Одна коротка назва документа з переліку в інструкції.", "hint": "Повноваження одержувача цінностей підтверджують письмовим договором, довіреністю або актом органу юридичної особи."}, {"id": "op3", "label": "Операція 3: перевезення деталей транспортною компанією", "mode": "known", "accepted": ["ТТН"], "must_include": [["ттн", "товарно", "транспортн"]], "must_not_include": ["видатков", "акт", "довірен", "угод", "переклад", "нічого", "не браку"], "sources": ["law_transport", "rules_363"], "hint_where": "Документи про послугу перевізника вже є. Бракує документа на сам вантаж у дорозі — його виписує вантажовідправник.", "example": "Одна коротка назва документа з переліку в інструкції.", "hint": "Основним документом на перевезення вантажів є документ, який оформлюється незалежно від умов оплати за роботу автомобіля."}, {"id": "op4", "label": "Операція 4: ремонт для ФОП Ткаченко", "mode": "known", "accepted": ["нічого"], "must_include": [["нічого", "не браку", "комплект повн", "повний"]], "must_not_include": ["акт бракує", "накладн", "ттн", "товарно", "довірен", "угод", "переклад"], "sources": ["law_acc"], "hint_where": "Перевірте три питання по черзі. Якщо на кожне вже є документ, доукомплектовувати папку не треба — навіть якщо вона виглядає тонкою.", "example": "Одна коротка назва документа з переліку в інструкції.", "hint": "Договір закриває домовленість, акт — подію, виписка — розрахунок; усі три питання мають відповідь."}, {"id": "op5", "label": "Операція 5: купівля інструменту за готівку", "mode": "known", "accepted": ["нічого"], "must_include": [["нічого", "не браку", "комплект повн", "повний"]], "must_not_include": ["акт бракує", "накладн", "ттн", "товарно", "довірен", "угод", "переклад"], "sources": ["ccu"], "hint_where": "Подумайте, у якій формі вчиняється правочин, що повністю виконується сторонами в момент його вчинення, і що видається на підтвердження.", "example": "Одна коротка назва документа з переліку в інструкції.", "hint": "Правочин, який повністю виконується в момент вчинення, може бути усним, а розрахунковий документ підтверджує і продаж, і оплату."}, {"id": "op6", "label": "Операція 6: доплата 2 000 грн із призначенням «оплата»", "mode": "review", "sources": ["additional"], "hint_where": "Спробуйте назвати операцію одним реченням: що, кому, коли, за скільки. Подивіться, якого слова у вас немає.", "example": "Поле лишається порожнім, ставиться позначка про потребу окремої перевірки.", "hint": "З наданих даних неможливо визначити, за що прийшли кошти, тому й документ назвати неможливо: потрібне уточнення в клієнта."}, {"id": "op7", "label": "Операція 7: підняття ціни обслуговування з листопада", "mode": "known", "accepted": ["угода"], "must_include": [["угод", "додатков"]], "must_not_include": ["акт", "накладн", "ттн", "товарно", "довірен", "переклад", "нічого", "не браку"], "sources": ["ccu"], "hint_where": "Подивіться норму про форму зміни договору й порівняйте її з тим, у якій формі сторони домовилися цього разу.", "example": "Одна коротка назва документа з переліку в інструкції.", "hint": "Зміна договору вчиняється в такій самій формі, що й сам договір, тому листування письмовий договір не змінює."}, {"id": "op8", "label": "Операція 8: інвойс від нерезидента англійською", "mode": "known", "accepted": ["переклад"], "must_include": [["переклад"]], "must_not_include": ["акт", "накладн", "ттн", "товарно", "довірен", "угод", "нічого", "не браку"], "sources": ["polozhennia_88"], "hint_where": "Питання не в самому інвойсі, а в тому, чи зможе стороння людина зрозуміти з нього зміст і обсяг операції.", "example": "Одна коротка назва документа з переліку в інструкції.", "hint": "Документи іноземною мовою супроводжують упорядкованим аутентичним перекладом; межі цієї вимоги для ФОП описано в картці джерел."}, {"id": "ttn_copies", "label": "Скільки примірників ТТН виписує вантажовідправник", "mode": "known", "accepted": ["три"], "must_include": [["три", "3"]], "must_not_include": ["два", "2", "один", "чотири", "4", "пʼят"], "sources": ["rules_363"], "hint_where": "Норма про кількість примірників стоїть поруч із вимогою засвідчити підписом усі примірники.", "example": "Число словом або цифрою.", "hint": "Кількість примірників не залежить від того, скільки сторін бере участь у конкретному перевезенні."}, {"id": "invoice_kind", "label": "Чим є рахунок за призначенням: документом про намір чи про подію", "mode": "known", "accepted": ["про намір"], "must_include": [["намір"]], "must_not_include": ["поді"], "sources": ["minfin_letter"], "hint_where": "Порівняйте зміст рахунку з визначенням первинного документа: що саме в ньому зафіксовано.", "example": "Два слова: прийменник і те, що документ показує.", "hint": "Рахунком не фіксується жодна господарська операція — він має інформаційний характер."}, {"id": "payment_req_count", "label": "Скільки обовʼязкових реквізитів має платіжна інструкція", "mode": "known", "accepted": ["вісім"], "must_include": [["вісім", "8"]], "must_not_include": ["шіст", "6", "сім", "7", "девʼят", "9"], "sources": ["nbu"], "hint_where": "Порахуйте пронумеровані позиції в пункті 37 Інструкції НБУ, не рахуючи абзаців після переліку.", "example": "Число словом або цифрою.", "hint": "Перелік включає дані обох сторін і обох надавачів платіжних послуг, тому позицій більше, ніж здається."}, {"id": "missing_requisite", "label": "Якого реквізиту платіжної інструкції фактично бракує в операції 6", "mode": "known", "accepted": ["призначення платежу"], "must_include": [["призначенн"]], "must_not_include": ["сума", "дата", "пі
