"Робочий диск, зовнішній диск і хмарне сховище з версіями.", "avoid": "«вимога закону» — норма каже про дублювання, а конкретне число обирає власник"}, {"term": "Цілісність даних", "definition": "Властивість, яка дає змогу довести, що документ після підписання не змінювали.", "example": "Протокол перевірки підпису, збережений разом із файлом.", "avoid": "«файл не відкривали» — цілісність доводиться підписом, а не памʼяттю"}, {"term": "Електронна позначка часу", "definition": "Електронні дані, що повʼязують інші дані з конкретним моментом часу для засвідчення їх наявності на цей момент.", "example": "Фіксація того, що документ існував у такому вигляді на конкретну дату.", "avoid": "«дата створення файлу» — її можна змінити засобами системи"}, {"term": "Кваліфікована електронна позначка часу", "definition": "Позначка часу, яка має презумпцію точності дати й часу, на які вказує, та цілісності повʼязаних даних.", "example": "Використовується, коли документ має пережити строк дії сертифіката підпису.", "avoid": "«те саме, що підпис» — позначка фіксує час, підпис — автора"}, {"term": "Послуга зберігання підписів", "definition": "Електронна довірча послуга зі зберігання підписів, печаток, позначок часу й повʼязаних із ними сертифікатів.", "example": "Спосіб зберегти можливість перевірити підпис через кілька років.", "avoid": "«зберігання самих документів» — послуга стосується підписів і сертифікатів"}, {"term": "Шифрування", "definition": "Спосіб виконати обовʼязок захисту даних від незаконного доступу.", "example": "Зашифрований зовнішній диск із резервною копією архіву.", "avoid": "«надмірна обережність» — захист від незаконного доступу є обовʼязком"}, {"term": "Персональні дані", "definition": "Дані про фізичну особу, які потрапляють в архів разом із документами: підписанти, ФОП-контрагенти, працівники.", "example": "Прізвище й посада особи, яка підписала акт від імені замовника.", "avoid": "«лише дані працівників» — в архіві їх значно більше"}, {"term": "Володілець персональних даних", "definition": "Той, хто визначає мету обробки даних; саме він зобовʼязаний забезпечити їх захист.", "example": "ФОП, який зберігає документи з даними контрагентів і працівників.", "avoid": "«тільки великі компанії» — статус залежить від обробки, а не від розміру"}, {"term": "Звірка «банк — документ»", "definition": "Щомісячна процедура: пройти виписку рядок за рядком і для кожного назвати документ, що підтверджує операцію.", "example": "Те, що не назвалося, стає списком запитів контрагентам.", "avoid": "«звірка сум» — тут звіряють не суми, а наявність підтвердження"}]}}, {"index": 8, "id": "module-08", "level": 3, "slug": "module_08_bankivskyi_rakhunok", "meta": {"schema": "course-module/v1", "id": "module-08", "level": 3, "title": "Банківський рахунок ФОП", "language": "uk", "version": "0.1.0", "status": "app_ready", "summary": "Навчіться читати рахунок і виписку як інструмент: структура номера за IBAN, режим підприємницького рахунку, корпоративна картка, еквайринг і рядки, які не є доходом.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "pending", "last_verified": "2026-09-07", "next_review": "2026-11-01", "depends_on": ["module-02"], "estimated_minutes": 55, "source_ids": ["SRC-010", "SRC-012", "SRC-021", "SRC-022", "SRC-023", "SRC-024", "SRC-051", "SRC-052", "SRC-071", "SRC-072", "SRC-073", "SRC-075", "SRC-077"], "outcomes": ["Прочитати реквізити рахунку й пояснити, з чого складається номер за стандартом IBAN", "Відрізнити операції за особистим і корпоративним платіжним інструментом", "Пояснити, як комісія банку й еквайринг впливають на суму доходу", "Визначити, які рядки виписки є рухом коштів між власними рахунками", "Назвати вимоги до призначення платежу й наслідки їх недотримання"], "primary_source": {"id": "SRC-021", "note": "Інструкція НБУ № 162 — прочитайте пункти про відкриття рахунків фізичній особі самостійно. Заборона використовувати рахунок для власних потреб у підприємницькій діяльності сформульована прямо, і саме її найчастіше порушують, не знаючи про неї."}, "sessions": [{"title": "Сесія 1 · Рахунок, номер, реквізити", "minutes": 20, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Читання виписки", "minutes": 20, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Картка, еквайринг, власні кошти", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви перестанете давати клієнтам номер особистої картки й бачитимете у виписці рядки, які не є вашою виручкою.", "accountant": "Ви працюєте з клієнтами: модуль дає щомісячну процедуру роботи з випискою й перелік із трьох питань, які чесно лишаються за бухгалтером, а не за учнем.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зрозумієте, чому бухгалтер просить окремий рахунок і чіткі призначення платежу."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Банківський рахунок ФОП\n\n## Мета\n\nНавчитися читати рахунок і виписку як робочий інструмент: розуміти, з чого складається номер рахунку, чим корпоративний платіжний інструмент відрізняється від особистого, як комісія й еквайринг впливають на суму, і які рядки виписки взагалі не є операціями з клієнтами.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. прочитати реквізити рахунку й пояснити, з чого складається номер за стандартом IBAN;\n2. відрізнити операції за особистим і корпоративним платіжним інструментом;\n3. пояснити, як комісія банку й еквайринг впливають на суму доходу;\n4. визначити, які рядки виписки є рухом коштів між власними рахунками;\n5. назвати вимоги до призначення платежу й наслідки їх недотримання.\n\n## Передумови\n\nМодуль 2. Поняття доходу, окремих рахунків і заборони використовувати особистий рахунок у підприємницькій діяльності тут стають щоденною практикою.\n\n## Основні терміни\n\n- **Унікальний ідентифікатор** — комбінація символів, що однозначно ідентифікує користувача або його рахунок для виконання платіжної операції. [SRC-072]\n- **Еквайринг** — платіжна послуга з приймання платіжних інструментів, результатом якої є переказ коштів отримувачу або видача готівки. [SRC-072]\n- **Торговець** — субʼєкт господарювання, який за договором з еквайром приймає платіжні інструменти до обслуговування. [SRC-072]\n- **Корпоративний (бізнесовий) платіжний інструмент** — інструмент, емітований для потреб господарської діяльності. [SRC-073]\n- **Платіжна інструкція** — документ, яким платник ініціює платіжну операцію; має вісім обовʼязкових реквізитів. [SRC-051]\n\n## Теоретичний матеріал\n\n### 1. Два рахунки однієї людини\n\nЦе вже було в модулі 2, і з цього починається вся робота з банком.\n\nФізична особа відкриває **окремі** рахунки: для підприємницької діяльності, для незалежної професійної діяльності та для власних потреб. [SRC-021] Використовувати рахунок для власних потреб в операціях підприємницької діяльності **заборонено**, і про цю заборону особа власноруч підписується в заяві про відкриття рахунку. [SRC-021]\n\nБанк повідомляє податкову про відкриття або закриття рахунку в день такої дії, а видаткові операції починаються після взяття рахунку на облік. [SRC-024]\n\n> [!PRINCIPLE]\n> «Це ж усе мої гроші» — правда з погляду власності й неправда з погляду режиму рахунку. Рахунок має цільове призначення, і саме воно визначає, які операції на ньому допустимі. [SRC-021]\n\n### 2. Номер рахунку: що в ньому зашито\n\nНомер платіжного рахунку складається з **29 символів** — літер і цифр — і формується за схемою `UA KK YYYYYY AAAAAAAAAAAAA`. [SRC-071]\n\n| Частина | Що це |\n|---|---|\n| `UA` | код країни |\n| `KK` | контрольна сума за алгоритмом MOD 97-10 стандарту IBAN [SRC-071] |\n| `YYYYYY` | єдиний ідентифікатор установи, у якій відкрито рахунок [SRC-071] |\n| `AAAAAAAAAAAAA` | номер рахунку аналітичного обліку [SRC-071] |\n\nПрактичний наслідок контрольної суми: помилка в одній цифрі номера майже завжди виявляється автоматично — платіж просто не піде. Але якщо помилка дає коректну контрольну суму, кошти підуть **іншому** отримувачу, і це вже помилкова платіжна операція з модуля 2. [SRC-022]\n\nУ законі номер рахунку належить до **унікального ідентифікатора** — комбінації символів, що дає змогу однозначно ідентифікувати користувача або його рахунок. [SRC-072]\n\n### 3. Реквізити, які потрібні для платежу\n\nПлатіжна інструкція має вісім обовʼязкових реквізитів, і це матеріал модуля 5: дата й номер, дані платника, надавач послуг платника, сума цифрами й словами, **призначення платежу**, підпис, дані отримувача, надавач послуг отримувача. [SRC-051]\n\nДля того, щоб вам заплатили, контрагенту потрібні: ваше найменування, податковий номер, номер рахунку і назва банку. Усе інше — деталі оформлення.\n\n> [!RISK]\n> Найпоширеніша помилка при наданні реквізитів — надіслати номер **особистої** картки замість номера підприємницького рахунку. Це порушення режиму рахунку [SRC-021] і одночасно проблема з підтвердженням доходу.\n\n### 4. Призначення платежу — ваш єдиний звʼязок із документом\n\nПризначення платежу є **обовʼязковим реквізитом**, а не полем за бажанням. [SRC-051] Домовитися можна лише про формулювання.\n\nРобоче формулювання містить три елементи: **документ, період і суть**. Наприклад: «Оплата за рахунком № 41 від 03.10.2026 за послуги перекладу за вересень». Формулювання «оплата за послуги» формально реквізит заповнює, але свою функцію не виконує: через рік звʼязати платіж із документом буде неможливо. Це матеріал модуля 7.\n\nРеквізити платіжної інструкції заповнюються державною мовою; латиницею — лише якщо це передбачено правилами платіжної системи або внутрішніми правилами надавача. [SRC-051]\n\n### 5. Виписка: що в ній є і чого немає\n\nВиписка показує **рух коштів**: дату, суму, контрагента, призначення платежу, залишок. Вона не показує змісту й обсягу господарської операції — це матеріал модулів 5 і 7, і саме тому виписка не замінює первинних документів.\n\nФормати, у яких банки видають виписку, різняться: PDF зручний для перегляду й друку, CSV і XLSX — для роботи з даними. Змістовно це той самий набір полів; вибір формату — питання зручності, а не обліку. Робота з табличними форматами — тема модулів 27–28.\n\nЩо важливо перевіряти у виписці щомісяця:\n\n1. кожен рядок надходження має відповідати документу;\n2. кожен рядок списання має бути зрозумілим і обґрунтованим;\n3. рядки, що не є операціями з клієнтами, позначені окремо.\n\n### 6. Що не є доходом, хоча стоїть у виписці\n\nПовний розбір — модуль 9. Тут — короткий перелік рядків, які регулярно плутають із виручкою:\n\n| Рядок виписки | Що це |\n|---|---|\n| Переказ з іншого власного рахунку | рух між своїми рахунками, нових коштів немає |\n| Внесення власних коштів | питання, яке узгоджують із бухгалтером [SRC-010] |\n| Повернення помилково перерахованих коштів | розбирається за нормами про помилкову операцію [SRC-022] |\n| Повернення авансу клієнтові | не включається до доходу [SRC-010] |\n| Надходження за посередницьким договором | доходом є лише винагорода [SRC-077] |\n\n> [!REMEMBER]\n> Внутрішній переказ між власними рахунками видно двічі: як списання в одній виписці й як надходження в іншій. Нових грошей при цьому не виникає. [SRC-010]\n\n### 7. Комісія банку і що з нею робити\n\nБанк утримує комісію за обслуговування, перекази й еквайринг. Для платника єдиного податку тут виникає питання, на яке немає адресної норми: **дохід визнається у повній сумі надходження чи за мінусом комісії**.\n\nЩо відомо точно: базою оподаткування на спрощеній системі є дохід, тобто надходження, і витрати на суму податку не впливають. [SRC-010] Тобто комісія в будь-якому разі **не зменшує** податок так, як зменшувала б витрата на загальній системі.\n\nЩо не встановлено прямо: чи є доходом уся сума, з якої банк утримав комісію, чи лише зарахована сума. Модуль **не дає** тут відповіді — це питання до бухгалтера, і воно позначене в `references.md`.\n\n### 8. Еквайринг\n\nЕквайринг — платіжна послуга, що полягає у прийнятті платіжних інструментів, результатом якої є переказ коштів отримувачу або видача готівки. [SRC-072] Надає її **еквайр** — надавач платіжних послуг з відповідною ліцензією. [SRC-072]\n\nФОП у цій конструкції є **торговцем** — субʼєктом господарювання, який за договором з еквайром приймає платіжні інструменти до обслуговування. [SRC-072]\n\nТри практичні особливості:\n\n- між оплатою карткою й зарахуванням коштів на рахунок минає час; момент визнання доходу тут потребує окремого рішення — питання винесене в `references.md`;\n- еквайр утримує свій відсоток, тому зарахована сума менша за суму покупки;\n- **приймання оплати карткою є розрахунковою операцією**, тому питання РРО виникає й тут — це модуль 10. [SRC-052]\n\n> [!RISK]\n> Поширене переконання «безготівкова оплата — значить РРО не потрібен» неправильне. Закон говорить про розрахункові операції в готівковій **та/або безготівковій** формі із застосуванням платіжних інструментів. [SRC-075] Деталі — модуль 10.\n\n### 9. Корпоративна картка\n\nПлатіжні інструменти поділяються на дві групи: [SRC-073]\n\n1. **особисті** — для власних потреб фізичних осіб;\n2. **корпоративні (бізнесові)** — для потреб господарської, підприємницької або незалежної професійної діяльності.\n\nТри норми, які варто знати:\n\n- держатель має право використовувати особистий або корпоративний інструмент відповідно до вимог законодавства й умов договору з емітентом; [SRC-073]\n- користувачу **заборонено використовувати корпоративний інструмент для виплати заробітної плати**, інших соціальних виплат і допомоги; [SRC-073]\n- власник рахунку сам визначає осіб, які можуть здійснювати операції корпоративним інструментом, і **несе відповідальність** за їх використання. [SRC-073]\n\n### 10. Перекази між власними рахунками та власні кошти\n\n**Переказ між власними підприємницькими рахунками** доходу не створює: сума лише змінює рахунок. [SRC-010]\n\n**Переказ із підприємницького рахунку на власні потреби** прямої заборони не має: Інструкція забороняє зворотне — використовувати особистий рахунок у підприємницькій діяльності. [SRC-021] Підприємець не «отримує зарплату» в себе самого, він розпоряджається власними коштами.\n\n**Внесення власних коштів на підприємницький рахунок** — відкрите питання ще з модуля 2. За змістом операції це не виручка: платник і отримувач — та сама особа, нової роботи не виконано. Але прямої норми ПКУ немає, і кваліфікація залежить від обставин та призначення платежу. [SRC-010] Таку операцію позначають окремо й узгоджують із бухгалтером.\n\n### 11. Повернення клієнту\n\nЯкщо кошти повертаються покупцеві у звʼязку з поверненням товару, розірванням договору або за листом-заявою про повернення — ця сума **до доходу не включається**. [SRC-010]\n\nЯкщо ж вам надійшли кошти помилково, діють інші норми: помилкова платіжна операція й обовʼязок повернути неналежно отримане. [SRC-022] [SRC-023] Це матеріал модуля 2, і в модулі 9 він стає окремим типом операції.\n\nПри поверненні коштів покупцеві, якщо продаж проводився через РРО, виникають додаткові обовʼязки — модуль 10.\n\n## Покроковий процес\n\nЩомісячна робота з рахунком:\n\n1. Отримати виписку за період у зручному форматі.\n2. Пройти рядки надходжень і для кожного назвати документ.\n3. Позначити рядки, що не є операціями з клієнтами.\n4. Перевірити призначення платежу: чи можна за ним знайти документ.\n5. Виписати рядки з незрозумілим призначенням для уточнення в клієнта.\n6. Звірити суми еквайрингових зарахувань із сумами покупок.\n7. Позначити комісії банку окремо.\n8. Перевірити, чи не було надходжень на особистий рахунок.\n9. Зафіксувати перекази між власними рахунками як внутрішні.\n10. Передати перелік спірних рядків бухгалтеру.\n\n## Практичні приклади\n\n### Приклад 1. Номер із помилкою\n\nУ наданих реквізитах переставлено дві цифри. Контрольна сума не збігається, банк відхиляє платіж. [SRC-071] Це найкращий сценарій: гірший — коли помилковий номер виявляється коректним і кошти йдуть чужій особі. [SRC-022]\n\n### Приклад 2. Оплата на особисту картку\n\nКлієнт переказав оплату на особисту картку підприємця. Порушено режим рахунку: особистий рахунок не використовується в підприємницькій діяльності. [SRC-021] Окремо виникає питання підтвердження доходу — модуль 9.\n\n### Приклад 3. Еквайринг із затримкою\n\nПокупець оплатив карткою 30 вересня, кошти зараховано 2 жовтня за мінусом відсотка еквайра. Дата визнання доходу тут потребує рішення бухгалтера — питання винесене в `references.md`, і модуль його не вирішує.\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Надсилати клієнтам номер особистої картки | особистий рахунок не використовується в підприємницькій діяльності [SRC-021] | давати реквізити підприємницького рахунку |\n| Вважати призначення платежу необовʼязковим | це обовʼязковий реквізит [SRC-051] | вказувати документ, період і суть |\n| Писати «оплата за послуги» без деталей | реквізит заповнений, але функції не виконує | додавати номер документа й період |\n| Вважати виписку підтвердженням операції | вона показує рух коштів, а не зміст операції | зберігати первинні документи [SRC-012] |\n| Рахувати переказ між своїми рахунками доходом | нових коштів не виникає [SRC-010] | позначати як внутрішній рух |\n| Вважати, що безготівкова оплата знімає питання РРО | закон говорить і про безготівкову форму [SRC-075] | перевіряти за модулем 10 |\n| Виплачувати зарплату корпоративною карткою | це прямо заборонено [SRC-073] | використовувати інший спосіб виплати |\n| Вважати, що комісія зменшує податок | на спрощеній системі витрати податок не зменшують [SRC-010] | питання про базу узгодити з бухгалтером |\n| Самостійно вирішувати долю внесених власних коштів | прямої норми немає [SRC-010] | позначити окремо й узгодити |\n\n## Ризики й межі самостійних дій\n\n- **Внесення власних коштів на підприємницький рахунок** — відкрите питання з модуля 2; модуль 8 його не закриває.\n- **Чи є доходом сума до утримання комісії** — адресної норми не знайдено; питання до бухгалтера.\n- **Момент визнання доходу при еквайрингу** — норма говорить про надходження коштів, але еквайринг дає розрив у кілька днів; питання до бухгалтера.\n- Класифікація конкретних рядків виписки — модуль 9.\n- Обовʼязок застосовувати РРО і ПРРО, готівкові ліміти — модуль 10.\n- Робота з форматами CSV і XLSX — модулі 27–28.\n- Валютні рахунки й розрахунки за ЗЕД — модуль 17.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, щоб вирішити долю внесених власних коштів, визначити базу доходу при утриманій комісії та момент визнання доходу при еквайрингу.\n\n**Юрист потрібен**, якщо кошти пішли не тому отримувачу й той відмовляється повертати, або якщо банк зупинив операції за рахунком.\n\n## Підсумок\n\nРахунок ФОП — не «гаманець з іншою назвою». У нього є цільовий режим, і саме він визначає, які операції допустимі. Номер рахунку містить контрольну суму, яка ловить механічні помилки, але не ловить правильно набраний чужий номер. Призначення платежу — обовʼязковий реквізит і єдина нитка від виписки до документа. А три питання — власні кошти, комісія й момент доходу при еквайрингу — модуль свідомо лишає бухгалтеру.\n\n## Самоперевірка\n\n1. Скільки символів у номері платіжного рахунку й що означає кожна частина?\n2. Чому не можна давати клієнтам номер особистої картки?\n3. Які три елементи має містити робоче призначення платежу?\n4. Що показує виписка і чого вона не показує?\n5. Чим корпоративний платіжний інструмент відрізняється від особистого?\n6. Що заборонено робити корпоративним платіжним інструментом?\n7. Хто такий еквайр і хто такий торговець?\n8. Чому переказ між власними рахунками не є доходом?\n9. Які три питання модуль лишає бухгалтеру й чому?\n10. Що робити з рядком виписки, призначення платежу в якому незрозуміле?\n\n## Джерела\n\nПерелік джерел і твердження, які вони підтверджують, — у `references.md`. Використані ідентифікатори: SRC-010, SRC-012, SRC-021, SRC-022, SRC-023, SRC-024, SRC-051, SRC-052, SRC-071, SRC-072, SRC-073, SRC-075, SRC-077.\n\n## Дата перевірки актуальності\n\nДата перевірки актуальності: **2026-09-07**\nНаступна перевірка: **2026-11-01**"}, {"id": "practice", "title": "Практика", "content": "# Практика: розбір рахунку й виписки\n\n## Мета\n\nНавчитися читати рядок виписки як робочу одиницю: розуміти, хто ініціював операцію, чи є вона операцією з клієнтом і чого в ній бракує для обліку.\n\n## Навчальна ситуація\n\nДані синтетичні. Не використовуйте реальні відомості про себе чи клієнтів.\n\n**ФОП Радченко Микола Іванович**, третя група, ремонт побутової техніки. Має два підприємницькі рахунки — основний і накопичувальний — та особисту картку.\n\nФрагмент виписки за основним рахунком за листопад 2026 року:\n\n| № | Дата | Опис | Сума |\n|---|---|---|---|\n| 1 | 04.11 | Надходження від ТОВ «Бріз», «оплата за рахунком № 88 від 02.11.2026 за ремонт» | +14 500 |\n| 2 | 07.11 | Списання, «комісія за розрахунково-касове обслуговування» | −180 |\n| 3 | 11.11 | Надходження, «зарахування коштів за операціями еквайрингу за 09.11–10.11» | +6 230 |\n| 4 | 15.11 | Списання, «переказ на власний рахунок UA…7712» | −20 000 |\n| 5 | 19.11 | Надходження від Петренко І. І., «повернення помилково перерахованих коштів» | +900 |\n| 6 | 22.11 | Списання, «оплата постачальнику запчастин за накладною № 214» | −5 400 |\n| 7 | 26.11 | Надходження від ТОВ «Бріз», «оплата» | +3 100 |\n\nДовідково: 09–10.11 покупці оплатили карткою на суму 6 400 грн; клієнт Петренко раніше нічого не замовляв.\n\n## Завдання 1. Визначте характер кожного рядка\n\nДля кожного рядка дайте висновок і вкажіть джерело. Використовуйте короткі відповіді:\n\n- **клієнт** — операція з клієнтом, підтверджується документом;\n- **внутрішній** — рух між власними рахунками;\n- **банк** — операція банку, не операція з клієнтом;\n- **еквайринг** — зарахування за операціями з платіжними інструментами;\n- **чуже** — надходження, яке не є вашим доходом і підлягає поверненню;\n- **уточнити** — потрібне уточнення в клієнта.\n\n## Завдання 2. Дайте відповідь на три питання про рахунок\n\n1. Скільки символів у номері платіжного рахунку?\n2. Що обчислюється за алгоритмом MOD 97-10?\n3. Що заборонено робити корпоративним платіжним інструментом?\n\n## Завдання 3. Знайдіть різницю, яку не можна пояснити з даних\n\nСума еквайрингового зарахування менша за суму оплат карткою. Чому саме — з наданих даних однозначно не випливає. Позначте це як таке, що потребує окремої перевірки, і не вигадуйте суму.\n\n## Критерії виконання\n\n- кожен рядок має висновок із зазначеним джерелом;\n- внутрішній переказ відокремлено від операцій з клієнтами;\n- рядок із неповним призначенням платежу позначено як такий, що потребує уточнення;\n- різниця в еквайрингу не пояснена припущенням."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Оплата прийшла не туди»\n\n## Ситуація\n\nВладислав — ФОП третьої групи, займається ремонтом побутової техніки. Наприкінці листопада він розбирає, що сталося за місяць.\n\n- постійному клієнту він надіслав номер своєї особистої картки — «так швидше», клієнт заплатив 12 000 грн;\n- ще один платіж на 900 грн прийшов від людини, яка нічого не замовляла, з приміткою «повернення помилково перерахованих коштів»;\n- корпоративною карткою він виплатив 6 000 грн помічникові за роботу за місяць;\n- у трьох платежах від постійного клієнта призначення платежу — просто «оплата»;\n- еквайринг зараховує суми на два дні пізніше й меншими за суму покупок, і Владислав вважає, що це помилка банку;\n- 20 000 грн він переказав із підприємницького рахунку на накопичувальний власний і вважає, що це зменшило його дохід;\n- банк утримав 180 грн комісії, і Владислав вирахував їх із доходу за листопад;\n- клієнт попросив реквізити для оплати — Владислав надіслав назву, податковий номер, номер рахунку й банк.\n\nДані синтетичні.\n\n## Завдання\n\n1. Знайдіть справжні ризики й відокремте їх від того, що лише виглядає проблемою.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Побудуйте безпечну послідовність дій.\n4. Поясніть, чому переказ на власний накопичувальний рахунок не змінює доходу за листопад.\n\n## Орієнтир для самоперевірки\n\n- особистий рахунок не використовується в підприємницькій діяльності — це пряма заборона, під якою підписується сама особа;\n- корпоративним платіжним інструментом заборонено виплачувати заробітну плату та інші соціальні виплати;\n- переказ між власними рахунками нових коштів не створює: та сама сума видно двічі;\n- на спрощеній системі витрати податок не зменшують, тому «вирахувати комісію з доходу» — окреме питання до бухгалтера, а не самостійне рішення;\n- затримка й менша сума при еквайрингу — нормальна робота послуги, а не помилка банку;\n- надходження від особи, яка нічого не замовляла, доходом не є й розбирається за нормами про помилкову операцію;\n- призначення платежу «оплата» формально заповнене, але звʼязку з документом не дає;\n- надіслані реквізити повні — тут порушення немає.\n\nЦе навчальний кейс, а не індивідуальна податкова консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст місячної роботи з рахунком\n\n## Режим рахунку\n\n- [ ] Усі надходження від клієнтів прийшли на підприємницький рахунок.\n- [ ] Клієнтам надано реквізити підприємницького, а не особистого рахунку.\n- [ ] Корпоративним платіжним інструментом не виплачувалася заробітна плата.\n- [ ] Відомо, хто має право здійснювати операції корпоративним інструментом.\n\n## Кожен рядок виписки\n\n- [ ] Для кожного надходження названо документ, що підтверджує операцію.\n- [ ] Рядки, що не є операціями з клієнтами, позначено окремо.\n- [ ] Перекази між власними рахунками позначено як внутрішній рух.\n- [ ] Комісії банку позначено окремо від операцій з контрагентами.\n\n## Призначення платежу\n\n- [ ] У призначенні кожного надходження є документ, період і суть.\n- [ ] Рядки з формулюванням на кшталт «оплата» виписано для уточнення.\n- [ ] Із постійними клієнтами узгоджено формулювання на майбутнє.\n\n## Еквайринг\n\n- [ ] Суми зарахувань звірено із сумами оплат за відповідні дні.\n- [ ] Різницю пояснено звітом еквайра, а не припущенням.\n- [ ] Питання дати визнання доходу передано бухгалтеру.\n\n## Спірне — бухгалтеру\n\n- [ ] Внесення власних коштів позначено окремо й не вирішено самостійно.\n- [ ] Питання бази доходу при утриманій комісії передано бухгалтеру.\n- [ ] Надходження від осіб, які нічого не замовляли, взято на облік для повернення."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 8\n\n**Підприємницький рахунок** — рахунок, відкритий фізичною особою для підприємницької діяльності. Окремий від рахунку для власних потреб.\n\n**Рахунок для власних потреб** — особистий рахунок фізичної особи; використовувати його в підприємницькій діяльності заборонено.\n\n**Унікальний ідентифікатор** — комбінація літер, цифр і символів, що дає змогу однозначно ідентифікувати користувача або його рахунок для виконання платіжної операції.\n\n**Номер платіжного рахунку** — 29 символів за схемою `UA KK YYYYYY AAAAAAAAAAAAA`: код країни, контрольна сума, ідентифікатор установи, номер рахунку аналітичного обліку.\n\n**Контрольна сума** — дві цифри після коду країни, обчислені за алгоритмом MOD 97-10; вони дають змогу автоматично виявити механічну помилку в номері.\n\n**Призначення платежу** — обовʼязковий реквізит платіжної інструкції, який звʼязує рух коштів із документом і періодом.\n\n**Виписка** — документ банку про рух коштів за рахунком: дата, сума, контрагент, призначення платежу, залишок. Змісту господарської операції не показує.\n\n**Комісія банку** — плата за обслуговування рахунку й окремі операції. На спрощеній системі витрати податок не зменшують.\n\n**Еквайринг** — платіжна послуга з приймання платіжних інструментів, результатом якої є переказ коштів отримувачу або видача готівки.\n\n**Еквайр** — надавач платіжних послуг, який надає послугу еквайрингу й має відповідну ліцензію.\n\n**Торговець** — субʼєкт господарювання, який за договором з еквайром приймає платіжні інструменти до обслуговування.\n\n**Особистий платіжний інструмент** — інструмент, емітований для власних потреб фізичної особи.\n\n**Корпоративний (бізнесовий) платіжний інструмент** — інструмент для потреб господарської, підприємницької або незалежної професійної діяльності. Виплачувати ним заробітну плату заборонено.\n\n**Внутрішній переказ** — рух коштів між власними рахунками однієї особи. Нових коштів не створює й доходу не змінює.\n\n**Помилкова платіжна операція** — операція, унаслідок якої кошти зараховано неналежному отримувачу; такі кошти доходом не є й підлягають поверненню.\n\n**Внесення власних коштів** — поповнення підприємницького рахунку самим підприємцем. Прямої норми ПКУ немає, тому операцію позначають окремо й узгоджують із бухгалтером."}, {"id": "reference", "title": "Пам’ятка", "content": "# Памʼятка: рахунок і виписка\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-09-07**\n\n## Режим рахунку\n\n- окремі рахунки: підприємницький, для незалежної професійної діяльності, для власних потреб;\n- **особистий рахунок у підприємницькій діяльності — заборонено**; під цим підписуються при відкритті;\n- банк повідомляє податкову про відкриття або закриття в день дії;\n- видаткові операції — після взяття рахунку на облік.\n\n## Номер рахунку\n\n29 символів: `UA` `KK` `YYYYYY` `AAAAAAAAAAAAA`\n\n| Частина | Що це |\n|---|---|\n| UA | код країни |\n| KK | контрольна сума, MOD 97-10 |\n| YYYYYY | ідентифікатор установи |\n| решта | рахунок аналітичного обліку |\n\nКонтрольна сума ловить помилку набору, але **не ловить правильно набраний чужий номер**.\n\n## Реквізити для клієнта\n\nНазва · податковий номер · номер підприємницького рахунку · банк.\n\n## Призначення платежу\n\nОбовʼязковий реквізит. Робоче формулювання = **документ + період + суть**.\n\n«Оплата за рахунком № 41 від 03.10.2026 за послуги за вересень» ✓\n«Оплата за послуги» ✗\n\n## Виписка\n\nПоказує: дату, суму, контрагента, призначення, залишок.\nНе показує: зміст і обсяг операції. **Первинні документи не замінює.**\n\n## Рядки, що не є доходом\n\n| Рядок | Що це |\n|---|---|\n| переказ із власного рахунку | внутрішній рух, нових коштів немає |\n| повернення авансу клієнтові | до доходу не включається |\n| помилкове надходження | підлягає поверненню |\n| за посередницьким договором | дохід — лише винагорода |\n| внесення власних коштів | **питання до бухгалтера** |\n\n## Платіжні інструменти\n\n| Особистий | Корпоративний (бізнесовий) |\n|---|---|\n| для власних потреб | для господарської діяльності |\n\n**Заборонено:** виплачувати зарплату та інші соціальні виплати корпоративним інструментом.\nВласник рахунку визначає коло осіб і **несе відповідальність** за використання.\n\n## Еквайринг\n\n**Еквайр** — надає послугу, має ліцензію. **Торговець** — ви, приймаєте інструменти за договором.\n\n- зарахування пізніше за оплату — нормально;\n- сума менша за покупки — утримання еквайра;\n- склад різниці підтверджує **звіт еквайра**, не припущення;\n- оплата карткою є розрахунковою операцією → питання РРО, модуль 10.\n\n## Три питання бухгалтеру\n\n1. Внесення власних коштів на підприємницький рахунок.\n2. Чи є доходом сума **до** утримання комісії.\n3. Дата визнання доходу при еквайрингу.\n\nМодуль їх свідомо не вирішує."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 8\n\nПеревірено: **2026-09-07**. Кожна норма звірена з повним текстом на `zakon.rada.gov.ua` (сторінка «Текст для друку»). Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Податкового кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Фізична особа відкриває окремі рахунки для діяльності й для власних потреб | SRC-021, пункти 10 і 24 | Норма підзаконного акта | Матеріал модуля 2, тут стає щоденною практикою |\n| Особистий рахунок заборонено використовувати в підприємницькій діяльності | SRC-021 | Норма підзаконного акта | Особа підписується про це в заяві про відкриття рахунку |\n| Прямої заборони переказувати кошти з підприємницького рахунку на власні потреби немає | SRC-021 | Норма підзаконного акта | Заборона працює в один бік |\n| Банк повідомляє податкову про відкриття або закриття рахунку в день дії | SRC-024, стаття 69 | Норма закону | Видаткові операції — після взяття рахунку на облік |\n| Номер платіжного рахунку — 29 символів за схемою UA KK YYYYYY AAAAAAAAAAAAA | SRC-071, пункти 2 і 3 | Норма підзаконного акта | Контрольна сума — за алгоритмом MOD 97-10 |\n| Унікальний ідентифікатор дає змогу однозначно ідентифікувати користувача або рахунок | SRC-072, пункт 90 частини першої статті 1 | Норма закону | Кошти зараховуються за ним, а не за назвою отримувача |\n| Помилкова платіжна операція та обовʼязок повернути кошти | SRC-022, стаття 88 | Норма закону | Разом із нормою про безпідставно набуте майно [SRC-023] |\n| Платіжна інструкція має вісім обовʼязкових реквізитів, зокрема призначення платежу | SRC-051, пункт 37 | Норма підзаконного акта | Матеріал модуля 5 |\n| Реквізити платіжної інструкції заповнюються державною мовою | SRC-051, пункт 10 | Норма підзаконного акта | Латиниця — лише за правилами системи або надавача |\n| Дохід платника єдиного податку — надходження без вирахування витрат | SRC-010, пункт 292.1 | Норма закону | Комісія податок не зменшує |\n| Аванси, що повертаються покупцю, до доходу не включаються | SRC-010, пункт 292.11 | Норма закону | Повернення при розірванні договору або за листом-заявою |\n| Внутрішній переказ між власними рахунками доходу не створює | SRC-010 | Норма закону | Висновок зі складу доходу: нової операції немає |\n| Еквайринг — приймання платіжних інструментів із переказом коштів отримувачу | SRC-072, пункт 10 частини першої статті 1 | Норма закону | Надає послугу еквайр із ліцензією (пункт 11) |\n| Торговець приймає платіжні інструменти за договором з еквайром | SRC-072, пункт 89 частини першої статті 1 | Норма закону | Торговцем є і той, хто надає послуги |\n| Платіжні інструменти поділяються на особисті та корпоративні (бізнесові) | SRC-073, пункт 104 | Норма підзаконного акта | За призначенням, а не за виглядом картки |\n| Корпоративним інструментом заборонено виплачувати заробітну плату | SRC-073, пункт 106 | Норма підзаконного акта | Разом з іншими соціальними виплатами й допомогою |\n| Власник рахунку визначає коло осіб і відповідає за використання інструменту | SRC-073, пункти 107 і 108 | Норма підзаконного акта | Відповідальність не переходить на держателя |\n| Розрахункові операції бувають у готівковій та безготівковій формі | SRC-075, стаття 3 | Норма закону | Тому оплата карткою теж є розрахунковою операцією — модуль 10 |\n| Визначення розрахункового документа | SRC-052, стаття 2 | Норма закону | Матеріал модуля 5 |\n| Формувати показники звітності без підтвердних документів заборонено | SRC-012, пункт 44.1 | Норма закону | Тому виписка не замінює первинних документів |\n| За посередницькими договорами доходом є сума винагороди | SRC-077, пункт 292.4 | Норма закону | Детально — модуль 9 |\n\n## Межі перевірки\n\n- **Внесення власних коштів на підприємницький рахунок** — відкрите питання ще з модуля 2: прямої норми ПКУ немає, і кваліфікація залежить від обставин та призначення платежу. Модуль 8 його **не закриває**.\n- **Чи є доходом сума до утримання комісії банку або еквайра** — адресної норми не знайдено. Відомо лише, що на спрощеній системі витрати податок не зменшують. Модуль питання не вирішує.\n- **Момент визнання доходу при еквайрингу** — норма говорить про дату надходження коштів, але між оплатою карткою й зарахуванням минає кілька днів. Модуль констатує розрив і передає питання бухгалтеру.\n- **Формати виписки** (PDF, CSV, XLSX) — питання зручності, а не обліку; робота з табличними форматами належить модулям 27–28.\n- **Поза межами модуля:** класифікація конкретних рядків виписки (модуль 9), обовʼязок застосовувати РРО і готівкові ліміти (модуль 10), валютні рахунки та розрахунки за ЗЕД (модуль 17), розрахунок податку (модуль 11).\n- **Жоден банк, платіжна система чи сервіс у модулі не рекомендується** — описано ролі й вимоги, а не конкретні продукти."}], "quiz": [{"id": "m08-q01", "title": "Реквізити для клієнта", "competency": "account_mode", "scenario": "Клієнт просить реквізити для оплати, і підприємець надсилає номер своєї особистої картки.", "question": "Що саме тут порушено?", "options": [{"text": "Обовʼязок повідомляти податкову про кожне надходження на цю картку", "feedback": "Ні. Автоматично передається лише факт відкриття або закриття рахунку."}, {"text": "Заборона використовувати рахунок для власних потреб у діяльності", "correct": true, "feedback": "Правильно. Про цю заборону особа підписується в заяві про відкриття рахунку."}, {"text": "Правило про обовʼязковий окремий рахунок для кожного виду діяльності", "feedback": "Ні. Норма розділяє рахунки за призначенням, а не за кожним видом діяльності."}], "explanation": "Фізична особа відкриває окремі рахунки: для підприємницької діяльності, для незалежної професійної діяльності та для власних потреб. Використовувати рахунок для власних потреб в операціях підприємницької діяльності заборонено.", "source_reference": ["SRC-021", "SRC-024"], "hint": "Порушення тут виникає не в момент платежу, а в момент, коли клієнту дали цей номер."}, {"id": "m08-q02", "title": "Структура номера", "competency": "account_number", "scenario": "Бухгалтер перевіряє номер рахунку, наданий новим контрагентом для оплати.", "question": "З чого складається номер платіжного рахунку?", "options": [{"text": "З коду банку та номера платіжної картки отримувача за міжнародним стандартом", "feedback": "Ні. Номер картки й номер рахунку — різні речі з різною структурою."}, {"text": "З 20 цифр, перші чотири з яких означають код валюти рахунку користувача", "feedback": "Ні. Ані така довжина, ані код валюти в структурі номера не передбачені."}, {"text": "З 29 символів: код країни, контрольна сума, ідентифікатор установи, номер рахунку", "correct": true, "feedback": "Правильно. Контрольна сума обчислюється за алгоритмом MOD 97-10."}], "explanation": "Номер платіжного рахунку складається з 29 символів і формується за схемою UA KK YYYYYY AAAAAAAAAAAAA: код країни, контрольна сума за алгоритмом MOD 97-10, ідентифікатор установи та номер рахунку аналітичного обліку.", "source_reference": ["SRC-071"], "hint": "Зверніть увагу на дві цифри після коду країни: вони не є частиною номера в банку."}, {"id": "m08-q03", "title": "Помилка в номері", "competency": "account_checksum", "scenario": "У наданих реквізитах переставлено дві цифри, але отриманий номер виявився коректним.", "question": "Що станеться з платежем?", "options": [{"text": "Кошти підуть іншому отримувачу: контрольна сума такої помилки не ловить", "correct": true, "feedback": "Правильно. Далі це вже помилкова платіжна операція з обовʼязком повернення."}, {"text": "Платіж буде зупинено, оскільки імʼя отримувача не збігається з номером", "feedback": "Ні. Кошти зараховуються за унікальним ідентифікатором, а не за назвою."}, {"text": "Банк самостійно виправить номер за назвою отримувача в платіжній інструкції", "feedback": "Ні. Банк не виправляє номер рахунку за іншими реквізитами інструкції."}], "explanation": "Контрольна сума виявляє механічні помилки в наборі номера, але не захищає від правильно набраного чужого номера. У цьому разі виникає помилкова платіжна операція, і кошти підлягають поверненню.", "source_reference": ["SRC-071", "SRC-022"], "hint": "Подумайте, що саме перевіряє контрольна сума: правильність набору чи правильність адресата."}, {"id": "m08-q04", "title": "Формулювання платежу", "competency": "account_payment_purpose", "scenario": "Постійний клієнт щомісяця платить із призначенням «оплата за послуги» без номера документа.", "question": "Чому це створює проблему?", "options": [{"text": "Реквізит вважається незаповненим, і платіжна інструкція є недійсною", "feedback": "Ні. Реквізит заповнений, і питання не в reshold": 80, "instructions": "Знайдіть у ситуації Владислава справжні ризики, класифікуйте їх, визначте відповідального та побудуйте безпечну послідовність дій.", "situation_title": "Ситуація", "reasoning_prompt": "Чому переказ 20 000 грн на власний накопичувальний рахунок не змінює доходу за листопад?", "reasoning_min_chars": 60, "order_feedback": "Послідовність потребує виправлення: спочатку зупиніть те, що продовжує порушення, потім розберіться з коштами, які вам не належать, далі впорядкуйте призначення платежів і лише наприкінці передавайте спірні питання бухгалтеру.", "how_to": ["Прочитайте ситуацію і позначте лише ті твердження, які справді створюють ризик.", "Для кожного ризику поставте позначку або одразу оберіть категорію чи відповідального — список сам позначить твердження як ризик.", "Якщо твердження неоднозначне, натисніть «Підказка» під ним: вона ставить навідне питання, але не називає відповіді.", "Розставте дії у безпечному порядку: перетягніть картку мишею або скористайтеся стрілками. Картка зеленіє одразу, щойно опиняється на своєму місці.", "Напишіть власне пояснення щонайменше з 60 символів; кнопка підказки покаже, що воно має містити.", "Натисніть «Перевірити рішення» і виправляйте відповідь, доки результат не досягне 80%."], "situation": ["Клієнту надіслано номер особистої картки, оплата 12 000 грн прийшла на неї", "надійшло 900 грн від людини, яка нічого не замовляла", "корпоративною карткою виплачено 6 000 грн помічникові за роботу", "у трьох платежах призначення платежу — просто «оплата»", "еквайринг зараховує суми пізніше й меншими; це вважають помилкою банку", "переказ 20 000 грн на власний накопичувальний рахунок вважають зменшенням доходу", "комісію банку 180 грн самостійно вирахувано з доходу за листопад", "клієнту надіслано назву, податковий номер, номер рахунку й банк"], "categories": ["режим рахунку", "чужі кошти", "звʼязок з документом", "визначення доходу"], "owners": ["власник", "бухгалтер", "юрист"], "risks": [{"id": "personal_c  самостійно", "critical": true, "hint": "Не було таких операцій — статус «підтверджено» з поясненням, що операцій немає. Були — позначте й передайте.", "why": "Прямої норми ПКУ немає, і кваліфікація залежить від обставин та призначення платежу."}, {"id": "commission_base", "group": "Спірне — бухгалтеру", "text": "Питання бази доходу при утриманій комісії передано бухгалтеру", "critical": false, "hint": "Йдеться про те, чи є доходом сума до утримання комісії. Комісій за місяць не було — «не застосовується».", "why": "Адресної норми не знайдено, тому рішення приймає бухгалтер, а не підприємець самостійно."}, {"id": "wrong_money", "group": "Спірне — бухгалтеру", "text": "Надходження від осіб, які нічого не замовляли, взято на облік для повернення", "critical": true, "hint": "Таких надходжень не було — «підтверджено» з відповідним поясненням. Були — запишіть суму, дату й платника.", "why": "Такі кошти доходом не є й підлягають поверненню за нормами про помилкову операцію."}]}, "glossary": [{"term": "Підприємницький рахунок", "definition": "Рахунок, відкритий фізичною особою для підприємницької діяльності, окремий від рахунку для власних потреб.", "example": "Саме його реквізити надають клієнтам для оплати послуг.", "avoid": "«будь-який мій рахунок» — режим рахунку визначає, які операції на ньому допустимі"}, {"term": "Рахунок для власних потреб", "definition": "Особистий рахунок фізичної особи; використовувати його в операціях підприємницької діяльності заборонено.", "example": "Відкриваючи його, особа власноруч підписується, що знає про заборону.", "avoid": "«швидший спосіб прийняти оплату» — це порушення режиму рахунку"}, {"term": "Унікальний ідентифікатор", "definition": "Комбінація літер, цифр і символів, що дає змогу однозначно ідентифікувати користувача або його рахунок для виконання платіжної операції.", "example": "Номер рахунку, за яким банк знаходить отримувача платежу.", "avoid": "«назва отримувача» — вона не є унікальним ідентифікатором"}, {"term": "Номер пл
