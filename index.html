<html lang="uk">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Бухгалтер ФОП</title>
  <style>
    :root {

    }

    @media(max-width:900px){.layout{grid-template-columns:1fr;padding:16px 12px 52px;gap:14px}.sidebar{position:static;overflow-x:auto;padding-bottom:4px}.module-label{display:none}.nav-list{display:flex;width:max-content}.nav-button{width:170px;border:1px solid var(--outline-soft);background:var(--surface)}.route{grid-template-columns:1fr 1fr}.topbar-inner{padding-inline:14px}.hero,.card{border-radius:20px}}

    .order-item{cursor:grab}.order-item.dragging{opacity:.55;cursor:grabbing}.order-item.drop-target{outline:3px dashed var(--primary);outline-offset:3px}.order-item.is-correct{border-color:var(--success);background:var(--success-bg)}.order-item.is-wrong{border-color:var(--warning);background:var(--warning-bg)}.order-verdict{display:block;margin-top:3px;font-size:.82rem;font-weight:800}.order-text{display:block;min-width:0}

    .review-list{display:grid;gap:8px;margin:6px 0 16px}.activity-card.is-neutral{border-color:var(--info)}

  </style>
</head>
<body>
  <a class="skip" href="#main">Перейти до матеріалу</a>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row"><div class="brand-wrap"><div class="brand-mark" aria-hidden="true">Ф</div><div><div class="brand">Бухгалтер ФОП</div><div class="version" id="version"></div></div></div><span class="chip" id="module-state">Навчання</span></div>
      <div class="progress-row"><div class="progress-track" role="progressbar" aria-label="Прогрес модуля" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="progress-fill" id="progress-fill"></div></div><span class="progress-label" id="progress-label">0%</span></div>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Навігація курсу"><p class="module-label" id="nav-label">Навчальний маршрут</p><ol class="nav-list" id="nav-list"></ol></nav>

  <script id="course-data" type="application/json">{"course": {"schema": "course/v1", "id": "fop-accounting-course", "title": "Бухгалтер ФОП: від нуля до професійного рівня", "subtitle": "Практичний курс обліку та оподаткування ФОП для початківця", "version": "0.11.0", "updated": "2026-09-06", "planned_modules": 38, "final_assessment": {"title": "Підсумкова атестація", "status": "planned", "note": "Атестацію буде відкрито після публікації всіх рівнів. Вона перевірятиме наскрізний робочий цикл бухгалтера ФОП, а не пам’ять про окремі модулі."}, "level_quiz": {"title": "Рівнева перевірка", "threshold": 80, "min_questions": 12, "max_questions": 15, "note": "Рівнева перевірка складається з наскрізних питань: кожне спирається щонайменше на два модулі рівня. Вона не зараховує модулі й не замінює їх проходження — вона показує, чи склалися модулі в одну картину."}, "levels": [{"level": 1, "title": "Основи підприємництва і бухгалтерського мислення", "planned_modules": 3, "quiz": [{"id": "l01-q01", "title": "Що видно в ЄДР", "competency": "cross_registry_vs_tax_status", "scenario": "Клієнт надіслав виписку з ЄДР і каже: «Тут усе видно, я на третій групі».", "modules": ["module-01", "module-03"], "question": "Чи підтверджує ця виписка систему оподаткування?", "options": [{"text": "Так, бо обрана система оподаткування є одним із реєстраційних відомостей ЄДР", "feedback": "Ні. ЄДР містить реєстраційні дані підприємця, а податковий статус ведеться окремо."}, {"text": "Ні: податковий статус перевіряють у реєстрі платників єдиного податку", "correct": true, "feedback": "Правильно. Дані цього реєстру оприлюднюються щоденно для вільного доступу."}, {"text": "Так, якщо у виписці зазначено КВЕДи, дозволені для обраної групи платника", "feedback": "Ні. Перелік КВЕДів нічого не каже про те, чи зареєстровано особу платником єдиного податку."}], "explanation": "ЄДР показує реєстраційні відомості: ПІБ, дату запису, стан, адресу, види діяльності. Систему оподаткування там не видно — її перевіряють у реєстрі платників єдиного податку або витягом з нього. Це два різні джерела, і плутанина між ними — типова помилка приймання клієнта.", "source_reference": ["SRC-002", "SRC-036"], "hint": "Подумайте, який орган веде кожен із реєстрів і які саме відомості до кожного потрапляють."}, {"id": "l01-q02", "title": "Діяльність поза реєстром", "competency": "cross_kved_and_rate", "scenario": "ФОП другої групи почав надавати новий вид послуг, не внісши його до реєстру платників єдиного податку.", "modules": ["module-01", "module-03"], "question": "Який наслідок це має для доходу від нового виду діяльності?", "options": [{"text": "Дохід оподатковується за звичайною ставкою, бо КВЕД зазначено в ЄДР", "feedback": "Ні. Наявність КВЕДу в ЄДР не замінює внесення виду діяльності до реєстру платників єдиного податку."}, {"text": "Дохід не оподатковується, доки підприємець не внесе зміни до реєстру платників", "feedback": "Ні. Дохід оподатковується в будь-якому разі, питання лише в тому, за якою ставкою."}, {"text": "До нього застосовується підвищена ставка єдиного податку в розмірі 15%", "correct": true, "feedback": "Правильно. Для першої і другої груп це одна з пʼяти підстав підвищеної ставки."}], "explanation": "КВЕД у ЄДР і вид діяльності в реєстрі платників єдиного податку — різні записи. Дохід від діяльності, не зазначеної в реєстрі платників єдиного податку, для першої і другої груп оподатковується за ставкою 15% і є підставою для переходу на загальну систему.", "source_reference": ["SRC-008", "SRC-030", "SRC-029"], "hint": "Порівняйте, який саме запис перевіряє податкова: у якому реєстрі має бути вид діяльності."}, {"id": "l01-q03", "title": "Аванс у грудні", "competency": "cross_income_date_and_limit", "scenario": "26 грудня на рахунок ФОП надійшов аванс за роботу, яку буде виконано в лютому наступного року.", "modules": ["module-02", "module-03"], "question": "У річний обсяг доходу якого року входить ця сума?", "options": [{"text": "Поточного року, бо дохід виникає за датою надходження коштів", "correct": true, "feedback": "Правильно. Тому аванс наприкінці грудня може вивести обсяг за межі ліміту групи."}, {"text": "Наступного року, бо саме тоді буде виконано роботу й підписано акт", "feedback": "Ні. Дата акта визначає зміст операції, а не дату виникнення доходу єдинника."}, {"text": "Розподіляється між роками пропорційно до фактично виконаного обсягу", "feedback": "Ні. Жодного правила пропорційного розподілу доходу між роками норма не містить."}], "explanation": "Для платника єдиного податку датою отримання доходу є дата надходження коштів. Обсяг доходу за календарний рік порівнюють із лімітом групи, тому грудневий аванс за майбутню роботу впливає на ліміт поточного року, а не наступного.", "source_reference": ["SRC-010", "SRC-025"], "hint": "Спершу визначте дату доходу, а вже потім питайте, з обсягом якого періоду її порівнюють."}, {"id": "l01-q04", "title": "Взаємозалік", "competency": "cross_settlement_form", "scenario": "Клієнт пропонує ФОП третьої групи закрити частину боргу зустрічною послугою замість оплати.", "modules": ["module-02", "module-03"], "question": "Які два наслідки має така домовленість?", "options": [{"text": "Дохід не виникає взагалі, бо кошти на рахунок підприємця не надходили", "feedback": "Ні. Відсутність руху коштів не робить операцію невидимою: негрошовий розрахунок норма прямо називає."}, {"text": "Ставка 15% на суму й підстава для переходу на загальну систему", "correct": true, "feedback": "Правильно. Платник єдиного податку розраховується виключно в грошовій формі."}, {"text": "Дохід виникає за датою підписання акта взаємозаліку без інших наслідків", "feedback": "Ні. Дата тут не головне: сам негрошовий спосіб розрахунку є порушенням умови перебування."}], "explanation": "Платники єдиного податку повинні здійснювати розрахунки виключно в грошовій формі. Дохід, отриманий негрошовим способом, оподатковується за ставкою 15%, і це одночасно є підставою для обовʼязкового переходу на загальну систему з кварталу порушення.", "source_reference": ["SRC-025", "SRC-030", "SRC-029"], "hint": "Подумайте окремо про ставку до конкретної суми і окремо про право залишатися на спрощеній."}, {"id": "l01-q05", "title": "Поворотна допомога", "competency": "cross_non_income_and_limit", "scenario": "ФОП отримав поворотну фінансову допомогу й повернув її через сім місяців того самого року.", "modules": ["module-02", "module-03"], "question": "Як ця сума впливає на обсяг доходу для ліміту групи?", "options": [{"text": "Впливає: до доходу включають будь-яке надходження на рахунок підприємця", "feedback": "Ні. Кодекс прямо перелічує надходження, які до складу доходу єдинника не включаються."}, {"text": "Впливає наполовину, бо допомогу було повернуто в тому самому календарному році", "feedback": "Ні. Правила часткового врахування такої суми норма не встановлює."}, {"text": "Не впливає: повернута протягом 12 місяців допомога до доходу не включається", "correct": true, "feedback": "Правильно. Ключова умова — саме строк повернення, а не сам факт договору."}], "explanation": "Поворотна фінансова допомога, отримана й повернена протягом 12 календарних місяців з дня отримання, до складу доходу платника єдиного податку не включається. Оскільки в обсяг доходу для ліміту групи входить саме дохід, ця сума ліміт не наближає.", "source_reference": ["SRC-010", "SRC-014", "SRC-025"], "hint": "Спершу визначте, чи є ця сума доходом, і лише потім питайте про обсяг для ліміту."}, {"id": "l01-q06", "title": "Оплата на особисту картку", "competency": "cross_accounts_and_status", "scenario": "Клієнт переказав оплату за послуги на особисту картку підприємця, а не на підприємницький рахунок.", "modules": ["module-01", "module-02"], "question": "Що тут порушено, якщо ФОП і фізична особа — одна людина?", "options": [{"text": "Нічого: підприємець і фізична особа — одна особа, тому рахунок значення не має", "feedback": "Ні. Одна особа справді, але рахунки для різних цілей відкриваються окремо за нормою."}, {"text": "Заборона використовувати рахунок для власних потреб у підприємницькій діяльності", "correct": true, "feedback": "Правильно. Про цю заборону особа власноруч підписується в заяві про відкриття рахунку."}, {"text": "Обовʼязок окремо повідомляти податкову про кожну операцію на особистому рахунку", "feedback": "Ні. Такого обовʼязку немає: автоматично передається лише факт відкриття або закриття рахунку."}], "explanation": "ФОП і фізична особа — це одна особа, але фізична особа відкриває окремі рахунки: для підприємницької діяльності й для власних потреб. Використовувати рахунок для власних потреб в операціях підприємницької діяльності заборонено.", "source_reference": ["SRC-001", "SRC-021", "SRC-024"], "hint": "Питання не про те, чиї це гроші, а про те, для якої мети відкрито конкретний рахунок."}, {"id": "l01-q07", "title": "Після припинення", "competency": "cross_termination_duties", "scenario": "Підприємець вніс до ЄДР запис про припинення діяльності й вважає, що всі питання закриті.", "modules": ["module-01", "module-02"], "question": "Що лишається після цього запису?", "options": [{"text": "Нічого: запис у ЄДР припиняє і статус, і всі попередні зобовʼязання особи", "feedback": "Ні. Запис припиняє підприємницький статус на майбутнє, але зобовʼязання не анулює."}, {"text": "Лише обовʼязок закрити банківські рахунки, відкриті для підприємницької діяльності", "feedback": "Ні. Закриття рахунків є однією з дій, але далеко не єдиною з тих, що лишаються."}, {"text": "Обовʼязки подати звітність, сплатити податки й зберігати документи періоду", "correct": true, "feedback": "Правильно. Саме тому облік за минулі періоди має бути в порядку до припинення."}], "explanation": "Запис про припинення зупиняє підприємницький статус на майбутнє, але не стирає зобовʼязань, що виникли під час діяльності: звітність, податки, договори, зберігання документів. Відновити закритий запис не можна — потрібна нова державна реєстрація.", "source_reference": ["SRC-002", "SRC-003", "SRC-012"], "hint": "Розділіть дві речі: що припиняється на майбутнє і що лишається за вже минулі періоди."}, {"id": "l01-q08", "title": "Залишок і база податку", "competency": "cross_profit_vs_base", "scenario": "На рахунку ФОП третьої групи 40 000 грн, з них 25 000 грн — аванси за ще не виконані роботи.", "modules": ["module-02", "module-03"], "question": "Від якої величини рахують єдиний податок?", "options": [{"text": "Від доходу, тобто від надходжень періоду, без вирахування будь-яких витрат", "correct": true, "feedback": "Правильно. Аванси є доходом, хоча роботу за ними ще не виконано."}, {"text": "Від залишку коштів на рахунку станом на останній день звітного періоду підприємця", "feedback": "Ні. Залишок на рахунку взагалі не є величиною, від якої рахують податок."}, {"text": "Від прибутку, тобто від різниці між надходженнями періоду й витратами", "feedback": "Ні. Прибуток підприємець рахує для себе; базою на спрощеній системі є дохід."}], "explanation": "Залишок коштів, дохід, витрати й прибуток — чотири різні числа. На спрощеній системі базою є дохід, тобто надходження без вирахування витрат, і аванси до нього входять. Залишок на рахунку не є базою оподаткування ні на одній із систем.", "source_reference": ["SRC-010", "SRC-013", "SRC-025"], "hint": "Пригадайте чотири різні числа підприємця й перевірте, яке з них норма називає базою."}, {"id": "l01-q09", "title": "Переказ між своїми рахунками", "competency": "cross_internal_transfer", "scenario": "ФОП переказав 20 000 грн з одного власного підприємницького рахунку на інший власний.", "modules": ["module-02", "module-03"], "question": "Як ця операція впливає на обсяг доходу за рік?", "options": [{"text": "Збільшує обсяг доходу на 20 000 грн, бо кошти надійшли на рахунок підприємця", "feedback": "Ні. Формальне надходження на рахунок не означає, що виникла виручка від діяльності."}, {"text": "Не впливає: нових коштів не виникло, та сама сума лише змінила рахунок", "correct": true, "feedback": "Правильно. Ту саму суму видно двічі: як списання в одній виписці й як надходження в іншій."}, {"text": "Зменшує обсяг доходу, бо списання з першого рахунку є витратою підприємця", "feedback": "Ні. На спрощеній системі витрати на розмір доходу й податку взагалі не впливають."}], "explanation": "Внутрішній переказ між власними рахунками не створює нових коштів: та сама сума зʼявляється як списання в одній виписці й як надходження в іншій. Доходом вона не є, тому в обсяг доходу для ліміту групи не потрапляє.", "source_reference": ["SRC-010", "SRC-021", "SRC-025"], "hint": "Спитайте себе, чи виконано нову роботу й чи змінилася загальна сума коштів підприємця."}, {"id": "l01-q10", "title": "Ставка другої групи", "competency": "cross_address_and_rate", "scenario": "Підприємець другої групи знайшов у довіднику суму місячного платежу й планує сплачувати саме її.", "modules": ["module-01", "module-03"], "question": "Де насправді дізнатися ставку для його випадку?", "options": [{"text": "У Податковому кодексі, який встановлює точний розмір ставки для другої групи", "feedback": "Ні. Кодекс встановлює лише стелю — не більше 20% мінімальної заробітної плати."}, {"text": "У виписці з ЄДР, де ставка зазначається разом із видами діяльності особи", "feedback": "Ні. ЄДР не містить ані системи оподаткування, ані ставки єдиного податку."}, {"text": "У рішенні місцевої ради за місцем податкової адреси підприємця", "correct": true, "feedback": "Правильно. Рада встановлює ставку залежно від виду господарської діяльності."}], "explanation": "Ставку першої та другої груп встановлює сільська, селищна або міська рада залежно від виду діяльності; Кодекс дає лише стелю. Тому знати податкову адресу підприємця недостатньо для обліку — вона ще й визначає, чиє рішення про ставку шукати.", "source_reference": ["SRC-006", "SRC-030"], "hint": "Зверніть увагу на слова «не більше» в нормі: вони показують, хто визначає конкретну величину."}, {"id": "l01-q11", "title": "Мільйон і ліміт групи", "competency": "cross_vat_threshold_vs_limit", "scenario": "ФОП третьої групи звірив обсяг доходу з лімітом групи й вважає, що ПДВ його не стосується.", "modules": ["module-02", "module-03"], "question": "Чим поріг реєстрації платником ПДВ відрізняється від ліміту групи?", "options": [{"text": "Нічим: обидві величини рахують від доходу єдиного податку за календарний рік", "feedback": "Ні. Це різні величини й різні періоди, і саме тому їх не можна звіряти однією цифрою."}, {"text": "Поріг рахують за операціями постачання за останні 12 календарних місяців", "correct": true, "feedback": "Правильно. Це ковзне вікно: 1 січня лічильник не обнуляється."}, {"text": "Поріг стосується лише підприємців на загальній системі оподаткування", "feedback": "Ні. Норма про поріг загальна, а для єдинників 1–3 груп зроблено окреме виключення."}], "explanation": "Ліміт групи рахують від доходу за календарний рік, а поріг обовʼязкової реєстрації платником ПДВ — від обсягу операцій з постачання за останні 12 календарних місяців. Платники єдиного податку першої–третьої груп прямо виведені з-під обовʼязкової реєстрації, але при переході на загальну систему обовʼязок оживає.", "source_reference": ["SRC-010", "SRC-035"], "hint": "Порівняйте дві речі: що саме рахують і за який період це роблять."}, {"id": "l01-q12", "title": "Оренда великого приміщення", "competency": "cross_property_and_eligibility", "scenario": "Підприємець здає в оренду нежитлове приміщення загальною площею 1200 м² в іншому місті.", "modules": ["module-01", "module-03"], "question": "Які два наслідки це має для нього?", "options": [{"text": "Виникає неосновне місце обліку, а право на спрощену систему втрачається", "correct": true, "feedback": "Правильно. Обмеження площі рахують за загальною площею, а не за одним обʼєктом."}, {"text": "Виникає неосновне місце обліку, але на вибір системи оподаткування це не впливає", "feedback": "Ні. Обмеження за площею нежитлових приміщень є в переліку заборон для спрощеної системи."}, {"text": "Нічого не змінюється, доки приміщення не почне приносити орендний дохід", "feedback": "Ні. Обидва наслідки повʼязані з самим фактом наявності обʼєкта, а не з надходженнями."}], "explanation": "Обʼєкт нерухомості на іншій території створює неосновне місце обліку. Одночасно надання в оренду нежитлових приміщень загальною площею понад 900 квадратних метрів входить до переліку обмежень, які не дають права перебувати на спрощеній системі.", "source_reference": ["SRC-007", "SRC-025"], "hint": "Розгляньте наслідки окремо: спершу для обліку в податковій, потім для права на спрощену систему."}]}, {"level": 2, "title": "Первинні документи", "planned_modules": 4}, {"level": 3, "title": "Банк, каса і розрахунки", "planned_modules": 3}, {"level": 4, "title": "Податки ФОП", "planned_modules": 7}, {"level": 5, "title": "Звітність і Електронний кабінет", "planned_modules": 5}, {"level": 6, "title": "Практична робота бухгалтера", "planned_modules": 4}, {"level": 7, "title": "Сучасні технології", "planned_modules": 8}, {"level": 8, "title": "Професійний бухгалтер ФОП", "planned_modules": 4}], "missions": [{"id": "own_fop", "title": "Веду власний ФОП", "note": "Хочу впевнено розуміти власні реєстраційні та податкові дані й не залежати від чужих пояснень."}, {"id": "accountant", "title": "Працюю або хочу працювати бухгалтером ФОП", "note": "Хочу вести облік клієнтів професійно: з джерелами, датами й чіткою межею відповідальності."}, {"id": "before_hiring", "title": "Розбираюся перед наймом бухгалтера", "note": "Хочу розуміти, що саме має робити бухгалтер і як перевірити його роботу."}], "review": {"intervals_days": [1, 3, 7, 21], "title": "Повторення"}, "published_modules": 6, "guide": "# Як проходити курс «Бухгалтер ФОП»\n\n## Як влаштована навігація\n\nЗастосунок має два рівні.\n\n1. **Сторінка курсу** — список рівнів і доступних модулів, ваш загальний прогрес і кількість завершених модулів. Звідси ви відкриваєте модуль.\n2. **Сторінка модуля** — навчальний маршрут: Огляд, Як навчатися, Урок, Практика, Кейс, Чекліст, Глосарій, Джерела, Підсумковий квіз. Кнопка «← Усі модулі» повертає до списку.\n\nСмуга прогресу вгорі показує прогрес того, що ви зараз бачите: на сторінці курсу — курсу, у модулі — модуля (а поруч, у сірій позначці, — відсоток курсу).\n\nСкидання прогресу роздільне: «Скинути прогрес модуля» стирає лише поточний модуль, «Скинути весь прогрес курсу» — усі модулі. Обидві дії питають підтвердження й незворотні.\n\nРівні, модулі яких ще готуються, показані з поміткою про кількість доступних матеріалів. Підсумкова атестація з'явиться після публікації всіх рівнів.\n\n## Мета навчання\n\nНа старті курс питає, навіщо він вам: ви ведете власний ФОП, працюєте (або хочете працювати) бухгалтером, чи розбираєтеся перед наймом фахівця. Від вибору залежить рядок «Навіщо це саме вам» на початку кожного модуля. Мету можна змінити будь-коли на сторінці курсу.\n\n## Повторення\n\nОдноразове проходження створює відчуття знання, але не саме знання. Тому курс має окрему чергу повторення: туди автоматично потрапляє те, у чому ви помилилися (мікроперевірки, питання квізу, реквізити картки профілю), і терміни, які ви позначили складними.\n\nПозиції повертаються через 1, 3, 7 і 21 день. Правильна відповідь відкладає позицію далі, помилка повертає на початок. Після четвертого успішного повторення позиція покидає чергу.\n\nНа сторінці курсу видно, скільки позицій чекає сьогодні. Там же — «Ваші слабкі місця»: перелік того, що потребує уваги, згрупований за модулями.\n\n## Головний принцип\n\nЦей курс потрібно не лише читати. Кожний модуль проходить за циклом:\n\n```text\nпрочитати → виконати дію → перевірити → прочитати пояснення → виправити → повторити\n```\n\nПрогрес нараховується за перевірені навчальні дії. Саме відкриття сторінки не означає, що матеріал засвоєно.\n\n## Значення кольорових блоків\n\n- **Жовтий «Запам’ятайте»** — ключова думка, яку потрібно відтворити своїми словами.\n- **Зелений «Правильний принцип»** — професійне правило роботи.\n- **Червоний «Ризик»** — типова помилка або небезпечний висновок.\n- **Синій «Пояснення»** — контекст, приклад або інструкція.\n\nКолір завжди дублюється назвою та символом. Не потрібно запам’ятовувати інформацію лише через колір.\n\n## 1. Урок\n\nПеред текстом уроку є **передперевірка** — кілька питань «а як ви думаєте?». Відповідайте до читання: спроба пригадати або вгадати робить наступне читання значно ефективнішим. Ці питання не впливають на прогрес, помилятися в них корисно.\n\nПозначки на кшталт `SRC-002` у тексті — це посилання на офіційне джерело твердження. Натисніть, щоб перейти до переліку джерел.\n\n1. Читайте матеріал послідовно.\n2. Звертайте увагу на кольорові блоки.\n3. Після теорії виконайте шість мікроперевірок.\n4. Після вибору відповіді прочитайте пояснення.\n5. Якщо відповідь неправильна, натисніть «Спробувати ще раз».\n\nУрок зараховується після шести правильних відповідей. Він дає **20%** прогресу модуля.\n\n## 2. Практика\n\nПрактика імітує роботу бухгалтера з пакетом документів синтетичного ФОП.\n\nДля кожного рядка:\n\n1. знайдіть інформацію в блоці «Синтетичний пакет»;\n2. якщо значення відоме — введіть його в поле;\n3. виберіть документ або реєстр, який підтверджує значення;\n4. якщо даних немає або потрібна додаткова перевірка — не вигадуйте значення, встановіть відповідну позначку;\n5. натисніть «Перевірити картку»;\n6. прочитайте підказку біля кожного помилкового поля;\n7. виправте помилки й перевірте картку повторно.\n\nПеревірка дивиться на зміст, а не на формулювання: регістр, пробіли, розділові знаки, відмінки й порядок слів не мають значення. «третя група», «3 група» і «третя група єдиного податку» — однаково правильно. Помилкою вважається лише те, що суперечить пакету: інша група, інший код, інше місто.\n\nПояснення біля поля називає всі причини одразу: значення, позначку про недостатність даних і вибране джерело.\n\nЯкщо не знаєте, з чого почати, натисніть **«Підказка»**:\n\n1. перший клік показує, у якому рядку пакета шукати відповідь;\n2. другий — якого вигляду має бути відповідь.\n\nСаме значення підказка не називає, тому **бал не зменшується**. У результаті видно, скільки підказок ви відкрили — це орієнтир для повторення, а не покарання.\n\nПриклад:\n\n```text\nПоле: Номер запису ЄДР\nУ пакеті номера немає\nДія: залишити значення порожнім → вибрати «Потрібна додаткова перевірка» → поставити позначку про недостатність даних\n```\n\nПрактика зараховується з результатом не менше **80%** і дає **30%** прогресу.\n\n## 3. Кейс\n\nКейс перевіряє не пам’ять, а здатність прийняти професійне рішення.\n\n1. Прочитайте ситуацію повністю.\n2. Позначте твердження, які є справжніми ризиками.\n3. Для кожного вибраного ризику вкажіть категорію.\n4. Визначте, хто повинен опрацювати питання: власник, бухгалтер або юрист.\n5. Розставте наступні дії у безпечному порядку: перетягніть картку мишею або скористайтеся стрілками. Початкова послідовність спеціально неправильна; картка стає зеленою одразу, щойно опиняється на своєму місці, а лічильник згори показує «На своїх місцях: N із 6».\n6. Напишіть власне пояснення щонайменше з 60 символів. Лічильник під полем показує, скільки вже набрано.\n7. Натисніть «Перевірити рішення».\n8. Виправте пропущені ризики, категорії, відповідальних або порядок дій.\n\n### Підказки й пояснення в кейсі\n\n- **Під кожним твердженням** є кнопка «Підказка»: вона ставить навідне питання («чи скасовує запис у ЄДР обов’язок відзвітувати?»), але не каже, ризик це чи ні.\n- **Перед списком дій** є «Підказка до послідовності»: вона пояснює принцип безпечного порядку, а не сам порядок.\n- **Під полем пояснення** — «Підказка: що має бути в поясненні»: перелік напрямів, які варто згадати.\n- **Після перевірки** під кожним твердженням з’являється пояснення, чому це ризик або не ризик, а біля поля пояснення показано, які напрями ви згадали, а які ні. Дії, що стоять неправильно, додатково позначаються «не на місці».\n- **Орієнтир для самоперевірки** — зразок повного пояснення — показується лише після того, як ви написали власний текст. Це один із можливих варіантів, а не єдина правильна відповідь.\n\nПідказки не зменшують бал. Порядок дій — це 27% балів кейсу, тому самого лише зеленого кольору для порогу 80% не досить: без правильно визначених ризиків, категорій, відповідальних і власного пояснення кейс не зараховується.\n\nКейс зараховується з результатом не менше **80%** і дає **25%** прогресу.\n\n## 4. Чекліст\n\nЧекліст — це фінальний контроль синтетичного профілю з практики. Це не тест із однією правильною галочкою.\n\nДля кожного пункту виберіть статус:\n\n- **Підтверджено** — інформація є й має належне джерело;\n- **Потрібні дані** — відомостей недостатньо; у примітці напишіть, що треба отримати;\n- **Не застосовується** — пункт справді не стосується ситуації; поясніть чому;\n- **Не перевірено** — робота з пунктом ще не виконана.\n\nПісля вибору статусу обов’язково заповніть поле «Джерело або наступна дія» — щонайменше 10 символів. Наприклад:\n\n```text\nСтатус: Потрібні дані\nПримітка: Отримати номер запису з актуального документа ЄДР\n```\n\nКритичний пункт позначено знаком `!`. Його не можна закрити статусом «Не застосовується».\n\nПід кожним пунктом одразу написано, чого бракує: вибрати статус, доповнити обґрунтування або не закривати критичний пункт цим статусом. Кнопка **«Підказка»** пояснює, що саме перевіряють у цьому пункті і де брати підтвердження — але не каже, який статус ставити: це ваше професійне рішення. Коли пункт опрацьовано, під ним з’являється рядок «Навіщо це в чеклісті» — саме він переноситься на реальну роботу.\n\nЧекліст завершено, коли всі пункти мають обґрунтований статус. Він дає **10%** прогресу.\n\n## 5. Пам'ятка\n\nОкрема сторінка зі стисненою суттю модуля: три статуси, таблиця реквізитів із джерелами, правило відсутніх даних, межа компетенції. Урок читають один раз, пам'ятку відкривають постійно — її можна роздрукувати кнопкою на сторінці.\n\n## 6. Глосарій\n\n1. Прочитайте термін.\n2. Спробуйте пояснити його без підказки.\n3. Натисніть «Показати пояснення».\n4. Якщо визначення було складним, натисніть «Позначити складним» і поверніться до нього пізніше.\n\nГлосарій допомагає повторювати матеріал, але не додає балів до обов’язкового прогресу. У навчальному маршруті він позначений як необов’язковий крок. Кожна картка має рядок «так не кажіть» — побутові формулювання, які професійно неточні. Позначений складним термін потрапляє в чергу повторення.\n\n## 7. Підсумковий квіз\n\n1. Прочитайте практичну ситуацію та питання.\n2. Якщо не знаєте, з чого почати, натисніть «Підказка»: вона ставить навідне питання й не називає варіанта. На бал це не впливає.\n3. Виберіть один варіант.\n4. Не поспішайте далі: прочитайте пояснення правильної відповіді та двох дистракторів.\n5. Якщо хочете обміркувати питання заново, натисніть «Спробувати це питання ще раз» — відповідь скинеться.\n6. Натисніть «Наступне питання».\n7. На екрані результату кожне помилкове питання показує вашу відповідь, правильну відповідь, глибше пояснення та джерела. Кнопка «Переглянути питання N» повертає до нього.\n\nКвіз зараховується з результатом не менше **80%** і дає **15%** прогресу.\n\n## Коли модуль завершено\n\nПрогрес має досягти **100%**:\n\n| Компонент | Вага |\n|---|---:|\n| Урок і мікроперевірки | 20% |\n| Практика | 30% |\n| Кейс | 25% |\n| Чекліст | 10% |\n| Підсумковий квіз | 15% |\n\nМодуль поділено на сесії — у навчальному маршруті вони позначені заголовками з орієнтовним часом. Це природні місця зупинитися й повернутися наступного дня.\n\nВаги можуть відрізнятися в різних модулях — актуальні значення завжди показані на сторінці «Огляд» модуля. Загальний прогрес курсу — це середнє за доступними модулями.\n\nВідповіді автоматично зберігаються лише у вашому браузері. Вони не надсилаються до ДПС, банку або іншого зовнішнього сервісу."}, "modules": [{"index": 1, "id": "module-01", "level": 1, "slug": "module_01_khto_takyi_fop", "meta": {"schema": "course-module/v1", "id": "module-01", "level": 1, "title": "Хто такий ФОП", "language": "uk", "version": "0.4.0", "status": "app_ready", "summary": "Навчіться відрізняти реєстраційний, податковий і банківський статуси та складіть перевірену картку профілю ФОП.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "needs_recheck", "last_verified": "2026-08-15", "next_review": "2026-11-12", "depends_on": [], "estimated_minutes": 55, "source_ids": ["SRC-001", "SRC-002", "SRC-003", "SRC-004", "SRC-005", "SRC-006", "SRC-007", "SRC-008", "SRC-009"], "outcomes": ["Відрізнити фізичну особу, ФОП і юридичну особу", "Знайти та пояснити основні реквізити профілю ФОП", "Пояснити призначення ЄДР, РНОКПП, податкової адреси та КВЕД", "Визначити основне і можливе неосновне місце податкового обліку", "Пояснити наслідки майнової відповідальності та припинення ФОП"], "primary_source": {"id": "SRC-002", "note": "Закон № 755-IV про державну реєстрацію — прочитайте статті про відомості ЄДР і виписку самостійно: далі весь курс спирається на це розмежування."}, "sessions": [{"title": "Сесія 1 · Статуси й реєстри", "minutes": 20, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Картка профілю", "minutes": 20, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Рішення й перевірка", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: цей модуль дає точний перелік того, що про вас видно в державних реєстрах і чим це підтверджується.", "accountant": "Ви працюєте з клієнтами: це основа приймання нового ФОП — картка профілю, джерела кожного реквізиту й межа вашої відповідальності.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зможете перевірити, чи коректно вам склали профіль ФОП і які документи мають бути."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Хто такий ФОП\n\n## Мета\n\nНавчитися бачити у ФОП не «маленьку компанію», а фізичну особу, яка після державної реєстрації отримала право системно здійснювати підприємницьку діяльність. Це допоможе правильно читати реєстраційні й податкові дані та не плутати різні статуси.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. своїми словами пояснити різницю між фізичною особою, ФОП і юридичною особою;\n2. скласти картку профілю ФОП за офіційними документами;\n3. пояснити призначення ЄДР, РНОКПП, податкової адреси та КВЕД;\n4. визначити основне місце податкового обліку та розпізнати ситуацію, коли може виникнути неосновне;\n5. пояснити, яким майном відповідає ФОП і що залишається після припинення діяльності.\n\n## Передумови\n\nСпеціальні бухгалтерські або юридичні знання не потрібні.\n\n## Основні терміни\n\n- **Фізична особа** — людина як учасник цивільних відносин.\n- **ФОП** — фізична особа, яка пройшла державну реєстрацію підприємцем.\n- **Юридична особа** — окремо створена й зареєстрована організація. ФОП юридичною особою не є.\n- **ЄДР** — Єдиний державний реєстр юридичних осіб, фізичних осіб — підприємців та громадських формувань.\n- **РНОКПП** — реєстраційний номер облікової картки платника податків фізичної особи.\n- **Податкова адреса** — місце проживання фізичної особи, за яким її беруть на податковий облік.\n- **КВЕД** — код із Класифікації видів економічної діяльності.\n- **Основне місце обліку** — контролюючий орган за місцем проживання фізичної особи.\n- **Неосновне місце обліку** — контролюючий орган на іншій території, де через майно, об’єкт або діяльність виникають податкові обов’язки.\n\n## Теоретичний матеріал\n\n### 1. Фізична особа і ФОП — не дві різні особи\n\nЛюдина не створює нового суб’єкта на кшталт товариства, коли реєструється ФОП. Вона залишається тією самою фізичною особою, але отримує зареєстрований статус підприємця.\n\nЦивільний кодекс надає фізичній особі з повною цивільною дієздатністю право на підприємницьку діяльність, не заборонену законом, але реалізація цього права потребує державної реєстрації. [SRC-001] Тому договір із «ФОП Іваненко» юридично пов’язаний із самою фізичною особою Іваненко, а не з окремою компанією.\n\nПрактичний наслідок: у ФОП немає окремого коду ЄДРПОУ, як у юридичної особи. У документах ФОП зазвичай ідентифікується ПІБ та РНОКПП або дозволеними законом паспортними даними для особи, яка офіційно відмовилася від РНОКПП.\n\n> [!REMEMBER]\n> **ФОП — не окрема компанія.** Це та сама фізична особа, яка має зареєстрований підприємницький статус.\n\n### 2. Що робить державна реєстрація\n\nДержавна реєстрація створює офіційний запис про підприємницький статус фізичної особи в ЄДР. Саме запис у ЄДР, а не відкриття банківського рахунку, підписання договору чи перше надходження коштів, підтверджує державну реєстрацію ФОП. [SRC-002]\n\nЗа результатом реєстраційної дії формується виписка. Актуальні відомості також можна отримувати з ЄДР у передбачених законом формах. [SRC-002] Реєстрацію можна провести через державного реєстратора або доступну електронну державну послугу. Конкретний інтерфейс і строки електронної послуги необхідно перевіряти безпосередньо перед її використанням.\n\nВажливо розділяти три речі:\n\n1. державну реєстрацію ФОП у ЄДР;\n2. податковий облік;\n3. обрану систему оподаткування та спеціальні реєстрації, наприклад статус платника єдиного податку або ПДВ.\n\nЦі дані пов’язані, але не тотожні. Наявність запису ФОП у ЄДР сама по собі не доводить, що особа вже має потрібну групу єдиного податку.\n\n> [!PRINCIPLE]\n> **Одне поле — одне належне джерело.** ЄДР підтверджує реєстраційні відомості, а групу єдиного податку та ПДВ перевіряють окремими податковими джерелами.\n\n### 3. ЄДР і картка профілю ФОП\n\nДля первинного бухгалтерського контролю важливо зафіксувати щонайменше:\n\n- повне ПІБ;\n- РНОКПП або передбачену законом альтернативу;\n- дату й номер запису державної реєстрації;\n- стан реєстрації;\n- адресу, зазначену в реєстраційних даних;\n- основний та додаткові види діяльності;\n- податковий орган за основним місцем обліку;\n- систему оподаткування, групу й ставку — за окремим податковим підтвердженням;\n- статус платника ПДВ — за окремим реєстром;\n- банківські рахунки — за банківськими документами.\n\nНе можна заповнювати всю картку лише за одним витягом: ЄДР підтверджує реєстраційні відомості, але не замінює податкові реєстри та банківські документи.\n\n> [!RISK]\n> Не переносіть податковий статус із припущення або старого документа. Фіксуйте джерело і дату кожної перевірки.\n\n### 4. РНОКПП\n\nРНОКПП — це номер, за яким податкова служба обліковує фізичну особу. Після реєстрації підприємцем людина не отримує «другий податковий номер для ФОП». Її підприємницька діяльність пов’язується з тим самим РНОКПП. [SRC-009]\n\nВиняток стосується фізичних осіб, які через релігійні переконання офіційно відмовилися від РНОКПП і мають відповідну відмітку в паспорті. У навчальних прикладах цю ситуацію потрібно позначати окремо, а не вигадувати номер.\n\n> [!REMEMBER]\n> Після реєстрації ФОП людина не отримує «другий податковий номер для бізнесу».\n\n### 5. Податкова адреса\n\nДля фізичної особи податковою адресою є місце її проживання, за яким вона перебуває на обліку в контролюючому органі. Одночасно фізична особа може мати не більше однієї податкової адреси. [SRC-003] [SRC-006]\n\nПодаткова адреса — це не обов’язково адреса офісу, складу або місце, де фактично виконується кожна послуга. Зміну адресних даних не можна залишати лише «у банку» чи «в договорі»: потрібно перевірити, у яких державних реєстрах і формах вона має бути відображена.\n\n> [!INFO]\n> Податкова адреса, адреса офісу і місце розташування майна можуть бути різними. Кожне з них перевіряють у своєму контексті.\n\n### 6. КВЕДи\n\nКВЕД класифікує вид економічної діяльності. Під час реєстрації ФОП зазначає види діяльності, які планує здійснювати. Один вид визначається як основний, інші можуть бути додатковими. [SRC-002] [SRC-008]\n\nКВЕД виконує описову й облікову функцію, але не є універсальним дозволом. Наявність коду:\n\n- не скасовує вимогу ліцензії чи іншого спеціального дозволу;\n- не означає автоматичної сумісності діяльності з обраною системою оподаткування;\n- не замінює аналіз фактичного змісту операції;\n- не робить незаконну діяльність законною.\n\nПеред новим видом діяльності бухгалтер звіряє фактичну послугу або товар із зареєстрованими КВЕДами, податковими обмеженнями й ліцензійними вимогами.\n\n> [!RISK]\n> Наявність КВЕД не є автоматичним дозволом на ліцензовану діяльність і не гарантує сумісність із податковою групою.\n\n### 7. Основне і неосновне місце обліку\n\nОсновне місце обліку фізичної особи пов’язане з її місцем проживання. Неосновне місце може виникнути, якщо на території іншої адміністративно-територіальної одиниці розташовані майно, об’єкти оподаткування або об’єкти, через які здійснюється діяльність і виникають податкові обов’язки. [SRC-003] [SRC-007]\n\nПриклад: ФОП має податкову адресу в Полтаві, але володіє нежитловим приміщенням у Львові, за яким виникає місцевий податковий обов’язок. Полтава залишається основним місцем обліку, а у Львові може бути потрібний облік за неосновним місцем. Конкретний обов’язок потрібно перевіряти за видом майна й податку.\n\n> [!PRINCIPLE]\n> Майно на іншій території — це сигнал для перевірки можливого неосновного місця обліку, а не підстава автоматично змінювати податкову адресу.\n\n### 8. Майнова відповідальність\n\nФОП відповідає за підприємницькими зобов’язаннями всім своїм майном, крім майна, на яке закон забороняє звертати стягнення. [SRC-001] Це одна з головних відмінностей від побутового уявлення про «окремий бізнес-гаманець».\n\nДля особи у шлюбі Цивільний кодекс також передбачає відповідальність особистим майном і тією часткою у спільній сумісній власності подружжя, яка належала б їй при поділі. [SRC-001] У реальній борговій або сімейній ситуації потрібна консультація юриста: бухгалтер не визначає самостійно, на яке конкретне майно може бути звернене стягнення.\n\n### 9. Припинення і нова реєстрація\n\nПрипинення ФОП означає внесення до ЄДР запису про державну реєстрацію припинення підприємницької діяльності. [SRC-002] Після цього не можна продовжувати працювати від імені закритого ФОП.\n\nВодночас запис про припинення не анулює зобов’язання, які виникли під час діяльності. Можуть залишитися обов’язки подати звітність, сплатити податки, виконати договори, закрити рахунки або пройти податкові процедури. [SRC-003]\n\n«Відновити» закритий запис ФОП не можна. Якщо людина знову хоче працювати підприємцем, вона проходить нову державну реєстрацію. [SRC-002] [SRC-005] Перед новою реєстрацією потрібно перевірити наслідки попередньої діяльності та актуальні умови обраної системи оподаткування.\n\n> [!REMEMBER]\n> Запис про припинення в ЄДР зупиняє підприємницький статус на майбутнє, але не стирає попередні податкові, договірні чи майнові зобов’язання.\n\n## Покроковий процес\n\nЩоб перевірити базовий профіль ФОП:\n\n1. Отримати актуальні реєстраційні відомості з ЄДР.\n2. Звірити ПІБ, РНОКПП, дату запису, стан, адресу і КВЕДи.\n3. Окремо перевірити податковий статус у відповідному реєстрі або витягу ДПС.\n4. Визначити податкову адресу й основне місце обліку.\n5. Перевірити, чи є майно або об’єкти на інших територіях, які можуть створити неосновне місце обліку.\n6. Зафіксувати банківські рахунки за банківськими документами.\n7. Позначити відсутні або суперечливі дані, не домислюючи їх.\n8. Записати дату перевірки кожного змінного статусу.\n\n## Практичні приклади\n\n### Приклад 1. ФОП — не окрема компанія\n\nМарія зареєстрована підприємцем і надає дизайнерські послуги. У договорі зазначено «ФОП Марія Коваль» та її РНОКПП. Стороною договору є Марія як фізична особа-підприємець, а не нова юридична особа з окремим майном.\n\n### Приклад 2. ЄДР не підтверджує всю податкову картину\n\nУ ЄДР видно активний запис ФОП і КВЕДи. Але для твердження «ФОП є платником єдиного податку третьої групи без ПДВ» бухгалтер додатково перевіряє реєстр або витяг ДПС.\n\n### Приклад 3. Закриття не стирає минуле\n\nФОП припинив діяльність у ЄДР, але не подав останню декларацію і має несплачений податок. Припинення реєстрації не скасовує ці обов’язки.\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Вважати ФОП окремою юридичною особою | Борги й відповідальність пов’язані з фізичною особою | Розрізняти статус підприємця і створення юридичної особи |\n| Називати РНОКПП «кодом ЄДРПОУ ФОП» | Це різні ідентифікатори | Використовувати точну назву РНОКПП |\n| Визначати податкову групу лише за ЄДР | ЄДР не замінює податковий реєстр | Отримати податкове підтвердження |\n| Вважати КВЕД дозволом на будь-яку діяльність | Можуть діяти ліцензійні й податкові обмеження | Перевірити фактичну діяльність окремо |\n| Вважати закриття ФОП списанням боргів | Попередні зобов’язання зберігаються | Провести фінальне податкове й договірне закриття |\n| «Відновлювати» старий ФОП | Закритий запис не відновлюється | За потреби пройти нову реєстрацію |\n\n## Ризики й межі самостійних дій\n\n- Цей модуль не визначає, яку систему оподаткування обрати.\n- Наявність конкретного КВЕД і право працювати на певній податковій групі перевіряються окремо.\n- Майнові, сімейні, спадкові та боргові питання потребують юридичного аналізу.\n- Закриття ФОП не можна вважати завершеним бухгалтерськи лише за записом у ЄДР.\n- Інтерфейс і строки електронних державних послуг можуть змінюватися.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, якщо треба визначити систему оподаткування, перевірити реєстраційні й податкові статуси, сформувати остаточну звітність або закрити податкові розрахунки.\n\n**Юрист потрібен**, якщо є борги, спір із контрагентом, загроза стягнення майна, спільне майно подружжя, ліцензована діяльність або оскарження рішень державного органу.\n\n## Підсумок\n\nФОП — це фізична особа у зареєстрованому підприємницькому статусі, а не окрема юридична особа. ЄДР підтверджує державну реєстрацію та основні реєстраційні відомості; РНОКПП ідентифікує фізичну особу в податковому обліку; КВЕД описує види діяльності; податкові статуси перевіряються окремо. ФОП відповідає власним майном, а припинення реєстрації не припиняє попередніх зобов’язань.\n\n## Самоперевірка\n\n1. Чи створюється нова юридична особа після реєстрації ФОП?\n2. Яка подія підтверджує виникнення статусу ФОП?\n3. Чому витяг з ЄДР не підтверджує автоматично групу єдиного податку?\n4. Чим РНОКПП відрізняється від коду ЄДРПОУ?\n5. Що таке податкова адреса фізичної особи?\n6. Коли може виникнути неосновне місце обліку?\n7. Чи є КВЕД ліцензією?\n8. Чи зникають податкові борги після припинення ФОП?\n\n## Джерела\n\nПовна карта тверджень і посилань наведена в `references.md`. Основні джерела: Цивільний кодекс України, Закон № 755-IV, Податковий кодекс України, офіційні сторінки ДПС, Дія та КВЕД-2010 Держстату.\n\n## Дата перевірки актуальності\n\n- Законодавчі положення перевірено: **14.08.2026**.\n- Електронні послуги Дія перевірено: **14.08.2026**.\n- Наступна комплексна перевірка модуля: **12.11.2026**.\n- Людська фактологічна перевірка: **прийнято користувачем 14.08.2026**."}, {"id": "practice", "title": "Практика", "content": "# Практика: картка профілю ФОП\n\n## Мета\n\nНавчитися збирати базові дані ФОП із правильних джерел і не змішувати реєстраційний, податковий та банківський статуси.\n\n## Навчальна ситуація\n\nВикористовуйте лише наведені синтетичні дані. Не вводьте реальний РНОКПП, адресу, рахунок або персональні документи.\n\nФізична особа **Олена Прикладенко** надала:\n\n- виписку з ЄДР: активний ФОП, запис від 05.08.2026;\n- основний КВЕД 74.10 «Спеціалізована діяльність із дизайну»;\n- додатковий КВЕД 62.01 «Комп’ютерне програмування»;\n- податкову адресу: м. Полтава;\n- витяг ДПС: третя група єдиного податку, без ПДВ;\n- довідку банку з підприємницьким IBAN;\n- інформацію про нежитлове приміщення у Львові.\n\n## Завдання 1. Заповніть картку\n\n| Поле | Значення | Джерело підтвердження | Перевірено |\n|---|---|---|---|\n| ПІБ |  |  |  |\n| РНОКПП / законна альтернатива |  |  |  |\n| Стан державної реєстрації |  |  |  |\n| Дата і номер запису ЄДР |  |  |  |\n| Податкова адреса |  |  |  |\n| Основне місце обліку |  |  |  |\n| Можливе неосновне місце обліку |  |  |  |\n| Основний КВЕД |  |  |  |\n| Додаткові КВЕДи |  |  |  |\n| Система і група оподаткування |  |  |  |\n| Статус ПДВ |  |  |  |\n| Підприємницький IBAN |  |  |  |\n\n## Завдання 2. Знайдіть прогалини\n\nПозначте дані, яких недостатньо для остаточного висновку:\n\n- номер запису ЄДР;\n- РНОКПП або законна альтернатива;\n- точний контролюючий орган за основним місцем обліку;\n- податкові наслідки приміщення у Львові;\n- дата формування податкового витягу;\n- IBAN і валюта рахунку.\n\nПоясніть, чому ці дані не можна домислити.\n\n## Завдання 3. Розділіть джерела\n\nРозподіліть поля між:\n\n1. ЄДР;\n2. реєстрами або витягами ДПС;\n3. банківськими документами;\n4. документами на майно;\n5. інформацією, яку потрібно додатково перевірити.\n\n## Критерії виконання\n\n- кожне заповнене поле має назване джерело;\n- відсутні дані позначено як відсутні, а не вигадані;\n- групу єдиного податку не підтверджено лише випискою з ЄДР;\n- питання неосновного місця обліку позначено для окремої перевірки;\n- у відповіді немає реальних персональних даних."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Я закрив ФОП — отже, боргів більше немає?»\n\n## Ситуація\n\nАндрій, ФОП із податковою адресою в Києві, надавав консультаційні послуги. Він подав заяву про припинення через Дію та побачив у ЄДР запис про припинення. Після цього Андрій:\n\n- вирішив не подавати останню декларацію;\n- не перевірив стан розрахунків із бюджетом;\n- продовжив виконувати старий договір і прийняв оплату;\n- через місяць вирішив «відновити той самий ФОП»;\n- вважає, що особисте майно не пов’язане з підприємницькими боргами.\n\n## Завдання\n\n1. Знайдіть щонайменше п’ять ризиків або помилкових припущень.\n2. Відокремте реєстраційне припинення від податкового й договірного завершення.\n3. Поясніть, чи можна відновити закритий ФОП.\n4. Складіть безпечний перелік наступних дій без розрахунку конкретних податків.\n5. Позначте, які питання має перевірити бухгалтер, а які — юрист.\n\n## Орієнтир для самоперевірки\n\n- запис у ЄДР припиняє підприємницький статус на майбутнє, але не ліквідує попередні зобов’язання;\n- після припинення не слід продовжувати діяльність від імені закритого ФОП;\n- остаточні декларації, податки, банківські й договірні питання перевіряються окремо;\n- закритий ФОП не відновлюється — для нової діяльності потрібна нова реєстрація;\n- підприємницька відповідальність не ізольована від майна фізичної особи так, як уявляв Андрій.\n\nЦе навчальний кейс, а не індивідуальна податкова чи юридична консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст базової перевірки профілю ФОП\n\n## Реєстраційні дані\n\n- [ ] Отримано актуальні відомості або документ із ЄДР.\n- [ ] Звірено повне ПІБ.\n- [ ] Звірено РНОКПП або законну альтернативу.\n- [ ] Зафіксовано дату й номер запису державної реєстрації.\n- [ ] Перевірено поточний стан запису ФОП.\n- [ ] Звірено адресу та зареєстровані КВЕДи.\n\n## Податкові дані\n\n- [ ] Податкову адресу визначено за актуальними даними.\n- [ ] Визначено основне місце обліку.\n- [ ] Перевірено майно й об’єкти на інших територіях.\n- [ ] Систему, групу та ставку підтверджено податковим джерелом.\n- [ ] Статус ПДВ перевірено окремо.\n- [ ] Зафіксовано дату кожної перевірки.\n\n## Банківські й операційні дані\n\n- [ ] Підприємницькі рахунки підтверджено банківськими документами.\n- [ ] Фактичні операції відповідають заявленим КВЕДам.\n- [ ] Перевірено можливі ліцензії та спеціальні дозволи.\n\n## Якщо ФОП припинено\n\n- [ ] Перевірено дату запису про припинення.\n- [ ] Визначено остаточні звітні обов’язки.\n- [ ] Перевірено стан розрахунків із бюджетом.\n- [ ] Перевірено договори, дебіторів і кредиторів.\n- [ ] Перевірено підприємницькі рахунки та ліцензії.\n- [ ] Нову діяльність не ведуть від імені закритого ФОП.\n\n## Контроль якості\n\n- [ ] Жодне відсутнє поле не заповнено припущенням.\n- [ ] Не використано реальні персональні дані в навчальних матеріалах.\n- [ ] Складні податкові й юридичні питання передано профільному фахівцю."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 1\n\n| Термін | Просте пояснення |\n|---|---|\n| Фізична особа | Людина як учасник правових відносин. |\n| ФОП | Фізична особа, державну реєстрацію якої як підприємця внесено до ЄДР. |\n| Юридична особа | Окремо зареєстрована організація; ФОП юридичною особою не є. |\n| Державна реєстрація | Офіційне визнання державою юридичного факту через внесення запису до реєстру. |\n| ЄДР | Державний реєстр юридичних осіб, ФОП і громадських формувань. |\n| Виписка з ЄДР | Документ, сформований за результатом реєстраційної дії, з відомостями про зареєстровану особу та дію. |\n| Витяг з ЄДР | Документ із відомостями з ЄДР за визначеними параметрами запиту. |\n| РНОКПП | Номер облікової картки фізичної особи в Державному реєстрі фізичних осіб — платників податків. |\n| Податкова адреса | Місце проживання фізичної особи, за яким її беруть на податковий облік. |\n| КВЕД | Код, який класифікує вид економічної діяльності. |\n| Основний КВЕД | Вид діяльності, визначений основним у реєстраційних даних. Він не замінює аналіз фактичної діяльності. |\n| Основне місце обліку | Контролюючий орган за місцем проживання фізичної особи. |\n| Неосновне місце обліку | Облік на іншій території через майно, об’єкт або діяльність, що створює податкові обов’язки. |\n| Припинення ФОП | Внесення до ЄДР запису про припинення підприємницької діяльності фізичної особи. |\n| Майнова відповідальність | Ризик відповідати за підприємницькими зобов’язаннями майном фізичної особи в межах закону. |"}, {"id": "reference", "title": "Пам’ятка", "content": "# Пам'ятка: картка профілю ФОП\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-08-15**\n\n## Три статуси, які не можна змішувати\n\n| Статус | Що показує | Чим підтверджується |\n|---|---|---|\n| Реєстраційний | чи є в особи статус підприємця, КВЕДи, дата й номер запису | ЄДР: виписка або витяг |\n| Податковий | система, група, статус ПДВ, місце обліку | витяг або реєстр ДПС |\n| Банківський | наявність підприємницького рахунку, IBAN, валюта | документ банку |\n\nОдин документ не підтверджує всі три. Висновок «з ЄДР видно групу оподаткування» — типова помилка.\n\n## Реквізити картки й джерела\n\n| Реквізит | Джерело | Типова пастка |\n|---|---|---|\n| ПІБ | ЄДР | розбіжність із документом, що посвідчує особу |\n| РНОКПП або законна альтернатива | документ фізичної особи | вигадати номер «щоб було заповнено» |\n| Стан державної реєстрації | ЄДР | застаріла виписка |\n| Дата й номер запису | ЄДР | є дата, немає номера — це ще не підтверджено |\n| Основний і додаткові КВЕДи | ЄДР | КВЕД ≠ дозвіл на діяльність |\n| Податкова адреса | ДПС, ЄДР | плутати з адресою орендованого офісу |\n| Основне місце обліку | ДПС | назвати «своєю податковою» за звичкою |\n| Можливе неосновне місце обліку | документ на майно | вважати готовим висновком замість приводу до перевірки |\n| Система, група, ПДВ | витяг ДПС | брати з ЄДР або зі слів клієнта |\n| IBAN і валюта | документ банку | записати з пам'яті клієнта |\n\n## Правило відсутніх даних\n\nНемає підтвердження — пишемо «потрібні дані» і фіксуємо, що саме запросити. Правдоподібне припущення в картці профілю знецінює всю картку: її більше не можна показати як перевірену.\n\n## Що робити з датами\n\nЗмінні статуси старіють. Поряд із кожним податковим статусом фіксуйте дату, станом на яку його перевірено. Без дати неможливо довести, що інформація була чинною на момент рішення.\n\n## Межа компетенції\n\n| Питання | Хто веде |\n|---|---|\n| склад і повнота реквізитів, джерела, дати | бухгалтер |\n| конкретний ризик стягнення майна, спірні договори | юрист |\n| рішення про припинення чи нову реєстрацію | власник |\n\n## Припинення: що саме завершує запис у ЄДР\n\nЗавершує: реєстраційний статус підприємця на майбутнє.\nНе завершує: звітність за минулі періоди, розрахунки з бюджетом, договірні зобов'язання, банківські питання, майнову відповідальність.\nЗакритий запис не відновлюється — для нового старту потрібна нова державна реєстрація."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 1\n\nПеревірено: **2026-08-14**. Наступна перевірка електронних послуг: **2026-11-12**.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Фізична особа реалізує право на підприємницьку діяльність за умови державної реєстрації | SRC-001, ЦКУ, стаття 50 | Норма закону | Базове визначення статусу |\n| ФОП відповідає за підприємницькими зобов’язаннями своїм майном із законними винятками | SRC-001, ЦКУ, стаття 52 | Норма закону | Конкретне стягнення оцінює юрист |\n| Відомості про ФОП і реєстраційні дії містяться в ЄДР; за результатами дії формується виписка | SRC-002 | Норма закону | Не прирівнювати до податкового витягу |\n| Податкова адреса фізичної особи пов’язана з місцем проживання; одночасно вона одна | SRC-003, стаття 45; SRC-006 | Норма закону й офіційне пояснення | Адресні зміни перевіряти окремо |\n| Основне місце обліку пов’язане з місцем проживання, неосновне — з об’єктами на інших територіях | SRC-003, стаття 63; SRC-007 | Норма закону й офіційний текст ДПС | Фактичний обов’язок залежить від об’єкта й податку |\n| Припинення ФОП не припиняє зобов’язань, які виникли під час діяльності | SRC-003, пункт 65.10 | Норма закону | Критичне правило для закриття |\n| Реєстрацію і припинення можна провести через чинні електронні послуги Дія | SRC-004, SRC-005 | Офіційна інструкція сервісу | Інтерфейс і строки перевіряти кожні 90 днів |\n| Закритий ФОП не відновлюється; для нової діяльності потрібна нова реєстрація | SRC-005 | Офіційне роз’яснення сервісу | Не називати нову реєстрацію «відновленням» |\n| КВЕД є національною класифікацією видів економічної діяльності | SRC-008 | Офіційний класифікатор | КВЕД не замінює ліцензію чи податковий аналіз |\n| РНОКПП є номером обліку фізичної особи в Державному реєстрі платників податків | SRC-009 | Офіційне пояснення ДПС | Це не код ЄДРПОУ юридичної особи |\n\n## Межі перевірки\n\n- Модуль не встановлює конкретних ставок, строків подання звітності або процедури вибору податкової групи.\n- Практичні алгоритми Дії перевірено станом на дату вище, але до реальної дії користувач повинен повторно звірити чинну сторінку послуги.\n- Твердження про відсутність окремої юридичної особи є системним висновком із правового статусу «фізична особа — підприємець» у Цивільному кодексі та Законі № 755-IV."}], "quiz": [{"id": "m01-q01", "title": "Статус сторони договору", "competency": "fop_legal_status", "scenario": "Олена зареєструвала ФОП і укладає договір із клієнтом. Клієнт просить назвати окрему юридичну особу, яка нестиме відповідальність.", "question": "Яку відповідь має дати бухгалтер?", "options": [{"text": "Стороною договору є лише сама Олена: окремої особи не виникає", "correct": true, "feedback": "Правильно. Реєстрація ФОП надає підприємницький статус самій фізичній особі."}, {"text": "Стороною договору є юридична особа, створена автоматично при реєстрації", "feedback": "Ні. Реєстрація ФОП не створює окремої організації або юридичної особи."}, {"text": "Стороною договору є банк, який відкрив підприємницький рахунок", "feedback": "Ні. Банк обслуговує рахунок, але не замінює підприємця в договорі з клієнтом."}], "explanation": "ФОП — це підприємницький статус фізичної особи. Договірні права, обов’язки й ризики пов’язані з цією фізичною особою.", "source_reference": ["SRC-001"], "hint": "Запитайте себе, чи створює реєстрація ФОП нову особу — чи лише надає фізичній особі підприємницький статус."}, {"id": "m01-q02", "title": "Межі відомостей ЄДР", "competency": "separate_registration_and_tax_status", "scenario": "У ЄДР видно активний запис ФОП і два КВЕДи. Інших документів бухгалтер ще не отримав.", "question": "Який висновок є професійно обґрунтованим?", "options": [{"text": "Запис у ЄДР підтверджує і третю групу єдиного податку, і статус ПДВ", "feedback": "Ні. ЄДР не підтверджує податкову групу та статус ПДВ."}, {"text": "Реєстрацію і КВЕДи підтверджено; лише податкові статуси беруть у ДПС", "correct": true, "feedback": "Правильно. Це відділяє реєстраційні відомості від податкового статусу."}, {"text": "Податкові обов’язки виникають після відкриття банківського рахунку", "feedback": "Ні. Банківський рахунок не визначає сам факт державної реєстрації або всі податкові обов’язки."}], "explanation": "ЄДР і податкові реєстри відповідають на різні питання. Бухгалтер не переносить відомості з одного джерела на інший статус без підтвердження.", "source_reference": ["SRC-002", "SRC-003"], "hint": "Розділіть, які відомості веде ЄДР, а які — податкові реєстри. Одне джерело не підтверджує все одразу."}, {"id": "m01-q03", "title": "Невідомий РНОКПП", "competency": "handle_missing_data", "scenario": "У навчальному пакеті є ПІБ і виписка з ЄДР, але РНОКПП у наданих даних відсутній.", "question": "Як правильно заповнити картку профілю?", "options": [{"text": "Позначити РНОКПП відсутнім і запросити підтвердження", "correct": true, "feedback": "Правильно. Невідоме значення не можна домислювати; потрібно зафіксувати прогалину й джерело для перевірки."}, {"text": "Внести умовний номер, щоб картка профілю виглядала заповненою", "feedback": "Ні. Вигаданий ідентифікатор робить облікову картку недостовірною."}, {"text": "Використати як податковий номер IBAN із банківської довідки", "feedback": "Ні. IBAN є реквізитом банківського рахунку і не замінює РНОКПП."}], "explanation": "Одна з базових професійних навичок бухгалтера — відрізняти підтверджений факт від припущення та створювати контроль відсутніх даних.", "source_reference": ["SRC-009"], "hint": "Порівняйте два шляхи: записати правдоподібне значення чи зафіксувати відсутність даних. Що з цього можна показати клієнту як перевірене?"}, {"id": "m01-q04", "title": "Податкова адреса й офіс", "competency": "determine_tax_address", "scenario": "ФОП проживає і перебуває на обліку в Полтаві, але орендує офіс у Києві.", "question": "Яке твердження найбезпечніше?", "options": [{"text": "Податкова адреса автоматично змінюється на Київ у день оренди", "feedback": "Ні. Оренда офісу сама по собі не замінює зареєстровану податкову адресу фізичної особи."}, {"text": "Адресу орендованого офісу в картці профілю можна не враховувати", "feedback": "Ні. Об’єкт або діяльність на іншій території можуть потребувати окремої перевірки."}, {"text": "Полтава лишається адресою; наслідки офісу перевіряють окремо", "correct": true, "feedback": "Правильно. Це розділяє податкову адресу та можливі обов’язки за іншим об’єктом."}], "explanation": "Податкова адреса фізичної особи пов’язана з місцем проживання та основним обліком. Інший об’єкт може створити додаткові обов’язки, але не дає підстав автоматично змінити адресу.", "source_reference": ["SRC-003", "SRC-006", "SRC-007"], "hint": "Розділіть два різні поняття: податкова адреса фізичної особи і місце, де фактично ведеться діяльність."}, {"id": "m01-q05", "title": "КВЕД і дозвіл", "competency": "assess_kved_limits", "scenario": "ФОП додав КВЕД, назва якого відповідає запланованій діяльності. Діяльність може бути регульованою.", "question": "Що потрібно зробити до початку роботи?", "options": [{"text": "Почати роботу одразу: запис КВЕДу замінює галузевий дозвіл", "feedback": "Ні. КВЕД класифікує діяльність, але не є універсальним дозволом."}, {"text": "Перевірити зміст діяльності, обмеження та потрібні дозволи", "correct": true, "feedback": "Правильно. Перевірка має виходити з реальної операції, а не лише назви коду."}, {"text": "Перевірити лише те, чи проводить банк платежі з таким призначенням", "feedback": "Ні. Банківська технічна можливість не підтверджує законність або податкову сумісність діяльності."}], "explanation": "КВЕД є елементом реєстраційного опису. Ліцензійні, дозвільні та податкові вимоги аналізуються окремо.", "source_reference": ["SRC-008"], "hint": "Запис КВЕДу описує вид діяльності в реєстрі. Запитайте себе, чи достатньо самого запису, щоб почати роботу."}, {"id": "m01-q06", "title": "Майно в іншому місті", "competency": "identify_secondary_registration_risk", "scenario": "ФОП із податковою адресою в Полтаві володіє нежитловим приміщенням у Львові.", "question": "Як відобразити це в первинній картці профілю?", "options": [{"text": "Позначити можливе неосновне місце обліку й перевірити обов’язки", "correct": true, "feedback": "Правильно. Майно на іншій території є сигналом для перевірки, але не готовим висновком про всі податки."}, {"text": "Негайно змінити податкову адресу ФОП на місто розташування майна", "feedback": "Ні. Наявність майна не означає автоматичної зміни місця проживання й основного обліку."}, {"text": "Не вносити приміщення в картку: воно не пов’язане з РНОКПП власника", "feedback": "Ні. Майно може створити податкові обов’язки й потребує контролю незалежно від способу ідентифікації."}], "explanation": "Професійна картка має фіксувати не лише підтверджені статуси, а й об’єкти, які потребують подальшої податкової перевірки.", "source_reference": ["SRC-003", "SRC-007"], "hint": "Подумайте, що дає майно в іншому місті: готовий висновок про облік — чи привід для окремої перевірки?"}, {"id": "m01-q07", "title": "Межі відповідальності", "competency": "understand_property_liability", "scenario": "ФОП вважає, що підприємницький борг можна стягувати лише з грошей на його бізнес-рахунку.", "question": "Яка реакція бухгалтера правильна?", "options": [{"text": "Підтвердити, що підприємницький рахунок повністю відокремлює майно", "feedback": "Ні. Окремий рахунок не створює такого самого майнового відокремлення, як окрема юридична особа."}, {"text": "Самостійно назвати майно, яке виконавець стягне в першу чергу", "feedback": "Ні. Бухгалтер пояснює загальний ризик, але конкретне стягнення потребує юридичного аналізу."}, {"text": "Пояснити принцип відповідальності майном і залучити юриста", "correct": true, "feedback": "Правильно. Це і точне пояснення меж, і правильна професійна передача складного питання."}], "explanation": "ФОП відповідає своїм майном із установленими законом винятками. Бухгалтер не повинен перетворювати загальне правило на індивідуальний прогноз стягнення.", "source_reference": ["SRC-001"], "hint": "Межа проходить між загальним принципом, який пояснює бухгалтер, і оцінкою конкретного ризику стягнення."}, {"id": "m01-q08", "title": "Реєстраційне припинення", "competency": "separate_closing_obligations", "scenario": "У ЄДР уже є запис про припинення ФОП, але останню декларацію не перевірено, а старий договір ще виконується.", "question": "Який план дій найкращий?", "options": [{"text": "Вважати всі питання закритими з дати реєстраційного запису в ЄДР", "feedback": "Ні. Запис про припинення не анулює попередні податкові та договірні зобов’язання."}, {"text": "Зупинити нову діяльність і окремо перевірити звітність і договори", "correct": true, "feedback": "Правильно. Реєстраційне, податкове, договірне й банківське завершення треба контролювати окремо."}, {"text": "Приймати оплату далі, доки банк сам не закриє підприємницький рахунок", "feedback": "Ні. Стан банківського рахунку не продовжує підприємницький статус після припинення."}], "explanation": "Закриття ФОП — це не одна кнопка, а контроль кількох пов’язаних процесів із різними джерелами підтвердження.", "source_reference": ["SRC-003", "SRC-005"], "hint": "Запис у ЄДР змінює реєстраційний стан. Перевірте, чи закриває він зобов’язання, що виникли раніше."}, {"id": "m01-q09", "title": "Повторний старт", "competency": "plan_new_registration", "scenario": "Через пів року після припинення людина знову хоче системно надавати послуги як підприємець.", "question": "Що має передувати новій роботі?", "options": [{"text": "Відновлення попереднього закритого запису ФОП у тому самому реєстрі", "feedback": "Ні. Закритий запис ФОП не відновлюється для нової діяльності."}, {"text": "Повторне відкриття старого підприємницького рахунку в тому самому банку", "feedback": "Ні. Банківський рахунок не замінює державну реєстрацію підприємця."}, {"text": "Нова державна реєстрація та перевірка наслідків попередньої діяльності", "correct": true, "feedback": "Правильно. Для нового старту потрібна нова реєстрація, а старі зобов’язання слід контролювати окремо."}], "explanation": "Нова реєстрація створює новий актуальний запис, але не стирає історію та можливі невиконані обов’язки попереднього періоду.", "source_reference": ["SRC-003", "SRC-005"], "hint": "Порівняйте відновлення попереднього запису й нову державну реєстрацію: що з цього передбачено, а що ні."}, {"id": "m01-q10", "title": "Професійна картка профілю", "competency": "build_verified_profile", "scenario": "Бухгалтер отримав виписку з ЄДР, витяг ДПС і довідку банку. У документах різні дати формування.", "question": "Як побудувати надійну картку профілю?", "options": [{"text": "Перенести всі дані без дат: офіційні документи не втрачають чинності", "feedback": "Ні. Статуси можуть змінюватися; дата перевірки є частиною контрольного сліду."}, {"text": "Взяти лише найновіший документ і заповнити з нього всі поля картки", "feedback": "Ні. Різні документи підтверджують різні групи відомостей."}, {"text": "Заповнити кожне поле з джерела, зафіксувати дату й прогалини", "correct": true, "feedback": "Правильно. Так картка показує джерело, актуальність і межі кожного висновку."}], "explanation": "Надійний профіль не є копією одного документа. Це контрольована сукупність відомостей із різних джерел, датами перевірки та списком невирішених питань.", "source_reference": ["SRC-002", "SRC-003", "SRC-009"], "hint": "Надійна картка — це не заповнені поля, а поля з підтвердженням. Запитайте себе, що робить значення перевіреним."}], "activities": {"precheck": [{"id": "pre-entity", "question": "Як гадаєте: коли людина реєструє ФОП, у державних реєстрах з’являється нова окрема особа?", "options": [{"text": "Так, з’являєтьс
