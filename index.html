example": "Сторона договору, яка зараховує підприємцю кошти за операціями покупців.", "avoid": "«будь-який банк» — потрібна саме ліцензія на цю послугу"}, {"term": "Торговець", "definition": "Субʼєкт господарювання, який за договором з еквайром приймає платіжні інструменти до обслуговування.", "example": "ФОП, який приймає оплату карткою за ремонт техніки.", "avoid": "«лише магазин» — торговцем є і той, хто надає послуги"}, {"term": "Особистий платіжний інструмент", "definition": "Платіжний інструмент, емітований для власних потреб фізичної особи.", "example": "Звичайна картка, якою людина розраховується в магазині.", "avoid": "«зручний спосіб приймати оплати» — для підприємницьких операцій він не призначений"}, {"term": "Корпоративний (бізнесовий) платіжний інструмент", "definition": "Платіжний інструмент для потреб господарської, підприємницької або незалежної професійної діяльності.", "example": "Картка, прив'язана до підприємницького рахунку, для оплати запчастин.", "avoid": "«можна платити нею зарплату» — це прямо заборонено нормою"}, {"term": "Внутрішній переказ", "definition": "Рух коштів між власними рахунками однієї особи; нових коштів не створює.", "example": "Переказ із основного підприємницького рахунку на накопичувальний.", "avoid": "«зменшує дохід» — база оподаткування від цього не змінюється"}, {"term": "Помилкова платіжна операція", "definition": "Операція, унаслідок якої кошти зараховано неналежному отримувачу.", "example": "Надходження від особи, яка нічого не замовляла.", "avoid": "«несподіваний дохід» — такі кошти підлягають поверненню"}, {"term": "Внесення власних коштів", "definition": "Поповнення підприємницького рахунку самим підприємцем із власних грошей.", "example": "Поповнення рахунку перед оплатою постачальнику.", "avoid": "«точно не дохід» — прямої норми немає, питання узгоджують із бухгалтером"}]}}, {"index": 9, "id": "module-09", "level": 3, "slug": "module_09_klasyfikatsiia_operatsii", "meta": {"schema": "course-module/v1", "id": "module-09", "level": 3, "title": "Класифікація операцій", "language": "uk", "version": "0.1.0", "status": "app_ready", "summary": "Навчіться класифікувати кожен рядок виписки за десятьма типами: що є доходом, що чужими коштами, що транзитом, і які рядки не можна класифікувати без уточнення.", "quiz_threshold": 80, "progress_weights": {"lesson": 20, "practice": 30, "case": 25, "checklist": 10, "quiz": 15}, "human_review": "pending", "last_verified": "2026-09-07", "next_review": "2026-11-01", "depends_on": ["module-08"], "estimated_minutes": 60, "source_ids": ["SRC-010", "SRC-014", "SRC-021", "SRC-022", "SRC-023", "SRC-025", "SRC-030", "SRC-051", "SRC-077", "SRC-078"], "outcomes": ["Класифікувати рядок виписки за десятьма типами операцій", "Назвати надходження, які до доходу не включаються, і підставу для кожного", "Пояснити, чому за посередницькими договорами доходом є лише винагорода", "Відрізнити позику від поворотної фінансової допомоги за наслідками", "Визначити, які рядки виписки потребують уточнення в клієнта"], "primary_source": {"id": "SRC-010", "note": "Пункт 292.11 Податкового кодексу — прочитайте перелік сум, які не включаються до доходу, самостійно. Він коротший, ніж здається, і в ньому немає пункту, який більшість упевнено там шукає."}, "sessions": [{"title": "Сесія 1 · Десять типів операції", "minutes": 25, "pages": ["overview", "guide", "lesson"]}, {"title": "Сесія 2 · Класифікація виписки", "minutes": 20, "pages": ["practice", "checklist"]}, {"title": "Сесія 3 · Транзит, позика, спірне", "minutes": 15, "pages": ["case", "glossary", "reference", "sources", "quiz"]}], "mission_notes": {"own_fop": "Ви ведете власний ФОП: після модуля ви перестанете вважати доходом усе, що прийшло на рахунок, і знатимете, які рядки треба уточнити, поки це ще легко.", "accountant": "Ви працюєте з клієнтами: класифікація виписки — щомісячна робота бухгалтера ФОП, і цей модуль дає її як процедуру з десятьма типами й списком запитів.", "before_hiring": "Ви розбираєтеся перед наймом бухгалтера: після модуля ви зрозумієте, чому бухгалтер щомісяця питає, за що прийшли конкретні гроші."}}, "sections": [{"id": "lesson", "title": "Урок", "content": "# Класифікація операцій\n\n## Мета\n\nНавчитися дивитися на банківську виписку й для кожного рядка казати, що це: дохід, чужі кошти, власні гроші, транзит чи щось, чого без уточнення визначити неможливо.\n\n## Результати навчання\n\nПісля модуля учень може:\n\n1. класифікувати рядок виписки за десятьма типами операцій;\n2. назвати надходження, які до доходу не включаються, і підставу для кожного;\n3. пояснити, чому за посередницькими договорами доходом є лише винагорода;\n4. відрізнити позику від поворотної фінансової допомоги за наслідками;\n5. визначити, які рядки виписки потребують уточнення в клієнта.\n\n## Передумови\n\nМодулі 2 і 8. Модуль 2 дав поняття доходу, модуль 8 — вміння читати рядок виписки. Тут ці дві речі зустрічаються.\n\n## Основні терміни\n\n- **Дохід платника єдиного податку** — надходження від діяльності, отримані в грошовій формі. [SRC-010]\n- **Поворотна фінансова допомога** — кошти в користування за договором без процентів з обовʼязком повернення. [SRC-014]\n- **Позика** — договір, за яким кошти передаються у власність з обовʼязком повернути таку ж суму. [SRC-078]\n- **Транзитні кошти** — надходження за посередницьким договором, з яких доходом є лише винагорода. [SRC-077]\n- **Помилкова платіжна операція** — операція, унаслідок якої кошти зараховано неналежному отримувачу. [SRC-022]\n\n## Теоретичний матеріал\n\n### 1. Чому «прийшло на рахунок» ще нічого не означає\n\nЦе головна ідея модуля. Виписка показує **рух коштів**, а облік вимагає **кваліфікації операції**. Між ними немає автоматичного звʼязку.\n\nДоходом платника єдиного податку є дохід, отриманий у грошовій формі, та в матеріальній або нематеріальній формі у визначених нормою випадках. [SRC-010] Кодекс окремо перелічує суми, які до складу доходу **не включаються**, і саме цей перелік перетворює читання виписки з механічної роботи на професійну. [SRC-010]\n\n> [!PRINCIPLE]\n> Питання до кожного рядка не «скільки прийшло», а «за що це і чиї це гроші». Сума однакова в обох випадках, а наслідки різні.\n\n### 2. Десять типів рядка виписки\n\nРобоча класифікація, якою користуються далі всі вправи модуля.\n\n| Тип | Що це | Дохід? |\n|---|---|---|\n| Підприємницький дохід | оплата за товар, роботу чи послугу | так [SRC-010] |\n| Власні кошти | поповнення рахунку самим підприємцем | **відкрите питання** [SRC-010] |\n| Позика | кошти за договором позики | ні, це не оплата за роботу [SRC-078] |\n| Поворотна фінансова допомога | безпроцентні кошти з обовʼязком повернення | ні, якщо повернуто за 12 місяців [SRC-010] [SRC-014] |\n| Помилковий платіж | кошти неналежному отримувачу | ні, підлягають поверненню [SRC-022] |\n| Повернення товару | повернення авансу або оплати покупцеві | не включається до доходу [SRC-010] |\n| Транзитні кошти | надходження за посередницьким договором | лише винагорода [SRC-077] |\n| Комісія | утримання банку або еквайра | не операція з клієнтом |\n| Податок | сплата податку або збору | не операція з клієнтом |\n| Особиста операція | рух за особистим рахунком | поза підприємницьким обліком [SRC-021] |\n\nПерші сім вимагають рішення, останні три — лише правильної позначки.\n\n### 3. Підприємницький дохід: дата й форма\n\nДві норми, які визначають усе інше.\n\n**Дата.** Для платника єдиного податку датою отримання доходу є дата надходження коштів у грошовій формі — готівковій або безготівковій. [SRC-010] Не дата рахунку, не дата акта, не дата обіцянки.\n\n**Форма.** Платники єдиного податку повинні здійснювати розрахунки **виключно в грошовій формі**. [SRC-025] Негрошовий розрахунок дає підвищену ставку 15% і підставу для переходу на загальну систему. [SRC-030]\n\nОкремо: дохід у валюті перераховується у гривні за офіційним курсом НБУ **на дату отримання** такого доходу. [SRC-077]\n\n### 4. Власні кошти: відкрите питання, яке не можна закривати самостійно\n\nВнесення власних коштів на підприємницький рахунок — операція, у якій платник і отримувач є однією особою. За змістом це не виручка: нової роботи не виконано, ніхто нічого не заплатив.\n\nАле **прямої норми ПКУ про такі внески немає**, і податкова кваліфікація залежить від обставин та призначення платежу. [SRC-010] Це відкрите питання ще з модуля 2, і модуль 9 його не закриває.\n\nЩо робити практично: позначати такі рядки окремим типом, писати в призначенні платежу зрозуміле формулювання й узгоджувати позицію з бухгалтером **до** закриття періоду, а не після.\n\n> [!RISK]\n> Найгірший варіант — мовчки не включити суму в дохід і не позначити її ніяк. Тоді через рік ніхто, включно з вами, не пояснить, звідки на рахунку взялися гроші.\n\n### 5. Позика і поворотна фінансова допомога — різні речі\n\nЇх постійно плутають, хоча наслідки різні.\n\n| | Позика | Поворотна фінансова допомога |\n|---|---|---|\n| Де визначено | Цивільний кодекс [SRC-078] | Податковий кодекс [SRC-014] |\n| Проценти | можуть бути; за замовчуванням — на рівні облікової ставки НБУ [SRC-078] | **безпроцентна за визначенням** [SRC-014] |\n| Момент укладення | з моменту передання коштів [SRC-078] | за договором |\n| Наслідок для доходу | сама сума позики оплатою за роботу не є | не включається, якщо повернуто протягом 12 календарних місяців [SRC-010] |\n\nТри деталі, які варто знати точно:\n\n- договір позики укладається **письмово**, якщо сума щонайменше в десять разів перевищує неоподатковуваний мінімум, а якщо позикодавцем є юридична особа — незалежно від суми; [SRC-078]\n- на підтвердження договору може бути надано **розписку позичальника** або інший документ про передання суми; [SRC-078]\n- ключова умова для поворотної фінансової допомоги — саме **строк повернення**: 12 календарних місяців з дня отримання. [SRC-010]\n\n> [!REMEMBER]\n> Якщо в договорі є проценти — це вже не поворотна фінансова допомога в розумінні Кодексу. [SRC-014] Назва документа значення не має, значення має його зміст.\n\n### 6. Транзитні кошти: доходом є лише винагорода\n\nОдна з найкорисніших норм для тих, хто працює посередником.\n\nУ разі надання послуг або виконання робіт за договорами **доручення, комісії, транспортного експедирування або за агентськими договорами** доходом є сума отриманої винагороди повіреного (агента). [SRC-077]\n\nПрактично це означає: якщо через ваш рахунок проходить 100 000 грн, з яких 92 000 належать замовникові, а 8 000 — ваша винагорода, доходом є 8 000 грн. Але це працює **тільки за наявності відповідного договору** — без нього вся сума є вашим доходом.\n\n> [!RISK]\n> Договір тут — не формальність, а єдина підстава не включати транзитну суму в дохід. Домовленість «на словах» цю норму не вмикає.\n\n### 7. Помилкові платежі й повернення\n\n**Помилковий платіж.** Кошти, зараховані неналежному отримувачу, доходом не є й підлягають поверненню. [SRC-022] Окремо діє норма про обовʼязок повернути безпідставно набуте майно. [SRC-023] У переліку сум, що не включаються до доходу, окремого пункту про помилкові зарахування **немає** — це матеріал модуля 2, і посилатися на нього тут не можна.\n\n**Повернення покупцеві.** Суми коштів (аванс, передоплата), що повертаються покупцю у звʼязку з поверненням товару, розірванням договору або за листом-заявою про повернення коштів, **до доходу не включаються**. [SRC-010]\n\nРізниця між ними принципова: у першому випадку гроші ніколи не були вашими, у другому — були доходом і перестали ним бути.\n\n### 8. Комісії, податки та інші рядки без контрагента\n\nТри типи рядків, які не є операціями з клієнтами й потребують лише правильної позначки:\n\n- **комісія банку або еквайра** — друга сторона є установою, що обслуговує рахунок;\n- **сплата податку чи збору** — рух на користь бюджету;\n- **особиста операція** — рух за особистим рахунком, який у підприємницькому обліку не відображається. [SRC-021]\n\nЖоден із них не зменшує доходу: на спрощеній системі витрати на розмір податку не впливають. [SRC-010]\n\n### 9. Що робити з рядком, який неможливо класифікувати\n\nЦе не виняток, а нормальна частина роботи. Ознаки такого рядка:\n\n- призначення платежу не дає звʼязку з документом («оплата», «за послуги»);\n- платник не збігається зі стороною договору;\n- сума не збігається з жодним виставленим рахунком;\n- надходження від особи, з якою немає жодних відносин.\n\nПравильна дія — **не класифікувати**, а виписати рядок у список запитів: дата, сума, платник, що саме треба уточнити. Класифікація «навмання» гірша за відкрите питання: вона виглядає як робота й приховує проблему.\n\n> [!PRINCIPLE]\n> У кожній місячній виписці нормально мати кілька рядків, які потребують уточнення. Ненормально — не мати їх ніколи: це означає, що хтось вирішує за клієнта.\n\n## Покроковий процес\n\nКласифікація виписки за місяць:\n\n1. Вивантажити виписку за період.\n2. Пройти рядки згори вниз, не пропускаючи списань.\n3. Для кожного рядка визначити тип із десяти.\n4. Для доходу — назвати документ, що підтверджує операцію.\n5. Для транзитних коштів — перевірити наявність посередницького договору.\n6. Для позики й поворотної фінансової допомоги — перевірити договір і строк повернення.\n7. Позначити внутрішні перекази, комісії та податки окремо.\n8. Виписати рядки, які неможливо класифікувати, у список запитів.\n9. Порахувати дохід періоду й звірити із записами обліку.\n10. Передати бухгалтеру спірні позиції разом із поясненням, чому вони спірні.\n\n## Практичні приклади\n\n### Приклад 1. Транзит без договору\n\nЧерез рахунок ФОП пройшло 100 000 грн для замовника, винагорода — 8 000 грн. Договору доручення чи комісії немає. Норма про винагороду не вмикається, і доходом є вся сума. [SRC-077]\n\n### Приклад 2. Допомога, яку не повернули\n\nПідприємець отримав поворотну фінансову допомогу й не повернув її протягом 12 календарних місяців. Умова, за якої сума не включалася до доходу, перестала виконуватися. [SRC-010]\n\n### Приклад 3. Аванс, який повернули\n\nКлієнт передумав, аванс повернено за його листом-заявою. Ця сума до доходу не включається. [SRC-010] Але сам аванс у місяці отримання доходом був: норма говорить про повернення, а не про те, що доходу не було.\n\n## Типові помилки\n\n| Помилка | Чому це неправильно | Правильна дія |\n|---|---|---|\n| Вважати доходом усе, що прийшло на рахунок | Кодекс перелічує суми, які до доходу не включаються [SRC-010] | класифікувати кожен рядок |\n| Не включати транзитні кошти без договору | норма про винагороду працює за наявності договору [SRC-077] | оформити договір або визнати дохід повністю |\n| Плутати позику з поворотною фінансовою допомогою | допомога безпроцентна за визначенням [SRC-014] | дивитися на зміст, а не на назву |\n| Забувати про 12-місячний строк допомоги | строк є ключовою умовою [SRC-010] | контролювати дату повернення |\n| Посилатися на перелік доходів у разі помилкового зарахування | такого пункту в переліку немає | застосовувати норми про помилкову операцію [SRC-022] |\n| Вважати, що комісія зменшує дохід | витрати на спрощеній системі податок не зменшують [SRC-010] | позначати комісію окремим типом |\n| Самостійно вирішувати долю власних коштів | прямої норми немає [SRC-010] | позначити й узгодити з бухгалтером |\n| Класифікувати незрозумілий рядок навмання | приховує проблему замість вирішення | виписати в запити з датою й сумою |\n| Не переглядати списання | там є комісії, податки й помилки | проходити виписку повністю |\n| Рахувати дохід у валюті за курсом на дату виписки | курс береться на дату отримання доходу [SRC-077] | брати офіційний курс НБУ на дату надходження |\n\n## Ризики й межі самостійних дій\n\n- **Внесення власних коштів** — відкрите питання з модуля 2; модуль 9 його не закриває й не дає власної відповіді.\n- **База доходу при утриманій комісії** та **дата доходу при еквайрингу** — відкриті питання з модуля 8; тут вони теж не вирішуються.\n- Модуль не рахує суму податку й не заповнює декларацію — це модулі 11 і 19.\n- Обовʼязок застосовувати РРО і готівкові ліміти — модуль 10.\n- Валютні операції, строки розрахунків і валютний нагляд — модуль 17.\n- Податкова кваліфікація конкретної операції в спірній ситуації — компетенція бухгалтера, а не результат таблиці з десяти типів.\n\n## Коли потрібен бухгалтер або юрист\n\n**Бухгалтер потрібен**, щоб вирішити долю власних коштів, оцінити наслідки неповерненої фінансової допомоги та підтвердити класифікацію спірних надходжень.\n\n**Юрист потрібен**, якщо особа, якій ви повертаєте помилково отримані кошти, оспорює суму, або якщо посередницький договір оформлено так, що його дія викликає сумнів.\n\n## Підсумок\n\nКласифікація виписки — щомісячна робота, яка визначає правильність усього подальшого обліку. Доходом є не все, що прийшло: Кодекс прямо перелічує суми, які до нього не включаються, а за посередницькими договорами доходом є лише винагорода. Позика й поворотна фінансова допомога — різні інструменти з різними наслідками. А рядок, який неможливо класифікувати з наявних даних, треба залишати відкритим, а не вгадувати.\n\n## Самоперевірка\n\n1. Назвіть десять типів рядка виписки.\n2. Що є датою отримання доходу для платника єдиного податку?\n3. Чому доходом за посередницьким договором є лише винагорода й за якої умови?\n4. Чим позика відрізняється від поворотної фінансової допомоги?\n5. Який строк є ключовим для поворотної фінансової допомоги?\n6. Чому не можна посилатися на перелік доходів у разі помилкового зарахування?\n7. Чим повернення авансу відрізняється від помилкового платежу?\n8. Як класифікувати комісію банку?\n9. За яким курсом перераховується дохід у валюті?\n10. Що робити з рядком, який неможливо класифікувати?\n\n## Джерела\n\nПерелік джерел і твердження, які вони підтверджують, — у `references.md`. Використані ідентифікатори: SRC-010, SRC-014, SRC-021, SRC-022, SRC-023, SRC-025, SRC-030, SRC-051, SRC-077, SRC-078.\n\n## Дата перевірки актуальності\n\nДата перевірки актуальності: **2026-09-07**\nНаступна перевірка: **2026-11-01**"}, {"id": "practice", "title": "Практика", "content": "# Практика: класифікація виписки\n\n## Мета\n\nПройти виписку за місяць і для кожного рядка назвати тип операції — це та сама робота, яку бухгалтер ФОП виконує щомісяця.\n\n## Навчальна ситуація\n\nДані синтетичні. Не використовуйте реальні відомості про себе чи клієнтів.\n\n**ФОП Демченко Ольга Василівна**, третя група без ПДВ, організація заходів. Виписка за жовтень 2026 року:\n\n| № | Дата | Опис | Сума |\n|---|---|---|---|\n| 1 | 02.10 | Надходження від ТОВ «Аметист», «оплата за договором № 12 за організацію заходу» | +48 000 |\n| 2 | 05.10 | Надходження від Демченко О. В., «поповнення власного рахунку» | +15 000 |\n| 3 | 09.10 | Надходження від ТОВ «Аметист», «кошти для оплати підряднику за агентським договором № 12/1» | +60 000 |\n| 4 | 10.10 | Списання, «оплата підряднику за агентським договором № 12/1» | −60 000 |\n| 5 | 14.10 | Надходження від Сидоренко П. П., «повернення помилково перерахованих коштів» | +2 300 |\n| 6 | 17.10 | Списання, «комісія за переказ» | −60 |\n| 7 | 21.10 | Списання, «сплата єдиного податку за 3 квартал» | −7 900 |\n| 8 | 24.10 | Надходження від ФОП Кравець, «поворотна фінансова допомога за договором від 24.10.2026» | +30 000 |\n| 9 | 28.10 | Списання, «повернення авансу ТОВ «Веста» за листом-заявою» | −12 000 |\n| 10 | 30.10 | Надходження від ТОВ «Аметист», «оплата» | +5 000 |\n\nДовідково: агентський договір № 12/1 підписано, винагорода агента — 6 000 грн і надійшла окремо у вересні; Сидоренко нічого не замовляв.\n\n## Завдання 1. Класифікуйте кожен рядок\n\nДля кожного рядка виберіть тип і вкажіть джерело. Використовуйте короткі назви:\n\n- **дохід** — підприємницький дохід;\n- **власні** — власні кошти підприємця;\n- **допомога** — поворотна фінансова допомога;\n- **чуже** — помилковий платіж, підлягає поверненню;\n- **транзит** — кошти за посередницьким договором;\n- **повернення** — повернення авансу покупцеві;\n- **комісія** — утримання банку;\n- **податок** — сплата податку;\n- **уточнити** — потрібне уточнення в клієнта.\n\n## Завдання 2. Дайте відповідь на три питання\n\n1. Яка сума з рядка 3 є доходом за агентським договором?\n2. Скільки календарних місяців має бути повернено поворотну фінансову допомогу, щоб вона не увійшла до доходу?\n3. За яким курсом перераховується дохід, отриманий в іноземній валюті?\n\n## Завдання 3. Знайдіть рядок, який не можна класифікувати\n\nОдин рядок неможливо віднести до типу без уточнення в клієнта. Позначте його як такий, що потребує окремої перевірки, і не вгадуйте тип.\n\n## Критерії виконання\n\n- кожен рядок має тип із зазначеним джерелом;\n- транзитні кошти відокремлено від доходу;\n- повернення авансу відокремлено від помилкового платежу;\n- рядок із неповним призначенням не класифіковано навмання."}, {"id": "case", "title": "Кейс", "content": "# Кейс: «Не все, що прийшло, — дохід»\n\n## Ситуація\n\nАртем — ФОП третьої групи, організовує навчальні заходи. За третій квартал через його рахунок пройшло 640 000 грн, і він вважає доходом усю цю суму.\n\nЩо зʼясувалося при розборі:\n\n- 380 000 грн — кошти замовників для оплати підрядникам за агентським договором, підписаним і чинним;\n- 40 000 грн — власні кошти, які Артем вніс на рахунок перед великою оплатою;\n- 25 000 грн — поворотна фінансова допомога від знайомого ФОП, отримана в лютому й досі не повернена;\n- 18 000 грн — надходження від людини, з якою жодних відносин не було;\n- 12 000 грн — аванс, повернений замовнику за його листом-заявою;\n- ще один замовник розрахувався послугами замість грошей на 9 000 грн;\n- у чотирьох платежах призначення платежу — «оплата за договором» без номера;\n- сплачений за квартал єдиний податок Артем відняв від доходу.\n\nДані синтетичні.\n\n## Завдання\n\n1. Знайдіть справжні ризики й відокремте їх від того, що лише виглядає проблемою.\n2. Для кожного ризику визначте категорію і того, хто має його закривати.\n3. Побудуйте безпечну послідовність дій.\n4. Поясніть, чому визнання всієї суми доходом — не «безпечний варіант», а помилка.\n\n## Орієнтир для самоперевірки\n\n- за агентським договором доходом є лише винагорода, і це працює саме тому, що договір підписано;\n- поворотна фінансова допомога не входить до доходу лише за умови повернення протягом 12 календарних місяців — у лютому строк почався;\n- надходження від особи, з якою немає відносин, підлягає поверненню й доходом не є;\n- повернений за листом-заявою аванс до доходу не включається;\n- розрахунок послугами замість грошей — негрошова форма: 15% на суму й підстава для переходу на загальну систему;\n- сплачений податок доходу не зменшує: на спрощеній системі витрати на базу не впливають;\n- внесення власних коштів — відкрите питання, яке узгоджують із бухгалтером, а не вирішують самостійно;\n- призначення платежу без номера договору не є порушенням саме по собі, але робить класифікацію неможливою.\n\nЦе навчальний кейс, а не індивідуальна податкова консультація."}, {"id": "checklist", "title": "Чекліст", "content": "# Чекліст класифікації виписки за місяць\n\n## Повнота проходу\n\n- [ ] Пройдено всі рядки виписки, включно зі списаннями.\n- [ ] Виписки за всіма підприємницькими рахунками зведено разом.\n- [ ] Кожному рядку присвоєно один із типів операції.\n- [ ] Жоден рядок не залишився без типу або з типом «навмання».\n\n## Дохід\n\n- [ ] Для кожного рядка доходу названо документ, що підтверджує операцію.\n- [ ] Дохід визнано за датою надходження коштів, а не за датою документа.\n- [ ] Дохід у валюті перераховано за курсом на дату отримання.\n- [ ] Перевірено, що всі розрахунки були в грошовій формі.\n\n## Що доходом не є\n\n- [ ] Транзитні кошти підтверджено посередницьким договором.\n- [ ] Повернені покупцям аванси відокремлено від помилкових платежів.\n- [ ] Поворотну фінансову допомогу взято на контроль за строком повернення.\n- [ ] Помилкові надходження взято на облік для повернення.\n- [ ] Внутрішні перекази між власними рахунками не потрапили в дохід.\n\n## Спірне й відкрите\n\n- [ ] Внесення власних коштів позначено окремо й не вирішено самостійно.\n- [ ] Рядки, які неможливо класифікувати, виписано в список запитів.\n- [ ] Для кожного запиту зафіксовано дату, суму, платника й питання.\n\n## Підсумок місяця\n\n- [ ] Дохід періоду порахований і звірений із записами обліку.\n- [ ] Сума за типами дорівнює обороту за випискою.\n- [ ] Спірні позиції передано бухгалтеру з поясненням, чому вони спірні."}, {"id": "glossary", "title": "Глосарій", "content": "# Глосарій модуля 9\n\n**Класифікація операції** — визначення типу рядка виписки: що це за гроші, чиї вони і чи є доходом.\n\n**Підприємницький дохід** — надходження від діяльності, отримане в грошовій формі; визнається за датою надходження коштів.\n\n**Власні кошти** — поповнення підприємницького рахунку самим підприємцем. Прямої норми Кодексу немає, тому операцію позначають окремо й узгоджують із бухгалтером.\n\n**Позика** — договір, за яким кошти передаються у власність з обовʼязком повернути таку ж суму; може бути процентною.\n\n**Поворотна фінансова допомога** — кошти в користування за договором **без процентів** з обовʼязком повернення; не входить до доходу за умови повернення протягом 12 календарних місяців.\n\n**Транзитні кошти** — надходження за договором доручення, комісії, транспортного експедирування або агентським; доходом є лише сума винагороди.\n\n**Винагорода повіреного (агента)** — та частина надходження за посередницьким договором, яка є доходом підприємця.\n\n**Помилковий платіж** — кошти, зараховані неналежному отримувачу; доходом не є й підлягають поверненню.\n\n**Повернення покупцеві** — аванс або передоплата, що повертається у звʼязку з поверненням товару, розірванням договору або за листом-заявою; до доходу не включається.\n\n**Комісія** — утримання банку або еквайра; операцією з клієнтом не є й доходу не зменшує.\n\n**Особиста операція** — рух за рахунком для власних потреб; у підприємницькому обліку не відображається.\n\n**Негрошова форма розрахунку** — взаємозалік, бартер, оплата послугами; для платника єдиного податку дає ставку 15% і підставу для переходу на загальну систему.\n\n**Дата отримання доходу** — дата надходження коштів у грошовій формі; не дата рахунку й не дата акта.\n\n**Курс для валютного доходу** — офіційний курс НБУ на дату отримання доходу.\n\n**Список запитів** — перелік рядків виписки, які неможливо класифікувати без уточнення: дата, сума, платник і питання."}, {"id": "reference", "title": "Пам’ятка", "content": "# Памʼятка: класифікація виписки\n\nСтисла довідка для щоденної роботи. Друкується на одну сторінку.\nДата актуальності: **2026-09-07**\n\n## Десять типів рядка\n\n| Тип | Дохід? |\n|---|---|\n| підприємницький дохід | так |\n| власні кошти | **питання до бухгалтера** |\n| позика | ні |\n| поворотна фінансова допомога | ні, якщо повернуто за 12 місяців |\n| помилковий платіж | ні, підлягає поверненню |\n| повернення покупцеві | не включається до доходу |\n| транзитні кошти | лише винагорода |\n| комісія | не операція з клієнтом |\n| податок | не операція з клієнтом |\n| особиста операція | поза підприємницьким обліком |\n\n## Дохід\n\n- **дата** — день надходження коштів; не дата рахунку й не дата акта;\n- **форма** — виключно грошова; негрошовий розрахунок = 15% + перехід на загальну;\n- **валюта** — офіційний курс НБУ **на дату отримання доходу**.\n\n## Транзит\n\nЗа договорами доручення, комісії, транспортного експедирування та агентськими доходом є **лише винагорода**.\n\n**Без договору — доходом є вся сума.** Усна домовленість норму не вмикає.\n\n## Позика ≠ фінансова допомога\n\n| | Позика | Поворотна фін. допомога |\n|---|---|---|\n| Джерело | Цивільний кодекс | Податковий кодекс |\n| Проценти | можуть бути | **немає за визначенням** |\n| Ключова умова | письмова форма за сумою | повернення за **12 місяців** |\n\nДивитися треба на зміст, а не на назву договору.\n\n## Повернення vs помилка\n\n| | Повернення покупцеві | Помилковий платіж |\n|---|---|---|\n| Гроші були доходом? | так, і перестали ним бути | ні, ніколи |\n| Підстава | повернення товару, розірвання, лист-заява | норми про помилкову операцію |\n| Де шукати | перелік винятків у складі доходу | **не в переліку винятків** |\n\n## Що не зменшує дохід\n\nКомісія банку · сплачений податок · будь-яка витрата.\nНа спрощеній системі витрати на базу не впливають.\n\n## Рядок, який не класифікується\n\nОзнаки: призначення без документа · платник ≠ сторона договору · сума не збігається з рахунком · відносин із платником немає.\n\n**Дія:** виписати в запити — дата, сума, платник, питання.\n**Не робити:** класифікувати навмання. Завищений дохід — теж помилка (ліміт групи).\n\n## Контроль наприкінці\n\nСума за типами = оборот за випискою."}, {"id": "sources", "title": "Джерела", "content": "# Карта джерел модуля 9\n\nПеревірено: **2026-09-07**. Кожна норма звірена з повним текстом на `zakon.rada.gov.ua` (сторінка «Текст для друку»). Наступна перевірка: **2026-11-01** — на цю дату призначено нову редакцію Податкового кодексу.\n\n| Твердження | Джерело | Тип | Примітка |\n|---|---|---|---|\n| Доходом платника єдиного податку є дохід у грошовій формі | SRC-010, пункт 292.1 | Норма закону | Матеріал модуля 2 |\n| Датою отримання доходу є дата надходження коштів | SRC-010, пункт 292.6 | Норма закону | Не дата рахунку й не дата акта |\n| Перелік сум, які до доходу не включаються | SRC-010, пункт 292.11 | Норма закону | Пункту про помилкові зарахування в переліку **немає** |\n| Поворотна фінансова допомога не включається за умови повернення протягом 12 місяців | SRC-010, пункт 292.11 | Норма закону | Відлік — з дня отримання коштів |\n| Аванси, що повертаються покупцю, до доходу не включаються | SRC-010, пункт 292.11 | Норма закону | Підстави: повернення товару, розірвання договору, лист-заява |\n| Визначення поворотної фінансової допомоги: без процентів, з обовʼязком повернення | SRC-014, підпункт 14.1.257 | Норма закону | Наявність процентів виводить операцію з визначення |\n| За посередницькими договорами доходом є сума винагороди | SRC-077, пункт 292.4 | Норма закону | Доручення, комісія, транспортне експедирування, агентські |\n| Дохід у валюті перераховується за курсом НБУ на дату отримання | SRC-077, пункт 292.5 | Норма закону | Не за курсом на дату документа чи кінець періоду |\n| Договір позики: момент укладення, письмова форма, розписка | SRC-078, статті 1046 і 1047 | Норма закону | Письмова форма — від десяти неоподатковуваних мінімумів або завжди для юрособи |\n| Проценти за позикою за замовчуванням — на рівні облікової ставки НБУ | SRC-078, стаття 1048 | Норма закону | Ознака, яка відрізняє позику від фінансової допомоги |\n| Розрахунки платника єдиного податку — виключно в грошовій формі | SRC-025, пункт 291.6 | Норма закону | Матеріал модуля 3 |\n| Негрошовий розрахунок: ставка 15% і підстава для переходу | SRC-030, пункт 293.4 | Норма закону | Разом із підпунктом 298.2.3 |\n| Помилкова платіжна операція й обовʼязок повернути кошти | SRC-022, стаття 88 | Норма закону | Разом із нормою про безпідставно набуте майно |\n| Обовʼязок повернути безпідставно набуте майно | SRC-023, стаття 1212 | Норма закону | Застосовується, коли помилку зробив сам платник |\n| Окремі рахунки для діяльності й для власних потреб | SRC-021 | Норма підзаконного акта | Підстава виділяти особисті операції окремим типом |\n| Призначення платежу — обовʼязковий реквізит платіжної інструкції | SRC-051, пункт 37 | Норма підзаконного акта | Матеріал модулів 5 і 8 |\n\n## Межі перевірки\n\n- **Внесення власних коштів на підприємницький рахунок** — відкрите питання ще з модуля 2: прямої норми Податкового кодексу немає, кваліфікація залежить від обставин і призначення платежу. Модуль 9 **не дає** власної відповіді й у Практиці класифікує такий рядок окремим типом, а не як дохід чи не-дохід.\n- **База доходу при утриманій комісії** та **дата визнання доходу при еквайрингу** — відкриті питання з модуля 8; тут вони теж не вирішуються.\n- **Перелік із десяти типів — робоча класифікація курсу, а не норма.** Кодекс не встановлює такої типології; вона побудована з норм про склад доходу й винятки з нього для практичної роботи з випискою.\n- **Податкова кваліфікація конкретної спірної операції** — компетенція бухгалтера. Модуль дає спосіб побачити спірне, а не спосіб вирішити його самостійно.\n- **Поза межами модуля:** розрахунок суми податку й декларація (модулі 11 і 19), обовʼязок застосовувати РРО (модуль 10), валютний нагляд і строки розрахунків за ЗЕД (модуль 17), облік доходів і його форма (модуль 2)."}], "quiz": [{"id": "m09-q01", "title": "Оборот і дохід", "competency": "class_income_scope", "scenario": "За квартал через рахунок пройшло 640 000 грн, і підприємець визнає доходом усю цю суму.", "question": "Чому це не «безпечний варіант»?", "options": [{"text": "Бо завищений дохід може вивести підприємця за межі ліміту групи", "correct": true, "feedback": "Правильно. Крім переплати податку це створює ризик втрати права на групу."}, {"text": "Бо податкова самостійно перерахує дохід і застосує штраф до підприємця", "feedback": "Ні. Перерахунок доходу на користь платника контролюючий орган не робить."}, {"text": "Бо суми, які не є доходом, треба показувати в окремому розділі декларації", "feedback": "Ні. Питання не в місці відображення, а в тому, що ці суми доходом не є."}], "explanation": "Кодекс прямо перелічує суми, які до доходу не включаються, а за посередницькими договорами доходом є лише винагорода. Обсяг доходу за календарний рік порівнюють із лімітом групи, тому штучно завищений дохід створює ризик, а не обережність.", "source_reference": ["SRC-010", "SRC-077", "SRC-025"], "hint": "Подумайте, з чим порівнюють річний обсяг доходу, крім розрахунку самої суми податку."}, {"id": "m09-q02", "title": "Дата доходу", "competency": "class_income_date", "scenario": "Аванс надійшов 31 жовтня, акт підписано 5 листопада, робота виконана в листопаді.", "question": "У якому місяці виникає дохід?", "options": [{"text": "У листопаді, оскільки саме тоді роботу було виконано й прийнято", "feedback": "Ні. Період виконання визначає зміст операції, а не дату виникнення доходу."}, {"text": "У жовтні, оскільки датою доходу є дата надходження коштів", "correct": true, "feedback": "Правильно. Дата акта й дата доходу можуть розійтися на будь-який строк."}, {"text": "У листопаді, оскільки до підписання акта операція вважається незавершеною", "feedback": "Ні. Завершеність операції на дату визнання доходу єдинника не впливає."}], "explanation": "Для платника єдиного податку датою отримання доходу є дата надходження коштів у грошовій формі — готівковій або безготівковій. Аванс, отриманий у жовтні, є доходом жовтня незалежно від того, коли буде виконано роботу.", "source_reference": ["SRC-010"], "hint": "Норма привʼязує дохід до руху коштів, а документ пояснює лише, за що вони прийшли."}, {"id": "m09-q03", "title": "Транзит за договором", "competency": "class_agency", "scenario": "Через рахунок агента пройшло 60 000 грн замовника, винагорода за підписаним договором — 6 000 грн.", "question": "Яка сума є доходом агента?", "options": [{"text": "60 000 грн: доходом є вся сума, що надійшла на рахунок агента", "feedback": "Ні. Норма прямо називає доходом лише суму отриманої винагороди."}, {"text": "6 000 грн: за агентським договором доходом є сума винагороди", "correct": true, "feedback": "Правильно. Без договору доходом стала б уся сума, що пройшла через рахунок."}, {"text": "54 000 грн: різниця між отриманою сумою й перерахованою підряднику", "feedback": "Ні. Такого способу обчислення доходу посередника норма не передбачає."}], "explanation": "У разі надання послуг або виконання робіт за договорами доручення, комісії, транспортного експедирування або за агентськими договорами доходом є сума отриманої винагороди повіреного (агента).", "source_reference": ["SRC-077"], "hint": "Норма називає одну конкретну складову надходження — знайдіть, яку саме."}, {"id": "m09-q04", "title": "Транзит без договору", "competency": "class_agency_condition", "scenario": "Кошти для підрядника пройшли через рахунок, але посередницького договору сторони не укладали.", "question": "Як це змінює класифікацію?", "options": [{"text": "Доходом є вся сума: норма про винагороду без договору не працює", "correct": true, "feedback": "Правильно. Договір тут не формальність, а єдина підстава для винятку."}, {"text": "Нічого не змінює: достатньо усної домовленості сторін про посередництво", "feedback": "Ні. Норма прив'язана саме до наявності відповідного виду договору."}, {"text": "Доходом є половина суми як компенсація фактичного посередництва", "feedback": "Ні. Правила поділу суми навпіл за відсутності договору норма не містить."}], "explanation": "Норма про винагороду застосовується до договорів доручення, комісії, транспортного експедирування та агентських. Без такого договору підстав виділяти з надходження лише винагороду немає, і доходом стає вся сума.", "source_reference": ["SRC-077", "SRC-010"], "hint": "Спитайте себе, до чого саме норма прив'язує можливість виділити винагороду."}, {"id": "m09-q05", "title": "Позика чи допомога", "competency": "class_loan_vs_help", "scenario": "У договорі з іншим підприємцем передбачено проценти за користування переданими коштами.", "question": "Чи є ця сума поворотною фінансовою допомогою?", "options": [{"text": "Так, якщо в назві договору вжито слова про фінансову допомогу", "feedback": "Ні. Назва документа значення не має: кваліфікацію визначає його зміст."}, {"text": "Так, якщо кошти буде повернено протягом дванадцяти календарних місяців", "feedback": "Ні. Строк важливий, але спершу сума має відповідати самому визначенню."}, {"text": "Ні: поворотна фінансова допомога є безпроцентною за визначенням", "correct": true, "feedback": "Правильно. Це вже позика, і до неї застосовуються норми Цивільного кодексу."}], "explanation": "Поворотна фінансова допомога — кошти, отримані в користування за договором без процентів з обовʼязком повернення. Наявність процентів виводить операцію з цього визначення: це позика.", "source_reference": ["SRC-014", "SRC-078"], "hint": "У визначенні є одна ознака, наявність якої одразу виключає цей вид допомоги."}, {"id": "m09-q06", "title": "Строк допомоги", "competency": "class_help_term", "scenario": "Безпроцентні кошти з обовʼязком повернення отримано в лютому й не повернено чотирнадцять місяців.", "question": "Що це означає для доходу?", "options": [{"text": "Умова невключення до доходу перестала виконуватися після спливу строку", "correct": true, "feedback": "Правильно. Строк відраховують від дня отримання коштів, а не від кінця року."}, {"text": "Нічого не змінюється: строк повернення на склад доходу підприємця не впливає", "feedback": "Ні. Саме строк повернення є ключовою умовою цієї норми."}, {"text": "Сума автоматично перетворюється на позику з нарахуванням процентів", "feedback": "Ні. Перекваліфікації в позику через сплив строку норма не передбачає."}], "explanation": "До доходу не включаються суми поворотної фінансової допомоги, отриманої та поверненої протягом 12 календарних місяців з дня отримання. Якщо кошти не повернено в цей строк, умова невключення перестає виконуватися.", "source_reference": ["SRC-010", "SRC-014"], "hint": "Зверніть увагу, від якої саме дати норма відраховує дванадцять місяців."}, {"id": "m09-q07", "title": "Гроші від незнайомця", "competency": "class_wrong_payment", "scenario": "Бухгалтер не включає помилкове надходження в дохід, посилаючись на перелік винятків Кодексу.", "question": "Чому це посилання неправильне?", "options": [{"text": "Бо перелік винятків не поширюється на платників третьої групи взагалі", "feedback": "Ні. Перелік стосується платників єдиного податку незалежно від групи."}, {"text": "Бо окремого пункту про помилкові зарахування в переліку немає", "correct": true, "feedback": "Правильно. Ситуація розбирається за нормами про помилкову платіжну операцію."}, {"text": "Бо такі кошти включаються до доходу за датою фактичного зарахування", "feedback": "Ні. Помилково зараховані кошти доходом не є: вони підлягають поверненню."}], "explanation": "У переліку сум, що не включаються до доходу платника єдиного податку, пункту про помилково зараховані кошти немає. Такі кошти доходом не є, але підставою для цього є норми про помилкову платіжну операцію та про безпідставно набуте майно.", "source_reference": ["SRC-010", "SRC-022", "SRC-023"], "hint": "Правильний висновок тут той самий, а от норма, на яку слід посилатися, — інша."}, {"id": "m09-q08", "title": "Повернений аванс", "competency": "class_refund", "scenario": "Замовник скасував замовлення, і аванс повернено йому за листом-заявою про повернення коштів.", "question": "Як це впливає на дохід?", "options": [{"text": "Дохід зменшується наполовину як компенсація понесених витрат", "feedback": "Ні. Правила часткового зменшення доходу на витрати норма не містить."}, {"text": "Сума лишається доходом, оскільки аванс було отримано в грошовій формі", "feedback": "Ні. Норма прямо називає такі повернення сумами, що до доходу не включаються."}, {"text": "Сума, що повертається за листом-заявою, до доходу не включається", "correct": true, "feedback": "Правильно. Підставами є також повернення товару й розірвання договору."}], "explanation": "До доходу не включаються суми коштів (аванс, передоплата), що повертаються покупцю у звʼязку з поверненням товару, розірванням договору або за листом-заявою про повернення коштів.", "source_reference": ["SRC-010"], "hint": "Норма перелічує три підстави повернення — перевірте, чи є серед них ця."}, {"id": "m09-q09", "title": "Оплата послугами", "competency": "class_settlement_form", "scenario": "Замовник пропонує закрити 9 000 грн боргу зустрічною послугою замість переказу коштів.", "question": "Як класифікувати таку операцію?", "options": [{"text": "Як звичайний дохід за датою підписання акта про залік зустрічних однорідних вимог", "feedback": "Ні. Проблема тут не в даті, а в самій формі розрахунку між сторонами."}, {"text": "Як негрошовий розрахунок: ставка 15% і підстава для переходу на загальну систему", "correct": true, "feedback": "Правильно. Платник єдиного податку розраховується виключно в грошовій формі."}, {"text": "Як операцію поза обліком, оскільки рух коштів за рахунком не відбувався", "feedback": "Ні. Відсутність руху коштів не робить операцію невидимою для обліку."}], "explanation": "Платники єдиного податку повинні здійснювати розрахунки виключно в грошовій формі — готівковій або безготівковій. Дохід, отриманий негрошовим способом, оподатковується за ставкою 15% і є підставою для переходу на загальну систему.", "source_reference": ["SRC-025", "SRC-030"], "hint": "Пригадайте з модуля 3, у якій формі платник єдиного податку має право отримувати оплату."}, {"id": "m09-q10", "title": "Рядок без пояснення", "competency": "class_unknown_row", "scenario": "Платіж має призначення «оплата», а з цим контрагентом укладено кілька різних договорів.", "question": "Яка правильна дія бухгалтера?", "options": [{"text": "Розподілити суму між договорами пропорційно до їхньої загальної вартості", "feedback": "Ні. Такий розподіл є вигадкою, яка не спирається на жоден документ."}, {"text": "Віднести суму до доходу як найобережніший варіант класифікації", "feedback": "Ні. Завищений дохід теж є помилкою й може вплинути на ліміт групи."}, {"text": "Виписати рядок у список запитів і уточнити призначення в клієнта", "correct": true, "feedback": "Правильно. Уточнити через тиждень легко, через рік — майже неможливо."}], "explanation": "Класифікація навмання виглядає як робота й приховує проблему. Правильна дія — зафіксувати дату, суму, платника й питання, а рішення прийняти після уточнення. У місячній виписці кілька таких рядків — нормальний результат.", "source_reference": ["SRC-051", "SRC-010"], "hint": "Подумайте, який варіант лишає можливість виправити ситуацію без вигадок."}], "activities": {"precheck": [{"id": "pre-agency", "question": "Через рахунок агента пройшло 60 000 грн замовника для оплати підряднику. Що з них є доходом агента?", "options": [{"text": "Уся сума, бо вона надійшла на його рахунок", "correct": false}, {"text": "Лише сума винагороди за договором", "correct": true}, {"text": "Половина суми як звичайна практика", "correct": false}], "note": "За договорами доручення, комісії, транспортного експедирування та агентськими доходом є сума отриманої винагороди. Розділ про транзитні кошти покаже, за якої умови ця норма працює."}, {"id": "pre-help", "question": "Поворотна фінансова допомога не включається до доходу — за якої умови?", "options": [{"text": "Якщо оформлено письмовий договір", "correct": false}, {"text": "Якщо її повернуто протягом 12 місяців", "correct": true}, {"text": "Якщо сума не перевищує ліміт групи", "correct": false}], "note": "Ключова умова — саме строк повернення: 12 календарних місяців з дня отримання. Розділ про позику й фінансову допомогу показує, чим ці два інструменти відрізняються."}, {"id": "pre-unknown", "question": "Надійшов платіж із призначенням «оплата» без номера договору. Що робити?", "options": [{"text": "Віднести до доходу — так безпечніше", "correct": false}, {"text": "Виписати в запити й уточнити в клієнта", "correct": true}, {"text": "Не враховувати до зʼясування обставин", "correct": false}], "note": "Класифікація навмання виглядає як робота й приховує проблему. Розділ про рядки, які неможливо класифікувати, показує, чому відкрите питання чесніше за вгадану відповідь."}], "lesson": [{"id": "lesson-income-date", "section": "Дохід", "scenario": "Аванс надійшов 31 жовтня, акт підписано 5 листопада, робота виконана в листопаді.", "question": "У якому місяці виникає дохід платника єдиного податку?", "options": [{"text": "У листопаді, оскільки саме тоді роботу було виконано для замовника", "feedback": "Ні. Період виконання роботи визначає зміст операції, а не дату доходу."}, {"text": "У жовтні, оскільки датою доходу є дата надходження коштів", "correct": true, "feedback": "Правильно. Дата акта й дата доходу можуть розійтися на будь-який строк."}, {"text": "У листопаді, оскільки дохід визнається за датою підписання акта", "feedback": "Ні. Це правило застосовується в бухо
